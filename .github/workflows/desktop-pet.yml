name: 桌面靈寵打包

on:
  push:
    paths:
      - 'desktop-pet/**'
      - '.github/workflows/desktop-pet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            name: DeskPet-Windows
            glob: desktop-pet/dist/*.exe
          - os: macos-latest
            script: dist:mac
            name: DeskPet-macOS
            glob: desktop-pet/dist/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-pet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-pet/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
