":"5-3 電氣與通訊設備","q":"有關智慧建築之能源管理系統功能，與下列何者無關？","opts":{"A":"高效率之動力設備設置有諧波自動偵測功能","B":"累計主要耗電設備運轉小時數","C":"空調、照明、動力、插座設備等設備具有運轉狀態之監視功能","D":"可依用電需量，即時進行用電設備卸載"},"ans":"A","note":"答案 A。依智慧建築評估手冊（2016 年版，105 年 7 月起實施，108 年考試適用）「節能管理指標」：基本規定 6.2「能源管理系統」6.2.3 功能及分析含「累計主要耗電設備運轉小時數」（B，p.23）；6.4「需量控制」6.4.1「能源管理系統可依用電需量，即時進行用電設備卸載」（D，p.24）；鼓勵項目 6.1「能源管理」6.1.1 空調、照明、動力、插座設備等具有運轉狀態之監視功能（C，p.38）。A 出自鼓勵項目 6.2「設備效率」6.2.3：高效率之動力設備（如泵或送排風扇等旋轉機械）並設置有諧波偵測、抑制或改善之管理系統或設備（p.40），屬設備效率與電力品質，不是能源管理系統之功能，故選 A。 【依據】智慧建築評估手冊（2016 年版）表 1.6 節能管理6.2.3、6.4.1（p.23～24）、表 1.7 節能管理 6.1.1、6.2.3（p.38、p.40）；課程教材：補充教材-04 資通智慧建築 p.11"},{"c":391,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"水平幹線配線方式","year":108,"no":34,"art":"5-3 電氣與通訊設備","q":"有關水平幹線配線方式之敘述，下列何者正確？","opts":{"A":"電線管配線方式主要於樓板內埋設 PVC 管配線，適用於開放式建築之彈性隔間","B":"樓板線槽（floor duct）主要埋設於雙層樓板或中空樓板，大約每 3 m 留設一個出線口","C":"扁平電纜通常設置於高架地板與樓板之間，電纜本身以鋁合金方管固定位置與高程","D":"槽型鋼承板線槽適用於鋼結構建築，主要搭配樓板的槽型鋼承板加設蓋板作為配線空間"},"ans":"D","note":"答案 D。槽型鋼承板線槽（cellular deck）利用鋼構樓板的槽型鋼承板凹槽，加設蓋板形成配線空間，適用鋼結構辦公建築，正確。A：電線管埋於樓板內，位置固定，日後變更困難，不適合彈性隔間；B：樓板線槽是埋設於混凝土樓板內的金屬線槽網格（教材圖 4-40），並非埋於雙層樓板或中空樓板（後者屬高架地板等配線方式）；\nC：扁平電纜直接舖設於樓板面、地毯（方塊地毯）下方，薄而不需高架地板，也不是以鋁合金方管固定。課程教材圖 4-40 樓板線槽配線（線槽格網埋於樓板）、圖 4-41 細胞線槽配線（鋼承板凹槽作配線空間）可對照。【查證限制】B 所述出線口間距（約 3 m）教材與本機法規均未載，無法判斷其數值正誤，故以「埋設位置」為 B 錯誤之依據。 【依據】課程教材：02 電氣設備系統 p.62–63"},{"c":392,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"接地工程","year":109,"no":31,"art":"5-3 電氣與通訊設備","q":"有關接地工程（grounding）之敘述，下列何者錯誤？","opts":{"A":"配線設計的接地是為了保障設備及線路使用上的安全","B":"設備接地指的是將高低壓用電設備非帶電金屬部分接地","C":"內線系統接地通常安裝於接戶開關及電度表之附近適當位置","D":"將設備與內線系統整合成共同接地會增加工程費用"},"ans":"D","note":"答案 D。用戶用電設備裝置規則（本機為 114 年版）第 90 條：系統接地包括「內線系統接地」（用戶用電線路屬於被接地導線之再行接地，第 1 款第 1 目）、低壓電源系統接地，及「設備與系統共同接地」（內線系統接地與設備接地共用一條接地電極導線或同一接地電極，第 1 款第 3 目）；「設備接地」為將用電設備或器具之非帶電金屬部分加以接地（第 2 款）。第 94 條第 1 款：內線系統接地之位置應在受電箱、集中表箱或用戶總開關箱之電源側；第 4 款：接地電極導線一端接接地電極，另一端引至受電箱、集中表箱或用戶總開關箱任擇一處之接地端子板或匯流排，再引出搭接導線施行內線系統與設備共同接地。共同接地可共用接地電極與接地電極導線，減少接地極數量與施工量，工程費用反而降低，並使設備與系統電位一致，故 (D)「會增加工程費用」錯誤。(A) 接地在抑制雷擊、突波等異常電壓並穩定對地電壓（第 90 條第 1 款），以保障設備及線路使用安全，正確。(B) 與設備接地之定義相符，正確。(C) 內線系統接地設於受電（接戶開關、電度表）附近之電源側，與第 94 條第 1 款意旨相符，正確。【查證限制】本機規則為 114 年版，考試當時（109 年）施行版本之條次與文字未取得；「共同接地較省費用」為工程實務判斷，規則無逐字明文。 【依據】用戶用電設備裝置規則第 90 條、第 94 條第 1 款及第 4 款（本機 114 年版）"},{"c":393,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"受變電設備電氣室之設置","year":109,"no":33,"art":"5-3 電氣與通訊設備","q":"建築物設置受變電設備的電氣室時，其設置規定之敘述何者錯誤？","opts":{"A":"變壓器具有發熱之特性，故必須考量換氣或空調設備之建置","B":"應設於建築物負載中心附近，以減少電壓降及減少電力損失","C":"考量台電與建築物戶間的責任區分與外線引入，電氣室須設置於地下最下層","D":"通道寬度與室內淨高應考量機器的搬運與日後的維修"},"ans":"C","note":"答案 C。建築技術規則建築設備編第 1-1 條第 1 項：「配電場所應設置於地面或地面以上樓層。如有困難必須設置於地下樓層時，僅能設於地下一層。」第 2 項：設於地下一層者，應裝設必要之防水或擋水設施（地面層開口均位於當地洪水位以上者除外）。本條自民國 91 年 7 月 30 日修正後未再修正，考試當時即適用。可見法規不但沒有要求電氣室「須設置於地下最下層」，反而限制最多只能設在地下一層，以免淹水造成停電與設備損壞，故\n(C) 錯誤。(A) 變壓器運轉發熱，須有通風（用戶用電設備裝置規則第 946 條對變電室通風口另有規定）或空調，正確。(B) 設於負載中心附近可縮短配電距離、減少電壓降與電力損失，正確。(D) 用戶用電設備裝置規則第 948 條第1 項：變電室應設於易檢點及維護之處所，設備配置應考慮平時運轉維護及設備更換所需之工作空間；通道寬度與淨高亦須考慮機器搬運，正確。課程教材圖 1.38「電氣室位置選擇之諸因素」列有負載中心、與受電位置關係、防災、維護管理性、擴充性、配合管道間等，表 4-8 並註明配電場設置於地面一樓或法定空地者，其面積得酌予縮減。 【依據】建築技術規則建築設備編第 1-1 條；用戶用電設備裝置規則第 946 條、第 948 條第 1 項（本機 114年版）；課程教材：02 電氣設備系統.pdf p.40（受變電設備設置考慮事項）、p.46（表 4-8）、p.47（圖 1.38 電氣室位置選擇之諸因素）"},{"c":394,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"避雷設備導線與安裝規定","year":110,"no":10,"art":"5-3 電氣與通訊設備","q":"依據建築技術規則中，有關避雷設備之導線與安裝規定，下列敘述何者錯誤？","opts":{"A":"建築物高度在 36 公尺以上時，應用 100 平方公厘以上之銅導線","B":"避雷系統之總接地電阻應在 10 歐姆以下","C":"導線每隔 3 公尺須用適當之固定器固定於建築物上","D":"導線轉彎時其彎曲半徑應在 20 公分以上"},"ans":"C","note":"答案 C（錯誤敘述）。建築設備編第 25 條第 9 款：導線「每隔二公尺」須用適當固定器固定於建築物上，非 3 公尺。A 正確：第 24 條，高度 36 m 以上應用 100 mm² 以上銅導線（30 m 以下 30 mm²、超過 30 m 未達 36 m為 60 mm²）；B 正確：第 25 條第 4 款，總接地電阻應在十歐姆以下；D 正確：第 25 條第 8 款，彎曲半徑應在 20公分以上。 【依據】建築技術規則建築設備編第 24 條；第 25 條第 4、8、9 款"},{"c":395,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"避雷設備設置高度與保護角","year":110,"no":35,"art":"5-3 電氣與通訊設備","q":"有關住宅類建築物增設避雷設備，建築物高度及保護角度之規定，下列何者正確？","opts":{"A":"高度 15 m 以上、保護角 30°以內","B":"高度 15 m 以上、保護角 60°以內","C":"高度 20 m 以上、保護角 30°以內","D":"高度 20 m 以上、保護角 60°以內"},"ans":"D","note":"答案 D。建築設備編第 20 條第 1 款：建築物高度在二十公尺以上者，應有符合本節規定之避雷設備（高度 3m 以上之危險物品倉庫另依第 2 款）；第 21 條第 1 款：受雷部採用富蘭克林避雷針者，除危險物品倉庫之保護角不得超過四十五度外，其他建築物之保護角不得超過六十度。故為高度 20 m 以上、保護角 60° 以內，與建築物用途（住宅）無關。課程教材（03 電氣設備計畫 p.27）同載：建築物高度 20 m 以上者應設避雷設備，突針方式一般建築物保護角不得大於 60°，與法規一致。 【依據】建築技術規則建築設備編第 20 條第 1 款；第 21 條第 1 款；\n課程教材：03 電氣設備計畫 p.27（避雷設備設置要點）"},{"c":396,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"住宅電氣設備容量估算","year":111,"no":31,"art":"5-3 電氣與通訊設備","q":"一個淨面積 100 m² 住宅單元的電氣設備容量（kW）最接近下列何者？","opts":{"A":"2","B":"6","C":"20","D":"60"},"ans":"B","note":"答案 B（6 kW）。電氣設備用電量 = 負荷密度（W/m²）× 樓地板面積。課程教材表 4-3 負荷密度：住宅照明20、一般動力 15、冷房動力 25，全負荷 60 W/m²。100 m² × 60 W/m² = 6000 W = 6 kW。驗算：(20 + 15 + 25) = 60✓；60 × 100 = 6000 ✓。2 kW（20 W/m²）僅約住宅照明負荷；20 kW（200 W/m²）超過表中最高之店鋪百貨（149W/m²）；60 kW 遠超住宅需要。 【依據】課程教材：02 電氣設備系統 p.41～42"},{"c":397,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"建築電氣系統基本概念","year":111,"no":32,"art":"5-3 電氣與通訊設備","q":"有關電氣系統或設備之敘述，下列何者最正確？","opts":{"A":"建築物內之配線採並聯方式","B":"住宅單元內的小容量電器多使用三相交流電","C":"我國交流電頻率為 110 Hz","D":"斷路器的功能主要為避免觸電"},"ans":"A","note":"答案 A。建築物內各負載皆以並聯方式接於電源，使各電器承受相同電壓、可獨立開關而互不影響。B：住宅小容量電器（照明、插座）使用單相交流（110 V／220 V），三相用於大型馬達、電梯、空調主機等；C：我國交流電頻率為 60 Hz（110 V 是電壓；課程教材：台灣地區交流電採用 60 Hz 之電源）；D：斷路器（無熔絲開關）功能為過載與短路保護，防止電線過熱火災；防止觸電需靠接地與漏電斷路器。 【依據】課程教材：02 電氣設備系統 p.16、44"},{"c":398,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"受變電室設置","year":111,"no":33,"art":"5-3 電氣與通訊設備","q":"有關設置受變電室，下列何者錯誤？","opts":{"A":"受變電室應避免設於建築物負載中心附近，減少線路電力損失和電壓降","B":"受變電室應設置於地面或地面以上之樓層，如有困難僅能設於地下一樓","C":"室內構造應具有防火、防水、防音的性能，並裝置適當的消防設備","D":"變壓器使用時會發熱，故須考慮換氣設備或空調設備"},"ans":"A","note":"答案 A（錯誤）。受變電室應「盡量設於負載中心附近」，以縮短低壓配電線路長度，減少線路損失與電壓降，並節省電纜費用；A 敘述相反。B：建築技術規則建築設備編第 1-1 條第 1 項明文規定「配電場所應設置於地面或地面以上樓層。如有困難必須設置於地下樓層時，僅能設於地下一層」，與 B 相同 ✓（與 109-33 所引同一條文）；同條第 2 項並要求設於地下一層者應裝設防水或擋水設施。C：須防火、防水、防音（變壓器低頻噪音）並裝置消防設備 ✓。D：變壓器損耗發熱，須通風或空調 ✓（用戶用電設備裝置規則第 946 條另定變電室通風口）。\n課程教材圖 1.38「電氣室位置選擇之諸因素」明列「負載中心」為選址因素，與 A 相反。 【依據】建築技術規則建築設備編第 1-1 條；用戶用電設備裝置規則第 946 條（本機 114 年版）；課程教材：02 電氣設備系統 p.40、p.47（圖 1.38 電氣室位置選擇之諸因素）"},{"c":399,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"受變電設備容量計算","year":111,"no":34,"art":"5-3 電氣與通訊設備","q":"下列那項參數與計算受變電設備容量無關？","opts":{"A":"最大需要電力","B":"功率因數","C":"受變電設備效率","D":"斷路器容量"},"ans":"D","note":"答案 D。受變電設備（變壓器）容量（kVA）= 最大需要電力（kW）÷（功率因數 × 設備效率）；先由各負載容量乘需要率（需用係數）求得最大需要電力。故 A、B、C 皆為計算參數。斷路器容量是依負載電流與保護協調另行選定，並非決定變壓器容量的參數。課程教材：受變電設備容量 =（最大需要電力）÷（受變電設備效率 ×功率因素）；建築最大需要電力 = Σ（負荷設備容量）×（需要率）。 【依據】課程教材：02 電氣設備系統 p.43～44"},{"c":400,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"閉路電視之起源","year":112,"no":23,"art":"5-3 電氣與通訊設備","q":"下列何種系統最早使用於工廠生產線上，作為遠距離監控的工具，後來廣泛應用於建築物的防災及防罪？","opts":{"A":"CATV","B":"CCTV","C":"CTV","D":"ITV"},"ans":"D","note":"答案 D。課程教材 04 資訊與通信設備 p.49「工業電視設備 ITV」：此設備系統最早使用在工廠生產線上，作為遠距離的監控工具，後來廣泛應用在建築物的防災、防犯上（如銀行、超市、商店），通常由攝像管、監看螢幕、錄影設備組成，與題幹相符，故選 D。教材並提醒工業電視與閉路電視名稱常被混淆，但用途有明顯不同。ACATV 為共同天線電視（Community Antenna Television），屬電視共同視聽設備，非監控用途；B CCTV 閉路電視，教材 p.24 列於電視共同視聽設備（共同天線 CATV、閉路電視 CCTV 及有線電視），不是題述最早用於工廠生產線之系統；C CTV 為電視之泛稱。教材 p.43 另載防犯警報設備由 ITV 監看設備、侵入警報設備、出入管理設備等組成。 【依據】課程教材：04 資訊與通信設備 p.24（電視共同視聽設備）、p.43（防犯警報設備）、p.49（工業電視設備 ITV）"},{"c":401,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"電力系統配電方式","year":112,"no":32,"art":"5-3 電氣與通訊設備","q":"有關電力系統的敘述，下列何者錯誤？","opts":{"A":"單相三線式會使用兩條中性線與一條電壓線","B":"一般住宅以單相三線式為主","C":"三相三線式主要是供應大型空調設備或動力機器使用","D":"高壓電流引進建築基地後，須用變壓器降為低壓電流再分派到幹線與配電盤"},"ans":"A","note":"答案 A（錯誤）。單相三線式（110/220 V）是使用「兩條電壓線（火線）與一條中性線」，兩條火線之間為220 V，任一火線與中性線之間為 110 V，故 A 把電壓線與中性線之條數說反。B 一般住宅以單相三線式供電為主；\nC 三相三線式（如 220 V 或 380 V）供大型空調、馬達等動力負載使用；D 高壓電引進基地後須經變壓器（受電設備）降為低壓，再經幹線送至配電盤，均正確。課程教材 02 電氣設備系統 p.45 表 4-5 列台電供電方式（表燈低壓110/220 V 單相三線式、220 V 三相三線式；高壓 3.3～22.8 kV），p.62 表 4-11 載單相三線 110/220 V、三相三線式220 V「主要作為動力用電源」。 【依據】課程教材：02 電氣設備系統 p.45（表 4-5 電力公司供電方式）、p.62（表 4-11 屋內配電方式的主要用途）"},{"c":402,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"智慧建築安全防災指標之項目","year":112,"no":40,"art":"5-3 電氣與通訊設備","q":"依據 2016 年版智慧建築評估手冊，安全防災指標不包括以下那一個項目？","opts":{"A":"防震系統","B":"防火系統","C":"防水系統","D":"防盜系統"},"ans":"A","note":"答案 A。依智慧建築評估手冊（2016 年版）表 1.5 基本規定評估項目表（p.13）及安全防災指標評估概要（p.76），安全防災之基本規定為 5.1 防火系統、5.2 防水系統、5.3 防盜系統、5.4 監視系統、5.5 門禁系統、5.6 停車管理、5.7 有害氣體防制、5.8 緊急求救系統八項；鼓勵項目亦以防火、防水、門禁、停車管理、緊急求救為例。\nB 防火、C 防水、D 防盜均在其中，防震系統不屬安全防災指標之評估項目，故選 A。課程教材 補充教材-04 資通智慧建築 p.10、p.11：105 年（2016 年）版分八項指標，安全防災之評估要項為建物防災、人身安全。 【依據】智慧建築評估手冊（2016 年版）表 1.5（p.13）、安全防災指標第一節（p.75～76）；課程教材：補充教材-04 資通智慧建築 p.10、p.11"},{"c":403,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"資訊系統配線方式","year":113,"no":27,"art":"5-3 電氣與通訊設備","q":"有關資訊系統配線方式，下列何者錯誤？","opts":{"A":"樓板線槽係指於樓板內埋設電纜配管，並在一定間隔設出線口，主要於電力、電話及通訊的配線","B":"架高地板及簡易架高地板的配線較具擴充的彈性","C":"細胞式線槽適用於採鋼匣式樓板的建築，配線方式較複雜困難、成本較高","D":"電線管須於配線處預先埋設電線管於樓板內，配線容量受到限制，且移設及增加均不容易"},"ans":"C","note":"答案 C（錯誤）。細胞式線槽（cellular floor）利用鋼承板（鋼匣式樓板）本身之溝槽作為配線管道，以出線盒在樓板上取出線路，配線容量大、出線位置彈性高、配線便利，故「配線方式較複雜困難」不正確（108-34 亦認定槽型鋼承板線槽適用鋼結構建築、以鋼承板加蓋板作配線空間）。A 樓板線槽：樓板內埋設線槽主體並以一定間隔設出線口，供電力、電話及通訊配線 ✓；B 架高地板擴充彈性最大 ✓；D 電線管預埋樓板，容量與擴充受限 ✓。\n課程教材 02 電氣設備系統 p.60 列常見配線工法（含樓版線槽、細胞線槽、扁平電纜），p.62 圖 4-40 樓板線槽配線、p.63 圖 4-41 細胞線槽配線。【查證限制】教材只有工法名稱與配線圖，未比較難易與成本，C 之駁斥依一般建築電氣教材。 【依據】課程教材：02 電氣設備系統 p.60（配線工法）、p.62（圖 4-40 樓板線槽配線）、p.63（圖4-41 細胞線槽配線）"},{"c":404,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"智慧建築安全防災指標","year":113,"no":40,"art":"5-3 電氣與通訊設備","q":"有關智慧建築安全防災指標中，防災中心內應設置系統中不包括那一項？","opts":{"A":"室內空氣品質監控系統","B":"監控主機","C":"火警廣播設備控制裝置","D":"消防專用通信設備"},"ans":"A","note":"答案 A。智慧建築評估手冊（2016 年版）表 1.6 基本規定「五、安全防災」5.1 防火系統 5.1.1（p.19～20）：防災中心或各監控主機與子系統操作、管理之集中處所內，應設置系統主機、監控主機、火警廣播設備控制裝置及消防專用通信設備，即 B、C、D，本題出自此條。室內空氣品質監控屬「健康舒適指標」之空氣環境面向，不在其列，故選 A。法規亦可佐證：建築技術規則建築設計施工編第 259 條第 1 項第 4 款，高層建築物之電氣電力、消防安全、排煙及通風、昇降、連絡通信及廣播、瓦斯緊急遮斷等設備之顯示裝置及控制應設於防災中心，未列室內空氣品質監控。註：2024 年版手冊（112 年 12 月出版）已大幅整併指標，未見同一文句，本題依 2016 年版文字命題。 【依據】智慧建築評估手冊（2016 年版）表 1.6 安全防災 5.1.1（p.19～20）；建築技術規則建築設計施工編第 259 條第 1 項第 4 款；課程教材：補充教材-04 資通智慧建築 p.10～11"},{"c":405,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"電力系統","year":114,"no":32,"art":"5-3 電氣與通訊設備","q":"有關電力系統的敘述，下列何者錯誤？","opts":{"A":"220 V 可使機器的電流損失較 110 V 少","B":"消耗電力大的電器較適合用 220 V","C":"通信線路屬於弱電系統","D":"消耗電力大的電器應盡量集中於同一個電流回路，以方便管理"},"ans":"D","note":"答案 D（錯誤）。消耗電力大的電器（冷氣、電熱水器、烘衣機、電磁爐等）應「分散」或設「專用回路」，若集中於同一分路，回路電流過大，易造成導線過熱、電壓降過大及無熔線斷路器跳脫，甚至引起電線走火。A 正確：同功率 P＝VI，電壓提高為 220 V 時電流約減半，線路損失 I²R 約降為四分之一。B 正確：大功率電器以 220 V 供電可降低電流與線徑需求。C 正確：課程教材將建築電器設備分為電力設備（強電：受變電、幹線、發電、照明等）與電子設備（弱電：電話、視訊、擴音、收音等），通信線路屬弱電。 【依據】課程教材：02 電氣設備系統 p.4；屋內配線基本原則（一般原理）"},{"c":406,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"探測器免設處所","year":103,"no":24,"art":"5-4 消防與防災設備","q":"下列何場所必須設置火災探測器？","opts":{"A":"外氣流通而無法有效探測火災之場所","B":"任何未處理或儲藏可燃性物品之空間","C":"洗手間、廁所、浴室等盥洗空間","D":"室內游泳池之水面或溜冰場之冰面上方"},"ans":"B","note":"答案 B。各類場所消防安全設備設置標準第 116 條列舉得免設探測器之處所：第 2 款外氣流通無法有效探測火災之場所（A）、第 3 款洗手間、廁所或浴室（C）、第 6 款室內游泳池之水面或溜冰場之冰面上方（D）。第 7款僅限「不燃性石材或金屬等加工場，未儲存或未處理可燃性物品處」得免設，並非「任何」未處理或儲藏可燃性物品之空間皆可免設，故 B 仍須設置探測器。（課程教材 16 消防設備 p.18、p.21 僅載探測器種類、有效探測範圍與裝置位置，未列免設處所，故以設置標準為據。） 【依據】各類場所消防安全設備設置標準第 116 條第 2、3、6、7 款；課程教材：16 消防設備 p.18、p.21"},{"c":407,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"瓦斯漏氣檢知器位置","year":103,"no":27,"art":"5-4 消防與防災設備","q":"某餐廳廚房使用液化石油氣，欲裝設瓦斯洩漏偵測器時，何者為最正確的安裝位置？\n（附圖：廚房立面示意：左側為瓦斯爐台與上方排油煙罩；A 點檢知器設於排油煙罩旁之天花板下，B 點設於遠處天花板下；C 點設於距爐具水平 4 m 範圍內、靠近地板之牆面低處，D 點設於超過 4 m 標示線以外之地板附近低處。）","opts":{"A":"A 點","B":"B 點","C":"C 點","D":"D 點"},"ans":"C","note":"答案 C。液化石油氣比空氣重（比重大於一），洩漏時沉積於低處。各類場所消防安全設備設置標準第 141條第 2 款：瓦斯對空氣之比重大於一時，(一) 設於距瓦斯燃燒器具或瓦斯導管貫穿牆壁處水平距離四公尺以內；\n(二) 檢知器上端，裝設在距樓地板面三十公分範圍內。C 點位於爐具 4 m 內且靠近地板，最正確。A、B 位於天花板附近，為比重未滿一之天然氣（第 1 款，水平 8 m 內、天花板下 30 cm 內）之裝設方式；D 雖在低處但超過 4m。液化石油氣屬第 140 條第 2 項第 2 款所稱之瓦斯。（課程教材 16 消防設備 p.22 僅有瓦斯警報器照片，未載裝設位置，故以設置標準為據。） 【依據】各類場所消防安全設備設置標準第 141 條第 1、2 款；第 140 條第 2 項第 2 款；課程教材：16 消防設備 p.22"},{"c":408,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"排煙區劃與煙控計畫","year":104,"no":24,"art":"5-4 消防與防災設備","q":"下列何者不屬於排煙區劃的煙控計畫內容？","opts":{"A":"需要對應於建築物用途設置防煙區劃","B":"需要對應於建築物的火警設備分區","C":"需要對應於建築物的防火區劃","D":"當排煙設備啟動時，連動停止空調換氣設備之運轉"},"ans":"B","note":"答案 B。煙控計畫依建築用途劃設防煙區劃（各類場所消防安全設備設置標準第 188 條第 1 項第 1、2 款：\n每 500 m² 以防煙壁區劃，地下通道每 300 m²），並配合防火區劃（同項第 5 款：排煙風管貫穿防火區劃處設防火閘門），且排煙時須停止空調，以免空調氣流擴散煙霧。火警設備的警戒分區是探測報警的分區，非排煙區劃須對應的內容，故選 B。註：D 之連動停止空調，現行（113 年版）第 188 條第 1 項第 11 款已明文規定，104 年考試時適用之 102 年版尚無此款，屬煙控設計原則。 【依據】各類場所消防安全設備設置標準第 188 條（102 年 5 月 1日版第 1 項第 1、2、5 款；現行 113 年版另增第 11 款）"},{"c":409,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"電氣機房滅火設備","year":105,"no":22,"art":"5-4 消防與防災設備","q":"在自動滅火設備中，電氣機房消防安全適合採用下列何種設備？①自動撒水 ②泡沫 ③CO₂ ④乾粉","opts":{"A":"①④","B":"②③","C":"①②","D":"③④"},"ans":"D","note":"答案 D。各類場所消防安全設備設置標準第 18 條附表第五項：發電機室、變壓器室及其他類似之電器設備場所，樓地板面積在 200 m²以上者，應就水霧、二氧化碳或惰性氣體、鹵化烴、乾粉滅火設備擇一設置，泡沫欄未列。電氣設備火災宜用不導電、不留水漬之氣體或乾粉滅火劑；撒水及泡沫含水導電，易造成感電與設備損壞，故①② 不適合，③CO2、④乾粉適合。 【依據】各類場所消防安全設備設置標準第 18 條附表第五項"},{"c":410,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"瓦斯漏氣火警自動警報設備","year":105,"no":23,"art":"5-4 消防與防災設備","q":"下列有關瓦斯漏氣警報設備設置之規定，何者錯誤？","opts":{"A":"採用液化石油氣作為瓦斯使用時，漏氣探測器應設置於壁面上方","B":"瓦斯漏氣之警報裝置的設置高度應距離樓地板面高度 4.5 m 以下","C":"一棟建築物有 2 台以上之瓦斯漏氣受信總機時，應具有相互連絡通話之功能","D":"瓦斯漏氣探測器不得設置於出風口 1.5 m 以內之場所"},"ans":"A","note":"答案 A（錯誤）。液化石油氣比空氣重，洩漏後沉積低處；設置標準第 141 條第 2 款：比重大於一時，檢知器設於燃燒器具水平距離 4 m 以內，上端距樓地板面 30 cm 範圍內，並非壁面上方（天花板附近為比重未滿一者）。B 符合第 143 條第 1 款第 2 目（表示燈距樓地板面 4.5 m 以下）；C 符合第 142 條第 6 款。【查證限制】D「出風口 1.5 m 以內不得設置」：經查 105 年考試適用之 102 年 5 月 1 日版第 141 條與現行相同，無此規定（第115 條是火警「探測器」距出風口 1.5 m 以上；第 141 條第 1 款第 2 目是天然氣檢知器設於「吸氣口」1.5 m 範圍內）。D 應屬檢知器設置通則（出風口氣流會稀釋洩漏瓦斯），依題意視為正確。 【依據】各類場所消防安全設備設置標準第 141 條第 1 款第 2 目、第 2 款、第 142 條第 6 款、第 143 條第 1 款第 2 目、第 115 條第 1、2 款（102年 5 月 1 日版與 113 年版條文相同）"},{"c":411,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"防煙垂壁與煙控","year":106,"no":23,"art":"5-4 消防與防災設備","q":"有關建築物之煙控與防排煙設備之敘述，下列何者錯誤？","opts":{"A":"防煙垂壁可分為固定式與活動式二種。地下建築之地下通道的垂壁深度規定通常較一般建築物之垂壁深度為高","B":"蓄煙井的原理為利用煙的熱浮效應，讓煙自然地從火場流至蓄煙井而排出戶外","C":"室內大型體育場、集會館，以及建物有大型挑空的場合，可有效利用大量防煙垂壁限制煙的擴散","D":"當火災發生時，可利用機械設備在火災區相鄰的區劃間製造壓力差，讓火災區形成負壓、非火災區形成正壓的方式，以限制煙的流動"},"ans":"C","note":"答案 C（錯誤）。大型體育館、集會堂或大挑空空間天花板高、容積大，防煙垂壁難以有效區劃，應利用大空間蓄煙（煙層蓄積於高處）配合頂部自然或機械排煙；設置標準第 188 條第 1 項第 1 款但書亦規定集會堂觀眾席等天花板高 5 m 以上且耐燃一級裝修者，得免以防煙壁區劃。A：同條第 2 項，防煙壁自天花板下垂 50 cm 以上，地下建築物之地下通道應 80 cm 以上 ✓。B：蓄煙井利用煙之浮力自然排煙 ✓。D：加壓防煙使火災區負壓、非火災區正壓 ✓。 【依據】各類場所消防安全設備設置標準第 188 條第 1 項第 1 款、第 2 項；建築技術規則建築設計施工編第 100 條第 2 項"},{"c":412,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"泡沫滅火設備適用火災","year":106,"no":25,"art":"5-4 消防與防災設備","q":"泡沫滅火設備適用於何種火災？","opts":{"A":"A 類（普通火災）","B":"B 類（油類火災）","C":"C 類（電氣火災）","D":"D 類（金屬火災）"},"ans":"A 或 B 均給分（更正前公告答案 B）","note":"泡沫以覆蓋液面隔絕氧氣並冷卻，最典型用途為油類（B 類）火災，故設置標準第 18 條列為停車空間、飛機庫等場所之選擇設置滅火設備。課程教材 p.9 火災分四類：A 普通火災（木材、紙張、紡織品、橡膠等可燃固體）、B 油類火災（汽油、酒精、油脂、瓦斯等）、C 電氣火災、D 易燃金屬物火災（鉀、鈉、鎂）。C 類：泡沫含水導電，電氣火災不適用；D 類：金屬遇水反應，不適用。【查證限制／爭議】考選部未公布更正理由，以下為推測：泡沫含大量水分，對 A 類普通火災同樣有冷卻、覆蓋滅火效果，一般常列為「適用 A、B 類火災」，題目為單選，故 A、B 皆給分。 【依據】各類場所消防安全設備設置標準第 18 條；課程教材：16 消防設備 p.9（火災分類）"},{"c":413,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"社福設施防火安全對策","year":106,"no":38,"art":"5-4 消防與防災設備","q":"關於居住者自行避難困難之社會福利設施，策定防火安全對策時，下列敘述何者錯誤？","opts":{"A":"擴大自動撒水範圍，強化初期滅火對策","B":"考量視障、聽障者，採用點減型誘導燈或誘導音附設型誘導燈","C":"寢具等個人用品與災害無關，不必特別考慮防焰化、耐燃化等措施","D":"管理體制必須納入夜間動員、夜間避難、消防聯繫等演練"},"ans":"C","note":"答案 C（錯誤）。長照、養護等自行避難困難者之設施，起火常源於寢具、衣物、窗簾等可燃物，且居住者難以迅速避難，應採用防焰寢具、窗簾、地毯及耐燃材料，減少起火與延燒（消防法第 11 條第 1 項亦規定十一層以上建築物、地下建築物及中央主管機關指定之場所，應使用附有防焰標示之地毯、窗簾、布幕等防焰物品）。\nA：擴大自動撒水設備以初期滅火 ✓。B：題文「點減型」應為「點滅型」誘導燈（閃滅），配合誘導音，兼顧視、聽障者 ✓。D：夜間人力少，需演練夜間避難與通報 ✓。 【依據】消防法第 11 條第 1 項；防火避難通用原理"},{"c":414,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"長照機構防火安全三大原則","year":107,"no":23,"art":"5-4 消防與防災設備","q":"下列何者不屬於長照機構防火安全規劃的三大原則之範疇？","opts":{"A":"各火災階段應採取垂直避難策略","B":"居室隔間牆高度應與樓層同高，貫穿部亦應有防火填塞，以隔絕火煙蔓延","C":"每個居室均應設置火警探測器，並增設簡易式自動撒水設備","D":"除避難層外，各樓層應防火牆及防火設備分隔為兩個以上之防火區劃"},"ans":"A","note":"答（A）。長照機構住民多為行動不便或臥床者，難以自行經樓梯垂直疏散，防火安全規劃強調：①早期偵知、初期滅火（每居室設火警探測器、增設簡易自動撒水，即（C））；②防火區劃與居室防火隔間，阻隔火煙蔓延（隔間牆至頂、貫穿部防火填塞，即（B）；各樓層分隔兩個以上防火區劃，即（D），現行設計施工編第 99-1條對 F-1、F-2、H-1 組之護理之家、老人福利機構等即規定除避難層外各樓層應分隔為二個以上區劃）；③「水平避難」策略，火災時先將住民水平移至同層另一防火區劃（安全區）等待救援，而非以垂直避難為主，故（A）錯誤。【查證限制】三大原則出自主管機關宣導資料，本機無原文；第 99-1 條為現行條文，107 年當時版本未逐字核對。 【依據】防火避難通用原理（長照機構防火安全三大原則宣導資料，本機無原文）；建築技術規則建築設計施工編第 86 條第 1 項第 3 款、第 99-1 條（本機現行條文，供對照 B、D）"},{"c":415,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"消防安全設備種類","year":107,"no":24,"art":"5-4 消防與防災設備","q":"下列何者不屬於消防設備之範疇？","opts":{"A":"出口標示燈","B":"避難器具","C":"緊急廣播設備","D":"諧波自動偵測設備"},"ans":"D","note":"答（D）。各類場所消防安全設備設置標準第 7 條將消防安全設備分為滅火設備、警報設備、避難逃生設備、消防搶救上之必要設備等。第 9 條第 3 款：緊急廣播設備屬警報設備（C）；第 10 條第 1 款：出口標示燈屬標示設備（A），第 2 款：避難器具（滑臺、避難梯、緩降機等）屬避難逃生設備（B）。（D）諧波偵測為電力品質監測（電氣設備）範疇，不在第 8 至 11 條所列之消防安全設備內；課程教材之消防設備分類（滅火、火警警報、避難逃生、消防搶救）亦無此項。 【依據】各類場所消防安全設備設置標準第 7 條、第 9 條第 3 款、第 10 條第 1款、第 2 款；課程教材：16 消防設備 p.10"},{"c":416,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"消防設備應用概念","year":108,"no":23,"art":"5-4 消防與防災設備","q":"有關消防設備的應用概念，下列何者錯誤？","opts":{"A":"定溫室探測器適用於經常使用火器之場所","B":"我國之室內消防栓僅供消防隊專用","C":"自動灑水設備屬於初期滅火設備","D":"乾粉滅火器或設備的應用範圍通常可包括丙類（電氣）火災"},"ans":"B","note":"答案 B（錯誤）。各類場所消防安全設備設置標準第 8 條將室內消防栓列為「滅火設備」（第 7 條：以水或其他滅火藥劑滅火之器具或設備），第 34 條規定場所應設第一種或第二種消防栓（第二種為管盤皮管或保形水帶、瞄子設容易開關之裝置），供場所內人員於火災初期操作；課程教材 16 消防設備 p.7 表 3-1 亦載屋內消防栓（口徑 40 或 50 mm）「初期消防用，由一般人操作」，送水口（消防隊專用栓）才由專業消防人員操作。專供消防人員使用者為第 11 條「消防搶救上之必要設備」（連結送水管、消防專用蓄水池等）。A：廚房等常用火、溫度變化大處用定溫式，避免差動式誤報，正確；C：自動撒水於火災初期自動動作，屬初期滅火，正確；D：ABC 乾粉不導電，可用於電氣火災，正確。 【依據】各類場所消防安全設備設置標準第 7、8、11、34 條；課程教材：\n16 消防設備 p.7（表 3-1 消防栓之種類）"},{"c":417,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"防火防煙計畫","year":108,"no":24,"art":"5-4 消防與防災設備","q":"有關建築防火防災計畫之敘述，下列何者錯誤？","opts":{"A":"蓄煙方式適合用於體積大或挑高之空間","B":"定溫型的火災探測器適合用於室溫變化較大的空間","C":"防煙垂壁可減緩煙的擴散速度","D":"建築物內的安全避難空間可控制在負壓狀態以避免煙的侵入"},"ans":"D","note":"答案 D（錯誤）。避難空間（特別安全梯、排煙室、緊急昇降機間等）應以加壓送風維持「正壓」，使空氣由避難空間向火災區流動，阻止煙侵入；若為負壓反而會把煙吸入。A：大空間、挑高中庭容積大，可利用頂部蓄煙延緩煙層下降，正確；B：室溫變化大（如鍋爐、廚房）用差動式易誤報，宜用定溫式，正確；C：防煙垂壁把天花下煙層分區，延緩擴散，正確。（定溫型、差動型動作原理見課程教材。） 【依據】課程教材：16 消防設備p.18"},{"c":418,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"住宅用火災警報器","year":108,"no":25,"art":"5-4 消防與防災設備","q":"有關住宅用火災警報器之設置及維護，下列何者錯誤？","opts":{"A":"廚房宜使用定溫式火災警報器","B":"裝設地點應距離牆面 1.5 公尺以上之位置，並以裝置居室中心為原則","C":"除避難層之外，該樓層若有寢室，則樓梯需設置住宅用火災警報器","D":"已設置火警自動警報裝置之場所，可免設住宅用火災警報器"},"ans":"B","note":"答案 B（錯誤）。住宅用火災警報器設置辦法第 4 條：裝於天花板或樓板者，下端距天花板 60 cm 以內，且「距離牆面或樑 60 公分以上」；1.5 公尺是「距離出風口」的規定（第 3 款）；並以居室中心為原則（第 4 款）。\nA：第 5 條廚房用定溫式；C：第 3 條第 1 項第 3 款，有寢室之樓層之樓梯應設，但避難層不在此限；D：消防法第6 條第 4、5 項，住宅用火災警報器係規定於「不屬於應設置火警自動警報設備」之場所，已設火警自動警報設備者不須另設，均正確。 【依據】住宅用火災警報器設置辦法第 3、4、5 條；消防法第 6 條第 4、5 項"},{"c":419,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"安全梯與特別安全梯之差異","year":109,"no":22,"art":"5-4 消防與防災設備","q":"有關建築技術規則中，安全梯與特別安全梯的主要差異為何？","opts":{"A":"入口處防火門的標示燈","B":"排煙室的設置","C":"緊急照明設備","D":"緊急廣播設備"},"ans":"B","note":"答案 B。設計施工編第 1 條第 44 款：特別安全梯指「自室內經由陽臺或排煙室始得進入之安全梯」，即在樓梯間前須先設排煙室（或陽臺）作為防煙緩衝；一般室內安全梯則可由室內直接經防火門進入樓梯間。第 97 條第 1項第 1 款（室內安全梯）與第 3 款（特別安全梯）比較：兩者樓梯間皆需緊急電源照明設備、耐燃一級裝修與一小時防火時效牆壁，特別安全梯另有排煙室或陽臺及其面積、固定窗等規定。因此主要差異在排煙室（或陽臺）的設置，(A)(C)(D) 非兩者之主要差異。 【依據】建築技術規則建築設計施工編第 1 條第 44 款、第 97 條第 1 項第 1 款及第 3 款"},{"c":420,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"消防設備分類（初期滅火設備）","year":109,"no":23,"art":"5-4 消防與防災設備","q":"消防設備中，初期滅火設備不包括下列何項設備？","opts":{"A":"室內消防栓","B":"泡沫滅火器","C":"撒水頭","D":"送水口"},"ans":"D","note":"答案 D。送水口是連結送水管的一部分（各類場所消防安全設備設置標準第 180 條規定出水口及送水口之設置），屬第 11 條所列「消防搶救上之必要設備」，供消防隊由消防車加壓送水，不屬於滅火設備。課程教材「消防設備與防災流程」圖（圖 3-2）將「初期滅火」之滅火設備列為屋內消防栓、撒水頭、二氧化碳滅火、泡沫滅火、鹵化物滅火等；而送水口、採水口、消防隊專用栓等歸在「主要滅火」階段；另表 3-1 亦指出屋內消防栓為初期消防用、由一般人操作，送水口（消防隊專用栓）則由專業消防人員操作。故 (A) 室內消防栓、(B) 泡沫滅火器、(C) 撒水頭皆屬初期滅火設備，(D) 送水口不是。（「初期滅火設備」非標準第 7 條之法定分類用語，此處依課程教材之防災流程分類。） 【依據】各類場所消防安全設備設置標準第 7、8、11 條及第 180 條；課程教材：16消防設備.pdf p.7（表 3-1）、p.8（圖 3-2）"},{"c":421,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"建築內部裝修材料限制","year":109,"no":24,"art":"5-4 消防與防災設備","q":"為防止建築物內發生火災時之火勢延燒，下列有關裝修材料敘述何者錯誤？","opts":{"A":"應優先使裝潢材料、傢俱等物品不燃化","B":"耐火板係指符合耐燃一級之材料","C":"混凝土、磚或空心磚、瓦等建材屬不燃材料","D":"建築物 11 層以上部分，每 500 平方公尺內有防火區劃之部分，居室應採用耐燃一級的內部裝修材料"},"ans":"B","note":"答案 B。設計施工編第 1 條第 29 款：耐火板指木絲水泥板、耐燃石膏板及其他經中央主管建築機關認定符合「耐燃二級」之材料，不是耐燃一級；耐燃一級對應的是第 28 款之「不燃材料」。(C) 第 28 款不燃材料：混凝土、磚或空心磚、瓦、石料、鋼鐵、鋁、玻璃、玻璃纖維、礦棉、陶瓷品、砂漿、石灰等，正確。(D) 第 88 條表（十三）：十一層以上部分，每五百平方公尺以內有防火區劃者，居室及通達地面之走廊、樓梯均須耐燃一級，正確。(A) 為防火原則，正確。 【依據】建築技術規則建築設計施工編第 1 條第 28、29 款、第 88 條表（十三）"},{"c":422,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"高層建築物之連結送水管","year":109,"no":27,"art":"5-4 消防與防災設備","q":"有關建築技術規則高層建築物專章之建築設備，下列敘述何者正確？","opts":{"A":"高層建築物每超過 70 公尺者應設置中繼幫浦","B":"連結送水管 3 支以下時，中繼幫浦出水口之水量不得小於 1400 公升／分","C":"設置室內供消防隊專用之連結送水管，其管徑應為 50 公厘以上，出水口應為雙口形","D":"連結送水管出水口之出水壓力不得小於 3.5 公斤／平方公分"},"ans":"D","note":"答案 D。設計施工編第 251 條第 2 項：高層建築物高度每超過「六十公尺」者應設置中繼幫浦，連結送水管三支以下時，其幫浦出水口之水量不得小於「二千四百公升／分」，每增加一支出水量加八百公升／分，至五支為止，出水口之出水壓力不得小於三‧五公斤／平方公分。(A) 70 公尺應為 60 公尺；(B) 1400 應為 2400 公升／分。第251 條第 1 項：供消防隊專用之連結送水管，管徑應為「一百公厘以上」、出水口為雙口形，故 (C) 之 50 公厘錯誤。 【依據】建築技術規則建築設計施工編第 251 條第 1 項、第 2 項"},{"c":423,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"火警探測器之裝置位置","year":110,"no":26,"art":"5-4 消防與防災設備","q":"依據建築技術規則建築設備編，火警探測器之裝置位置，下列敘述何者錯誤？","opts":{"A":"應裝置在天花板下方 30 公分範圍內","B":"設有排氣口時，應裝置於排氣口周圍 2 公尺範圍外","C":"天花板上設出風口時，應距離該出風口 1 公尺以上","D":"牆上設有出風口時，應距離該出風口 3 公尺以上"},"ans":"B","note":"答案 B（錯誤敘述）。建築設備編第 70 條：探測器裝置位置，一、應裝置在天花板下方三十公分範圍內；\n二、設有排氣口時，應裝置於排氣口週圍「一公尺範圍內」（因熱氣與煙會被排氣口吸往該處，裝於此處才能迅速感知）；三、天花板上設出風口時，應距該出風口一公尺以上；四、牆上設出風口時，應距該出風口三公尺以上（避免送風稀釋煙與熱）。故 B「2 公尺範圍外」錯誤。（現行版條文。） 【依據】建築技術規則建築設備編第70 條第 1～4 款"},{"c":424,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"主要滅火設備之範圍","year":110,"no":27,"art":"5-4 消防與防災設備","q":"火災發生到進入最盛期時，消防設備中主要滅火設備不包括下列那項設備？","opts":{"A":"消防車消防用水","B":"消防栓","C":"防火閘門","D":"送水口"},"ans":"C","note":"答案 C。課程教材 16 消防設備 p.8 圖 3-2「消防設備與防災流程」把「主要滅火」之滅火設備列為消火用水、採水口、送水口、消防隊專用栓（另列緊急插座、緊急電源），即 A 消防車消防用水、B 消防栓（此指消防隊使用之消防栓；屋內消防栓在同圖列於「初期滅火」，見 109-23）、D 送水口（連結送水管屬設置標準第 11 條「消防搶救上之必要設備」，第 180 條；自動撒水之送水口見第 59 條）；p.7 表 3-1 亦載送水口為消防隊專用、由專業消防人員操作。防火閘門在同圖屬「避難—延燒防止」，依建築設備編第 93 條設於風管貫穿防火區劃處，溫度超過正常運轉最高溫度達 28℃ 時自動關閉，阻止火煙經風管蔓延，本身不能滅火，故選 C。 【依據】課程教材：16 消防設備 p.7（表 3-1）、p.8（圖 3-2 消防設備與防災流程）；各類場所消防安全設備設置標準第 11 條、第59 條、第 180 條；建築技術規則建築設備編第 93 條"},{"c":425,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"滅火器步行距離","year":110,"no":28,"art":"5-4 消防與防災設備","q":"設有滅火器之樓層，自樓面居室任一點至滅火器之步行距離最多應在多少公尺以下？","opts":{"A":"15","B":"20","C":"30","D":"50"},"ans":"B","note":"答案 B（20 m）。各類場所消防安全設備設置標準第 31 條第 3 款：設有滅火器之樓層，自樓面居室任一點至滅火器之步行距離在二十公尺以下。易混淆：第一種室內消防栓為「各層任一點至消防栓接頭之水平距離在二十五公尺以下」（第 34 條第 1 項第 1 款第 1 目），量的是水平距離；滅火器量的是步行距離 20 m。 【依據】各類場所消防安全設備設置標準第 31 條第 3 款；第 34 條第 1 項第 1 款"},{"c":426,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"自動撒水設備種類","year":111,"no":23,"art":"5-4 消防與防災設備","q":"下列有關自動撒水設備之功能敘述，何者錯誤？","opts":{"A":"密閉濕式：平時管內貯滿高壓水，撒水頭動作時即撒水","B":"密閉乾式：平時管內貯滿高壓空氣，撒水頭動作時先排空氣，繼而撒水","C":"開放式：平時管內無水，啟動一齊開放閥，使水流入管系撒水","D":"預動式：平時管內貯滿低壓水，以感知裝置啟動流水檢知裝置，且撒水頭動作時即撒水"},"ans":"D","note":"答案 D（錯誤）。各類場所消防安全設備設置標準第 43 條第 4 款：預動式「平時管內貯滿低壓『空氣』，以感知裝置啟動流水檢知裝置，且撒水頭動作時即撒水」，並非低壓水。A（第 1 款）、B（第 2 款）、C（第 3款）與條文相同，正確。 【依據】各類場所消防安全設備設置標準第 43 條第 1～4 款"},{"c":427,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"火警自動警報設備組成","year":111,"no":24,"art":"5-4 消防與防災設備","q":"依據建築技術規則之規定，有關火警自動警報設備應不包括下列何種設備？","opts":{"A":"手動報警機","B":"自動撒水設備","C":"火警受信機總機","D":"緊急電源"},"ans":"B","note":"答案 B。建築技術規則建築設備編第 66 條第 1 項：火警自動警報設備應包括：一、自動火警探測設備；\n二、手動報警機；三、報警標示燈；四、火警警鈴；五、火警受信機總機；六、緊急電源。自動撒水設備屬滅火設備，不在其內；A、C、D 分別為第二、五、六款。 【依據】建築技術規則建築設備編第 66 條第 1 項第 1～6 款"},{"c":428,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"燃燒四面體","year":111,"no":25,"art":"5-4 消防與防災設備","q":"有關燃燒學說之燃燒四面體，下列何者錯誤？","opts":{"A":"氧化劑","B":"輻射","C":"連鎖反應","D":"燃料"},"ans":"B","note":"答案 B（錯誤）。燃燒四面體的四個要素為：燃料（可燃物）、氧化劑（助燃物，如氧氣）、熱（能量／點火源）與連鎖反應（自由基反應持續進行）。它是由傳統「燃燒三角」（可燃物、助燃物、熱）加上連鎖反應而成。課程教材列火災燃燒要素為「溫度（即熱源）、燃料（還原劑）、氧氣（氧化劑）、連鎖反應」，並圖示燃燒三角形與燃燒四面體。輻射是熱傳方式之一，並非獨立要素，故不選。A、C、D 為四面體要素。 【依據】課程教材：16 消防設備 p.3"},{"c":429,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"火災煙層分布與排煙","year":112,"no":24,"art":"5-4 消防與防災設備","q":"火害發生時，煙物質與煙層分布說明，下列敘述何者錯誤？","opts":{"A":"若無排煙裝置輔助，初期煙層會迅速往上蔓延，並於天花中蓄積","B":"為了讓煙層有效排出到建物外，管道間與聯接建築物樓層之通道與開口需全部開啟，以利排放","C":"隨著燃燒時間劇增，煙層將周圍空氣捲入，煙層分布與溫度將持續增加與向下擴散","D":"火害發生之煙層分布與室內換氣條件及熱流速度等因子有關"},"ans":"B","note":"答案 B（錯誤）。排煙、防煙的原則是「防煙區劃」：只開啟起火區之排煙口與必要之補氣口，管道間、樓梯間、昇降機道等垂直貫穿部分及聯接各樓層之開口應保持關閉，阻止煙因煙囪效應竄入其他樓層；全部開啟會使煙沿垂直管道擴散，並破壞排煙氣流方向。建築技術規則設計施工編第 79-2 條第 1 項即規定昇降機道、垂直貫穿樓板之管道間等應以防火設備區劃分隔，昇降機道之防火設備與管道間維修門須具遮煙性能。A 熱煙浮升，初期蓄積於天花下；C 煙流捲吸空氣，煙層增厚下降；D 煙層受換氣條件與熱流影響，均正確。課程教材 16 消防設備 p.26：\n煙控設備藉防煙區劃防止煙蔓延，目的在確保避難時間內人員不受煙干擾。 【依據】建築技術規則建築設計施工編第 79-2 條第 1 項；課程教材：16 消防設備 p.26"},{"c":430,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"滅火器設置場所","year":113,"no":35,"art":"5-4 消防與防災設備","q":"依據「各類場所消防安全設備設置標準」，當總樓地板面積未滿 150 m²時，下列何者應設置滅火器？","opts":{"A":"地下建築物","B":"補習班","C":"診所","D":"史蹟資料館"},"ans":"A","note":"答案 A。各類場所消防安全設備設置標準第 14 條：下列場所應設置滅火器：一、甲類場所、地下建築物、幼兒園；二、總樓地板面積在 150 平方公尺以上之乙、丙、丁類場所；…。地下建築物（第 12 條第 5 款第 3 目，戊類）不受面積限制，未滿 150 m² 亦應設置。補習班（第 12 條第 2 款第 3 目）、診所（第 2 款第 6 目）、史蹟資料館（第 2 款第 4 目）皆屬乙類場所，須總樓地板面積達 150 m² 以上才應設置。 【依據】各類場所消防安全設備設置標準第 12 條、第 14 條（113.04.24 修正版）"},{"c":431,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"防煙壁區劃","year":113,"no":36,"art":"5-4 消防與防災設備","q":"建築物每層樓地板面積每 500 m²內且其天花板及室內牆面以耐燃一級材料裝修者得免設置防煙壁，下列何類場所仍需設置防煙壁區劃？","opts":{"A":"天花板高度 6 m 的電影院觀眾席","B":"天花板高度 7 m 的工廠","C":"天花板高度 10 m 的集會堂觀眾席","D":"天花板高度 4 m 的咖啡廳"},"ans":"D","note":"答案 D。各類場所消防安全設備設置標準第 188 條第 1 項第 1 款：排煙設備每層樓地板面積每 500 m² 內以防煙壁區劃；但戲院、電影院、歌廳、集會堂等場所觀眾席，及工廠等類似建築物，其天花板高度在 5 公尺以上，且天花板及室內牆面以耐燃一級材料裝修者，不在此限。A（6 m 電影院）、B（7 m 工廠）、C（10 m 集會堂）皆符合免除條件；D 咖啡廳不屬上述場所（甲類場所第 12 條第 1 款第 5 目），且天花板高度 4 m 低於 5 m，仍須防煙壁區劃。（防煙壁指不燃材料、自天花板下垂 50 公分以上之垂壁，同條第 2 項。） 【依據】各類場所消防安全設備設置標準第 188 條第 1 項第 1 款、第 2 項（113.04.24 修正版）"},{"c":432,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-4 消防與防災設備","h3":"消防設備的安全功能","year":114,"no":25,"art":"5-4 消防與防災設備","q":"消防設備提高建築物安全性能的方式，下列敘述何者錯誤？","opts":{"A":"高性能滅火設備設置於隱蔽處","B":"立即將火苗熄滅與抑制","C":"迅速告知室內人員儘早逃生避難，誘導其逃生方向","D":"延緩火災煙層蔓延，確保逃生通道安全"},"ans":"A","note":"答案 A（錯誤）。設置標準第 7 條將消防安全設備分為：滅火設備（初期滅火、抑制火勢，B）、警報設備（火警探測、緊急廣播，迅速通知人員，C）、避難逃生設備（標示設備、緊急照明，誘導避難方向，C）、消防搶救上之必要設備（第 11 條含排煙設備，延緩煙層蔓延、確保逃生通道，D）。滅火設備須便於取用：滅火器應「固定放置於取用方便之明顯處所」並設標識（第 31 條第 4 款），室內消防栓應設在走廊或防火構造樓梯間附近便於取用處（第 34 條第 2 項第 2 款）；設於隱蔽處則火災時無法迅速使用，A 錯。 【依據】各類場所消防安全設備設置標準第 7 條、第 10 條、第 11 條、第 31 條第 4 款、第 34 條第 2 項第 2 款"},{"c":433,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-5 昇降機與其他設備","h3":"太陽光電發電量","year":102,"no":22,"art":"5-5 昇降機與其他設備","q":"下列何者為太陽光電發電量計算時所需的氣象資料？","opts":{"A":"日照率","B":"日射量","C":"空氣溫度","D":"可照時數"},"ans":"B","note":"答案為 B。\n太陽光電發電量估算：\n發電量 ≒ 系統裝置容量 × 日射量（kWh/m²，或換算成峰值日照小時）× 系統效率日射量是能量的輸入，是最主要的氣象資料。\nA 日照率、D 可照時數：只表示有日照的時間比例或天文上可照的時間，不是能量值，不能直接算發電量。\nC 空氣溫度：會影響模組溫度與轉換效率，只作修正用，不是計算的主要資料。 【依據】一般原理（太陽光電發電量估算：發電量＝裝置容量×日射量×系統效率）；【查證限制】本機課程教材與法規無太陽光電發電量計算專章"},{"c":434,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-5 昇降機與其他設備","h3":"昇降機機坑構造","year":102,"no":36,"art":"5-5 昇降機與其他設備","q":"有關昇降機之機坑，下列何者是非必要的？","opts":{"A":"地面以下應為防水構造","B":"底部應有足夠之安全強度","C":"相鄰昇降機之機坑之間必須以 RC 牆分隔","D":"應裝設爬梯，以利於維修人員進入坑底"},"ans":"C","note":"答案為 C。\n建築技術規則建築設備編第 112 條規定機坑之構造：\n・第 1 款：機坑在地面以下者應為防水構造（A）；直下方另有其他使用者，機坑底部應有足夠之安全強度（B）\n・第 2 款：應設照明設備\n・第 3 款：機坑深度在 1.4 公尺以上時，應裝設固定爬梯（D）\n・第 4 款：「相鄰昇降機機坑之間應隔開」第 4 款只要求隔開，沒有限定須以 RC 牆分隔（可用鋼製隔網、隔板等），所以 C「必須以 RC 牆」是非必要的。\n（本機條文為 111 年版，102 年考試時第 112 條內容推定相同，未取得舊版原文核對。） 【依據】建築技術規則建築設備編第 112 條第 1、3、4 款"},{"c":435,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-5 昇降機與其他設備","h3":"昇降機房規定","year":103,"no":11,"art":"5-5 昇降機與其他設備","q":"有關升降機房設計的敘述，下列何者錯誤？","opts":{"A":"機房門為附鎖之鋼板門，且至少 70 cm 寬，180 cm 高","B":"機房之牆壁須設置有效之通風口或通風設備","C":"機房面積須大於升降機道之水平面積二倍以上","D":"必須設置寬度 90 cm 以上且帶有扶手之 RC 樓梯"},"ans":"D","note":"答案 D（錯誤）。建築技術規則建築設備編第 115 條第 4 款：機房「其有設置樓梯之必要者」，樓梯寬度不得小於七十公分，與水平面之傾斜角度不得大於六十度，並應設置扶手；並非「必須」設置，寬度也非 90 cm，亦未限定 RC 構造。A 符合同條第 5 款（門不得小於 70 公分寬、180 公分高，附鎖之鋼製門）；B 符合第 3 款（須有有效通風口或通風設備）；C 符合第 1 款（機房面積須大於昇降機道水平面積之二倍）。課程教材 15 輸送設備 p.43亦指出電梯機坑、機廂、安全裝置及機械室之構造須符合設備編第六章昇降設備之規定，p.12 表 5-6 列機房淨高、p.15 圖 5-15 為機械室平剖面例。 【依據】建築技術規則建築設備編第 115 條第 1、3、4、5 款；課程教材：15 輸送設備 p.12、p.15、p.43"},{"c":436,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-5 昇降機與其他設備","h3":"瓦斯管配管方式","year":105,"no":21,"art":"5-5 昇降機與其他設備","q":"為了防止建築物瓦斯洩漏蔓延之安全考量，瓦斯管原則上採取何種配管比較恰當？","opts":{"A":"密閉管道間配管","B":"牆壁嵌入式配管","C":"外牆露出式配管","D":"樓梯間內配管"},"ans":"C","note":"答案 C。瓦斯管以外牆露出配管為原則：萬一洩漏可直接擴散到室外大氣，不會積聚在室內，且便於目視檢查與維修。B 錯：建築技術規則建築設備編第 79 條第 3 款規定燃氣供給管路不得埋設於建築物基礎、樑柱、牆壁、樓地板及屋頂構造體內。A：密閉管道間易積聚洩漏瓦斯，非首選；高層建築物瓦斯管之管道間並應單獨設置（設計施工編第 246 條，但與給水管或排水管共構設置者不在此限）。D：樓梯間為避難路徑，洩漏或起火將危及避難安全。 【依據】建築技術規則建築設備編第 79 條第 3 款；建築技術規則建築設計施工編第 246 條"},{"c":437,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-5 昇降機與其他設備","h3":"電梯與電扶梯","year":107,"no":30,"art":"5-5 昇降機與其他設備","q":"有關輸送設備之敘述，下列何者錯誤？","opts":{"A":"辦公大樓電梯等候時間一般低於集合住宅","B":"對 60 層樓以上的超高層建築而言，電梯區劃採用一般高度區劃會比採用空中梯廳更能節省各層樓之電梯坑所占面積","C":"當建築條件相同時，雙層車廂電梯的一周時間較一般單層電梯短","D":"百貨公司之電扶梯的單位時間輸送能力較電梯大"},"ans":"B","note":"答（B）。超高層建築若只用一般分區（低、中、高層區各自由一樓直達），高區電梯必須穿越下方所有樓層，各層被電梯道占用的面積很大。採用「空中梯廳（sky lobby）」方式，以穿梭電梯直達空中梯廳再轉乘區域電梯，上下區可垂直疊置共用電梯道，大幅節省各層電梯道面積，故（B）說反了（課程教材列高度區劃、空中梯廳、雙層電梯為代表性區劃方式）。（A）課程教材表 5-2：辦公建築平均出發間隔容許值 35～40 秒以下，集合住宅 80 秒以下，辦公大樓等候時間較短，正確。（C）雙層車廂一次服務兩層、停靠次數少，一周時間較短，正確。\n（D）課程教材：電扶梯可連續輸送，輸送能力約為電梯之 8～12 倍，正確。 【依據】課程教材：15 輸送設備p.24、p.38、p.48"},{"c":438,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-5 昇降機與其他設備","h3":"電梯台數計畫","year":108,"no":30,"art":"5-5 昇降機與其他設備","q":"有關電梯設備計畫計算電梯數量，下列敘述何者錯誤？","opts":{"A":"電梯的數量主要是由電梯使用的尖峰時刻的上下交通量來決定","B":"電梯的數量根據用途設定尖峰時間 10 分鐘集中率","C":"電梯的數量考慮電梯平均出發間隔","D":"電梯的數量考慮電梯一周運轉時間"},"ans":"B","note":"答案 B（錯誤）。課程教材表 5-2「各類建築五分鐘集中率與電梯數量建議值」：依用途設定尖峰時間「五分鐘集中率」（如出租辦公 12～15%、集合住宅 3～5%），以尖峰五分鐘使用人數除以單台五分鐘輸送能力（HC＝300·r/RTT）檢討最少台數，非 10 分鐘。A：台數由尖峰時刻上下交通量決定，正確；C：平均出發間隔＝RTT÷電梯台數，表示等候時間，正確；D：一周運轉時間（RTT）決定單台輸送能力，正確。 【依據】課程教材：15輸送設備 p.23–25"},{"c":439,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-5 昇降機與其他設備","h3":"太陽光電設置","year":108,"no":32,"art":"5-5 昇降機與其他設備","q":"有關在臺灣設置太陽能光電的資訊，下列敘述何者錯誤？","opts":{"A":"太陽光電之裝設地點應避免周圍建築物遮蔽，電池模板宜面向南方","B":"光電板的傾斜角度應控制在 22～25±10 度之間","C":"太陽光電發電設備輸出給台電公司的電能，是以直流電為主","D":"平屋頂裝設 1 瓩的太陽光電發電設備約需 10 m² 的設置面積"},"ans":"C","note":"答案 C（錯誤）。太陽電池模組產生直流電，併聯型系統須經變流器（逆變器、Inverter）轉換為與市電電壓、波形、頻率相容的交流電後才併入台電電網，故輸出給台電的是交流電。用戶用電設備裝置規則（本機為 114年版，條次與 108 年當時之屋內線路裝置規則不同，僅作原理佐證）第 863 條第 2 款定義模組「能產生直流電力」、第 15 款定義併聯型系統為與電力網併聯運轉並得輸送電力至電力網之 PV 系統，第 996 條規定發電電源與經常電源併聯運轉者電壓、波形、頻率應能相容。A：臺灣在北半球，模板面南、避免遮蔽可得最大日射，正確；B：\n傾角接近當地緯度（約 22～25°）上下調整可兼顧發電量與雨水自潔，為題意正確敘述；D：以當時常見結晶矽模組效率估算，1 kWp 模組面積約 7 m²，平屋頂含排列間距約需 10 m²，題意正確。【查證限制】B、D 為經驗數值，本機法規與課程教材均無原文可對照，不影響答案 C 之判斷。 【依據】用戶用電設備裝置規則（114 年版）第 863條第 2 款、第 15 款、第 996 條"},{"c":440,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-5 昇降機與其他設備","h3":"電梯交通量評估","year":110,"no":9,"art":"5-5 昇降機與其他設備","q":"有關電梯交通量之評估計算，下列敘述何者錯誤？","opts":{"A":"電梯之行走速度並非線性函數，通常以額定速度表示電梯速度","B":"將運轉一周時間除以電梯台數，可得出每台電梯出發之間隔時間","C":"電梯之交通量計算，通常以離峰時間 5 分鐘內能容納的人數為設計基準","D":"電梯之輸送能力與 RTT 成反比"},"ans":"C","note":"答案 C（錯誤敘述）。電梯交通量計算係以「尖峰」（如上班尖峰）5 分鐘內須輸送之人數比例為設計基準，使最擁擠時段仍能滿足需求，並非離峰時間。A 正確：電梯有加減速，行走速度非線性，以額定速度表示；B正確：運轉一周時間 RTT（Round Trip Time）÷ 電梯台數 = 出發間隔時間（Interval）；D 正確：5 分鐘輸送能力 ∝300 × 每次載客數 ÷ RTT，與 RTT 成反比。課程教材（15 輸送設備 p.23）：平均出發間隔 = RTT ÷ 電梯數量；五分鐘輸送能力為「尖峰時間」電梯五分鐘使用人數除以一周運轉時間，據此檢討最少電梯數量，與選項 B、C、D 之判斷一致。 【依據】課程教材：15 輸送設備 p.23（RTT、平均出發間隔、五分鐘輸送能力）"},{"c":441,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-5 昇降機與其他設備","h3":"輸送設備","year":110,"no":32,"art":"5-5 昇降機與其他設備","q":"下列有關輸送設備的敘述何者正確？","opts":{"A":"電梯（昇降機）機道（昇降路）頂部應為一近似氣密的構造","B":"電扶梯（昇降階梯）的輸送能力普遍不及電梯","C":"電梯之車廂頂部安全距離應隨電梯速度之增高而加大","D":"電梯的速度最高約可達每分鐘 200 公尺"},"ans":"C","note":"答案 C。建築設備編第 111 條表列「機廂頂部安全距離及機坑深度」隨昇降機設計速度提高而加大，如 45m/min 以下為 1.2 m，超過 240 m/min 為 4.0 m，故 C 正確。A 錯：第 110 條第 3 款規定機道四周除出入門及通風孔外為防火構造之密閉牆壁，第 4 款規定機道內應有適當通風，故機道須設通風孔、不是近似氣密的構造；B 錯：電扶梯為連續運轉，輸送能力一般遠高於電梯；D 錯：超高層用電梯速度可達每分鐘 600 m 以上（高速電梯超過 1000m/min），規則表列也至超過 240 m/min。 【依據】建築技術規則建築設備編第 110 條第 3、4 款；第 111 條"},{"c":442,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-5 昇降機與其他設備","h3":"昇降機房規定","year":110,"no":33,"art":"5-5 昇降機與其他設備","q":"依據建築技術規則建築設備編，下列關於昇降機房之規定何者錯誤？","opts":{"A":"機房面積等於昇降機道水平面積","B":"機房內淨高度依昇降機設計速度越高，應增加淨高度，最小不得小於 2 公尺","C":"機房有設置樓梯之必要者，樓梯寬度不得小於 70 公分，與水平面之傾斜角度不得大於 60 度，並應設置扶手","D":"機房門不得小於 70 公分寬，180 公分高，並應為附鎖之鋼製門"},"ans":"A","note":"答案 A（錯誤敘述）。建築設備編第 115 條：一、機房面積須「大於昇降機道水平面積之二倍」（無礙機械配設及管理並經主管機關核准者除外），並非等於機道水平面積；二、機房內淨高度依設計速度表列（60 m/min 以下為 2.0 m，超過 60 至 150 為 2.2 m，超過 150 至 210 為 2.5 m，超過 210 為 2.8 m），最小 2.0 m，B 正確；四、樓梯寬 ≥ 70 cm、傾斜角 ≤ 60 度並設扶手，C 正確；五、機房門 ≥ 70 cm × 180 cm 附鎖鋼製門，D 正確。 【依據】建築技術規則建築設備編第 115 條第 1、2、4、5 款"},{"c":443,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-5 昇降機與其他設備","h3":"電梯設計原則","year":111,"no":30,"art":"5-5 昇降機與其他設備","q":"有關電梯設備之設計原則，下列何者錯誤？","opts":{"A":"使用油壓式電梯可節省電梯機坑深度","B":"空中梯廳（sky lobby）常使用於超高層大樓以減少電梯坑的數量","C":"電梯之需求量一般以尖峰時間每 30 分鐘的使用人數來衡量","D":"辦公大樓午餐尖峰時需考慮上下雙向的輸送"},"ans":"C","note":"答案 C（錯誤）。課程教材：「電梯的需要量一般是以尖峰時刻，每五分鐘的使用人數來衡量」，尖峰時期五分鐘內電梯使用人數與建物容納人數之比值稱為五分鐘集中率（教材表 4.5：單一公司專用辦公大樓 20～25%、出租辦公大樓 11～15%；表 5-2 列出租大樓 12～15%），並以五分鐘輸送能力檢討最少電梯數量，並非 30 分鐘。\nA：教材載油壓式電梯速度慢、適用低層建築，但其頂部安全距離、機坑深度及電梯坑面積均較鋼索式為小，空間上有利 ✓。B：超高層建築以空中梯廳方式等電梯區劃，提高運轉效率、減少電梯數量與井道 ✓。D：午餐尖峰有上、下雙向客流，須同時考慮 ✓。 【依據】課程教材：15 輸送設備 p.5、18、22、23、24、38"},{"c":444,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-5 昇降機與其他設備","h3":"高層建築電梯與梯廳配置","year":112,"no":26,"art":"5-5 昇降機與其他設備","q":"關於高層建築電梯與梯廳之配置規劃，下列敘述何者錯誤？","opts":{"A":"高層建築電梯配置規劃需設定空中轉換層或分流系統來調節","B":"電梯數量多時，應採單一向並列方式，有效節省一周運轉時間，提升人員輸送能力","C":"高層建築電梯輸送依服務樓層、運行距離及電梯速度等因素來規劃運轉效率","D":"高層建築區劃中，60 層以上建議設置空中轉換層來轉換"},"ans":"B","note":"答案 B（錯誤）。課程教材 15 輸送設備 p.34（圖 5-9）：4 台以 2-2 相對配列較佳，並列方式步行距離較長，以不超過 4 台為原則；6 台以 3-3 相對配列較佳，6 台並列效果不佳；8 台採 4-4 相對配列。故電梯數量多時應採相對配列並分組，而非單一向並列，否則梯廳過長、候梯與步行時間增加。A、C：教材 p.38：高層建築為減少一周運轉時間、提高運輸效率，按高度區劃服務區域，代表方式有高度區劃、空中梯廳、雙層電梯；規劃時並依服務樓層、行程與速度檢討效率。D：p.39 紐約世貿中心（110 層）於 44、78 層設空中梯廳轉乘。【查證限制】「60 層以上」之建議值教材未明載。 【依據】課程教材：15 輸送設備 p.34、p.38、p.39"},{"c":445,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-5 昇降機與其他設備","h3":"電梯尖峰 5 分鐘人數","year":112,"no":28,"art":"5-5 昇降機與其他設備","q":"某棟 11 層集合住宅，2 至 11 樓為住戶樓層，每層樓有 5 戶住戶、每戶 4 人，當電梯「5 分鐘集中率」為 25% 時，為請問尖峰 5 分鐘時段使用電梯人數為多少人？","opts":{"A":"40","B":"45","C":"50","D":"55"},"ans":"C","note":"答案 C。5 分鐘集中率 ＝ 尖峰 5 分鐘使用電梯人數／建築物總使用人數。住戶樓層為 2～11 樓共 10 層（1樓非住戶層）；總人數 ＝ 10 層 × 5 戶 × 4 人 ＝ 200 人。尖峰 5 分鐘人數 ＝ 200 × 25% ＝ 50 人。驗算：200 ÷ 4 ＝50。注意：11 層建築，2 至 11 樓為 10 層，不是 11 層；若誤算 11 層得 55 人（D）。課程教材 15 輸送設備 p.18：\n五分鐘集中率 ＝（五分鐘內電梯的使用人數）／（建築物容納人數）。 【依據】課程教材：15 輸送設備 p.18"},{"c":446,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-5 昇降機與其他設備","h3":"太陽光電設備建置規定","year":113,"no":34,"art":"5-5 昇降機與其他設備","q":"建築師進行太陽光電設備建置工程時應注意的項目，下列敘述何者錯誤？","opts":{"A":"太陽能光電發電設備，設置高度超過 3 m 時，需附結構計算說明書","B":"太陽能光電設備設置支撐架結合新設頂蓋時，不需附結構計算說明書","C":"太陽能光電板設置樣式為仰角非固定時，需附結構計算說明書","D":"太陽光電發電設備應於竣工後，檢附依法登記開業或執業之建築師出具之「太陽光電發電設備工程完竣證明書」，報請所在地主管建築機關備查"},"ans":"B","note":"答案 B（錯誤）。113 年考試時適用 110 年 2 月 8 日修正之設置再生能源設施免請領雜項執照標準（114.01.13 全文修正前）。該版第 6 條第 2 項：有下列情形之一者，應另檢附太陽光電發電設備結構計算說明書：\n一、設置高度超過三公尺；二、設置仰角非固定；三、設置範圍超出建築物外牆中心線或其代替柱中心線；四、設置支撐架結合新設頂蓋。故「結合新設頂蓋」仍須附結構計算說明書，B 錯；A（第 1 款）、C（第 2 款）正確。\nD：同條第 3 項，竣工後檢附建築師、土木技師或結構技師出具之「太陽光電發電設備工程完竣證明書」報請所在地主管建築機關備查，正確。現行 114 年版移至第 7 條第 2 項、第 8 條，四款內容相同。 【依據】設置再生能源設施免請領雜項執照標準（110.02.08 修正版，113 年考試適用）第 6 條第 2、3 項；現行版（114.01.13 修正）第 7條第 2 項、第 8 條（對照）"},{"c":447,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-5 昇降機與其他設備","h3":"緊急用昇降機","year":114,"no":31,"art":"5-5 昇降機與其他設備","q":"關於緊急用昇降機之設計注意事項，下列敘述何者錯誤？","opts":{"A":"建築物高度超過十層樓以上部分之最大一層樓地板面積，在 1000 m² 以下者，至少應設置一座緊急昇降機","B":"每座昇降機間之樓地板面積不得小於 10 m²","C":"昇降機昇降速度每分鐘不得小於 60 m","D":"機間的四周應為具有一小時以上防火時效之牆壁及樓板，其天花板及牆裝修，應使用耐燃一級材料"},"ans":"A","note":"答案 A（錯誤）。建築技術規則建築設計施工編第 106 條第 1 款：建築物高度超過十層樓以上部分之最大一層樓地板面積，在「一、五○○平方公尺」以下者，至少應設置一座；超過一、五○○平方公尺時，每達三、○○○平方公尺，增設一座。A 寫 1000 m² 錯誤。B 正確：第 107 條第 1 款第 6 目，每座昇降機間之樓地板面積不得小於十平方公尺。C 正確：第 107 條第 8 款，昇降速度每分鐘不得小於六十公尺。D 正確：第 107 條第 1 款第 2 目原文。\n【依據】建築技術規則建築設計施工編第 106 條第 1 款；第 107 條第 1 款第 2 目、第 6 目、第 8 款"},{"c":448,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-5 昇降機與其他設備","h3":"太陽能設施免請雜項執照","year":114,"no":33,"art":"5-5 昇降機與其他設備","q":"某屋主希望在 3 樓住宅屋頂自行裝設太陽能發電系統與太陽能熱水器，在面對相關法規時，下列何者錯誤？","opts":{"A":"若本案光電板的高度自屋頂面起算為 2.5 m，得免依建築法規定申請雜項執照","B":"若本案光電板設置在屋頂突出物，其高度自屋頂突出物面起算為 1.0 m，得免依建築法規定申請雜項執照","C":"太陽光電發電設備設置於屋頂，其最大設置範圍以建築物外牆中心線外 1 m 為限，且不得超過建築基地範圍","D":"本案設置於屋頂之太陽能熱水系統產品高度為 2.5 m，得免依建築法規定申請雜項執照"},"ans":"D","note":"答案 D（錯誤）。設置再生能源設施免請領雜項執照標準第 4 條：設置於建築物屋頂之太陽能熱水系統，其高度為「二公尺以下」者，得免依建築法規定申請雜項執照；2.5 m 超過 2 m，不得免請，D 錯。A 正確：第 5 條第1 項第 1 款，屋頂或露臺之光電設備高度自屋頂面起算四點五公尺以下得免請，2.5 m 符合。B 正確：同項第 2 款，屋頂突出物上自其面起算一點五公尺以下，1.0 m 符合。C 正確：第 5 條第 5 項，得視為屋簷，最大設置範圍以外牆中心線或其代替柱中心線外一公尺為限，且不得超過建築基地範圍。 【依據】設置再生能源設施免請領雜項執照標準第 4 條；第 5 條第 1 項第 1 款、第 2 款、第 5 項（114.01.13 修正版）"},{"c":449,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"生態綠網規劃原則","year":103,"no":35,"art":"6-1 綠建築評估","q":"有關生態綠網系統規劃之敘述，下列何者錯誤？","opts":{"A":"綠地面積越大，越能維持健全的動、植物群落","B":"相同面積的綠地，圓形優於細長形，長方形優於正方形","C":"綠地間的距離越接近，越容易進行物種的移動","D":"都市內的綠廊與河川綠地可擔負重要的綠色走廊功能"},"ans":"B","note":"答案 B（錯誤）。依島嶼生物地理學之保育區設計原則，同面積之棲地以形狀集中、周長面積比小者為佳（邊緣效應干擾小、內部棲地大），故圓形優於細長形、正方形亦優於長方形，題述「長方形優於正方形」顛倒。\nA 正確：面積大者物種多且群落穩定；C 正確：棲地間距離近有利物種遷移交流；D 正確：綠廊、河川綠帶可串連棲地，形成生態廊道。考試當時之綠建築評估手冊—基本型（2012 年版）生物多樣性指標亦指出：總綠地面積為生物多樣性最重要之基礎（評分比重最大）、綠地間距離應維持在生物行動半徑內（如青蛙 150 m、甲蟲與伯勞鳥 50m）、以道路兩側樹木綠籬形成連接塊狀綠地之生態綠廊，分別支持 A、C、D。【查證限制】「圓形優於細長形、正方形優於長方形」之形狀原則手冊（2012、2015、2019 年版）均未載，依島嶼生物地理學保育區設計原則（一般原理）。 【依據】綠建築評估手冊—基本型（2012 年版，101 年 2 月）p.15～16（生態綠網、生物行動半徑）、p.18（總綠地面積評分比重最大）、p.26（生態綠廊）；保育區設計原則（一般原理）"},{"c":450,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"混凝土摻料減廢減碳","year":103,"no":37,"art":"6-1 綠建築評估","q":"通常建議在混凝土當中添加下列那些摻料可達到減廢及二氧化碳減量的效果？①矽灰 ②飛灰 ③礦粉 ④爐石粉","opts":{"A":"①④","B":"①③","C":"②④","D":"②③"},"ans":"C","note":"答案 C。飛灰（燃煤電廠副產物）與爐石粉（高爐煉鋼副產物）屬工業副產物，可取代部分水泥作為混凝土摻料，一方面回收利用廢棄物（減廢），一方面減少水泥用量而降低水泥燒製之二氧化碳排放，為綠建築 CO2 減量及廢棄物減量指標常見之優惠手法。①矽灰量少價高、主要用於高強度混凝土，替代水泥比例低；③礦粉（石粉）多作填充料，減碳效果不明顯，故選②④。考試當時之綠建築評估手冊—基本型（2012 年版）CO2 減量指標之再生建材規劃重點 d1「採用爐石粉替代率約 30％的高爐水泥作為混凝土材料」（p.77），廢棄物減量指標規劃重點 5 亦同（p.86），並以高爐水泥替代率計算 CO2 減量比與廢棄物減量比；綠建材解說與評估手冊（2024 年版）表6-1 再生綠建材評定基準，水硬性混合水泥（p.63）與綠混凝土（p.65）可使用之回收材料均明列爐石粉、燃煤飛灰。【查證限制】2012 年版手冊只舉爐石粉（高爐水泥），飛灰依綠建材手冊；矽灰、礦粉不列入之理由依一般原理。 【依據】綠建築評估手冊—基本型（2012 年版）p.77（CO2 減量規劃重點 d1）、p.84（高爐水泥 CO2 減量比 CCR）、p.86（廢棄物減量規劃重點 5）；綠建材解說與評估手冊（2024 年版）p.63、p.65 表 6-1"},{"c":451,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"綠建築外殼節能 EEV","year":103,"no":38,"art":"6-1 綠建築評估","q":"綠建築標章中外殼節能設計 EV 相較於現行法令合格基準 EVc 強化多少%？","opts":{"A":"10","B":"20","C":"30","D":"40"},"ans":"B","note":"答案 B。考試當時之綠建築評估手冊—基本型（2012 年版）日常節能指標：本指標對建築外殼節能之要求比現行「建築技術規則」之節能基準強化約 20％（p.50）；外殼節能第二項評估「強化建築外殼節能指標 20%」要求外殼耗能計算值 EV 比現行法令合格基準值 EVc 強化 20％，以 EEV＝EV／EVc≦EEVc＝0.8 判定（式 2-4.2，p.53）。版本差異：2019 年版改為 EEV＝(EVc－EV)／(EVc－EVmin)≧0.2（式 2-4.4，p.58；附表 3 修正概要第 1點，p.149），仍是「強化 20%」之意。A、C、D 均非手冊規定值。 【依據】綠建築評估手冊—基本型（2012 年版）p.50、p.53 式 2-4.2；同手冊 2019 年版 p.57～58 式 2-4.4、附表 3 修正概要 p.149"},{"c":452,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"生態社區評估 EEWH-EC","year":103,"no":39,"art":"6-1 綠建築評估","q":"綠建築之生態社區（EEWH-EC）評估系統包括五大軸向，分別為：①生態、②節能減廢、③健康舒適、④社區機能、⑤治安維護。今欲對於非住宅為主的社區、街廓建築群（如商業區或科學園區）進行評估，則需進行那些項目評估？","opts":{"A":"①③④","B":"①②③","C":"①③⑤","D":"①②④⑤"},"ans":"B","note":"答案 B。綠建築評估手冊—社區類（EEWH-EC）第一章：本系統適用於純住宅為主的社區，也適用於商業區、科學園區等非住宅為主的街廓建築群；五大範疇中之社區機能、治安維護僅適用於純住宅為主的社區，故非住宅型社區只需進行「物理環境」三項評估範疇，即①生態、②節能減廢、③健康舒適（2015 年版 p.10；2019 年版p.16 相同）。純住宅社區評五大範疇，鄉村型住宅社區可排除治安維護採四大範疇。A、C、D 均納入居住為主之軸向或遺漏節能減廢。【版本註記】社區類 2012 年版本機未取得，以 2015 年版為最接近版本。 【依據】綠建築評估手冊—社區類 EEWH-EC（2015 年版）p.10、圖 1-4.8；同手冊 2019 年版 1-7-2 p.15～16、圖 1.13"},{"c":453,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"廢棄物減量指標","year":104,"no":35,"art":"6-1 綠建築評估","q":"有關綠建築廢棄物減量指標，下列何者不包括在內？","opts":{"A":"工程廢棄土","B":"施工廢料","C":"拆除之固體廢棄物","D":"施工之排放水"},"ans":"D","note":"答案 D。考試當時之綠建築評估手冊—基本型（2015 年版）2-6 廢棄物減量指標：本指標針對「工程平衡土方、施工廢棄物、拆除廢棄物之固體廢棄物以及施工空氣污染等四大營建污染源」評估，營建污染指標 PI＝PIe（工程不平衡土方）＋PIb（施工廢棄物）＋PId（拆除廢棄物）＋PIa（施工空氣污染）－β。對應選項：工程廢棄土（A）＝不平衡土方，施工廢料（B）＝施工廢棄物，拆除之固體廢棄物（C）＝拆除廢棄物，三者都是評估對象。施工排放水（D）不是四大污染源之一；手冊只把「營建廢水處理」列為公害防治係數 β 的加分措施之一，把工地洗車污水的污泥沈澱過濾設施列為空氣污染防制措施的加權項目，並不評估排放水本身，故選 D。 【依據】綠建築評估手冊—基本型（2015 年版）2-6 廢棄物減量指標 p.88～89（規劃重點 14、15 工地洗滌與污泥沈澱過濾）、p.89～90（式 2-6.2、β 公害防治係數）、p.92（表 2-6.4 空氣污染防制措施）"},{"c":454,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"生物多樣性指標","year":104,"no":37,"art":"6-1 綠建築評估","q":"下列生物多樣性指標之敘述，何者錯誤？","opts":{"A":"一公頃以上建築開發案才能適用","B":"生物移動障礙這項分類為指標中扣分項目","C":"透過小生物物種提升作為本指標評估依據","D":"指標基準值是依照基地條件所屬類型而有所不同"},"ans":"C","note":"答案 C。考試當時之綠建築評估手冊—基本型（2015 年版）2-1.2：本指標規定基地面積一公頃以上之建築開發案才適用（A 正確），只「透過綠地品質的提升來掌握生物多樣性活動的生態基盤」，以生態綠網、小生物棲地、植物多樣性、土壤生態、照明光害、生物移動障礙六項評估（p.15），即依棲地與綠地設計計分，不以實際觀測之小生物物種增加為依據，故 C 錯。B 正確：表 2-1.1「生物移動障礙」（道路沿線障礙、橫越道路障礙等）為 -4～0 分之扣分項（p.17、p.24）。D 正確：表 2-1.2 基準值 BDc 依基地條件分 A～E 類（50～70 分，p.18）。2019年版已廢除生物移動障礙項目。 【依據】綠建築評估手冊—基本型（2015 年版）2-1.2 p.15、表 2-1.1 p.16～17、2-1.3(6) p.24、表 2-1.2 p.18；同手冊 2019 年版附表 3 修正概要 p.149"},{"c":455,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"熱島減緩—地表輻射因子","year":104,"no":39,"art":"6-1 綠建築評估","q":"在綠建築評估手冊住宿類中，下列何者不是熱島減緩效益評估中「地表輻射因子」所評估的項目？","opts":{"A":"隔熱優良之不透光涼亭、開放迴廊、遮簷之屋面","B":"有特殊高反射隔熱處理或淺色之涼屋頂","C":"以灑水或噴霧冷卻處理之鋪面或路面","D":"透水鋪面"},"ans":"一律給分（原公告答案 A）","note":"本題一律給分（原公告 A）。熱島減緩效益見綠建築評估手冊—社區類（2015 年版）表 2-2.2「熱島減緩效益係數 HIi」（p.25）：「地表輻射因子」列特殊高反射隔熱或淺色之涼屋頂（B）、以灑水或噴霧冷卻處理之鋪面或路面（C）、透水型鋪面或路面（D）；隔熱優良之不透光涼亭、開放迴廊、遮簷之屋面（A）屬「地表遮蔭因子」。依此表原答案 A 可成立。送分理由考選部未公布，推測與題目指稱「住宿類」手冊有關。【查證限制】住宿類 2015 年版本機未取得，2019 年以後之住宿類手冊均無此評估，無法確認當時住宿類是否載有此表。 【依據】綠建築評估手冊—社區類 EEWH-EC（2015 年版）表 2-2.2 p.25；同手冊 2019 年版表 2-2.2、表 2-2.3 p.30（涼亭等遮蔭項目改列表 2-2.3 戶外遮蔭係數）；住宿類考試當時版本本機未取得"},{"c":456,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"照明節能再生能源優惠","year":104,"no":40,"art":"6-1 綠建築評估","q":"綠建築標章照明節能評估中，同時針對太陽能、風力等再生能源提供特別優惠係數，故此類再生能源以其節約發電量之多少倍計算於照明節能 β1 係數中？","opts":{"A":"5","B":"10","C":"15","D":"20"},"ans":"D","note":"答案 D。考試當時之綠建築評估手冊—基本型（2015 年版）照明節能以 EL＝IER×IDR×(1.0－β1－β2－β4)≦0.8 評估（式 2-4.9，p.65），其中 β1＝20.0×再生能源節能比例 Rr（p.66；表 2-4.10，p.64）；手冊並說明太陽能、風力、汽電共生等再生能源「以其節約發電量之二十倍」計算列於 β1 係數，空調與照明可重複優惠（p.66～67）。故為 20 倍。版本差異：2019 年版改為 EL＝IER×IDR×(1.0－β2－δ1－δ2)≦1.0（式 2-4.17），再生能源改列β2，自用型 16 倍、賣電型 8 倍（p.67、表 2-4.10 p.72）。 【依據】綠建築評估手冊—基本型（2015 年版）式 2-4.9 p.65、p.66～67、表 2-4.10 p.64；同手冊 2019 年版 p.67、表 2-4.10 p.72、式 2-4.17 p.75"},{"c":457,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"照明節能 IER 考量因子","year":105,"no":36,"art":"6-1 綠建築評估","q":"綠建築標章之照明節能評估中，下列何者非燈具效率係數 IER 所考量的設計因子？","opts":{"A":"晝光率","B":"安定器種類","C":"照明設備控制種類","D":"燈具種類"},"ans":"A","note":"答案 A。考試當時之綠建築評估手冊—基本型（2015 年版）照明節能 EL＝IER×IDR×(1.0－β1－β2－β4)≦0.8（式 2-4.9），其中燈具效率係數 IER＝(Σni×wi×Bi×Ci×Di)／(Σni×wi)（式 2-4.11）：Bi 為安定器係數（表 2-4.11，B）、Ci 為照明控制係數（表 2-4.12，C）、Di 為燈具效率係數（表 2-4.13，D）（p.65～67）。晝光率屬開窗與室深決定之自然採光條件，不是 IER 的變數（晝光利用僅經晝光感知控制之 Ci 間接反映），故選 A。版本註記：\n2019 年版已刪除安定器係數 Bi（附表 3 第 15 點）。 【依據】綠建築評估手冊—基本型（2015 年版）式 2-4.9、式 2-4.11、表 2-4.11～2-4.13（p.65～67）；同手冊 2019 年版附表 3 修正概要第 15 點（p.150）"},{"c":458,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"廢棄物減量指標評估範圍","year":105,"no":38,"art":"6-1 綠建築評估","q":"下列何者非綠建築標章中廢棄物減量指標之評估範圍？","opts":{"A":"舊建築再利用","B":"粒狀污染物防治措施","C":"工程不平衡土方比例","D":"耐久性設計項目"},"ans":"D","note":"答案 D。綠建築評估手冊之「廢棄物減量指標」著眼於工程不平衡土方、施工廢棄物、拆除廢棄物之固體廢棄物以及施工空氣污染等四大營建污染源，以營建污染指標 PI＝PIe＋PIb＋PId＋PIa－β 評估：PIe 工程不平衡土方比例（C）、PIb 施工廢棄物比例、PId 拆除廢棄物比例、PIa 施工空氣污染比例（依表 2-6.4「建築工程各項粒狀污染物防制措施效率」評估，B）；「舊建築再利用」另以舊結構再利用率 Sr 計算系統得分（A）。耐久性設計（柱樑、樓板鋼筋保護層加厚、管線維修性等，耐久化係數 D 與表 2-5.4）屬「CO2 減量指標」（結構合理化、建築輕量化、耐久化、再生建材使用）之評估項目，不屬廢棄物減量指標，故選 D。（以考試當時之 2015 年版查證；式2-6.2 架構與 2019 年版相同。） 【依據】綠建築評估手冊－基本型（2015 年版）2-6.2 廢棄物減量指標評估法 式(2-6.1a)～(2-6.2d)、表 2-6.4（手冊頁 89～92）；2-5 CO2 減量指標 耐久化規劃重點 c1～c7（p.76）、式(2-5.5)（p.79）、表 2-5.4 耐久化係數（p.84）"},{"c":459,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"住宿類日常節能—固定耗能設備","year":106,"no":35,"art":"6-1 綠建築評估","q":"綠建築評估手冊－住宿類中，在日常節能指標中納入具有節能潛力的「固定耗能設備」進行評估，下列選項何者非手冊內固定耗能設備？①熱水設備 ②烹飪設備 ③冷藏設備 ④沐浴設備 ⑤熱水管保溫 ⑥空調設備","opts":{"A":"①⑤","B":"②⑤","C":"③⑥","D":"①④"},"ans":"C","note":"答案 C（③⑥）。住宿類（EEWH-RS）日常節能指標將熱水、廚房、衛浴等固定型耗能設備納入評估：綠建築評估手冊—住宿類（2019 年版）2-4.2.4 表 2-4.2「固定耗能設備節能得分」列熱水設備 Eq1（①）、熱水管保溫 Eq2（⑤，保溫材 U 值＜4.1 W/m²K）、烹飪設備 Eq3（②）、沐浴設備 Eq4（④）、節能電梯 Eq5（p.27～28）。冷藏設備屬住戶自購之非固定家電，不在評估範圍；空調另以空調節能分項評估，不屬固定耗能設備，故③⑥ 非手冊內固定耗能設備。【版本註記】考試當時之住宿類 2015 年版本機未取得，以 2019 年版為最接近版本。 【依據】綠建築評估手冊—住宿類 RS（2019 年版）2-4.2.4、式 2-4.14、表 2-4.2（p.27～28）；綠建築評估手冊 2015 年版修正概要（EEWH-RS：固定耗能設備節能得分表格修正）"},{"c":460,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"社區類熱島—地面蒸發冷卻","year":106,"no":36,"art":"6-1 綠建築評估","q":"在綠建築評估手冊－社區類中，為了減緩熱島效應採用之技術手法，下列何者屬於「地面蒸發冷卻設計」之項目？\n①湖泊、溪流、水池 ②透水鋪面 ③喬木綠化之屋頂、地面 ④U 值 < 3 W/m²K 之屋頂","opts":{"A":"①②","B":"③④","C":"②④","D":"①③"},"ans":"D","note":"答案 D（①③）。考試當時之綠建築評估手冊—社區類（2015 年版）表 2-2.2「熱島減緩效益係數 HIi」把熱島減緩手法分為蒸發冷卻、地表遮蔭、地表輻射三類因子：「蒸發冷卻因子」列湖泊、溪流、水池等水面（HIi＝1.0，①）及喬木綠化之地面、屋面（1.0，③）等；透水型鋪面或路面（②）列於「地表輻射因子」；屋面 U 值＜3.0 W/(m²K) 之隔熱優良涼亭、遮簷等（④）列於「地表遮蔭因子」（p.25）。故屬地面蒸發冷卻者為①③。2019年版表 2-2.2 分類相同（p.30）。 【依據】綠建築評估手冊—社區類 EEWH-EC（2015 年版）表 2-2.2 p.25；同手冊 2019 年版表 2-2.2、表 2-2.3 p.29～30"},{"c":461,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"CO₂ 減量—耐久化設計","year":106,"no":37,"art":"6-1 綠建築評估","q":"綠建築標章的二氧化碳減量指標中，耐久性的設計有助於延長建築的壽命，下列何者非提升耐久性之設計因子？","opts":{"A":"提升建築耐震力設計","B":"提升 RC 構造柱梁部位保護層厚度","C":"建築隔間輕量化","D":"所有管路明管化設計"},"ans":"C","note":"答案 C。考試當時之綠建築評估手冊－基本型 2015 年版「CO₂ 減量指標」：建築物 CO₂ 減量最有效的對策在於節約建材使用量，其影響因素分為「結構合理化」、「建築輕量化」、「耐久化」與「再生建材使用」四大範疇（p.75）。其中「耐久化」的規劃重點為：c1 結構體設計耐震力提高 20～50％、c2 柱樑鋼筋之混凝土保護層增加1～2 cm、c3 樓板保護層增加 1～2 cm、c4 屋頂設備以懸空結構支撐與防水層分離、c5 空調設備管路明管設計、c6給排水衛生管路明管設計、c7 電氣通信線路開放式設計（p.76），對應 A、B、D。C「建築隔間輕量化」屬「建築輕量化」範疇（b2 採用輕量乾式隔間，p.75），並非耐久化因子。計算上，耐久化係數 D＝Σdi 且 D≦0.2，各因子di 見表 2-5.4（耐震力高於規範 15％ 以上 0.05、30％ 以上 0.10；柱樑或樓板保護層每增加 0.5 cm 得 0.02～0.05；管路全部明管設計 0.03～0.05 等，p.79、p.84）。【版本註記】依考試當時之 2015 年版；2019 年版耐久化項目架構相同。 【依據】綠建築評估手冊－基本型 2015 年版 p.75～76（CO₂ 減量規劃重點）、p.79（式 2-5.5）、p.84（表 2-5.4 耐久化係數）"},{"c":462,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"節能玻璃遮蔽係數","year":107,"no":3,"art":"6-1 綠建築評估","q":"有關高性能綠建材中節能玻璃之敘述，下列何者錯誤？","opts":{"A":"遮蔽係數 Sc 值越高，代表玻璃建材阻擋外界熱能進入之性能越好","B":"3 mm 清玻璃的遮蔽係數 Sc 值較 3 mm 反射玻璃來得大","C":"可見光反射率越高，代表玻璃建材造成周遭環境光害之程度越大","D":"可見光穿透率越高，代表太陽光轉為有效室內採光之效益越大"},"ans":"A","note":"答（A）。綠建材解說與評估手冊（2024 年版）高性能節能綠建材：遮蔽係數 Sc＝玻璃試件日光輻射熱取得係數 η／3 mm 透明玻璃之 ηs（一般以 0.88 為基準），即 3 mm 清玻璃 Sc＝1.0；遮蔽係數越低代表阻擋外界熱能進入之性能越好（節能玻璃基準 Sc≦0.35），故（A）說反。（B）反射玻璃以鍍膜反射日射，Sc 小於清玻璃，正確。\n（C）可視光反射率越高，造成環境光害之程度愈大（基準≦0.20），正確。（D）可視光透射率愈高，轉為有效室內照明之效益愈大（基準≧0.50），正確。【版本註記】節能玻璃自 2011 年版綠建材手冊納入高性能類，考試當時版本本機未取得，以 2024 年版核對。 【依據】綠建材解說與評估手冊（2024 年版公告版 3）第七章 高性能節能綠建材 p.92～93（遮蔽係數、可視光反射率、可視光透射率）、p.6（2011 年版加入節能玻璃）"},{"c":463,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"綠化量 β 值","year":107,"no":36,"art":"6-1 綠建築評估","q":"綠化量指標中總二氧化碳固定量基準值 TCO2c＝1.5×(0.5×A’×β)，其中 β 為單位綠地 CO2 固定量基準（kg/m2），依使用分區或用地而有所不同，故當進行校園規劃設計時，應選用 β 值為何？","opts":{"A":"300(kg/ m2)","B":"400(kg/ m2)","C":"500(kg/ m2)","D":"600(kg/ m2)"},"ans":"C","note":"答（C）。綠化量指標以基地綠化之二氧化碳固定量評估，基準值 TCO2c＝1.5×(0.5×A’×β)，A’ 為（基地面積－執行綠化有困難之面積）×（1－法定建蔽率），β 為單位綠地 CO2 固定量基準，依使用分區或用地別給定，其數值即建築技術規則建築設計施工編第 302 條之「二氧化碳固定量基準值」表（綠化量檢討表亦註明 β 查該條）。\n考試當時適用之第 302 條（101 年 5 月 11 日修正版本，經全國法規資料庫歷史條文核對）：學校用地、公園用地500 kg/m2；商業區、工業區（不含科學園區）300 kg/m2；前二類以外之建築基地 400 kg/m2。故校園規劃應選用500。（A）300 為商業區、工業區；（B）400 為其他建築基地；（D）600 不在表列。公式中之 1.5 為綠建築標章評估之加嚴倍數。另現行第 302 條（108 年 8 月 19 日修正、110 年 1 月 1 日施行）已改為「固碳當量基準值」（學校用地、公園用地 0.83；商業區、工業區 0.50；其他 0.66 kg/(m2·年)），三類之高低順序不變；考試當時之綠建築評估手冊基本型（2015 年版）式 2-2.3 明訂 TCO2c＝1.5×法定基準值＝1.5×（0.5×A’×β），表 2-2.1 β（kg/m2）學校用地、公園用地 500（p.29～30）；2019 年版起 β 改為固碳當量。 【依據】建築技術規則建築設計施工編第 302條（101 年 5 月 11 日修正版本；現行 108 年 8 月 19 日修正版本）；綠建築評估手冊基本型（2015 年版）式 2-2.3p.29、表 2-2.1 p.30；同手冊 2019 年版式 2-2.3"},{"c":464,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"綠建材分類","year":107,"no":37,"art":"6-1 綠建築評估","q":"有關綠建材之敘述，下列何者錯誤？","opts":{"A":"低 TVOC 逸散的建材屬於健康綠建材","B":"天然纖維隔熱材屬於生態綠建材","C":"竹子快速生長且不虞匱乏，屬於再生綠建材","D":"透水率佳、耐久安全性高的透水磚屬於高性能綠建材"},"ans":"C","note":"答（C）。依綠建材設計技術規範 3.5 用詞定義：3.5.1 生態性指運用自然材料，具備無匱乏疑慮、低環境衝擊之性能；3.5.2 再生性指由廢棄材料回收再生產之性能。竹子為天然材料、生長快速不虞匱乏，屬「生態綠建材」，而非由廢棄物回收再製之「再生綠建材」，故（C）錯誤。（A）3.5.4 健康性：低甲醛及低 TVOC 逸散，正確。（B）天然纖維隔熱材屬自然材料，為生態綠建材，正確。（D）3.5.5 高性能包括透水性等特殊性能，透水磚屬高性能綠建材，正確。 【依據】綠建材設計技術規範 3.5.1、3.5.2、3.5.4、3.5.5"},{"c":465,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"雨水貯留利用率基準值","year":108,"no":37,"art":"6-1 綠建築評估","q":"依據建築物雨水貯留利用設計技術規範，總樓地板面積大於一萬平方公尺以上之新建建築物必須設置雨水貯留設施，又雨水貯留利用率 Rc 必須大於雨水貯留利用率基準值 Rcc，Rcc 之基準值為多少%？","opts":{"A":"3","B":"4","C":"5","D":"6"},"ans":"B","note":"答案 B。建築技術規則建築設計施工編第 298 條第 4 款：建築物雨水或生活雜排水回收再利用之適用範圍為總樓地板面積達一萬平方公尺以上之新建建築物（F-1 組等除外）；第 316 條：應就雨水貯留利用系統或生活雜排水回收再利用系統擇一設置，設置雨水貯留利用系統者，其雨水貯留利用率應大於百分之四（生活雜排水回收再利用率應大於百分之三十）。雨水貯留利用率定義見第 299 條第 1 項第 10 款（雨水利用量與建築物總用水量之比例）。題目所稱之建築物雨水貯留利用設計技術規範（101 年版，108 年考試時適用）第 7 點評估基準規定 Rc＞Rcc、Vs≧Vsm，第 8 點參數說明「Rcc：雨水貯留利用率基準值 4%」，依據即設計施工編第 316 條。注意法規實為「雨水貯留利用或生活雜排水回收再利用擇一設置」，題幹「必須設置雨水貯留設施」略有簡化。 【依據】建築技術規則建築設計施工編第 298 條第 4 款、第 299 條第 1 項第 10 款、第 316 條；建築物雨水貯留利用設計技術規範（101 年）第 7、8 點"},{"c":466,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"高性能節能玻璃評定","year":108,"no":38,"art":"6-1 綠建築評估","q":"下列何者與綠建材中高性能節能玻璃之評定要項無關？","opts":{"A":"採光係數","B":"可見光反射率","C":"可見光穿透率","D":"遮蔽係數"},"ans":"A","note":"答案 A。綠建材解說與評估手冊（2024 年版）第七章：高性能節能綠建材之「節能玻璃」評定要項為遮蔽係數（Sc＝η／3 mm 透明玻璃 ηs，一般以 0.88 為基準；基準 Sc≦0.35）、可視光反射率（環境光害，≦0.20）與可視光透射率（有效室內照明，≧0.50），分別對應 D、B、C。採光係數（晝光率）是室內某點照度與同時刻室外全天空水平照度之比，取決於開窗大小、位置與室形，屬空間採光評估指標，不是玻璃材料之評定要項，故無關。【版本註記】節能玻璃自 2011 年版綠建材手冊納入高性能類，考試當時版本本機未取得，以 2024 年版核對。 【依據】綠建材解說與評估手冊（2024 年版公告版 3）第七章 高性能節能綠建材 二、評定要項 p.92、評定基準 p.92～93、表 7-8 p.95；建築技術規則建築設計施工編第 299 條第 1 項第 12 款"},{"c":467,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"綠建材使用率之標章認可","year":109,"no":37,"art":"6-1 綠建築評估","q":"依據綠建材設計技術規範，下列那些標章的產品得列入綠建材使用率之計算？①綠建材標章 ②環保標章 ③節能標章 ④省水標章","opts":{"A":"僅①②","B":"僅①②③","C":"僅①③④","D":"①②③④"},"ans":"A","note":"答案 A。綠建材設計技術規範第 8 點「綠建材認可」：8.1 依環保署環保標章規格標準取得環保標章之窯燒類資源化建材、非窯燒類資源化建材、回收玻璃再生品；8.2 取得內政部綠建材標章之材料；8.3 依經濟部資源再生綠色產品審查認定辦法認定之窯燒磚類、非窯燒磚類、水泥類板材；8.4 其他經中央主管建築機關認定具同等性能者。①綠建材標章、②環保標章均得計入，③節能標章（用電設備能源效率）與④省水標章（用水器材）不是建材標章，不在認可範圍。另考試當時適用之設計施工編第 321 條（101 年 7 月 1 日施行版本）規定室內裝修材料、樓地板面材料及窗之綠建材使用率應達 45%以上、戶外地面 10%以上；108 年 8 月 19 日修正為 60%、20%，延至110 年 1 月 1 日施行。（本機下載版 PDF 製作日期約 2020 年 11 月，與考試當時版本可能略有出入。） 【依據】綠建材設計技術規範第 8.1~8.4 點、表 2；建築技術規則建築設計施工編第 321 條（101 年 7 月 1 日施行版本；108年 8 月 19 日修正條文自 110 年 1 月 1 日施行）"},{"c":468,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"透水性鋪面設計","year":109,"no":38,"art":"6-1 綠建築評估","q":"有關透水性鋪面之設計，下列何者錯誤？","opts":{"A":"透水性鋪面係能使雨水通過人工鋪築之多孔隙鋪面直接滲入地下，而具有使水還原於土地者","B":"透水性鋪面可減輕排水道負擔及延緩洪峰流量","C":"塊狀鋪面，鋪面間有較大之間隙可填入砂土，鋪面下採用透水性底層如礫石及砂土層","D":"透水性鋪面為考量透水成效，避免孔隙阻塞，鋪面應設於滲透係數低之黏土層"},"ans":"D","note":"答案 D。透水鋪面是表層及基層均具有良好透水性能的鋪面，基層由透水性良好的砂石級配構成，雨水才能向下滲入土壤（建築基地保水設計技術規範 3.8、6.2）；若設於滲透係數低（透水性極差）的黏土層上，雨水無法下滲，技術規範指出在透水性極差的黏土層上直接滲透之技術幾乎無法達到保水要求（6.3），所以 (D) 錯誤，應設於滲透係數高之土層。(A)(B) 描述透水鋪面功能（還原水於土地、減輕排水負擔、延緩洪峰），正確。(C) 單元透水鋪面（連鎖磚、石塊等）以乾砌間隙透水，間隙填砂土，下方為砂石級配透水基層，正確。 【依據】建築基地保水設計技術規範 3.8、6.2、6.3"},{"c":469,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"建築碳足跡生命週期","year":109,"no":39,"art":"6-1 綠建築評估","q":"一般建築的碳足跡，在生命週期中的那個階段最高？","opts":{"A":"生產階段","B":"施工階段","C":"使用階段","D":"廢棄階段"},"ans":"C","note":"答案 C。建築生命週期包括建材生產（含運輸）、施工、使用（營運）、拆除廢棄等階段。建築使用壽命長（數十年），空調、照明、電梯、用水等營運耗能累積之碳排放量最大，通常為全生命週期碳排放之最大宗（確切比例因案而異）；建材生產階段（水泥、鋼筋等）次之（所謂「隱含碳」），施工與廢棄階段所占比例較小。課程教材指出：以住宅為例，「日常耗能」在四十年生命週期所累積的耗能量相當大，建築節能政策是 CO₂ 減量政策的最大關鍵；並將建築生命週期能源分為建材生產、建造工程、日常使用、建築物解體、建材再利用，其中解體與再利用比例小，一般只討論前三項。《綠建築評估手冊－基本型》2019 年版 2-5.1（手冊 p.84）亦以「日常節能指標」減少使用階段之 CO₂ 排放、以「CO₂減量指標」減少建材生產與運輸兩階段之排放，並稱兩者為減少建築整體CO₂ 排放最重要的一環。【查證限制】教材談的是耗能而非碳足跡百分比，各階段確切比例因研究而異，故不寫確切數值。 【依據】課程教材：01.建築設備總論（設備與居住環境）.pdf p.15、p.17；綠建築評估手冊－基本型（2019 年版）2-5.1（手冊 p.84）"},{"c":470,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"CO₂減量指標之形狀係數","year":110,"no":11,"art":"6-1 綠建築評估","q":"綠建築標章之二氧化碳減量指標中，下列何者為形狀係數 F 在平面形狀設計時所考量的因子？","opts":{"A":"樓板挑空率","B":"層高均等性","C":"高寬比","D":"立面退縮"},"ans":"A","note":"答案 A。考試當時之綠建築評估手冊－基本型（2019 年版）CO2 減量指標以形狀係數 F 考量建築形狀設計不當引起的建材浪費，依平面規則性與立面規則性評估耐震力（p.89～90）。表 2-5.2「形狀係數 F 與形狀因子 fi」把七項因子分兩類：平面形狀＝1.平面規則性 a、2.長寬比 b、3.樓板挑空率 e；立面形狀＝4.立面退縮 g、5.立面出挑 h、6.層高均等性 i、7.高寬比 j；F＝f1×f2×…×f7 且 F≦1.2，5F 以下免評估（p.90～91）。故平面形狀因子為樓板挑空率（A）；B、C、D 均屬立面形狀因子。 【依據】綠建築評估手冊－基本型（2019 年版）2-5.2 式 2-5.3、表2-5.2 形狀係數 F 與形狀因子 fi（p.89～91）、附表 1-6"},{"c":471,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"綠建材使用率","year":110,"no":12,"art":"6-1 綠建築評估","q":"依據建築技術規則建築設計施工編，有關建築物應使用綠建材，並符合建築物室內裝修材料、樓地板面材料及窗之綠建材使用率，應達總面積多少百分比（%）以上？","opts":{"A":"30","B":"45","C":"60","D":"80"},"ans":"C","note":"答案 C（60%）。建築設計施工編第 321 條第 1 款：建築物室內裝修材料、樓地板面材料及窗，其綠建材使用率應達總面積百分之六十以上（窗未使用綠建材者得不計入總面積檢討）；第 2 款：戶外地面（扣除車道、消防車輛救災活動空間等）之綠建材使用率應達百分之二十以上。故 30、45、80 均非規定值。（本條 108 年 8 月 19 日修正、110 年 1 月 1 日施行，即考試當時適用版本；修正前為 45%、戶外 10%。） 【依據】建築技術規則建築設計施工編第 321 條第 1 款（第 2 款為戶外地面 20%；108 年 8 月 19 日修正、110 年 1 月 1 日施行版本）"},{"c":472,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"建築生命週期碳足跡","year":110,"no":37,"art":"6-1 綠建築評估","q":"建築生命週期各階段中，一般以那個階段的碳足跡比例最高，可做為減碳熱點？","opts":{"A":"建材生產","B":"營建施工","C":"日常使用","D":"更新修繕"},"ans":"C","note":"答案 C。建築生命週期（建材生產、營建施工、日常使用、更新修繕、拆除）中，日常使用（運轉）階段長達數十年，空調、照明、電梯、熱水等耗能所產生之碳排通常占全生命週期之過半，為比例最高的減碳熱點，故節能設計（日常節能、再生能源）最具減碳效益。建材生產（隱含碳）居次；營建施工與更新修繕占比較小。課程教材（01 建築設備總論 p.15）：無論任何住宅類型，「日常耗能」在四十年生命週期所累積的耗能量相當大，建築的節能政策是 CO₂ 減量政策的最大關鍵；p.17 將建築生命週期耗能分為建材生產、建造工程、日常使用、解體與建材再利用。【查證限制】各階段確切百分比因案而異，教材與本機法規均無統一數值，故不寫確切百分比。 【依據】課程教材：01 建築設備總論（設備與居住環境）p.15、p.17（建築生命週期耗能）"},{"c":473,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"基地保水指標設計手法","year":110,"no":38,"art":"6-1 綠建築評估","q":"關於綠建築之基地保水指標，下列敘述何者錯誤？","opts":{"A":"當基地位於透水良好之粉土或砂質土層時，建築空地盡量保留綠地","B":"當基地位於透水不良之黏土層時，建築空地可以設計貯集滲透水池","C":"當基地位於透水良好之粉土或砂質土層時，排水路設計草溝幫助不大","D":"當基地位於透水不良之黏土層時，可以將操場下之黏土層更換為礫石層"},"ans":"C","note":"答案 C（錯誤敘述）。基地保水指標促進基地涵養、貯留、滲透雨水（建築設計施工編第 299 條第 1 項第 3款定義、第 305 條基準）。土層透水良好（粉土、砂質土）時，雨水易入滲，應盡量保留綠地，並以草溝（透水性排水路）、透水鋪面等讓雨水就地滲入，草溝「幫助很大」，C 說「幫助不大」錯誤。建築基地保水設計技術規範7.（11）明定：基地位於透水良好之粉土或砂質土層（k 約 10⁻⁷ m/s 以上）時，適合採「直接滲透設計」，如綠地、被覆地、草溝、透水鋪面、貯集滲透空地、滲透管／陰井／側溝；位於透水不良之黏土質土層（k 約 10⁻⁷ m/s 以下）時，適合採「貯集滲透設計」，如人工地盤花園土壤貯集、貯集滲透空地或景觀貯集滲透池、地下貯集滲透設施。同規範 6.1 稱草溝「是最佳的生態排水工法」；6.5 稱地下貯集滲透（填入礫石或組合式蓄水框架）在透水性能不佳之地質上相當有效，可在學校操場等開闊區域設置。故 A（保留綠地）、B（貯集滲透水池）、D（操場下改為礫石層）均正確。課程教材（14 節水設備計畫 p.34）同樣將基地保水設計分為「直接滲透設計」與「貯集滲透設計」兩大類。 【依據】建築基地保水設計技術規範 6.1、6.5、7.（11）；建築技術規則建築設計施工編第 299 條第 1 項第 3 款、第 305 條；課程教材：14 節水設備計畫 r p.34（基地保水設計）"},{"c":474,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"基地保水設計之目的","year":110,"no":39,"art":"6-1 綠建築評估","q":"下列何者不屬於綠建築基地保水設計之主要目的？","opts":{"A":"改善土壤生態","B":"降低都市洪患","C":"節約生活用水","D":"減緩熱島效應"},"ans":"C","note":"答案 C。基地保水指標（建築設計施工編第 298 條第 2 款：促進建築基地涵養、貯留、滲透雨水功能之設計）之目的在讓雨水就地滲入土壤、貯留，以改善土壤生態（A）、涵養地下水、減少逕流而降低都市洪患（B）、增加土壤與植栽蒸發散而減緩熱島效應（D）。建築基地保水設計技術規範 2.1 亦明列其目的為「改善土壤生態環境、調節環境氣候、降低地表逕流」，分別對應 A、D、B。節約生活用水屬於「水資源指標」之雨水／中水回收利用範疇，並非基地保水的主要目的。 【依據】建築基地保水設計技術規範 2.1；建築技術規則建築設計施工編第298 條第 2 款；第 305 條；課程教材：14 節水設備計畫 r p.34（基地保水性能：涵養水分及貯集滲透雨水）"},{"c":475,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"綠建築空調節能—熱源系統","year":111,"no":26,"art":"6-1 綠建築評估","q":"有關綠建築標章中空調設備節能的規劃重點，下列何者不是屬於熱源系統之節能技術？","opts":{"A":"冰水主機台數控制系統","B":"吸收式冷凍機","C":"CO₂ 濃度外氣量控制系統","D":"變頻無段變速之 VAV 系統"},"ans":"D","note":"答案 D。綠建築評估手冊－基本型（2019 年版初刷）中央空調評估式為 EAC＝{PRs×[主機效率比]＋PRf×[送風耗電比]＋PRp×[送水耗電比]＋PRt}×R≦0.9，R＝1－(Rs＋Rf＋Rp＋Rt＋Rm)，其中 Rs、Rf、Rp 分別為熱源、送風、送水系統之節能優惠效率。課程教材所列「綠建築空調設備節能評估 2020 新法」系統節能技術：α1 冰水主機運轉（台數）控制、α2 變頻主機、α3 CO₂ 濃度外氣量控制系統、α4 全熱交換器系統、α5 外氣冷房系統、α6 其他熱源節能系統（例如廢熱加熱式吸收式冷凍機），α1～α6 為熱源側之節能項目（由 α6 名為「其他熱源節能系統」可知同屬熱源類）；α7 變風量系統（VAV）之後教材即標示「送風系統節能效率 Rf」，α8 冰水變流量、α9 冷卻水泵變頻之後標示「送水系統節能效率 Rp」（教材表中 α 下標與標示式之編號差一號，屬教材排版問題，不影響分類）。綠建築評估手冊－基本型（2019 年版初刷）原文更明確：式 2-4.13b～c 定義 Rs＝Σ（αj × rj）、Rf＝Σ（α7 ×r7），表 2-4.10「空調節能技術簡易評估表」把 α1～α6（含 α3 CO₂ 濃度外氣量控制系統、α6 其他熱源節能系統所舉之廢熱加熱式吸收式冷凍機）列於「熱源系統節能效率 Rs」之下，α7 變風量系統（VAV）列於「送風系統」；\n手冊計算例並寫明「該棟建築物全面採用變頻無段變速系統，Rf＝0」，與 D 項用語相同。故 A、B、C 依手冊分類屬熱源系統節能技術（C 因減少外氣負荷而降低主機負荷），D 屬送風系統。（版本註記：2019 年版第三版第二刷自 111 年 3 月 1 日起實施，已改為 EAC＝{…}－R、R＝Σαi × ri，不再分 Rs／Rf，表 2-4.10 也不再單列主機台數控制（併入 BEMS 功能要求）與吸收式冷凍機；本題用語與 2019 年版初刷相符，解析依初刷分類。）注意：若依一般空調裝置分類（課程教材表 6-16），外氣量偵控屬空氣處理裝置，作答時應以綠建築手冊之 Rs／Rf 分類為準。\n【依據】綠建築評估手冊－基本型（2019 年版初刷）式 2-4.13a～f p.65（PDF 第 71 頁）、表 2-4.10 p.70～72（PDF第 76～78 頁）、計算例 p.80～81；綠建築評估手冊－基本型（2019 年版第三版第二刷）式 2-4.13 p.66、表 2-4.10p.70～71；課程教材：08 空調節能計畫 p.4、18～21、51"},{"c":476,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"綠建築廠房類—綠色交通","year":111,"no":36,"art":"6-1 綠建築評估","q":"依據綠建築評估手冊－廠房類，下列何者不是綠色交通之評估要項？","opts":{"A":"大眾交通工具，如捷運、公車","B":"非石化交通工具使用，如電動汽車、電動摩托車","C":"自行車租賃制度、自行車停車場設置","D":"人行專用步道系統規劃"},"ans":"D","note":"答案 D。綠建築評估手冊－廠房類 GF（2019 年版）2-2.3 綠色交通指標：各國作法大多為大眾交通工具、非石化交通工具之使用，及合租共乘、電動車、自行車道系統等；表 2-2.3「綠色交通簡易評估表」共 8 小項：1.捷運或公車（A）、2.廠房公車或制度化汽車共乘、3.電動汽車或電動摩托車專用停車場與加電站（B）、4.自行車租用制度、5.自行車道、6.自行車停車場（C）、7.雇用在地居民、8.提供員工宿舍，得 5 項以上即滿分（p.24）。表中並無人行專用步道系統，故選 D。 【依據】綠建築評估手冊－廠房類 GF（2019 年版）2-2.3、式 2-2.10、表 2-2.3綠色交通簡易評估表（p.24）"},{"c":477,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"景觀貯集滲透水池","year":111,"no":38,"art":"6-1 綠建築評估","q":"有關綠建築評估之景觀貯集滲透水池設計，下列敘述何者錯誤？","opts":{"A":"具備讓雨水暫時貯存於水池，然後再慢慢以自然滲透方式滲入大地土壤","B":"景觀貯集滲透水池，可適用於滲透不良的土壤","C":"通常將水池設計成高低水位兩部分，低水位部分底層以透水層為之","D":"其水面在下雨後會擴大，以暫時貯存高低水位間的雨水，然後讓之慢慢滲透回土壤"},"ans":"C","note":"答案 C（錯誤）。建築基地保水設計技術規範 6.4：景觀貯集滲透水池是具滲透功能的滯洪池，讓雨水暫時貯存後慢慢自然滲入土壤；「貯集滲透空地」只適用於滲透性良好的土壤，而「景觀貯集滲透水池」也可適用於滲透不良的土壤（B 正確）。水池通常設計成高低水位二部分，「低水位部分底層以不透水層為之」（以維持常態景觀水池），高水位部分四周則為自然緩坡土壤，下雨後水面擴大、暫時貯存高低水位間的雨水再慢慢滲透（A、D正確）。C 把低水位底層說成透水層，與規範相反。 【依據】建築基地保水設計技術規範 3.10、6.4（本機參考法規來源／建築基地保水設計技術規範.pdf）"},{"c":478,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"防音綠建材評估要項","year":112,"no":3,"art":"6-1 綠建築評估","q":"有關綠建材標章之防音綠建材評估要項，下列敘述何者正確？","opts":{"A":"防音綠建材是歸屬於高性能綠建材標章","B":"外牆、屋頂板、分戶牆、分間牆之基準為 Rw ≧ 36 dB","C":"窗、門之基準為 Rw ≧ 52 dB","D":"樓板表面材之基準為 αw ≧ 0.8"},"ans":"A","note":"答案 A。依綠建材解說與評估手冊（2024 年版）第七章，高性能綠建材分高性能防音、透水、節能三類（p.68），防音綠建材屬高性能綠建材，A 正確；設計施工編第 46-3、46-4、46-6 條亦以「高性能綠建材（隔音性）」為隔音構造之認可途徑。同手冊表 7-2 高性能防音綠建材評定基準（p.77）：外牆、屋頂板、分戶牆、分間牆 Rw ≧ 52 dB；窗、門 Rw ≧ 36 dB；樓板表面材（含緩衝材）ΔLw ≧ 21 dB；吸音材 αw ≧ 0.8。故 B、C 把牆與窗門之基準對調，D 把吸音材之 αw 基準套到樓板表面材，皆錯。【查證限制】本機僅有 2024 年版（序言載防音基準有修訂），考試當時版本之數值未另核對。 【依據】綠建材解說與評估手冊（2024 年版）第七章 p.68、表 7-2p.77；建築技術規則建築設計施工編第 46-3 條第 1 項第 4 款、第 46-4 條第 1 項第 4 款、第 46-6 條第 1 項第 1 款第7目"},{"c":479,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"日常節能之照明節能評估項目","year":112,"no":13,"art":"6-1 綠建築評估","q":"根據 2019 年版綠建築評估手冊之照明節能評估指標，下列何者並非評估項目？","opts":{"A":"照明功率密度基準","B":"空間面積","C":"燈具功率","D":"平均照度"},"ans":"D","note":"答案 D。依綠建築評估手冊－基本型（2019 年版第三版第二刷，111 年 3 月 1 日起實施）2-4.2.3 照明系統節能之評估（p.74）式 2-4.17：EL ＝（Σnij × wij）／（ΣLPDi × Ai）× β ≦ 0.8，且 EL ≧ 0.4。nij、wij 為各主要作業空間之燈具數量與燈具功率（C），Ai 為空間樓地板面積（B），LPDi 為照明功率密度基準（A，表 2-4.13，p.75），β 為照明能源管理優惠係數。公式中沒有平均照度，故 D 並非評估項目；照度屬照明設計條件，不是本指標之評估變數。 【依據】綠建築評估手冊－基本型（2019 年版第三版第二刷）2-4.2.3、式 2-4.17、表 2-4.13（p.74～75）"},{"c":480,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"雨水收集量計算","year":112,"no":25,"art":"6-1 綠建築評估","q":"某建商將規劃雨水收集回收之量能，目前已知基地日降雨量為 6.5 mm/日，可集雨面積為 1500 m²，日降雨概率為0.3，該區日集雨量為多少公升/日？","opts":{"A":"2900","B":"2925","C":"2950","D":"2975"},"ans":"B","note":"答案 B。依建築物雨水貯留利用設計技術規範第 8 點式(5)：日集雨量 Wr ＝ R × Ar × P（R：日平均降雨量mm/日；Ar：集雨面積 m²；P：日降雨概率）。1 mm 雨量落在 1 m² 為 1 公升，故 Wr ＝ 6.5 × 1500 × 0.3 ＝ 9750 ×0.3 ＝ 2925 公升/日。驗算：6.5 × 1500 ＝ 9000 ＋ 750 ＝ 9750；9750 × 0.3 ＝ 975 × 3 ＝ 2925。課程教材 14 節水設備計畫 p.28「台灣各測站雨水貯集設計查核表」亦以各地日平均雨量與日降雨概率為計算輸入值（與規範表 3 相同）。 【依據】建築物雨水貯留利用設計技術規範（101 年版，本機原文）第 8 點式(5)；課程教材：14 節水設備計畫 p.28"},{"c":481,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"日常節能之空調系統評估","year":112,"no":29,"art":"6-1 綠建築評估","q":"依據 2019 年版綠建築標章的日常節能指標，空調系統節能之評估不包括下列何項目？","opts":{"A":"中央空調系統","B":"個別空調系統","C":"變風量系統","D":"空氣清淨機"},"ans":"D","note":"答案 D。依綠建築評估手冊－基本型（2019 年版第三版第二刷）2-4.2.2 空調系統節能之評估（p.58 起），空調系統依（一）中央空調系統、（二）個別空調系統（窗型或分離式，p.72）、（三）負壓風扇系統分別評估；中央空調系統之節能技術優惠表並列有 AHU 變風量等空氣側變風量系統（p.70），故 A、B、C 均屬評估內容。空氣清淨機為室內空氣淨化設備，不屬空調系統節能評估項目，故選 D。課程教材 08 空調節能計畫 p.2、p.10、p.28、p.60 亦同（日常節能分外殼、空調、照明三種評估法；中央空調 EAC 式；個別空調含 VRF；可變風量方式）。\n【依據】綠建築評估手冊－基本型（2019 年版第三版第二刷）2-4.2.2（p.58、p.70、p.72）；課程教材：08 空調節能計畫 p.2、p.10、p.28、p.60"},{"c":482,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"綠建築基準之適用範圍與免檢討","year":112,"no":39,"art":"6-1 綠建築評估","q":"根據建築技術規則「綠建築基準」，規範範圍內需檢討評估的建築，下列那一敘述正確？","opts":{"A":"基地面積 100 m² 以下者，方能免檢討基地綠化","B":"根據技術規則所屬之山坡地建築，需執行基地保水設計手法，以維持山坡地水土保持","C":"地下水位小於 1 m 之建築基地，可免檢討建築基地保水","D":"學校類建築樓地板面積低於 1000 m² 者，可免檢討建築外殼節能 AWSG"},"ans":"C","note":"答案 C。建築技術規則設計施工編第 298 條規定適用範圍：①建築基地綠化：新建建築物，但個別興建農舍及基地面積三百平方公尺以下者不在此限，故 A 之「100 m²」錯誤，應為 300 m²；②建築基地保水：新建建築物，但第十三章山坡地建築、地下水位小於一公尺之建築基地、個別興建農舍及基地面積三百平方公尺以下者，不在此限，故山坡地建築免檢討（B 錯），地下水位小於 1 m 者可免檢討（C 正確）；③建築物節約能源：學校類、大型空間類、住宿類建築物一律適用，其他各類須同一幢或連棟新增建部分之地面層以上樓地板面積合計超過 1000m²，故學校類不論面積大小均須檢討（D 錯）。AWSG 即「窗面平均日射取得量」（第 299 條第 8 款），學校類之AWSG 基準見第 311 條。 【依據】建築技術規則建築設計施工編第 298 條第 1 款、第 2 款、第 3 款；第 299 條第8 款；第 311 條"},{"c":483,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"永續發展定義","year":114,"no":35,"art":"6-1 綠建築評估","q":"下列何者為我國對永續發展之定義？","opts":{"A":"對地球環境負荷最小、對人類身體健康無害","B":"生態、節能、減廢、健康","C":"能夠滿足當代的需要，且不致危害到未來世代滿足其需要的發展","D":"消耗最少地球資源，製造最少廢棄物"},"ans":"C","note":"答案 C。環境基本法第 2 條第 2 項：「永續發展係指做到滿足當代需求，同時不損及後代滿足其需要之發展。」此定義源自 1987 年聯合國世界環境與發展委員會《我們共同的未來》（布朗特蘭報告），C 與之相符。其餘三項出自綠建材解說與評估手冊：A「對地球環境負荷最小、對人類身體健康無害」是綠建材的定義；D「消耗最少地球資源，製造最少廢棄物」是綠建築早期的消極定義；B「生態、節能、減廢、健康」是綠建築的積極定義（EEWH 系統）。三者都不是永續發展的法定定義。 【依據】環境基本法第 2 條第 2 項；綠建材解說與評估手冊（2024 年版公告版 3）第一章 p.5、p.9"},{"c":484,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"水資源指標策略","year":114,"no":36,"art":"6-1 綠建築評估","q":"節水用水勢必成為缺水對策重要方法，下列何者不是綠建築水資源指標之規劃策略？","opts":{"A":"設置節水型澆灌系統","B":"設置空調冷凝水回收系統","C":"設置滯洪設施","D":"設置雨水再利用設施"},"ans":"C","note":"答案 C。綠建築水資源指標評估建築物「實際使用自來水量」的節約程度，綠建築評估手冊 2-8.1「水資源指標的規劃重點」列出：省水器材、節水型冷卻水塔、「鼓勵設置空調冷凝水回收系統」（B）、以自動偵濕澆灌等節水澆灌系統彌補草花用水（A）、耗水設施須設雨水貯集或中水利用設施（D）。C 滯洪設施是暫存暴雨逕流、削減洪峰的手段，屬基地保水指標範疇（手冊之「景觀貯集滲透水池」即具滲透功能之滯洪池），不是節約用水策略。課程教材亦以「開源」（雨水與雜排水再利用）與「節流」（省水器具）說明水資源指標。 【依據】綠建築評估手冊－基本型（2023 年版）2-8.1 p.112（PDF 第 118 頁）、2-3 基地保水指標 p.48（景觀貯集滲透水池即具滲透功能之滯洪池）；課程教材：14 節水設備計畫 p.4–5、p.20"},{"c":485,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-1 綠建築評估","h3":"綠建材與 CO2 減量","year":114,"no":38,"art":"6-1 綠建築評估","q":"進行綠建築評估時，關於建築材料的使用特性，下列何者正確？","opts":{"A":"只需達到「生態、健康、再生、高性能」其中一項，即可取得綠建材標章","B":"鋼筋混凝土建築使用的鋼材比鋼構建築少，因此鋼筋混凝土建築的單位面積二氧化碳排放量比鋼構建築少","C":"鋼構造建築不是一種符合二氧化碳減量的建築型態","D":"添加水淬爐石粉加入水泥中製成高爐水泥，是偷工減料的做法應嚴格禁止"},"ans":"A","note":"答案 A（正確）。我國綠建材標章分為生態、健康、再生、高性能四大分類，各有分類標章與評定要項，建材符合其中一類之評定基準即可取得該類綠建材標章，不需四類同時具備。B 錯：綠建築評估手冊 CO2 減量指標指出「RC 建築物 CO2 排放量是鋼構建築的 1.4 倍」，RC 並不較少。C 錯：同指標的「建築輕量化」對策第一項即「鼓勵採用輕量鋼骨結構或木結構」，鋼構造正是有利 CO2 減量的構造型態。D 錯：「再生建材使用」對策列有「採用爐石粉替代率約 30％的高爐水泥作為混凝土材料」，是鼓勵使用的減碳手法，不是偷工減料。 【依據】綠建材解說與評估手冊（2024 年版公告版 3）第一章 p.12–13（四大分類與分類標章）；綠建築評估手冊－基本型（2023 年版）2-5.1 CO2 減量指標的規劃重點 p.79–80（圖 2-5.1、對策 b1、d1）"},{"c":486,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"臺灣外殼節能","year":102,"no":20,"art":"6-2 建築節約能源","q":"在臺灣，有關建築外殼節能設計的敘述，下列何者錯誤？","opts":{"A":"狹長型建築對外殼斷熱的要求，比量體厚實的大型建築為低","B":"開窗越大則越不利建築節能","C":"水平天窗夏季會引來太陽熱輻射","D":"百葉內遮陽的節能效果遠不如外遮陽"},"ans":"A","note":"答案為 A。\n狹長型建築的外殼面積與樓地板面積比大，室內大部分空間靠近外牆，空調負荷主要來自外殼（屬外殼主導型），所以外殼的斷熱、遮陽要求應該「較高」。量體厚實的大型建築，內部核心區的負荷以人員、照明等內部發熱為主，外殼影響比例較小。\nB 正確：臺灣日射強，開窗越大，日射得熱越多。\nC 正確：臺灣夏季太陽高度角大，水平天窗會直接受強烈日射。\nD 正確：內遮陽擋下的熱已經進入室內，外遮陽則在室外先阻擋日射，效果好很多。 【依據】建築環境控制一般原理（外殼節能、外遮陽）"},{"c":487,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"ENVLOAD 外周區認定","year":103,"no":36,"art":"6-2 建築節約能源","q":"外周區為受到外殼熱流進出影響之外圍空間區域，針對外周區範圍認定，下列敘述何者錯誤？","opts":{"A":"由外牆中心線起算 5 m 內之空調外周區域","B":"臨接外氣之屋頂層，包括機械室、樓梯間、屋頂突出物等所占之屋頂面積皆予以納入","C":"直上方有天窗、頂棚之中庭，該中庭樓地板面積計入外周區","D":"緊接鄰棟建築物或使用共同壁時，該部位樓地板面積不計入外周區"},"ans":"B","note":"答案 B（錯誤）。建築物節約能源設計技術規範 9.1.7.5：內部屋頂層外周區若上方臨接機械室、樓梯間、屋頂突出物等非空調區時，該部分應視為內部區，不予計入 AFmp；9.1.7.4 亦規定樓梯間、機械室等非空調空間不可計入外周區空調樓地板面積，故「皆予以納入」錯誤。A 正確：設計施工編第 299 條第 1 項第 5 款及規範 9.1.7.2（外殼中心線起算 5 m）；C 正確：規範 9.1.7.7；D 正確：規範 9.1.7.8（鄰棟或共同壁不視為臨接外氣之外殼）。\n【依據】建築物節約能源設計技術規範 9.1.7.2、9.1.7.4、9.1.7.5、9.1.7.7、9.1.7.8；建築技術規則建築設計施工編第299 條第 1 項第 5 款"},{"c":488,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"ENVLOAD 影響因子","year":103,"no":40,"art":"6-2 建築節約能源","q":"以 ENVLOAD 進行建築外殼節能評估時，下列那項外殼設計因子對空調負荷之影響最大？","opts":{"A":"建築方位","B":"窗面遮陽","C":"外殼保溫","D":"開窗率"},"ans":"D","note":"答案 D。ENVLOAD 公式（建築物節約能源設計技術規範公式 16）由外殼熱損失係數 Lm×冷房度時 DH 及日射取得係數 Mmk×冷房日射時 IHk 組成；在台灣亞熱帶氣候，冷房負荷以經由透光開口進入之日射熱為最大宗，而日射取得量主要由開窗面積（開窗率）決定，故開窗率影響最大。A 方位、B 遮陽均是修正窗面日射之次要因子；C 外殼保溫在室內外溫差不大的台灣影響相對較小。課程教材之濕熱氣候外殼節能手法亦首列「降低窗面積」與低日射取得率玻璃。考試當時之綠建築評估手冊—基本型（2012 年版）「依其節能之重要度次序」列外殼節能規劃重點（p.50），除 a1 平面深度外，即以 a2「切忌採用全面玻璃造型設計，辦公類建築開窗率最好在 35% 以下」居首，外遮陽（a4）、東西向避免大開窗（a5）、屋頂隔熱（a7）列於其後，與本題答案一致。 【依據】建築物節約能源設計技術規範 9.1.4（ENVLOAD 公式 16）；綠建築評估手冊—基本型（2012 年版）p.50；課程教材：23 SET 05 熱舒適節能設計 p.16"},{"c":489,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"平面形狀與外殼熱負荷","year":104,"no":28,"art":"6-2 建築節約能源","q":"假設樓地板面積、開窗率及外殼構造均相同，若上方為北向且位於開闊基地上，在臺灣氣候下，何種平面之建築外殼熱負荷最小？\n（附圖：四個梯形平面（上方為北）。(A) 東西向長的梯形，北邊短、南邊長，兩側斜邊朝西北西與東北東；(B) 東西向長的倒梯形，北邊長、南邊短，兩側斜邊朝西南西與東南東；(C) 南北向長的梯形，西側長邊垂直、東側較短，上下邊斜向；(D) 與 (C) 左右相反，東側長邊垂直、西側較短。）","opts":{"A":"如圖 (A)：東西向長、北邊短南邊長之梯形","B":"如圖 (B)：東西向長、北邊長南邊短之倒梯形","C":"如圖 (C)：南北向長、西側長邊之梯形","D":"如圖 (D)：南北向長、東側長邊之梯形"},"ans":"A 或 B 均給分（更正前公告答案 B）","note":"本題 A 或 B 均給分（更正前公告答案 B）。臺灣位於北回歸線附近，東、西向立面日射量最大，南向夏季太陽高度高、易以水平遮陽遮擋，北向日射最少；故長軸東西向、主要立面朝南北的 A、B 外殼熱負荷小，長邊朝西或朝東的 C、D 最差。原答案 B 的理由應是「北向長立面、日射最少」。考選部未公布更正理由，以下為推測：A的長邊朝南、兩斜邊轉向北側（西北西、東北東），B 的兩斜邊轉向南側（西南西、東南東）；在臺灣夏季日出日落偏北，A、B 何者較小須視各方位日射量權重而定，無法僅憑示意圖判定，故兩者均給分。 【依據】課程教材：23 S ET 05 熱舒適節能設計 p.10、p.13（依方位分區，日射較大方位如西向設緩衝區）"},{"c":490,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"格子遮陽深度比","year":104,"no":36,"art":"6-2 建築節約能源","q":"依據建築節約能源設計技術規範，建築物開口部為格子遮陽，水平部分 X1（寬度）= 4 m，X2（深度）= 0.4 m；垂直部分 Y1（高度）= 2 m，Y2（深度）= 0.4 m；此開口部之深度比為何？","opts":{"A":"7.5","B":"0.3","C":"0.15","D":"1.5"},"ans":"C","note":"答案 C。依建築物節約能源設計技術規範附錄二（110 年版）圖 2.2「一般常用外遮陽形式（垂直、水平、格子遮陽版）之圖示」：平面上 X1 為開口寬度、X2 為垂直遮陽板深度；剖面上 Y1 為開口高度、Y2 為水平遮陽板深度。垂直遮陽深度比＝X2／X1，水平遮陽深度比＝Y2／Y1，格子遮陽取兩者平均＝(Y2／Y1＋X2／X1)／2。舊版「學校類大型空間類及其他類建築物節約能源設計技術規範」附件 C 簡算表（p.48）的深度比計算欄也寫明「Y2/Y1 or X2/X1 or (Y2/Y1＋X2/X1)/2」，附錄五（110 年版）計算實例的格子遮陽也用同一算法，例如 (72.5/470＋72.5/335)/2＝0.19。本題：X2／X1＝0.4／4＝0.1，Y2／Y1＝0.4／2＝0.2，深度比＝(0.1＋0.2)／2＝0.15。B（0.3）是兩者相加後忘了除以 2；A（7.5）是比值顛倒（開口尺寸÷深度）的結果：(4／0.4＋2／0.4)／2＝7.5；D（1.5）也不符合規範算式。求得深度比後，再依附錄二表 2.2.3「格子遮陽之遮陽係數 Ksi,grid」按方位查出 Ksi。\n註：題目原文印作「Xl、Yl」，依規範圖 2.2 應為 X1、Y1，已逕改。 【依據】建築物節約能源設計技術規範附錄二（110 年版）2.3.2.2、圖 2.2（p.28）、表 2.2.3（p.25）；學校類大型空間類及其他類建築物節約能源設計技術規範（舊版）附件 C 簡算表 p.48；同規範附錄五（110 年版）計算實例 p.17（附件 C-3 計算表）；課程教材：23 SET 05 熱舒適節能設計 p.17、p.23"},{"c":491,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"學校類通風修正係數 fvi","year":105,"no":37,"art":"6-2 建築節約能源","q":"學校類建築 5 樓某樘窗如下圖，a＝1.6 m²，A = 3.2 m²，該樘窗的通風修正係數 fvi'為何？\n（附圖：一樘組合窗立面：左右兩側各為橫拉窗（面積 a），中間為固定窗（面積 A）。）","opts":{"A":"1.25","B":"1.5","C":"1.75","D":"2.0"},"ans":"C","note":"答案 C。105 年當時適用之「學校類大型空間類及其他類建築物節約能源設計技術規範」8.2 規定 AWSG＝Σ(IHki×Ki×ηi×fvi×Ai)／ΣAi（式 8），fvi 為學校類建築物開窗部位之通風修正係數，查表 9（大型空間類令 fvi＝1.0），用以懲罰不能開啟之密閉窗。表 9 A 圖：固定窗 fvi＝2.5、通風固定窗 1.5、橫拉窗 1.0、旋轉窗 0.8、推窗0.8。組合窗依各形式面積加權（表 9 B 圖「組合形式門窗之 fvi 計算例一」即本題之窗型）：fvi'＝（1.6×1.0＋1.6×1.0＋3.2×2.5）／（1.6＋1.6＋3.2）＝11.2／6.4＝1.75。驗算：橫拉窗與固定窗面積各占一半，0.5×1.0＋0.5×2.5＝1.75。注意：該規範 B 圖之公式誤植為「A×3.0」，但其算例代入 2.5 得 1.75；若照誤植之 3.0 計算會得 2.0（選項 D），應以 A 圖表列值 2.5 為準。現行建築物節約能源設計技術規範已無學校類通風修正係數。 【依據】學校類大型空間類及其他類建築物節約能源設計技術規範（舊版）8.2 式(8)、表 9 學校類建築物通風修正係數 fvi（A圖、B 圖，規範頁 45）"},{"c":492,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"建築長寬比與日射負荷","year":106,"no":7,"art":"6-2 建築節約能源","q":"日射量對下列不同長寬比（N 值）之辦公型建築物，全年冷氣熱負荷之影響，何者最小？","opts":{"A":"0.25","B":"0.5","C":"1.0","D":"2.0"},"ans":"C","note":"答案 C（1.0）。長寬比 N＝1.0 為正方形平面，在相同樓地板面積下周長與外殼面積最小，外周區（受外殼負荷影響之空間）比例最低，接受日射之外殼面積也最少，因此日射量對全年冷氣負荷的影響最小。N 偏離 1（0.25、0.5 或 2.0）時平面細長，外殼面積增加，若長向立面朝東西，日射負荷更大。【查證限制】本題應出自建築節能教材之長寬比與空調負荷關係圖，本機無原文；若長向立面朝南北，細長平面之日射負荷可能較小，題目未交代方位，以官方答案 C 為準。 【依據】建築節能一般原理（建築形狀與外殼負荷）；建築物節約能源設計技術規範第 3.2.9 款（外周區定義）"},{"c":493,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"ENVLOAD 日射取得係數 Mk","year":106,"no":8,"art":"6-2 建築節約能源","q":"建築外殼節能指標 ENVLOAD 的計算參數，日射取得係數 Mk 之數值，代表下列建築物外殼的何種性能？","opts":{"A":"隔熱","B":"遮陽","C":"採光","D":"日照"},"ans":"B","note":"答案 B。建築物節約能源設計技術規範第 3.1.12 款：外殼日射取得係數 Mk 為建築物 k 方位空調區單位樓地板面積全年實際取得之日射量，與建築物毫無遮蔽時取得日射量之比值；此數值代表建築物外殼之遮陽性能。A 隔熱性能由外殼熱損失係數 L 代表（第 3.1.11 款）；C 採光、D 日照非 Mk 之意義。另 Mmk＝[Σ(ηi×Ai×Ki)＋0.03×Σ(Ui×Ai)]／AFmp（規範公式 20），含玻璃日射透過率與外遮陽係數。 【依據】建築物節約能源設計技術規範第 3.1.11、3.1.12 款、第 9.1.4 節公式(20)"},{"c":494,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"空調節能設計","year":107,"no":29,"art":"6-2 建築節約能源","q":"為減少空調負荷達到節能效益，下列敘述何者錯誤？","opts":{"A":"採用全面玻璃造型設計","B":"開窗部位設置外遮陽或陽台","C":"避免採用屋頂水平天窗設計","D":"屋頂隔熱 U 值應≦0.8 W/m2K"},"ans":"A","note":"答（A）。玻璃之熱傳透率高且日射可直接透過，全面玻璃帷幕使日射熱得與傳導熱大增，空調負荷變大，不利節能，故（A）錯誤。（B）外遮陽或陽台可在日射進入玻璃前加以阻擋，效果優於內遮陽，正確。（C）水平天窗接受全日最多日射（參見第 25 題），應避免或控制面積並加遮陽，正確。（D）建築技術規則建築設計施工編第 308-1 條第 1 項（考試當時適用 101 年 11 月 7 日修正版本，經全國法規資料庫歷史條文核對；現行 108 年 8 月 19日修正版本相同）規定受建築節約能源管制建築物之屋頂平均熱傳透率應低於 0.8 W/(m2·K)，與題意相符（法規為「低於」，選項寫≦，屬用語差異）。 【依據】建築技術規則建築設計施工編第 308-1 條第 1 項；綠建築評估手冊－基本型（2015 年版）2-4.1 外殼節能規劃重點 a2～a4、a7（p.51）"},{"c":495,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"日射與外殼節能","year":109,"no":35,"art":"6-2 建築節約能源","q":"有關日射與外殼節能之敘述，下列何者正確？","opts":{"A":"造成夏季冷房負荷的主要日射成分為遠紅外光","B":"寒帶與溫帶氣候建築需要優於熱濕氣候區建築的外牆隔熱性能","C":"Low-E 玻璃主要性能為隔絕日射之可見光成分","D":"遮陽板主要功能在於隔絕間接日射"},"ans":"B","note":"答案 B。寒帶、溫帶冬季長而冷，保溫需求高，外牆熱傳透率 U 值要求較嚴（例如歐洲、北美之 U 值要求遠低於熱濕氣候），故正確；臺灣屬熱濕氣候，外牆平均熱傳透率基準較寬（如住宿類 Uaw＜3.5 W/m²·K，設計施工編第 310 條）。(A) 夏季冷房負荷主因是日射中之可見光與近紅外線（短波）；遠紅外線是物體常溫下發射的長波熱輻射，並非日射主成分。(C) Low-E 的主要作用是反射遠紅外（長波）熱輻射以降低 U 值，遮蔽型 Low-E 另可降低近紅外線穿透，並非主要隔絕可見光。(D) 遮陽板主要是遮擋「直射日射」，對天空漫射（間接日射）效果有限。（課程教材佐證：日射頻譜約為紫外線 5%、可見光 46%、近紅外線 49%；常溫熱輻射才是 3000～40000 nm 之遠紅外線；降低日射取得之手法為遮陽加低日射取得率玻璃。） 【依據】建築技術規則建築設計施工編第 310條；通用建築環境控制教材；課程教材：23 S ET 02 氣候與外部環境 230208.pdf p.15；23 S ET 05 熱舒適節能設計230323.pdf p.2"},{"c":496,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"綠建築評估手冊空調節能技術","year":109,"no":36,"art":"6-2 建築節約能源","q":"依據綠建築評估手冊，有關空調節能技術評估，下列何者不屬於熱源系統節能技術？","opts":{"A":"冰水主機台數控制系統","B":"變風量系統","C":"全熱交換器系統","D":"外氣冷房系統"},"ans":"B","note":"答案 B。依最接近考試年度之《綠建築評估手冊－基本型》2019 年版，日常節能指標之空調系統節能效率EAC 以式 2-4.13 評估（EAC≦0.9），其中各系統節能優惠為 Rs＝Σ(αj×rj)（熱源系統）、Rf＝Σ(α7×r7)（送風系統）、Rp＝Σ(α8×r8＋α9×r9)（送水系統）、Rt＝Σ(α10×r10)（冷卻水塔），R＝1－(Rs＋Rf＋Rp＋Rt＋Rm)（式 2-4.13a～f）。表 2-4.10「空調節能技術簡易評估表」之熱源系統節能技術列有 α1 冰水主機運轉控制（冰水主機台數控制、冰水出水溫度重置）、α2 變頻主機、α3 CO₂ 濃度外氣量控制、α4 全熱交換器系統、α5 外氣冷房系統、α6 其他熱源節能系統，合計為「熱源系統節能效率 Rs」；α7 變風量系統（VAV）則列於「送風系統節能效率 Rf」。因此 (A)(C)(D) 屬熱源系統節能技術，(B) 變風量系統屬送風系統，不屬熱源系統，與官方答案一致。課程教材所載2020 新法（EAC≦0.8）之分類相同（α1～α6 熱源、α7 VAV 送風；投影片 p.21–22 各系統效率式之下標與表列編號有錯位，不影響分類）。 【依據】綠建築評估手冊－基本型（2019 年版）2-4 節 式 2-4.13（手冊 p.65）、表 2-4.10（手冊 p.70–71；PDF 第 71、76–77 頁）；課程教材：08 空調節能計畫.pdf p.4、p.10、p.11（2020 新法）、p.18–22"},{"c":497,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"中空層熱阻 Ra 之比較","year":110,"no":13,"art":"6-2 建築節約能源","q":"依據建築物節約能源設計技術規範，下列各種構造的中空層，何者的熱阻 Ra 最大？","opts":{"A":"雙層玻璃之中空層（封膠密閉）","B":"雙層窗之中空層（半密閉）","C":"密閉式屋頂之中空層","D":"可通風雙層壁之中空層"},"ans":"D","note":"答案 D。考試當時適用之建築物節約能源設計技術規範附錄一（110 年 1 月 1 日生效）表 1.1「中空層熱阻 ra基準值」（m²·K/W）：雙層玻璃之中空層（封膠密閉）0.155；雙層窗之中空層（半密閉）0.13；屋頂、壁體密閉中空層 0.086；閣樓空間、雙層壁或雙層屋頂之中空層：無通風 0.28、有通風且 10 cm＜空氣層＜50 cm 為 0.46、有通風且≧50 cm 為 0.78。可通風雙層壁之中空層（0.46～0.78）最大；A 0.155、B 0.13、C 0.086。通風可排出中空層累積之日射熱，故熱阻較大。舊版學校類規範表 6-1 數值相同，但有通風之分界為 20 cm；兩版大小順序相同。\n【依據】建築物節約能源設計技術規範附錄一（110 年版）表 1.1 中空層熱阻 ra 基準值（p.4）；學校類大型空間類及其他類建築物節約能源設計技術規範（舊版）表 6-1（PDF p.28）；課程教材：23 S 04 熱傳與材料性能 230317p.16"},{"c":498,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"屋頂平均熱傳透率 Uar 之計算項目","year":110,"no":15,"art":"6-2 建築節約能源","q":"某鋼筋混凝土屋頂構造，計算屋頂平均熱傳透率 Uar 時，不包括下列那個項目？","opts":{"A":"室內內氣膜熱傳遞率","B":"屋頂鋼筋混凝土厚度","C":"水泥砂漿熱傳導係數","D":"室外氣溫"},"ans":"D","note":"答案 D。熱傳透率 U = 1 ／ (1/hi + Σ di/λi + Ra + 1/ho)，須代入室內、外氣膜（表面）熱傳遞率 hi、ho，各層材料厚度 d、導熱係數 λ，及中空層熱阻 Ra，故 A、B（鋼筋混凝土厚度）、C（水泥砂漿導熱係數）都包括。建築設計施工編第 299 條第 1 項第 7 款定義平均熱傳透率為「室內外溫差在絕對溫度一度時，單位面積單位時間之平均傳透熱量」，即 U 值與實際溫度無關，不含室外氣溫。（驗算：U 計算式中僅有熱阻項，無溫度。）課程教材（23S 04 p.15、p.19）：R = 厚度/k，複合材料 R = 1/U；熱流 Q = U·A·ΔT 時，溫度（等效外氣溫度 Te、室內氣溫 Tr）才出現在「熱流量」計算，U 本身不含溫度。考試當時之建築物節約能源設計技術規範附錄一（110 年版）式(1-1)：Ui＝1／〔1/ho＋Σ(dx/kx)＋Σra＋1/hi〕，外表面熱傳遞率 ho 取 23.0、內表面 hi 牆面取 9.0、屋頂取 7.0W/(m²·K)，各層材料（如 RC、水泥砂漿）之導熱係數 kx 查表 1.2，式中無氣溫項（舊版學校類規範表 6-1 同式）。現行建築物節約能源設計技術規範 6.1 規定 Uar 依附錄一計算，基準為 Uar < 0.8 W/(m²·K)。 【依據】建築技術規則建築設計施工編第 299 條第 1 項第 7 款（定義）；第 308-1 條第 1 項（屋頂平均熱傳透率基準）；建築物節約能源設計技術規範 3.1.4、6.1；同規範附錄一（110 年版）1.1.1 式(1-1)、表 1.2（p.1、p.5）；學校類大型空間類及其他類建築物節約能源設計技術規範（舊版）表 6-1；課程教材：23 S 04 熱傳與材料性能 p.15、p.19"},{"c":499,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"辦公室照明功率密度 LPDcj","year":110,"no":34,"art":"6-2 建築節約能源","q":"辦公室的照明功率密度（LPDcj）設計基準以何者較為合理？","opts":{"A":"10 W/m²","B":"15 W/m²","C":"20 W/m²","D":"25 W/m²"},"ans":"A 或 B 均給分（更正前公告答案 A）","note":"A、B 均給分（原公告 A）。LPDcj 為綠建築日常節能指標照明節能 IDR＝(Σni×wi)／(ΣLPDcj×Aj) 中之主要作業空間照明功率密度基準。考試當時之綠建築評估手冊—基本型（2019 年版）表 2-4.13：辦公室、行政空間、會議室、視聽室 LPDcj＝10 W/m²（p.77），與原公告 A 相符；前一版（2015 年版）表 2-4.14 同欄為 15 W/m²（p.68），2019 年版附表 3 第 14 點載「為了與 ASHRAE90.1 接軌，修改表 2-4.13 照明功率密度基準」。考選部未公布更正理由，推測即因新舊版基準分別為 10、15 W/m²，故 A、B 均給分；20、25 W/m² 均非辦公室基準。\n【依據】綠建築評估手冊—基本型（2019 年版）式 2-4.20、表 2-4.13（p.75、p.77）、附表 3 第 14 點（p.150）；同手冊 2015 年版表 2-4.14（p.68）"},{"c":500,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"建築物節約能源設計技術規範之 Vac","year":112,"no":36,"art":"6-2 建築節約能源","q":"建築物採用自然通風引入外氣時可減少空調的使用量，依據「建築物節約能源設計技術規範」，下列敘述何者錯誤？","opts":{"A":"Vac 是對於在涼爽季節中可開窗而自然通風之建築物所執行之節能優惠計算","B":"Vac 是由自然通風潛力 VP 求得的","C":"若 Vac = 0.87，表示建築因自然通風條件良好而可節約空調能源 13%","D":"Vac 適用於住宿類建築，不適用於辦公類建築"},"ans":"D","note":"答案 D（錯誤）。建築物節約能源設計技術規範 9.1.7.12：自然通風空調節能率 Vac 是對涼爽季節中可開窗自然通風之建築物所執行之節能優惠計算（即 A），僅適用於住宿類建築及空調型建築中屬辦公、文教、宗教、照護等具自然通風潛力之部分，其他設 Vac ＝ 1.0；附錄三 3.2、3.3.1 亦將可自然通風類建築限定為住宿類（H1、H2）及辦公、文教、宗教、照護（D2、E、G2、F3、F4），故辦公類可適用，D 錯。B：附錄三 3.5 之 Vac 由自然通風潛力 VP 計算（VP＜0.05 時 Vac ＝ 1.0）；C：同節說明住宅 VP ＝ 0.15 時 Vac ＝ 0.87，即可節約空調能源13%。本機規範為 108.12.31 修正、110.1.1 生效版，即考試當時適用版本。 【依據】建築物節約能源設計技術規範 9.1.7.12；同規範附錄三 3.2、3.3.1、3.5；課程教材：08 空調節能計畫 p.30"},{"c":501,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"節能減碳設計策略","year":112,"no":37,"art":"6-2 建築節約能源","q":"當建築進行節能減碳設計時，下列那一項設計策略正確？","opts":{"A":"為增加建築生命週期避免提早拆除，給排水衛生管路應設計於柱梁內，以增加管路耐用度","B":"全年空調型建築的節能設計，應將建築量體儘量設計的飽滿方正，可減少外氣對建築的空調負荷","C":"可採用爐碴替代約 30% 的骨材作為混凝土材料，用於房屋結構體，可達到減碳與廢棄物再利用的功能","D":"低輻射 Low-E 玻璃可隔離大部分輻射能量中的紫外線熱能"},"ans":"B","note":"答案 B。全年空調型建築以降低外殼熱負荷為重點，量體飽滿方正可縮小外殼面積與體積之比，減少外氣熱傳與日射得熱，B 正確。依綠建築評估手冊－基本型（2019 年版第三版第二刷）2-5.1 CO2 減量指標規劃重點（p.81～82）：A 錯，「耐久化」對策為 c6 給排水衛生管路明管設計，埋入柱梁反而難以維修更換；C 錯，d1 為「採用爐石粉替代率約 30％的高爐水泥作為混凝土材料」，替代的是水泥而非骨材（再生骨材另列 d3）。D 錯：Low-E玻璃主要反射長波紅外線（遠紅外線熱輻射），而非紫外線；課程教材 23 S ET 02 氣候與外部環境 p.15：地表日射約 5% 紫外線、46% 可見光、49% 近紅外線。 【依據】綠建築評估手冊－基本型（2019 年版第三版第二刷）2-5.1（p.81～82）；課程教材：23 S ET 02 氣候與外部環境 p.15"},{"c":502,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"空調節能手法","year":113,"no":32,"art":"6-2 建築節約能源","q":"為達到空調節約能源與室內舒適度，下列那一種節能手法錯誤？","opts":{"A":"裝設二氧化碳濃度偵測器的目的，在掌握室內空氣品質，以便適時引入新鮮外氣","B":"工廠類建築的溫控感應器應裝在廠房上空高處，以偵測上升的熱空氣溫度，便於調整空調出風溫度","C":"根據綠建築的空調節能評估，在百貨商場人潮多的建築其空調主機效率基準 HSCc 應以低於 1.5 倍進行規劃設計","D":"全熱交換器可以進行室內回風之熱回收，減少換氣過程中熱能的浪費"},"ans":"B 或 C 均給分（更正前公告答案 B）","note":"原公告答案 B，更正後 B、C 均給分。B 錯：溫控感應器應設於人員活動的居住區（人員活動高度），偵測實際受控之使用空間溫度；裝在廠房高處只會測到上升的熱空氣，造成過度冷房。A：CO₂ 偵測可作新鮮外氣量控制（課程教材：外氣引入量之控制，能因應 CO2 濃度自動調整外氣量）✓。D：全熱交換器回收排氣的顯熱與潛熱（教材：使用全熱交換器取入外氣與排熱回收，減少外氣負荷）✓。C：綠建築評估手冊主機容量效率 HSC＝ACsc／ACs≦HSCc，用意在防止主機超量設計；基準 HSCc：辦公文教、旅館客房等一般建築物 1.35，商場餐飲娛樂、醫院診療、交通運輸等「瞬間可能湧入大量人潮的建築物」1.50（2019 年版第三版第二刷表 2-4.3、2023 年版表 2-4.2 相同；課程教材表 3-4.4 之一般建築 1.25 為舊版數值）。可見 1.5 是百貨商場之「基準值 HSCc」本身，應為「設計之 HSC 不得大於 HSCc＝1.5」；題目寫成「HSCc 應以低於 1.5 倍進行規劃設計」，把基準值與設計值混為一談，用語有誤或可議。更正原因考選部未公布，推測即因 C 之敘述亦可判為錯誤，故 B、C 均給分。 【依據】綠建築評估手冊－基本型（2019 年版第三版第二刷）式 2-4.9 p.62、表 2-4.3 p.65；同手冊 2023 年版式 2-4.5、表 2-4.2（p.62～63）；課程教材：08 空調節能計畫 p.6（HSC 主機容量效率）、p.8（表 3-4.4）、p.60～61（外氣量 CO2控制、全熱交換器）"},{"c":503,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"建築能源與再生能源","year":114,"no":37,"art":"6-2 建築節約能源","q":"有關建築能源使用與再生能源之敘述，下列何者錯誤？","opts":{"A":"使用瓦斯熱水器供應熱水的效能高於熱泵熱水器","B":"使用室內風扇時，空調溫度設定提高 1~2℃仍可維持舒適範圍","C":"太陽能電池（或稱光伏電池）的光電轉換為直流電形式","D":"水平軸式風力發電機大多需要達到相當強度的風速始能運轉"},"ans":"A","note":"答案 A（錯誤）。瓦斯熱水器以燃燒直接加熱，熱效率小於 1（約 0.8 上下）；熱泵熱水器以電能驅動壓縮機從空氣等低溫熱源搬運熱量，性能係數 COP 一般可達 3 以上，即 1 份電能可產生數倍熱能，效能明顯高於瓦斯熱水器，A 說反。B 正確：電扇增加氣流速度可提高人體對流與蒸發散熱，空調設定溫度提高約 1～2℃ 仍可感到舒適，並可節能。C 正確：太陽能電池產生直流電，併網或供一般電器須經變流器轉為交流電。D 正確：水平軸風機需達切入風速才開始發電。（熱泵原理見課程教材：吸收環境空氣熱量製熱水，氣溫越高越省電。） 【依據】課程教材：11 建築熱水設備 p.26；課程教材：23 S ET 03 熱舒適性與室內環境 p.24（室內氣流之影響）；熱泵與再生能源（一般原理）"},{"c":504,"law":"綠建築與建築節約能源","g":"綠建築與建築節約能源","h1":"第 6 篇　綠建築與建築節約能源","h2":"6-2 建築節約能源","h3":"建築節能減碳策略","year":114,"no":39,"art":"6-2 建築節約能源","q":"在臺灣進行建築節能減碳策略擬定時，下列那一個作法正確？","opts":{"A":"建築節能設計需兼顧遮陽與構造隔熱的設計","B":"大面玻璃開窗可在室內裝設窗簾遮陽降低空調負荷，是最有效的節能遮陽策略","C":"採用 Low-E 玻璃時，是仰賴其高隔熱與高反射率的節能特性，可大幅減少可見光波長與熱輻射進入室內","D":"為了增加大型空間的室內採光，應開設大面積水平天窗直接引進晝光，以達良好的晝光利用率與照明節能"},"ans":"A","note":"答案 A。臺灣屬亞熱帶，外殼節能以「開口部遮陽」與「屋頂、外牆隔熱」並重，A 正確。B 錯：室內窗簾在日射穿透玻璃後才遮擋，熱已進入室內，遮蔽效果遠不如外遮陽，並非最有效策略。C 錯：Low-E 玻璃以低輻射鍍膜降低長波（遠紅外線）熱輻射傳遞並可選擇性阻隔近紅外線，同時盡量讓「可見光」透過，並非大幅減少可見光進入。D 錯：大面積水平天窗在臺灣會引入大量直射日射造成過熱、眩光與空調負荷。綠建築評估手冊要求儘量少用屋頂水平天窗，若設置應小而分散、水平開窗率 10% 以下，並採低日射透過率玻璃或外遮陽；課程教材亦指出天窗須控制直射光的熱得與眩光，高側窗可避免眩光及過熱。 【依據】綠建築評估手冊－基本型（2023 年版）2-4 日常節能指標規劃重點 A 外殼節能 a3、a4、a6、a7，p.57；課程教材：23 S ET 07 採光設計 p.17、p.22；課程教材：23 S ET 05 熱舒適節能設計 p.17"},{"c":505,"law":"無障礙環境與其他","g":"無障礙環境與其他","h1":"第 7 篇　無障礙環境與其他","h2":"7-1 無障礙設施設計","h3":"輪椅觀眾席位","year":105,"no":39,"art":"7-1 無障礙設施設計","q":"依據「建築物無障礙設施設計規範」有關「輪椅觀眾席」之規定，下列敘述何者正確？","opts":{"A":"固定座椅席位數量達 1800 個時，輪椅觀眾席位數量不得少於 10 個","B":"座位前地面有高差者應設置欄杆，欄杆高度不得小於 90 cm","C":"固定銀幕仰視能見度容許範圍為：席位之水平視線與觀看銀幕中心視線之夾角≦30°","D":"單一輪椅觀眾席位寬度不得小於 90 cm；有多個輪椅觀眾席位時，每個空間寬度不得小於 75 cm"},"ans":"C","note":"答案 C。依 101 年版建築物無障礙設施設計規範（105 年適用）：702.4.2 固定銀幕仰視能見度容許範圍為席位之水平視線與觀看銀幕中心視線之夾角≦30°，C 正確。A 錯：702.2 表列 1751～2000 席應設 13 個，非 10 個（10個為 1001～1250 席）。B 錯：704.5 座位前地面有高差者應設欄杆，欄杆高度 75 公分，非 90 cm。D 錯：703.1 單一席位寬度不得小於 90 公分，多個席位時每個空間寬度不得小於 85 公分，非 75 cm。 【依據】建築物無障礙設施設計規範（101 年版）702.2、702.4.2、703.1、704.5"},{"c":506,"law":"無障礙環境與其他","g":"無障礙環境與其他","h1":"第 7 篇　無障礙環境與其他","h2":"7-1 無障礙設施設計","h3":"無障礙客房（101 年版規範）","year":106,"no":40,"art":"7-1 無障礙設施設計","q":"建築物依規定設置無障礙客房，其設計之敘述下列何者正確？","opts":{"A":"衛浴設備空間應設置迴轉空間，其直徑不得小於 120 公分","B":"必須採用具省水標章設備","C":"房間內求助鈴應至少設置兩處","D":"房間內通路寬度及床間淨寬度不得小於 90 公分"},"ans":"C","note":"答案 C。依考試當時之 101 年版規範第 1005.1 款：房間內求助鈴應至少設置兩處，一處距地板面高 90～120公分，另一處距地板面 35～45 公分 ✓。A 錯：第 1003.2 款迴轉空間直徑不得小於 135 公分。B 錯：第十章無「省水標章」之規定。D 錯：第 1004.1 款房間內通路寬度不得小於 120 公分，僅床間淨寬度不得小於 90 公分。現行108 年版第 1003.2、1004.1 款數值相同；1005.1 仍設兩處，但跌倒用一處改為按鍵中心距地板面 15～25 公分。\n【依據】建築物無障礙設施設計規範（101 年版）第 1003.2、1004.1、1005.1 款；現行 108 年版 1003.2、1004.1、1005.1（對照）"},{"c":507,"law":"無障礙環境與其他","g":"無障礙環境與其他","h1":"第 7 篇　無障礙環境與其他","h2":"7-1 無障礙設施設計","h3":"應設兩處求助鈴之空間","year":107,"no":39,"art":"7-1 無障礙設施設計","q":"依據建築物無障礙設施設計規範，下列那些號碼組合，屬於應設置「兩處」求助鈴之空間？①無障礙浴室內 ②無障礙昇降機內 ③無障礙客房內 ④無障礙停車位旁 ⑤無障礙廁所內 ⑥輪椅觀眾席位旁","opts":{"A":"①③⑤","B":"①②⑤","C":"②④⑤","D":"①③⑥"},"ans":"A","note":"答（A）。依考試當時適用之 101 年版規範：⑤504.4.1 廁所盥洗室內應設置兩處緊急求助鈴（一處在馬桶前緣往後 15 公分、馬桶座位上 60 公分，另一處距地板面高 35 公分範圍內供跌倒後使用）；①602.4 浴室求助鈴一處距地板面高 90-120 公分，另一處距地板面高 35 公分範圍內；③1005.1 無障礙客房內求助鈴應至少設置兩處（90-120 公分及 35-45 公分）。②昇降機依 406.4 操作盤設緊急事故通報器，非兩處求助鈴；④停車位與⑥輪椅觀眾席位無設置求助鈴之規定。故為①③⑤。現行 108 年版廁所 504.4.1、浴缸 605.5.1、淋浴間 606.6.1、客房 1005.1 仍設 2 處，但跌倒用一處改為距地板面 15～25 公分。 【依據】建築物無障礙設施設計規範（101 年版）504.4.1、602.4、1005.1、406.4"},{"c":508,"law":"無障礙環境與其他","g":"無障礙環境與其他","h1":"第 7 篇　無障礙環境與其他","h2":"7-1 無障礙設施設計","h3":"通用設計原則","year":108,"no":36,"art":"7-1 無障礙設施設計","q":"下列何者不屬於「通用設計（universal design）」原則之設計？","opts":{"A":"撥桿式手把","B":"無門檻設計","C":"浴室扶手","D":"單邊式課桌椅"},"ans":"D","note":"答案 D。通用設計強調「公平使用、彈性使用、簡單易懂、資訊易察覺、容許錯誤、省力、適當的尺寸與空間」，使不同能力、年齡者都能使用。單邊式課桌椅（桌板只在一側，多為右側）使慣
