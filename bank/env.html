範圍（約 380～780 nm）並乘上視感度加權，正確；B：光度（發光強度）＝單位立體角內的光通量，單位 cd＝lm/sr，正確；C：照度＝單位面積入射光通量，lx＝lm/m²，正確。\n【依據】課程教材：03 電氣設備計畫 p.2（可見光 380～780 nm）、p.9（光的單位：光通量 lm、光度 cd、輝度cd/m²、照度 lx）"},{"c":124,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"醫院各空間照度順序","year":109,"no":13,"art":"2-2 人工照明","q":"於醫院的設計中，下列各空間的照度基準排列順序何者正確？","opts":{"A":"辦公室＞手術室＞候診室","B":"手術室＞辦公室＞候診室","C":"手術室＞候診室＞辦公室","D":"辦公室＞候診室＞手術室"},"ans":"B","note":"答案 B。照度基準依視覺作業精細程度而定：手術室（視覺作業極精細、需辨識組織色澤，一般照明之外另有無影燈）最高；辦公室（長時間閱讀、書寫、電腦作業）次之；候診室（休憩、等候性質）最低。故為 手術室＞辦公室＞候診室。課程教材依作業難度分級之照度：低難度（玄關、用餐、商業、禮堂等）60～300 lx；中難度（辦公、教室、會議）300～600 lx；高難度（製圖、設計）600～1200 lx；極高難度（精密製作、精密醫療）＞1200 lx。手術室屬精密醫療作業、照度最高，辦公室屬中難度，候診室屬休憩等候之低難度，故順序為手術室＞辦公室＞候診室。旁證：《綠建築評估手冊－基本型》2019 年版表 2-4.13「主要作業空間照明功率密度基準 LPDcj」中，醫院檢查、醫療室、手術房為 15 W/m²，辦公室、醫院門診為 10 W/m²，照明用電基準亦反映手術空間所需照度較高（LPD 為用電密度而非照度，僅作佐證）。【查證限制】CNS 照度標準原文本機未取得，教材亦未逐一列出「候診室」，其歸類為整理者依空間性質判斷。 【依據】課程教材：23 S ET 06 採光照明基礎 0422.pdf p.21（照度依作業難度分級）；綠建築評估手冊－基本型（2019 年版）表 2-4.13（手冊 p.77）"},{"c":125,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"節能標章室內照明燈具之標示項目","year":109,"no":30,"art":"2-2 人工照明","q":"具有經濟部節能標章認證的室內照明燈具，下列何者不是產品型錄上應標示的項目？","opts":{"A":"色溫","B":"燈具效率","C":"演色性指數","D":"功率因數"},"ans":"B","note":"答案 B。經濟部（能源署）節能標章「室內照明燈具」能源效率基準與標示方法，要求產品型錄標示額定功率、總光通量、演色性、色溫、發光效率（lm/W）、功率因數、光生物安全性及閃爍等項；「燈具效率」（燈具光輸出比）不在標示項目中，故選 (B)。(A) 色溫、(C) 演色性、(D) 功率因數皆為應標示項目。依中華民國照明學會轉載之「室內照明燈具節能標章能源效率基準與標示方法」修正對照表（能源局 112 年 9 月 26 日改制為能源署後之修正），修正前規定為「產品型錄上應標示產品額定之功率、總光通量、演色性指數、色溫、發光效率、功率因數、光生物安全、閃爍指數及閃爍百分比」，修正後並要求產品本體亦應標示；兩版均無「燈具效率」。注意「發光效率」（lm/W，每瓦流明數）與「燈具效率」（燈具輸出光通量／光源光通量）不同。【查證限制】考試當時（109 年）施行版本之原文未取得，閃爍等項目可能係其後增列；但色溫、演色性指數、功率因數須標示而燈具效率不在其列之判斷，與官方答案一致。 【依據】經濟部能源署「室內照明燈具節能標章能源效率基準與標示方法」修正對照表（中華民國照明學會轉載，lighting.org.tw Edm_F3392；本機無原文）"},{"c":126,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"照明用電密度計算","year":109,"no":32,"art":"2-2 人工照明","q":"某室內每平方公尺之平均照度為 500 lx，燈具發光效率為 50 lm/W，照明率為 0.8，維護率為 0.5，則該空間的用電密度為多少 W/m²？","opts":{"A":"100","B":"50","C":"25","D":"15"},"ans":"C","note":"答案 C。光通量法：E×A＝F×U×M，故每平方公尺所需總光通量 F／A＝E／(U×M)＝500／(0.8×0.5)＝500／0.4＝1250 lm/m²；用電密度＝(F／A)／發光效率＝1250／50＝25 W/m²。驗算：25 W/m²×50 lm/W×0.8×0.5＝500 lx，與已知照度吻合（兩次計算結果相同）。 【依據】光通量法 E＝F·U·M／A（照明設計基本公式）"},{"c":127,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"作業空間照度需求比較","year":110,"no":5,"art":"2-2 人工照明","q":"下列空間或場所作業之照度需求，何者要求最高？","opts":{"A":"製圖作業空間","B":"辦公空間之會議室","C":"學校室外之籃球場","D":"停車場之車道空間"},"ans":"A","note":"答案 A。照度基準隨視覺作業精細程度提高而增加。課程教材 03 電氣設備計畫 p.19 照度標準表：辦公室之製圖室 750～1500 lx（製圖以局部照明可達 1500～3000 lx）、會議室 300～750 lx；學校之籃球場約 50～150 lx；停車場出入口約 20～100 lx。ET06 p.21 亦分級：高難度（製圖、設計）600～1200 lx、中難度（辦公、教室、會議）300～600 lx、無作業（走道）30～60 lx。故製圖作業空間要求最高。【查證限制】CNS 12112 原文本機無，以教材數值比較。 【依據】課程教材：03 電氣設備計畫 p.19（照度標準表）；23 S ET 06 採光照明基礎 0422 p.21（照度與作業難度）"},{"c":128,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"光源色溫與光譜","year":110,"no":19,"art":"2-2 人工照明","q":"有關自然光及人工照明之光源敘述，下列何者錯誤？","opts":{"A":"色溫度主要以絕對溫度來表示光源之顏色","B":"白熾燈泡之色溫度約在 7000 K","C":"水銀燈光譜中較缺乏紅光","D":"中午陽光之色溫度約在 5500 K"},"ans":"B","note":"答案 B（錯誤敘述）。白熾燈（鎢絲燈）光色偏黃橙，色溫約 2700～3000 K（暖色）；7000 K 屬偏藍白的冷色光（如陰天或天空光）。A 正確：色溫以絕對溫度 K 表示光源顏色；C 正確：水銀燈光譜在紅光區能量弱，顯色性較差，紅色物體顯得暗；D 正確：晴天正午太陽直射光約 5000～5600 K（ET06 p.41 色溫圖標 Noon Sunlight 5600K），5500 K 與之相近；6500 K 以上已屬陰天或天空光。課程教材 03 電氣設備計畫 p.8：色溫度小於 3300 K 為暖色（白熾燈約 3000 K），大於 5000 K 為冷色；ET08 p.16：水銀燈光譜缺乏紅色、演色指數很低。 【依據】課程教材：03 電氣設備計畫 p.7、p.8（色溫度）；23 S ET 08 照明設計 p.16（水銀燈缺紅光）；23 S ET 06 採光照明基礎 p.41（色溫）"},{"c":129,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"室內光環境品質","year":110,"no":21,"art":"2-2 人工照明","q":"關於室內光環境的品質，下列敘述何者錯誤？","opts":{"A":"辦公建築中的水平面照度基準值，繪圖室＞會議室＞走廊","B":"為避免辦公場所中螢幕顯示器造成眩光，宜減少天花板燈具的遮光角","C":"不舒適眩光等級可採用 CIE 統一眩光值（UGR）表示","D":"辦公室照明燈具的演色性指標 Ra 至少應為 80"},"ans":"B","note":"答案 B（錯誤敘述）。遮光角愈大，燈具發光體愈被燈罩或格柵遮蔽，從一般視角看到的燈具亮度愈低，愈不易在螢幕上產生反射眩光，故應「增加」遮光角；03 電氣設備計畫 p.16：可採用遮光角度較大的照明器具或限制燈具輝度，避免眩光。A 正確：同教材 p.19 照度標準表，製圖室 750～1500 lx、會議室 300～750 lx、走廊約 75～300 lx。C 正確：UGR 為 CIE 之不舒適眩光評價指標。D 正確：CNS 12112 要求辦公室 Ra≧80；教材 p.6 演色性等級表（CIE）把辦公室列在 70≦Ra≦85 級，本題依現行 CNS 以 D 為正確。【查證限制】CNS 12112 原文本機無。\n【依據】課程教材：03 電氣設備計畫 p.6（演色性等級）、p.16（遮光角與眩光）、p.19（照度標準表）；23 S ET06 採光照明基礎 p.21（照度分級）；CNS 12112 照度標準（本機無原文）"},{"c":130,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"速食餐廳用餐空間照度","year":110,"no":40,"art":"2-2 人工照明","q":"速食餐廳用餐空間之水平照度（勒克斯），下列何者較為適當？","opts":{"A":"50","B":"250","C":"1000","D":"3000"},"ans":"B","note":"答案 B（250 lx）。速食餐廳用餐空間需兼顧用餐、閱讀菜單與明亮氣氛，一般約 200～300 lx。課程教材 03電氣設備計畫 p.19 照度標準表：辦公建築之餐廳 200～500 lx、學校餐廳 200～750 lx；ET06 p.21：低難度作業（玄關、用餐、商業、禮堂）60～300 lx，250 lx 均落在區間內。50 lx 過暗，僅適用走道或氣氛餐廳；1000 lx 屬製圖等精細作業等級（教材 600～1200 lx），3000 lx 接近戶外日光，耗能又易眩光。【查證限制】速食餐廳之 CNS 12112數值本機無，以教材「餐廳／用餐」區間判斷。 【依據】課程教材：03 電氣設備計畫 p.19（照度標準表）；23 SET 06 採光照明基礎 0422 p.21（照度與作業難度）"},{"c":131,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"日光色溫","year":111,"no":10,"art":"2-2 人工照明","q":"正午太陽直射光的色溫（K）與下列何者最為接近？","opts":{"A":"1000","B":"3500","C":"5000","D":"6500"},"ans":"C","note":"答案 C。色溫是光源光色與黑體輻射相比對應的絕對溫度。課程教材 ET06 p.41 色溫刻度圖：燭光 1800 K、白熾燈 2800 K、鹵素燈 3200 K、正午日光（Noon Sunlight）5600 K、顯示器 6500 K（接近陰天或北向天空光、標準日光 D65）、陰影處 8000 K、藍天天空光 12000～20000 K。晴天正午太陽直射光約 5000～5600 K，選項中 5000最接近（差 600 K；6500 差 900 K）。1000 K 為暗紅火光，3500 K 為暖白光。同頁光譜曲線另標「6000 K (sun)」是把太陽視為黑體的近似值，不是地面正午直射光色溫，作答以刻度圖 5600 K 為準。 【依據】課程教材：23 SET 06 採光照明基礎 p.41"},{"c":132,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"光源發光效率","year":111,"no":11,"art":"2-2 人工照明","q":"下列人工光源中，何者之發光效率最高？","opts":{"A":"2000 K，150 W，16500 lm","B":"5000 K，28 W，2500 lm","C":"3500 K，5 W，400 lm","D":"4000 K，80 W，6000 lm"},"ans":"A","note":"答案 A。發光效率 = 光通量（lm）÷ 消耗電力（W），單位 lm/W。A：16500 ÷ 150 = 110；B：2500 ÷ 28 ≈89.3；C：400 ÷ 5 = 80；D：6000 ÷ 80 = 75。驗算：150 × 110 = 16500 ✓。故 A 最高。色溫（K）與發光效率無關，是干擾資料。 【依據】課程教材：23 S ET 08 照明設計 230421 p.4（效能＝發光量對耗能量之比，lm/W）"},{"c":133,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"照明（均齊度與直接／間接照明）","year":111,"no":12,"art":"2-2 人工照明","q":"有關建築照明之敘述，下列何者錯誤？","opts":{"A":"CNS 照度標準對於各種建築空間之照度訂有建議值","B":"過高的輝度是產生眩光的主要原因之一","C":"均齊度是指室內照度的均勻程度，數值介於 0~1 之間，數值愈小表示愈均勻","D":"相同的人工光源，分別以直接照明與間接照明的方式設置，在相同條件的位置所測得的照度，以直接照明較高"},"ans":"C","note":"答案 C（錯誤）。均齊度（照度均勻度）= 最小照度 ÷ 平均照度（或最小÷最大），介於 0～1，數值愈接近 1表示愈均勻，數值愈小表示照度分布愈不均，並非「愈小愈均勻」。A：CNS 照明標準訂有各類場所之照度建議值✓；B：過高輝度或輝度對比過大為眩光主因 ✓；D：間接照明光線經天花板或牆面反射，損失較大，同位置照度較直接照明低 ✓（課程教材：半間接照明「陰影減少但效率低」）。課程教材另載均齊性要求「最小對空間平均照度之比值不小於 0.67～0.8」，即數值愈大愈均勻。A 項：綠建築評估手冊－基本型（2019 年版第三版第二刷，111 年3 月 1 日起實施，最接近考試年度之版本）日常節能指標之照明節能評估說明，要求設計者「依 CNS 國家照度標準設計」，手冊對照明健康不重複把關；課程教材（03 電氣設備計畫 n p.19）「照度標準」表亦依辦公室、學校、住宅、工廠等用途列出各空間之建議照度範圍，與 A 項敘述相符。同段手冊並指出「採用太多間接照明之設計」較難通過照明節能查核，也印證間接照明效率較低（支持 D）。（CNS 照明標準本身之條文本機無檔案，A 項「訂有建議值」之措辭以上述手冊與教材佐證。） 【依據】綠建築評估手冊－基本型（2019 年版第三版第二刷）p.75（PDF 第 79 頁）；課程教材：23 S ET 06 採光照明基礎 p.21；23 S ET 08 照明設計 p.36；03 電氣設備計畫 n p.19"},{"c":134,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"眩光之物理指標","year":112,"no":10,"art":"2-2 人工照明","q":"下列那一個物理指標與眩光程度的關係最密切？","opts":{"A":"照度","B":"色溫度","C":"輝度","D":"照度均齊度"},"ans":"C","note":"答案 C。眩光是視野中過高的輝度（luminance，單位 cd/m²）或過大的輝度對比所引起的不舒適或視覺障礙，故與輝度關係最密切。照度（lx）表被照面之入射光通量密度，與眩光無直接對應；色溫度（K）表光色；照度均齊度表工作面照度之均勻程度，三者皆非眩光之直接指標。（相關指標如 UGR、DGP 皆以光源輝度、立體角與背景輝度計算。）課程教材 03 電氣設備計畫 p.9 定義輝度（亮度）單位 cd/m²、照度單位 lx；p.16 指出注視範圍內若有輝度較大的光源存在，就容易產生眩光，可採遮光角度較大之燈具或限制燈具輝度。 【依據】課程教材：\n03 電氣設備計畫 p.9、p.16"},{"c":135,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"減緩眩光的手法","year":112,"no":12,"art":"2-2 人工照明","q":"室內空間有眩光問題產生時，下列那些手法較可能減緩眩光的程度？①減少燈具的數量 ②調整燈具的位置 ③提高燈具光源的演色性","opts":{"A":"①②","B":"②③","C":"①③","D":"①②③"},"ans":"A","note":"答案 A。眩光與視野中高輝度光源之數量、位置（相對視線的角度）、輝度與背景對比有關。①減少燈具數量（或改用較低輝度、有遮光角之燈具）可減少眩光源；②調整燈具位置（使之移出視線方向、加大視角）可避免直接眩光與反射眩光；③演色性（Ra）表示光源對物體顏色的還原程度，與亮度及眩光無關，提高演色性無法減緩眩光。故①②正確。課程教材 23 S ET 06 採光照明基礎 p.26：眩光改善手段包括降低光源（窗戶）尺寸或移至視線邊緣處；03 電氣設備計畫 p.16：採遮光角度較大之燈具或限制燈具輝度。 【依據】課程教材：23 S ET 06 採光照明基礎 p.26；03 電氣設備計畫 p.16"},{"c":136,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"照明節能計畫","year":112,"no":33,"art":"2-2 人工照明","q":"有關照明節能計畫，下列敘述何者錯誤？","opts":{"A":"高效率光源是指 lm/W 數值較高的光源","B":"螢光燈管長度越長，通常 lm/W 越高","C":"照度均齊度不因光源配置位置的不同而改變","D":"良好的採光計畫有利於照明節能"},"ans":"C","note":"答案 C（錯誤）。照度均齊度（工作面最小照度與平均照度之比等）直接受燈具配置影響：燈具間距與安裝高度比不當會使照度不均，須調整位置、間距或加反射板才能改善，故 C 錯誤。A 發光效率（lm/W）愈高愈節能；B 同類型螢光燈管愈長（如 T5、T8 長管）鎮流器與電極損失之比例愈小，發光效率通常愈高；D 良好採光可減少日間人工照明之使用，皆正確。 【依據】課程教材：03 電氣設備計畫 p.14（各種光源之效率比較）、p.22（省能照明方式：選擇高效率光源、晝光的利用）；23 S ET 06 採光照明基礎 p.21（均齊性）"},{"c":137,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"照度與色溫搭配","year":113,"no":8,"art":"2-2 人工照明","q":"色溫及照度的搭配可呈現不同的空間氣氛，下列那種照明組合的效果敘述最不適當？","opts":{"A":"高照度高色溫：明亮清爽","B":"低照度低色溫：放鬆舒適","C":"高照度低色溫：清新涼爽","D":"低照度高色溫：寂靜冷清"},"ans":"C","note":"答案 C（最不適當）。依 Kruithof 照度—色溫舒適關係：高色溫（冷白光）搭配高照度為明亮清爽；低色溫（暖色光）搭配低照度為溫暖、放鬆舒適；低照度配高色溫會顯得陰冷、寂靜冷清；而高照度配低色溫（暖光）則令人感到悶熱、不舒服，並非「清新涼爽」，涼爽感來自高色溫。故 C 最不適當。 【依據】照明原理：Kruithof照度—色溫舒適曲線；課程教材：03 電氣設備計畫 p.8（色溫度與冷暖色）"},{"c":138,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"燈具更新與照明耗能","year":113,"no":9,"art":"2-2 人工照明","q":"某空間原本使用 20 W、2000 lm 的 A 燈具，更新後採用 18 W、2500 lm 的 B 燈具，在其他照明條件不變的情況下，下列敘述何者錯誤？","opts":{"A":"若燈具數量維持不變，更新後照度會提升為 1.25 倍","B":"若燈具數量維持不變，更新後照明功率密度會下降為 0.9 倍","C":"若照度維持不變，A 燈具數量為 B 燈具之 1.25 倍","D":"若照度維持不變，更新後整體照明耗能為更新前的 0.8 倍"},"ans":"D","note":"答案 D（錯誤）。A：數量不變，照度 ∝ 總光通量，2500/2000 = 1.25 倍 ✓。B：功率密度 ∝ 總瓦數，18/20 =0.9 倍 ✓。C：照度不變則總光通量相同，設 B 用 n 盞（2500n lm），A 需 2500n/2000 = 1.25n 盞 ✓。D：更新前耗能 = 20 × 1.25n = 25n W，更新後 18n W，比值 18/25 = 0.72（約 0.72 倍，不是 0.8 倍）。驗算：1.25n×20 = 25n；\n18n/25n = 0.72 ✓。 【依據】課程教材：03 電氣設備計畫 p.18（光通量法 E＝NFUM／A）"},{"c":139,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"照度與輝度（反射率）","year":113,"no":16,"art":"2-2 人工照明","q":"甲乙兩張完全相同的白色辦公桌，在照明與環境條件完全相同的情況下，若將甲辦公桌的桌面色彩改為黑色，下列敘述何者正確？","opts":{"A":"改成黑色之後的甲辦公桌的水平桌面照度會比乙辦公桌低","B":"改成黑色之後的甲辦公桌的輝度與照度均和乙辦公桌相同","C":"改成黑色之後的甲辦公桌的水平桌面照度會比乙辦公桌高","D":"改成黑色之後的甲辦公桌的輝度會比乙辦公桌低"},"ans":"D","note":"答案 D。照度（lx）是入射到桌面的光通量密度，取決於光源與環境，不受桌面本身顏色（反射率）影響，故甲乙照度相同（A、C 不成立，B 因照度相同但輝度不同也不成立）。輝度（cd/m²）為表面朝眼睛反射／發出的光，漫反射面輝度 L = ρE/π，黑色桌面反射率 ρ 低，輝度比白桌面低，故 D 正確。（嚴格而言，桌面反射率會影響室內相互反射的微量間接光，但題目以「照度相同」為通則。） 【依據】課程教材：23 S ET 06 採光照明基礎p.22～23（反射率、輝度）"},{"c":140,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"光度單位","year":114,"no":11,"art":"2-2 人工照明","q":"關於光照指標的單位，下列敘述何者錯誤？","opts":{"A":"lm/W 是發光效率的單位","B":"lx 是照度的單位","C":"cd/m² 是輝度的單位","D":"cd 是光通量的單位"},"ans":"D","note":"答案 D（錯誤）。cd（燭光）是「光度（發光強度）」的單位，表示光源在某方向上單位立體角內的光通量（1 cd＝1 lm/sr）；光通量的單位是 lm（流明）。A 正確：發光效率＝光通量／消耗電功率，單位 lm/W。B 正確：\n照度＝入射光通量／受照面積，單位 lx（＝lm/m²）。C 正確：輝度（亮度）為某方向光度除以該方向之視面積，單位 cd/m²（nt）。課程教材「光的單位」：光通量 lm、光強（光度）cd、輝度 cd/m²、照度 lx，與上述相同。 【依據】課程教材：03 電氣設備計畫 p.9；課程教材：23 S ET 08 照明設計 p.4"},{"c":141,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"教室光源演色性","year":114,"no":13,"art":"2-2 人工照明","q":"下列人工光源的平均演色性指數，那些較適合用於一般學校教室？①60 ②70 ③80 ④90","opts":{"A":"①②③④","B":"僅②③④","C":"僅③④","D":"僅②③"},"ans":"C","note":"答案 C。Ra 越接近 100，物體顏色越接近真實。教室需長時間閱讀並辨識顏色，現行照明標準（CIE／EN12464-1 等）要求教室 Ra 不低於 80，故 ③80、④90 適合，①60、②70 演色性不足。【查證限制／爭議】課程教材「光源演色性等級及其適用場所」表（註明取材自 CIE）把學校列在第 2 級 70≦Ra≦85，第 1 級 Ra≧85 列住宅、餐廳等。照此表，②70 已達學校的等級下限，④90 也高於要求，結論會接近 B（②③④），與官方答案 C 不一致；官方應是依現行教室 Ra≧80 的標準出題。CNS 照度標準原文本機沒有，以官方答案 C 為準。 【依據】課程教材：03 電氣設備計畫 p.6；CNS 照度標準、CIE／EN 12464-1（本機無原文）"},{"c":142,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"照明率影響因素","year":114,"no":14,"art":"2-2 人工照明","q":"下列何者非影響照明率（coefficient of utilization）的主要因素？","opts":{"A":"燈具效率","B":"空間尺度","C":"天花板牆壁的材質","D":"採光係數"},"ans":"D","note":"答案 D。照明率 U（CU）＝到達工作面之光通量／燈具光源發出之總光通量，用於光通量法 E＝N·F·U·M／A。影響因素包括：燈具效率與配光（A）、室形指數（由房間長、寬及燈具至工作面高度決定，即空間尺度 B）、天花板、牆面、地板之反射率（材質與顏色，C）。D 採光係數是「自然採光」指標（室內某點晝光照度與全天空照度之比），與人工照明之照明率無關。 【依據】課程教材：03 電氣設備計畫 p.18（光通量法 E＝NFUM／A、室指數 K＝XY／[(X＋Y)H]）；23 S ET 07 採光設計 230421 p.28～29（晝光係數 DF）"},{"c":143,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"TAL 照明","year":114,"no":34,"art":"2-2 人工照明","q":"下列何者是 TAL 照明（Task and Ambient Lighting）的特色？","opts":{"A":"透過間接照明方式改善空間整體氣氛","B":"以高發光效率的光源達到照明節能的效果","C":"可減少空間整體的照明用電密度同時滿足照度需求","D":"燈具全部配置在天花板上，光線分布均勻"},"ans":"C","note":"答案 C。TAL（作業與環境照明）將照明分為兩部分：環境照明（ambient）以較低照度提供空間整體亮度，作業照明（task）於桌面等工作位置局部補足所需照度。如此不需讓全室都達到作業照度，可降低整體照明功率密度（W/m²），又能滿足工作面照度，C 為其特色。A 為間接照明的特色；B 是光源選擇（高效率燈具）的節能手法，非 TAL 特有；D 為天花板均勻配置之全般照明，正與 TAL 相反。（課程教材將照明方式分為全面均齊、分區均齊、局部、混合及建築化照明，TAL 屬「整體＋局部」之混合照明；綠建築評估手冊照明節能對策 c6 亦主張精密工作空間天花照明不必太亮，以檯燈、投光燈加強工作面照明。） 【依據】課程教材：03 電氣設備計畫 p.21；\n綠建築評估手冊－基本型（2023 年版）2-4 日常節能指標規劃重點 C 照明節能 c6，p.58"},{"c":144,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"通風量計算因子","year":102,"no":9,"art":"3-1 自然通風","q":"下列何者不屬於計算建築物室內通風換氣量所需要的因子？","opts":{"A":"建築外殼表面風壓係數","B":"開口流量係數","C":"通風開口面積","D":"建築內部平均風速"},"ans":"D","note":"答案為 D。\n風力通風量公式：\nQ = αA × V × √(C1 − C2)\n・α：開口流量係數（B）\n・A：開口面積（C）\n・V：室外基準風速\n・C1、C2：迎風面、背風面的風壓係數（A）公式用的是「室外」基準風速，不是室內平均風速；室內風速是通風後的結果，不是計算通風量的輸入因子。\n【依據】建築環境控制一般原理（風力通風量公式）"},{"c":145,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"太陽煙囪","year":103,"no":7,"art":"3-1 自然通風","q":"下列自然通風建築設計，何者之太陽煙囪（solar chimney）通風效果最大？\n（附圖：四個剖面示意圖：(A) 斜屋頂開口建築，外部氣流掠過屋頂，室內氣流由兩側開口進入、經屋頂開口排出；(B) 大跨度曲面屋頂覆蓋之開放式建築，氣流水平穿越屋頂下方；(C) 多層建築側邊有自屋頂引入外氣向下送入各層之捕風豎道（另繪太陽），氣流橫向穿越各樓層；(D) 單層建築中央設高聳豎井（煙囪）突出屋頂，受日射照射，室內兩側進氣匯集後經豎井向上排出。）","opts":{"A":"如圖(A)","B":"如圖(B)","C":"如圖(C)","D":"如圖(D)"},"ans":"D","note":"答案 D。太陽煙囪利用日射加熱豎井內空氣，產生溫差浮力（煙囪效應），通風量隨豎井高度（進排氣口高差）與內外溫差增加而增大。圖(D)設有高聳且受日射照射之豎井，室內兩側低處進氣、經豎井頂部排出，高差最大，最符合太陽煙囪原理。圖(A)主要靠屋頂氣流負壓之風力通風；圖(B)為遮陽大屋頂下之水平穿堂風；圖(C)為頂部捕風豎道引風向下送入各層，屬風壓式捕風而非熱浮力排氣。課程教材亦列太陽煙囪手法：增加室內淨高與上下開口高差、上端引入日射增加垂直溫度差。 【依據】課程教材：23 S ET 05 熱舒適節能設計 p.33、p.34（太陽煙囪）"},{"c":146,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"通風塔（風塔）之起源","year":105,"no":7,"art":"3-1 自然通風","q":"通風塔（wind tower）起源於下列何種氣候區？","opts":{"A":"乾燥氣候區","B":"溫暖氣候區","C":"濕熱氣候區","D":"濕冷氣候區"},"ans":"A","note":"答案 A。通風塔（捕風塔，波斯語 badgir）起源於伊朗、中東、北非等乾燥（乾熱）氣候區，利用高處較強、較潔淨的風導入室內，並常配合地下水道、水缸或濕潤表面產生蒸發冷卻，再經厚重土牆的熱容量調節室溫；\n乾燥空氣使蒸發冷卻效果顯著。濕熱氣候區雖也重視通風，但傳統上以高架、開敞、穿堂風為主，並非風塔之起源；濕冷、溫暖氣候區不以風塔為特色。課程教材之過熱期設計策略亦列「潮濕－自然通風」「乾燥－蒸發式散熱」，並以巴格達（RH 約 24%）為熱乾氣候代表。【查證限制】課程教材未直接敘述風塔之起源地，起源部分依建築氣候與傳統建築通論。 【依據】課程教材：23 S ET 05 熱舒適節能設計 p.2（依氣候之設計策略）；23 S ET02 氣候與外部環境 p.25（熱乾氣候）"},{"c":147,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"風壓係數定義","year":105,"no":9,"art":"3-1 自然通風","q":"下列何者為風壓係數(Cp)的定義？（P 為壓力，ΔP 為壓力差，ρ 為空氣密度，U 為風速）","opts":{"A":"Cp＝ΔP/0.5 ρU²","B":"Cp＝P/0.5 ρU²","C":"Cp＝ΔP/ρU²","D":"Cp＝ΔP/0.5 ρU"},"ans":"A 或 B 均給分（更正前公告答案 A）","note":"風壓係數 Cp =（P－P0）／（½ρU²）：建築表面某點壓力與基準靜壓 P0 之差，除以基準高度風速之動壓½ρU²，為無因次量。A 以壓力差 ΔP 表示，最完整。B 以 P 表示，若 P 指相對於基準靜壓之表面風壓（錶壓），意義相同，許多教材即寫成 Cp = P／（½ρU²），故兩者均可。C 少了 ½ ，分母不是動壓；D 分母為 U 一次方，因次不對。【查證限制／爭議】考選部未公布更正理由，以下為推測：B 之 P 可解讀為「風壓」（已是相對基準靜壓的壓力差），故一併給分。 【依據】建築通風與風工程教材（風壓係數定義）"},{"c":148,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"自然通風型建築設計","year":106,"no":9,"art":"3-1 自然通風","q":"下列何者與自然通風型建築設計比較無直接的關聯？","opts":{"A":"室內外噪音問題","B":"採光照明","C":"熱舒適程度","D":"室內空氣品質"},"ans":"B","note":"答案 B。自然通風需開窗引入外氣：A 開窗會使室外交通、環境噪音傳入，噪音是決定能否開窗通風的重要條件；C 通風可帶走室內熱量、增加氣流提高人體散熱，直接影響熱舒適；D 引入外氣稀釋 CO₂ 與污染物，直接影響室內空氣品質（但室外污染亦會帶入）。B 採光照明主要與開窗面積、方位、玻璃透光率及人工照明有關，雖開窗同時兼具採光，但並非通風設計之直接目標，關聯較小。 【依據】自然通風一般原理"},{"c":149,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"通風換氣敘述","year":106,"no":11,"art":"3-1 自然通風","q":"有關通風換氣之敘述，下列何者錯誤？","opts":{"A":"通風量決定乃取決於所需之室內環境品質","B":"都市環境噪音過大，宜採用機械通風設備","C":"建築物表面風壓會因室內外溫度差而有顯著變化","D":"室外污染物會透過通風換氣而傳遞至室內"},"ans":"C","note":"答案 C（錯誤）。建築物表面風壓 P＝C×ρV²/2，由風速、風向與風壓係數（建築形狀）決定；室內外溫度差造成的是浮力（煙囪效應）所產生的室內外壓力差，與外表面風壓不同，溫差不會使表面風壓「顯著變化」。A：\n通風量依必要之室內空氣品質（CO₂、污染物、熱、濕）決定 ✓。B：外部噪音大時無法開窗，宜改用機械通風並設消音措施 ✓。D：外氣污染（PM2.5、廢氣）會隨通風進入室內，需過濾或慎選取氣口 ✓。 【依據】自然通風一般原理（風壓通風與浮力通風）"},{"c":150,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"通風換氣目的","year":106,"no":12,"art":"3-1 自然通風","q":"下列何者不屬於通風換氣的主要目的？","opts":{"A":"供給新鮮空氣，移除氣味和污染物","B":"降低室內的熱負荷","C":"防止室內材料劣化","D":"增強熱由皮膚蒸散，以增進生理舒適"},"ans":"C","note":"答案 C。通風換氣的主要目的有三：①衛生通風—供給新鮮空氣（氧氣）、稀釋並排除 CO₂、氣味與污染物（A）；②排熱通風—以外氣帶走室內熱量、降低熱負荷（B）；③舒適通風—增加人體周圍氣流，促進皮膚汗水蒸發散熱，提升熱舒適（D）。防止材料劣化（如避免結露發霉）雖可能是通風的附帶效果，但不屬於通風換氣的主要目的。 【依據】自然通風一般原理（通風目的）"},{"c":151,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"通風量計算","year":107,"no":9,"art":"3-1 自然通風","q":"某房間有兩個窗戶可對流通風，假設外氣進入室內之風速為 0.2 m/s，有效開口面積為 0.4 m2，該房間的通風量是多少 m3/h？","opts":{"A":"57.6","B":"28.8","C":"288","D":"576"},"ans":"C","note":"答（C）。通風量 Q＝有效開口面積 A × 通過開口之風速 v。Q＝0.4 m2 × 0.2 m/s＝0.08 m3/s；換算每小時：\n0.08 × 3600＝288 m3/h。驗算一：0.2 × 3600＝720 m/h，720 × 0.4＝288 m3/h。驗算二：0.4 × 0.2＝0.08，0.08 × 3600＝288，兩次結果一致。（A）57.6＝288／5、（B）28.8 少一位數、（D）576 為 2 倍，皆為計算或單位換算錯誤。\n題目已給「有效」開口面積，不需再乘流量係數。"},{"c":152,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"重力換氣與風力換氣","year":108,"no":7,"art":"3-1 自然通風","q":"有關換氣原理之敘述，下列何者錯誤？","opts":{"A":"重力換氣的原理，室內氣溫較外氣溫為高，因此較輕的室內空氣自上方的開口向外逸出，而較重的外氣自下方開口流入室內","B":"重力換氣的原理，室內氣溫較外氣溫為高，雖僅有一處開窗，大致上空氣自窗上部流入，自窗下部流出而進行換氣","C":"風力換氣的原理，建築物壁面受風時，迎風面產生正壓，背風面產生負壓","D":"風力換氣之情形是必須設置風之入口及出口，且入口及出口應設於風壓係數之差較大位置方具良好通風的效果"},"ans":"B","note":"答案 B（錯誤）。重力（溫差、浮力）換氣時，室內較暖、密度較小，中性帶以上室內壓力大於室外，空氣向外流出；中性帶以下則外氣流入。即使只有一處開窗，也是「窗下部流入、窗上部流出」，B 把方向說反。A 為上下兩開口之溫差換氣，正確；C、D 為風力換氣：迎風面正壓、背風面負壓，需有入口與出口，兩開口風壓係數差愈大，通風量愈大，正確。課程教材圖示亦為單一開口「下進上出」、上下雙開口加強浮力效應。 【依據】課程教材：23 S ET 05 熱舒適節能設計 p.32（浮力通風：單一開口下進上出、上下雙開口加強浮力效應）"},{"c":153,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"自然通風換氣次數計算","year":108,"no":8,"art":"3-1 自然通風","q":"某教室尺寸長 9 公尺、寬 8 公尺、高 3 公尺，假設上課採用自然通風（開窗對流），開窗氣流通過面積為 6 平方公尺，風速為每秒 0.1 公尺，此教室每小時換氣次數為多少？","opts":{"A":"10 次","B":"20 次","C":"30 次","D":"15 次"},"ans":"A","note":"答案 A。通風量 Q＝A×v＝6 m²×0.1 m/s＝0.6 m³/s＝0.6×3600＝2,160 m³/hr。室容積 V＝9×8×3＝216 m³。換氣次數 n＝Q/V＝2,160÷216＝10 次/hr。驗算：216×10＝2,160 ✓；另以每秒計：0.6÷216×3600＝10 ✓。"},{"c":154,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"居室有效通風面積","year":109,"no":5,"art":"3-1 自然通風","q":"依據建築技術規則，一般居室之開口或開窗之有效通風面積與室內樓地板面積的百分比，不得小於多少？","opts":{"A":"3","B":"5","C":"7","D":"10"},"ans":"B","note":"答案 B（5%）。建築技術規則建築設計施工編第 43 條第 1 項第 1 款：一般居室及浴廁之窗戶或開口之有效通風面積，不得小於該室樓地板面積百分之五；但設置符合規定之自然或機械通風設備者，不在此限。比較：同條第 2 款廚房之有效通風開口面積不得小於該室樓地板面積十分之一（10%），且不得小於 0.8 m²，所以 (D) 10% 是廚房的規定而非一般居室。 【依據】建築技術規則建築設計施工編第 43 條第 1 項第 1 款、第 2 款"},{"c":155,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"風力換氣","year":109,"no":6,"art":"3-1 自然通風","q":"有關風力換氣之敘述，何者錯誤？","opts":{"A":"通風換氣量與開口面積成正比","B":"流量係數與風速成正比","C":"屋面的風壓係數與建築物的外型有關","D":"依據迎風面與背風面的壓差來達成換氣"},"ans":"B","note":"答案 B。風力換氣量常以 Q＝α·A·v·√(Cf－Cb) 表示（α：流量係數，A：開口面積，v：風速，Cf、Cb：迎風面與背風面風壓係數）。流量係數 α 取決於開口的形狀、構造與阻力（開口愈順暢 α 愈大），不是與風速成正比，\n(B) 錯誤；風速 v 才是與換氣量成正比的另一個變數。(A) Q 與 A 成正比，正確。(C) 風壓係數隨建築外形、屋面坡度與風向而異，正確。(D) 風力換氣靠迎風面正壓與背風面負壓之壓差驅動，正確。 【依據】通用建築環境控制教材（自然通風計算）"},{"c":156,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"換氣計畫","year":109,"no":7,"art":"3-1 自然通風","q":"有關換氣計畫之敘述，下列何者錯誤？","opts":{"A":"室內人數眾多或有大量污染物發生時，須大量換氣以維持室內空氣品質之穩定","B":"換氣方式依原動力可分為自然換氣和機械換氣兩種","C":"自然換氣是依自然風之風壓力或室內外溫度差造成之浮力而進行換氣","D":"自然換氣和機械換氣，兩者之空氣流動原理不相同"},"ans":"D","note":"答案 D。無論自然換氣或機械換氣，空氣流動的原理都是「兩空間（或開口兩側）存在壓力差，空氣由高壓流向低壓」；差別只在壓力差的來源：自然換氣靠風壓與室內外溫差產生的浮力（煙囪效應），機械換氣靠風機產生壓力差。故 (D)「原理不相同」錯誤。(A) 人多或污染源多時須加大換氣量，正確。(B) 依動力分為自然與機械換氣，正確。(C) 正確。 【依據】通用建築環境控制教材（換氣計畫）"},{"c":157,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"重力（浮力）通風量與高度差","year":110,"no":18,"art":"3-1 自然通風","q":"某室內空間在無風狀態下，若將高低兩扇窗中心點的距離拉大至原距離的 4 倍，則重力通風的換氣量會如何改變？","opts":{"A":"1/2 倍","B":"2 倍","C":"4 倍","D":"16 倍"},"ans":"B","note":"答案 B（2 倍）。無風時之浮力（煙囪效應）通風量 Q = Cd · A · √[ 2 g · Δh · (Ti − To) / Ti ]，Q 與兩開口中心高度差 Δh 之平方根成正比。Δh 變為 4 倍，則 Q 變為 √4 = 2 倍（其他條件不變）。（驗算：√4 = 2；若 Δh 為 16倍時才是 4 倍。）選項 4 倍、16 倍是把 Q 誤以為與 Δh 或 Δh² 成正比。 【依據】浮力（溫差）通風量公式 Q＝Cd·A·√[2gΔh(Ti−To)/Ti]（通用原理）；課程教材：23 S ET 05 熱舒適節能設計 p.32–33（上下開口高差愈大浮力通風愈強）"},{"c":158,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"風力換氣參數","year":111,"no":9,"art":"3-1 自然通風","q":"計算風力換氣的效果時，不需要下列那個參數？","opts":{"A":"入風處壁面的風壓係數","B":"出風處壁面的風壓係數","C":"戶外風速","D":"室內外溫度差"},"ans":"D","note":"答案 D。風力（風壓）換氣量 Q = Cd·A·v·√(Cp1 − Cp2)：需要流量係數 Cd、有效開口面積 A、戶外風速 v，以及迎風面（入風處）與背風面（出風處）的風壓係數 Cp1、Cp2。室內外溫度差是「溫差（浮力）換氣」的參數（Q ∝ A·√(h·ΔT)），不屬風力換氣。故答案為 D。"},{"c":159,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"植栽對自然通風之影響","year":112,"no":34,"art":"3-1 自然通風","q":"下列有關植栽敘述及對自然通風的影響，何者正確？","opts":{"A":"常春藤類之灌木叢易於透風","B":"植栽可增強或減弱自然通風","C":"落葉植物不因季節變化而影響通風效果","D":"植栽與建築物的距離遠近不會影響通風效果"},"ans":"B","note":"答案 B。植栽可藉配置引導氣流（如在建築之迎風側以樹籬導風、窄縫增速）而增強自然通風，亦可因過密、過近阻擋氣流而減弱，故 B 正確。A 錯：常春藤屬攀緣藤蔓，非灌木，叢狀灌木枝葉密集反使氣流受阻；C錯：落葉植物冬季落葉後通風較好、夏季枝葉茂盛時通風較差，受季節影響；D 錯：植栽距建築物之遠近改變導風與遮擋之效果，距離過近時使窗口通風受阻、過遠則失去導風功能。 【依據】建築通風設計教材（植栽與風環境）"},{"c":160,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"自然通風所需風速","year":113,"no":7,"art":"3-1 自然通風","q":"某舞蹈教室每小時單位面積所需換氣量為 15 m³，當室內高度 2.5 m、面積 60 m²，若在可對流開窗通風情況下，有效開口面積為 2 m²時，則環境的風速應當至少為多少 m/s？","opts":{"A":"0.063","B":"0.125","C":"0.150","D":"0.250"},"ans":"B","note":"答案 B。每小時單位面積換氣量 15 m³/(h·m²)，總需風量 Q = 15 × 60 = 900 m³/h = 900 ÷ 3600 = 0.25 m³/s。通風量 Q = 有效開口面積 A × 風速 v，故 v = Q ÷ A = 0.25 ÷ 2 = 0.125 m/s。驗算：0.125 × 2 = 0.25 m³/s × 3600 = 900m³/h ✓。室內高度 2.5 m 為干擾條件（換氣量已按單位面積給定，不須再乘高度）。題給 15 m³/(h·m²) 即建築技術規則建築設備編第 102 條表列「舞蹈、棋室、球戲等康樂活動室」之通風量，基準同 102-14。 【依據】建築技術規則建築設備編第 102 條（舞蹈等康樂活動室 15 m³/h·m²）；自然通風量 Q＝A·v（通用原理）"},{"c":161,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"自然通風潛力 VP 計算","year":114,"no":9,"art":"3-1 自然通風","q":"某房間的長度 5 m、寬度 5 m、高度 2.5 m，共有兩扇窗戶：A 窗（面積 2 m²，可開啟面積為 1 m²）、B 窗（面積 3m²，可開啟面積為 2 m²），依據 2021 綠建築設計技術規範，該房間的自然通風潛力 VP 應為多少？\n（附圖：正方形房間平面圖：A 窗位於上方牆面約中央，B 窗（較長）位於右側牆面約中央；兩窗分設於相鄰兩面外牆。）","opts":{"A":"0.12","B":"0.20","C":"0.24","D":"0.36"},"ans":"D","note":"答案 D。題稱「2021 綠建築設計技術規範」，即 110.1.1 生效之建築物節約能源設計技術規範附錄三：VP＝(ΣAvi＋Σ3.0×Acj)／ΣAk（Avi 單側通風窗、Acj 可對流窗之可開窗面積，Ak 通風檢討面積）。A、B 窗在相鄰兩牆，中心連線為直線，可形成對流路徑，兩窗都算可對流窗：Acj＝1＋2＝3 m²；Ak＝5×5＝25 m²（與高度無關）。\nVP＝3.0×3÷25＝0.36。誤當單側窗得 0.12（A），誤用窗總面積得 0.20（B）。 【依據】建築物節約能源設計技術規範（108.12.31 令修正，110.1.1 生效）附錄三「建築物自然通風空調節能評估法」3.4.1 公式（1）、3.4.2 步驟 3"},{"c":162,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-1 自然通風","h3":"換氣次數與開口面積","year":114,"no":28,"art":"3-1 自然通風","q":"某房間面積 50 m²、室內高度 3 m，具有 2 扇可對流通風之窗戶，假設垂直於窗戶之穩定風速為 0.1 m/s，該房間的窗戶有效開口面積為多少 m² 時，恰好能達成每小時換氣次數 3 次？","opts":{"A":"0.63","B":"1.25","C":"2.50","D":"5.00"},"ans":"B","note":"答案 B。換氣量 Q＝換氣次數 N×室容積 V；風力通風以 Q＝有效開口面積 A×風速 v 計算。V＝50×3＝150m³；Q＝3×150＝450 m³/h＝450÷3600＝0.125 m³/s。A＝Q／v＝0.125÷0.1＝1.25 m²。驗算一：1.25×0.1×3600＝450m³/h，450÷150＝3 次/h ✓。驗算二：A＝N·V／(3600 v)＝3×150／(3600×0.1)＝450／360＝1.25 ✓。0.63 約為正解的一半（例如誤把面積再除以 2 扇窗），2.50、5.00 為正解的 2 倍、4 倍，皆不符。 【依據】自然通風量 Q＝A·v；\n換氣次數（一般原理）"},{"c":163,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"外殼熱負荷","year":102,"no":2,"art":"3-2 空氣調節","q":"下列何種熱負荷，不屬於建築外殼熱負荷？","opts":{"A":"玻璃輻射熱","B":"間隙風傳透熱","C":"引入之新鮮外氣熱負荷","D":"壁體傳透熱"},"ans":"C","note":"答案為 C。\n外殼熱負荷是經由建築外殼進入室內的熱量，包括：\n・玻璃的日射輻射熱（A）\n・從門窗縫隙滲入的間隙風熱負荷（B）\n・牆、屋頂的傳導傳透熱（D）C「新鮮外氣負荷」是空調系統為了換氣而刻意引入外氣，冷卻或除濕這些外氣所需的熱量，屬於外氣負荷（系統負荷），與外殼的隔熱、遮陽性能無關，所以不屬於外殼熱負荷。 【依據】建築環境控制一般原理（空調負荷分類）；課程教材：06 空調原理與負荷計算 p.25、p.27"},{"c":164,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"濕空氣線圖","year":102,"no":8,"art":"3-2 空氣調節","q":"空調原理中，關於表示空氣性質的濕空氣線圖，下列何種指標不在呈現範圍內？","opts":{"A":"絕對濕度","B":"水蒸氣分壓","C":"顯熱比","D":"輻射溫度"},"ans":"D","note":"答案為 D。\n濕空氣線圖表示的是濕空氣本身的狀態量，包括：乾球溫度、濕球溫度、露點溫度、相對濕度、絕對濕度（A）、水蒸氣分壓（B）、比焓、比容。圖邊緣另有顯熱比（SHF）量角尺（C），用來畫空調送風狀態線。\n輻射溫度（例如平均輻射溫度 MRT）是周圍壁面的輻射熱環境指標，與空氣的含濕狀態無關，不在濕空氣線圖上。 【依據】建築環境控制一般原理（濕空氣線圖）"},{"c":165,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"潛熱負荷","year":102,"no":11,"art":"3-2 空氣調節","q":"下列何類建築用途及場所之潛熱負荷最大？","opts":{"A":"醫院病房區","B":"辦公大樓會議室","C":"百貨大樓專櫃區","D":"飯店宴席廳"},"ans":"D","note":"答案為 D。\n潛熱負荷主要來自人體散發的水蒸氣（呼吸、流汗）、食物烹調與熱食的水蒸氣，以及外氣帶入的濕氣。飯店宴席廳的特點是：\n・人員密度很高\n・用餐時活動量較大\n・桌上有大量熱食、湯品蒸散水氣\n・需要的外氣量也大所以潛熱負荷最大。\n醫院病房人員密度低；會議室與百貨專櫃的人員密度與水氣來源都不如宴席廳。 【依據】建築環境控制一般原理（空調負荷：顯熱與潛熱）"},{"c":166,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調機房配置與冷凍循環","year":102,"no":24,"art":"3-2 空氣調節","q":"有關空調設備之敘述，下列何者錯誤？","opts":{"A":"空調區劃可依空間之使用時間帶而被採用","B":"將冷凍機分散置設於中間層之作法，一般用於超高層建物","C":"最上層機械房對外氣，排氣處理容易，防音防振也較容易處理","D":"壓縮式冷凍機之冷凍循環順序為蒸發→壓縮→冷凝→膨脹"},"ans":"C","note":"答案為 C。\n機房設在最上層，外氣取入與排氣、排熱確實容易。但機房下方就是使用樓層，主機與泵浦的振動、噪音容易經結構傳到樓下居室，結構也要承受設備重量，所以防音防振「較困難」，不是較容易。\nA 正確：空調區劃可依方位、用途、使用時間帶分區，便於分別運轉以節能。\nB 正確：超高層建築把機房分散在中間設備層，可降低系統靜水壓與管路長度。\nD 正確：蒸氣壓縮式冷凍循環的順序是蒸發（吸熱）→壓縮→冷凝（放熱）→膨脹（降壓），再回到蒸發器。\n【依據】建築環境控制一般原理（空調機房配置、冷凍循環）；課程教材：06 空調原理與負荷計算 p.69"},{"c":167,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"VRV 與外氣","year":102,"no":30,"art":"3-2 空氣調節","q":"VRV 小型中央空調系統如欲提高室內空氣品質，加入下列何種裝置最有效果？","opts":{"A":"風管機","B":"外氣交換系統","C":"空氣清淨機","D":"可變風量系統（VAV）"},"ans":"B","note":"答案為 B。\nVRV（變冷媒流量）系統的室內機只把室內空氣循環冷卻，本身不引入外氣，所以 CO2 與揮發性有機物等污染物容易累積。加裝外氣交換系統（例如全熱交換器），引入新鮮外氣、排出室內污濁空氣，並回收能量，是改善室內空氣品質最有效的方法。\nA 風管機：只是室內機的型式。\nC 空氣清淨機：只能過濾微粒，不能降低 CO2。\nD VAV：是空調箱風量的控制方式，不適用於冷媒系統，也與外氣無關。 【依據】建築環境控制一般原理（VRV系統、全熱交換器）；課程教材：05 空調設備基礎知識 p.32；08 空調節能計畫 p.56"},{"c":168,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"箱型冷氣機","year":102,"no":31,"art":"3-2 空氣調節","q":"有關箱型冷氣機之敘述，下列何者正確？","opts":{"A":"不必使用風管亦可對外交換空氣","B":"可製造冰水，連接室內風機盤管機組，節省空間","C":"水冷式比氣冷式的冷卻效率高","D":"氣冷式比水冷式的空調環境健康"},"ans":"C","note":"答案為 C。\n水的比熱與熱傳係數都比空氣大，冷卻水塔又可利用蒸發冷卻，使冷凝溫度接近濕球溫度，所以水冷式的冷凝效果與性能係數（COP）比氣冷式高。\nA 錯誤：箱型機若要引入外氣，須設外氣風管或外氣口，沒有風管無法與室外換氣。\nB 錯誤：箱型機是直接膨脹式，冷媒直接在機內蒸發冷卻空氣，不製造冰水。製造冰水供風機盤管使用的是冰水主機系統。\nD 錯誤：空調環境是否健康，取決於外氣量、過濾與維護，與冷凝器是氣冷或水冷無關。 【依據】建築環境控制一般原理（箱型空調機）；課程教材：07 空調系統與空間計畫 p.28"},{"c":169,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調系統方式判讀","year":102,"no":34,"art":"3-2 空氣調節","q":"依照下圖之空調設備構成，下列何者是正確之空調系統方式？\n（附圖：系統圖：屋頂設冷卻水塔（風扇與散熱盤管），以往返兩條冷卻水管垂直向下，接到兩個樓層各一台內含風扇的機組；每台機組旁有 OA（外氣）進氣口與 RA（回風）口，機組上方接水平送風管，風管下方各有三個 SA（送風口）。）","opts":{"A":"風管機系統","B":"空調箱系統","C":"風管機系統併用風管","D":"箱型機併用風管系統"},"ans":"D","note":"答案為 D。\n圖中各樓層機組只接「冷卻水」管到屋頂冷卻水塔，沒有冰水主機與冰水管，表示機組本身內含壓縮機、蒸發器，屬直接膨脹式的「水冷式箱型冷氣機」。機組接外氣（OA）、回風（RA），並以送風管分配到多個送風口（SA），所以是箱型機併用風管系統（樓層個別空調）。課程教材「空調系統與空間計畫」p.28 說明：箱型冷氣機可將熱交換（冷卻塔）裝置另設於戶外；p.29 說明可利用室內風管增加供應範圍。\nB 空調箱系統：須由中央冰水主機供應冰水給空調箱，圖中沒有。\nA、C 風管機：依同教材 p.7，「風管機（FCU）方式」屬全水方式，由熱源裝置送冰水或熱水到各空間，圖中沒有冰水主機與冰水管，所以不是。 【依據】建築環境控制一般原理（空調系統方式分類）；課程教材：07 空調系統與空間計畫 p.7、27～29"},{"c":170,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"儲冰空調系統","year":102,"no":40,"art":"3-2 空氣調節","q":"空調節能技術中，有關儲冰空調系統的敘述，下列何者正確？","opts":{"A":"建築物採用儲冰空調系統，可以明顯降低建築能源的使用量與耗電量","B":"採用儲冰空調系統的最大誘因，在於利用白天尖峰電力，可以明顯降低電費","C":"儲冰空調系統的採用，在綠建築節能技術中，是屬於熱源系統節能技術","D":"儲冰空調系統，一般利用溴化鋰做為冷媒，以提高其夜間儲冷效果"},"ans":"C","note":"答案為 C。102 年考試最接近之《綠建築評估手冊—基本型》2012 年版，日常節能 EAC（式 2-4.7，≦0.8）之表 2-4.10 把「儲冰空調系統」列為 α2（0.10～0.20，採用率為分量儲冰率），歸在「熱源系統節能技術」，計入熱源系統節能效率 Rs＝1.0−Σ(αj×rj)，故 C 正確。課程教材 07 p.10 中央空調系統圖亦把儲冰槽標在「主機耗能60%」的節能技術下。\nA 錯誤：儲冰是移轉尖峰用電，製冰時蒸發溫度低、主機效率下降，總耗電不一定降低，節省的是電費與契約容量。\nB 錯誤：是利用「夜間離峰」電力製冰、白天融冰，題目說反了（08 p.58）。\nD 錯誤：儲冰多用乙二醇滷水，溴化鋰是吸收式冷凍機的吸收劑。\n版本註記：2019 年版初刷改列為 β1＝0.30（其他總系統 Rm），2019 年版第三版第二刷與 2023 年版改為 α11，不再分 Rs／Rf。 【依據】綠建築評估手冊—基本型（2012 年版）式 2-4.7（手冊 p.55）、表 2-4.10（手冊 p.62，α2 儲冰空調系統）；綠建築評估手冊—基本型（2019 年版初刷）表 2-4.10（手冊 p.72，β1）；綠建築評估手冊—基本型（2023 年版）表 2-4.8（手冊 p.67～68，α11）；課程教材：07 空調系統與空間計畫 p.9～10；08 空調節能計畫 p.58"},{"c":171,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"濕空氣性質","year":103,"no":2,"art":"3-2 空氣調節","q":"有關室內空氣之敘述，下列何者錯誤？","opts":{"A":"若已知某空氣之乾球溫度與溼球溫度，則可求得該空氣之相對溼度、水蒸氣壓及熱焓量","B":"相對溼度相等時，若乾球溫度不同，則 1 m³ 空氣中所含水蒸氣量會不同","C":"為了保持相對溼度為一定值，若提高乾球溫度，則必須進行除溼","D":"乾球溫度為一定值，若相對溼度越低，則其露點溫度越低"},"ans":"C","note":"答案 C（錯誤）。溫度提高時飽和水蒸氣量增加，若不改變含水量，相對溼度會下降；要維持相對溼度不變，須「加溼」而非除溼。A 正確：空氣線圖上任兩個獨立狀態量（如乾球、溼球溫度）即可定出狀態點，求得相對溼度、水蒸氣壓、焓等。B 正確：飽和水蒸氣量隨溫度而變，同一相對溼度下溫度不同，絕對含水量不同。D 正確：乾球溫度固定時相對溼度愈低，水蒸氣分壓愈低，露點溫度愈低。 【依據】課程教材：05 空調設備基礎知識p.38（濕空氣線圖：已知兩種狀態值即可求得其他狀態值）；23 S ET 02 氣候與外部環境 p.10（水蒸氣飽和量隨溫度升高而昇高）"},{"c":172,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"吸收式冷凍機","year":103,"no":25,"art":"3-2 空氣調節","q":"旅館或醫院建築物的使用需求，需要同時都能夠有冰水、熱水的供應，下列何種冷凍機最適合這樣的任務？","opts":{"A":"往復式冷凍機","B":"離心式冷凍機","C":"吸收式冷凍機","D":"迴轉式冷凍機"},"ans":"C","note":"答案 C。吸收式冷凍機以熱能（蒸汽、高溫水或直接燃燒瓦斯、油）驅動，以溴化鋰溶液為吸收劑、水為冷媒；直燃式吸收冷溫水機可同時供應冷水與溫（熱）水，並可利用廢熱，適合旅館、醫院等全年同時有冷熱需求之建築。A 往復式、B 離心式、D 迴轉式（螺旋式）皆為電動壓縮式冷凍機，主要供應冰水，需另設鍋爐或熱回收裝置才能供熱水。（課程教材說明吸收式以水為冷媒、溴化鋰為吸收劑，加熱分離水蒸氣完成循環。） 【依據】課程教材：06 空調原理與負荷計算 p.19～p.20；空調熱源設備（一般原理）"},{"c":173,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"氣冷式與水冷式主機","year":103,"no":26,"art":"3-2 空氣調節","q":"有關氣冷式及水冷式主機的敘述，下列何者錯誤？","opts":{"A":"氣冷式主機的散熱效果較差，主機設備容量不能設計太大","B":"水冷式主機的散熱效果較佳，是因為水的比熱比空氣為大","C":"戶外散熱位置離主機甚遠時，使用水冷式主機是較佳的選擇","D":"病態大樓症候群多發生於使用氣冷式主機的建築物"},"ans":"D","note":"答案 D（錯誤）。病態大樓症候群（SBS）主要與外氣換氣量不足、室內污染源（建材逸散、微生物）、空調系統處理不良有關（課程教材：維持室內空氣品質要素為移出污染源、適當外氣量、足夠循環次數、正確過濾效率、良好空氣分佈），與主機採氣冷或水冷之散熱方式無直接關係。A 正確：氣冷式以空氣散熱，效率較低，單機容量受限；B 正確：水之比熱遠大於空氣，散熱效果佳；C 正確：水冷式以冷卻水管連接冷卻水塔，散熱位置可離主機較遠，氣冷式之冷凝器須直接接觸外氣。 【依據】課程教材：05 空調設備基礎知識 p.32（室內污染與病態建築）；08 空調節能計畫 p.50（水冷式、氣冷式冰水機）"},{"c":174,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"全熱交換器","year":103,"no":29,"art":"3-2 空氣調節","q":"空調系統採用全熱交換器之主要目的為何？","opts":{"A":"提高設備效率","B":"減少空調負荷","C":"提高空氣品質","D":"再生能源利用"},"ans":"B","note":"答案 B。全熱交換器使引入之外氣與排出之室內空氣進行顯熱與潛熱（溫度與濕度）交換，夏季預冷除濕、冬季預熱加濕外氣，回收排氣能量，主要目的在減少外氣負荷，即減少空調負荷而節能。A 主機效率本身未改變；\nC 換氣量由送排風量決定，全熱交換器本身並非為提高空氣品質（反而需注意交叉污染）；D 回收排氣能量屬能源回收，不屬再生能源。課程教材：全熱交換系統透過換氣回收廢冷或廢熱，可降低空調設備負荷、節省能源；綠建築評估手冊（2012 年版）亦將「風管式空調系統採用全熱交換器」列為空調節能規劃重點（b5）。 【依據】課程教材：08 空調節能計畫 p.56、p.61；綠建築評估手冊—基本型（2012 年版）空調節能規劃重點 b5（手冊 p.51）、表 2-4.10 α6 全熱交換器系統（熱源系統節能技術，手冊 p.62）"},{"c":175,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"外周區空調負荷","year":104,"no":6,"art":"3-2 空氣調節","q":"在臺灣一般辦公建築物外周區夏季空調用電增加的最主要原因，與下列何者最有關？","opts":{"A":"電腦主機排熱","B":"照明燈具發熱","C":"太陽日射熱","D":"人體發生熱"},"ans":"C","note":"答案 C。外周區（perimeter zone，距外牆約 5 m 內）直接受外殼影響，夏季太陽日射經玻璃進入及外牆吸熱後傳入，是外周區冷房負荷大於內周區的主因。電腦、照明、人體發熱屬內部負荷，內周區與外周區皆有，不是「外周區」用電增加的特有原因。故選 C。課程教材亦說明外部熱源主要為夏季日射，並建議依方位分區、西向等日射大方位設緩衝空間。 【依據】課程教材：23 S 04 熱傳與材料性能 p.2（外部熱源主要為夏季日射）；23 S ET05 熱舒適節能設計 p.10、p.13"},{"c":176,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"變流量冰水泵（VWV）","year":104,"no":18,"art":"3-2 空氣調節","q":"空調系統採用變流量冰水泵技術之主要目的為何？","opts":{"A":"降低設備耗能","B":"減少空調負荷","C":"提高空氣品質","D":"再生能源利用"},"ans":"A","note":"答案 A。變流量冰水系統（VWV）以變頻器調整冰水泵轉速，依末端二通閥開度與管路差壓，使送水量隨部分負荷減少；泵浦耗電約與轉速三次方成正比，流量降低可大幅節省搬送動力，目的在降低設備耗能。它不會減少建築物本身的空調負荷（B），與空氣品質（C）、再生能源（D）無關。課程教材將「大溫差與變流量之採用」列為節省搬送動力手法。 【依據】課程教材：07 空調系統與空間計畫 p.75–76（冰水變流量系統 VWV，差壓感測器、變頻器）；08 空調節能計畫 p.61"},{"c":177,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"冷媒直膨式空調","year":104,"no":25,"art":"3-2 空氣調節","q":"下列何者不屬於冷媒直膨式空調系統？","opts":{"A":"分離式冷氣機","B":"箱型冷氣機","C":"FCU 空調系統","D":"VRV 空調系統"},"ans":"C","note":"答案 C。冷媒直膨式（DX）是讓冷媒直接在室內機蒸發器內蒸發，吸收室內空氣熱量。分離式冷氣、箱型冷氣（A、B）屬個別式直膨空調；VRV（變冷媒量，一台室外機對多台室內機，D）也是以冷媒管直接送至室內機的直膨系統。FCU（風機盤管）系統屬「全水方式」，由冰水主機製造冰水，經冰水管送到各 FCU 盤管熱交換，室內端不使用冷媒直膨，故選 C。 【依據】課程教材：07 空調系統與空間計畫 p.7（全水方式：FCU 方式）、p.28–29（窗型、箱型、分離式及多聯式空調方式）"},{"c":178,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"冷凍機種類與特性","year":104,"no":26,"art":"3-2 空氣調節","q":"有關空調設備之敘述，下列何者錯誤？","opts":{"A":"離心式冷凍機適用於 100 USRT 以下空調系統，價格便宜","B":"往復式冷凍機運轉時振動較大，安裝時必須設有防振裝置","C":"相等容量之吸收式冷凍機較其他型式冷凍機，所占空間較大","D":"若能利用廢熱時，可考慮採用吸收式冷凍機"},"ans":"A","note":"答案 A。離心式冷凍機以高速葉輪壓縮冷媒，適用於大容量系統（一般約 100～200 USRT 以上的大型建築），小容量時效率差、價格昂貴，故「適用於 100 USRT 以下、價格便宜」錯誤；小容量多用往復式、螺旋式或渦卷式。B 正確：往復式以活塞往復運動，振動大需防振。C 正確：吸收式由蒸發器、吸收器、再生器、冷凝器組成，同容量體積較大。D 正確：吸收式以熱源（蒸汽、熱水、廢熱）驅動，耗電少。 【依據】課程教材：06 空調原理與負荷計算 p.14（壓縮式冷凍機種類）、p.19–22（吸收式冷凍循環與冷凍機）"},{"c":179,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"FCU 管路系統節能","year":104,"no":27,"art":"3-2 空氣調節","q":"採用 FCU 空調系統時，對於管路系統節能之手法，下列何者錯誤？","opts":{"A":"採用 VWV 方式","B":"減少送水與回水間之溫度差，以減少流量","C":"使用三向閥控制","D":"做好空調區劃"},"ans":"B","note":"答案 B。冰水輸送熱量 Q＝m·c·Δt，在同一負荷下，要減少流量必須「加大」送回水溫差（大溫差設計），而不是減少溫差；減少溫差反而要增加流量與泵浦耗電，故 B 錯。課程教材列節省搬送動力手法為「減少循環水量…大溫差與變流量之採用」。A 正確：VWV 隨負荷調整流量。D 正確：依用途、方位、時段區劃，避免過冷過熱。【爭議】C「三向閥控制」屬定流量控制，節能效果不如二向閥配合 VWV；但三向閥仍可旁通冰水、依負荷調節盤管水量（教材亦列冷水管排可旁通之控制方式），題目最明顯錯誤者為 B，依官方答案。 【依據】課程教材：08 空調節能計畫 p.60–61（冷水管排旁通控制、大溫差與變流量之採用、區分計劃）"},{"c":180,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調箱各點溫度","year":104,"no":29,"art":"3-2 空氣調節","q":"如圖所示夏日正常運轉的空調箱系統，在 T1～T4 各點裝設溫度計，請按所量測到的溫度高低依序排列組合：\n（附圖：空調箱（AHU）由左而右為外氣與回風混合段（過濾器）、冷卻盤管、鋸齒狀元件（加濕器或除霧板）、送風機。T2 在左下外氣入口（外氣進入 AHU）；房間上方 T4 為回風口，回風經頂部風管回到 AHU，部分由左上排氣口排出；T1 位於 AHU 內外氣與回風混合後、盤管之前；AHU 出口送風管接到房間左側出風口，T3 為送入房間的送風。）","opts":{"A":"T3 > T4 > T1 > T2","B":"T1 > T2 > T4 > T3","C":"T2 > T4 > T1 > T3","D":"T2 > T1 > T4 > T3"},"ans":"D","note":"答案 D。夏季：T2 為室外外氣，溫度最高；T4 為室內回風，約等於室溫（如 26°C）；T1 為外氣與回風混合後的空氣，溫度介於兩者之間；T3 為經冷卻盤管冷卻除濕後的送風，溫度最低（約 13～16°C）。故 T2＞T1＞T4＞T3。C 把混合空氣 T1 排在回風 T4 之下，錯誤；A、B 不符合夏季冷房的溫度關係。 【依據】課程教材：07 空調系統與空間計畫 p.73（AHU 空調系統流程圖）"},{"c":181,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"恆溫恆濕空調方式","year":105,"no":26,"art":"3-2 空氣調節","q":"欲設計一大型恆溫恆濕空間，空調應採用下列何種系統才容易達成目標？","opts":{"A":"AHU","B":"FCU","C":"VRV","D":"輻射冷暖房"},"ans":"A","note":"答案 A。恆溫恆濕需同時精確控制溫度與濕度，空調箱（AHU）全空氣系統集中處理空氣，箱內可配置冷卻除濕盤管、再熱盤管、加濕器與高效率濾網，並可引入定量外氣、維持風量與氣流分布，最容易達成大空間恆溫恆濕（如美術館、無塵室、實驗室）。B 風機盤管（FCU）與 C 變冷媒流量（VRV）主要處理顯熱，濕度控制與外氣處理能力有限；D 輻射冷暖房只能處理顯熱，且須防表面結露，無法控濕。課程教材：全空氣方式由空氣調節機集中處理空氣後以風管送出（單一風管、二重風管、VAV）；輻射冷暖房於夏季冷房必須注意結露問題。 【依據】課程教材：07 空調系統與空間計畫 p.4（全空氣方式）、p.7（FCU、輻射冷暖房）"},{"c":182,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調箱構成組件","year":105,"no":27,"art":"3-2 空氣調節","q":"下列何者不是空調箱內部的構成組件？","opts":{"A":"冰水盤管","B":"熱水盤管","C":"冰水泵","D":"空氣濾網"},"ans":"C","note":"答案 C。空調箱（AHU）內部一般由外氣與回風混合段、空氣濾網、冷卻（冰水）盤管、加熱（熱水或蒸汽）盤管、加濕器、送風機及消音段等組成。冰水泵（冰水循環泵）是設於機房、把冰水主機產生的冰水送往各空調箱與風機盤管的水系統設備，不在空調箱內部，故 C 不是。A、B、D 都是空調箱內常見組件。課程教材將空調設備分為空氣處理裝置（加濕器、空氣加熱器、空氣冷卻器、空氣過濾器）、空氣輸送裝置、熱輸送裝置（幫浦、配管）及冷暖熱源裝置，泵浦屬熱輸送裝置。 【依據】課程教材：05 空調設備基礎知識 p.11"},{"c":183,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調耗能比例","year":105,"no":29,"art":"3-2 空氣調節","q":"一般中央空調系統的主機熱源耗能約占全部空調系統耗能的比率為何？","opts":{"A":"33%","B":"45%","C":"60%","D":"80%"},"ans":"C","note":"答案 C。中央空調系統耗能由熱源主機（冰水主機）、水系統（冰水泵、冷卻水泵、冷卻水塔）與送風系統（空調箱、風機盤管風車）組成，一般教材與綠建築日常節能指標說明中，主機約占空調耗能六成左右，其餘由泵浦、冷卻水塔與送風系統分擔，因此提高主機效率（高 COP、台數控制、容量勿過大）是空調節能的首要重點。課程教材 07 空調系統與空間計畫 p.10 中央空調系統圖明白標示「主機耗能 60%、送風耗能 20%、送水耗能 20%」，對應舊式 EAC＝(0.6×HSC×主機效率×Rs＋0.2×Rf＋0.2×Rp)×Rm≦0.8，與 C 一致。105 年考試最接近之綠建築評估手冊—基本型 2015 年版已改以各案實際設計功率比 PRs、PRf、PRp、PRt 加權（式 2-4.7），其計算例 PRs＝0.529，屬個案值，不影響「約 60%」之概略說法。 【依據】課程教材：07 空調系統與空間計畫 p.9～10（中央空調系統圖：主機耗能 60%、送風 20%、送水 20%）；08 空調節能計畫 p.4、p.10（EAC 公式）；綠建築評估手冊－基本型（2015 年版）式 2-4.7（手冊 p.56）、計算例 C 項（手冊 p.71）"},{"c":184,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"吸收式冷凍循環","year":105,"no":30,"art":"3-2 空氣調節","q":"空調冷凍原理，有關吸收式冷凍循環之敘述，下列何者正確？","opts":{"A":"吸收式冷凍循環，是利用膨脹劑與水混合溶液吸收水蒸氣，達成冷卻作用","B":"吸收式冷凍循環所使用之溴化鋰，過程中不可以循環再利用","C":"吸收式冷凍循環可以透過汽電共生系統，利用廢熱以達節能之目的","D":"採用吸收式冷凍機，在綠建築空調節能評估指標中，屬於送風系統節能技術"},"ans":"C","note":"答案 C。吸收式冷凍機以熱能（蒸汽、熱水、燃氣或廢熱）驅動，可與汽電共生系統結合，利用發電廢熱製冷，提升整體能源效率。A 錯：常用溴化鋰水溶液，水為冷媒、溴化鋰為吸收劑，吸收蒸發器產生的水蒸氣，並非「膨脹劑」。B 錯：稀溶液在再生器（產生器）加熱濃縮後回到吸收器，溴化鋰持續循環使用。D 錯：冷凍機屬熱源（主機）系統，不屬送風系統；105 年考試最接近之《綠建築評估手冊—基本型》2015 年版表 2-4.10，「吸收式或熱泵式冷凍機」列為 α3（瓦斯直燃式或熱泵式 0.15、熱回收式 0.30），屬「熱源系統節能技術」（Rs）；2019年版初刷改併入 α6「其他熱源節能系統」（舉廢熱加熱式吸收式冷凍機為例），仍屬 Rs。（課程教材 06 p.19～20：水為冷媒、溴化鋰為吸收劑，稀溶液加熱分離為蒸氣及濃溶液後循環使用。） 【依據】課程教材：06 空調原理與負荷計算 p.19、p.20；綠建築評估手冊—基本型（2015 年版）表 2-4.10（手冊 p.63，α3 吸收式或熱泵式冷凍機）；綠建築評估手冊—基本型（2019 年版初刷）表 2-4.10（手冊 p.70～71，α6）；課程教材：08 空調節能計畫p.20"},{"c":185,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調熱源機器","year":105,"no":40,"art":"3-2 空氣調節","q":"下列何者不是空調系統中的熱源機器？","opts":{"A":"冷凍機","B":"熱水鍋爐","C":"儲冰槽","D":"空調箱"},"ans":"D","note":"答案 D。中央空調系統可分為：熱源設備（製造冷熱源：冷凍機／冰水主機、熱泵、鍋爐、冷卻水塔，以及儲存冷熱能之儲冰槽、蓄熱槽等）、熱媒輸送設備（泵浦、配管、風管）與空氣處理及末端設備（空調箱、風機盤管、出風口）。空調箱是把冷熱水的能量與空氣交換、處理並送出空氣的設備，屬空氣處理（送風）系統，不是熱源機器。A 冷凍機、B 熱水鍋爐為熱源；C 儲冰槽於離峰製冰、尖峰融冰供冷，屬熱源側之蓄冷設備。課程教材 05p.11：冷暖熱源裝置為鍋爐、冷凍機、冷卻塔，空氣處理裝置為加濕器、加熱器、冷卻器、過濾器（即空調箱之組成）；07 p.9「中央空調系統之基本構成」把冷卻塔、冷凍機、儲冰槽列為主機（熱源），空調箱 AHU 列於送風系統。 【依據】課程教材：05 空調設備基礎知識 p.11；07 空調系統與空間計畫 p.3、p.9"},{"c":186,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"冷氣容量估算","year":106,"no":26,"art":"3-2 空氣調節","q":"某臥室面積為 20 m²，非頂層樓，開窗面向北面且房間無東西曬，窗戶開口適中並有水平遮陽 50 cm，最經濟且高效率的空調主機容量為下列何者？","opts":{"A":"2500 kcal/hr","B":"3500 kcal/hr","C":"4000 kcal/hr","D":"6000 kcal/hr"},"ans":"A","note":"答案 A。課程教材 p.53：家用冷氣容量概估每坪約 0.15 冷凍噸。20 m² ÷ 3.3058 ≒ 6.05 坪，6.05 × 0.15 ≒ 0.91USRT，以英制 1 USRT＝3,024 kcal/h（教材 p.50）換算 ≒ 2,740 kcal/h；另依 p.32 一般建築約每 30 m² 1 USRT，20／30 × 3,024 ≒ 2,020 kcal/h。兩種概算介於約 2,000～2,750 kcal/h，四個選項中只有 2,500 kcal/h 落在此範圍；本題北向、無東西曬、非頂樓、有遮陽，屬低負荷條件，更不需放大容量。教材並指出容量太大壓縮機會頻繁啟動、耗電且減損壽命，故選 A；B、C、D 均偏大。 【依據】課程教材：06 空調原理與負荷計算 p.50（冷凍噸換算）、p.32、p.53"},{"c":187,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"FCU 系統之外氣空調機","year":106,"no":27,"art":"3-2 空氣調節","q":"FCU 空調系統之外氣空調機的作用為何？","opts":{"A":"將室內空氣排出到室外，再過濾利用","B":"為了空調機的散熱方便而設置於外部的空調機","C":"為了方便排氣與回風而設置於室外的空調機","D":"專門過濾及冷卻外部空氣，並送入室內"},"ans":"D","note":"答案 D。課程教材 p.7 將 FCU 列為「全水方式」：熱源送冰水或熱水至各空間之風機盤管單元熱交換，只在室內循環處理室內空氣，本身不引入外氣，因此常另設外氣空調機（外氣處理機、PAH/OAC），專門將室外新鮮空氣過濾、冷卻除濕（處理外氣潛熱負荷）後送入各室，以滿足換氣量需求，即「FCU＋外氣空調機」之水－空氣系統。A 為排氣或全熱交換器之作用；B 指分離式冷氣之室外機（冷凝器）；C 非外氣空調機之定義。 【依據】課程教材：07 空調系統與空間計畫 p.7"},{"c":188,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"大空間出風口","year":106,"no":28,"art":"3-2 空氣調節","q":"航站大廳的空調出風口設計以下列何種出風口最適合？","opts":{"A":"誘導式出風口","B":"槽線式出風口","C":"軸流式出風口","D":"擴散式出風口"},"ans":"C","note":"答案 C。出風口依氣流型態分為軸流式（噴流、噴嘴型、萬向型、格柵型，氣流沿軸向集中直進）與擴散式（輻流式，如圓形或方形擴散型 Anemostat，氣流向四周擴散）。航站大廳天花板高、空間大，需長射程（到達距離）之送風，宜採軸流式（噴嘴型）出風口從高處或側壁長距離吹送，故選 C。D 擴散式射程短、適用一般辦公室低天花板；B 槽線式（線型）多用於周邊窗邊或配合天花板造型；A 誘導式多用於窗邊誘導機組。課程教材 p.62～63 列出送風口設計應檢討「到達距離、擴散距離是否適當」，並指出相同風速下擴散型送風口噪音較大、噴嘴型噪音較小；至於「大空間長射程宜用噴嘴（軸流）型」，教材未明寫，係依空調一般原理。【查證限制】「軸流式／擴散式」之分類名稱教材未逐字列出，依空調一般分類。 【依據】課程教材：07 空調系統與空間計畫 p.62～63（送風口設計注意事項）；空調一般原理（出風口種類）"},{"c":189,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"顯熱比 SHF","year":106,"no":29,"art":"3-2 空氣調節","q":"下列那個空間在空調冷房負荷計算時之 SHF（Sensible Heat Factor）最高？","opts":{"A":"辦公室","B":"電氣機房（變電室）","C":"游泳池","D":"生鮮超市"},"ans":"B","note":"答案 B。顯熱比 SHF＝顯熱負荷／(顯熱＋潛熱負荷)。電氣機房（變電室）之熱源為變壓器、開關設備等電機發熱，幾乎全為顯熱，且平時無人員、無水分蒸發，潛熱極少，SHF 接近 1.0，為四者最高。A 辦公室有人員散濕與外氣潛熱，SHF 約 0.8～0.9；C 游泳池水面大量蒸發，潛熱負荷大，SHF 最低；D 生鮮超市有人員、生鮮蔬果與冰水散濕，潛熱比例亦高。 【依據】課程教材：08 空調節能計畫 p.42（顯熱比因子 SHF＝總顯熱／總負荷）；\n空調通用原理"},{"c":190,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"冷媒 p-h 線圖","year":106,"no":30,"art":"3-2 空氣調節","q":"下圖為某冷媒的 p-h 線圖（Mollier Chart），關於冷凍循環之敘述何者錯誤？\n（附圖：縱軸為壓力 p、橫軸為焓 h 之冷媒線圖，圖中有飽和曲線（拱形）。點 1 位於下方低壓線之右側（飽和蒸氣側），點 2 位於上方高壓線之右側（過熱區），點 3 位於上方高壓線之左側（飽和液線），點 4 位於點 3 正下方之低壓線上。循環為 1→2（向右上，升壓）、2→3（高壓水平向左）、3→4（垂直向下，焓不變降壓）、4→1（低壓水平向右）。）","opts":{"A":"1→2 為壓縮機，將液態冷媒壓縮成高壓氣態","B":"2→3 為冷凝器，冷媒在此由高壓氣態變成高壓液態","C":"3→4 之過程為膨脹閥，冷媒變成低壓液氣混合體","D":"4→1 之過程為蒸發器，冷媒藉由蒸發吸收空氣中之熱量"},"ans":"A","note":"答案 A（錯誤）。課程教材 p.13：莫里耳線圖縱軸為壓力、橫軸為焓，飽和蒸氣線右側冷媒完全為氣體。點1 位於飽和蒸氣線上，進入壓縮機的是「低壓氣態」冷媒，壓縮機將其壓縮為高溫高壓之過熱氣體；若吸入液態冷媒會造成液壓縮而損壞壓縮機，故 A 錯。B：2→3 在高壓下等壓放熱，過熱氣體冷凝為高壓液體（冷凝器）✓。\nC：3→4 經膨脹閥節流，焓值不變（垂直線）、壓力下降，成為低壓液氣混合物 ✓。D：4→1 在低壓下等壓吸熱蒸發（蒸發器），吸收被冷卻物（空氣或冰水）之熱量 ✓。 【依據】課程教材：06 空調原理與負荷計算 p.11、p.13"},{"c":191,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"冷風扇（蒸發冷卻）之空氣線圖","year":107,"no":4,"art":"3-2 空氣調節","q":"有關市面上使用常溫水噴霧搭配風扇吹出之「冷風扇」，空氣吹出前後在濕空氣線圖上之變化為何？\n（附圖：濕空氣線圖示意：橫軸為乾球溫度、縱軸為絕對濕度，左上方為飽和線。狀態點 1 位於圖中央，自點 1 引出四個箭頭：1→2 水平向右（乾球溫度上升、絕對濕度不變）、1→3 向左上（乾球溫度下降、絕對濕度增加，朝飽和線方向）、1→4 水平向左（乾球溫度下降、絕對濕度不變）、1→5 向左下（乾球溫度下降、絕對濕度減少）。）","opts":{"A":"1→2","B":"1→3","C":"1→4","D":"1→5"},"ans":"B","note":"答（B）。常溫水噴霧蒸發時吸收空氣的顯熱作為蒸發潛熱，屬於「蒸發冷卻（絕熱加濕）」：空氣乾球溫度下降、絕對濕度增加，全熱（焓）大致不變，約沿濕球溫度線（等焓線）往左上朝飽和線移動，即 1→3（課程教材列濕空氣狀態變化含「蒸發冷卻」一項）。（A）1→2 為顯熱加熱（如電熱器）；（C）1→4 為顯熱冷卻（冷卻面溫度高於露點、無除濕）；（D）1→5 為冷卻除濕（一般冷氣機盤管低於露點時）。 【依據】課程教材：05 空調設備基礎知識 p.42"},{"c":192,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調系統結露部位","year":107,"no":5,"art":"3-2 空氣調節","q":"在冷氣空調系統中，下列那個部位最容易產生結露現象？","opts":{"A":"室內出風口","B":"室內回風口","C":"風管內側表面","D":"空氣濾網表面"},"ans":"A","note":"答（A）。結露發生在表面溫度低於接觸空氣露點溫度之處。室內出風口（擴散器、格柵）被剛經冷卻盤管、溫度最低的送風冷卻，其外表面又直接接觸室內較暖較濕的空氣，表面溫度易低於室內空氣露點而凝結水滴，是最常見的結露位置（尤其濕度高、開冷氣初期或送風溫度過低時）。（B）回風口接觸的是室內空氣，溫度與室溫相近；（C）風管內側接觸的是已除濕的冷風，其露點低，內側不易結露（結露多發生在保溫不足的風管外側）；（D）濾網位於盤管上游，處理的是未冷卻的回風／外氣。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.23（結露兩種狀況：溫度陡降、水蒸氣含量增加）；空調一般原理（送風口結露）"},{"c":193,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"冷凍循環壓縮機","year":107,"no":26,"art":"3-2 空氣調節","q":"在冷凍循環中，當冷媒經過壓縮機時，其狀態會如何改變？","opts":{"A":"高溫高壓（氣態）→高溫低壓（液態）","B":"低溫低壓（液態）→低溫低壓（氣態）","C":"低溫低壓（氣態）→高溫高壓（氣態）","D":"低溫高壓（液態）→高溫高壓（氣態）"},"ans":"C","note":"答（C）。蒸氣壓縮式冷凍循環四個過程：①壓縮機：將蒸發器出來的低溫低壓冷媒氣體壓縮成高溫高壓氣體；②冷凝器：高溫高壓氣體放熱凝結為高壓液體；③膨脹閥：高壓液體節流降壓成低溫低壓（液氣混合）；④蒸發器：低溫低壓冷媒吸熱蒸發為低溫低壓氣體，再回到壓縮機。故經壓縮機為低溫低壓氣態→高溫高壓氣態。\n（B）為蒸發器之變化；（A）、（D）之狀態組合不符合任何一段過程。 【依據】課程教材：06 空調原理與負荷計算 p.11"},{"c":194,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調箱構成","year":107,"no":27,"art":"3-2 空氣調節","q":"下列名詞中，何者不是空調箱設備構成的範疇？","opts":{"A":"送風機","B":"壓縮機","C":"空氣過濾器","D":"冰水盤管"},"ans":"B","note":"答（B）。中央空調系統之空調箱（AHU）是處理空氣的設備，主要由回風／外氣混合段、空氣過濾器、冰水（冷卻）盤管與熱水盤管、加濕器、送風機及控制風門等構成，冷熱源由冰水主機以冰水供應。（B）壓縮機屬於冰水主機（冷凍機）的組成元件，負責冷凍循環的壓縮過程，不在空調箱內。（A）送風機、（C）空氣過濾器、（D）冰水盤管均為空調箱構成元件。 【依據】課程教材：05 空調設備基礎知識 p.11（空氣處理裝置與冷暖熱源裝置之分）；07 空調系統與空間計畫 p.9（冷凍機屬主機；AHU 屬送風系統）"},{"c":195,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"中央空調熱交換","year":107,"no":28,"art":"3-2 空氣調節","q":"有關中央空調系統之熱交換，下列敘述何者錯誤？","opts":{"A":"冰水主機中冷凝器是將冰水管中之水降溫","B":"全熱交換器可結合空調箱之回風使用","C":"空調箱中可裝置加濕器","D":"空調箱可以引進新鮮空氣"},"ans":"A","note":"答（A）。冰水主機中使冰水降溫的是「蒸發器」：低溫低壓冷媒在蒸發器內吸收冰水熱量而蒸發，冰水因此降溫（約 12℃→7℃）。「冷凝器」則是讓高溫高壓冷媒氣體放熱凝結，熱量傳給冷卻水，冷卻水再送至冷卻水塔散熱，故（A）錯誤。（B）全熱交換器以排出之回風與引入之外氣進行顯熱與潛熱交換，可結合空調箱使用以節能，正確。（C）空調箱可設加濕器，正確。（D）空調箱可設外氣風門引進新鮮空氣，正確。 【依據】課程教材：06 空調原理與負荷計算 p.11（冷凝器放熱凝結、膨脹閥後進入蒸發器低溫蒸發）；07 空調系統與空間計畫p.72～73（冷卻水側與 AHU 流程）；08 空調節能計畫 p.56、p.61（全熱交換器回收排氣廢冷廢熱）"},{"c":196,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"儲冰式空調","year":107,"no":32,"art":"3-2 空氣調節","q":"有關儲冰式空調之敘述，下列何者錯誤？","opts":{"A":"儲冰式空調可因時間電價而減少電費支出","B":"採用儲冰式空調可減少冷凍主機的容量","C":"儲冰式空調整體系統的設備占用空間較非儲冰式空調小","D":"儲冰式空調可抑制夏季尖峰時間的用電負載"},"ans":"C","note":"答（C）。儲冰式空調利用夜間離峰電力製冰儲存，白天尖峰時段融冰供冷。需額外設置儲冰槽（體積大）、熱交換器、滷水（乙二醇）泵與管路，且製冰主機需較低蒸發溫度，整體系統占用空間「較大」，初設成本也較高，故（C）錯誤。（A）利用時間電價差，離峰電價較低而節省電費，正確。（B）尖峰負荷由主機與融冰共同負擔，主機容量可依平均負荷選定而縮小，正確。（D）移轉尖峰用電至離峰，抑制夏季尖峰負載，正確。\n【依據】課程教材：08 空調節能計畫 p.58（儲冰式空調系統：使用夜間離峰電力、減低之契約容量）；07 空調系統與空間計畫 p.9（儲冰槽屬主機／熱源）；綠建築評估手冊—基本型（2015 年版）2-4 節 ACs 定義（主機容量計入儲冰槽釋冷容量，手冊 p.57）"},{"c":197,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調設備綜合","year":108,"no":26,"art":"3-2 空氣調節","q":"有關空調設備之敘述，下列何者正確？","opts":{"A":"室內使用天花板送風方式供冷時室內容易呈現顯著的垂直溫度差與上部之層化區","B":"每 1 冷凍噸相當於 1 瓩之熱移除量","C":"冰水管係指傳輸於冰水主機與冷卻水塔間之管線","D":"全熱交換器可利用排風將引入之新鮮空氣進行預冷及減濕以降低整體冷房負荷"},"ans":"D","note":"答案 D。全熱交換器使室內排氣與引入外氣進行顯熱與潛熱（濕氣）交換，夏季可將外氣預冷、除濕，降低外氣負荷。A：天花送冷風，冷空氣較重會下沉與室內混合，垂直溫差小；顯著溫度層化多發生在天花送「暖風」時，故錯誤；B：課程教材：英制 1 冷凍噸＝3,024 kcal/h（12,000 BTU/h，約 3.5 kW），公制 3,320 kcal/h，皆非 1kW；C：冰水管連接冰水主機與空調箱／風機盤管，主機與冷卻水塔間為「冷卻水管」，錯誤。 【依據】課程教材：06 空調原理與負荷計算 p.50；08 空調節能計畫 p.56"},{"c":198,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"能源效率比 EER","year":108,"no":27,"art":"3-2 空氣調節","q":"空調能源效率比（EER）是指何者與消耗電力的比值？","opts":{"A":"冷房負荷","B":"冷房能力","C":"冷房度時","D":"冷房效果"},"ans":"B","note":"答案 B。課程教材：EER（能源效率比）＝空調設備冷卻能力（kcal/h）÷ 冷卻消耗電力（W），常用於個別或箱型冷氣；COP 為同一概念但以 W/W 表示（1 W＝0.86 kcal/h，故以 kcal/h·W 表示之 EER 數值＝0.86×COP；教材寫作「1 COP＝0.86 EER」即此意）。數值愈高愈節能；冷氣另有全年性能之 CSPF。A 冷房負荷為建築空間需要移除的熱量，屬需求面而非機器性能；C 冷房度時為氣候指標；D 冷房效果非性能比之定義用語。 【依據】課程教材：06 空調原理與負荷計算 p.51"},{"c":199,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"長距離送風口","year":108,"no":28,"art":"3-2 空氣調節","q":"某機場航站的出境大廳是天花板較高的大空間，擬採用具有較長送風距離的出風口，下列那種出風口最能達到需求？","opts":{"A":"噴嘴型","B":"槽型","C":"擴散型","D":"線型"},"ans":"A","note":"答案 A。噴嘴型（nozzle）出風口氣流集中、誘導比小、風速衰減慢，送風距離（到達距離）長，適用航站、體育館、展覽館等挑高大空間，可由側牆或高處遠距離送風。C 擴散型（如圓形、方形擴散器）誘導大量室內空氣、擴散快，到達距離短，適合一般天花高度；B 槽型、D 線型（條型）多沿窗邊或天花線性配置，氣流呈帶狀擴散，送風距離中等，皆不及噴嘴型。 【依據】課程教材：07 空調系統與空間計畫 p.62（到達距離、擴散距離是否適當）、p.63（相同風速下擴散型噪音較大、噴嘴型較小）；空調一般原理（出風口種類與射程）"},{"c":200,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"送回風口氣流分布","year":108,"no":29,"art":"3-2 空氣調節","q":"有關送風口及回風口之空氣分布，下列何者錯誤？","opts":{"A":"吹出氣流宜均勻分布於室內","B":"吹出氣流宜直接吹至人體上","C":"吹出氣流在回風口宜避免有短路現象","D":"吹出氣流宜避免被梁等障礙物所阻礙"},"ans":"B","note":"答案 B（錯誤）。送風（尤其冷風）直接吹向人體會造成冷風感（draft）與局部不舒適，應使氣流與室內空氣充分混合後，於居住區以低風速、溫度均勻的狀態到達人體。A：氣流均勻分布避免冷熱不均，正確；C：送風口與回風口距離過近時，送出空氣未經室內循環即被吸回（短路），效率差，應避免，正確；D：梁、燈具等阻礙會使氣流偏折、提早下降，應避免，正確。課程教材「送風口及回風口設計計畫應注意事項」即列出 A、C、D 及「吹出氣流是否直接吹至人體上」為檢討項目。 【依據】課程教材：07 空調系統與空間計畫 p.62"},{"c":201,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調方式之適用性","year":109,"no":25,"art":"3-2 空氣調節","q":"下列何種空調方式者較不適宜？","opts":{"A":"在一個大型辦公空間的開放式辦公區使用可變風量中央空調系統","B":"在一個大型表演場中使用 FCU（fan coil unit）系統","C":"在機場的挑高大廳使用地板輻射併用近樓地板面置換式（或做氣移換式）送風的冷房系統","D":"在一個小型餐廳使用箱型冷氣併用風管之系統"},"ans":"B","note":"答案 B。FCU 系統為水系統（只供冷／熱水至各機組、風量小、無法做大風量外氣處理與氣流分布，風機噪音直接在室內），且濾網小、除濕與換氣能力有限，用於人員密度高、需大量換氣、對噪音敏感（表演場）的大空間不適宜。(A) 大型開放辦公區負荷隨時間變化，VAV 系統適宜且節能。(C) 挑高大廳僅需調節居住區（約 2 m 以下），置換式送風加地板輻射冷房可省能且舒適，屬適宜設計。(D) 小型餐廳以箱型冷氣（packaged unit）加風管送風，可處理換氣與排氣需求，亦屬常見做法。（課程教材佐證：FCU 屬「全水方式」，由熱源送出冰水或熱水至各空間以風管機單元熱交換，管道空間小、控制性好；VAV 為全空氣方式中以可變風量調整器對應室內負荷變動。） 【依據】通用建築環境控制教材（空調方式選擇）；課程教材：07 空調系統與空間計畫.pdf p.4、p.7"},{"c":202,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調箱之構成","year":109,"no":26,"art":"3-2 空氣調節","q":"中央式空調箱（air handling unit）中，不包括下列那一個裝置？","opts":{"A":"送風機","B":"冰水盤管","C":"冷卻水管","D":"空氣過濾器"},"ans":"C","note":"答案 C。空調箱（AHU）主要由外氣／回風混合段、空氣過濾器、冷（熱）盤管（以冰水或熱水為介質）、必要時加濕器、送風機及風門等構成，負責處理室內空氣再送出。冷卻水管是連接冰水主機的冷凝器與冷卻水塔的水路（排熱用的冷卻水系統），屬熱源側設備，不在空調箱內。(A)(B)(D) 皆為空調箱組件。 【依據】通用建築環境控制教材（空調設備）；課程教材：07 空調系統與空間計畫.pdf p.72–73（空調系統流程圖：冷卻水側與 AHU／FCU）"},{"c":203,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調換氣系統之節能","year":109,"no":28,"art":"3-2 空氣調節","q":"空調節能在換氣系統方面之考量，下列何者錯誤？","opts":{"A":"避免過多的外氣引入及停止不必要之換氣","B":"將大容量之送風機分成數台小容量送風機進行台數控制","C":"利用外氣冷房之方式","D":"變電室使用空調時應導入外氣"},"ans":"D","note":"答案 D。外氣需經冷卻除濕，引入量愈多，空調負荷愈大；變電室已使用空調冷卻時，應採內循環、僅在必要時引入最小外氣，不應另行「導入外氣」增加負荷（外氣亦帶入灰塵與濕氣，不利配電設備），故 (D) 錯誤。(A)控制外氣量（如 CO₂ 濃度控制）、停止不必要換氣，為基本節能手法。(B) 送風機分成數台依負荷台數控制，可提升部分負載效率。(C) 外氣冷房：過渡季或冬季外氣溫度低於室內時直接以外氣冷卻，節省冰水主機耗能。課程教材「空調計劃階段之節省能源考慮事項」列有：外氣引入量之控制（依 CO₂ 濃度自動調整，預冷預熱階段不導入外氣）、中間期外氣冷房（外氣較室內低時全部取入外氣）、排氣排熱回收（全熱交換器）、節省搬送動力等，與(A)(C) 相符。教材未專論變電室，(D) 之判斷依「減少不必要外氣以降低空調負荷」之原則推論。【查證限制】變電室空調是否導入外氣，教材與本機法規皆無明文。 【依據】課程教材：08 空調節能計畫.pdf p.60–61（空調計劃階段之節省能源考慮事項）"},{"c":204,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"固定容積空氣之濕度變化","year":110,"no":14,"art":"3-2 空氣調節","q":"關於某空間中固定容積的空氣，下列敘述何者錯誤？","opts":{"A":"加熱該空氣時，溫度與飽和水蒸氣壓上升","B":"該空氣的相對濕度為水蒸氣分壓除以飽和水蒸氣壓","C":"冷卻該空氣且未產生結露時，相對濕度不會改變","D":"該空氣經空調機冷卻除濕後，水蒸氣分壓會降低"},"ans":"C","note":"答案 C（錯誤敘述）。相對濕度 RH = Pv ／ Ps（水蒸氣分壓 ÷ 同溫度之飽和水蒸氣壓）。冷卻但未結露時，空氣含水量不變、Pv 不變，但溫度下降使 Ps 降低，故 RH 上升（直到 100% 即露點溫度開始結露），並非不變。A正確：溫度上升，Ps 增大；B 為 RH 定義；D 正確：冷卻到露點以下析出水分，含水量減少，Pv 隨之降低。（舉例：Pv 不變，Ps 由 3.2 kPa 降為 2.3 kPa，RH 由 50% 升至約 70%。） 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.17（空氣線圖各參數關係）；05 空調設備基礎知識 p.38、p.42（顯熱冷卻、減濕冷卻等狀態變化）"},{"c":205,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"輻射冷暖房","year":110,"no":29,"art":"3-2 空氣調節","q":"下列有關輻射冷暖房的說明何者錯誤？","opts":{"A":"可利用冷熱水在配管內部循環，由配管表面的冷熱輻射來調節室溫","B":"可將設備整合在天花板、地板、牆面等位置","C":"室內不易產生溫度不均、冷熱差異的熱舒適問題","D":"設備造價較高，且室內易有機械式的送風聲"},"ans":"D","note":"答案 D（錯誤敘述）。輻射冷暖房以冷熱水循環管所形成的大面積冷熱表面（天花、地板、牆）輻射調節室溫，不經風機吹送，因此室內安靜、無機械式送風聲；其缺點為設備與施工造價較高、反應較慢、冷房時須控制表面溫度以避免結露、需另行處理換氣與除濕。A、B、C 正確：輻射方式溫度分布均勻，較無冷熱不均與吹風感。課程教材（07 空調系統與空間計畫 p.7）：輻射冷暖房於天花板、樓板、牆壁等部位埋設水管，流過冷水或溫水進行輻射式空調，夏季冷房須注意結露問題。 【依據】課程教材：07 空調系統與空間計畫 p.7（輻射冷暖房方式）"},{"c":206,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"壓縮式冷凍循環","year":110,"no":30,"art":"3-2 空氣調節","q":"壓縮式冷凍循環原理中，下列何者為空氣冷卻（相當於冷媒吸熱）的過程？","opts":{"A":"壓縮","B":"冷凝","C":"膨脹","D":"蒸發"},"ans":"D","note":"答案 D。壓縮式冷凍循環四大過程：壓縮機將低壓低溫氣態冷媒壓縮為高溫高壓氣體（壓縮，外界作功）→冷凝器中冷媒向外界（冷卻水或室外空氣）放熱凝結為高壓液體（冷凝，放熱）→ 膨脹閥使冷媒降壓降溫（膨脹，節流）→ 蒸發器中低壓液態冷媒蒸發，吸收被冷卻空氣（或冷水）之熱（蒸發，吸熱）。空氣被冷卻、冷媒吸熱之過程為蒸發。課程教材（06 空調原理與負荷計算 p.11）亦述：凝結成液態之高壓冷媒經膨脹閥降為低壓液態冷媒後進入蒸發器，產生低溫蒸發效果。 【依據】課程教材：06 空調原理與負荷計算 p.11（冷凍循環：膨脹閥與蒸發器）"},{"c":207,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調熱負荷","year":110,"no":31,"art":"3-2 空氣調節","q":"某鋼筋混凝土構造辦公室的建築外殼熱負荷，含實體部與開口部共 40 kW，外氣與間隙風之熱負荷為 30 kW、內部熱負荷為 30 kW，下列敘述何者錯誤？","opts":{"A":"間隙風包含顯熱與潛熱負荷","B":"建築外殼實體部之熱負荷不包含潛熱負荷","C":"外部負荷共為 70 kW","D":"若 SHF = 0.7，則潛熱負荷為 70 kW"},"ans":"D","note":"答案 D（錯誤敘述）。總熱負荷 = 外殼 40 + 外氣與間隙風 30 + 內部 30 = 100 kW。SHF（顯熱比）= 顯熱負荷 ／ 全熱負荷，SHF = 0.7 時顯熱 = 70 kW，潛熱 = 100 − 70 = 30 kW（= 0.3 × 100），而非 70 kW。A 正確：間隙風為帶有濕氣之外氣，含顯熱與潛熱；B 正確：外殼實體部（牆、屋頂）只有溫差傳熱與日射，無水蒸氣移動，僅為顯熱；C 正確：外部負荷 = 外殼 40 + 外氣與間隙風 30 = 70 kW。（驗算：40 + 30 = 70；40 + 30 + 30 = 100；100× 0.3 = 30 ✓）課程教材（08 空調節能計畫 p.42）：顯熱比因子 SHF 為總顯熱除以總負荷；06 p.28：外氣影響不僅改變室內溫度、亦改變水蒸氣量，由此產生潛熱負荷。 【依據】課程教材：08 空調節能計畫 p.42（SHF 定義）；\n06 空調原理與負荷計算 p.28（潛熱與顯熱負荷）"},{"c":208,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空氣線圖—加熱除濕","year":111,"no":1,"art":"3-2 空氣調節","q":"在空氣線圖中之任一點如下圖 P，若欲朝右下方向 Q 移動，下列敘述何者正確？\n（附圖：空氣線圖示意：下方橫軸標「乾球溫度」（原圖橫軸箭頭畫向左方），右側縱軸標「絕對濕度」（箭頭向上）；圖中一條曲線（飽和線）左側平緩、愈往右愈陡而向上彎升；P 點位於曲線右下方（未飽和區），以箭頭由P 指向其右下方的 Q 點。）","opts":{"A":"冷卻降溫","B":"加熱加濕","C":"常溫加濕","D":"加熱除濕"},"ans":"D","note":"答案 D。空氣線圖橫軸為乾球溫度（向右增加）、縱軸為絕對濕度（一般畫在圖右側，向上增加）。原圖橫軸箭頭雖畫向左，但飽和線「愈往右愈陡」正是高溫時飽和絕對濕度增加較快的特徵，可知乾球溫度仍是向右增加，與官方答案一致。P→Q 向右（乾球溫度上升）且向下（絕對濕度下降），即「升溫＋除濕」＝加熱除濕。A冷卻降溫：沿水平向左（或沿飽和線向左下）；B 加熱加濕：向右上；C 常溫加濕：乾球溫度不變、垂直向上。\n（實務上如乾燥劑除濕、除濕機即同時使空氣升溫並降低絕對濕度。） 【依據】課程教材：05 空調設備基礎知識p.42（濕空氣狀態變化：加熱、加濕加熱、等溫加濕、蒸發冷卻、顯熱冷卻、減濕冷卻、等溫減濕、加熱減濕）"},{"c":209,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調方式比較","year":111,"no":27,"art":"3-2 空氣調節","q":"有關空調系統之敘述，下列何者正確？","opts":{"A":"全氣式空調的管線所占用的空間較水氣併用式更小","B":"全水式空調在室內空氣品質的控制上較全氣式更佳","C":"水氣併用式空調有新鮮外氣供應不足的問題","D":"全水式空調在室內產生的噪音問題較全氣式嚴重"},"ans":"D","note":"答案 D。全水式（如室內風機盤管 FCU）之風機直接設在室內，運轉噪音在室內產生，較全氣式（空調箱設於機房、僅出風口有氣流聲）嚴重 ✓。A：全氣式靠風管輸送冷熱，風管斷面大，所占空間大於水管，敘述相反，錯誤。B：全水式無外氣引入與過濾、濕度控制能力，室內空氣品質控制較全氣式差，錯誤。C：外氣供應不足是全水式的缺點；水氣併用式（如誘導單元、FCU 加外氣風管系統）由空氣系統供應外氣，錯誤。（課程教材：全水方式 FCU「管道空間較小」；空氣與水併用如誘導機 IDU 方式。） 【依據】課程教材：07 空調系統與空間計畫p.4、7"},{"c":210,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調主要裝置","year":111,"no":28,"art":"3-2 空氣調節","q":"有關空調設備主要裝置之敘述，下列何者錯誤？","opts":{"A":"冷卻水塔須設置於通風良好處","B":"空調風管的剖面形狀愈接近正方形或圓形，空氣流動的效果愈差","C":"冷凍主機的機房需特別考慮噪音與振動的防制","D":"噴嘴型出風口適合用於大型空間"},"ans":"B","note":"答案 B（錯誤）。風管斷面愈接近正方形或圓形（長寬比小），周長相對斷面積愈小，摩擦阻力愈小，空氣流動效果愈好；長寬比愈大（扁平）則阻力愈大。A：冷卻水塔藉蒸發散熱，須通風良好並避免排出的濕熱空氣回流 ✓。C：冰水主機（壓縮機）有噪音與振動，機房需隔音、防振 ✓。D：噴嘴型出風口氣流射程遠，適用於劇場、大廳等大空間 ✓。 【依據】課程教材：07 空調系統與空間計畫 p.83（風管長寬比正常 1:4 以內、最大 1:6）、p.84（冷凍機、冷卻塔等為主要噪音振動源，須防音防振）、p.62～63（送風口到達距離、噴嘴型）；06 空調原理與負荷計算 p.69（冷卻塔置於屋頂）"},{"c":211,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"冷房負荷（顯熱與潛熱）","year":111,"no":29,"art":"3-2 空氣調節","q":"計算冷房負荷（Cooling Load）時，下列何者包含顯熱與潛熱？","opts":{"A":"經由建築外殼以熱傳透方式進入室內的熱量","B":"經由玻璃窗傳入室內的日射熱量","C":"照明器具產生之內部負荷","D":"經由空調設備導入外氣時所產生之熱負荷"},"ans":"D","note":"答案 D。外氣溫度高、濕度大，導入外氣需同時降溫（顯熱）與除濕（潛熱），故外氣負荷包含顯熱與潛熱。A（外殼熱傳透）、B（玻璃日射得熱）、C（照明）均只造成室內溫度上升，屬顯熱負荷。人體發熱則同時含顯熱與潛熱（不在選項中）。課程教材：外氣不僅改變室內溫度，也改變室內水蒸氣量，為保持濕度而補給或除去水蒸氣所產生之負荷為潛熱負荷。 【依據】課程教材：06 空調原理與負荷計算 p.28"},{"c":212,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"定風量（CAV）空調系統適用空間","year":112,"no":19,"art":"3-2 空氣調節","q":"下列那一個空間較適合安裝 CAV 空調系統？","opts":{"A":"國中教室","B":"大學教室","C":"咖啡廳","D":"藝廊"},"ans":"A","note":"答案 A。CAV（定風量）送風量固定、以送風溫度因應負荷，適合人數與作息固定、負荷變動小的空間；\nVAV（變風量）依各區負荷調整風量，適合負荷隨時段變動者。課程教材 07 p.26：CAV 固定送風量、管理簡易、成本較低；VAV 依區域變換風量，節能但管理繁、成本高；p.4：單一風管定風量無法對應各空間之負荷變動。國中教室為固定班級、人數與課表，負荷最穩定，最適合 CAV。大學教室選課人數與時段不定、咖啡廳客流隨時段起伏、藝廊觀展人數隨展期與假日大幅變動且展間常分區開放，負荷變動大，宜用 VAV。【爭議】本題無官方解釋；教材 p.26 另寫 CAV「適合寬敞開放空間」，藝廊亦可能被認為適用，排除 D 為整理者推論，依官方答案 A。\n【依據】課程教材：07 空調系統與空間計畫 p.26、p.4"},{"c":213,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調設備使用與設計原則","year":112,"no":27,"art":"3-2 空氣調節","q":"關於空調設備系統使用與設計原則，下列敘述何者正確？","opts":{"A":"大型宴會廳的空調設計應採用線條型出回風口，以達到良好的冷氣射程，可避免產生短循環影響冷氣效果","B":"大型體育館的空調系統應採用多部氣冷式箱型空調機，可有效降低耗能","C":"天氣寒冷時使用冷暖氣機的暖氣功能，可提高室內氣溫並降低相對濕度，但無法有效移除室內水氣","D":"室內高度 2.5 m 的辦公空間，空調採下吹式線條型風口設計，可減少不適的冷擊現象"},"ans":"C","note":"答案 C。暖氣運轉只提高空氣溫度，室內水蒸氣量（絕對濕度）不變，飽和水蒸氣壓增加使相對濕度降低，但水氣並未移除（除濕須冷卻至露點以下凝結），C 正確。A 錯：宴會廳等大空間需長射程，宜用噴流（噴嘴）型等長射程風口，線條型風口氣流沿天花呈帶狀擴散，射程不及噴流（噴嘴）型；B 錯：體育館大空間宜以中央空調之空調箱配長射程風口，多部氣冷箱型機噪音大、效率低、氣流難均勻；D 錯：天花僅 2.5 m 時下吹氣流直達人體，易生冷擊，應水平吹出貼附天花擴散。課程教材 07 空調系統與空間計畫 p.60：常見天花高 2.4～2.9 m 時下吹氣流抵座位約 0.8～0.9 m/s，體感不良；p.62：應注意吹出氣流是否直接吹至人體、有無短路；23 S ET 03 p.24：穩定空調下氣流達 0.5 m/s 即感風擊。 【依據】課程教材：07 空調系統與空間計畫 p.60、p.62；23 S ET 03 熱舒適性與室內環境 p.24"},{"c":214,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"冷凍循環 p-h 線圖","year":112,"no":30,"art":"3-2 空氣調節","q":"下圖為某冷媒的 p-h 線圖（Mollier Chart），關於冷凍循環之敘述何者錯誤？\n（附圖：p-h 線圖：縱軸為壓力 P，橫軸為焓 h；圖中有鐘形飽和曲線，四個狀態點為 1、2、3、4。1 在低壓側、飽和蒸汽線右側附近，2 在高壓側右上方（1→2 為上升之壓縮），3 在高壓側、飽和液線左側（2→3 為水平向左之冷凝），4 在低壓側、位於鐘形曲線內（3→4 為垂直向下之膨脹），4→1 為低壓側水平向右之蒸發。）","opts":{"A":"1→2 為壓縮機，將氣態冷媒壓縮成高壓氣態","B":"2→3 為冷凝器，冷媒在此由高壓氣態變成高壓液態","C":"3→4 之過程為膨脹閥，此時冷媒變成純氣態","D":"4→1 之過程為蒸發器，冷媒藉由蒸發吸收空氣中之熱量"},"ans":"C","note":"答案 C（錯誤）。蒸汽壓縮冷凍循環：1→2 壓縮機（低壓氣體壓縮為高壓氣體，焓增加，需輸入功）；2→3冷凝器（高壓氣態放熱凝結為高壓液態，等壓）；3→4 膨脹閥（節流，焓不變，壓力與溫度降低，部分液體閃蒸成氣體，成為「氣、液混合之濕蒸氣」），並非純氣態，故 C 錯誤；4→1 蒸發器（低壓濕蒸氣吸收空氣熱量蒸發為飽和或過熱氣體）。圖中點 4 位於鐘形飽和曲線內，也顯示其為兩相混合。課程教材 06 空調原理與負荷計算p.13：莫里耳線圖縱軸為壓力、橫軸為焓；飽和蒸氣線右側冷媒完全為氣體，飽和液線左側完全為液體，兩線之間為氣液混合狀態；p.11：高壓液態冷媒經膨脹閥後降為低壓冷媒進入蒸發器（教材簡述為低壓液態，嚴格說為以液體為主之氣液混合），絕非純氣態。 【依據】課程教材：06 空調原理與負荷計算 p.11、p.13"},{"c":215,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"冰水主機性能係數 COP","year":112,"no":31,"art":"3-2 空氣調節","q":"有關空調系統冰水主機性能係數（COP）是指何者與冷卻消耗電功率的比值？","opts":{"A":"冷房負荷","B":"冷凍噸","C":"冷房度時","D":"冷卻能力"},"ans":"D","note":"答案 D。冰水主機之性能係數 COP（Coefficient of Performance）＝ 冷卻能力（冷凍能力，kW）／ 消耗電功率（kW），為無單位之比值，數值愈大，效率愈高（如 COP ＝ 5 表示每耗 1 kW 電可產生 5 kW 冷卻能力）。A 冷房負荷為室內需求而非主機輸出；B 冷凍噸（RT）是冷卻能力之單位（1 RT ≈ 3.517 kW）；C 冷房度時為氣候冷房需求之累積指標，皆非 COP 之分子。課程教材 06 空調原理與負荷計算 p.51：COP 定義為空調設備冷卻能力（W）除以冷卻消耗電力（W）之比值；08 空調節能計畫 p.34：COP ＝ 總冷凍能力（kW）÷ 總輸入功率（kW）。 【依據】課程教材：06 空調原理與負荷計算 p.51；08 空調節能計畫 p.34"},{"c":216,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調熱負荷之來源與類別","year":112,"no":35,"art":"3-2 空氣調節","q":"進行建築空調計算時，室內熱負荷來源與類別的敘述，下列何者錯誤？","opts":{"A":"透過玻璃窗進入室內的輻射熱為外部負荷，僅包含顯熱","B":"間隙風（infiltration）所產生的負荷為外部負荷，僅包含潛熱","C":"室內電腦所產生的熱量屬於內部負荷，僅包含顯熱","D":"人體所產生的熱量屬於內部負荷，包含顯熱與潛熱"},"ans":"B","note":"答案 B（錯誤）。間隙風（滲透風）為外氣由縫隙滲入，屬外部負荷，其負荷包含「顯熱」（外氣與室內之溫差）及「潛熱」（外氣與室內之含濕量差），並非僅潛熱。A 玻璃窗之日射輻射熱屬外部負荷，僅提高室溫，為顯熱；C 電腦之電能轉為熱，僅提高空氣溫度，為內部負荷之顯熱；D 人體散熱含顯熱（對流、輻射）及潛熱（呼吸與皮膚蒸發），皆為內部負荷，均正確。課程教材 06 空調原理與負荷計算 p.27：外部負荷指熱能由傳透、輻射、滲入等方式流入或流出之熱量，照明、人體及其他發熱器具之熱量為內部負荷；p.28：為保持室內濕度須補給或除去水蒸氣所生之負荷為潛熱負荷；p.31：冷氣負荷計算項目含玻璃窗、牆壁、間隙風侵入熱量、人體、照明及器具等。 【依據】課程教材：06 空調原理與負荷計算 p.27、p.28、p.31"},{"c":217,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"氣冷式箱型空調機","year":113,"no":30,"art":"3-2 空氣調節","q":"氣冷式箱型空調機通常做為於中型空間的空調機，這類箱型空調機不包括下列那一項裝置？","opts":{"A":"散熱水塔","B":"送風機","C":"冷卻盤管","D":"冷凍機"},"ans":"A","note":"答案 A。氣冷式箱型空調機（packaged air-conditioner）是把壓縮機（冷凍機）、冷凝器（以空氣冷卻）、蒸發器（冷卻盤管）、送風機等整合為一體的空調機，冷凝熱直接排至室外空氣，不需冷卻水，故不含散熱水塔（冷卻水塔僅用於水冷式系統）。B、C、D 皆為箱型空調機組成。 【依據】課程教材：07 空調系統與空間計畫 p.27（分散式：壓縮機、蒸發器、凝縮器、空氣過濾器、送風機容納於整體空調機單元）、p.28（箱型冷氣機直接對外熱交換，或另設冷卻塔）"},{"c":218,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調系統節能設計","year":113,"no":31,"art":"3-2 空氣調節","q":"下列各類建築的空調系統設計，那一種節能敘述錯誤？","opts":{"A":"大型博物館建築搭配儲冰系統，主要可利用夜間離峰電價，達到大幅降低耗能之目的","B":"大學學生宿舍的空調系統設計，應優先採用分離式空調系統，以達獨立操作管控之目的","C":"上下班一致且滿載使用的辦公建築，應優先採用中央空調系統，可達節約能源之目的","D":"住宅空調系統應優先採用 CSPF 高的變頻空調系統，以達節約能源之目的"},"ans":"A","note":"答案 A（錯誤）。儲冰系統利用夜間離峰電力製冰、白天融冰供冷，目的在「移轉尖峰電力負荷、降低電費（及契約容量）」，但製冰時主機蒸發溫度較低、效率較差，總耗能量通常不會降低，甚至略增，故「大幅降低耗能」錯誤（節省的是電費與尖峰負載，非能源；綠建築評估手冊—基本型 2019 年版 p.67 亦明言儲冰空調「在節能淨值上原本是有反效果」，因能抑制尖峰負載才給予優惠）。課程教材之儲冰式空調運轉模式圖亦以「使用夜間離峰電力、移轉負載、減低之契約容量」說明其效益。B：宿舍使用時間分散，宜用分離式、各自控制 ✓。C：上下班一致且滿載的辦公，用中央空調效率高且節能 ✓。D：住宅以 CSPF 高之變頻機為宜 ✓。 【依據】課程教材：08空調節能計畫 p.58（儲冰式空調系統）；綠建築評估手冊—基本型（2019 年版初刷）p.67（儲冰空調節能淨值說明）"},{"c":219,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"分離式冷氣機選用","year":113,"no":33,"art":"3-2 空氣調節","q":"選擇分離式冷氣機時，下列注意事項何者正確？","opts":{"A":"選用冷氣季節性能因數 CSPF 高的設備，耗電量會較高","B":"一般而言 CSPF 值每提高 1.0，就可節約 2～3%冷氣機用電","C":"選用二級能效的分離式冷氣機，較一級能效的分離式冷氣機節能","D":"若只有在夏季非常炎熱時才開啟，也處於滿載狀態下使用，不一定需要選購變頻式冷氣機"},"ans":"D","note":"答案 D。變頻機的節能優勢來自部分負載運轉；若僅在極熱時開啟、長期滿載運轉，變頻機的優勢小，定頻機亦可。A 錯：CSPF（冷氣季節性能因數）= 全年冷房能力／全年耗電，越高越省電。B 錯：耗電 ∝ 1/CSPF，如CSPF 由 4.0 提高至 5.0，耗電降為 4/5，節電約 20%；由 5.0 到 6.0 節電約 16.7%，遠大於 2～3%。C 錯：能源效率分級，一級最高效（最省電），二級較差。 【依據】課程教材：06 空調原理與負荷計算 p.53（容量過大壓縮機頻繁啟動；變頻式採較節能之運轉方式）；08 空調節能計畫 p.30（個別空調 EAC 一級能效優惠係數 0.25 大於二級0.13）"},{"c":220,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"傳透熱負荷","year":113,"no":37,"art":"3-2 空氣調節","q":"進行建築空調負荷計算時，下列何者不屬於傳透熱負荷（transmission heat load）？","opts":{"A":"因室內外氣溫差異，透過玻璃窗傳入室內的熱量","B":"因室內外氣溫差異，透過屋頂隔熱磚傳入室內的熱量","C":"太陽直射光透過玻璃窗傳入室內的輻射熱","D":"因室內外氣溫差異，透過外牆實體部傳入室內的熱量"},"ans":"C","note":"答案 C。傳透熱負荷（熱貫流負荷）是由室內外溫差，經玻璃、屋頂、牆壁等圍護構造以熱傳導（U×A×ΔT）傳入的熱量。太陽直射光透過玻璃窗進入室內的輻射熱屬「日射（輻射）熱負荷」（以日射取得係數計算），與室內外溫差無關，不是傳透熱負荷。A、B、D 皆由溫差引起，屬傳透熱負荷。課程教材亦將外部負荷區分為由「傳透、輻射、滲入」等方式流入或流出之熱量。 【依據】課程教材：06 空調原理與負荷計算 p.27～28（外部負荷：傳透、輻射、滲入）"},{"c":221,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空氣線圖狀態變化","year":114,"no":2,"art":"3-2 空氣調節","q":"關於空氣線圖（Psychrometric chart）的敘述，下列何者錯誤？","opts":{"A":"乾球溫度上升、絕對濕度不變時，熱焓上升","B":"乾球溫度不變、絕對濕度上升時，熱焓上升","C":"乾球溫度上升、絕對濕度不變時，相對濕度上升","D":"乾球溫度不變、絕對濕度上升時，相對濕度上升"},"ans":"C","note":"答案 C（錯誤）。絕對濕度不變而乾球溫度上升（顯熱加熱，空氣線圖上水平向右移動）時，飽和水蒸氣壓隨溫度升高而變大，實際水蒸氣量不變，故相對濕度「下降」而非上升。A 正確：顯熱增加，熱焓上升。B 正確：\n水蒸氣量增加，潛熱增加，熱焓上升。D 正確：同溫度下水蒸氣量增加，越接近飽和，相對濕度上升。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.17、p.20；課程教材：05 空調設備基礎知識 p.38–39"},{"c":222,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空氣線圖讀圖","year":114,"no":4,"art":"3-2 空氣調節","q":"下圖中的甲與乙分別是空氣線圖（Psychrometric chart）上的兩個空氣狀態，下列敘述何者正確？\n（附圖：空氣線圖示意：左上為斜向「熱焓」刻度線（標 g、h），其下為彎曲之「飽和線」，右側為縱軸（標 c、d），下方為橫軸（標 a、b）。狀態點甲在左下、乙在右上。由甲往下垂直虛線至 a、水平虛線往右至 d、沿等焓線往左上至飽和線上 e 點再延伸至熱焓刻度 g；由乙往下垂直虛線至 b、水平虛線往右至 c、沿等焓線往左上至飽和線上 f 點再延伸至熱焓刻度 h。）","opts":{"A":"a 與 b 的乾球溫度相同","B":"c 與 d 的絕對濕度相同","C":"e 與 f 的相對濕度相同","D":"g 與 h 的熱焓相同"},"ans":"C","note":"答案 C（正確）。e 與 f 兩點都落在飽和線上，飽和線即相對濕度 100% 曲線，故兩者相對濕度相同。A 錯：\na、b 為甲、乙垂直投影到橫軸之乾球溫度，乙在甲右方，b 溫度較高。B 錯：c、d 為水平投影到右側縱軸之絕對濕度，乙位置較甲高，c 的絕對濕度大於 d。D 錯：g、h 為沿等焓線延伸至熱焓刻度之讀值，乙的熱焓（h）大於甲（g）。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.17、p.20；空氣線圖讀圖（一般原理）"},{"c":223,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"分離式冷氣適用空間","year":114,"no":6,"art":"3-2 空氣調節","q":"下列空間何者較適合安裝分離式冷氣機空調系統？","opts":{"A":"個人書房","B":"國中教室","C":"音樂廳","D":"大學圖書館"},"ans":"A","note":"答案 A。分離式冷氣機（室外機＋室內機）屬個別式空調，冷房能力小、各自獨立控制、安裝簡便，適合小空間、使用時間不一致且負荷小的個人書房、住宅臥室。音樂廳空間大、人員密集，且需低噪音、良好氣流與外氣處理，宜採中央空調（空調箱送風）；大學圖書館面積大、長時間使用，亦以中央或大型箱型系統為宜；國中教室雖常見個別冷氣，但人數多、需引入外氣，相較之下個人書房最適合分離式。課程教材 07 p.27～28：分散式空調個別控制容易、施工簡便，住宅幾乎為分散式；教材雖寫箱型（含分離式）也可用於餐廳、集會堂、教室等較大空間，但本題問「較適合」，小空間、獨立使用的個人書房最典型。 【依據】課程教材：07 空調系統與空間計畫p.27（分散式空調）、p.28（個室空調方式：窗型、箱型、分離式）；空調系統型式選用（一般原理）"},{"c":224,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"冷凍噸換算","year":114,"no":26,"art":"3-2 空氣調節","q":"一部冷氣機每小時可吸收 60,000 kcal 的熱量，大約相當於多少美國冷凍噸（USRT）？","opts":{"A":"15","B":"20","C":"25","D":"30"},"ans":"B","note":"答案 B。1 美國冷凍噸（USRT）＝12,000 Btu/h ≒ 3,024 kcal/h ≒ 3.52 kW（將 1 短噸 0℃ 水於 24 小時內凍結成 0℃ 冰之除熱率）。60,000 ÷ 3,024 ≒ 19.8 ≒ 20 USRT。驗算一：3,024×20＝60,480 kcal/h，與 60,000 相差不到1%。驗算二：若取概數 3,000 kcal/h，60,000÷3,000＝20。課程教材：英制 1 冷凍噸＝3,024 kcal/h（12,000 Btu/h），公制 1 冷凍噸＝3,320 kcal/h（以公制換算約 18，非本題所問）。 【依據】課程教材：06 空調原理與負荷計算 p.50"},{"c":225,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"冰水主機能源效率分級標示","year":114,"no":27,"art":"3-2 空氣調節","q":"有關空調系統冰水主機能源效率分級標示圖，下列敘述何者錯誤？","opts":{"A":"能源效率分級標示圖分為 5 級","B":"第 3 級標章比第 2 級耗電","C":"標章內有列出性能係數為 EER","D":"標章內有列出額定製冷能力"},"ans":"C","note":"答案 C（錯誤）。冰水機組能源效率分級標示圖為溫度計造型，刻度 1～5 級，上端標「用電較多」、下端標「用電較少」，故第 1 級最省電、級數越大越耗電（A、B 正確）。冰水機組依 CNS 12575 全載試驗「性能係數COP」分級，標示圖內列有「額定製冷能力（kW）」與「性能係數（COP）」（D 正確），並非 EER，C 錯（課程教材：COP 常用於冰水主機，EER 常用於個別或箱型冷氣機）。附註：分級基準表對冰水機組只核定 1～3 級，但標示圖刻度為 5 級。【查證限制】所據為 2022 年 WTO 通報之修正草案附圖一，正式公告原文本機沒有。 【依據】蒸氣壓縮式冰水機組容許耗用能源基準與能源效率分級標示事項方法及檢查方式修正草案（2022 年 WTO 通報）第二、五、九點、附表五、附圖一；課程教材：06 空調原理與負荷計算 p.51"},{"c":226,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"空調容量概估","year":114,"no":29,"art":"3-2 空氣調節","q":"關於建築物類型與其合理的空調容量（m²/USRT），下列何者最不合理？","opts":{"A":"政府辦公大樓：26","B":"住宅：13","C":"音樂廳：12","D":"體育館：10"},"ans":"B","note":"答案 B。m²/USRT 表示每一冷凍噸可負擔之樓地板面積，數值越小代表單位面積冷房負荷越大。課程教材「建築單位冷凍噸可提供空調面積」表：政府機關 26.4 m²/RT（8.0 坪/RT）、住宅 33.1 m²/RT（10.0 坪/RT）、集會表演（音樂廳）11.6 m²/RT、集會表演（體育館）9.9 m²/RT。A 26、C 12、D 10 均與表值相近而合理；住宅人員密度低、內部發熱少，表值為 33.1，B 寫 13 僅約四成，相當於百貨公司一樓等高負荷空間（13.2），最不合理。\n【依據】課程教材：08 空調節能計畫 p.44、p.46、p.47"},{"c":227,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-2 空氣調節","h3":"外氣引入節能控制","year":114,"no":30,"art":"3-2 空氣調節","q":"某辦公建築於冷房期間，採用機械通風設備引入外氣時兼顧節能的控制方式，下列何者錯誤？","opts":{"A":"外氣之熱焓低於室內回風的熱焓時，啟動全熱交換器","B":"外氣溫度低於設定溫度的期間，啟動外氣冷房系統","C":"監測室內二氧化碳濃度，高於容許值時啟動外氣控制系統","D":"依據室內人數差異，採用變風量外氣送風系統"},"ans":"A","note":"答案 A（錯誤）。全熱交換器是在外氣熱焓「高於」室內回風（排氣）熱焓時，讓排氣預冷、預除濕引入之外氣，回收排氣冷能以降低外氣負荷；若外氣熱焓已低於回風熱焓，再經熱交換反而會把外氣加熱加濕，此時應旁通全熱交換器，直接引入外氣（外氣冷房、焓值控制）。B 正確：外氣冷房（economizer），外氣溫度低時以外氣直接冷卻。C 正確：CO2 需求控制換氣（DCV），依濃度調整外氣量。D 正確：依人數變化以變風量調整外氣送風量，避免過量外氣負荷。課程教材亦列：外氣量依 CO2 濃度自動調整、可變風量方式、中間期外氣焓值較低時全部取入外氣（外氣冷房）、全熱交換器回收排氣廢冷廢熱。 【依據】課程教材：08 空調節能計畫 p.56–57、p.60–61"},{"c":228,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"單位面積換氣量","year":102,"no":14,"art":"3-3 室內空氣品質與機械通風","q":"房間寬度 10 m、長度 10 m、高度 4 m，若所需最小換氣量為 10 m³/h/m²，其最小空氣流量為多少 m³/h？","opts":{"A":"1000","B":"400","C":"4000","D":"2400"},"ans":"A","note":"答案為 A。\n換氣量的基準是「每平方公尺樓地板面積」，所以只要乘樓地板面積，與高度無關：\n面積 = 10 × 10 = 100 m²Q = 10 m³/h/m² × 100 m² = 1000 m³/h驗算：1000 ÷ 100 = 10 m³/h/m²，正確。\n400 是房間體積（m³）；4000 是誤把體積乘以 10。此「每平方公尺樓地板面積」基準與建築技術規則建築設備編第102 條機械通風量表相同（辦公室、會客室為 10 m³/h·m²）；113-7 舞蹈教室 15 m³/h·m² 亦出自同表。 【依據】建築技術規則建築設備編第 102 條（樓地板面積每平方公尺所需通風量表，辦公室 10 m³/h）；必要換氣量計算（通用原理）"},{"c":229,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"P3 實驗室壓力梯度","year":102,"no":16,"art":"3-3 室內空氣品質與機械通風","q":"設計一間生物安全第三等級（P3）實驗室，請依照 1～4 各空間別的空調設計室內空氣壓力由高至低排列：\n（附圖：平面圖：右下角為「1.走廊入口」，由入口進入右側的「2.更衣室」（內有隔間），再進入左側大空間「3.普通實驗室」，「4.病毒實驗室」位於普通實驗室內的左下角。由外而內為 1→2→3→4。）","opts":{"A":"1＞2＞3＞4","B":"4＞3＞2＞1","C":"1＞2＞4＞3","D":"3＞4＞2＞1"},"ans":"A","note":"答案為 A。\nP3 實驗室以「負壓梯度」防止病原外洩：氣流必須從污染風險低的區域，流向風險高的區域，最後由病毒實驗室經高效濾網（HEPA）排出。\n所以壓力由高到低，就是污染風險由低到高：\n1.走廊入口（清潔區，最高）＞ 2.更衣室（緩衝）＞ 3.普通實驗室 ＞ 4.病毒實驗室（最低，負壓最大）B 的方向剛好相反，屬於潔淨室（正壓保護產品）的作法，會讓病原外洩。C、D 的順序不連續，無法形成由外向內的單向氣流。 【依據】建築環境控制一般原理（生物安全實驗室負壓空調）"},{"c":230,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"浴廁排風扇設置","year":102,"no":17,"art":"3-3 室內空氣品質與機械通風","q":"浴廁天花板排風扇設置，下列何者錯誤？","opts":{"A":"排風扇之排風管，連接於獨立的排風管道","B":"將排風扇安裝於天花板，透過天花板空間排風至管道間","C":"將排風扇之排風管連接至外牆開口部，且防止風的逆流","D":"排風管緊密地連接排風口或排風管道，周圍填縫"},"ans":"B","note":"答案為 B。\n排風扇若不接排風管，而是把濕氣與臭氣排進天花板內，再「透過天花板空間」流向管道間，會產生以下問題：\n・濕氣在天花板內結露、發霉，鏽蝕吊架與設備\n・臭氣擴散到其他空間，或從管道間逆流回室內\n・排風效率大幅降低正確作法是排風扇以風管直接、密閉地連接到獨立排風管道（A），或連接到外牆開口並裝防逆流裝置（C），接頭處緊密填縫（D）。\n原則性依據：建築技術規則建築設備編第 92 條第 2 款規定，機械通風設備的風管「應具有適度之氣密」，除運轉或養護需要外不得開設任何開口；B 把天花板內空間當成排風路徑，等於沒有氣密風管。\n【查證限制】本題屬設備施工實務，本機法規（設備編第 92 條只是風管構造的一般規定）與課程教材都沒有浴廁排風扇的專條，依一般原理判斷。 【依據】建築技術規則建築設備編第 92 條第 2 款；建築環境控制一般原理（浴廁機械排風）"},{"c":231,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"CO2 必要換氣量","year":102,"no":18,"art":"3-3 室內空氣品質與機械通風","q":"某會議室可容納 35 人，並使用機械通風進行換氣，若室外二氧化碳濃度為 300 ppm，室內每人產生二氧化碳為 0.02m³/hr，為維持室內二氧化碳濃度在 1000 ppm 以下，則該會議室所需之通風量為多少？","opts":{"A":"700 m³/hr","B":"900 m³/hr","C":"1000 m³/hr","D":"1400 m³/hr"},"ans":"C","note":"答案為 C。\n必要換氣量公式：\nQ = M ÷ (Ci − Co)\n・M：CO2 總發生量 = 35 × 0.02 = 0.7 m³/h\n・Ci − Co = 1000 − 300 = 700 ppm = 0.0007代入：Q = 0.7 ÷ 0.0007 = 1000 m³/h驗算：1000 × 0.0007 = 0.7 m³/h，等於發生量，正確。\n若誤用 1000 ppm 而沒有扣掉室外濃度，會得到 700 m³/h（A）。課程教材亦以「室外濃度＋700 ppm 或 1000 ppm以下」為室內 CO2 標準，本題 Ci−Co＝700 ppm 正相符。 【依據】必要換氣量 Q＝M／(Ci－Co)（通用原理）；\n課程教材：23 S ET 03 熱舒適性與室內環境 p.30（室內 CO2 標準：室外＋700 ppm 或 1000 ppm 以下）；室內空氣品質標準第 2 條（CO2 八小時值 1000 ppm）"},{"c":232,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"真菌濃度單位","year":103,"no":8,"art":"3-3 室內空氣品質與機械通風","q":"我國室內空氣品質管理法中，下列何者是真菌的濃度單位？","opts":{"A":"μg/m³","B":"ppm","C":"CFU/m³","D":"%"},"ans":"C","note":"答案 C。依室內空氣品質管理法第 7 條第 2 項訂定之室內空氣品質標準第 2 條，細菌（最高值 1500）與真菌（最高值 1000，另有室內外比值規定）之單位均為 CFU/m³（菌落數／立方公尺）。A μg/m³ 為懸浮微粒 PM10、PM2.5 之單位；B ppm 為二氧化碳、一氧化碳、甲醛、總揮發性有機化合物、臭氧之體積濃度單位；D % 非標準所用單位。 【依據】室內空氣品質標準第 2 條；室內空氣品質管理法第 7 條"},{"c":233,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"CO2 控制外氣量","year":103,"no":10,"art":"3-3 室內空氣品質與機械通風","q":"為兼顧健康與節能，空調系統採用二氧化碳濃度控制外氣量，所依據的二氧化碳濃度上限值為何？","opts":{"A":"1000 ppm","B":"2000 ppm","C":"3000 ppm","D":"4000 ppm"},"ans":"A","note":"答案 A。室內空氣品質標準第 2 條規定二氧化碳（CO2）八小時值標準為 1000 ppm。空調系統之外氣量需量控制（CO2 濃度控制）即以室內 CO2 不超過 1000 ppm 為控制上限：濃度低時減少外氣以節省空調負荷，接近上限時增加外氣以維持健康。B、C、D 均高於標準值，不符合室內空氣品質要求。考試當時適用之綠建築評估手冊—基本型（2012 年版）亦將「採用 CO2 濃度外氣控制空調系統」列為空調節能規劃重點（b6）；課程教材亦列「能因應 CO2 濃度自動調整外氣量」。 【依據】室內空氣品質標準第 2 條；綠建築評估手冊—基本型（2012 年版）p.51（PDF 第 59 頁）b6；課程教材：08 空調節能計畫 p.60（外氣引入量之控制）"},{"c":234,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"室內空氣品質管制項目","year":104,"no":8,"art":"3-3 室內空氣品質與機械通風","q":"下列何者不是我國室內空氣品質管理法的管制項目？","opts":{"A":"氡氣","B":"真菌","C":"TVOC","D":"臭氧"},"ans":"A","note":"答案 A。依室內空氣品質管理法第 3 條第 2 款（室內空氣污染物之定義）及依同法第 7 條第 2 項訂定之室內空氣品質標準第 2 條，管制項目為：二氧化碳、一氧化碳、甲醛、總揮發性有機化合物（TVOC）、細菌、真菌、PM10、PM2.5、臭氧，共 9 項。氡氣雖為室內放射性污染物，但不在我國管制項目內。真菌（最高值 1000CFU/m³）、TVOC（一小時值 0.56 ppm）、臭氧（八小時值 0.06 ppm）均列於標準中。 【依據】室內空氣品質管理法第 3 條第 2 款；室內空氣品質標準第 1、2 條（民國 101 年 11 月 23 日發布）"},{"c":235,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"病態建築症候群改善","year":104,"no":9,"art":"3-3 室內空氣品質與機械通風","q":"有關病態住宅症候群之改善方法，下列何者錯誤？","opts":{"A":"加裝變頻冷氣，淨化室內空氣","B":"降低室內污染源的發生","C":"減少對室內空氣造成污染之建材的使用","D":"加裝可對外部換氣的空調"},"ans":"A","note":"答案 A。病態住宅（建築）症候群主因是室內污染物（甲醛、VOC、微生物、CO2 等）累積與換氣不足。改善要素為：移除高污染源、引入適當外氣量、足夠換氣、正確過濾與良好氣流分布。變頻冷氣只是以變頻壓縮機調節冷房能力以節能，本身多為室內循環、不引入外氣，不能「淨化室內空氣」，故 A 錯。B、C 屬源頭控制，D 屬引入外氣稀釋，均為正確改善方法。 【依據】課程教材：05 空調設備基礎知識 p.32（室內污染與病態建築，維持室內空氣品質之要素）"},{"c":236,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"香菸煙霧排除","year":104,"no":10,"art":"3-3 室內空氣品質與機械通風","q":"若要將香菸的煙霧與氣味完全從室內排除，下列處理方式何者最有效？","opts":{"A":"利用高性能集塵裝置過濾室內空氣","B":"使用過濾器去除香菸產生的浮游粉塵","C":"於室內加裝冷氣進行空氣調節","D":"對於室內空氣進行 100%換氣"},"ans":"D","note":"答案 D。香菸煙霧同時含粒狀物（焦油、懸浮微粒）與氣狀物（一氧化碳、氣味、VOC）。集塵裝置與過濾器（A、B）主要去除粒狀物，對氣體與臭味效果有限；冷氣（C）多為室內循環，不能排除污染物。只有將室內空氣全部排出、以外氣置換（100% 換氣，全外氣）才能同時去除粒狀與氣狀污染物，最有效。課程教材亦將香菸列為室內主要污染源之一。 【依據】課程教材：05 空調設備基礎知識 p.32–33（室內污染源：香菸、臭味）"},{"c":237,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"換氣次數計算","year":104,"no":11,"art":"3-3 室內空氣品質與機械通風","q":"某空間所需最小換氣量為 6000 m³/hr，若空間的長度為 20 m、寬度 10 m、高度為 3 m，其每小時換氣次數為多少？","opts":{"A":"20 次","B":"10 次","C":"100 次","D":"30 次"},"ans":"B","note":"答案 B。換氣次數 N＝換氣量 Q ÷ 室容積 V。室容積 V＝20×10×3＝600 m³；N＝6000 ÷ 600＝10 次/hr。驗算：600 m³×10 次＝6000 m³/hr，與題給換氣量相符。A（20 次）相當於 12000 m³/hr；C、D 亦不符。"},{"c":238,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"綠建材 TVOC 管制物質","year":104,"no":12,"art":"3-3 室內空氣品質與機械通風","q":"我國綠建材標章中，下列何者不屬於 TVOC 之管制項目？","opts":{"A":"甲苯","B":"乙苯","C":"二甲苯","D":"苯乙烯"},"ans":"一律給分（原公告答案 D）","note":"本題一律給分（原公告答案 D）。考選部未公布更正理由，以下為推測：綠建材解說與評估手冊（2024 年版）第一章沿革說明，「2015 年版手冊中健康綠建材的 TVOC 列管化學物質與我國空氣品質管理法接軌，由 6 項增加至 12 項」；同手冊表 5-2 健康綠建材評定基準之試驗規定第 2 點，TVOC 係採計苯、四氯化碳、三氯甲烷（氯仿）、1,2-二氯苯、1,4-二氯苯、二氯甲烷、乙苯、苯乙烯、四氯乙烯、三氯乙烯、甲苯及二甲苯（對、間、鄰）等12 種化合物之總和，與室內空氣品質標準第 3 條第 5 款相同。依 12 項版本，甲苯、乙苯、二甲苯、苯乙烯四者都在 TVOC 採計範圍內，本題沒有正確答案。原公告答案 D 可能是依改版前「6 項」的舊清單出題；104 年 7 月考試時新舊版本交替，所以一律給分。【查證限制】本機無 2011 年版手冊，舊版 6 項的物種名單未能核對，「舊版不含苯乙烯」僅屬推測。 【依據】綠建材解說與評估手冊（2024 年版公告版 3）p.6（2015 年版 TVOC 由 6 項增為12 項）、p.49 表 5-2 試驗規定第 2 點；室內空氣品質標準第 3 條第 5 款"},{"c":239,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"空調系統病菌滋生處","year":104,"no":30,"art":"3-3 室內空氣品質與機械通風","q":"下列何處不是空調系統容易滋生病菌之處？","opts":{"A":"全熱交換器","B":"冷卻水塔","C":"空調箱","D":"冰水盤管"},"ans":"A","note":"答案 A。病菌（如退伍軍人菌、黴菌）容易在潮濕、有積水且溫度適宜的地方繁殖。冷卻水塔（B）水溫30°C 左右且開放式接觸空氣，是退伍軍人菌最常見的來源；空調箱（C）的濾網、集水盤與冰水盤管（D）表面因冷卻除濕而長期潮濕、積冷凝水，也容易滋生微生物。全熱交換器（A）為排氣與外氣間的熱濕交換元件，正常運轉不積水，相對較不易滋生病菌（但仍須定期清潔濾網）。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境p.29（空調系統：維護不良冷卻塔之水中細菌）；08 空調節能計畫 p.56（全熱交換系統）；一般空調衛生管理原則"},{"c":240,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"除濕所需換氣量","year":105,"no":8,"art":"3-3 室內空氣品質與機械通風","q":"室內水蒸氣發生量為 1.5 kg/h，室外空氣絕對濕度為 0.005 kg/kg'，若為維持室內濕度為 0.01 kg/kg'，假設空氣密度為 1.2 kg/m³，則所需之換氣量為多少 m³/h？","opts":{"A":"25","B":"250","C":"120","D":"300"},"ans":"B","note":"答案 B。水蒸氣質量平衡：Q × ρ ×（xi－xo）= W，故 Q = W／[ρ（xi－xo）] = 1.5／[1.2 ×（0.01－0.005）] =1.5／0.006 = 250 m³/h。驗算：250 m³/h × 1.2 kg/m³ = 300 kg/h 乾空氣，每公斤帶走 0.005 kg 水蒸氣，300 × 0.005 =1.5 kg/h，與發生量相符。A 少一位數；C、D 為代入錯誤。 【依據】必要換氣量之水蒸氣質量平衡原理（課程教材未列此計算式，依一般空調教材）"},{"c":241,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"醫院負壓空間","year":105,"no":10,"art":"3-3 室內空氣品質與機械通風","q":"醫院建築空調設計，下列何種空間須採取強制排氣以維持負壓？","opts":{"A":"X 光室","B":"燙傷病房","C":"開刀房","D":"肺病病房"},"ans":"D","note":"答案 D。肺結核等經空氣傳染疾病之病房（隔離病房）須以排氣量大於供氣量維持負壓，使空氣由走廊流向病房，並經高效率過濾後排出，防止病原擴散到其他區域。B 燙傷病房病人抵抗力低，須防外部污染進入，採正壓；C 開刀房要求潔淨，採正壓並高換氣；A X 光室重點在輻射防護（鉛板屏蔽），不需維持負壓。【查證限制】本機課程教材與法規未載醫院各室壓力關係，依醫院空調設計與感染控制通則。 【依據】醫院空調設計與感染控制教材"},{"c":242,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"VOC 沸點","year":105,"no":12,"art":"3-3 室內空氣品質與機械通風","q":"下列揮發性有機化合物，何者之沸點最低？","opts":{"A":"甲苯","B":"甲醛","C":"乙苯","D":"乙烯"},"ans":"B 或 D 均給分（更正前公告答案 B）","note":"各物質沸點約為：甲苯 111℃、乙苯 136℃、甲醛約 －19℃、乙烯約 －104℃。依沸點數值，乙烯（D）其實最低，甲醛（B）次之。室內空氣品質領域常把甲醛列為沸點極低之「極易揮發性有機物（VVOC）」代表，原答案應是以此命題，但忽略乙烯沸點更低。【查證限制／爭議】考選部未公布更正理由，以下為推測：因乙烯沸點確實低於甲醛，故增列 D 給分。（甲醛與總揮發性有機化合物另列於室內空氣品質標準第 2 條管制。）沸點為一般化學手冊數值。 【依據】一般化學手冊（沸點）；室內空氣品質標準第 2 條"},{"c":243,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"換氣原則與室壓","year":106,"no":3,"art":"3-3 室內空氣品質與機械通風","q":"有關換氣之原則，下列敘述何者錯誤？","opts":{"A":"在室內發生局部性有害氣體、粉塵之處，應加裝排氣裝置","B":"手術室須維持室內負壓狀態","C":"廁所、浴室等空間之室內氣壓應低於其他周圍空間之氣壓","D":"進出風口的高度差決定浮力通風的強度"},"ans":"B","note":"答案 B（錯誤）。手術室、無菌室、潔淨室須保持室內「正壓」，使空氣由室內往外流，防止周圍未經處理之空氣與微生物流入污染手術區；需維持負壓者是隔離病房（傳染病）、廁所、廚房等污染源空間。A：局部污染源應以局部排氣就近捕集排除 ✓。C：廁所、浴室保持負壓，臭氣與濕氣不外洩 ✓。D：浮力（溫差、煙囪）通風量與進出風口高度差及室內外溫差有關，高度差愈大浮力通風愈強 ✓。 【依據】空調與通風一般原理（室壓控制）"},{"c":244,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"CO₂ 必要換氣量計算","year":106,"no":10,"art":"3-3 室內空氣品質與機械通風","q":"室內二氧化碳產生量為 10 l/h，室外二氧化碳濃度為 300 ppm，若欲維持室內 700 ppm 的二氧化碳濃度，所需之新鮮外氣值為多少 m³/h？","opts":{"A":"2.5","B":"250","C":"25","D":"12.5"},"ans":"C","note":"答案 C（25 m³/h）。必要換氣量公式 Q＝M／(Ci－Co)。M＝10 L/h＝0.010 m³/h；Ci－Co＝700－300＝400ppm＝400×10⁻⁶＝0.0004。Q＝0.010／0.0004＝25 m³/h。驗算一：25 m³/h × 0.0004＝0.010 m³/h＝10 L/h，與產生量相符 ✓。驗算二：以 L 計，10 L/h ÷ (400/10⁶)＝25,000 L/h＝25 m³/h ✓。常見錯誤：忘記把 L 換成 m³ 得 25,000，或把ppm 誤以 700 計算得 14.3。 【依據】室內空氣品質與換氣量計算一般原理"},{"c":245,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"室內空氣品質管理法管制項目","year":106,"no":13,"art":"3-3 室內空氣品質與機械通風","q":"下列何種組合是我國室內空氣品質管理法的管制項目？①CO₂ ②NH₃ ③細菌 ④TVOC ⑤SO₂ ⑥PM2.5","opts":{"A":"②③④⑤","B":"①③④⑥","C":"①④⑤⑥","D":"①②⑤⑥"},"ans":"B","note":"答案 B。室內空氣品質管理法第 3 條第 2 款：室內空氣污染物包括二氧化碳、一氧化碳、甲醛、總揮發性有機化合物、細菌、真菌、PM10、PM2.5、臭氧及其他經中央主管機關指定公告之物質；室內空氣品質標準第 2 條亦訂有 CO₂（8 小時值 1000 ppm）、TVOC（1 小時值 0.56 ppm）、細菌（最高值 1500 CFU/m³）、PM2.5 等標準值。\n故 ①CO₂、③細菌、④TVOC、⑥PM2.5 屬管制項目；②NH₃（氨）、⑤SO₂（二氧化硫）未列入，含 ② 或 ⑤之 A、C、D 皆錯。 【依據】室內空氣品質管理法第 3 條第 2 款；室內空氣品質標準第 2 條"},{"c":246,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"室內空氣污染來源","year":107,"no":6,"art":"3-3 室內空氣品質與機械通風","q":"有關室內空氣污染來源，下列敘述何者錯誤？","opts":{"A":"甲醛、TVOC 主要逸散來源為室內裝修建材","B":"粉塵、黴菌是室內常見污染","C":"PM2.5、PM10 在室內並無產生源，屬於外氣污染","D":"CO2 主要來源為室內人員產生"},"ans":"C","note":"答（C）。懸浮微粒雖有部分由室外滲入，但室內亦有許多產生源：烹調油煙、燃燒（瓦斯爐、燒香、吸菸、蚊香）、事務機（影印機、雷射印表機）、人員活動揚塵、清掃等，故「室內並無產生源」錯誤。（A）甲醛與 TVOC 主要來自合板、黏著劑、塗料等裝修建材與家具，正確。（B）粉塵與黴菌（潮濕處孳生）為常見室內污染，正確。（D）室內 CO2 主要來自人員呼吸，因此常作為換氣是否足夠的指標，正確。室內空氣品質標準第 2 條即將 PM10、PM2.5 列為室內管制項目。 【依據】室內空氣品質標準第 2 條"},{"c":247,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"室內 CO2 標準","year":107,"no":7,"art":"3-3 室內空氣品質與機械通風","q":"二氧化碳是室內空氣的指標污染物，我國室內空氣品質管理法中對於二氧化碳的 8 小時平均值上限規定為多少ppm？","opts":{"A":"1200","B":"1000","C":"800","D":"600"},"ans":"B","note":"答（B）。室內空氣品質管理法第 7 條規定公告場所之室內空氣品質應符合「室內空氣品質標準」，由中央主管機關另定標準；室內空氣品質標準第 2 條規定二氧化碳（CO2）之標準值為八小時值 1000 ppm。題目稱「室內空氣品質管理法中」，實際數值規定於依該法第 7 條第 2 項訂定之室內空氣品質標準。其他選項 1200、800、600ppm 均非我國法定標準值。另同表一氧化碳八小時值為 9 ppm、甲醛一小時值為 0.08 ppm，可一併記憶。 【依據】室內空氣品質管理法第 7 條；室內空氣品質標準第 2 條"},{"c":248,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"空氣清淨機產生臭氧","year":107,"no":8,"art":"3-3 室內空氣品質與機械通風","q":"室內採用高壓放電式空氣清淨機時，可能產生何種空氣污染物？","opts":{"A":"一氧化碳","B":"氡氣","C":"甲醛","D":"臭氧"},"ans":"D","note":"答（D）。高壓放電式（靜電集塵、負離子產生器、電漿式）空氣清淨機利用高電壓使空氣電離，放電過程會使氧分子分解再結合產生臭氧（O3）。臭氧具強氧化性，會刺激呼吸道，室內空氣品質標準第 2 條將臭氧列為管制項目，八小時值為 0.06 ppm。（A）一氧化碳來自不完全燃燒；（B）氡氣來自土壤、岩石及部分石材之放射性衰變；（C）甲醛來自建材、黏著劑與家具，均非放電所產生。 【依據】室內空氣品質標準第 2 條"},{"c":249,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"換氣次數計算","year":108,"no":6,"art":"3-3 室內空氣品質與機械通風","q":"若某空間的 CO₂ 必要換氣量為 150(m³/hr)，室容積 25 m³，樓地板面積 10 m²，使用者 3 人，則每小時所需的換氣次數為何？","opts":{"A":"1","B":"2","C":"6","D":"15"},"ans":"C","note":"答案 C。換氣次數 n＝必要換氣量 Q ÷ 室容積 V＝150 ÷ 25＝6 次/hr。驗算：6×25＝150 m³/hr，吻合；另以單位檢查：(m³/hr)÷m³＝1/hr。樓地板面積 10 m² 與使用者 3 人為干擾條件（若以 150÷10＝15 即誤用面積，得 D；\n150÷3÷25＝2 為誤除人數，得 B）。"},{"c":250,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"PM2.5 與空調方式","year":108,"no":39,"art":"3-3 室內空氣品質與機械通風","q":"有關 PM₂.₅ 之敘述，下列何者錯誤？","opts":{"A":"在 PM₂.₅ 濃度高的地區，採用全水式空調比全氣式空調適合","B":"在 PM₂.₅ 濃度高的地區，採用 AHU 空調比 VRV 空調適合","C":"PM₂.₅ 與 PM₁₀ 的差別在於懸浮微粒的大小不同","D":"現有之家用分離式冷氣的濾網絕大多數無法過濾 PM₂.₅"},"ans":"A","note":"答案 A（錯誤）。全水式空調（風機盤管等）只在室內循環處理熱負荷，本身不引入並處理外氣，外氣多靠開窗或另行引入，難以過濾 PM2.5；全氣式空調由空調箱集中引入外氣，可裝設中高效率濾網（如高效率或 HEPA等級）過濾微粒，故 PM2.5 高的地區全氣式較適合。B：AHU 可設多段高效濾網，VRV 室內機僅有粗濾網，正確；C：PM2.5、PM10 分別指氣動粒徑 2.5 μm、10 μm 以下之懸浮微粒，差別在粒徑，正確；D：家用分離式冷氣多為粗濾網，正確。"},{"c":251,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"室內空氣污染與病態大樓症候群、退伍軍人症","year":109,"no":8,"art":"3-3 室內空氣品質與機械通風","q":"有關室內空氣污染之敘述，下列何者錯誤？","opts":{"A":"「病態大樓症候群」的發生原因之一是室內換氣量不足","B":"所謂的室內空氣污染物質也包括二氧化碳","C":"「退伍軍人症」是由室內建材揮發之化學污染物質所導致","D":"甲醛常被使用於裝潢材料與裝修過程中，是室內常見的空氣污染物質"},"ans":"C","note":"答案 C。退伍軍人症（Legionnaires’ disease）是吸入含退伍軍人桿菌（Legionella）的水霧所致之細菌性肺炎，菌常孳生於冷卻水塔、熱水系統、加濕器、蓮蓬頭等溫暖滯水處，屬生物性污染，不是建材揮發的化學物質，故 (C) 錯誤。(A) 病態大樓症候群與換氣不足、空調維護不良、建材逸散等有關，正確。(B) 室內空氣品質標準列有二氧化碳（八小時值 1000 ppm），亦屬管制項目，正確。(D) 甲醛來自板材、黏著劑、塗料等，室內空氣品質標準一小時值 0.08 ppm，正確。 【依據】室內空氣品質標準第 2 條（二氧化碳、甲醛標準值）；一般原理（退伍軍人症）"},{"c":252,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"甲醛濃度控制之必要換氣量","year":109,"no":9,"art":"3-3 室內空氣品質與機械通風","q":"某房間容積為 100 m³，壁面建材之甲醛逸散速率為 4×10⁻⁶ m³/h，且若外氣中甲醛濃度為 0 ppm，室內外無溫度差且室內空氣完全均勻混合，欲將室內甲醛濃度控制在室內空氣品質管理法的基準 0.08 ppm 以下時，所需之必要換氣量為多少 m³/h？","opts":{"A":"60","B":"16.7","C":"50","D":"200"},"ans":"C","note":"答案 C。依室內空氣品質標準第 2 條，甲醛一小時值為 0.08 ppm＝0.08×10⁻⁶（體積分率）。穩態完全混合時，必要換氣量 Q＝M／(Ci－Co)＝(4×10⁻⁶ m³/h)／(0.08×10⁻⁶－0)＝50 m³/h。驗算：50×0.08×10⁻⁶＝4×10⁻⁶ m³/h，與逸散量相等。（兩次計算結果相同。）房間容積 100 m³ 於穩態計算中不影響必要換氣量，只是干擾條件；50 m³/h相當於換氣次數 0.5 次/h。 【依據】室內空氣品質標準第 2 條（甲醛一小時值 0.08 ppm）；必要換氣量公式 Q＝M／(Ci－Co)"},{"c":253,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"decipol 與 olf","year":110,"no":2,"art":"3-3 室內空氣品質與機械通風","q":"關於 decipol 與 olf 的敘述，下列何者錯誤？","opts":{"A":"decipol 是用於評估知覺空氣品質的指標","B":"1 decipol 為室內有 1 標準成人且換氣量為 10 L/s 時的污染濃度","C":"1 olf 是一個標準成人在靜坐下，單位時間所產生污染物質的量","D":"人體產生的體臭不可用 olf 值表示"},"ans":"D","note":"答案 D（錯誤敘述）。olf 與 decipol 為丹麥 Fanger 教授提出的知覺空氣品質單位：olf 為污染「散發量」單位，1 olf ＝ 一位標準成人（靜坐、衛生條件標準）所散發的人體氣味污染量，因此人體體臭正是以 olf 表示之基準，D 敘述顛倒；decipol 為知覺污染「濃度」單位，1 decipol ＝ 1 olf 污染源在 10 L/s 清潔空氣稀釋下所形成的空氣污染程度，故 A、B、C 正確。課程教材（ET03 p.30）亦指 decipol 為室內環境用之空氣品質指標，室內最好趨近1（市區外氣約 0.1）。【查證限制】olf 之「標準成人」細部定義與 1 decipol＝10 L/s 之換算，課程教材與本機法規均未載，依 Fanger 熱舒適理論。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.30（decipol 指標）"},{"c":254,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"室內空氣品質標準值","year":110,"no":17,"art":"3-3 室內空氣品質與機械通風","q":"依據我國室內空氣品質管理法，下列室內空氣品質指標及標準值何者錯誤？","opts":{"A":"甲醛：0.08 ppm","B":"二氧化氮：0.25 ppm","C":"真菌：1000 CFU/m³","D":"PM2.5：35 μg/m³"},"ans":"B","note":"答案 B（錯誤敘述）。室內空氣品質標準（依室內空氣品質管理法第 7 條第 2 項訂定）第 2 條所列污染物僅CO₂（八小時值 1000 ppm）、CO（八小時值 9 ppm）、甲醛（一小時值 0.08 ppm）、TVOC（一小時值 0.56ppm）、細菌（最高值 1500 CFU/m³）、真菌（最高值 1000 CFU/m³，但室內外比值 ≤ 1.3 者不在此限）、PM10（二十四小時值 75 μg/m³）、PM2.5（二十四小時值 35 μg/m³）、臭氧（八小時值 0.06 ppm），並無「二氧化氮 0.25ppm」。A、C、D 均與標準相符。 【依據】室內空氣品質標準第 1、2 條（本機 參考法規來源／室內空氣品質標準.pdf，101.11.23 發布）"},{"c":255,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"室內空氣品質評估項目","year":111,"no":6,"art":"3-3 室內空氣品質與機械通風","q":"當某餐廳的外部環境空氣品質良好時，下列何者不是室內空氣品質的主要評估項目？","opts":{"A":"甲醛等揮發性有機化合物","B":"二氧化碳","C":"一氧化碳","D":"二氧化硫"},"ans":"D","note":"答案 D。室內空氣品質標準第 2 條所列污染物為：二氧化碳、一氧化碳、甲醛、總揮發性有機化合物（TVOC）、細菌、真菌、PM10、PM2.5、臭氧，並無二氧化硫。甲醛、VOC 來自建材裝修，二氧化碳來自人員呼吸，一氧化碳來自室內燃燒（餐廳炊煮）；二氧化硫主要來自室外燃燒源，外部空氣品質良好時並非室內主要評估項目。 【依據】室內空氣品質標準第 2 條"},{"c":256,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"室內空氣品質標準管制項目","year":111,"no":7,"art":"3-3 室內空氣品質與機械通風","q":"行政院環境保護署所訂定的室內空氣品質標準中，下列何者未被列入管制？","opts":{"A":"一氧化氮","B":"二氧化碳","C":"甲醛","D":"真菌"},"ans":"A","note":"答案 A。室內空氣品質標準第 2 條列有九項：二氧化碳（八小時值 1000 ppm）、一氧化碳（八小時值 9ppm）、甲醛（一小時值 0.08 ppm）、TVOC（一小時值 0.56 ppm）、細菌（最高值 1500 CFU/m³）、真菌（最高值1000 CFU/m³，但室內外比值 ≤ 1.3 者不在此限）、PM10（二十四小時值 75 μg/m³）、PM2.5（二十四小時值 35μg/m³）、臭氧（八小時值 0.06 ppm）。一氧化氮不在其中；B、C、D 皆列入。（環保署現已改制為環境部，標準本文條次不變。） 【依據】室內空氣品質標準第 2 條"},{"c":257,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"空間壓力控制（正壓／負壓）","year":111,"no":8,"art":"3-3 室內空氣品質與機械通風","q":"下列那些空間須維持正壓？①廁所 ②手術室 ③半導體晶圓廠之無塵室","opts":{"A":"①②","B":"①③","C":"②③","D":"①②③"},"ans":"C","note":"答案 C。正壓空間室內壓力高於鄰室，使空氣只向外流出，避免外部污染物侵入：手術室（防止感染）、半導體無塵室（防止微粒污染製程）皆須正壓。廁所屬臭氣、污染源空間，須維持負壓（排氣量大於送氣量），防止臭氣擴散至鄰室，故①不選。同理廚房、傳染病隔離病房亦採負壓。"},{"c":258,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"空氣污染物標準指標 PSI","year":111,"no":37,"art":"3-3 室內空氣品質與機械通風","q":"有關空氣污染物標準指標（pollutant standards index, PSI），下列敘述何者錯誤？","opts":{"A":"PSI 值是根據各空氣污染物濃度，換算出該污染物之空氣污染副指標（subindex）","B":"以各評估項目副指標之最大值作為空氣污染物標準指標，以 PSI 值（0~500）表示之","C":"指標值在 100 以下者，表示當地空氣品質符合環境空氣品質中的短期標準","D":"目前列為 PSI 的評估項目，其中有：懸浮微粒（PM₁₀），二氧化碳（CO₂）等項"},"ans":"D","note":"答案 D（錯誤）。PSI 之評估項目為懸浮微粒（PM₁₀）、二氧化硫（SO₂）、一氧化碳（CO）、臭氧（O₃）及二氧化氮（NO₂）五項，不含二氧化碳（CO₂，非環境空氣污染物指標項目）。A：各污染物濃度分別換算為副指標 ✓；B：取最大副指標為 PSI，範圍 0～500 ✓；C：PSI ≤ 100 表示符合空氣品質標準 ✓。（環保署已於民國 105年底改以空氣品質指標 AQI 取代 PSI，題目為考試當時之敘述。）課程教材：PSI 指標為室外環境用，介於 0～500，100 以上為不良（支持 B、C）。【查證限制】PSI 評估項目清單（D 項）本機法規及課程教材無原文，依環保署公告之通用資料。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.30"},{"c":259,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"COVID-19 隔離病房換氣方式","year":112,"no":2,"art":"3-3 室內空氣品質與機械通風","q":"下列何種換氣方式適合新冠肺炎（COVID-19）病人的隔離病房？","opts":{"A":"自然排氣，機械給氣","B":"機械排氣，機械給氣（給排氣風量相同）","C":"自然排氣，自然給氣","D":"機械排氣，自然給氣"},"ans":"D","note":"答案 D。經空氣或飛沫氣溶膠傳染的隔離病房須維持「負壓」：空氣由走廊等清潔區流向病房，污染空氣不外洩，並經處理（如高效率過濾）後排出。建築技術規則建築設備編第 101 條列機械通風三種系統：機械送風及機械排風、機械送風及自然排風、自然送風及機械排風；其中「機械排氣、自然給氣」（D）由排風機確定排氣量，給氣由門縫或補氣口自然流入，室內必為負壓，故選 D。A 機械給氣、自然排氣使室內正壓，污染外洩；B 給排氣量相同，室內近於中性壓，無法保證負壓（實務上負壓病房也可用機械給排氣，但排氣量須大於給氣量）；C 全自然通風受風向、溫差影響，氣流方向無法控制。【查證限制】負壓隔離病房設計細節依感染管制實務，本機無原文。 【依據】建築技術規則建築設備編第 101 條（機械通風系統）；負壓隔離通風原則依感染管制實務（本機無原文）"},{"c":260,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"室內空氣污染物來源","year":112,"no":7,"art":"3-3 室內空氣品質與機械通風","q":"有關室內空氣污染物產生之來源，下列敘述何者錯誤？","opts":{"A":"瓦斯爐等設備燃燒主要產生一氧化碳及二氧化碳","B":"油漆及塗料主要產生甲醛等揮發性有機物","C":"抽煙主要產生一氧化碳、二氧化碳以及室內懸浮微粒","D":"辦公室事務機主要產生生物氣膠"},"ans":"D","note":"答案 D（錯誤）。辦公室事務機（影印機、雷射印表機）運作時主要產生臭氧、揮發性有機物及碳粉微粒，並非生物氣膠；生物氣膠（細菌、真菌、病毒、花粉等）主要來自人體、潮濕發霉處、空調水盤與冷卻水塔等。A瓦斯爐燃燒（不完全燃燒）產生 CO、CO₂（並有 NO₂）；B 油漆塗料揮發甲醛、苯、甲苯等 VOC；C 抽煙產生CO、CO₂ 與懸浮微粒，均正確。 【依據】室內空氣品質標準所列污染物項目（CO、CO₂、甲醛、TVOC、細菌、真菌、PM10、PM2.5、O₃）及一般室內空氣品質教材"},{"c":261,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"室內空氣品質標準","year":112,"no":16,"art":"3-3 室內空氣品質與機械通風","q":"依據我國室內空氣品質標準，下列敘述何者錯誤？","opts":{"A":"二氧化碳的標準為 1000 ppm（8 小時平均）","B":"一氧化碳的標準為 9 ppm（8 小時平均）","C":"甲醛的標準為 0.08 ppm（1 小時平均）","D":"PM2.5 的標準為 75 μg/m³（24 小時平均）"},"ans":"D","note":"答案 D（錯誤）。室內空氣品質標準第 2 條表列：CO₂ 八小時值 1000 ppm（A 正確）；CO 八小時值 9 ppm（B 正確）；甲醛 一小時值 0.08 ppm（C 正確）；PM2.5（粒徑 ≦2.5 μm）二十四小時值為 35 μg/m³，而 75 μg/m³為 PM10（粒徑 ≦10 μm）之二十四小時值，故 D 把 PM10 的數值張冠李戴，錯誤。其他：TVOC 一小時值 0.56ppm、細菌 1500 CFU/m³、真菌 1000 CFU/m³、臭氧八小時值 0.06 ppm。 【依據】室內空氣品質標準第 2 條（本機原文）"},{"c":262,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"空調空間之正負壓規劃","year":112,"no":20,"art":"3-3 室內空氣品質與機械通風","q":"關於安裝機械式空調之空間，與其相鄰空間正負壓的規劃，下列敘述何者正確？","opts":{"A":"手術室應為正壓空間","B":"傳染病病房應為正壓空間","C":"急救室候診區應為正壓空間","D":"病理實驗室應為正壓空間"},"ans":"A","note":"答案 A。手術室需維持高度潔淨，防止鄰近較髒之空氣侵入，須為正壓（空氣由手術室向外流出）。B 傳染病病房、D 病理實驗室屬污染、感染源空間，須為負壓，避免污染空氣外洩至走廊等鄰近空間；C 急救室候診區人員聚集、可能有尚未篩檢之感染者，醫療通風實務上多設為相對負壓，不應為正壓，以免污染空氣流向急救室或其他淨區。原則：潔淨度要求高之空間設正壓，污染源空間設負壓。【查證限制】醫院各空間壓力規劃依醫療設施通風設計實務，本機無原文。 【依據】醫院空調設計實務（空間正負壓，本機無原文）"},{"c":263,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"換氣次數與排風量單位","year":113,"no":6,"art":"3-3 室內空氣品質與機械通風","q":"某空間室內高度 2.5 m、面積 200 m²，為了達到良好的室內空氣品質，提出每小時需達換氣次數 3 次的要求，需裝設下列那一種規格的排風扇最接近需求？","opts":{"A":"25 [CMS]","B":"25 [L/min]","C":"25 [CMM]","D":"25 [L/s]"},"ans":"C","note":"答案 C。空間體積 V = 2.5 × 200 = 500 m³；每小時 3 次，需風量 = 500 × 3 = 1500 m³/h = 1500 ÷ 60 = 25 m³/min= 25 CMM（Cubic Meter per Minute）。驗算：25 CMM × 60 = 1500 m³/h，÷500 = 3 次/h ✓。其他單位：CMS（m³/s）25
