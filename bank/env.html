用左手者或上肢受限者不便，不符公平使用與彈性使用原則。A 撥桿式手把省力、手部無力者也可操作；B 無門檻避免絆倒並利輪椅、推車通行；C 浴室扶手協助起身、防滑倒，皆屬通用設計。 【依據】通用設計七原則（The Principles of UniversalDesign, Center for Universal Design, NC State University, 1997）；本機課程教材無通用設計專章"},{"c":509,"law":"無障礙環境與其他","g":"無障礙環境與其他","h1":"第 7 篇　無障礙環境與其他","h2":"7-1 無障礙設施設計","h3":"無障礙昇降機設置","year":109,"no":29,"art":"7-1 無障礙設施設計","q":"有關無障礙垂直通路使用之昇降機，下列設置要求何者錯誤？","opts":{"A":"昇降機出入口之樓地板應無高差，且坡度不得大於 1/50","B":"昇降機出入口應留設不得小於直徑 1.2 公尺之淨空間","C":"關門時間：梯廳昇降機到達門開啟至關閉之時間，不應少於 10 秒鐘","D":"機廂尺寸：昇降機門的淨寬度不得小於 90 公分，機廂之深度不得小於 135 公分"},"ans":"B","note":"答案 B。109 年考試適用內政部 108 年 1 月 4 日修正、108 年 7 月 1 日生效之建築物無障礙設施設計規範（即本機現行版）。404.1：昇降機出入口之樓地板應無高差，並留設直徑 150 公分以上且坡度不得大於 1/50 之淨空間；(B) 之 1.2 公尺應為 1.5 公尺，錯誤（101 年舊版 404.1 亦為 1.5 公尺）。(A) 符合 404.1。(D) 符合 406.1：昇降機門淨寬度不得小於 90 公分，機廂深度不得小於 135 公分（H-2 組住宅、集合住宅為 80 公分及 125 公分）。(C)108 年版 405.2：昇降機開門時，昇降機門應維持完全開啟狀態至少 10 秒鐘；選項之 10 秒與考試當時規定相符，為正確敘述。注意版本：選項文字沿用 101 年舊版 405.2「梯廳昇降機到達時，門開啟至關閉之時間不應少於 5 秒鐘」之句構，但數值已改為新版之 10 秒；若誤用舊版的 5 秒，會把 (C) 誤判為錯誤。 【依據】建築物無障礙設施設計規範（108 年 7 月 1 日生效版）404.1、405.2、406.1；101 年舊版 404.1、405.2（對照）"},{"c":510,"law":"無障礙環境與其他","g":"無障礙環境與其他","h1":"第 7 篇　無障礙環境與其他","h2":"7-1 無障礙設施設計","h3":"無障礙浴室","year":111,"no":39,"art":"7-1 無障礙設施設計","q":"依據建築物無障礙設施設計規範，有關無障礙浴室之敘述，下列何者錯誤？","opts":{"A":"浴室之地面應堅硬、平整、防滑","B":"由無障礙通路進入浴室不得有高差，止水宜採用截水溝","C":"浴室內應於距地板面 45 公分範圍內設置一處可供跌倒後使用之求助鈴","D":"浴缸內側長度不得大於 135 公分"},"ans":"C","note":"答案 C（錯誤）。規範 605.5.1（浴缸）：求助鈴 1 處設於浴缸以外之牆上，按鍵中心點距地板面 90～120 公分，並連接拉桿至距地板面 15～25 公分範圍內供跌倒時使用；606.6.1（淋浴間）：1 處按鍵中心點距地板面 90～120 公分，另 1 處按鍵中心點距地板面 15～25 公分供跌倒時使用。跌倒用求助設施高度為 15～25 公分，不是 45 公分（舊版 101 年規範 602.4 為 35 公分範圍內，亦非 45）。A：602.2 地面應堅硬、平整、防滑 ✓。B：602.3 由無障礙通路進入浴室不得有高差，止水得採用截水溝（舊版為「宜」）✓。D：605.3 浴缸內側長度不得大於 135 公分 ✓（舊版 603.3 為 140 公分）。 【依據】建築物無障礙設施設計規範 602.2、602.3、605.3、605.5.1、606.6.1；101年舊版 602.4、603.3"},{"c":511,"law":"無障礙環境與其他","g":"無障礙環境與其他","h1":"第 7 篇　無障礙環境與其他","h2":"7-1 無障礙設施設計","h3":"無障礙廁所盥洗室","year":112,"no":4,"art":"7-1 無障礙設施設計","q":"有關無障礙廁所盥洗室之說明，下列何者錯誤？","opts":{"A":"由無障礙通路進入廁所盥洗室不得有高差，止水宜採用截水溝","B":"廁所盥洗室空間內應設置迴轉空間，其直徑不得小於 120 公分","C":"廁所盥洗室空間應採用橫向拉門，出入口之淨寬不得小於 80 公分","D":"廁所盥洗室應設於無障礙通路可到達之處"},"ans":"B","note":"答案 B（錯誤）。建築物無障礙設施設計規範 504.1：無障礙廁所盥洗室應設置直徑 150 公分以上之迴轉空間，並非 120 公分（101 年舊版 504.1 亦為 150 公分）。A 為 502.3（不得有高差，止水「得」採用截水溝；選項「宜」為 101 年舊版用語，意旨相同，仍屬正確）；C 為 504.2（採橫向拉門，出入口淨寬不得小於 80 公分）；D為 502.1（應設於無障礙通路可到達之處）。 【依據】建築物無障礙設施設計規範 502.1、502.3、504.1、504.2"},{"c":512,"law":"無障礙環境與其他","g":"無障礙環境與其他","h1":"第 7 篇　無障礙環境與其他","h2":"7-1 無障礙設施設計","h3":"昇降機出入口水平間隙","year":113,"no":1,"art":"7-1 無障礙設施設計","q":"依據建築物無障礙設施設計規範第四章昇降設備之規定，昇降機出入口處之樓地板面，應與機廂地板面保持平整，其與機廂地板面之水平間隙最小不得大於多少公分？","opts":{"A":"3.2","B":"4.2","C":"4.7","D":"5.2"},"ans":"A","note":"答案 A。無障礙設施設計規範第 405.3 款「昇降機出入口」：昇降機出入口處之地板面，應與機廂地板面保持平整，其與機廂地板面之水平間隙不得大於 3.2 公分。故水平間隙上限為 3.2 公分，B、C、D 均超過規定。（另如同規範 405.2 規定開門時門應維持完全開啟至少 10 秒。） 【依據】建築物無障礙設施設計規範第 405.3 款（第四章昇降設備）"},{"c":513,"law":"無障礙環境與其他","g":"無障礙環境與其他","h1":"第 7 篇　無障礙環境與其他","h2":"7-1 無障礙設施設計","h3":"無障礙廁所馬桶與扶手","year":113,"no":2,"art":"7-1 無障礙設施設計","q":"依據建築物無障礙設施設計規範，有關無障礙廁所盥洗室之馬桶與扶手，下列敘述何者錯誤？","opts":{"A":"馬桶至少有一側邊之淨空間不得小於 70 公分","B":"扶手如設於側牆時，馬桶中心線距側牆之距離不得大於 60 公分","C":"馬桶不可有蓋，且應設置靠背","D":"馬桶側面牆壁裝置扶手時，應設置 I 型扶手"},"ans":"D","note":"答案 D（錯誤）。規範第 505.5 款：馬桶側面牆壁裝置扶手時，應設置 L 型扶手（扶手水平與垂直長度皆不得小於 70 公分），並非 I 型。A、B 為第 505.2 款原文（一側淨空間不得小於 70 公分；扶手設於側牆時，馬桶中心線距側牆不得大於 60 公分）；C 為第 505.3 款（馬桶不可有蓋，且應設置背靠）。 【依據】建築物無障礙設施設計規範第 505.2、505.3、505.5 款"},{"c":514,"law":"無障礙環境與其他","g":"無障礙環境與其他","h1":"第 7 篇　無障礙環境與其他","h2":"7-1 無障礙設施設計","h3":"無障礙電梯機廂","year":113,"no":28,"art":"7-1 無障礙設施設計","q":"有關新建建築物的電梯機廂無障礙設計，下列敘述何者錯誤？","opts":{"A":"電梯門出入口應無高差，電梯間應留設 1.2 m 以上之輪椅迴旋空間","B":"門開啟應延長時間，便於身障者出入，不應少於 10 秒鐘","C":"機廂門的淨寬度不得小於 90 cm，機廂之深度不得小於 135 cm","D":"機廂內應設置語音系統以播報樓層數、行進方向及開關情形"},"ans":"A","note":"答案 A（錯誤）。規範第 404.1 款（迴轉空間）：昇降機出入口之樓地板應無高差，並留設直徑 150 公分以上且坡度不得大於 1/50 之淨空間，不是 1.2 m。B：第 405.2 款，開門時門應維持完全開啟至少 10 秒鐘 ✓。C：第406.1 款，昇降機門淨寬不得小於 90 公分，機廂深度不得小於 135 公分（H-2 住宅、集合住宅為 80、125 公分之例外）✓。D：第 406.7 款，機廂內應設置語音系統報知樓層、行進方向及開關情形 ✓。 【依據】建築物無障礙設施設計規範第 404.1、405.2、406.1、406.7 款"},{"c":515,"law":"無障礙環境與其他","g":"無障礙環境與其他","h1":"第 7 篇　無障礙環境與其他","h2":"7-1 無障礙設施設計","h3":"通用設計原則","year":113,"no":39,"art":"7-1 無障礙設施設計","q":"下列敘述何者不屬於通用設計（universal design）原則之設計？","opts":{"A":"室內外空間確保充足照明","B":"所有通道及走道均採防滑材質","C":"電源插座開關有適當的高度","D":"全面使用節水型衛生器具"},"ans":"D","note":"答案 D。通用設計七大原則：公平使用、彈性使用、簡易直覺、可感知資訊、容錯、省力、尺寸與空間合宜。A（充足照明，利於資訊感知與安全）、B（防滑，容錯、安全）、C（插座開關適當高度，使不同身高與輪椅使用者皆可觸及，尺寸與空間合宜）皆符合通用設計。D 節水型衛生器具屬環保節水設計，與使用者的可及性、公平使用無關，不屬於通用設計原則。 【依據】通用設計七原則（The Principles of Universal Design, Center forUniversal Design, NC State University, 1997）；本機課程教材無通用設計專章"},{"c":516,"law":"無障礙環境與其他","g":"無障礙環境與其他","h1":"第 7 篇　無障礙環境與其他","h2":"7-1 無障礙設施設計","h3":"無障礙昇降機","year":114,"no":40,"art":"7-1 無障礙設施設計","q":"依據建築物無障礙設施設計規範，有關無障礙昇降機之敘述，下列何者錯誤？","opts":{"A":"梯廳昇降機到達時，門開啟至關閉之時間不應少於 10 秒鐘","B":"無障礙昇降機與群管理控制下之一般昇降機之呼叫按鈕必須分別設置","C":"相鄰兩座無障礙昇降機不得為群管理控制","D":"機廂內應設置語音及點字系統"},"ans":"C","note":"答案 C（錯誤）。建築物無障礙設施設計規範第 402 款：無障礙昇降機與群管理控制下之一般昇降機之呼叫按鈕必須分別設置（B 正確），並「得」以相鄰兩座無障礙昇降機為群管理控制，故 C「不得」錯誤。A 正確：第405.2 款，昇降機開門時，昇降機門應維持完全開啟狀態至少 10 秒鐘。D 正確：第 406.6 款，操作盤按鈕左側應設點字標示；第 406.7 款，機廂內應設置語音系統以報知樓層、行進方向及開關情形。 【依據】建築物無障礙設施設計規範第 402、405.2、406.6、406.7 款"},{"c":517,"law":"無障礙環境與其他","g":"無障礙環境與其他","h1":"第 7 篇　無障礙環境與其他","h2":"7-2 其他與綜合","h3":"臭氧層破壞","year":107,"no":35,"art":"7-2 其他與綜合","q":"有關臭氧層的破壞，下列敘述何者錯誤？","opts":{"A":"大氣層臭氧的含量非常少，但卻集中在成層圈的下層，因此被稱為臭氧層","B":"臭氧由三個氧原子結合而成，可吸收太陽輻射中有害於生物的紅外線，降低地面的紅外線照射量","C":"研究指出臭氧層破壞的原因，是排放於大氣中的氟氯碳化物及鹵素氣體","D":"一旦臭氧濃度減少，平流層溫度失衡，隨之而來的氣候變化會影響地球生態環境"},"ans":"A 或 B 均給分（更正前公告答案 B）","note":"（B）錯誤最明確，（A）經更正亦給分。（B）臭氧（O3）吸收的是太陽輻射中的紫外線（主要為 UV-B、UV-C），而非紅外線，明顯錯誤。（C）課程教材亦指氟氯碳化物嚴重破壞臭氧層、1987 年蒙特婁議定書後禁用；\nCFCs 與海龍等含鹵素氣體在平流層光解釋出氯、溴原子，連鎖分解臭氧，正確。（D）臭氧吸收紫外線使平流層增溫，濃度減少會影響其溫度與氣候，正確。【查證限制／爭議】考選部未公布更正理由，以下為推測：「成層圈」即平流層，臭氧集中於平流層約 15～35 km（濃度峰值約 20～25 km），屬平流層中、下部，「集中在下層」之描述不夠精確，故（A）亦被認定可能為錯誤敘述而一併給分。 【依據】課程教材：23 S ET 01 暖化與減碳 p.5"},{"c":518,"law":"無障礙環境與其他","g":"無障礙環境與其他","h1":"第 7 篇　無障礙環境與其他","h2":"7-2 其他與綜合","h3":"設備壽命與生命週期成本","year":108,"no":40,"art":"7-2 其他與綜合","q":"有關建築設備之壽命及維護，下列敘述何者錯誤？","opts":{"A":"設備初期費用指機器設備的建造費用","B":"LCC 是指設備使用維護之費用","C":"設備使用年限愈久，年平均維護費越高","D":"設備的生命週期有時代劣化"},"ans":"B","note":"答案 B（錯誤）。課程教材：LCC（Life Cycle Cost）是設備生命週期的總費用成本，包括取得費（建造費用）與維護費（修理、保養、運轉、管理等），是比較設備系統經濟性的重要指標；即從購置建造、使用期間運轉維護到廢棄的「全生命週期總費用」，不只是使用維護費。A：初期費用指設備購置與建造安裝費，正確；C：設備老化後故障、修繕頻率提高，年平均維護費增加，正確；D：設備壽命除物理劣化外，還有因技術進步、需求改變而被淘汰的社會性（時代、機能）劣化，正確。 【依據】課程教材：01.建築設備總論（設備與居住環境） p.25、p.27"},{"c":519,"law":"無障礙環境與其他","g":"無障礙環境與其他","h1":"第 7 篇　無障礙環境與其他","h2":"7-2 其他與綜合","h3":"小學教室設計","year":109,"no":40,"art":"7-2 其他與綜合","q":"某小學教室設計之考量，下列敘述何者錯誤？","opts":{"A":"教室照明迴路應以平行窗戶點滅為原則","B":"教室前方講台牆面應以反射材裝修以防止回音","C":"桌面照度不得低於 500 lux","D":"窗簾不阻擋氣窗，以利通風採光"},"ans":"B","note":"答案 B。教室照明迴路平行窗戶分組，使靠窗區可依晝光關燈節能（A 正確）；窗簾宜不遮住氣窗，以保留通風採光（D 正確）；課程教材之照度分級中，辦公、教室、會議屬中難度作業，照度 300～600 lx，故以 500 lux為教室桌面設計值在此範圍內（C）。(B) 教材於室內聲學指出：講堂、劇場等強調清晰度之場所常在廳堂「後方牆面」配置吸音材（absorption on the rear wall），教室亦強調清晰度（餘響時間可低至 0.5 秒）；回音要靠吸音與擴散處理，而非以反射材防止，故 (B)「以反射材裝修以防止回音」錯誤。補充：前方講台牆面作反射面，是為了加強講者聲音的早期反射、提高後排音量；防止回音則靠後牆吸音或擴散處理。(B) 錯在把反射材當成「防止回音」的手段。【查證限制】(C) 之 500 lux 依 CNS 照度標準與教育部設備基準之版本而定，本機無原文。 【依據】課程教材：23 S ET 06 採光照明基礎 0422.pdf p.21；23 S ET 10 室內聲學 230512.pdf p.10、p.27"},{"c":520,"law":"無障礙環境與其他","g":"無障礙環境與其他","h1":"第 7 篇　無障礙環境與其他","h2":"7-2 其他與綜合","h3":"韌性（resilience）","year":111,"no":35,"art":"7-2 其他與綜合","q":"聯合國氣候峰會 IPCC 於 2015 年簽署巴黎協議，其所強調的韌性（resilience）是指什麼意涵？","opts":{"A":"遭遇災害後的復原能力","B":"以人為干預的方式，減少溫室氣體的排放","C":"某個系統受氣候變遷負面影響及無法因應的程度","D":"為了因應氣候衝擊，而在自然或人類系統所做的調整"},"ans":"A","note":"答案 A。韌性（resilience）指社會、經濟與環境系統面對危害事件或擾動時，能承受、因應並在回應中維持其基本功能與結構、並加以恢復的能力，即「遭遇災害後的復原能力」。B 為減緩（mitigation）；C 為脆弱度（vulnerability）；D 為調適（adaptation）。（巴黎協定係 2015 年聯合國氣候變化綱要公約第 21 次締約方會議通過，並非 IPCC 簽署，題幹用語不精確，但不影響作答。）【查證限制】本題依據聯合國氣候變遷相關名詞定義，本機無原文，依通用資料。 【依據】IPCC 第五次評估報告（AR5）詞彙表之 resilience、mitigation、vulnerability、adaptation 定義；巴黎協定為 UNFCCC COP21（2015）通過；本機無原文申論題（依篇章歸類，32 題）申論題依題目主題與內文關鍵字自動歸入各章，歸類僅供參考；同章內依年度、題號排序。"}];
const LAWS = ["氣候與熱環境", "光環境", "空氣環境", "聲環境", "建築設備", "綠建築與建築節約能源", "無障礙環境與其他"];
const COMMON = new Set(LAWS);
const SETS = { all: new Set(LAWS) };
const BANKNAME = { all: "全部篇" };
const CORE = () => SETS.all;
const EXAM_N = 40, PASS_N = 24, PTS = 2.5;
const fw = s => String(s).replace(/[Ａ-Ｄ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
DATA.forEach((q, i) => {
  q.id = q.year + "-" + q.no;

  q.chap = q.h2 || "";
  q.sub = q.h3 || "";
});
const GROUPS = (() => { const extra = [...new Set(DATA.map(q => q.g))].filter(g => !LAWS.includes(g)); return LAWS.filter(l => DATA.some(q => q.g === l)).concat(extra); })();
let bank = "all";

const KEY = "envquiz-v1", HKEY = "envquiz-hist-v1";

try { rec = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { rec = {}; }
try { hist = JSON.parse(localStorage.getItem(HKEY) || "[]") || []; } catch (e) { hist = []; }
const SKEY = "envquiz-star-v1";

try { stars = new Set(JSON.parse(localStorage.getItem(SKEY) || "[]") || []); } catch (e) { stars = new Set(); }

  const q = S && S.list[S.i]; if (!q) return;

  const b = $("star"); if (b) { const on = stars.has(q.id); b.setAttribute("aria-pressed", String(on)); b.textContent = on ? "★ 已標記" : "☆ 標記"; }
}
const saveHist = () => { try { localStorage.setItem(HKEY, JSON.stringify(hist)); } catch (e) {} };
const BYID = new Map(DATA.map(q => [q.id, q]));
function addHist() {
  const answered = S.list.filter(q => S.picks[q.id] != null).length; if (!answered && mode !== "exam") return;
  const ok = S.list.filter(q => S.picks[q.id] != null && q.accept.includes(S.picks[q.id])).length;
  const lawSel = $("law").value;
  hist.unshift({ t: Date.now(), mode, scope: lawSel || BANKNAME[bank] + "混合", n: S.list.length, answered, ok, ids: S.list.map(q => q.id), picks: S.picks });
  if (hist.length > 200) hist.length = 200;
  saveHist();
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch (e) {} };
function mark(q, ok) { const r = rec[q.id] || { n: 0, ok: 0, last: null }; if (r.first == null) r.first = ok; r.n++; if (ok) r.ok++; r.last = ok; rec[q.id] = r; save(); stats(); }
function stats() {
  const v = Object.values(rec); const n = v.reduce((a, r) => a + r.n, 0); const ok = v.reduce((a, r) => a + r.ok, 0);
  $("s-done").textContent = v.length; $("s-rate").textContent = n ? Math.round(ok / n * 100) + "%" : "–";
  $("s-wrong").textContent = v.filter(r => r.last === false).length;
}
const $ = id => document.getElementById(id);

function fillSelect(el, items, keep) {

  if (items.some(([v]) => v === prev)) el.value = prev;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fillLaws() {

  $("total").textContent = bp.length;
}

    <div class="meta"><span class="tag law">新一年考題會差多少</span><span class="tag">依 ${YEARS[0]}–${YEARS[YEARS.length - 1]} 年 ${YEARS.length} 屆</span></div>
    <p><b>出題組成</b>：每一屆和其他年度的平均相比，約有 <b>${Math.min(...COMPO.shift).toFixed(0)}–${Math.max(...COMPO.shift).toFixed(0)} 題</b>（平均 ${(COMPO.shift.reduce((a, b) => a + b, 0) / COMPO.shift.length).toFixed(0)} 題，約全卷 ${Math.round(COMPO.shift.reduce((a, b) => a + b, 0) / COMPO.shift.length / EXAM_N * 100)}%）換到不同篇。各篇每年題數的起伏大致等於隨機抽題的程度，但有明顯的<b>長期趨勢</b>（下表 ↑↓），所以預測改用近年加權比例（半衰期 ${HALF} 年），不再用 ${YEARS.length} 年平均。</p>
    <p><b>難度</b>：${tauFrom === "data" ? `從你在 ${yrs.length} 個年度（每年至少 8 題）的表現估計，扣掉篇組成的影響後，年度之間的答對率落差約 <b>±${Math.round(tau * 100)} 個百分點</b>（約 ±${(tau * EXAM_N * PTS).toFixed(1)} 分）${tau < 0.01 ? "，看不出超過抽樣誤差的年度難度差異" : ""}。` : `你作答過的年度還不夠（需要至少 3 個年度、每年 8 題以上），暫以 <b>±5 個百分點</b>（約 ±5 分）估計年度難度起伏。`}這個起伏已放進上面的分數分布。</p>
    <table class="tbl"><thead><tr><th>篇</th><th>歷年題數</th><th>${YEARS.length} 年平均</th><th>新一年預估</th><th>80% 範圍</th><th>趨勢</th></tr></thead><tbody>${GROUPS.map(g => ({ g, ...COMPO.per[g] })).sort((a, b) => b.rec - a.rec).filter(r => r.avg >= 1 || r.rec * EXAM_N >= 1).map(r => `<tr><td>${esc(r.g)}</td><td class="num" style="font-size:12px;color:var(--muted)">${r.c.join(" ")}</td><td class="num">${r.avg.toFixed(1)}</td><td class="num"><b>${(r.rec * EXAM_N).toFixed(1)}</b></td><td class="num">${binomQ(EXAM_N, r.rec, 0.1)}–${binomQ(EXAM_N, r.rec, 0.9)}</td><td>${r.slope * 5 >= 1.5 ? `<span style="color:var(--ok)">↑ 增加</span>` : r.slope * 5 <= -1.5 ? `<span style="color:var(--bad)">↓ 減少</span>` : "—"}</td></tr>`).join("")}</tbody></table>
    <p class="hint" style="margin-top:8px">「歷年題數」依序為 ${YEARS[0]}–${YEARS[YEARS.length - 1]} 年；平均每年不到 1 題的少量篇未列出（合計仍計入預測）。趨勢＝依線性回歸，5 年內增減 1.5 題以上。80% 範圍＝新一年題數有八成機率落在這個區間。</p>
  </div>
  <div class="card" style="overflow-x:auto">
    <div class="meta"><span class="tag law">新一年考題內容會差多少</span><span class="tag">依章節與題目文字比對</span></div>
    <p><b>考過的章節還會再考</b>：近 5 屆，每屆約 <b>${Math.round(CT.repLo * 100)}–${Math.round(CT.repHi * 100)}%</b> 的題目考的是以前出過的章節（平均 ${Math.round(CT.repRate * 100)}%）${CT.rows[CT.rows.length - 1].rate - CT.rows[0].rate > 0.1 ? "，而且比例逐年上升" : ""}。換算新一年約 <b>${Math.round(CT.repRate * 80)} 題</b>考舊章節、約 <b>${80 - Math.round(CT.repRate * 80)} 題</b>來自較少重複的章節，仍須把各章觀念補齊。</p>
    <p><b>幾乎是舊題改寫</b>：每屆約 <b>${CT.nearLo}–${CT.nearHi} 題</b>的題幹和選項跟以前某一題高度相似（同法規、文字重疊一半以上），多半是同一條文換個問法或換個錯誤選項。</p>
    ${hotN ? `<p><b>你在高頻章節題的表現</b>：第一次作答 ${hotN} 題、答對 ${Math.round(hotK / hotN * 100)}%${otherN ? `；其他題目答對 ${Math.round(otherK / otherN * 100)}%` : ""}。</p>` : ""}
    <table class="tbl"><thead><tr><th>年度</th><th>題數</th><th>考舊章節</th><th>比例</th><th>舊題改寫</th></tr></thead><tbody>${CT.rows.map(r => `<tr><td class="num">${r.y}</td><td class="num">${r.known}</td><td class="num">${r.rep}</td><td class="num">${Math.round(r.rate * 100)}%</td><td class="num">${r.near}</td></tr>`).join("")}</tbody></table>
    <p class="hint" style="margin-top:8px">「考舊章節」＝該題條號在更早的年度出現過（102–104 年當作起始資料，不列）；條號取自解析的標註，沒有標註的題目不計。</p>
    <div class="meta" style="margin-top:14px"><span class="tag law">高頻章節</span><span class="tag">歷屆中考過 4 屆以上：${CT.hot.length} 條、${CT.hotIds.size} 題</span></div>
    <table class="tbl"><thead><tr><th>篇</th><th>條文</th><th>考過幾屆</th><th>年度</th></tr></thead><tbody>${CT.hot.slice(0, 20).map(h => `<tr><td>${esc(h.law)}</td><td>${esc(h.no)}</td><td class="num"><b>${h.years.length}</b></td><td class="num" style="font-size:12px;color:var(--muted)">${h.years.join(" ")}</td></tr>`).join("")}</tbody></table>
    <div class="row-btns"><button class="btn" id="hotPrac">練習高頻章節的 ${CT.hotIds.size} 題</button></div>
    <p class="hint" style="margin-top:8px">表中只列前 20 條；按鈕會用練習模式出全部 ${CT.hot.length} 條高頻章節的題目（每題作答後立即顯示解析）。</p>
  </div>
  <div class="card">
    <div class="meta"><span class="tag law">方法說明</span></div>
    <ol class="note" style="white-space:normal;padding-left:20px;margin:0">
      ${sess ? `<li><b>只用本次考試</b>：這個預測只採計這一次模擬考作答的 ${totN} 題（未作答不計），不混入其他練習紀錄。單次考試題數少，各篇的估計誤差會比較大，區間也會比較寬。</li>` : `<li><b>只用第一次作答</b>：同一題重複作答會因為記得答案而高估實力，所以每題只採計第一次的對錯。</li>`}
      <li><b>貝氏 Beta–二項模型</b>：每個篇的掌握度 p 以 Beta 分布描述。先驗以你的整體答對率 ${Math.round(m * 100)}% 為中心（不低於猜題機率 25%），強度相當於 ${KAPPA} 題，再加上該篇的作答結果得到後驗。練得少的篇會向整體水準收縮，避免答 1 題對 1 題就被估成 100%。</li>
      <li><b>沒練過的篇怎麼算</b>：目前題庫涵蓋的${bank === "oth" ? "題庫篇 " + CORE().size + " 部" : "常用 " + CORE().size + " 部法規"}（約占出題 ${(strata.filter(s => CORE().has(s.g)).reduce((a, s) => a + s.w, 0) * 100).toFixed(0)}%）依你的作答結果、按出題比例推算；其餘篇若沒練過，以四選一的猜題期望值 25% 計（目前 ${strata.filter(s => s.guess).length} 部，占 ${(strata.filter(s => s.guess).reduce((a, s) => a + s.w, 0) * 100).toFixed(1)}%）。題庫內的篇若完全沒作答則以 0% 計（目前 ${strata.filter(s => s.fixed && !s.guess).length} 部）。</li>
      <li><b>篇之間的相關性</b>：每次模擬先抽一個「共同實力」（依你的整體答對率 ${totK}/${totN} 的不確定性），各篇的掌握度都以它為中心再加上該篇的作答結果，所以各篇會一起偏高或偏低，不再假設彼此獨立；這會讓分數區間比獨立假設時寬一些、也更誠實。</li>
      <li><b>年度難度</b>：每次模擬再抽一個當年難度 δ（標準差 ${Math.round(tau * 100)} 個百分點，${tauFrom === "data" ? "由你在各年度考題上的表現估計" : "作答年度不足時的預設值"}），同一份考卷的所有已練篇一起加減。</li>
      <li><b>出題組成</b>：正式考試測驗題 ${EXAM_N} 題依近年加權比例（${YEARS[0]}–${YEARS[YEARS.length - 1]} 年，半衰期 ${HALF} 年）以多項分配抽出；歷屆資料顯示各篇題數的年度起伏與多項分配相當，主要差異來自長期趨勢。</li>
      <li><b>模擬 ${SIMS.toLocaleString()} 次考試（蒙地卡羅法）</b>：電腦依你的掌握度「假裝考試」很多次，每次依比例出 ${EXAM_N} 題、逐題判定對錯，再統計這些模擬成績：平均即預測分數，有幾成落在及格線以上即及格機率。每題 ${PTS} 分，答對 ${PASS_N} 題（60 分）及格。</li>
      <li><b>限制</b>：歷屆題目會重複出現觀念，練習題與正式考題的難度未必相同；年度難度與共同實力的估計需要較多、跨年度的作答紀錄。練習題數越多、越分散在各篇，預測越可靠。</li>
    </ol>
  </div>`;
  bindBack(); window.scrollTo({ top: 0 });
  $("hotPrac").onclick = () => { setMode("prac"); S = { list: shuffle(DATA.filter(q => CT.hotIds.has(q.id))), i: 0, picks: {}, done: false }; render(); window.scrollTo({ top: 0 }); };
}
$("predict").onclick = () => predict();
$("history").onclick = showHist;
// ---------- 手機：作答時收起設定欄 ----------
function mInfo() { $("mInfo").textContent = BANKNAME[bank] + "・" + (MODE_NAME[mode] || "") + ($("law").value ? "・" + $("law").value : ""); }
new MutationObserver(() => {
  if (!S && $("main").querySelector("[data-welcome]")) return; // 還在首頁說明，不收起
  document.body.classList.add("m-run"); document.body.classList.remove("m-open"); $("mOpen").setAttribute("aria-expanded", "false"); mInfo();
}).observe($("main"), { childList: true });
$("mOpen").onclick = () => { const on = document.body.classList.toggle("m-open"); $("mOpen").setAttribute("aria-expanded", String(on)); $("mOpen").textContent = on ? "✕ 收起設定" : "☰ 題庫設定"; if (on) window.scrollTo({ top: 0 }); };
new MutationObserver(() => { if (!document.body.classList.contains("m-open")) $("mOpen").textContent = "☰ 題庫設定"; }).observe(document.body, { attributes: true, attributeFilter: ["class"] });
// ---------- 備份／還原（存成 .json 檔，換瀏覽器、換使用者也能帶著走） ----------
const BKEY = "envquiz-backup-t";
function backupMsg(extra) {
  let t = null; try { t = +localStorage.getItem(BKEY) || null; } catch (e) {}
  $("backupMsg").textContent = (extra ? extra + " " : "") + (t ? "上次備份：" + fmtT(t) : "還沒有備份過。");
}
function doBackup() {
  const data = { app: "環控題庫", ver: 1, t: Date.now(), rec, hist, stars: [...stars] };
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const name = `環控題庫_答題紀錄_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
  const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  try { localStorage.setItem(BKEY, String(data.t)); } catch (e) {}
  backupMsg(`已存成「${name}」（在 Chrome 的下載資料夾）。`);
}
function mergeBackup(data) {
  if (!data || data.app !== "環控題庫" || typeof data.rec !== "object") throw new Error("不是本題庫的備份檔");
  let nr = 0, nh = 0, ns = 0;
  for (const id in data.rec) { const a = rec[id], b = data.rec[id]; if (!BYID.has(id) || !b) continue; if (!a || (b.n || 0) > (a.n || 0)) { rec[id] = b; nr++; } }
  const have = new Set(hist.map(h => h.t));
  (data.hist || []).forEach(h => { if (h && h.t && !have.has(h.t)) { hist.push(h); have.add(h.t); nh++; } });
  hist.sort((x, y) => y.t - x.t); if (hist.length > 200) hist.length = 200;
  (data.stars || []).forEach(id => { if (BYID.has(id) && !stars.has(id)) { stars.add(id); ns++; } });
  save(); saveHist(); saveStars(); stats();
  return `已還原：題目紀錄 ${nr} 題、歷次紀錄 ${nh} 次、★ ${ns} 題（原有的紀錄都保留，同一題取作答次數較多的那份）。`;
}
$("backup").onclick = doBackup;
$("restoreBtn").onclick = () => $("restoreFile").click();
$("restoreFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => { try { backupMsg(mergeBackup(JSON.parse(fr.result))); } catch (err) { backupMsg("還原失敗：" + (err.message || err)); } e.target.value = ""; };
  fr.onerror = () => { backupMsg("還原失敗：讀不到檔案"); e.target.value = ""; };
  fr.readAsText(f);
};
backupMsg();
refreshFilters(); syncN(); stats(); render();
</script>
