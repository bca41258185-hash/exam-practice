= 90000 m³/h（太大）；25 L/min = 1.5 m³/h（太小）；25 L/s = 0.025 m³/s = 90 m³/h（太小）。"},{"c":264,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"PM10 與 PM2.5","year":113,"no":20,"art":"3-3 室內空氣品質與機械通風","q":"關於懸浮微粒（PM10）與細懸浮微粒（PM2.5）的敘述，下列何者錯誤？","opts":{"A":"環保署空氣品質指標 AQI 的項目中包含 PM2.5","B":"我國室內空氣品質標準中，PM10 的濃度較 PM2.5 來得低","C":"PM10 指的是粒徑小於 10 μg 的懸浮微粒","D":"PM2.5 的來源可能為交通污染、營建施工、露天燃燒等"},"ans":"B 或 C 均給分（更正前公告答案 B）","note":"原公告答案 B，更正後 B、C 均給分。B 錯：室內空氣品質標準第 2 條，二十四小時值 PM10 為 75 μg/m³、PM2.5 為 35 μg/m³，PM10 標準值較 PM2.5 高，不是較低。C 亦錯：同條表列 PM10 為「粒徑小於等於十微米（μm）之懸浮微粒」，μg 是質量單位，題目單位誤植。A（AQI 指標污染物含 PM2.5、PM10、O3、CO、SO2、NO2；依環境部空氣品質指標公告，本機無原文）、D（交通、營建施工、露天燃燒皆為來源）為正確。更正原因：考選部未公布更正理由，以下為推測——B、C 兩選項皆為錯誤敘述（C 單位誤植），題目有兩個錯誤選項，故 B、C 均給分。 【依據】室內空氣品質標準第 2 條"},{"c":265,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"防疫機械通風壓力","year":113,"no":38,"art":"3-3 室內空氣品質與機械通風","q":"關於各種空間因防疫需求採用機械通風系統時，下列何者錯誤？","opts":{"A":"新冠肺炎的社區採檢站內部應採用正壓","B":"新冠肺炎病患的隔離病房應採用負壓","C":"新冠肺炎病患隔離病房的前室應採用正壓","D":"新冠肺炎病患隔離病房內的衛浴空間應採用負壓"},"ans":"C","note":"答案 C（錯誤）。負壓隔離病房使氣流由走廊→前室→病房→衛浴流動，空氣由壓力較高處流向低處，故病房為負壓（B 對）、衛浴更負（D 對）；前室相對於病房為正壓、相對於走廊為負壓（中間壓力），作為氣流緩衝，不是對外之「正壓」，故 C 錯。社區採檢站內採檢人員於內，為保護人員並避免室外空氣中病原侵入，內部採正壓（A 對）。【查證限制】本題依感染管制與防疫空間設計實務，本機法規與課程教材均無對應內容，未能逐字核對；前室壓力之敘述依通用原則，以官方答案 C 為準。"},{"c":266,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"室內空氣污染物分類","year":114,"no":7,"art":"3-3 室內空氣品質與機械通風","q":"關於住宅室內空氣污染源的敘述，下列何者錯誤？","opts":{"A":"依污染物排放型態來看，可分成氣狀污染物質及浮游粒狀污染物質","B":"氣狀污染物質可分為無機性氣體與有機性氣體","C":"臭氧污染屬於無機性氣體污染物","D":"真菌釋放至空氣中的孢子屬於有機性氣體污染物"},"ans":"D","note":"答案 D（錯誤）。真菌孢子是懸浮於空氣中的微小顆粒，屬「浮游粒狀污染物（生物性氣膠）」，而非氣體；室內空氣品質標準第 2 條亦將細菌、真菌另以菌落數（CFU/m³）管制，與以 ppm 計的氣狀污染物不同。A 正確：依型態分為氣狀與粒狀（懸浮微粒 PM10、PM2.5 等）。B 正確：氣狀污染物可分無機性（CO、CO2、O3、NOx 等）與有機性（甲醛、TVOC 等）。C 正確：臭氧（O3）不含碳，屬無機性氣體。 【依據】室內空氣品質標準第 2 條；室內空氣污染（一般原理）"},{"c":267,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"室內污染源與健康影響","year":114,"no":8,"art":"3-3 室內空氣品質與機械通風","q":"關於室內空氣污染源及其對健康的影響，下列敘述何者錯誤？","opts":{"A":"辦公室事務機產生的空氣污染物主要為一氧化氮","B":"建材來源的空氣污染物主要為甲醛等揮發性有機物","C":"生物性污染物可能造成過敏、刺激呼吸道與傳染病","D":"石棉可能造成肺癌與矽肺病"},"ans":"A","note":"答案 A（錯誤）。影印機、雷射印表機等辦公事務機運作時（高壓放電、碳粉加熱）主要產生臭氧（O3），以及碳粉微粒與揮發性有機物，而非一氧化氮；一氧化氮主要來自燃燒（瓦斯爐、汽機車廢氣）。B 正確：合板、黏著劑、塗料等建材逸散甲醛與 VOCs。C 正確：真菌、細菌、塵蟎等生物性污染物可致過敏、氣喘、呼吸道刺激及傳染病。D 依官方視為正確：石棉纖維吸入可致肺癌、間皮瘤與石綿肺等肺部纖維化疾病（題目以「矽肺病」泛稱塵肺）。課程教材亦列建材與家具逸散之甲醛、石棉及黴菌等生物性過敏原為室內污染源。【爭議】矽肺病係吸入結晶型二氧化矽所致，石棉引起的是石綿肺（asbestosis），D 用語不精確，但官方以 A 為唯一錯誤選項。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.29；室內空氣污染源（一般原理）"},{"c":268,"law":"空氣環境","g":"空氣環境","h1":"第 3 篇　空氣環境","h2":"3-3 室內空氣品質與機械通風","h3":"校園室內空氣品質管理策略","year":114,"no":10,"art":"3-3 室內空氣品質與機械通風","q":"改善室內空氣品質的策略包括：①污染物源頭管理 ②通風換氣設計 ③空氣淨化設備使用 ④日常清潔維護。以校園室內空氣品質之維護管理為例，若將策略的重要性由大至小排序，下列何者正確？","opts":{"A":"①②③④","B":"②①④③","C":"③④②①","D":"④③②①"},"ans":"A","note":"答案 A。室內空氣品質管理的基本原則是「先源頭、再稀釋、後淨化」：①源頭管理（選用低逸散建材與家具、管制污染物進入、移除污染源）最根本有效；②通風換氣以外氣稀釋並排出室內污染物（如 CO2、甲醛）；\n③空氣淨化設備僅能處理部分污染物，屬輔助手段；④日常清潔維護（清掃、濾網清潔）為持續性的配套措施。\n故重要性依序為 ①②③④。C、D 將淨化設備與清潔置於源頭管理之前，違反源頭優先原則；B 將通風置於源頭管理之前亦不妥。綠建築評估手冊室內環境指標亦以「低逸散健康綠建材（源頭）」與「通風換氣（稀釋）」為主要評估項目。【查證限制】校園室內空氣品質維護管理相關指引本機無原文，排序依通用管理原則說明。 【依據】綠建築評估手冊－基本型（2023 年版）2-7 室內環境指標 p.99（PDF 第 105 頁）；室內空氣品質管理原則（一般原理）"},{"c":269,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"等響曲線","year":102,"no":21,"art":"4-1 聲學基礎與噪音","q":"有關等響曲線的敘述，下列何者錯誤？","opts":{"A":"行政院環境保護署將等響曲線用於制定環境噪音管制標準","B":"Phon 是依據 1000 Hz 純音通過之等響曲線的聲壓級來制定的","C":"低頻帶部分人耳對噪音聲壓級的反應較高頻來得遲鈍","D":"Sone 是依據 1000 Hz 純音 40 dB 為基準，以心理聲量大小之倍數來制定的"},"ans":"A","note":"答案為 A。\n環境噪音管制標準是以噪音計量測的「A 加權均能音量 dB(A)」（Leq）訂定：噪音管制標準第 2 條第 2 款規定，音量以分貝 dB(A)為單位，A 指噪音計上 A 權位置的測量值；第 6 款定義均能音量 Leq。A 加權特性只是參考 40 phon等響曲線，近似人耳感度的頻率加權網路，管制標準並不是直接用等響曲線制定，所以 A 的敘述不正確。\nB 正確：響度級 phon，是與它聽起來一樣響的 1000 Hz 純音的聲壓級。\nC 正確：人耳對低頻較不敏感，低頻需要較高的聲壓級才感覺一樣響。\nD 正確：響度 sone 以 1000 Hz、40 dB（40 phon）為 1 sone，聽覺上加倍響為 2 sone（約相當於增加 10 phon）。\n【依據】建築環境控制一般原理（響度級 phon、響度 sone、A 加權）；噪音管制標準第 2 條第 2、6 款（本機為102 年 8 月修正版）；課程教材：23 S ET 09 聲學基礎 p.9～10"},{"c":270,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"噪音與振動防制","year":103,"no":17,"art":"4-1 聲學基礎與噪音","q":"有關建築物室內噪音與振動防制方式之敘述，下列何者錯誤？","opts":{"A":"以頻率 1 ~ 250 Hz 範圍作為評估基準","B":"室內裝修會影響隔音計畫","C":"隔音罩適用於廠房內主要周期性噪音源使用","D":"主動式噪音衰減器是運用噪音之反相位處理裝置來完成"},"ans":"A","note":"答案 A（錯誤）。室內噪音評估應涵蓋人耳可聽頻率範圍（約 20 Hz～20 kHz），振動則另以低頻範圍評估，不能只以 1～250 Hz 作為室內噪音與振動防制之評估基準。考試當時有效之噪音管制標準（102 年 8 月 5 日修正）第 2 條第 6 款即以 20 Hz 至 20 kHz 之均能音量 Leq、20 Hz 至 200 Hz 之低頻均能音量 Leq,LF 為評估範圍；課程教材之 NC 背景噪音評價曲線亦取 63～8000 Hz 倍頻帶，人耳可聽範圍為 20～20,000 Hz。B 正確：裝修材料之吸音、開口與縫隙會影響隔音計畫成效；C 正確：隔音罩可將機械等固定噪音源包覆隔離；D 正確：主動式噪音控制以麥克風偵測噪音，再由揚聲器發出反相位聲波抵消。【查證限制】隔音罩與主動消音原理本機教材未列，依一般原理。 【依據】噪音管制標準（102 年修正）第 2 條第 6 款；課程教材：23 S ET 09 聲學基礎 p.4、23 S ET 11 噪音控制 p.2（NC 曲線 63～8k Hz）；噪音控制（一般原理）"},{"c":271,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"點音源與線音源距離衰減","year":104,"no":13,"art":"4-1 聲學基礎與噪音","q":"有關聲音傳播及合成之敘述，下列何者錯誤？","opts":{"A":"離點音源之距離加倍時，音壓級會減少 6 dB","B":"離點音源之距離加倍時，音壓級會減少 3 dB","C":"離線音源之距離加倍時，音壓級會減少 3 dB","D":"相同 dB 值之兩音源，其合成音只增加 3 dB"},"ans":"B","note":"答案 B。點音源為球面擴散，聲強與距離平方成反比，距離加倍聲強成為 1/4，音壓級衰減 10log4≈6 dB，故A 正確、B 錯。線音源（如車流不斷的道路）為圓柱面擴散，聲強與距離成反比，距離加倍衰減 10log2≈3 dB，C 正確。兩個相同 dB 值音源合成：L＝L1＋10log2≈L1＋3 dB，D 正確。 【依據】課程教材：23 S ET 09 聲學基礎p.15（距離加倍強度成為 1/4，聲壓級衰減 6 dB）"},{"c":272,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"聲音傳播衰減因素","year":104,"no":15,"art":"4-1 聲學基礎與噪音","q":"有關聲音傳播受阻因素之敘述，下列何者錯誤？","opts":{"A":"地面吸音是戶外音量吸收因素之一","B":"在室內聲音傳播中，低頻比高頻易被空氣吸收","C":"氣溫是影響聲音傳播的因素之一","D":"聲音傳播透過固體表面放射是傳播途徑之一"},"ans":"B","note":"答案 B。空氣吸收（分子吸收）隨頻率升高而急遽增加，高頻比低頻容易被空氣吸收，所以遠處傳來的聲音只剩低沉成分；大型廳堂計算殘響時也只對 2 kHz 以上高頻加計空氣吸收，故 B 說反了。A 正確：戶外傳播有地表（草地、鬆土）吸收效應。C 正確：氣溫影響聲速，溫度梯度會使聲波折射，並影響空氣吸收量。D 正確：固體傳音經構造體傳遞後由壁、樓板表面再輻射為空氣音。 【依據】一般建築聲學教材（空氣吸收隨頻率增加）；課程教材：23 S ET 09 聲學基礎 p.19（折射：溫差、強風於室外顯著）、23 S ET 10 室內聲學 p.8（T＝0.161V／(Σsα＋4mV) 之空氣吸收項）"},{"c":273,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"建築聲學基本觀念","year":104,"no":17,"art":"4-1 聲學基礎與噪音","q":"有關建築聲學之敘述，下列何者錯誤？","opts":{"A":"從點音源放射出之音能密度，隨距離之平方成反比而衰減","B":"迴響（餘響）時間為音源停止後室內之平均聲音能量密度衰減至十萬分之一所費之時間","C":"單層牆壁之聲音透過損失會隨壁體之單位面積重量增加而變大","D":"正常人之聽力，其可聽頻率範圍在 20 Hz～20K Hz 之間"},"ans":"B","note":"答案 B。殘響（餘響）時間定義為音源停止後，室內平均音能密度衰減 60 dB，也就是衰減到原來的百萬分之一（10⁻⁶）所需時間，不是十萬分之一（50 dB），故 B 錯。A 正確：點音源遵守反平方定律。C 正確：質量定律，面密度加倍，透過損失約增加 5～6 dB。D 正確：一般成人可聽範圍約 20 Hz～20,000 Hz。 【依據】課程教材：23 S ET 10 室內聲學 p.8（衰減 60 分貝或至百萬分之一）；23 S ET 09 聲學基礎 p.4、p.15、p.38"},{"c":274,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"點音源功率與距離","year":105,"no":15,"art":"4-1 聲學基礎與噪音","q":"某點距離點音源 2 m 之音壓級為 80 dB，將此音源之音響功率增至 2 倍，且與音源之距離拉長至 4 m，則該點音壓級會變為多少？","opts":{"A":"74 dB","B":"77 dB","C":"80 dB","D":"83 dB"},"ans":"B","note":"答案 B。①功率加倍：ΔL = 10 log 2 ≈ ＋3 dB。②點音源自由音場距離加倍：音壓級依逆平方定律衰減 20log（4／2）= 20 log 2 ≈ 6 dB。故 L = 80＋3－6 = 77 dB。驗算：音強 I ∝ W／r²，新舊比 =（2W／4²）÷（W／2²）=2／4 = 1／2，10 log（1／2）= －3 dB，80－3 = 77 dB，一致。A 漏加功率增量；C、D 計算錯誤。課程教材：球面波遵守反平方定律，距離加倍時強度成為 1/4，聲壓級衰減 6 dB。 【依據】課程教材：23 S ET 09 聲學基礎 p.15"},{"c":275,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"聲學單位","year":105,"no":17,"art":"4-1 聲學基礎與噪音","q":"下列建築聲學單位之敘述，何者錯誤？","opts":{"A":"音壓的單位為 Pa","B":"音功率的單位為 W/m²","C":"音壓級的單位為 dB","D":"音功率級的單位為 dB"},"ans":"B","note":"答案 B（錯誤）。音功率（音響功率）是音源每秒放出的聲能，單位為 W（瓦）；W/m²是音強（聲強，單位面積通過之聲功率）的單位。A 音壓為壓力變動量，單位 Pa，正確。C 音壓級 Lp = 20 log（p／p0），p0 = 2×10⁻⁵Pa，單位 dB，正確。D 音功率級 Lw = 10 log（W／W0），W0 = 10⁻¹² W，單位 dB，正確。課程教材亦列：聲壓單位 N/m²（Pa）、聲功率單位 W、聲強單位 W/m²。 【依據】課程教材：23 S ET 09 聲學基礎 p.6"},{"c":276,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"NC 曲線","year":106,"no":2,"art":"4-1 聲學基礎與噪音","q":"有關噪音 NC 曲線的敘述，下列何者錯誤？","opts":{"A":"它是衡量噪音量的工具之一","B":"噪音依 63 Hz～8000 Hz 區間中 8 個中心頻率，量測到之聲壓級均不得超出訂定之曲線","C":"商業空間之理想 NC 值應大於教室","D":"NC 曲線在高頻部分的 dB 數比低頻數據大"},"ans":"D","note":"答案 D（錯誤）。NC（Noise Criteria）曲線依人耳對低頻較不敏感、對高頻較敏感之特性訂定：同一條曲線在低頻容許之聲壓級較高、高頻容許值較低，曲線由低頻往高頻遞減，故「高頻 dB 數比低頻大」錯誤。A：NC 為室內背景噪音評價工具之一 ✓。B：以 63～8000 Hz 共 8 個八度音中心頻率測得之聲壓級，皆不超過某曲線時即為該 NC 值 ✓。C：課程教材 NC 圖之建議值，餐館約 43 dBA、開放辦公室 52 dBA，教室、圖書館、個人辦公室約38 dBA，商業空間容許值高於教室 ✓。教材 NC 圖橫軸即 63～8k Hz 八個頻帶，曲線由低頻往高頻下降，可看出 D錯。 【依據】課程教材：23 S ET 11 噪音控制 230514 p.2"},{"c":277,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"八度音程","year":106,"no":15,"art":"4-1 聲學基礎與噪音","q":"有關八度音程的敘述，下列何者錯誤？","opts":{"A":"是國際聲音頻率之標準分割方式","B":"一般國際通用有 1/1 與 1/2 八度音程之分","C":"中心頻率等於上下切割頻率積之方根","D":"依 1/1 八度音程中心頻率在 250 Hz 之後是 500 Hz"},"ans":"B","note":"答案 B（錯誤）。國際通用之頻帶分析為 1/1 八度音程（octave band）與 1/3 八度音程（1/3 octave band），不是 1/2 八度音程。A：八度音程頻帶為國際標準之頻率分割方式 ✓。C：中心頻率 fc＝√(f1×f2)，f1、f2 為下、上限切割頻率（1/1 八度 f2＝2f1）✓。D：課程教材：八度音頻帶之上限與下限頻率比為 2:1（p.11），故 1/1 八度中心頻率依序為 63、125、250、500、1000、2000、4000、8000 Hz，每級加倍，250 之後為 500 Hz ✓。 【依據】課程教材：23 S ET 09 聲學基礎 230504 p.11；IEC 61260（頻帶濾波器，概念）"},{"c":278,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"最小可聽曲線","year":106,"no":17,"art":"4-1 聲學基礎與噪音","q":"有關「人耳最小可聽曲線」的敘述，下列何者錯誤？","opts":{"A":"指人耳可以聽到之各種頻率的最小音量","B":"是建立響度（loudness）的基礎","C":"最低處表示人耳最敏感的頻率位置","D":"往低頻率範圍音量增加表示聽感愈好"},"ans":"D","note":"答案 D（錯誤）。最小可聽曲線（聽閾曲線）為各頻率人耳剛好能聽到的最小音壓級。曲線往低頻端上升，表示低頻聲需要更大的音壓才聽得到，代表人耳對低頻「較不敏感、聽感愈差」，並非聽感愈好。A：定義 ✓。B：\n等響度曲線（phon）以聽閾為最下一條，是響度評價基礎 ✓。C：曲線最低處約 3000～4000 Hz，為人耳最敏感之頻率 ✓。課程教材（等響度曲線）：響度感因頻率而異，人耳對低頻較為遲鈍、對高頻較敏感，峰值約在 3 kHz（p.9），印證 D 錯、C 對。 【依據】課程教材：23 S ET 09 聲學基礎 230504 p.9"},{"c":279,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"樂音要素","year":107,"no":17,"art":"4-1 聲學基礎與噪音","q":"下列何者不是「樂音四要素」？","opts":{"A":"基音","B":"音強","C":"音色","D":"音調"},"ans":"A","note":"答（A）。樂音的要素通常指：音調（音高，取決於基本頻率）、音強（響度，取決於振幅／音壓）、音色（取決於泛音組成與波形），稱為樂音三要素；四要素再加上「音長」（持續時間）。（A）基音是複合音中頻率最低的成分，決定音高，屬於構成音調與音色的「成分」，並非要素本身。（B）音強、（C）音色、（D）音調皆為樂音要素。 【依據】一般聲學／音樂聲學通論（樂音要素：音調、音強、音色，或另加音長）；本機課程教材未涵蓋"},{"c":280,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"音壓加倍之音壓級增量","year":108,"no":15,"art":"4-1 聲學基礎與噪音","q":"音壓增加為原來之 2 倍時，dB 值會增加多少？","opts":{"A":"2 dB","B":"4 dB","C":"6 dB","D":"8 dB"},"ans":"C","note":"答案 C。音壓級 Lp＝20 log(p/p0)。音壓變為 2 倍：ΔL＝20 log 2＝20×0.301≈6.0 dB。驗算：音壓 2 倍即音能（強度）4 倍，10 log 4＝10×0.602≈6 dB，兩法一致。注意若題目為「音響強度或音源功率」加倍（如兩個相同音源合成），則只增加 10 log 2≈3 dB。 【依據】課程教材：23 S ET 09 聲學基礎 p.7（Lp＝10 log(p²/pref²)＝20log(p/pref)）"},{"c":281,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"音環境綜合（回音、音焦點）","year":108,"no":18,"art":"4-1 聲學基礎與噪音","q":"有關音環境之敘述，下列何者錯誤？","opts":{"A":"評估都市中的環境噪音時，大多採用最接近人耳聽覺頻率特性的 dB(A)為量測單位","B":"直接音與反射音的音源距離相差超過 17 m 時，易產生回音","C":"使建築物遠離噪音源之所以有助於噪音防制，是因為聲音有隨距離衰減的特性","D":"矩形屋頂較圓弧形屋頂容易產生音焦點"},"ans":"D","note":"答案 D（錯誤）。凹圓弧形（拱頂、圓頂）天花會把反射音集中於一處形成音焦點，矩形平面屋頂反射較分散，故應是圓弧形較易產生音焦點。A：A 加權模擬人耳對低頻較不敏感的特性，環境噪音多以 dB(A) 評估，正確；B：反射音與直接音時間差超過約 1/20 秒即易聽成回音，音速 340 m/s×0.05 s＝17 m，正確；C：點音源距離加倍約衰減 6 dB，正確。 【依據】課程教材：23 S ET 09 聲學基礎 p.10（A 加權 dB(A)）、p.15（距離衰減 6dB）；23 S ET 10 室內聲學 p.2（每米約 3 ms）、p.20（凹曲面聚焦、迴走）、p.25（迴音）"},{"c":282,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"聲音波長計算","year":109,"no":16,"art":"4-1 聲學基礎與噪音","q":"若空氣中之聲音速度為 340（公尺/秒），則聲音頻率 100 Hz 之波長與 500 Hz 之波長，兩者波長相差多少公尺？","opts":{"A":"0.68","B":"2.72","C":"1.70","D":"2.40"},"ans":"B","note":"答案 B。波長 λ＝c／f。100 Hz：λ₁＝340／100＝3.40 m；500 Hz：λ₂＝340／500＝0.68 m；差＝3.40－0.68＝2.72 m。驗算：340×(1/100－1/500)＝340×0.008＝2.72 m（兩次計算相同）。(A) 0.68 是 500 Hz 的波長本身，(C)1.70 為 200 Hz 的波長，(D) 2.40 無對應。 【依據】聲學基本公式 λ＝c／f；課程教材：23 S ET 09 聲學基礎 p.4（頻率、週期、聲速、波長）"},{"c":283,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"建築音響之物理單位","year":111,"no":17,"art":"4-1 聲學基礎與噪音","q":"有關建築音響之物理單位，下列何者錯誤？","opts":{"A":"音強：W/m²","B":"噪音量：dB(R)","C":"音壓：Pa","D":"音功率：W"},"ans":"B","note":"答案 B（錯誤）。噪音量（噪音位準）常以計入 A 加權之 dB(A) 表示（噪音評價另有 NC、NR 等曲線），並無「dB(R)」此一噪音量單位。A：音強（聲音強度）為單位面積上之聲功率，W/m² ✓；C：音壓單位為 Pa（N/m²） ✓；D：音功率單位為 W ✓（課程教材：聲壓 N/m²＝Pa、聲功率 W、聲強 W/m²）。 【依據】課程教材：23 S ET 09 聲學基礎 p.6（聲壓 Pa、聲功率 W、聲強 W/m²）、p.10（A 加權 dB(A)）；23 S ET 11 噪音控制 p.2（NC、NR 曲線）"},{"c":284,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"聲壓級合成","year":112,"no":6,"art":"4-1 聲學基礎與噪音","q":"小巨蛋演唱會彩排進行時，舞台上 3 組分散式監聽揚聲器同時驅動，測得聲壓級均為 80 dB，試算舞台上所測得總聲能最接近多少 dB？","opts":{"A":"80","B":"85","C":"90","D":"95"},"ans":"B","note":"答案 B。聲壓級不可直接相加，須用能量疊加：L ＝ 10 log（Σ 10^（Li/10））。3 個相同聲源 L ＝ 80 ＋ 10log 3 ＝ 80 ＋ 10 × 0.477 ＝ 84.8 dB，最接近 85 dB。驗算：80 dB 對應聲能比值 10⁸，3 組合計為 3 × 10⁸，10 log（3× 10⁸）＝ 10 × 8.477 ＝ 84.77 dB。可記憶：2 個相同聲源增加 3 dB、3 個增加約 4.8 dB、4 個增加 6 dB、10 個增加10 dB。A 為忽略疊加，C、D 為誤把分貝直接相加或乘算。 【依據】建築聲學基本公式（分貝運算）；課程教材：23 S ET 09 聲學基礎 p.13～14（聲壓級加法表：80＋80＝83，再＋80 差 3 dB 加 2 → 85）"},{"c":285,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"響度（phon、sone）","year":113,"no":10,"art":"4-1 聲學基礎與噪音","q":"有關聲學的計量方式「響度」（loudness）之相關敘述，下列何者錯誤？","opts":{"A":"響度的單位有 phon 與 sone 兩種","B":"響度大小是依據人對聲音的各種音頻高低具有不同感度所定義","C":"A 加權聲壓級 dB(A)是根據等響曲線中 40 phon 的曲線感度制定","D":"測量得相等之卡車引擎與飛機引擎的聲壓級時，兩者的響度大小也相等"},"ans":"D","note":"答案 D（錯誤）。響度是人耳主觀感受，取決於聲音頻率與聲壓級：同樣的聲壓級（dB），不同頻率（卡車引擎偏低頻，飛機引擎偏中高頻）聽起來的響度並不相同，故聲壓級相等時響度未必相等。A：響度單位有 phon（響度位準）與 sone（響度）✓；B：等響曲線反映人耳對各頻率感度不同 ✓；C：A 加權（dB(A)）近似 40 phon等響曲線 ✓。 【依據】課程教材：23 S ET 09 聲學基礎 p.9（等響度曲線，人耳對低頻較遲鈍）、p.10（A 加權）"},{"c":286,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"1/1 八度音頻帶","year":113,"no":11,"art":"4-1 聲學基礎與噪音","q":"有關 1/1 八度音頻（octave band）之敘述，下列何者錯誤？","opts":{"A":"八度音頻之中心頻率約等於上下遮斷頻率（cut-off frequency）之乘積的方根","B":"八度音頻之上遮斷頻率約等於下遮斷頻率（cut-off frequency）的兩倍","C":"依據 1/1 八度音頻之頻率的切割方式，各個頻段的頻寬約為其中心頻率之 0.5 倍","D":"依據 1/1 八度音頻之頻率的切割方式，從 125 Hz 至 4000 Hz 可以有 5 個不同頻寬"},"ans":"C","note":"答案 C（錯誤）。1/1 八度音頻：f2 = 2 f1（B ✓），中心頻率 fc = √(f1·f2)（A ✓），頻寬 Δf = f2 − f1 = f1 =fc/√2 ≈ 0.707 fc，並非 0.5 倍（C 錯）。例：fc = 1000 Hz，f1 ≈ 707 Hz、f2 ≈ 1414 Hz，頻寬約 707 Hz。D：頻寬隨中心頻率成比例，各頻帶頻寬皆不同；把 125 Hz 與 4000 Hz 視為範圍兩端，其間為 125–250、250–500、500–1000、1000–2000、2000–4000 共 5 個倍頻程，即 5 個不同頻寬，可成立。【爭議】若把 125 與 4000 Hz 都當成中心頻率，則有 6 個頻帶，D 之敘述亦不精確；惟官方答案為 C，以官方為準。 【依據】課程教材：23 S ET 09 聲學基礎p.11（八度音頻帶上下限頻率比 2:1）"},{"c":287,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"分貝計算","year":113,"no":12,"art":"4-1 聲學基礎與噪音","q":"有關音量的計量方式 「分貝」大小及計算，下列敘述何者錯誤？","opts":{"A":"分貝是由聲音能量與基礎聲音能量（最小可聽值）的比率值取對數得到的","B":"點音源聲能在自由聲場中增加 1 倍，聲功率位準（音強級）增加 6 分貝","C":"兩噪音源頻譜相同，兩者聲壓位準（音壓級）差異在 10 分貝以上，則聲壓小者幾乎可以忽略","D":"聲音傳播以空氣為主的方式中，聲壓位準（音壓級）大小與空氣溫度及密度有關"},"ans":"B","note":"答案 B（錯誤）。聲功率位準 Lw = 10 log(W/W0)，聲能（功率）增加 1 倍，Lw 增加 10 log 2 ≈ 3 dB（不是 6dB）。需增加到 4 倍才增加 6 dB。A：分貝為能量比取對數 ✓。C：兩音源差 10 dB 以上，合成後僅比大者高約 0.4dB，可忽略 ✓（課程教材聲壓級加法表：兩者差 0～1 dB 時大者加 3 dB，差 9 dB 以上時加 0 dB）。D：聲壓與聲強之關係含空氣密度與聲速（ρc），故與空氣溫度、密度有關，通常視為正確敘述。注意勿與「點音源距離加倍，聲壓級衰減 6 dB」（反平方定律）混淆——B 即把 6 dB 套到聲能加倍上。 【依據】課程教材：23 S ET 09 聲學基礎 p.14（聲壓級加減）、p.15（距離衰減）"},{"c":288,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-1 聲學基礎與噪音","h3":"八度音中心頻率","year":113,"no":14,"art":"4-1 聲學基礎與噪音","q":"有關 1/1 八度音（1/1 Octave）中心頻率，介於 125 與 8000 Hz 間，尚有 5 個頻率，下列何者不是其中之一頻率（Hz）？","opts":{"A":"500","B":"750","C":"1000","D":"4000"},"ans":"B","note":"答案 B。1/1 八度音之標準中心頻率以 2 倍遞增：125 → 250 → 500 → 1000 → 2000 → 4000 → 8000 Hz，故介於 125 與 8000 Hz 間尚有 250、500、1000、2000、4000 共 5 個。750 Hz 不在其中（它只是 500 與 1000 的算術平均，並非標準中心頻率）。A、C、D 皆是。 【依據】課程教材：23 S ET 09 聲學基礎 p.5（頻率序列 63、125、250、500、1000、2000、4000、8000 Hz）"},{"c":289,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"空氣傳音與固體傳音","year":102,"no":3,"art":"4-2 吸音、隔音與室內音響","q":"有關建築物室內之噪音與振動傳播的敘述，下列何者錯誤？","opts":{"A":"電視、音響、電話響聲等噪音，屬於空氣傳音","B":"室外汽機車之噪音，主要是透過外牆及門窗傳播至室內","C":"人們跑跳及搬動家具，主要為固體傳音","D":"浴室對鄰近房間之噪音干擾，主要為空氣傳音"},"ans":"D","note":"答案為 D。\n浴室對鄰房的噪音，主要來自給排水管的水流、沖水、水錘和器具撞擊。這些振動經由管路與牆、樓板等結構傳到鄰房，屬於「固體傳音」（結構傳音），不是以空氣傳音為主。改善方法是在管路與結構之間加防振支撐與包覆，並採低噪音器具。\nA 正確：電視、音響、電話聲是聲源使空氣振動傳播，屬於空氣傳音。\nB 正確：室外交通噪音主要從隔音較弱的門窗與外牆傳入。\nC 正確：跑跳、搬家具會直接撞擊樓板，屬於固體傳音（樓板衝擊音）。 【依據】建築環境控制一般原理（空氣傳音與固體傳音）；課程教材：23 S ET 09 聲學基礎 p.2；23 S ET 11 噪音控制 p.15；綠建築評估手冊－基本型（2012 年版）2-7.3 音環境 p.94（音環境分空氣傳音、固體傳音；固體傳音以樓板剛性與緩衝材控制）"},{"c":290,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"舞臺反射板","year":102,"no":4,"art":"4-2 吸音、隔音與室內音響","q":"有關音樂廳之舞臺反射板設計的敘述，下列何者錯誤？","opts":{"A":"舞臺反射板所圍繞之空間大小，需考量表演樂團的規模及布置","B":"舞臺反射板主要是考量將聲音反射至觀眾席","C":"舞臺反射板對於樂團團員間演奏之聽感有幫助","D":"舞臺反射板之材料密度越小越好"},"ans":"D","note":"答案為 D。\n反射板要能有效反射各頻率的聲音（尤其低頻），所以應選用面密度大、剛性高、不易振動的材料（例如厚實木板、複合板）。密度小、輕薄的板材容易產生板振動，形成共振吸音，會吸收低頻、使音色單薄，所以「密度越小越好」是錯的。\nA 正確：反射板圍出的空間大小，要配合樂團的編制與座位配置。\nB 正確：反射板的主要作用之一，是把舞臺上的聲能反射到觀眾席，提高響度與明晰度。\nC 正確：反射板讓團員彼此聽得清楚，有助合奏時的音準與節奏一致。 【依據】建築環境控制一般原理（廳堂音響設計）"},{"c":291,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"室內噪音量影響因素","year":102,"no":5,"art":"4-2 吸音、隔音與室內音響","q":"下列何者不是屋內噪音量之影響因素？","opts":{"A":"外牆之隔音能力","B":"地坪有無地毯","C":"屋外噪音源之位置高低","D":"屋外噪音源之位置遠近"},"ans":"C","note":"答案為 C。\n室內噪音量大致可寫成：\nLi ≒ Lo − TL + 10 log(S/A)\n・Lo：到達外牆面的噪音量，由噪音源強度與「距離」決定\n・TL：外牆、門窗的傳音損失（對應 A）\n・S：透聲面積\n・A：室內吸音力（地毯會增加吸音，對應 B）D 正確（是影響因素）：點音源的聲壓級隨距離衰減，距離加倍約衰減 6 dB（課程教材「聲學基礎」p.15），所以噪音源越遠，到達外牆的噪音量 Lo 越小，屋內噪音量也越小。\nA、B 正確（是影響因素）：外牆隔音能力決定 TL；地毯增加室內吸音力 A，使屋內噪音量降低。\nC：噪音源的高低位置本身不是上式的因子；高低差造成的影響，已經反映在噪音源到外牆的直線距離上，所以命題者以 C 為「不是影響因素」。\n【爭議】實務上，噪音源高度會改變圍牆、陽臺等障礙物的遮蔽效果、地面反射與入射角度，嚴格說也會影響屋內噪音量，題目設計不夠嚴謹。依規定仍以官方答案 C 為準。 【依據】建築環境控制一般原理（室內噪音量與傳音損失、距離衰減）；課程教材：23 S ET 09 聲學基礎 p.15；23 S ET 11 噪音控制 p.3"},{"c":292,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"吸音係數","year":102,"no":12,"art":"4-2 吸音、隔音與室內音響","q":"某建築吸音材料，其反射能量為入射能量的五分之一，透射能量為入射能量的五分之二，則其吸音係數為：","opts":{"A":"0.8","B":"0.4","C":"0.2","D":"0.6"},"ans":"A","note":"答案為 A。\n建築音響上的吸音係數，定義為「沒有被反射回室內的能量比例」，透射能量也算在內：\nα = 1 − r = 1 − 1/5 = 0.8驗算：材料本身吸收（消耗）的能量 = 1 − 1/5 − 2/5 = 2/5；加上透射 2/5，合計 4/5 = 0.8，與上式相同。\n0.4 只算材料本身吸收（消耗率）；0.2 是反射率；0.6 是 1 − 2/5，觀念錯誤。 【依據】建築環境控制一般原理（吸音率定義 α＝1－反射率）；課程教材：23 S ET 09 聲學基礎 p.24～25"},{"c":293,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"沙賓殘響公式","year":103,"no":14,"art":"4-2 吸音、隔音與室內音響","q":"有關沙賓（Sabine）餘（迴）響式的敘述，下列何者錯誤？","opts":{"A":"餘響時間與材料的吸音力成反比","B":"餘響時間與室容積成正比","C":"沙賓式的計算在大空間中較不適用","D":"Knudsen 殘響式是沙賓式之改良，將空氣吸收考慮在內"},"ans":"C","note":"答案 C（錯誤）。沙賓式 T＝0.161V／A（V 室容積、A 總吸音力），故 A（與吸音力成反比）、B（與室容積成正比）正確。沙賓式假設室內為擴散音場且平均吸音率小，適用於吸音較少之一般或大空間；在吸音率大（如平均吸音率高之錄音室）或小空間時誤差大，因此「在大空間中較不適用」之敘述錯誤。D 正確：大空間高頻時空氣吸收不可忽略，Knudsen 式在分母加入空氣吸收項（4mV）予以修正。課程教材：餘響時間 T 與容積 V 成正比、與等價吸音面積 A 成反比。 【依據】課程教材：23 S ET 10 室內聲學 p.8；Sabine、Eyring、Knudsen 殘響公式（一般原理）"},{"c":294,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"表演廳背景噪音","year":103,"no":15,"art":"4-2 吸音、隔音與室內音響","q":"有關表演廳之背景噪音的敘述，下列何者錯誤？","opts":{"A":"若使用浮式構造，可有效降低背景噪音","B":"室內背景噪音與空調無關","C":"室外噪音會影響室內背景噪音，因此須加強門窗及外牆壁之隔音性能","D":"觀眾席座椅除了考慮舒適度之外，亦應考量噪音的產生"},"ans":"B","note":"答案 B（錯誤）。表演廳背景噪音主要來源之一即為空調系統：送回風之氣流噪音、風管傳遞之機械噪音及機房振動，須以低風速、消音箱（器）、防振支撐及機房隔離處理，故「與空調無關」錯誤。A 正確：浮式構造（浮築樓板、浮式牆）可隔絕固體傳音與振動；C 正確：外部交通等噪音經門窗、外牆傳入，須加強隔音與聲鎖（音響前室）；D 正確：座椅翻動、摩擦之聲響亦會增加背景噪音。課程教材亦指出空調設備（冷凍機、泵、送風機、風管氣流）為室內噪音振動重要原因，並以 NC 等級規範背景噪音。 【依據】課程教材：07 空調系統與空間計畫 p.84；23 S ET 11 噪音控制 p.2（NC 背景噪音等級）、p.7～8（浮式構造）"},{"c":295,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"穿孔板共鳴吸音","year":103,"no":16,"art":"4-2 吸音、隔音與室內音響","q":"有關單層沖孔金屬板 + 背後空氣層 + 混凝土牆之吸音構造敘述，下列何者錯誤？","opts":{"A":"它是屬於一種共振腔吸音構造","B":"它是一種全頻域吸音材","C":"沖孔金屬板之穿孔率（穿孔面積 / 總面積）應小於 20%","D":"在背後空氣層裡加入玻璃棉可提高吸音之效果"},"ans":"B","note":"答案 B（錯誤）。穿孔板＋背後空氣層構成多個亥姆霍茲共鳴器（共振腔），屬共鳴型吸音構造，只在共振頻率附近（通常為中頻）有較大吸音，並非全頻域吸音材，故 A 正確、B 錯誤。C 正確：穿孔率過大時面板近乎透聲，失去共鳴效果；課程教材列空腔共振吸音之穿孔覆面板開孔率約 2～5%，遠小於 20%。D 正確：空氣層內填玻璃棉等多孔材可增加阻尼，提高吸音率並使吸音頻帶加寬。 【依據】課程教材：23 S ET 09 聲學基礎 p.27（吸音材三類）、p.33（空腔共振器、2～5% 穿孔覆面板）"},{"c":296,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"空間音響與環繞感","year":103,"no":18,"art":"4-2 吸音、隔音與室內音響","q":"有關建築聲學之敘述，下列何者錯誤？","opts":{"A":"環繞音效是人對不同方向的聲音感知","B":"左右耳朵聽進的聲音有時差或量差才有環繞音效","C":"在歐洲大教堂內聽演唱比在一般小型音樂廳適合","D":"人對聲音的空間定位決定於聲音進入雙耳的差異性"},"ans":"C","note":"答案 C（錯誤）。歐洲大教堂室容積大、石材等硬質表面多，殘響時間極長（常達數秒以上），語言與演唱之明瞭度差、音節重疊，一般演唱在殘響適中之小型音樂廳較適合（大教堂僅適合管風琴、聖詠等特定曲目）。\nA、B、D 正確：人以雙耳時間差（ITD）與音量差（ILD）判斷聲源方向，形成空間定位與環繞感。課程教材之餘響時間目標值：語音劇場約 1 秒、教室可低至 0.5 秒、歌劇約 1.4 秒、交響樂可長至 2 秒，均遠短於大教堂。\n【依據】課程教材：23 S ET 10 室內聲學 p.10；雙耳定位（一般原理）"},{"c":297,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"平均吸音率","year":104,"no":14,"art":"4-2 吸音、隔音與室內音響","q":"有關室內空間之平均吸音率的敘述，下列何者錯誤？","opts":{"A":"室內之平均吸音率越高，室內之迴響（餘響）時間越低","B":"平均吸音率之單位為分貝（dB）","C":"平均吸音率是室內空間總吸音力與室內空間總表面積的比值","D":"室內空間總吸音力為室內各材料之吸音率乘以各材料面積之總和"},"ans":"B","note":"答案 B。吸音率是被吸收（含透過）音能與入射音能之比，為 0～1 的無因次比值，沒有單位，不是分貝，故 B 錯。D 正確：總吸音力 A＝Σ（Si·αi），單位 m²（sabin）。C 正確：平均吸音率 ᾱ＝A／S（總吸音力÷總表面積）。A 正確：依賽賓公式 T＝0.161V／A，吸音力（平均吸音率）越大，殘響時間越短。 【依據】課程教材：\n23 S ET 10 室內聲學 p.8（餘響時間與容積成正比、與等價吸音面積成反比）"},{"c":298,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"多功能廳堂可變殘響","year":104,"no":16,"art":"4-2 吸音、隔音與室內音響","q":"對於多功能用途的表演廳，下列改變廳內迴響（餘響）時間的手法，何者效果最差？","opts":{"A":"設計可升降之天花板，改變室容積","B":"壁面設計可替換材質之構造，改變吸音率","C":"空調出風口設置消音箱，降低背景噪音","D":"於觀眾席上方吊掛吸音體"},"ans":"C","note":"答案 C。殘響時間 T＝0.161V／A，只與室容積 V 及總吸音力 A 有關。A 改變容積、B 改變壁面吸音率、D增加吊掛吸音體，都能直接調整殘響時間，是可變殘響常用手法。C 在空調出風口設消音箱，目的在降低設備背景噪音（改善 NC 值），對室內容積與吸音力幾乎沒有影響，不能改變殘響時間，效果最差。 【依據】課程教材：\n23 S ET 10 室內聲學 p.8（餘響時間與容積 V 及等價吸音面積 A 之關係）"},{"c":299,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"單層隔音構造與質量法則","year":105,"no":14,"art":"4-2 吸音、隔音與室內音響","q":"有關單層隔音構造質量法則之敘述，下列何者錯誤？","opts":{"A":"是指理想化隔音構造之特性","B":"通常在入射聲能頻率增加一個倍頻程（octave）時，隔音量增加 6 dB","C":"密閉空氣層中插入吸音材是為了減少構造重合（coincidence）頻率的影響","D":"隔音構造的共振控制段具有提高低頻附近隔音量效果"},"ans":"D","note":"答案 D（錯誤）。質量法則假設單層壁為無限大、無剛性、僅以質量抵抗聲波的理想板（A 正確），其傳音損失 TL ≈ 20 log（f·m）－47（場入射，同 112-5），頻率加倍 TL 約增 6 dB（B 正確）。D 錯：低頻共振控制段因板的共振使隔音量降低（出現凹谷），不是提高，方向完全相反，是最明確的錯誤敘述。【爭議】C 之敘述亦不嚴謹：雙層壁空氣層內填吸音材，主要作用是吸收空氣層內之駐波、減輕共鳴透過，重合（吻合）效應則是板材本身之性質（課程教材：低頻處為共振、高頻 1～4 kHz 為重合效應），且「密閉空氣層」屬雙層構造，已超出單層質量法則之題旨。但 C 至多是作用機制寫得不精確，D 則是方向相反之錯誤，官方只給 D，依官方答案。（課程教材p.38 取面密度加倍增 5 dB。） 【依據】課程教材：23 S ET 09 聲學基礎 p.38、p.39"},{"c":300,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"擴音系統迴授（嘯叫）防止","year":105,"no":16,"art":"4-2 吸音、隔音與室內音響","q":"有關電氣音響系統不產生迴授音（howling）之設計條件敘述，下列何者錯誤？","opts":{"A":"發話者接近麥克風，喇叭接近聽眾配置","B":"使用指向性高（high Q）之麥克風及揚聲器","C":"各音響器材之頻率特性應力求頻率分布設定在常使用範圍內","D":"室內作吸音處理，以降低餘響時間"},"ans":"C","note":"答案 C（錯誤）。迴授（嘯叫）是揚聲器的聲音再被麥克風收進、反覆放大而在某頻率起振。防止條件：A發話者近麥克風（提高直接音）、揚聲器靠近聽眾而遠離麥克風；B 麥克風與揚聲器用高指向性，避免互相指向；\nD 室內吸音降低殘響音能，減少回授。C 錯在器材頻率特性應力求「平坦」，避免某頻率出現響應峰值而最先起振，必要時以等化器削去峰值；只把頻率分布限定在常用範圍，並不是防止迴授的條件。【查證限制】本機課程教材未涵蓋電氣音響迴授之內容，依建築聲學與電聲通論。 【依據】建築聲學與電氣音響教材（迴授防止）"},{"c":301,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"重合（coincidence）頻率","year":106,"no":14,"art":"4-2 吸音、隔音與室內音響","q":"有關單層隔音構造之重合（coincidence）頻率之敘述，下列何者錯誤？","opts":{"A":"構造材料愈厚，構造重合頻率有愈高之趨勢","B":"構造材料密度愈高，構造重合頻率有愈高之趨勢","C":"構造材料愈剛硬，構造重合頻率有愈低之趨勢","D":"構造材料產生聲橋作用能促使構造重合頻率降低"},"ans":"A","note":"答案 A（錯誤）。單層板臨界（重合）頻率 fc＝(c²/2πh)×√[12ρ(1－ν²)/E]，fc 與板厚 h 成反比、與 √(ρ/E) 成正比。板愈厚 fc 愈低（A 錯），故厚重材料的重合低谷移到低頻區。B：密度 ρ 愈大，fc 愈高 ✓。C：楊氏係數 E愈大（愈剛硬），fc 愈低 ✓。D：雙層構造若有聲橋，兩層板剛性連結如同較厚之板，重合頻率隨之降低 ✓。重合效應會使傳音損失在 fc 附近明顯下降，設計時應使 fc 避開主要噪音頻率。 【依據】課程教材：23 S ET 09 聲學基礎 230504 p.39（重合效應／吻合效應發生於高頻，約 1～4 kHz）；建築聲學通用原理（臨界頻率公式）"},{"c":302,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"兼具吸音與隔音之構造","year":106,"no":16,"art":"4-2 吸音、隔音與室內音響","q":"下列何種建築材料兼具良好之吸音及隔音性能？","opts":{"A":"12 公分厚之鋼筋混凝土牆","B":"5 公分厚之玻璃棉","C":"12 公分厚之穿孔矽酸鈣板內填玻璃棉","D":"12 公分厚之雙面石膏板牆內填玻璃棉"},"ans":"C","note":"答案 C。吸音需表面能讓聲波進入並在多孔材內消耗；隔音需質量、氣密與多層構造。C 以穿孔板為面材，內填玻璃棉構成穿孔板共鳴吸音構造，吸音良好，且 12 公分厚之板牆具一定質量與空腔，兼有隔音。A：RC 牆質量大、隔音佳，但表面堅硬光滑，吸音率極低。B：玻璃棉吸音佳但質輕多孔、不氣密，隔音差。D：雙面石膏板內填玻璃棉為良好隔音牆，但石膏板表面反射聲音、吸音差。【查證限制】C 之隔音性能取決於背板構造，題目未詳述，依官方答案。 【依據】建築聲學一般原理（吸音與隔音構造）"},{"c":303,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"吸音係數定義","year":106,"no":18,"art":"4-2 吸音、隔音與室內音響","q":"有關材料吸音係數的定義，下列何者錯誤？","opts":{"A":"材料吸音是指材料吸收加上透射能量","B":"材料吸音可設計空間該有的餘響時間","C":"入射聲能等於材料吸收加上透過聲能","D":"材料的吸音係數與頻率有關"},"ans":"C","note":"答案 C（錯誤）。入射聲能 Ei＝反射聲能 Er＋吸收聲能 Ea＋透過聲能 Et，C 漏了反射聲能，故錯。吸音係數 α＝(Ea＋Et)／Ei＝1－Er／Ei，即「未被反射回室內」的能量比，因此材料吸音包含吸收與透射（A ✓；課程教材p.24：所謂吸收意指沒有反射回來的部分，包含吸收量和穿透量。開著的窗 α≒1 即為此理）。B：調整吸音材料可控制室內總吸音力，依沙賓公式設計所需之餘響時間 ✓。D：材料吸音係數隨頻率而變（多孔材高頻佳、板振動低頻佳），通常以 125～4000 Hz 各頻表示 ✓。 【依據】課程教材：23 S ET 09 聲學基礎 230504 p.24～25"},{"c":304,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"低頻吸音構造","year":107,"no":15,"art":"4-2 吸音、隔音與室內音響","q":"相較於中高頻率，下列何種構造低頻的吸音率最高？","opts":{"A":"10 mm 岩棉版平貼於混凝土壁面","B":"10 mm 岩棉版背後留 200 mm 空氣層","C":"6 mm 石膏版平貼於混凝土壁面","D":"6 mm 石膏版背後留 300 mm 空氣層"},"ans":"D","note":"答（D）。薄板（石膏板、合板）背後留空氣層構成「板振動型吸音」，板材與背後空氣層（如彈簧）形成共振系統，共振頻率與板面密度及空氣層厚度之平方根成反比，空氣層愈深共振頻率愈低，故主要吸收低頻，對中高頻吸音率反而低，符合「相較中高頻、低頻吸音率最高」。（A）薄多孔材平貼，主要吸收高頻；（B）課程教材指多孔材吸音集中於中高頻，背後留 50 mm 以上空氣層可提升低頻吸音，但其中高頻吸音率仍高，低頻並非最高；\n（C）石膏板平貼於混凝土無法振動、亦非多孔材，各頻吸音率均低。 【依據】課程教材：23 S ET 09 聲學基礎p.28、p.31～32"},{"c":305,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"殘響時間特性","year":107,"no":16,"art":"4-2 吸音、隔音與室內音響","q":"有關餘響時間（殘響時間）之特性，下列敘述何者錯誤？","opts":{"A":"室容積增加，則餘響時間也變長","B":"餘響時間一般都以 1000 Hz 為代表值","C":"室內總吸音力增加，餘響時間變短，低音域餘響時間一般低於中音域餘響時間","D":"音樂廳的最佳餘響時間比演講廳長"},"ans":"C","note":"答（C）。依賽賓公式 T＝0.161V／A（V 室容積、A 總吸音力），總吸音力增加則殘響時間變短，前半句正確；但一般材料對低頻之吸音率較低，且音樂廳設計常使低音域殘響時間略長於中音域以得到溫暖感，故「低音域殘響時間一般低於中音域」錯誤。（A）由公式知 V 增加則 T 變長，正確。（D）課程教材：語音劇場約 1 秒、教室可低至 0.5 秒、交響樂可長至 2 秒，故音樂廳最佳殘響較演講廳長，正確。（B）依官方答案視為正確敘述，可理解為「中音域（500～1000 Hz）代表值」；常見教材多以 500 Hz 為代表（本題庫 113-15、114-17 即以 500 Hz 計算），本機課程教材與防音法規解說指引均未載明代表頻率【查證限制】，作答時以（C）錯誤最明確。 【依據】課程教材：23 S ET 10 室內聲學 p.8、p.10"},{"c":306,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"Sabine 餘響實驗結論","year":108,"no":16,"art":"4-2 吸音、隔音與室內音響","q":"有關室內餘響時間之量測及沙賓（Sabine）對室內餘響時間較長之室內空間所做的實驗結果，下列何者錯誤？","opts":{"A":"室內餘響時間與音源位置及測定位置無關","B":"室內餘響時間與吸音材料之裝設位置有關","C":"室內餘響時間與室內容積成正比","D":"室內餘響時間之量測時，背景噪音越低，量測越準確"},"ans":"B","note":"答案 B（錯誤）。Sabine 在擴散音場（餘響較長的室）實驗得出：餘響時間與音源及測點位置無關（A）、與吸音材料裝設位置無關，只與總吸音力有關，並與室容積成正比、與總吸音力成反比，即 T＝0.161V/A（C 正確）。故「與吸音材料裝設位置有關」與 Sabine 結論相反。D：量測需足夠的衰減動態範圍（訊號比背景噪音高出足夠分貝），背景噪音越低越準確，正確。 【依據】課程教材：23 S ET 10 室內聲學 230512 p.8"},{"c":307,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"餘響時間性質","year":108,"no":17,"art":"4-2 吸音、隔音與室內音響","q":"有關餘響時間之敘述，下列何者錯誤？","opts":{"A":"音樂廳的最佳餘響時間較演講廳長","B":"餘響時間是指聲音停止後音能量衰減為百萬分之一所需之時間","C":"相同的音樂廳，滿席時的餘響時間較空席時長","D":"室內空間的室容積愈大時，餘響時間愈長"},"ans":"C","note":"答案 C（錯誤）。聽眾（人體與衣物）吸音力大，滿席時總吸音力增加，依 T＝0.161V/A，餘響時間較空席「短」。A：音樂需豐滿感，最佳餘響時間較演講廳（重清晰度）長，正確；B：餘響時間定義為音源停止後音壓級衰減 60 dB，即音能衰減為 10⁻⁶（百萬分之一）所需時間，正確；D：吸音條件相近時，容積愈大餘響時間愈長，正確。課程教材亦指出席位是廳堂最主要的吸音來源。 【依據】課程教材：23 S ET 10 室內聲學 230512 p.8"},{"c":308,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"大空間之音響障害","year":109,"no":14,"art":"4-2 吸音、隔音與室內音響","q":"一座 2 萬席之矩形平面體育館室內無吸音處理，下列何者為最可能出現之音響障害（或稱音響障礙）？","opts":{"A":"音影","B":"音焦點或音回走","C":"回音","D":"過度音染色"},"ans":"C","note":"答案 C。2 萬席的矩形體育館屬超大型空間，相對牆面與屋頂距離很遠，室內又無吸音處理，來自後牆或高大天花的鏡面反射音延遲時間長，聽者能辨認出獨立的重複聲音，即「回音」（echo）；課程教材指出：迴音是可被辨認之獨立反射，來自大型廳堂後牆或挑高中庭天花之長延遲（＞0.1 秒）強鏡面反射，對策為擴散、吸音、斜角處理（一般延遲約 1/20 秒、路徑差約 17 m 以上即可能聽成回音，見 108-18；教材 >0.1 秒指明顯長延遲）。(A)音影是被突出物（如挑台）遮蔽而聲音難到達的區域。(B) 音迴走（creeping）與聚焦（focusing）發生於內凹曲面（圓、拱頂、橢圓、拋物線）。(D) 相對平行面或直角之間易生多重（顫動）迴音與音染色，矩形體育館之主要問題仍以大空間之長延遲迴音最顯著。 【依據】課程教材：23 S ET 10 室內聲學 230512.pdf p.20（迴走與聚焦）、p.25（迴音）、p.26（顫動迴音）"},{"c":309,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"餘響與餘響時間","year":109,"no":15,"art":"4-2 吸音、隔音與室內音響","q":"有關餘響（reverberation）的敘述，下列何者錯誤？","opts":{"A":"指聲音停止後，聲音不會立即消失的音衰過程","B":"一般將餘響時間定義為聲音停止後，音能衰減百萬分之一之時間","C":"相同室容積下，教會音樂演奏的最佳餘響時間會比一般上課教室來得長","D":"T₆₀ 表示音能衰減歷時 60 秒之意"},"ans":"D","note":"答案 D。T₆₀ 的「60」是指音壓級衰減 60 dB（音能衰減為原來的 10⁻⁶，即百萬分之一）所需的時間，單位為秒；並非衰減歷時 60 秒，故 (D) 錯誤。(A) 為餘響之定義，正確。(B) 10⁻⁶ 對應 60 dB，正確。(C) 宗教音樂、管風琴音樂需較長餘響（約 2 秒以上），教室以語言清晰度為主，最佳餘響時間約 0.6 秒上下，正確。又賽賓公式 T＝0.161V／A。（課程教材佐證：集會型空間之餘響時間目標，語音清晰之劇場約 1 秒、教室可低至 0.5 秒、交響樂可長至 2 秒。） 【依據】通用建築環境控制教材（餘響時間）；課程教材：23 S ET 10 室內聲學 230512.pdf p.10"},{"c":310,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"建築構造隔音","year":109,"no":17,"art":"4-2 吸音、隔音與室內音響","q":"有關建築構造之隔音，下列敘述何者錯誤？","opts":{"A":"使用雙層構材，儘量減少音橋現象","B":"使用氣密構造，慎重檢討構造之氣密性，利用填塞材料，減少漏音","C":"使用輕質材料，依質頻法則，面密度小，隔音值也高","D":"使用阻尼材料，利用橡膠、鉛板等附著在板構上，增加薄板構造之阻尼作用，減少共振"},"ans":"C","note":"答案 C。依質量法則（mass law，題中「質頻法則」），單層均質牆之傳音損失隨面密度與頻率增加而提高，理論式 TL ≈ 20 log（f·m）－47（112-5 同），每加倍約增 6 dB；課程教材取面密度加倍增 5 dB、頻率加倍增 6dB，所以「面密度小，隔音值也高」錯誤；要提高隔音應增加質量（重質材料）。(A) 雙層構造空氣層能提升隔音，但若有剛性連接（音橋）會使效果下降，應避免，正確。(B) 縫隙漏音會嚴重降低整體隔音，須氣密並填塞，正確。(D) 阻尼處理可抑制板材共振與吻合效應造成之隔音缺陷，正確。 【依據】課程教材：23 S ET 09 聲學基礎 p.38（質量定律：面密度加倍 +5 dB、頻率加倍 +6 dB）、p.39（共振、吻合效應）；23 S ET 11 噪音控制 p.5（輕質雙層牆）"},{"c":311,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"吸音、透射與反射係數","year":110,"no":6,"art":"4-2 吸音、隔音與室內音響","q":"某材料的入射音能為 Ii、反射音能為 Ir、吸收音能為 Ia、傳透音能為 It，有關該材料音響特性之敘述，下列何者錯誤？","opts":{"A":"吸音係數為(It+Ia)/Ii","B":"傳透係數為 It/Ii","C":"反射係數為 Ir/Ii","D":"吸音係數大的材料也會是好的隔音材料"},"ans":"D","note":"答案 D（錯誤敘述）。能量守恆 Ii = Ir + Ia + It。吸音係數 α = (Ii − Ir) / Ii = (Ia + It) / Ii（凡未被反射回入射側者皆視為被吸收）；傳透係數 τ = It / Ii；反射係數 = Ir / Ii，故 A、B、C 正確。傳透損失 TL = 10 log (1/τ)，隔音靠「質量重、密實、氣密」（質量定律）以降低 τ；吸音好的多孔輕質材料（如玻璃棉）反射少但質輕、透氣，隔音能力反而差，兩者性能並不等同。 【依據】課程教材：23 S ET 09 聲學基礎 p.24（吸收含穿透量）、p.36（透過損失 TL）、p.38（質量定律）"},{"c":312,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"亥姆霍茲共振吸音構造","year":110,"no":7,"art":"4-2 吸音、隔音與室內音響","q":"採用沖孔板搭配後側空氣層，以赫姆霍茲（Helmholtz）共振原理作為吸音構造時，下列敘述何者錯誤？","opts":{"A":"可藉由孔徑與開孔率的設計，用以吸收特定頻率的聲音","B":"相較於吸音棉等多孔材質，此吸音構造對低頻音的吸音效果較佳","C":"減少板後側空氣層的厚度可讓吸音性能的峰值往低頻移動","D":"沖孔板可選用鋼板、鋁板、膠合板或塑膠板等材料"},"ans":"C","note":"答案 C（錯誤敘述）。亥姆霍茲共振吸音（穿孔板＋背後空氣層）之共振頻率 f₀ ≈ (c / 2π) · √[ P / (D · t′) ]，其中 P 為開孔率、D 為空氣層厚度、t′ 為板厚加孔口修正。D 愈小，f₀ 愈高，吸音峰值向「高頻」移動；要讓峰值往低頻移，應「增加」空氣層厚度或降低開孔率。A 正確（孔徑、開孔率決定共振頻率）；B 正確（多孔材料吸高頻，共振構造補足中低頻）；D 板材可為鋼、鋁、木質或塑膠板，只要有適當剛性並可打孔。課程教材亦指出：多孔質吸音集中於中高頻，後加空氣層可延伸低頻吸音；空腔共振器（如赫姆茲共振器、內有空腔之穿孔覆面板）則利用頸口空氣摩擦與腔內共振吸音。 【依據】課程教材：23 S ET 09 聲學基礎 230504 p.27、p.28、p.33（吸音三類型、多孔質與空腔共振器）"},{"c":313,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"決定餘響時間之因素","year":110,"no":22,"art":"4-2 吸音、隔音與室內音響","q":"下列何者不是決定一個室內空間餘響時間的主要因素？","opts":{"A":"室容積","B":"室內吸音狀況","C":"長寬比例","D":"使用人數"},"ans":"C","note":"答案 C。賽賓（Sabine）公式 T = 0.161 · V ／ A（V 為室容積 m³，A 為室內總吸音量 m²，含各表面吸音率與面積、人及座椅等吸音量）；高頻尚須計入空氣吸收。故決定餘響時間的主因為室容積（A）、室內吸音狀況（B）及使用人數（D，人體與座椅為重要吸音量，滿場與空場餘響時間不同）。長寬比例主要影響聲音分布與音響障礙（如駐波、回音），並非餘響時間公式中的主要變數。課程教材（ET10 p.8）：餘響時間 T 與容積 V 成正比、與等價吸音面積 A 成反比，席位是教室或廳堂最主要的吸音來源。 【依據】課程教材：23 S ET 10 室內聲學 230512p.8（餘響時間與容積、吸音面積、席位）"},{"c":314,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"球面室內之音響障礙","year":110,"no":23,"art":"4-2 吸音、隔音與室內音響","q":"在一座室內為球面形體的小教堂，下列何種音響障礙（或音響障害）最可能出現？","opts":{"A":"過度染色（或遮蔽效應）","B":"音焦點（或音回走）","C":"回音","D":"多重回音（或顫動回音）"},"ans":"B","note":"答案 B。球面、圓頂等凹曲面對聲音具有聚焦作用，聲線經反射後集中於某些點（音焦點），形成該處聲音過強而其他區域聲音不足（死角）。C 回音需直達聲與反射聲到達時間差約 0.05 秒以上（路徑差約 17 m 以上），小教堂尺寸不大；D 多重回音（顫動回音）為兩片互相平行之平整硬質牆面間聲音來回反射；A 染色（coloration）為室內共振造成某些頻率被強化。故球面形體最典型的障礙為音焦點。課程教材（ET10 p.20）：音迴走（creeping）與聚焦（focusing）發生於內凹曲面如圓、拱頂、橢圓、拋物線；對策為增加反曲突出物、打破內凹面的連續性，或混入吸音材料產生擴散。 【依據】課程教材：23 S ET 10 室內聲學 230512 p.20、p.21（聲學缺陷：\n聚焦與迴走）"},{"c":315,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"多孔質吸音材料","year":111,"no":15,"art":"4-2 吸音、隔音與室內音響","q":"有關多孔質吸音材料的吸音特性敘述，下列何者錯誤？","opts":{"A":"多孔質吸音材料是因為材料中含有大量的細孔、細縫或氣泡，一般市面上所稱的吸音材料大部分屬於此類","B":"吸音原理乃依空氣運動產生摩擦而起，如毛氈、玻璃棉、岩綿等纖維質","C":"多孔質材料的吸音，主要是以細孔中的摩擦抵抗、音能的抵抗損失與粒子運動的速度壓成比例","D":"貼於壁面上時，因低頻聲音波長較大，於吸音材料處的空氣粒子速度相當大，因此吸音效果較佳"},"ans":"D","note":"答案 D（錯誤）。多孔質吸音材料靠空氣粒子在細孔內運動的摩擦損耗聲能，吸音量與粒子速度有關。材料直接貼於剛性壁面時，壁面處空氣粒子速度趨近於零，須離壁約 1/4 波長處粒子速度才最大；低頻波長長（如 100Hz 約 3.4 m），貼壁時材料所在處粒子速度很小，故低頻吸音效果差，多孔質材料一般對中高頻有效；欲增加低頻吸音，須在背後留空氣層（課程教材：多孔質「吸音集中於中高頻段，但增加使用 50 mm 以上背後空氣層可提升低頻段之吸音效果」）。A、B、C 為多孔質吸音原理的正確敘述。 【依據】課程教材：23 S ET 09 聲學基礎 p.28"},{"c":316,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"建材吸音構造類型","year":111,"no":16,"art":"4-2 吸音、隔音與室內音響","q":"依據建材吸音率之試驗結果，下列敘述何者錯誤？","opts":{"A":"厚 25 mm 岩棉吸音板屬於板狀材料系吸音構造，主要針對低音域","B":"厚 5 mm 沖孔板（開孔板），底層使用多孔質吸音材 50 mm，應用於中音域","C":"厚 9 mm 石膏板搭配後側空氣層可應用於吸收低音域","D":"劇場座椅及觀眾也具有一定程度的吸音率"},"ans":"A","note":"答案 A（錯誤）。岩棉吸音板屬多孔質（纖維質）吸音材料，主要吸收中高音域，並非板狀材料系；板（膜）狀材料系（如薄石膏板、合板）靠板體共振並配合背後空氣層，吸收低音域。B：孔板背後襯多孔質材料，為孔板／共鳴構造併多孔質，主要吸中音域 ✓。C：9 mm 石膏板＋空氣層屬板振動吸音，吸低音 ✓。D：座椅與觀眾本身有吸音力，廳堂殘響設計須計入 ✓。課程教材將吸音材分為多孔質、薄板共振材、空腔共振器三類，岩棉（礦纖）列為多孔質吸音材，薄木板、石膏板列為薄板共振材；並指出席位是廳堂最主要的吸音來源。 【依據】課程教材：23 S ET 09 聲學基礎 p.27、29、31；23 S ET 10 室內聲學 p.8"},{"c":317,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"吸音力","year":111,"no":18,"art":"4-2 吸音、隔音與室內音響","q":"有關吸音力之敘述，下列何者錯誤？","opts":{"A":"吸音力的單位為 N/m²","B":"用來代表室內空間的吸音能力","C":"依據沙賓公式（Sabine equation），吸音力越大餘響時間越短","D":"室內的傢俱也可以列入吸音力的計算"},"ans":"A","note":"答案 A（錯誤）。吸音力（等效吸音面積）A = Σ Si·αi（各表面面積 × 吸音率）＋傢俱、人員之吸音量，單位為 m²（又稱 sabin 或 m² sabin）；N/m² 是壓力單位。B ✓。C：沙賓公式 T = 0.161 V / A（V 為室容積 m³），A 愈大 T 愈短 ✓。D：傢俱、人員、座椅等也計入吸音力 ✓。（課程教材：餘響時間 T 與容積 V 成正比、與等價吸音面積 A〔m²〕成反比。） 【依據】課程教材：23 S ET 10 室內聲學 p.8"},{"c":318,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"質量法則與透過損失","year":112,"no":5,"art":"4-2 吸音、隔音與室內音響","q":"單層均質材料的隔音性能與面密度有關，在質量控制頻域下，依質量法則（Mass Law）公式推算，某單層均質材料之面密度為 20 kg/m²，於 500 Hz 中心頻率的聲音透過損失 TL（Transmission Loss），最接近多少 dB？","opts":{"A":"43","B":"33","C":"38","D":"28"},"ans":"B","note":"答案 B。質量法則（場入射常用式）：TL ≈ 20 log（f × m）－ 47（dB），m 為面密度（kg/m²），f 為頻率（Hz）。f × m ＝ 500 × 20 ＝ 10⁴，20 log 10⁴ ＝ 80，TL ≈ 80 － 47 ＝ 33 dB。C（38）約為垂直入射式 20 log（f m）－ 42.5 之 37.5；D（28）為日系音場入射實用式 18 log（f m）－ 44 之結果。課程教材 23 S ET 09 聲學基礎 p.38 只載趨勢（面密度加倍約增 5 dB、頻率加倍約增 6 dB），未列常數。【查證限制／爭議】常數依入射條件與教材而異，採 18 log（f m）－ 44 會選 D；官方答 B，即命題採 20 log（f m）－ 47。本機防音法規解說指引亦無此公式。\n【依據】課程教材：23 S ET 09 聲學基礎 p.38（質量法則趨勢）；公式常數依一般聲學教材，本機無原文"},{"c":319,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"體育館（游泳池）餘響時間","year":112,"no":8,"art":"4-2 吸音、隔音與室內音響","q":"在一座游泳池體育館中，有關體育館餘（迴）響時間的敘述，下列何者錯誤？","opts":{"A":"餘響時間的長短變化決定於聲能在空氣中傳遞的衰減情形，也就是受空氣之溫度及相對濕度高低影響","B":"為降低餘響時間，館中天花板適合採用沖孔金屬板作為吸音構造","C":"為降低餘響時間，館中側牆適合採用玻璃棉張貼作為吸音構造","D":"館中使用廣播系統的聲音清晰性能決定於館中餘響時間的長短"},"ans":"一律給分（原公告答案 C）","note":"本題考選部更正為一律給分（原公告答案 C），未公布理由，以下為整理者推測。A：餘響時間主要由室容積與總吸音量決定（Sabine：T ＝ 0.161 V／A；課程教材 23 S ET 10 室內聲學 p.8：與容積成正比、與等價吸音面積成反比），空氣吸收只在大空間、高頻時才明顯，說「決定於」空氣中之衰減並不精確；C：游泳池高濕、含氯，玻璃棉直接張貼易吸濕劣化，須有防潮面材，故 C 錯（原公告答案）；D：廣播清晰度另受背景噪音、揚聲器指向性、直達音與餘響音比例影響，「決定於」餘響時間過於絕對。B 沖孔金屬板（背填吸音材）耐濕，為合理做法。\nA、C、D 均有可議處，推測因此一律給分。【查證限制／爭議】更正理由為推測。 【依據】課程教材：23 S ET10 室內聲學 p.8（Sabine 餘響時間）；考選部更正答案公告（第 8 題一律給分）"},{"c":320,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"音樂廳回音","year":112,"no":9,"art":"4-2 吸音、隔音與室內音響","q":"有關音樂廳內的回音產生原因與解決方法的敘述，下列何者錯誤？","opts":{"A":"回音現象是發生於相同聲源的聲音到達耳朵的能量因傳遞距離不同，有先後時間遲延過多所造成","B":"鞋盒式音樂廳的優點在主要側向回音與舞台直達音之間的聲音遲延較低","C":"過多的回音在音樂廳中會有破壞音樂聆聽清晰性能的缺點，所以應提高餘響時間來校正","D":"扇形或梯田型音樂廳內避免過長的先後聲能量時間的遲延，應適當以有效天花板反射來彌補"},"ans":"C","note":"答案 C（錯誤）。回音（echo）是延遲過久的強反射聲被聽成獨立的聲音（約 50 ms 以上、路徑差約 17 m 以上即可能察覺），會破壞清晰度；矯正方法是在產生回音的反射面（後牆、弧形牆、挑高天花）做吸音、擴散或改變角度，而不是提高餘響時間，提高餘響時間只會讓聲音更混濁。A 為回音成因；B 鞋盒式廳寬度窄，側牆早期反射與直達音之時間差小，是其優點；D 扇形、梯田型廳側牆反射不足，以天花板反射補足早期反射，皆正確。課程教材 23 S ET 10 室內聲學 p.25：大廳後牆或挑高天花之長延遲（>0.1 s）鏡面反射造成迴音，對策為擴散、吸音、斜角；p.16：鞋盒形利用狹窄之平行牆面提供致密反射。 【依據】課程教材：23 S ET 10 室內聲學 p.25、p.16"},{"c":321,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"沙賓與依林餘響式","year":113,"no":13,"art":"4-2 吸音、隔音與室內音響","q":"有關沙賓（Sabine）與依林（Erying）的餘響預測式的敘述，下列何者錯誤？","opts":{"A":"沙賓的餘響式發表目的，著重於吸音材的配置與空間量大小","B":"沙賓的餘響式可用於空間環繞音效的設計","C":"依林的餘響式與沙賓的餘響式推導觀念大不相同，是採用音樂廳內聲能衰減公式理論得到的","D":"依林的餘響式增加了考量聲能在空氣吸收的情形"},"ans":"B","note":"答案 B（錯誤）。沙賓公式 T = 0.161V/A（V 為室容積 m³、A 為等價吸音面積 m²），餘響時間與容積成正比、與吸音面積成反比，用以預測餘響時間、決定吸音材配置與室容積（A ✓）；它是室內餘響（聲能線性衰減）預測式，與「環繞音效」（聲像定位、喇叭配置、音場重現）無關，故 B 錯。依林式 T = 0.161V/[−S ln(1−ᾱ)]，以聲音逐次反射、每次反射能量依 (1−ᾱ) 衰減之觀念推導，適用平均吸音率較大的空間（C 為題目之敘述方式）。\n【爭議】D：空氣吸收項 4mV 實為後人（Knudsen）之修正，可加於沙賓式或依林式；課程教材即將其寫入沙賓式T = 0.161V/(Σsα + 4mV)。故 D「依林式增加了空氣吸收」之敘述並不嚴謹，惟官方認定 D 為正確敘述、答案為 B，以官方為準。 【依據】課程教材：23 S ET 10 室內聲學 p.8（沙賓餘響式）"},{"c":322,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"平均吸音率","year":113,"no":15,"art":"4-2 吸音、隔音與室內音響","q":"某牆壁面積為 15 m²，其中包含一樘玻璃窗，面積 2.4 m²，500 Hz 吸音率為 0.1，其餘牆壁吸音率為 0.2，計算此牆壁之平均吸音率約為多少？","opts":{"A":"0.12","B":"0.15","C":"0.18","D":"0.20"},"ans":"C","note":"答案 C。平均吸音率 ᾱ = Σ(Si·αi)/ΣSi。玻璃窗 2.4 × 0.1 = 0.24；其餘牆面 (15 − 2.4) = 12.6 m²，12.6 × 0.2 =2.52；總吸音力 = 0.24 + 2.52 = 2.76；ᾱ = 2.76 ÷ 15 = 0.184 ≈ 0.18。驗算：窗佔 16%，0.16 × 0.1 + 0.84 × 0.2 = 0.016 +0.168 = 0.184 ✓。 【依據】課程教材：23 S ET 10 室內聲學 p.8（等價吸音面積 Σsα）；23 S ET 09 聲學基礎 p.27（平均吸音係數）"},{"c":323,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"牆構造隔音性能","year":114,"no":15,"art":"4-2 吸音、隔音與室內音響","q":"有關建築牆構造之隔音性能，下列敘述何者錯誤？","opts":{"A":"使用雙層構材，於中高頻率的隔音性能會提高","B":"使用雙層牆構造，實務上常利用多孔質吸音材填充芯材","C":"使用單層均質材料，依質頻法則，面密度越大，隔音值也越高","D":"中空雙層牆構造，於高頻域不會有重合效應"},"ans":"D","note":"答案 D（錯誤）。重合效應（吻合效應）是入射聲波沿板面之投影波長與板材彎曲波波長一致時，板振動加劇、隔音量下降的現象，發生於臨界頻率附近（多在中高頻域）。中空雙層牆的每一層板仍各有其重合頻率，高頻域依然會產生重合效應，只是可藉兩層採不同厚度或材料錯開重合頻率來減輕。A 正確：雙層構造在共振頻率以上之中高頻，隔音量明顯優於同質量單層。B 正確：中空層填充玻璃棉、岩棉等多孔材可抑制空腔共鳴、提高隔音。\nC 正確：質量法則，面密度加倍隔音量增加（教材取約 5 dB，理論值 6 dB），頻率加倍約增 6 dB。課程教材亦載明重合效應發生於高頻（約 1～4 kHz）、低頻則受共振影響。 【依據】課程教材：23 S ET 09 聲學基礎 p.38–39；課程教材：23 S ET 11 噪音控制 p.5"},{"c":324,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"音樂廳音質設計","year":114,"no":16,"art":"4-2 吸音、隔音與室內音響","q":"有關音樂廳室內音質之設計目標，下列何者錯誤？","opts":{"A":"音樂廳室內裝修材料設計時，使用的吸音材料愈多，有利於餘響時間之提升","B":"音樂廳室內背景噪音設計目標，推薦值為 NC15~20","C":"大型音樂廳之室內最佳餘響時間，滿席時約為 1.6~2.0 秒","D":"音樂廳室內裝修材料，於觀眾席最後排牆面以吸音材料為主"},"ans":"A","note":"答案 A（錯誤）。由沙賓公式 T＝0.161V／A，總吸音力 A 越大，餘響時間 T 越「短」；音樂廳需要較長餘響以獲得豐滿音色，故應控制吸音材用量（觀眾與座椅已提供大量吸音），吸音材愈多反而使餘響時間下降。B 正確：音樂廳要求極低背景噪音，一般建議 NC15～20。C 正確（依官方）：大型音樂廳滿席之中頻最佳餘響時間約1.6～2.0 秒（交響樂可再略長）。D 正確：觀眾席後牆距舞台最遠，反射聲延遲大易產生回聲，宜以吸音或擴散處理（課程教材：講堂、劇場常在廳堂後方牆面配置吸音材）。教材另載表演廳堂背景噪音約 NC15～NC30、交響樂餘響可長至 2 秒。 【依據】課程教材：23 S ET 10 室內聲學 p.8、p.10、p.27；課程教材：23 S ET 11 噪音控制 p.2"},{"c":325,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"沙賓公式計算","year":114,"no":17,"art":"4-2 吸音、隔音與室內音響","q":"某大學 500 席演講廳之語音清晰度規劃，室容積為 7000 m³，室內裝修吸音材與座椅吸音，在 500 Hz 頻段中，總吸音力為 1127 m²，請以沙賓（Sabine）公式計算出預期之 500 Hz 餘響時間最接近多少秒？","opts":{"A":"1.0","B":"1.5","C":"1.8","D":"2.0"},"ans":"A","note":"答案 A。沙賓公式：T＝0.161 V／A（T 秒、V 室容積 m³、A 總吸音力 m²）。代入：0.161×7000＝1127；T＝1127÷1127＝1.0 秒。驗算一：0.16×7000＝1120，0.001×7000＝7，合計 1127 ✓。驗算二：A＝0.161V／T＝1127／1.0＝1127 m² 與題給相符 ✓。數字刻意設計為整除；課程教材亦指出訴求語音清晰之劇場、講堂常以 1 秒為餘響時間目標值，結果合理。 【依據】課程教材：23 S ET 10 室內聲學 p.8、p.10；沙賓（Sabine）餘響公式"},{"c":326,"law":"聲環境","g":"聲環境","h1":"第 4 篇　聲環境","h2":"4-2 吸音、隔音與室內音響","h3":"低頻性能之構造組合","year":114,"no":18,"art":"4-2 吸音、隔音與室內音響","q":"相較於中高頻率隔音性能，下列何種構造組合，低頻的隔音性能較佳？","opts":{"A":"9 mm 矽酸鈣板平貼於混凝土壁面","B":"9 mm 矽酸鈣板背後加 9 cm 多孔性吸音材","C":"18 mm 雙層矽酸鈣板背後加 9 cm 多孔性吸音材","D":"18 mm 雙層矽酸鈣板背後留 9 cm 空氣層"},"ans":"D","note":"答案 D。官方答案之邏輯為「板振動型吸音」：板材背後留空氣層時，板與空氣層構成質量—彈簧系統，在低頻共振頻率附近吸收聲能（板越重、空氣層越深，共振頻率越低），故 D 以低頻為主要作用頻帶。B、C 背後填多孔性吸音材，多孔材主要吸收中高頻（課程教材：多孔質吸音集中於中高頻段；薄板共振吸音材則在低頻有強吸音）；A 板平貼於混凝土牆，無背後空氣層，無法形成板振動，低頻作用最差。【查證限制／爭議】題目用語為「隔音性能」，但各選項比較的是貼附於牆面之裝修構造，其差異實為「吸音」之頻率特性；若以隔音（傳音損失）而論，空腔填吸音材（C）通常較佳。以官方答案 D 為準。 【依據】課程教材：23 S ET 09 聲學基礎 p.27–28、p.31–32"},{"c":327,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"受水槽設置","year":102,"no":38,"art":"5-1 給水設備","q":"有關給水設備受水槽之設置要點敘述，下列何者正確？","opts":{"A":"受水槽應設置於地面下或地板下或筏基內，其四周構造應與構造物分開","B":"受水槽的頂面應設置清掃用的人孔，人孔蓋直徑應在 45 公分以下","C":"受水槽容量不得大於重力水槽之容量，一般建議以 1/3 日～1 日之用水量設計","D":"受水槽底面應設清洗用洩水閥及止水閥，並留設洩水坡度及排水溝以利排水"},"ans":"D","note":"答案為 D。102 年考試時適用之設備編（101 年 11 月 7 日版）第 31 條第 5 款規定「水箱底應設清洗用之洩水管及止水閥」（該條 102 年 11 月 28 日修正刪除）；自來水用戶用水設備標準第 6 條另規定池底設 1/50 以上洩水坡（教材 p.27 同），故 D 正確。A 錯：受水槽應設於樓板之上、六面可自外部檢查，不得兼作建築構造（規範3.2.1），池底需與基礎分離（標準第 6 條），不可設在筏基內。B 錯：人孔應能讓人員出入（規範 3.2.2 說明(3)），限 45 公分以下不合理。C 錯：法規只規定蓄水池容量≧設計用水量 2/10、與水塔合計 4/10～2 日用水量（標準第 6 條、規範 3.2.3），無「不得大於重力水槽」之規定；一般設計受水槽取 1/2 日（教材 p.24、規範附錄1.2），高架水槽約 1/10 日（教材 p.28），受水槽通常較大。 【依據】建築技術規則建築設備編第 31 條第 5 款（101 年 11 月 7 日版；102 年 11 月 28 日修正刪除）；自來水用戶用水設備標準第 6 條；建築物給水排水設備設計技術規範 3.2.1～3.2.3、附錄 1.2；課程教材：10 建築給水設備 p.24～28"},{"c":328,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"熱水供給系統","year":103,"no":20,"art":"5-1 給水設備","q":"有關國內建築物熱水設備之敘述，下列何者正確？","opts":{"A":"局部式熱水供給系統適用於大規模建築物，中央式熱水供應系統適用於較小規模之建築物","B":"採用熱泵設備系統可同時供給熱水及冷氣，特別適用於辦公類建築","C":"中央式熱水供水系統，採用向上式熱水配管，貯熱水槽可以設置於最下層或最上層","D":"建築物熱水供給量可依使用人員數推算，熱水供給量原則上是以供給 80℃熱水之量表示之"},"ans":"C","note":"答案 C。建築物給水排水設備設計技術規範附錄 4.2 管路配置方式列有「向上式熱水配管（貯熱水槽設置於最下層）」與「向上式熱水配管（貯熱水槽設置於最上層）」圖例，故 C 正確。A 錯：同附錄 4.1，局部式適用於小規模建築物，中央式適用於較大規模建築，敘述顛倒。B 錯：熱泵可同時產生熱水與冷氣，但辦公建築熱水需求少，較適用於旅館、醫院、宿舍等冷熱同時需求大者。D 錯：附錄 2.1 第 3 點，熱水供給量原則上以供給 60℃熱水之量表示。課程教材亦載中央熱水系統適用於醫院、旅館、宿舍等大規模建築，配管方式有向上式及向下式，熱水一般以 60℃為限。 【依據】建築物給水排水設備設計技術規範附錄 2.1、4.1、4.2；課程教材：11 建築熱水設備p.3、p.9、p.10"},{"c":329,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"受水槽設置","year":104,"no":20,"art":"5-1 給水設備","q":"有關自來水受水槽之設置，下列何者錯誤？","opts":{"A":"設於筏式基礎之內，受水槽周圍澈底防水","B":"受水槽之上下左右側皆須與周圍構造物保持可維護距離","C":"設置溢流口與開放式排水口空間","D":"受水槽應設置人孔，方便日常維修"},"ans":"A","note":"答案 A。自來水用戶用水設備標準第 6 條第 3 項（96 年 2 月 13 日版；現行 105 年版為第 4 項）：蓄水池之牆壁及平頂應與其他結構物分開，並保持四十五公分以上之距離；池底需與接觸地層之基礎分離。受水槽若設在筏式基礎內，與建築結構共用壁體，地下水、污水可能滲入污染飲用水且無法六面檢查，故 A 錯（教材圖示亦標註外牆有污染物質滲透之虞）。B 正確：六面須留維護空間。C、D 正確：同條第 1 項規定應設人孔、通氣管及溢排水設備，溢流管末端須有排水口空間（間接排水）防止回流。 【依據】自來水用戶用水設備標準第 6 條（96 年 2 月13 日版第 1、3 項；現行 105 年 6 月 6 日版第 1、4 項）；課程教材：10 建築給水設備 p.25–26"},{"c":330,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"給水壓力與用水量","year":105,"no":19,"art":"5-1 給水設備","q":"關於給水設備之敘述，下列何者錯誤？","opts":{"A":"建築物之最高容許水壓，約在 1～3 kg/cm² 之間","B":"臺灣高層建築物通常會以 50 m 以內之高程做為給水垂直區劃","C":"辦公室每人每日用水量 100～120 ℓ","D":"一般建築物之受水槽容量常取每日用水量之 1/2 倍來設計"},"ans":"A","note":"答案 A（錯誤）。課程教材：最小使用水壓約 0.3～0.7 kg/cm²，最大容許水壓約 4.0～5.0 kg/cm²，「1.0～3.0kg/cm²」是適用水壓，A 把適用水壓當成最高容許水壓。數值差異說明：建築物給水排水設備設計技術規範 3.4.6 規定一般給水壓力超過 3.5 kg/cm² 時應設中間水槽或減壓閥，比教材的 4.0～5.0 kg/cm² 嚴格（教材 p.15 引台灣自來水公司作業要點，則以給水器承受壓力超過 5 kg/cm² 設減壓閥）；實務設計以規範 3.5 kg/cm² 為準。無論採哪一個數值，最高容許水壓都高於 3 kg/cm²，A 都是錯的。B：教材載辦公建築以 50 m、公寓飯店以 35 m 作一給水分區（自來水公司作業要點：住宅及旅館最大水頭 35 m、辦公處所及公共場所 50 m），正確。C：教材用水量表載事務所、辦公廳每人每日平均用水量 100～120 ℓ，正確。D：教材載受水槽以 3/10 日～1 日用水量設計，通常取 1/2 日，規範附錄 1.2 亦以 1 日使用水量之 1/2 計算，正確（規範 3.2.3 之 2/10 是法定下限，與一般設計值 1/2 不衝突）。\n【依據】課程教材：10 建築給水設備 p.10、p.13、p.15、p.19、p.24；建築物給水排水設備設計技術規範 3.4.6、3.2.3、附錄 1.2"},{"c":331,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"配管計畫一般要項","year":105,"no":20,"art":"5-1 給水設備","q":"下列關於配管計畫之敘述，何者錯誤？","opts":{"A":"因給水管、熱水管之熱脹冷縮，而有使配管或其他機器受到損傷之顧慮時，應設置伸縮管接頭、伸縮曲管以防止之","B":"發生水錘作用時，或有發生水錘作用之可能性時，應裝設空氣室等裝置以防止之","C":"給水管之配管不得使空氣產生滯留，必要時應設置排氣閥等裝置防止之，但熱水管不在此限","D":"接續器具的管徑，原則上與接續器具之口徑相同，並不得小於器具之口徑"},"ans":"C","note":"答案 C（錯誤）。建築物給水排水設備設計技術規範 2.1.2 說明「配管計畫應注意之一般要項」第 (4) 點：給水管、熱水管之配管，不得使空氣產生滯留，必要時應設置排氣閥等裝置防止之。熱水管加熱後溶解空氣析出更多，更需排氣，並無「熱水管不在此限」之例外。A 為同說明第 (2) 點、B 為第 (3) 點、D 為第 (7) 點，與原文相符。 【依據】建築物給水排水設備設計技術規範 2.1.2 說明 (2)(3)(4)(7)"},{"c":332,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"熱水使用量計算參數","year":106,"no":20,"art":"5-1 給水設備","q":"有關熱水設備容量，計算一日熱水使用量與一小時最大熱水使用量，下列參數何者錯誤？","opts":{"A":"熱水使用人員數","B":"依建築物類別每人每日之熱水使用量","C":"一小時熱水使用量和一日熱水使用量之比","D":"給水設備器具數量及建築物有效面積"},"ans":"D","note":"答案 D（錯誤）。建築物給水排水設備設計技術規範附錄 2.1 第 7 點：由熱水供給對象人員數計算，Qd＝N×qd（N 熱水供給對象人員數＝選項 A；qd 每人每日熱水供給量，依建築物種類查表 A-18＝選項 B），Qhm＝Qd×qh（qh 每一小時熱水供給量最大值對一日使用量之比＝選項 C）。以器具法計算時為 Qhm＝Σ(q×n×α)×k1，用的是「熱水」器具之種類、個數、使用次數與同時使用率。D 之「給水設備器具數量及建築物有效面積」為冷水給水量推估所用參數（附錄表 A-1 以有效面積推算人數），非熱水量計算參數。課程教材 p.7 同樣列出兩法：依使用人數 Q＝N×q（l/day）、依熱水器具數 Q＝X×P×O（l/hr）。 【依據】建築物給水排水設備設計技術規範附錄 2.1第 7 點（表 A-18～A-20）、附錄表 A-1；課程教材：11 建築熱水設備 p.7"},{"c":333,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"給水方式","year":106,"no":21,"art":"5-1 給水設備","q":"關於給水方式之敘述，下列何者錯誤？","opts":{"A":"外部自來水直接接管方式適合於三樓以下建築物使用","B":"壓力水槽方式使建物無屋頂突出物，立面造型美觀","C":"重力給水方式適用於一般建築","D":"加壓泵給水方式適用於高層建築"},"ans":"D","note":"官方答案 D。推測出題依據為常見教科書之給水方式比較表（未見於本機教材）：直接給水—約三樓以下小規模建築；重力（高置水槽）給水—一般建築至高層（高層另設中間水槽分區），水壓穩定；壓力水槽—免屋頂水槽、立面美觀；加壓泵直送—多列為中小規模或低層廣闊之建築。依此，D「加壓泵適用於高層建築」被判為錯誤敘述。A：直接給水受自來水幹管水壓限制，技術規範第 3.1.1 款說明(4) a 目稱「適用於一般小規模之建築物」，實務約三樓以下（視幹管水壓而定）✓。B：同款 b 目，壓力水槽適用於「景觀上不能採用重力給水之場所」，免設屋頂水槽 ✓。C：同款 c 目，重力給水「適用於一般建築物及較大規模之給水設備」✓。【查證限制／爭議】本題 D依現行技術規範並非錯誤：第 3.1.1 款說明(4) d 目明載加壓泵給水「適用於無法採用重力給水之高層建築，或低層且敷地廣闊之場所」，第 3.4.5 款說明(4) 亦稱超高層建築分區供水可用抽水機直接加壓而不設中間水槽。複查判斷：四個選項依規範均可成立，D 只是「主要適用對象不是高層」的教科書觀點，屬命題有瑕疵；考試仍以官方答案 D 作答，記法為「高層建築首選重力給水（加中間水槽），加壓泵直送多為中小規模或低層廣闊建築」。課程教材 p.21～23 只列四種給水方式與系統圖，未載適用樓層。 【依據】建築物給水排水設備設計技術規範第 3.1.1 款說明(4) a～d 目、第 3.4.5 款說明(4)；課程教材：10 建築給水設備 p.21～23（四種給水方式，未載適用樓層）"},{"c":334,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"熱水器配管節能","year":106,"no":39,"art":"5-1 給水設備","q":"於住宅中安裝瓦斯熱水器時，下列那種方式比較節省能源及降低熱損失？","opts":{"A":"配管埋設在牆壁之內，由牆壁保溫","B":"配管距離短且在熱水管上包覆保溫材料","C":"採用不容易降溫的 PVC 管或塑膠管之配管","D":"將熱水器安裝於室內，節省配管距離"},"ans":"B","note":"答案 B。熱水管熱損失與管長及管壁散熱成正比，縮短配管距離並包覆保溫材，可減少放冷水等待時間與散熱損失，最節能。A：牆體（RC、磚）導熱與蓄熱大，並非保溫材，埋設反而散熱至牆體且難維修。C：一般 PVC管耐熱性不足，不適用熱水管；課程教材 p.23 所列熱水配管材料為白鐵管（鍍鋅鐵管）、不銹鋼管、碳鋼管、銅管、黃銅管，保溫材料為岩綿、玻璃纖維、矽酸鈣、泡沫聚苯乙烯等，可見降低熱損失靠的是保溫材而非管材本身。D：瓦斯熱水器（尤其屋外式）裝於室內通風不良處易致一氧化碳中毒（課程教材 p.35：務必要有良好通風，防範一氧化碳中毒），不可為了縮短配管而違反安全設置原則；建築技術規則建築設備編第 90 條第 3 款亦規定燃氣熱水器之裝置應符合燃氣設備相關規定。 【依據】課程教材：11 建築熱水設備 p.23（配管材料與保溫材料）、p.35（通風與一氧化碳）；建築技術規則建築設備編第 90 條"},{"c":335,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"給水方式與限水","year":107,"no":18,"art":"5-1 給水設備","q":"下列那一種給水系統最不易因分區輪流供水而影響日常生活的用水？","opts":{"A":"壓力水櫃方式","B":"高架水槽方式","C":"自來水直結方式","D":"泵直接給水方式"},"ans":"B","note":"答（B）。分區輪流供水（限水）時自來水管網停水或水壓不足。高架水槽方式由自來水先進入受水槽，再以揚水泵送至屋頂高架水槽，以重力向下供水；受水槽與高架水槽兩段蓄水（教材與規範附錄 1.2：受水槽一般以1/2 日用水量設計，法定下限為 2/10〔規範 3.2.3〕；高架水槽約 1 日用水量 1/10），限水時段仍可用蓄存水量，且高架水槽靠重力供水，停電時亦可短暫供水，最不易影響日常用水。（A）壓力水槽方式雖有受水槽，但壓力水槽有效容積小（教材圖例約 40%），須靠泵與壓縮空氣維持；（C）直結方式無蓄水，停水即斷水，最受影響；\n（D）泵直接給水依賴泵連續加壓，停電即無法供水。 【依據】課程教材：10 建築給水設備 p.21～24、p.28；建築物給水排水設備設計技術規範 3.2.3、附錄 1.2"},{"c":336,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"受水槽構造規定","year":107,"no":21,"art":"5-1 給水設備","q":"依據建築物給水排水設備設計技術規範，有關受水槽、屋頂水槽或水塔之規定，下列敘述何者錯誤？","opts":{"A":"應設置適當之人孔、通氣管及溢流排水設備","B":"槽（塔）底應設置 1/50 之洩水坡","C":"受水槽之牆壁與平頂應與其他結構物分開，並應保持至少 30 公分之人員維修空間","D":"受水槽之進水管徑應大於 50 mm"},"ans":"C","note":"答（C）。建築物給水排水設備設計技術規範 3.2.2：受水槽、屋頂水槽或水塔應設置適當之人孔、通氣管及溢排水設備（A 正確）；槽（塔）底並應設坡度為 1/50 以上之洩水坡（B 正確）；受水槽之牆壁及平頂應與其他結構物分開，並應保持至少「60 公分」之人員維修空間（與結構柱緊臨時至少 45 公分），故（C）「30 公分」錯誤。（D）3.2.4 規定進水口低於地面之受水槽，其進水管口徑 50 公釐以上者應設地上式接水槽或持壓閥、定流量閥，選項係此條之簡化敘述（規範並非要求管徑一律大於 50 mm），依官方答案視為正確。另考試當時有效之自來水用戶用水設備標準（105 年 6 月 6 日修正）第 6 條第 1 項亦規定蓄水池與水塔應設人孔、通氣管及溢排水設備、池底設 1/50 以上洩水坡，第 4 項規定蓄水池牆壁及平頂應與其他結構物保持「45 公分以上」距離，第 5 項規定進水口低於地面之蓄水池受水管口徑 50 公厘以上者應設地上式接水槽或持壓閥；無論依規範或該標準，維修距離均非30 公分。【查證限制】本機技術規範檔應為 109 年 7 月 10 日台內營字第 1090811791 號令修正版（PDF 建立於 2020年 7 月，含該次修正之 4.3.16 吸氣閥規定），未取得 107 年考試當時版本逐字核對。 【依據】建築物給水排水設備設計技術規範 3.2.2、3.2.4；自來水用戶用水設備標準第 6 條第 1 項、第 4 項、第 5 項；課程教材：10 建築給水設備 p.28"},{"c":337,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"省水標章規格","year":108,"no":19,"art":"5-1 給水設備","q":"下列何項設備未達省水標章之規格？","opts":{"A":"一段式馬桶每次沖水量在 6 公升以下","B":"兩段式馬桶小號沖水量在 4 公升以下","C":"感應式水龍頭每分鐘流量介於 0.5 公升至 9 公升之間","D":"蓮蓬頭每分鐘流量介於 5 公升至 10 公升之間"},"ans":"B","note":"答案 B。依省水標章各項產品項目及規格標準：兩段式馬桶普級「大號 6.0 公升以下，小號 3.0 公升以下」（金級大號 4.8、小號 3.0 公升以下），小號 4 公升超過 3 公升，未達標準。A：一段式馬桶普級每次 6.0 公升以下，符合；C：感應式水龍頭每分鐘流量最大不得超過 9.0 公升、不得小於 0.5 公升，符合；D：蓮蓬頭每分鐘流量不得小於 5.0 公升、普級 10.0 公升以下，符合。（本機為 114 年修正之現行附件，108 年當時條文本機未存；以上數值與題目選項設定一致。） 【依據】省水標章管理辦法附件「省水標章各項產品項目及規格標準」二、三、五、七點"},{"c":338,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"給水壓力","year":108,"no":20,"art":"5-1 給水設備","q":"有關建築物給水系統之敘述，下列何者錯誤？","opts":{"A":"給水器具最低使用水壓約在 0.3~0.7 kg/cm²","B":"10 公尺高的水槽，底部水壓力即為 10 水頭","C":"給水器具最高使用水壓約在 6.0~7.0 kg/cm²","D":"水壓過高易造成水槌現象"},"ans":"C","note":"答案 C（錯誤）。課程教材：最小使用水壓約 0.3～0.7 kg/cm²、最大容許水壓約 4.0～5.0 kg/cm²（表列最高水壓：住宅飯店 3.0～4.0、公寓 3.5～4.0、辦公 4.0～5.0），適用水壓 1.0～3.0 kg/cm²；建築物給水排水設備設計技術規範 3.4.6 亦規定給水壓力超過 3.5 kg/cm² 應設中間水槽或減壓閥。故 6～7 kg/cm² 錯誤。A 與教材相同（法規面：自來水用戶用水設備標準第 13 條水栓不得低於 0.3、沖洗閥不得低於 1 kg/cm²）；B：教材「10 m 高水槽底部水壓即 10 水頭＝1.0 kg/cm²」；D：教材「水壓過高極易造成水錘」，均正確。 【依據】建築物給水排水設備設計技術規範 3.4.4、3.4.6；自來水用戶用水設備標準第 13 條；課程教材：10 建築給水設備 p.10–12"},{"c":339,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"各類建築每人每日用水量","year":109,"no":18,"art":"5-1 給水設備","q":"下列何種建築用途之每人每日用水量最大？","opts":{"A":"旅館客房","B":"劇場","C":"小學","D":"辦公室"},"ans":"A","note":"答案 A。建築物給水排水設備設計技術規範附錄 1.1 表 A-1「各類別建築物每人之給水量」：旅館、飯店 250～300 L／人·日；辦公室 100～120 L；中、小學校 40～50 L；劇場 30 L（每一座位）。以旅館客房最大（含盥洗、沐浴、洗衣、清潔等用水）。 【依據】建築物給水排水設備設計技術規範 附錄 1.1 表 A-1"},{"c":340,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"水錘（水擊）現象","year":109,"no":21,"art":"5-1 給水設備","q":"有關容易發生水槌現象（水擊現象），下列敘述何者錯誤？","opts":{"A":"配管轉彎處","B":"泵浦揚水管容易引起水柱分離（cavitation）處","C":"管內壓力低或流速較小處","D":"水流經常瞬間開啟或關閉者"},"ans":"C","note":"答案 C。水錘（水擊）是管內流動的水因閥門、水栓急速關閉或泵浦突然停止而驟然減速，動能轉為壓力波所造成之衝擊與噪音，因此多發生在「流速大、壓力高」且流動被急遽改變處。(C)「管內壓力低或流速較小處」不易發生，錯誤。(A) 配管轉彎處水流方向改變，易產生衝擊。(B) 泵浦停止後揚水管內水柱因慣性分離再回撞（水柱分離，cavitation 現象），易引起水錘。(D) 水流經常瞬間開啟或關閉（如自動沖水閥、快閉閥）最易發生。防止方法：裝空氣室或水錘吸收器、限制流速、降低水壓（建築物給水排水設備設計技術規範 3.4.8；給水壓力超過 3.5kg/cm² 時應設中間水槽或減壓閥，3.4.6）。（課程教材佐證：管內水流速急驟改變時，水動能快速變化使水壓急速升降，稱為水錘現象；防止方法為控制給水水壓、設空氣室／緩衝器，並於揚水泵出水口設逆止閥。） 【依據】建築物給水排水設備設計技術規範 3.4.5、3.4.6、3.4.8；課程教材：10 建築給水設備.pdf p.34"},{"c":341,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"受水槽最低容量","year":110,"no":8,"art":"5-1 給水設備","q":"依建築物給水排水設備設計技術規範，某棟 12 層集合住宅，共有 64 戶，每戶假設以 5 人居住，每人每日用水量為250 公升，設計受水槽之容量（m³）最低不得小於多少？","opts":{"A":"16","B":"40","C":"80","D":"160"},"ans":"A","note":"答案 A。設計用水量 = 64 戶 × 5 人 × 250 L = 80,000 L/日 = 80 m³/日。技術規範 3.2.3：「受水槽容量應為設計用水量 2/10 以上」（自來水用戶用水設備標準第 6 條第 2 項同），題目問「最低不得小於」，故最低容量 = 80 ×2/10 = 16 m³。B 40 m³ 為 1/2 日量，是規範附錄 1.2（Va＝½ Qd，可依供水情形酌予增減）與課程教材（10 建築給水設備 p.24：3/10～1 日，通常 1/2 日）的一般設計值，不是法定下限；兩者並不矛盾，法規訂下限，附錄與教材給常用設計值。C 80 m³ 為 1 日量；D 160 m³ 為 2 日量（受水槽與屋頂水槽合計之上限）。 【依據】建築物給水排水設備設計技術規範 3.2.3、附錄 1.1（表 A-1）與 1.2；自來水用戶用水設備標準第 6 條第 2 項；課程教材：10 建築給水設備 p.24"},{"c":342,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"建築物給水系統之壓力","year":110,"no":24,"art":"5-1 給水設備","q":"關於建築物給水系統，下列敘述何者錯誤？","opts":{"A":"一般水栓所需最低水壓為 0.3 kg/cm²","B":"重力給水水槽，距離給水器具之高度，每增加一公尺，器具水壓力增加 0.1 kg/cm²","C":"給水器具適用水壓約在 6.0～7.0 kg/cm²","D":"50 公尺高的辦公建築物，應設中間水槽或減壓閥"},"ans":"C","note":"答案 C（錯誤敘述）。技術規範 3.4.4：水栓及衛生設備供水水壓不得低於 0.3 kg/cm²（特殊裝置或採直接沖洗閥者不得低於 1.0 kg/cm²），故 A 正確；3.4.6：一般給水壓力超過 3.5 kg/cm² 時應設中間水槽或減壓閥（這是須分區減壓的臨界值，不是「適用水壓」；適用水壓依教材為 1.0～3.0 kg/cm²），6～7 kg/cm² 遠過高，易產生噪音、水錘與設備損壞，C 錯誤。B 正確：1 m 水頭 ≈ 0.1 kg/cm²；D 正確：50 m 高落差下層水壓約 5 kg/cm² > 3.5，須分區（設中間水槽或減壓閥）。課程教材（10 建築給水設備 p.10）亦稱最小使用水壓約 0.3～0.7 kg/cm²、最大容許水壓約 4.0～5.0 kg/cm²、適用水壓在 1.0～3.0 kg/cm²，6～7 kg/cm² 超出適用範圍。 【依據】建築物給水排水設備設計技術規範 3.4.4、3.4.6；課程教材：10 建築給水設備 p.10（最低、最高與適用水壓）"},{"c":343,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"蓄水池（受水槽）設置","year":111,"no":20,"art":"5-1 給水設備","q":"有關給水設備之設置，下列何者錯誤？","opts":{"A":"蓄水池應設於地面上或地板上，其四周構造應與其他結構物分開不得連接","B":"蓄水池的頂面應設置清掃用的人孔及通氣管，人孔周圍應有突起的邊緣，以避免清掃時的污水侵入","C":"蓄水池應設溢流管，管口應加設防蟲網，溢流管的排水量應和受水量相當，並採用直接排水方式","D":"蓄水池底面應設清洗用洩水管及止水閥，並保持適當之斜度或排水溝以利排水"},"ans":"C","note":"答案 C（錯誤）。蓄水池溢流管應採「間接排水」（與排水系統斷開，留有空氣間隙，防止污水回流污染），技術規範 4.5.7(5) 明定「各式蓄水池之溢流及排水」應行間接排水；另 3.5.11 規定溢流管徑應為揚水管徑之二倍以上，且不能有閥。A：受水槽應設置於樓板之上，其構造任何部位不得兼作建築構造之一部分，牆壁及平頂應與其他結構物分開（3.2.1、3.2.2；自來水用戶用水設備標準第 6 條第 4 項）✓。D：槽底設 1/50 以上洩水坡、排水管應由水槽底部引出（3.2.2、3.5.11）✓。B：3.2.2 規定應設置適當之人孔、通氣管；人孔周圍設突起邊緣為一般防污染做法（條文未明列）✓。 【依據】建築物給水排水設備設計技術規範 3.2.1、3.2.2、3.5.11、4.5.7(5)；自來水用戶用水設備標準第 6 條"},{"c":344,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"給水管路水壓試驗","year":111,"no":21,"art":"5-1 給水設備","q":"依據建築物給水排水設備設計技術規範，給水管路全部或部分完成後應加水壓試驗，其試驗水壓不得小於多少kg/cm²？","opts":{"A":"5","B":"10","C":"15","D":"20"},"ans":"B","note":"答案 B（10 kg/cm²）。技術規範 3.5.16：用戶給水管線裝妥，在未澆置混凝土之前，自來水管承裝商應施行壓力試驗，試驗壓力不得小於 10 kg/cm²，並應保持 60 分鐘而無滲漏為合格；說明載明係參照「自來水用戶用水設備標準」訂定，該標準第 31 條即規定試驗水壓為每平方公分十公斤、試驗時間六十分鐘以上不漏水為合格。建築技術規則設備編第 28 條亦規定給水、排水及通氣管路完成後應依該技術規範進行耐壓試驗。 【依據】建築物給水排水設備設計技術規範 3.5.16；自來水用戶用水設備標準第 31 條；建築技術規則建築設備編第 28 條"},{"c":345,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"受水槽與中間水槽之設置","year":112,"no":21,"art":"5-1 給水設備","q":"根據建築物給水排水設備設計技術規範，有關儲水設備設置之敘述，下列何者錯誤？","opts":{"A":"直接與公共自來水系統接管之水池容器設備，稱為受水槽","B":"為減壓或是加壓目的而設置於各區劃樓層之水池，稱為中間水槽","C":"受水槽之牆壁及平頂應與其它結構物分開，並保持至少 60 cm 人員維修空間","D":"受水槽之設計容量應有設計每日用水量 1/10 以上容量"},"ans":"D","note":"答案 D（錯誤）。建築物給水排水設備設計技術規範 3.2.3：受水槽容量應為設計用水量 2/10 以上；「設計每日用水量 1/10 以上」是屋頂水槽（水塔）之容量規定，D 把屋頂水槽的數值套到受水槽，錯誤。A、B 為同點說明(1)(2)之受水槽、中間水槽定義；C 為 3.2.2（牆壁及平頂與其他結構物分開，保持至少 60 公分維修空間，緊臨結構柱時至少 45 公分）。自來水用戶用水設備標準第 6 條第 2 項亦規定蓄水池容量為設計用水量十分之二以上。課程教材 10 建築給水設備 p.25（槽周 ≧60 cm）、p.28（高架水槽約 1 日用水量 1/10）數值一致；教材 p.24 所引「設備編第 31 條」（水泵應自受水槽抽水）已於 102 年 11 月 28 日修正刪除（103 年 1 月 1 日施行），內容改見規範3.4.7，故不引用該條。 【依據】建築物給水排水設備設計技術規範 3.2.2、3.2.3、3.4.7；自來水用戶用水設備標準第 6 條第 2 項；課程教材：10 建築給水設備 p.24、p.25、p.28"},{"c":346,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"給水壓力臨界標準","year":113,"no":5,"art":"5-1 給水設備","q":"下列何者是高層建築物設置中間水槽或減壓閥的給水壓力（kg/cm²）臨界標準？","opts":{"A":"1.5","B":"3.5","C":"7","D":"15"},"ans":"B","note":"答案 B（3.5 kg/cm²）。建築物給水排水設備設計技術規範 3.4.6：建築物一般給水壓力，超過 3.5 kg/cm² 之限度時，應設置中間水槽或減壓閥等，以調整給水壓力（說明：建築物甚高而不分區時，下層給水壓力過大，易生噪音、振動、水錘等弊害）。課程教材亦說明高層建築以每分區一中間水槽或減壓閥減壓（公寓、飯店約 35 m 一區，35 m 水頭≒3.5 kg/cm²）。A 1.5 落在器具適用水壓 1.0～3.0 kg/cm² 之內，不需減壓；C 7、D 15 遠超過器具最大容許水壓（約 4.0～5.0 kg/cm²）。 【依據】建築物給水排水設備設計技術規範 3.4.6；課程教材：10 建築給水設備 p.10、p.12～13"},{"c":347,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"給水水壓","year":113,"no":24,"art":"5-1 給水設備","q":"有關給水水壓，下列敘述何者錯誤？","opts":{"A":"給水器具適用水壓為 1.0～3.0 kg/cm²","B":"沖刷式大便器所需最低壓力為 1.0 kg/cm²","C":"蓮蓬頭所需最高壓力為 0.7 kg/cm²","D":"住宅最高水壓為 3.0～4.0 kg/cm²"},"ans":"C","note":"答案 C（錯誤）。課程教材「給水器具所需之最低壓力及最高容許水壓」表：蓮蓬頭（shower）所需「最低」壓力為 0.7 kg/cm²，並非最高壓力，故 C 錯。A：教材「適用水壓在 1.0～3.0 kg/cm² 之間」✓（最小使用水壓約0.3～0.7、最大容許水壓約 4.0～5.0）。B：同表沖刷式大便器（沖水閥）所需最低壓力 1.0 kg/cm² ✓；法規面，自來水用戶用水設備標準第 13 條第 1 項及建築物給水排水設備設計技術規範 3.4.4：水栓及衛生設備供水水壓不得低於 0.3 kg/cm²，因特殊裝置需要高壓或採用直接沖洗閥者，不得低於 1 kg/cm²。D：同表最高水壓住宅、飯店 3.0～4.0 kg/cm²（公寓 3.5～4.0、辦公建築 4.0～5.0）✓。 【依據】課程教材：10 建築給水設備 p.10、p.11（器具最低壓力及最高容許水壓表）；自來水用戶用水設備標準第 13 條第 1 項；建築物給水排水設備設計技術規範 3.4.4"},{"c":348,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"省水標章","year":113,"no":25,"art":"5-1 給水設備","q":"根據省水標章管理辦法，下列敘述何者錯誤？","opts":{"A":"省水標章圖樣，普級採藍色標準色，金級採金色標準色","B":"兩段式省水馬桶，普級大號須在 4.8 公升以下，小號須在 3.0 公升以下","C":"感應式水龍頭，每分鐘流量最大不得超過 9.0 公升，亦不得小於 0.5 公升","D":"沖水小便器，金級每次沖水量須在 1.5 公升以下，普級須在 3.0 公升以下"},"ans":"B","note":"答案 B（錯誤）。省水標章管理辦法附件第三點（兩段式省水馬桶）(二)：金級大號須在 4.8 公升以下、小號3.0 公升以下；普級大號須在 6.0 公升以下、小號 3.0 公升以下。題目把金級大號 4.8 誤植為普級。C：附件第五點（感應式水龍頭）(二)：每分鐘流量最大不得超過 9.0 公升，亦不得小於 0.5 公升 ✓。D：附件第八點（沖水小便器）(二)：金級每次沖水量 1.5 公升以下、普級 3.0 公升以下 ✓。A：辦法第 2 條第 2 項「省水標章圖樣與使用規定如附圖」，圖樣普級藍色、金級金色為官方認定之正確敘述。【查證限制】本機法規 PDF 未含附圖，標準色之色號未能核對，故不列色號。 【依據】省水標章管理辦法附件「省水標章各項產品項目及規格標準」第三點(二)、第五點(二)、第八點(二)；同辦法第 2 條第 2 項（附圖，本機未含）"},{"c":349,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"住宅熱水設備節能","year":113,"no":29,"art":"5-1 給水設備","q":"某棟 3 層樓透天住宅規劃熱水設備時，基於節能減碳下列那一項不是優先考量的重點？","opts":{"A":"採用瓦斯即熱式熱水器，可產出較多的熱值以縮短加熱時間","B":"採用儲備型電熱水器，可減少熱水再加熱時間隨時供應熱水","C":"儘量縮短熱水器與蓮蓬頭距離，以減少管路輸送的損耗","D":"安裝輸送水管的保溫材，可減少管路熱能的流失"},"ans":"B","note":"答案 B（不是優先考量）。儲備型電熱水器須讓儲熱槽內的熱水持續保溫，待機時有散熱損失；為了「隨時供應熱水」而反覆再加熱，加上以電能加熱時發電端的轉換損失，一次能源效率偏低，不符合節能減碳的優先方向。其餘三項都是可採用的作法：A 瓦斯即熱式熱水器即開即熱、沒有儲槽待機散熱損失，熱值大可縮短加熱時間；C 縮短熱水器至蓮蓬頭的距離，可減少管路散熱及等熱水時放掉的冷水（課程教材：局部式熱水系統配管短、熱損失小）；D 輸送水管加裝保溫材，可減少管路熱損失（教材列保溫材料以減少熱損）。【查證限制】教材未直接比較瞬間型瓦斯熱水器與儲備型電熱水器的節能優劣，以上依熱水系統熱損失原理說明，結論與官方答案 B 一致。 【依據】課程教材：11 建築熱水設備 p.14（熱水器種類）、p.19（局部型熱水系統熱損失小）、p.23（配管保溫材料）"},{"c":350,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"熱泵熱水器熱源","year":114,"no":19,"art":"5-1 給水設備","q":"近年來「熱泵熱水器」逐漸應用於飯店、醫院甚至是住宅中，下列那一種不是熱泵熱水器主要產生熱水的熱源型態？","opts":{"A":"空氣對空氣取熱型：主要從空氣中取熱做為熱源","B":"水對水取熱型：主要從地下水、工業廢水或空調系統的回水中取熱做為熱源","C":"電力取熱型：主要從電能轉換過程中取熱做為熱源使用","D":"太陽輻射源與大氣熱源型：主要利用太陽能集熱板並吸收空氣熱能做為熱源"},"ans":"C","note":"答案 C。熱泵是以少量電能驅動壓縮機，利用冷媒的蒸發—壓縮—冷凝循環，從低溫熱源（空氣、水、太陽能集熱器、地熱等）「搬運」熱量至熱水，因此 COP 可大於 1。電能是熱泵的「驅動能源」而非熱源；直接由電能轉換為熱（電阻加熱）是電熱水器的原理，不是熱泵熱源型態，故 C 錯。A 空氣源、B 水源（地下水、廢水、空調回水之廢熱回收）、D 太陽能輔助結合空氣熱源，均屬熱泵常見熱源型態。課程教材：熱泵是把環境中的熱吸進來燒熱水，透過蒸發器吸收空氣中的熱、經壓縮機升溫後由熱交換器傳給冷水。 【依據】課程教材：11 建築熱水設備 p.26–27"},{"c":351,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-1 給水設備","h3":"中水系統","year":114,"no":24,"art":"5-1 給水設備","q":"中水系統建置是都市節水手法之一，下列敘述何者錯誤？","opts":{"A":"在人們日常使用的總水量中，僅廁所沖洗就約占 30%左右","B":"中水系統係為生活用水使用後再回收，經處理達規定水質標準，可在一定範圍內重複使用非飲用水","C":"中水常用於車輛清洗、綠化及景觀用水之人體可接觸之用水","D":"中水系統可就建築雜排水，就近收集與就地處理等原則來規劃"},"ans":"C","note":"答案 C（錯誤）。中水（再生水）是生活雜排水回收處理後的非飲用水，水質低於自來水，應用於沖廁、澆灌、洗車、景觀水體、空調冷卻補充等「人體不直接接觸」之用途，並應設專用管路與標示，防止誤用或與自來水管連接。C 稱「人體可接觸之用水」錯誤（課程教材：中水水質未達上水標準，僅可做為清掃、灌溉之用）。A 依官方為正確：課程教材「每人每日各種用途使用水量推估值」廁所約占 24%，再生水可取代部分（廁所、清掃、其他）合計 32%，題目「約 30%左右」屬概數。B 正確：中水之定義（綠建築評估手冊-基本型 2015 年版 p.119：雨水或中水只能作為非飲用之雜用水，住宅再生水可取代部分以 32% 為上限）。D 正確：優先以水質較佳之雜排水就近收集、就地處理再利用，可減少管線與處理成本。 【依據】課程教材：10 建築給水設備 p.5；課程教材：14 節水設備計畫 p.3；綠建築評估手冊-基本型（2015 年版）水資源指標 p.119"},{"c":352,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"截留器","year":102,"no":25,"art":"5-2 排水與污水處理設備","q":"建築排水設備中，有關截留器的敘述，下列何者錯誤？","opts":{"A":"截留器的作用，是將建築物排水中之雜質加以分解、排除，防止有害物質侵入造成管路阻塞或損傷配管","B":"汽車修理場或洗車廠應設置油料截留器或汽油阻集器，防止油污排入公共下水系統或造成災害","C":"美容院、理髮店應設置毛髮截留器，防止毛髮阻塞配管造成排水不良","D":"游泳池、停車場應設置砂截留器，防止土砂、水泥堵塞配管，造成排水不良"},"ans":"A","note":"答案為 A。截留器是用以「阻止、分離或收集」排水中有害、危險或不希望放流之物質的器具（給水排水設備設計技術規範 1.4 第 37 款），作用是攔截、分離後定期清除，並不「分解」雜質；分解是污水處理設施（生物處理）的功能。102 年考試時適用設備編 101 年 11 月 7 日版第 36 條：車輛修理保養場應裝油料分離器（B，題目稱油料截留器、汽油阻集器）、截留砂或較重固體之截留器封水深度有下限（D）。102 年 11 月 28 日修正（103 年 1 月1 日施行）後，改列現行第 29 條第 2 項（第 2 款油水分離器；第 3 款理髮理容場所、美容院設截留器及易拆卸過濾罩＝C）及規範 4.6.4～4.6.7（砂截留器封水深度不得小於 15 公分）。 【依據】建築技術規則建築設備編第 36 條（101 年 11 月 7 日版；102 年 11 月 28 日修正刪除）、現行第 29 條第 2 項；建築物給水排水設備設計技術規範 1.4第 37 款、4.6.1、4.6.4～4.6.7；課程教材：12 建築排水通氣設備 p.3"},{"c":353,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"雨水排水系統","year":102,"no":37,"art":"5-2 排水與污水處理設備","q":"有關建築雨水排水系統之設置，下列何者正確？","opts":{"A":"雨水排水管路系統，必須設置存水彎、通氣管等構造","B":"雨水排水管徑之決定，必須根據基地所在地區之最大降雨頻率來計算","C":"雨水排水管的集水面積，屋頂面是以水平投影面積計算，陽臺也是以水平面集水面積計算","D":"建築物之雨水排水立管，根據排水量及管徑計算後，至少須設置二支雨排水立管"},"ans":"D","note":"答案為 D。\n課程教材「建築排水通氣設備」p.60（雨水排水設計要點）：同一屋頂面至少應設置 2 支以上之落水管，以避免阻塞造成排水障礙。所以即使計算一支已足夠，仍至少設置二支，以防落葉、雜物阻塞時屋頂積水。\nA 錯誤：同教材 p.59 說明，雨水成分較單純，雨水排水系統構法單純，不必加設存水彎、通氣管，可直接導入都市下水道；p.60 另說明，只有與其他排水管接續時才應設置存水彎。而且設備編第 29 條（102 年考試時之 101 年 11月 7 日版即有同旨規定；現行為第 4 項）規定，沖洗式廁所排水、生活雜排水管路應與雨水排水管路分別裝設，不得共用。\nB 錯誤：同教材 p.59 說明，雨水排水管徑主要由「建築基地所在地之降雨強度」（mm/h，臺灣一般採 5～10 年一次之 30 分鐘最大降雨強度）與集水面積大小決定，不是「降雨頻率」。\nC 錯誤：屋頂以水平投影面積計算正確；但陽臺、外牆等垂直面會受斜向雨，一般須另加計牆面面積的一半，不能只算水平面。\n【查證限制】C 的「牆面加計 1/2」出自一般給排水設備教材，本機課程教材、設備編與給水排水設備設計技術規範都沒有此數值；但建築物雨水貯留利用設計技術規範（101 年）3.6 亦把外牆面積（採 30%）納入集雨面積，可佐證垂直面受雨不能忽略。 【依據】課程教材：12 建築排水通氣設備 p.59～60；建築技術規則建築設備編第 29 條第4 項（101 年 11 月 7 日版第 29 條同旨）；建築物雨水貯留利用設計技術規範（101 年）3.6；建築環境控制一般原理（雨水排水設備）"},{"c":354,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"給排水通氣與排水槽","year":103,"no":19,"art":"5-2 排水與污水處理設備","q":"關於給排水設備之敘述，下列何者錯誤？","opts":{"A":"通氣管之主要目的在於保護存水彎之封水","B":"雨水立管不可兼為通氣管之用","C":"飲用水之給水槽與雨水再利用水槽之間不得有配管相連接","D":"排水槽之底部，為防止清潔者滑倒，應設計成水平狀"},"ans":"D","note":"答案 D（錯誤）。排水槽底部應向吸水坑（集水坑）傾斜，使污水與沉積物集中便於泵浦抽除，避免殘留腐敗，不應設成水平。A 正確：建築物給水排水設備設計技術規範 1.4 用詞定義第 39 款「通氣」即為使排水流暢並保護存水彎水封免受排水時氣壓變動影響（課程教材亦稱通氣管主要功能在緩和排水管內氣壓差）。B 正確：課程教材「雨水排水設計要點」明載雨水立管不得兼作污水管、雜排水管、通氣管等使用；設備編第 29 條第 4 項亦規定污、雜排水管路應與雨水排水管路分別裝設。C 正確：自來水用戶用水設備標準第 18 條：自來水與非自來水系統應完全分開；建築物雨水貯留利用設計技術規範 10.4 亦規定雨水供水管路與自來水管路應分開設置，以防錯接誤用；課程教材稱此類混接為錯接（cross connection）。【查證限制】本機規範與課程教材均未見排水槽底坡度規定，D 依一般原理。 【依據】建築物給水排水設備設計技術規範 1.4 第 39 款（通氣）；建築技術規則建築設備編第 29 條第 4 項；自來水用戶用水設備標準第 18 條；建築物雨水貯留利用設計技術規範（101 年）10.4；課程教材：12 建築排水通氣設備 p.21、p.60、10 建築給水設備 p.46"},{"c":355,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"氧化槽式污水處理","year":103,"no":21,"art":"5-2 排水與污水處理設備","q":"我國一般住宅之污水處理設備採用氧化槽方式時，正確之處理順序為何？","opts":{"A":"腐敗槽→沉澱槽→過濾槽→氧化槽","B":"過濾槽→沉澱槽→腐敗槽→氧化槽","C":"氧化槽→沉澱槽→過濾槽→腐敗槽","D":"腐敗槽→過濾槽→氧化槽→沉澱槽"},"ans":"A","note":"答案 A。課程教材「化糞池原理」：氧氣匱乏時由厭氧性細菌進行腐敗作用，化糞池先將糞尿腐化分解，再配合沉澱、過濾、消毒等處理；圖 2-82 立體氧化槽亦為腐敗室（第 1、2 室）→預備過濾→撒水管碎石層（好氧氧化）→藥液消毒。即腐敗槽→沉澱槽→過濾槽→氧化槽，之後消毒放流。順序為厭氧在前、好氧在後，B、C、D 不合處理原理（如 C 將氧化槽置於最前、D 將沉澱置於氧化之後）。 【依據】課程教材：13 污水衛浴器具設備 p.5～p.7（化糞池原理、圖 2-82 立體氧化槽）"},{"c":356,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"存水彎構造","year":104,"no":19,"art":"5-2 排水與污水處理設備","q":"建築排水器具中，有關存水彎設置及構造要點之敘述，下列何者正確？","opts":{"A":"設備落水口至存水彎堰口之垂直距離，不得大於 60 cm","B":"存水彎管徑與設備排水量有關，不得小於設備落水口","C":"封水深度不得小於 5 mm，且不得大於 10 mm","D":"存水彎構造一般不必附設清潔口"},"ans":"A","note":"答案 A。本題題意出自舊建築技術規則建築設備編第 33 條（100 年 6 月 30 日版、101 年 11 月 7 日版內容相同）：一、設備落水口至存水彎堰口之垂直距離，不得大於六十公分；二、存水彎管徑不得小於第三十二條第三款表列規定，並「不得大於」設備落水口；三、封水深度不得小於五公分，並不得大於十公分；四、應附有清潔口之構造，但埋設於地下而附有過濾網者，得免設清潔口。故 A 正確；B 錯在「不得小於設備落水口」（條文是管徑不得大於設備落水口）；C 單位錯，應為 5～10 cm（教材亦載封水深度 5～10 cm）；D 錯，原則上應附清潔口。該條已於 102 年 11 月 28 日修正時刪除，104 年考試時（設備編 103 年 8 月 19 日版）第 30～36 條均為刪除，相關規定改由「建築物給水排水設備設計技術規範」規定：4.4.3 一般壁掛式洗手臺之設備落水口至存水彎堰口垂直距離不得大於 60 公分；4.4.4 封水深度原則上不得小於 5 公分、不得大於 10 公分；4.4.5 存水彎應附清潔口或可拆卸之構造，埋設於地下而附有過濾網者得免設。註：本機技術規範檔應為 109 年 7 月 10 日台內營字第 1090811791 號令修正版（PDF 建立於 2020 年 7 月，含該次修正之 4.3.16 吸氣閥規定），104 年當時版本未取得，條文是否完全相同未能逐字確認。 【依據】建築技術規則建築設備編第 33 條（100 年 6 月 30 日版、101 年 11 月 7 日版，全國法規資料庫歷史法規；102 年 11 月 28 日修正刪除）；建築物給水排水設備設計技術規範 4.4.3–4.4.5；課程教材：09 水資源與環境 p.55"},{"c":357,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"通氣管作用","year":104,"no":22,"art":"5-2 排水與污水處理設備","q":"排水系統中通氣管之作用為何？","opts":{"A":"平衡排水管中之空氣壓力，使排水暢通","B":"排除排水管中之異味","C":"利於維護與清潔之需","D":"排除浴廁及衛生器具產生之味道"},"ans":"A","note":"答案 A。排水立管內水流下落時，高樓層形成負壓造成存水彎「吸入（虹吸）破封」，低樓層形成正壓造成「噴出破封」。通氣管的主要功能是引入或排出空氣，平衡排水管內氣壓，保護存水彎封水並使排水暢通。排除管內臭氣（B）只是附帶效果；維護清潔（C）屬清潔口功能；浴廁器具異味（D）屬室內排氣設備的工作。 【依據】課程教材：12 建築排水通氣設備 p.11–12（立管負壓吸入破封、正壓噴出破封）；09 水資源與環境 p.55（管內壓力緩和：通氣管之附加）"},{"c":358,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"污水水質指標","year":105,"no":18,"art":"5-2 排水與污水處理設備","q":"有關建築物之污水排放濃度及污水處理設備性能指標之敘述，下列何者正確？","opts":{"A":"污水濃度指標，生化需氧量 BOD 除去率之單位為 g/m³ 或 ppm","B":"COD 是化學需氧量之污水濃度指標，可替代 BOD 指標","C":"污水濃度指標 SS 是以水中含有的浮游物質的濃度來表示，單位為 ppm","D":"DO 為水中溶氧量指標，排水中的 DO 含量愈小，自然淨化作用愈強"},"ans":"C","note":"答案 C。SS（懸浮固體，浮游物質）以單位水量所含懸浮物質量表示，單位 mg/L（≈ppm）。A 錯：BOD 濃度單位為 mg/L（g/m³、ppm），但「除去率」是（流入－流出）／流入之百分比（%），無濃度單位。B 錯：COD以化學氧化劑氧化有機物之需氧量表示，含不能被微生物分解的物質，與 BOD（微生物分解有機物之需氧量）意義不同，可作參考但不能替代。D 錯：DO 愈大，好氧微生物分解能力愈強，自淨作用愈強；DO 愈小水質愈差。課程教材：BOD、SS 濃度以 ppm 或 mg/l 表示，BOD、SS、COD 除去率單位為 %。 【依據】課程教材：13 污水衛浴器具設備 p.13～p.15"},{"c":359,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"污水處理方式","year":106,"no":19,"art":"5-2 排水與污水處理設備","q":"有關建築污水處理設備之敘述，下列何者錯誤？","opts":{"A":"單獨處理方式為單獨處理廁所所產生之污水，而不包括廚房、浴室等雜排水","B":"合併處理方式是將廁所產生的污水和廚房、浴室等之雜排水匯集後一併處理的裝置","C":"氧化槽由腐敗槽、曝氣槽、灑水濾床與地下滲透裝置等組成","D":"長時間曝氣方式，是加大曝氣槽容量以增加活性污泥滯留時間的方式"},"ans":"C","note":"答案 C（錯誤）。課程教材 p.5：單獨處理方式依淨化方式分為「氧化槽方式、曝氣槽方式、撒水濾床方式」三種，曝氣槽方式是與氧化槽並列的另一種方式，不是氧化槽的組成；教材 p.7 圖 2-82 立體氧化槽由腐敗室（第 1、2 室）、預備過濾裝置、撒水濾床（碎石層）及藥液消毒槽組成，也沒有地下滲透裝置（地下滲透屬處理後放流、處置方式）。故 C 錯。A、B 為教材 p.5 單獨、合併處理之定義原文 ✓。D：合併處理有長時間曝氣槽方式（p.5），加大曝氣槽容量、延長活性污泥停留時間，使污泥自行氧化減量 ✓。 【依據】課程教材：13 污水衛浴器具設備 p.5、p.7（圖 2-82 立體氧化槽污水處理設施）"},{"c":360,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"BOD","year":107,"no":19,"art":"5-2 排水與污水處理設備","q":"污水處理設備的處理性能與微生物分解有機物質時所需的耗氧量有關，其簡稱為何？","opts":{"A":"BOD","B":"TOC","C":"COD","D":"DO"},"ans":"A","note":"答（A）。BOD（Biochemical Oxygen Demand，生化需氧量）指水中好氧微生物分解有機物所消耗的溶氧量（常以 20℃、5 日之 BOD5 表示），是評估污水有機污染程度與污水處理設施處理性能（BOD 去除率）的主要指標。（B）TOC 總有機碳，以有機物中碳含量表示；（C）COD 化學需氧量，以化學氧化劑（如重鉻酸鉀）氧化有機物所需氧量表示，並非微生物分解；（D）DO 溶氧量，指水中溶解之氧氣濃度。 【依據】課程教材：13 污水衛浴器具設備 p.13"},{"c":361,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"存水彎破封原因","year":107,"no":20,"art":"5-2 排水與污水處理設備","q":"有關造成存水彎的破封現象，與下列何者現象較無關？","opts":{"A":"當排水器具大量排水時，將存水彎的封水排除，存水彎中無水分留存而形成破封","B":"當排水立管或同一排支管有大量排水流過時","C":"當毛髮、纖維等雜質附著於存水彎的溢水口時","D":"地板落水口等封水高度較大或使用頻率較高的器具"},"ans":"D","note":"答（D）。存水彎破封原因包括：自身虹吸作用（器具本身大量排水把封水帶走，即（A））、誘導虹吸與跳逸作用（立管或同一支管大量排水造成負壓吸走封水或正壓噴出封水，即（B））、毛細管作用（毛髮纖維掛在溢水口處將封水逐漸吸出，即（C））、蒸發作用、慣性作用等。（D）封水深度較大且經常使用的器具，封水不斷得到補充，反而不易破封；地板落水最常見的破封原因是「久未使用」導致封水蒸發，故（D）與破封較無關。\n【依據】課程教材：12 建築排水通氣設備 p.11～12"},{"c":362,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"耐酸鹼排水管材","year":107,"no":22,"art":"5-2 排水與污水處理設備","q":"某工廠所排放之污水需採用耐酸鹼腐蝕性之污水管，下列配管材料何者最不適合？","opts":{"A":"鋼筋混凝土管","B":"鍍鋅鋼管","C":"塑膠管","D":"陶管"},"ans":"B","note":"答（B）。鍍鋅鋼管的鋅層為兩性金屬，遇酸、遇鹼都會溶蝕，鋅層破壞後鋼管本體迅速鏽蝕，且一般用於給水，不適合輸送酸鹼性工業廢水，故最不適合。（C）塑膠管（PVC、PE 等）耐酸鹼腐蝕性佳，常用於化學排水；（D）陶管（釉面陶管）耐化學腐蝕性佳，傳統用於污水管；（A）鋼筋混凝土管具相當耐鹼性，用於大口徑污水下水道，對強酸雖需加內襯保護，但相較之下鍍鋅鋼管最不適合。【查證限制】本機課程教材與給水排水設備設計技術規範未列各管材耐酸鹼比較，以上依一般材料性質說明。 【依據】建築技術規則建築設備編第 29 條第 1項（給水排水管路之配置應避免管線設備腐蝕及污染）；一般給排水設備教材（管材耐蝕性）"},{"c":363,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"排水管管徑與坡度","year":108,"no":21,"art":"5-2 排水與污水處理設備","q":"有關排水管之敘述，下列何者錯誤？","opts":{"A":"排水流體含有容易附著在管內面之油脂者，其排水管管徑之決定，應該適當加大","B":"採用重力排水時，立管管徑不得大於接入該管之最大橫支管之管徑","C":"排水管之立管或橫管不得在排水之下流方向縮小其管徑","D":"建築物排水管之橫支管及橫主管管徑小於 75 公釐時，其洩水坡度不得小於 1/50"},"ans":"B","note":"答案 B（錯誤）。建築物給水排水設備設計技術規範 4.2.2：依設備單位配管時，「立管管徑不得小於接入該管之最大橫支管之管徑」，B 將「小於」改為「大於」而錯誤。A：同規範 4.2.8（及 4.1.2 說明(5)）含油脂排水管徑應適當加大；C：4.1.2 說明(2) 立管或橫管不得在下流方向縮小管徑；D：4.2.3 橫支管及橫主管管徑 75 公釐以下（含）坡度不得小於 1/50，超過 75 公釐不得小於 1/100，均正確。 【依據】建築物給水排水設備設計技術規範4.1.2、4.2.2、4.2.3、4.2.8"},{"c":364,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"存水彎破封原因","year":108,"no":22,"art":"5-2 排水與污水處理設備","q":"有關存水彎破封之作用原因，下列敘述何者錯誤？","opts":{"A":"因衛生器具長時間不使用，使封水逐漸喪失之現象稱為蒸發作用","B":"因毛髮、各種纖維雜物積於水封處，逐漸導致破封之現象，稱為毛細管作用","C":"由於水急排出，或高層建築物最頂層之衛生器具，因強風導致封水交互震盪而破封之現象稱為背壓作用","D":"當排水時水流至立管，因管中原有空氣被吸出而導致破封現象稱為自行虹吸作用"},"ans":"C","note":"答案 C（錯誤）。C 所述「急排水或頂層受強風使封水來回振盪而溢失」為「慣性作用（振盪作用）」。背壓作用（逆壓）是指立管大量排水下衝時，下層橫支管或立管底部形成正壓，將存水彎封水向器具側壓出（噴出）。A 蒸發作用、B 毛細管作用正確；D 為題目所設之自行虹吸作用描述（器具本身排水使器具排水管內滿流、管內空氣被帶走而吸走封水；用語較簡略，但非本題答案）。規範 4.4.2 列舉應避免之破封原因：自行虹吸、誘導虹吸、背壓、毛細管現象、蒸發。 【依據】建築物給水排水設備設計技術規範 4.4.1、4.4.2；課程教材：12 建築排水通氣設備 p.35（破封原因：自行虹吸、誘導虹吸〔含背壓〕、蒸發、毛細管）"},{"c":365,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"存水彎破封原因","year":109,"no":19,"art":"5-2 排水與污水處理設備","q":"下列何種存水彎破封的原因，無法藉由加裝通氣管而解決？","opts":{"A":"迴壓作用（又稱背壓作用）","B":"自行虹吸作用","C":"蒸發作用","D":"誘導虹吸作用"},"ans":"C","note":"答案 C。存水彎水封喪失（破封）的原因有：自行虹吸、誘導虹吸、背壓（迴壓）、毛細管現象、蒸發（建築物給水排水設備設計技術規範 4.4.2）。其中自行虹吸（器具自身排水時管內形成負壓）、誘導虹吸（上方排水使立管形成負壓抽吸水封）與背壓（管內正壓把水封頂出）都是「管內氣壓變動」所致，加裝通氣管可平衡氣壓而防止（見 4.3.2 說明(1)：個別通氣管目的在避免管內氣壓變動或自行虹吸造成破封）。蒸發則是長期不使用而水封蒸發乾涸，與氣壓無關，須靠定期補水、加深水封或採用封水較不易蒸發之存水彎，無法靠通氣管解決。（課程教材佐證：排水立管內壓力變動形成負壓、正壓，造成存水彎吸入破封；排水系統發展以「增設通氣管」緩和管內壓力，保持封水。） 【依據】建築物給水排水設備設計技術規範 4.3.2、4.4.2、4.4.1；課程教材：12 建築排水通氣設備.pdf p.11；09 水資源與環境.pdf p.55"},{"c":366,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"排水系統用語定義","year":109,"no":20,"art":"5-2 排水與污水處理設備","q":"有關排水系統之敘述，下列何者錯誤？","opts":{"A":"排水系統於大氣中隔斷分開後，再排向一般排水系統之受水容器或排水器具中之排水方式稱為錯接排水","B":"與衛生器具所附屬或內藏之存水彎相接續之排水管稱為器具排水管","C":"雜排水為除大小便器及其類似用途之器具外，其他器具之排水，但雨水及特殊排水不包含在內","D":"污水指的是從大小便器及其他類似用途之器具所排出之水"},"ans":"A","note":"答案 A。建築物給水排水設備設計技術規範 1.4 用詞定義：第 29 款「間接排水」＝排水系統於大氣中隔斷分開後，再排向一般排水系統之受水容器或排水器具中之排水方式，因此 (A) 的「錯接排水」應為「間接排水」（錯接排水是把污水管誤接至雨水管等錯誤接管，非此定義）。(B) 第 31 款器具排水管，正確。(C) 第 28 款雜排水，正確。(D) 第 27 款污水（及含以上成分之排水），正確。 【依據】建築物給水排水設備設計技術規範 1.4 用詞定義第 27、28、29、31 款"},{"c":367,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"大便器種類與沖水量","year":110,"no":25,"art":"5-2 排水與污水處理設備","q":"關於大便器的敘述，下列何者錯誤？","opts":{"A":"採用沖水閥式大便器時，可連續沖水且不占水箱空間","B":"採用沖水閥式大便器時需確保水壓力與管徑夠大，以避免污水逆流的現象","C":"虹吸式大便器比洗出式大便器所需的沖水量來得多","D":"兩段式省水大便器的大號至少需在 6 公升以下、小號需在 3 公升以下"},"ans":"C","note":"答案 C（錯誤敘述）。A、B 正確：沖水閥式大便器直接由給水管供水，可連續沖水、不需水箱，但須有足夠水壓（技術規範 3.4.4 規定直接沖洗閥水壓不得低於 1.0 kg/cm²）與管徑，否則沖水不足、易有回流污染。D 正確：省水標章管理辦法附件第三項（二）規定兩段式省水馬桶普級大號 ≤ 6.0 L、小號 ≤ 3.0 L（金級大號 ≤ 4.8 L、小號 ≤ 3.0 L）。C 為官方答案之錯誤敘述：一般給排水教材說明洗出式便器是將污物承接於淺水盤，再以水勢一次沖出，需要較大的沖水量；虹吸式則利用彎曲排水路產生虹吸作用把污物吸出，因此「虹吸式比洗出式需水量多」不正確。課程教材（10 建築給水設備 p.33）：沖水閥式大便器之給水枝管不得小於 25 mm（水箱式大便器枝管為13 mm），p.10：便器沖水閥水壓不足時污物不易沖刷乾淨，均支持 A、B；09 水資源與環境 p.48 僅述便器演進；\n13 污水衛浴器具設備 p.34 載虹吸式、虹吸噴流式較洗出式、洗落式貯留水量多、水面廣，那是便器內存水（封水面），不是每次沖水量，勿與 C 混淆（114-22 即考此點）。【查證限制】便器型式與用水量之比較，課程教材與本機法規均無明確數據，C 之判斷依官方答案與通用給排水教材；A、B、D 已對照本機法規與教材。 【依據】建築物給水排水設備設計技術規範 3.4.4；省水標章管理辦法附件「各項產品項目及規格標準」第三項（二）（兩段式省水馬桶）；課程教材：10 建築給水設備 p.10、p.33；09 水資源與環境 p.48；13 污水衛浴器具設備 p.34"},{"c":368,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"通氣管功能","year":111,"no":19,"art":"5-2 排水與污水處理設備","q":"下列何者有保持排水管內壓力平衡的功能？","opts":{"A":"通氣管","B":"存水彎","C":"水錘吸收器","D":"截留器"},"ans":"A","note":"答案 A。排水系統設置通氣管，目的在緩和排水管內空氣壓力的變動（防止正、負壓破壞存水彎水封），並使排水順暢（建築物給水排水設備設計技術規範 4.3.1）。B：存水彎以水封阻隔下水道臭氣、蟲鼠；C：水錘吸收器裝於給水管，吸收水栓急閉所生之水錘衝擊；D：截留器用以攔截油脂、砂、毛髮等雜物。課程教材圖示排水立管內高樓層負壓造成存水彎吸入破封、低樓層正壓造成噴出破封，通氣管即用以緩和此壓力變動。 【依據】建築物給水排水設備設計技術規範 4.3.1；課程教材：12 建築排水通氣設備 p.11～12"},{"c":369,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"通氣管種類定義","year":111,"no":22,"art":"5-2 排水與污水處理設備","q":"有關通氣管之敘述，下列何者錯誤？","opts":{"A":"為使某一個器具達到通氣效果，由存水彎之下流處接續通氣管，並在較器具為高之位置上與通氣系統接續，或直接向大氣開放之通氣管稱為個別通氣管","B":"器具通氣管指的是在器具排水管處，以與水平線成 45°以內之角度分歧，向下方接續之通氣管","C":"對於背對背或並列設置之衛生器具，為保護此二器具存水彎之水封，在器具排水管之交點處向上接續之通氣管為共同通氣管","D":"伸頂通氣管指的是從最頂部之排水橫管與排水立管之接續點起，排水立管再向上延伸作為通氣使用之部分"},"ans":"B","note":"答案 B（錯誤）。技術規範 1.4 用詞定義：器具通氣管指「在器具排水管處，以與垂直線成 45°以內之角度分歧，向上接續之通氣管」；B 誤為「與水平線」、「向下方」。A（第 43 款個別通氣管）、C（第 45 款共同通氣管）、D（第 48 款伸頂通氣管）皆與規範定義相符。通氣管由排水管上方向上分歧，才能避免污水進入通氣管而堵塞。 【依據】建築物給水排水設備設計技術規範 1.4 用詞定義（第 43、44、45、48 款）"},{"c":370,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"存水彎","year":112,"no":22,"art":"5-2 排水與污水處理設備","q":"有關存水彎設備敘述，下列何者錯誤？","opts":{"A":"存水彎之水封喪失或減少，使得管內空氣得以流通至室內之情形稱為破封","B":"存水彎裝置封水深度是指溢水面至水底面之水深","C":"設備落水口至存水彎堰口之垂直距離，不得大於 60 cm","D":"存水彎裝置應附有清潔口或可拆卸之構造，得以隨時排除阻塞之情況"},"ans":"B","note":"答案 B（錯誤）。建築物給水排水設備設計技術規範 1.4 第 35 款：水封深度是存水彎內「可達成阻絕氣體逸散至室內的有效存水深度」，即堰口（溢水面）至彎管頂部下緣之垂直距離，4.4.4 規定原則上 5～10 公分；並非「溢水面至水底面」之水深（底部空間不具阻絕作用）。A 為 1.4 第 36 款破封之定義；C 為 4.4.3（壁掛式洗手臺設備落水口至存水彎堰口之垂直距離不得大於 60 公分，過長易自行虹吸破封）；D 為 4.4.5（應附清潔口或可拆卸之構造）。課程教材 09 水資源與環境 p.55 亦載封水深度 5～10 cm；12 建築排水通氣設備 p.11、p.12 說明吸入破封與噴出破封。 【依據】建築物給水排水設備設計技術規範 1.4 第 35 款、第 36 款、4.4.3、4.4.4、4.4.5；課程教材：\n09 水資源與環境 p.55；12 建築排水通氣設備 p.11、p.12"},{"c":371,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"沖水閥便器防污水逆流","year":113,"no":26,"art":"5-2 排水與污水處理設備","q":"建築物衛生設備器具採用沖水閥之便器時，應於管線上裝設下列何者裝置避免污水逆流發生？","opts":{"A":"真空破除器","B":"吸氣閥裝置","C":"逆流防止器","D":"水錘吸收器"},"ans":"A","note":"答案 A。沖水閥（沖洗閥）直接接自來水管，若給水管瞬間負壓，便器內污水可能被回吸入給水管。自來水用戶用水設備標準第 8 條規定：採用沖水閥之便器應具有效之消除真空設備；建築物給水排水設備設計技術規範3.4.1 更明文「應具有效之消除真空設備，或裝置真空破除器」（vacuum breaker），使空氣進入破壞虹吸。課程教材亦說明：沖洗閥之給水管直接與大便器連接，無法設置吐水口空間，為避免虹吸現象可設置真空破除器以防止污水逆流，其位置應高於器具溢水面 150 mm 以上。B 吸氣閥（空氣導入閥）用於排水通氣系統；C 逆流防止器用於防止壓力水逆流（如鍋爐、消防給水連接）；D 水錘吸收器用以吸收水錘衝擊。 【依據】自來水用戶用水設備標準第 8 條；建築物給水排水設備設計技術規範 3.4.1；課程教材：10 建築給水設備 p.48"},{"c":372,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"通氣系統","year":114,"no":20,"art":"5-2 排水與污水處理設備","q":"根據建築物給水排水設備設計技術規範，有關通氣系統之敘述，下列何者錯誤？","opts":{"A":"共同通氣管可保護兩個以上之存水彎，且兼具作器具排水管及通氣管之部分","B":"通氣支管與通氣主管之接頭處，應高出最高溢水面 15 cm","C":"衛生設備在裝置組合上，宜設置個別通氣管，以避免產生自發性虹吸作用","D":"通氣立管不得與雨排水立管相連接"},"ans":"A","note":"答案 A（錯誤）。依規範 1.4 用詞定義：第 47 項「濕通氣管」為「保護二個以上之存水彎，且兼用作器具排水管及通氣管之部分」，A 所述為濕通氣管；第 45 項「共同通氣管」則是「背對背或並列設置之衛生器具，為保護此二器具存水彎之水封，在器具排水管之交點處向上接續之通氣管」。B 正確：4.3.4 通氣支管與通氣主管之接頭處，應高出最高溢水面 15 公分。C 正確：4.3.6 第 (4) 款原文。D 正確：4.3.7 第 (4) 款，通氣立管不得與雨排水立管相連接。 【依據】建築物給水排水設備設計技術規範 1.4 用詞定義第 45、47 項；4.3.4；4.3.6 第 (4) 款；4.3.7 第(4) 款"},{"c":373,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"截留器及分離器","year":114,"no":21,"art":"5-2 排水與污水處理設備","q":"根據建築物給水排水設備設計技術規範，有關於截留器及分離器的敘述，下列何者正確？","opts":{"A":"截留器裝置可省略裝設通氣管，並應裝設在易於保養清理之位置","B":"停車場、車輛修理保養場及涉及機械設施之保養場所，應裝設油脂截留器","C":"美容院應裝設截留器及易於拆卸之過濾網，罩上孔徑之小邊不得大於 12 mm","D":"用於截留或分離砂或是較重固體之設備，其封水深度不得小於 10 cm"},"ans":"C","note":"答案 C。規範 4.6.5：營業性洗衣工廠及洗衣店、理髮理容場所、美容院、寵物店及寵物美容店等應裝設截留器及易於拆卸之過濾罩，罩上孔徑之小邊不得大於 12 公釐（建築設備編第 29 條第 2 項第 3 款同旨），C 正確。A錯：4.6.1 規定「截留器裝置應設通氣管」，不可省略。B 錯：4.6.4 停車場、車輛修理保養場等應裝設「油水分離器」，非油脂截留器（油脂截留器用於烹飪調理場所，4.6.2）。D 錯：4.6.7 截留或分離砂或較重固體之設備，封水深度不得小於「15 公分」。 【依據】建築物給水排水設備設計技術規範 4.6.1、4.6.2、4.6.4、4.6.5、4.6.7；建築技術規則建築設備編第 29 條第 2 項"},{"c":374,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"衛生設備器具","year":114,"no":22,"art":"5-2 排水與污水處理設備","q":"有關衛生設備器具的敘述，下列何者錯誤？","opts":{"A":"沖水閥式設備器具，係利用管路本身之水壓，提供沖廁或清洗之動力","B":"洗出式大便器貯留水量較虹吸式多，水面較廣，可改善洗淨效果及防止臭氣","C":"自閉式水栓在定量給水之後，會自動關閉，常應用於公共廁所的洗手台","D":"裝置洗面盆時，應注意給水栓之出水口應該高於洗面盆溢水線，以防止虹吸現象"},"ans":"B","note":"答案 B（錯誤）。洗出式大便器是將污物暫留於淺盆，再以水流沖出，封水面小、貯留水量少，易沾污並產生臭氣；虹吸式（及虹吸噴射式、渦旋式）利用存水彎內虹吸作用吸出污物，貯留水量較多、水面較廣，洗淨與防臭效果較佳（課程教材 13 污水衛浴器具設備 p.34 同載）。B 將兩者說反。A 正確：給排水規範 3.4.1 說明原文，沖水閥式利用管路本身水壓提供沖洗動力（並須設真空破除器）。C 正確：自閉式水栓出水一定量後自動關閉，用於公廁以節水。D 正確：出水口高於溢水面保持空氣間隙（吐水口空間），可防止污水因負壓逆流（虹吸）污染給水（自來水用戶用水設備標準第 16 條同旨；課程教材亦說明水栓淹沒於水面下時停水會產生虹吸使污水回流）。\n【依據】建築物給水排水設備設計技術規範 3.4.1；自來水用戶用水設備標準第 15、16 條；課程教材：10 建築給水設備 p.46、p.48；13 污水衛浴器具設備 p.34"},{"c":375,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-2 排水與污水處理設備","h3":"截留器、分離器設置場所","year":114,"no":23,"art":"5-2 排水與污水處理設備","q":"依據「建築技術規則建築設備編」排水系統應裝設衛生上必要之設備，並依規定裝設截留器、分離器之建築物，下列何者錯誤？","opts":{"A":"市場－油脂截留器","B":"飲食店－油脂截留器","C":"停車場－油水分離器","D":"旅館房間－油水分離器"},"ans":"D","note":"答案 D（錯誤）。建築技術規則建築設備編第 29 條第 2 項：第 1 款，餐廳、店鋪、飲食店、市場、商場、旅館、工廠、機關、學校、醫院等建築物之「附設食品烹飪或調理場所」之水盆及容器落水，應裝設油脂截留器（A、B 正確）；第 2 款，停車場、車輛修理保養場、洗車場、加油站、油料回收場及涉及機械設施保養場所，應裝設油水分離器（C 正確）。旅館僅其附設廚房須設「油脂截留器」，旅館房間屬一般生活排水，無須設油水分離器，D 錯。 【依據】建築技術規則建築設備編第 29 條第 2 項第 1 款、第 2 款"},{"c":376,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"電阻性負載","year":102,"no":33,"art":"5-3 電氣與通訊設備","q":"下列何種用電器具屬於電阻性電路？","opts":{"A":"白熾燈","B":"電風扇、洗衣機","C":"高功率型螢光燈","D":"三相馬達"},"ans":"A","note":"答案為 A。\n白熾燈是電流通過鎢絲電阻發熱發光，屬純電阻性負載，電壓與電流同相位，功率因數約為 1（電熱水器、電爐也屬此類）。\nB 電風扇、洗衣機與 D 三相馬達：都靠線圈產生磁場驅動，屬電感性負載，功率因數小於 1。\nC 高功率型螢光燈：螢光燈須搭配安定器（線圈），屬電感性負載；高功率（因數）型只是另加電容器補償功率因數，電路中仍有電感與電容元件，並不是電阻性電路。 【依據】建築環境控制一般原理（電氣負載特性、功率因數）；課程教材：02 電氣設備系統 p.24、26"},{"c":377,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"電氣設計名詞","year":103,"no":22,"art":"5-3 電氣與通訊設備","q":"下列有關電氣設備系統設計之名詞敘述，何者錯誤？","opts":{"A":"負載因數（load factor）越大通常表示用電時間越為平均","B":"供電電壓（service voltage）是指用戶在用電設備端所測得之電壓值","C":"參差因數（diversity factor）越低通常表示同一配電設備之利用價值越低","D":"電壓降（voltage drop）是指送電端與受電端之間的電壓差"},"ans":"B","note":"答案 B（錯誤）。供電電壓（service voltage）指電業供電至用戶之供電點（接戶點、受電點）之電壓；用戶在用電設備端所測得者為用電電壓（utilization voltage），兩者之差即為用戶內線之電壓降。A 正確：負載因數＝平均負載／最大負載，愈大表示用電愈平均。C 正確：參差因數＝各負載最大需量和／合成最大需量（≧1），愈低表示各負載尖峰愈同時發生，配電設備容量需求大、利用價值低。D 正確：電壓降為送電端與受電端電壓之差。課程教材 02 電氣設備系統 p.43 定義負荷率＝某時間平均需要電力／同時期最大需要電力×100%、需要率＝最大需要電力／負荷設備總容量。【查證限制】參差因數與供電電壓、用電電壓之定義本機教材未列，依一般原理。 【依據】課程教材：02 電氣設備系統 p.43（需要率與負荷率）；參差因數、供電電壓（一般原理）"},{"c":378,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"進相電容器","year":103,"no":23,"art":"5-3 電氣與通訊設備","q":"進相電容器（SC）的主要功能為何？","opts":{"A":"改善電路的功率因數，減少無效電力","B":"防止電路異常電壓的發生，以保護電路安全","C":"將受電電壓降低或升高到負荷設備需要之額定電壓","D":"在電力系統故障時，自動跳脫電路以保護電路設備"},"ans":"A","note":"答案 A。建築負載多為馬達、安定器等電感性負載，電流落後電壓，功率因數低、無效電力大；並聯進相電容器（SC）提供超前電流以補償，可改善功率因數、減少無效電力、降低線路電流與損失並避免電費罰款。B 為避雷器（LA）或突波吸收器之功能；C 為變壓器（TR）之功能；D 為斷路器（CB）、保護電驛之功能。課程教材：\n功率因數＝有效電力÷視在功率。 【依據】課程教材：02 電氣設備系統 p.27（有效、無效電力與功率因數）、p.32（變壓器）；受變電設備（一般原理）"},{"c":379,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"避雷針保護角","year":103,"no":28,"art":"5-3 電氣與通訊設備","q":"依據建築技術規則規定普通建築物設置直擊式避雷針，其保護角不得超過多少度？","opts":{"A":"75°","B":"60°","C":"50°","D":"45°"},"ans":"B","note":"答案 B。建築技術規則建築設備編第 21 條第 1 款：受雷部採用富蘭克林避雷針者，其針體尖端與受保護地面周邊所形成之圓錐體即為避雷針之保護範圍，此圓錐體之頂角之一半即為保護角，除危險物品倉庫之保護角不得超過四十五度外，其他建築物之保護角不得超過六十度。故普通建築物為 60°；D 45° 為危險物品倉庫之限值；A75°、C 50° 非規定值。課程教材亦載「突針方式（一般建築物保護角不得大於 60°）」。 【依據】建築技術規則建築設備編第 21 條第 1 款；課程教材：03 電氣設備計畫 p.27"},{"c":380,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"受電方式供電可靠度","year":104,"no":21,"art":"5-3 電氣與通訊設備","q":"下列那種受電方式之供電信賴度最低？","opts":{"A":"開放式環路受電（open loop）","B":"封閉式環路受電（close loop）","C":"單回路受電","D":"雙回路受電"},"ans":"C","note":"答案 C。單回路受電只由一條饋線供電，線路故障或維修即全部停電，供電信賴度最低，但設備最簡單、費用最低，用於一般小型用戶。雙回路受電（一回路常用、一回路備用）可在一回路故障時切換；環路受電以環狀線路從兩側供電，開放式環路需切換、封閉式環路可不中斷供電，信賴度最高。故選 C。課程教材列「受電方式」為受變電設備規劃考量事項。 【依據】課程教材：02 電氣設備系統 p.40（受變電設備考量事項：受電電壓、受電方式）；一般建築電氣教材（受電方式比較）"},{"c":381,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"功率因數改善","year":104,"no":23,"art":"5-3 電氣與通訊設備","q":"為使大樓電力設備之功率因數提高以節省電費，電力系統應加設何種裝置？","opts":{"A":"濕式變壓器","B":"乾式變壓器","C":"進相電容器","D":"電磁式安定器"},"ans":"C","note":"答案 C。功率因數＝有效電力÷視在功率。大樓內馬達、螢光燈等電感性負載使電流落後電壓，無效電力大、功率因數低，會增加線路損失並可能被電力公司加收電費。並聯「進相電容器」提供超前的無效電力抵銷電感性無效電力，可提高功率因數。濕式、乾式變壓器（A、B）用於變換電壓；電磁式安定器（D）本身是電感性元件，反而會降低功率因數。 【依據】課程教材：02 電氣設備系統 p.27–28（有效電力、無效電力、功率因數；各器具功率因數）"},{"c":382,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"緊急發電機設置","year":105,"no":24,"art":"5-3 電氣與通訊設備","q":"關於發電機的設置，下列敘述何者錯誤？","opts":{"A":"一般建築設置之發電機，至少需根據緊急用電設備的容量來決定發電機的容量","B":"發電機供給室內消防栓之緊急電源使用時，供電容量應確保有效動作 30 分鐘以上","C":"發電機房設置的位置，應遠離負載中心以避免危險","D":"發電機房設置的位置，應設置於室內通風及引擎排氣較方便處"},"ans":"C","note":"答案 C（錯誤）。發電機房原則上應靠近負載中心（及主配電室），以縮短幹線、減少電壓降與線路損失，並便於切換；安全問題以防火區劃、防振、隔音、燃油安全處理，不是靠遠離負載。A：發電機容量至少要能供應消防、避難等緊急用電設備；課程教材列發電機容量設定應考慮建築物種類、負荷的用途與特性、負荷使用頻率及最大使用電力等，正確。B：各類場所消防安全設備設置標準第 38 條第 1 項，室內消防栓之緊急電源應使用發電機或蓄電池設備，供電容量應供其有效動作 30 分鐘以上，正確。D：教材載發電機設備包括引擎、給排氣設備、冷卻系統及燃料系統等，構成圖並示換氣、排氣（經消音器）路徑；引擎需燃燒空氣、散熱與排氣，應設於通風及排氣方便處，正確。【查證限制】「靠近負載中心」課程教材未明文，依建築電氣設備通則（教材構成圖中發電機配電盤直接連接受變電室）。 【依據】各類場所消防安全設備設置標準第 38 條第 1 項；課程教材：02 電氣設備系統p.48～p.50（預備電源、發電機設備與構成圖）"},{"c":383,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"電阻性負載","year":105,"no":25,"art":"5-3 電氣與通訊設備","q":"下列那種家電設備屬於電阻性電路？","opts":{"A":"電風扇","B":"分離式冷氣機","C":"電熱器","D":"滾筒式洗衣機"},"ans":"C","note":"答案 C。電熱器（電暖器、電熱水器、電鍋等）以電熱絲將電能轉為熱能，是純電阻性負載，電壓與電流同相位，功率因數約為 1。電風扇、冷氣機（壓縮機、風扇馬達）、洗衣機都以電動機驅動，含線圈，屬電感性負載，電流落後電壓，功率因數小於 1，常需改善功率因數。課程教材：電阻性電路電壓與電流同方向（同相），功率恆為正；建築物電氣設備電路包含電阻性、電感性與電容性三種。 【依據】課程教材：02 電氣設備系統 p.24、p.26"},{"c":384,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"交流電路相位","year":106,"no":22,"art":"5-3 電氣與通訊設備","q":"交流電路依其原理的不同，其功率變化亦不相同，如果是電流超前電壓 1/4 週期（相位差-90°）者，是為下列何種電路？","opts":{"A":"電阻性","B":"電感性","C":"電容性","D":"電壓性"},"ans":"C","note":"答案 C。課程教材 p.26 原文：電容性電路—電流超前電壓 1/4 週期，相位差 －90 度；純電感性與純電容性電路的功率正負相抵，有效電力為 0。原理：電容器充放電使 i＝C·dv/dt，電流相位超前電壓 90°。A 純電阻電路電流與電壓同相（0°）；B 純電感電路 v＝L·di/dt，電流落後電壓 90°；D「電壓性」並非電路分類（教材列電阻性、電感性、電容性三種）。實務上以電容器改善電感性負載（馬達）之功率因數。 【依據】課程教材：02 電氣設備系統 p.26"},{"c":385,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"過電流保護器","year":106,"no":24,"art":"5-3 電氣與通訊設備","q":"下列有關各種過電流保護器之敘述，何者錯誤？","opts":{"A":"無熔絲開關（NFB）的跳脫原理分為熱動跳脫式與磁動跳脫式兩種","B":"低壓型之栓形熔絲一般用於小型電動機之過載保護","C":"高壓熔絲鏈開關又稱為一次斷路器（PCB），常用於屋外高壓分岐線的保護裝置","D":"高壓型之油斷路器（OCB）體積較空氣斷路器（ACB）小，多裝設於建築內部空間"},"ans":"D","note":"答案 D（錯誤）。油斷路器（OCB）以絕緣油滅弧，需油箱，體積大且重，並有漏油與油料燃燒之火災風險，不宜裝設於建築物內部，室內變電設備多改用真空斷路器（VCB）、氣體斷路器等；故「體積較小、多設於建築內部」錯誤。A：NFB 有熱動（雙金屬片，過載）與電磁（短路）跳脫 ✓。B：栓形（插塞式）熔絲為低壓小容量保護器（用戶用電設備裝置規則第 72 條：栓型熔線額定電壓不得超過 150 V、額定電流 30 A 以下分三級），用於小容量分路及小型電動機過載保護 ✓。C：高壓熔絲鏈開關（PCB，Primary Cutout）常用於屋外高壓分歧線及變壓器一次側保護 ✓。【查證限制】課程教材（02 電氣設備系統受變電設備、配線章節）未涵蓋各式斷路器之比較，D 之駁斥依建築電氣設備一般原理；現行用戶用電設備裝置規則並未禁止室內使用油斷路器，但室內變電室實務以VCB、GCB 為主。 【依據】用戶用電設備裝置規則（114 年版）第 72 條；建築電氣設備一般原理（過電流保護）"},{"c":386,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"避雷設備","year":107,"no":31,"art":"5-3 電氣與通訊設備","q":"有關避雷設備之設置，下列何者錯誤？","opts":{"A":"避雷針設置，普通建築物之保護角不得超過 60°","B":"接地電阻必須＜20 Ω","C":"避雷針之突針應用直徑 12 ㎜以上之銅棒製成，尖端成圓錐體","D":"突針之尖端在裝置完成後不得低於被保護物 25 cm 以下"},"ans":"B","note":"答（B）。建築技術規則建築設備編第 25 條第 4 款：避雷系統之總接地電阻應在「十歐姆以下」，非 20 Ω，故（B）錯誤。（A）第 21 條第 1 款：除危險物品倉庫保護角不得超過 45 度外，其他建築物保護角不得超過 60度，正確。（C）第 22 條：受雷部針體應用直徑 12 公厘以上之銅棒製成，正確。（C）「尖端成圓錐體」與（D）「突針之尖端在裝置完成後不得低於被保護物 25 公分以下」係出自民國 100 年 6 月 30 日修正（100 年 10 月 1 日施行）前之舊第 22 條（全國法規資料庫 98 年 1 月 5 日版本：突針應用直徑十二公厘以上之銅棒製成，尖端成圓錐體；突針之尖端在裝置完成後不得低於被保護物廿五公分以下），舊條文另規定普通建築物保護角不得超過六十度、總接地電阻應在十歐姆以下。第 19～25 條自 100 年修正後至 107 年考試時未再修正，現行第 22 條已無此二用語，但並不與之牴觸，故依出題者引用之舊條文視為正確；不論新舊條文，接地電阻均為 10 Ω 以下，（B）為唯一錯誤。 【依據】建築技術規則建築設備編第 21 條第 1 款、第 22 條、第 25 條第 4 款（100 年 6 月 30 日修正版；舊條文依全國法規資料庫 98 年 1 月 5 日版本）；課程教材：03 電氣設備計畫 p.27"},{"c":387,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"智慧建築標章","year":107,"no":38,"art":"5-3 電氣與通訊設備","q":"有關我國智慧建築標章之敘述，下列何者正確？","opts":{"A":"各評估指標之鼓勵項目中，以「健康舒適」項目所占之配分為最高","B":"中央監控系統須採用 Web 化操作環境","C":"在「系統整合指標」的基本規定中，子系統均須整合於採同一通訊協定之整合平台","D":"「安全防災指標」不涵蓋門禁系統、停車管理、緊急求救等內容"},"ans":"B","note":"答（B）。考試當時適用智慧建築評估手冊 2016 年版（105 年修訂），分綜合佈線、資訊通信、系統整合、設施管理、安全防災、節能管理、健康舒適、智慧創新八大指標，各指標分基本規定（門檻、不計分）與鼓勵項目（總分 200 分）。（B）手冊表 1.6 基本規定「三、系統整合」3.2.1：中央監控系統須採 Web 化操作環境，並採用國際或工業標準化整合平台（p.16），正確。（A）表 1.3 各指標鼓勵項目配分：系統整合 40 分（20%）最高，健康舒適僅 10 分（5%），錯誤（p.10）。（C）基本規定 3.1.3 規定軟體整合之子系統應提供「各自專屬通訊協定名稱」與整合說明，3.2.1 要求採國際或工業標準化整合平台，並未要求所有子系統採「同一」通訊協定，錯誤（p.16）。（D）安全防災指標基本規定含 5.5 門禁系統、5.6 停車管理、5.8 緊急求救系統（p.22），錯誤。 【依據】智慧建築評估手冊（2016 年版）表 1.3（p.10）、表 1.6 系統整合 3.1.3、3.2.1（p.16）、安全防災 5.5～5.8（p.22）；課程教材：補充教材-04 資通智慧建築 p.10～11"},{"c":388,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"智慧建築安全防災","year":107,"no":40,"art":"5-3 電氣與通訊設備","q":"有關智慧建築標章中建築物安全防災之規劃設計，下列敘述何者錯誤？","opts":{"A":"建築物於重要出入口及區域，安裝如熱感應或微波等防盜警報設備","B":"在建築物昇降機、直通樓梯、室內停車場等處，設置緊急求救按鈕或對講設備","C":"於地下停車場設置二氧化碳偵測設備，能發出警報或引導疏散","D":"門禁系統能與消防系統連動，在發生火災時能即時啟動消防通道和安全門"},"ans":"C","note":"答（C）。地下停車場的主要危害氣體是汽車引擎不完全燃燒排出的「一氧化碳（CO）」，CO 無色無味、毒性高，智慧建築安全防災規劃要求設置一氧化碳偵測設備，濃度超標時發出警報並連動排風機，引導疏散；二氧化碳並非停車場之主要監測對象，故（C）錯誤。（A）重要出入口設熱感應或微波等防盜感知設備，正確。（B）昇降機、樓梯、停車場等處設緊急求救按鈕或對講設備，正確。（D）門禁系統與消防連動，火災時自動解鎖逃生門，正確。依據：智慧建築評估手冊（2016 年版）表 1.6 基本規定「五、安全防災」：5.3.1 建築物於重要出入口及區域安裝如熱感應或微波等防盜警報設備（A，p.21）；5.5.3 門禁系統能與消防系統連動，在發生火災時能即時啟動消防通道和安全門（D，p.22）；5.7.1 系統能偵測各種對人體有害氣體如瓦斯、「一氧化碳」等氣體，並發出警報或引導疏散（p.22，選項 C 將一氧化碳改為二氧化碳）；5.8.1 在建築物昇降機、直通樓梯、室內停車場等處設置緊急求救按鈕或對講設備（B，p.22）。 【依據】智慧建築評估手冊（2016 年版）表 1.6 安全防災 5.3.1、5.5.3、5.7.1、5.8.1（p.21～22）"},{"c":389,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"電能單位","year":108,"no":31,"art":"5-3 電氣與通訊設備","q":"「瓦時（W∙h）」為下列何者之單位？","opts":{"A":"電能量","B":"電壓","C":"電流","D":"電阻"},"ans":"A","note":"答案 A。瓦時＝功率（W）×時間（h），為電能（電功、能量）的單位，1 W·h＝3,600 J；課程教材：電力量＝用電功率×使用時間，單位瓦時（Wh）或瓩時（kWh），電力公司以 1 kWh 為一度電。B 電壓單位為伏特（V）；C 電流單位為安培（A）；D 電阻單位為歐姆（Ω）。 【依據】課程教材：02 電氣設備系統 p.27、p.29"},{"c":390,"law":"建築設備","g":"建築設備","h1":"第 5 篇　建築設備","h2":"5-3 電氣與通訊設備","h3":"智慧建築能源管理系統","year":108,"no":33,"art
