<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>環控題庫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 左側篩選欄＋右側單題卡片；窄螢幕時篩選欄收在上方。像考場試卷：題幹用明體，介面用黑體，題號與統計用等寬字。 */
:root{
  --bg:#eef1ef; --paper:#fbfcfb; --ink:#1d2a33; --muted:#5d6b72; --line:#d3dbd8;
  --accent:#23577a; --accent-soft:#dde8ef;
  --ok:#1f7a55; --ok-soft:#dcefe5; --bad:#b0412c; --bad-soft:#f6e1db; --warn:#9a6a12;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a1e; --paper:#1b2328; --ink:#e3eae8; --muted:#97a5ab; --line:#2f3a40;
  --accent:#7fb3d6; --accent-soft:#22323d;
  --ok:#5cc394; --ok-soft:#17352a; --bad:#ec8a73; --bad-soft:#3b221d; --warn:#e2b35a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1e; --paper:#1b2328; --ink:#e3eae8; --muted:#97a5ab; --line:#2f3a40;
  --accent:#7fb3d6; --accent-soft:#22323d;
  --ok:#5cc394; --ok-soft:#17352a; --bad:#ec8a73; --bad-soft:#3b221d; --warn:#e2b35a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
header.top{max-width:1120px;margin:0 auto 16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
header.top h1{font-family:var(--serif);font-size:26px;margin:0;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:13px}
aside{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:820px){aside{position:static}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.04em}
select,button{font:inherit}
select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:8px 4px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper);font-weight:700}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--paper);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,.seg button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:8px;padding:8px 4px}
.stats b{display:block;font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:0}
main{min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px clamp(16px,3vw,28px)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--bg)}
.tag.law{border-color:var(--accent);color:var(--accent)}
.star{margin-left:auto;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:3px 12px;cursor:pointer;font:inherit;font-size:13px;line-height:1.4}
.star:hover{border-color:var(--warn);color:var(--warn)}
.star[aria-pressed="true"]{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);font-weight:700}
.grid-res button.st{box-shadow:inset 0 -3px 0 var(--warn)}
.grid-res button.st::after{content:"★";color:var(--warn);font-size:11px;margin-left:2px}
.qno{font-family:var(--mono);color:var(--ink)}
.ctx{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 14px;font-size:16px;line-height:1.75;white-space:pre-wrap}
.ctx b{display:block;font-size:13px;color:var(--accent);margin-bottom:4px}
.stem{font-family:var(--serif);font-size:21px;line-height:1.8;margin:0 0 16px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px 14px;cursor:pointer;font:inherit;font-size:17px;line-height:1.65}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-weight:500;color:var(--muted)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{color:var(--bad)}
.opt:disabled{cursor:default}
.result{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-weight:700;margin:0 0 6px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.ans{margin:0 0 8px}
.ans b{font-family:var(--mono)}
.note{white-space:pre-wrap;margin:0;max-width:72ch;font-size:16px;line-height:1.75}
.corr{color:var(--warn);font-size:13px;margin:0 0 8px}
.nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.nav .pos{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.score{font-family:var(--serif);font-size:40px;margin:0}
.grid-res{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.grid-res button{font-family:var(--mono);min-width:44px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.grid-res button.ok{border-color:var(--ok);color:var(--ok)}
.grid-res button.bad{border-color:var(--bad);color:var(--bad)}
.grid-res button.skip{border-style:dashed;color:var(--muted)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tbl{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.tbl th{color:var(--muted);font-weight:500}
.tbl .num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
/* 手機：作答時收起設定欄，改用頂端「題庫設定」列；上一題／下一題固定在畫面底部 */
.mbar{display:none}
@media (max-width:820px){
  body{padding-block:12px 24px}
  header.top h1{font-size:22px}
  header.top .sub{font-size:12px}
  body.m-run header.top{display:none}
  body.m-run aside{display:none}
  body.m-run.m-open aside{display:flex}
  body.m-run .mbar{display:flex;position:sticky;top:0;z-index:6;align-items:center;gap:10px;margin:-12px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 12px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--paper);border-bottom:1px solid var(--line)}
  .mbar b{font-family:var(--serif);font-size:16px;white-space:nowrap}
  .mbar span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .mbar button{flex:none;padding:7px 12px;font-size:14px}
  .card{padding:16px 14px}
  .stem{font-size:18px;line-height:1.75}
  .opt{font-size:16px;padding:12px}
  .note{font-size:15px}
  article.card + .nav{position:sticky;bottom:0;z-index:5;background:var(--bg);margin:0 -4px;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
  article.card + .nav .btn{min-height:44px;min-width:96px}
  .meta .tag{font-size:11px}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}.opt{transition:background .15s,border-color .15s}}

.fig{margin:8px 0 14px;text-align:center}
.fig img{max-width:100%;max-height:360px;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
</style>
<style id="logo-theme">
:root{--accent:#1f6e5e;--accent-soft:#dcefe9;--hero1:#2e8c78;--hero2:#145c4e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#7fd1bd;--accent-soft:#16352f;--hero1:#0f2a25;--hero2:#08201b}}
:root[data-theme="dark"]{--accent:#7fd1bd;--accent-soft:#16352f;--hero1:#0f2a25;--hero2:#08201b}
html{min-height:100%;background:linear-gradient(180deg,var(--hero1),var(--hero2)) fixed}
body{background:transparent;min-height:100vh}
header.top h1,header.top .sub,header.top a,header.top button:not(.btn){color:#fff}
header.top .sub{opacity:.85}
</style>
</head>

<script>
const DATA = [{"c":1,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"氣溫日較差","year":102,"no":1,"art":"1-1 氣候與微氣候","q":"有關氣溫日較差之敘述，下列何者錯誤？","opts":{"A":"緯度越低，日較差越小","B":"海岸地區比內陸地區小","C":"沙漠地區比草原地區大","D":"山地之高山越高處，日較差越小"},"ans":"A 或 D 均給分（更正前公告答案 D）","note":"本題 A、D 兩個選項都可判為錯誤敘述。\nA 錯誤：低緯度地區一天內太陽高度角的變化大，白天日射強，所以日較差一般「較大」；反而是年較差隨緯度升高而變大。命題者原本可能只想考 D，A 寫反了，形成第二個錯誤選項。\nB 正確：海洋的熱容量大，有調節作用，所以海岸的日較差比內陸小。\nC 正確：沙漠乾燥、沒有植被，白天吸熱快、夜間輻射散熱快，所以日較差比草原大。課程教材「氣候與外部環境」p.10 也寫明：乾燥時天氣晴朗，日較差大。\nD：原公告答案的意思是「海拔越高空氣越稀薄，白天日射強、夜間放射冷卻強，日較差越大」，所以把「越小」判為錯誤。\n【查證限制／爭議】考選部未公布更正理由，以上是推測。氣象學上，孤立山頂與大氣交換旺盛，日較差反而比谷地、盆地小；高原的日較差才大。D 的對錯取決於「高山」指的是山頂還是高原，敘述本身有爭議。 【依據】建築環境控制一般原理（氣候要素：日較差、年較差）；課程教材：23 S ET 02 氣候與外部環境 p.10"},{"c":2,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"高樓風","year":102,"no":6,"art":"1-1 氣候與微氣候","q":"高層建築發生地面高樓風的主要原因為何？","opts":{"A":"室內通風條件良好","B":"立面開窗面積過大","C":"建築方位及立面設計不當","D":"空調排熱風扇位置不當"},"ans":"C","note":"答案為 C。\n高樓風的成因是高空風速大的氣流撞到高層建築的迎風面後，沿立面向下流（下沖風），再在建築角隅與底部加速，形成剝離流、角隅強風與穿越風。所以主要原因是建築量體的方位（大面寬正對盛行風）、外形與立面設計不當。\n改善方法：避免大面寬正對盛行風；設置裙樓、退縮、角隅切削；用植栽或遮棚緩衝。\nA、B、D 都屬於室內通風、開窗或設備問題，與地面強風無關。 【依據】建築環境控制一般原理（風環境、高樓風）；課程教材：23 S ET 02 氣候與外部環境 p.33"},{"c":3,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"風場預測方法","year":102,"no":15,"art":"1-1 氣候與微氣候","q":"下列何者不屬於風場預測的常用方法？","opts":{"A":"風洞試驗","B":"電腦計算流體力學","C":"專家經驗法則預測","D":"問卷調查法"},"ans":"D","note":"答案為 D。\n建築風場（高樓風、行人風環境）的常用預測方法有：\n・風洞試驗：縮尺模型（A）\n・電腦計算流體力學（CFD）數值模擬（B）\n・依既有研究與案例的專家經驗法則判斷（C）問卷調查法只能事後蒐集使用者對風環境的主觀感受，可用於舒適性評估，但不能「預測」風場的風速分布。\n【依據】建築環境控制一般原理（風環境評估方法）"},{"c":4,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"冷房度時","year":102,"no":19,"art":"1-1 氣候與微氣候","q":"下列何者可用來表示某地區氣候的長期炎熱程度？","opts":{"A":"年較差","B":"絕對最高溫","C":"暖房度時","D":"冷房度時"},"ans":"D","note":"答案為 D。冷房度時（CDH）是把「逐時氣溫超過冷房基準溫度的差值」累加起來，同時反映炎熱的強度與持續時間。我國建築物節約能源設計技術規範 3.1.17 定義冷房度時 DH：每日 8 時至 18 時之逐時外氣溫高於冷房基準溫度 23℃ 之全年溫差累算值，「此數值代表當地之全年炎熱程度」，並用於 ENVLOAD 公式（表 7 依氣候區列值）。A 年較差：只表示最熱月與最冷月的溫差。B 絕對最高溫：只是單一極端值，不代表長期。C 暖房度時：表示寒冷程度（暖氣需求）。 【依據】建築物節約能源設計技術規範 3.1.17、表 7；建築環境控制一般原理（度日、度時）"},{"c":5,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"冷房度時基準溫度","year":103,"no":5,"art":"1-1 氣候與微氣候","q":"我國建築之冷房度時（cooling degree hour）累算值，是以何溫度做為基準？","opts":{"A":"18℃","B":"23℃","C":"28℃","D":"32℃"},"ans":"B","note":"答案 B。建築物節約能源設計技術規範 3.1.17 定義冷房度時 DH：建築物每日某時段內（本規範設定為 8 時至 18 時）之逐時外氣溫高於某一冷房基準溫度（本規範設定為 23℃）之全年溫差累算值，代表當地全年炎熱程度；同規範表 7 亦註明「DH 起算溫度 23 度」，用於 ENVLOAD 公式。A 18℃為國外常用暖房（或冷房）度日基準；C、D 非我國規定之基準。 【依據】建築物節約能源設計技術規範 3.1.17、表 7"},{"c":6,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"高樓風對策","year":103,"no":9,"art":"1-1 氣候與微氣候","q":"下列何種建築外型設計對降低高樓風無明顯效果？","opts":{"A":"減少開窗面積及設計強化玻璃","B":"增加陽台及水平遮陽設計","C":"降低建築高度","D":"調整平面形狀與牆面弧線"},"ans":"A","note":"答案 A。高樓風（大樓風）為高層建築迎風面氣流下沖（下降氣流）及角隅剝離加速所致，對策須改變建築量體與立面以削弱或分散氣流。A 減少開窗與採強化玻璃僅提高建築本身之抗風壓與安全，不改變周圍氣流，對降低高樓風無明顯效果。B 陽台、水平遮陽可阻斷沿立面下沖之氣流；C 降低高度可減少下沖氣流強度；D 調整平面形狀、圓角或弧形牆面可減緩角隅剝離與氣流加速。【查證限制】本機法規與課程教材無高樓風專章，依一般原理。 【依據】課程教材：23 S ET 02 氣候與外部環境 p.33（近地面因高樓形成不穩定強風／擾流，未列對策）；\n高樓風（大樓風）對策（一般原理）"},{"c":7,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"氣溫年較差","year":104,"no":3,"art":"1-1 氣候與微氣候","q":"有關氣溫的年較差之敘述何者正確？","opts":{"A":"年較差是指一年中，日平均氣溫的最高值與最低值之差","B":"年較差是指一年中，月平均氣溫的最高值與最低值之差","C":"年較差是指一年中，絕對氣溫的最高值與最低值之差","D":"高雄地區的年較差，比臺北地區大"},"ans":"B","note":"答案 B。氣候學上「年較差」定義為一年中最熱月與最冷月之月平均氣溫差，故 B 正確、A 錯。C 為「年極端溫差」（絕對最高與絕對最低之差），不是年較差。D 錯：年較差隨緯度降低而變小，且受海洋調節；高雄緯度較低、冬季較暖，年較差比臺北小。課程教材亦說明氣溫受緯度、海拔與是否鄰近海洋影響。 【依據】課程教材：23 S ET 02 氣候與外部環境 p.4（日均溫、月均溫、年均溫、日較差；氣溫受緯度與海洋影響）"},{"c":8,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"風頻圖與海陸風","year":104,"no":7,"art":"1-1 氣候與微氣候","q":"圖中所示為臺南某一地區夏季的風頻圖（上方為北向），下列敘述何者錯誤？\n（附圖：兩張極座標風頻圖（上方為北，同心圓表示頻率，標示 20% 圈）。左「中午 14 時」：西風棒最長（達約20%），棒的外段較粗；西南西棒次長且粗；西北西、西北方向棒中等；西南、南南西等方向棒較短。右「晚上 22時」：各方位棒皆短，以東南方向最長，南南東、南、東南東次之。）","opts":{"A":"白天主要吹西風，晚上吹東南風","B":"白天西南西風的平均風速大於西南風","C":"該地區晚上的風速比白天強","D":"臺南夏季具有明顯的海陸風特性"},"ans":"C","note":"答案 C。風頻圖中棒長表示該風向出現頻率，棒的粗細通常表示平均風速等級。圖中白天（14 時）以西風、西南西風為主且棒粗；晚上（22 時）轉為東南風，各方位棒都短而細，表示風速較弱、靜風較多，故「晚上風速比白天強」錯誤。A、B 與圖相符。D 正確：臺南西臨臺灣海峽，白天陸地增溫快，吹由海向陸的西風（海風）；夜間陸地冷卻快，轉吹由陸向海的東南風（陸風），屬典型海陸風。 【依據】一般氣候學教材（風頻圖判讀、海陸風）"},{"c":9,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"氣溫的日變化與年變化","year":105,"no":2,"art":"1-1 氣候與微氣候","q":"下列敘述何者錯誤？","opts":{"A":"夏至所在月份是最高月平均氣溫出現的時間","B":"一天中最冷的氣溫通常為日出之前，一年中最冷的氣溫通常在 1 月","C":"採用厚重磚石構造的建築物，最熱的室溫可能出現在晚上","D":"熱濕氣候的建築使用高熱容量外殼，可降低尖峰時段之空調耗電量"},"ans":"A","note":"答案 A（錯誤）。地表與海洋具蓄熱作用，氣溫變化落後於日射變化：夏至（6 月）日射最強，但最高月平均氣溫出現在 7～8 月；同理冬至（12 月）日射最弱，最冷月在 1～2 月，日最低溫在日出前、日最高溫在午後 2 時左右，故 B 正確。C：厚重構造熱容量大、時滯長，白天吸收的熱延後數小時釋放，室溫高峰可能出現在晚上，正確。D：高熱容量外殼可削減並延後熱流尖峰，降低尖峰時段空調負荷，正確。課程教材亦指出：全年高低溫相對於夏至、冬至的時滯受地球熱容量影響；全日溫度變動幅度與時滯受建築物熱容量影響。 【依據】課程教材：23S 04 熱傳與材料性能 p.10"},{"c":10,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"水體對微氣候之影響","year":105,"no":11,"art":"1-1 氣候與微氣候","q":"有關水體對環境影響之敘述，下列何者錯誤？","opts":{"A":"水岸空間於冬季低溫時，會因風與人體接觸而使人不舒適","B":"水岸空間於夏季時，會因風與人體接觸而使人舒適","C":"無論任何氣候條件，水體都對周圍環境有正面之改善效果","D":"水體具蒸發冷卻效能"},"ans":"C","note":"答案 C（錯誤）。水體藉蒸發吸熱降低周邊氣溫（D 正確），且水面開闊、粗糙度低，風速較大；夏季熱天時，涼風吹拂人體使人舒適（B 正確），但冬季低溫時，冷風與濕冷使體感更冷（A 正確）。此外濕熱氣候下水體增加空氣濕度，可能使悶熱感增加，水邊也可能滋生蚊蟲。可見水體效果因季節與氣候而異，並非任何條件都有正面效果，故 C 錯誤。課程教材亦指出：氣溫受鄰近海洋或其他水體影響；基地面臨大面積水域或周圍愈空曠，平均風速愈高。 【依據】課程教材：23 S ET 02 氣候與外部環境 p.3、p.4（水體對氣溫之影響）、p.33（面臨水域平均風速較高）"},{"c":11,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"熱島效應與鋪面","year":106,"no":4,"art":"1-1 氣候與微氣候","q":"濕熱氣候區廣場景觀設計，下列何者較易造成熱島效應？","opts":{"A":"植草磚鋪面","B":"景觀水池","C":"柏油鋪面","D":"透水磚鋪面"},"ans":"C","note":"答案 C。熱島效應源於都市地表大量吸收日射、蓄熱且缺乏蒸發散冷卻。柏油鋪面顏色深、日射吸收率高（日射反射率 SRI 低，課程教材：表面愈黑 SRI 愈接近 0、愈吸熱），不透水而無法保水蒸發，白天蓄熱、夜間持續放熱，最易造成熱島。A 植草磚有植栽蒸散與透水；B 景觀水池以水的蒸發與高熱容量降溫；D 透水磚可保水、雨後蒸發降溫；三者皆為減緩熱島之手法。 【依據】課程教材：23 S ET 02 氣候與外部環境 230208 p.32（都市熱島效應）；23 S 04 熱傳與材料性能 230317 p.7～8（表面日射反射率 SRI，愈黑愈接近 0、吸熱）"},{"c":12,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"都市風場","year":108,"no":35,"art":"1-1 氣候與微氣候","q":"有關都市戶外環境風場之敘述，下列何者錯誤？","opts":{"A":"高大建築物的迎風面容易產生下降的渦流","B":"風影區通常是建築群中風速最高、影響最大的區域","C":"風道效應有助於引導氣流並排除大氣污染物","D":"建築物側邊或上方的角隅處是容易產生強風的地方"},"ans":"B","note":"答案 B（錯誤）。風影區（wake，背風側遮蔽區）是建築物背後風速減弱、氣流迴旋的低風速區域，不是風速最高處；風影區過大反而通風不良、污染物與熱氣滯留。A：高樓迎風面上方高速氣流沿立面下衝（下降流），在地面形成渦流強風，正確；C：沿街道、河道的風道可引導氣流、排除熱與污染，正確；D：建築物角隅與頂部氣流剝離加速，易形成強風（角隅風），正確。 【依據】課程教材：23 S ET 02 氣候與外部環境 p.33（都市中心近地面因高樓形成不穩定強風／擾流）；風環境一般原理"},{"c":13,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"都市氣候特性","year":110,"no":36,"art":"1-1 氣候與微氣候","q":"下列有關都市氣候的敘述何者正確？","opts":{"A":"都市的不透水面會降低地面水分蒸發散熱的機會","B":"都市氣候的高溫化常伴隨著潮濕化","C":"都市熱島與空氣污染無直接關聯性","D":"高樓的存在讓都市中心區域的平均風速增加"},"ans":"A","note":"答案 A。都市大量柏油、混凝土等不透水鋪面使雨水迅速排除，地表缺乏水分，蒸發散（潛熱散熱）大幅減少，更多日射轉為顯熱，加劇熱島。B 錯：都市高溫化常伴隨「乾燥化」（相對濕度降低，所謂乾燥島）；C 錯：\n熱島與空氣污染互相影響，熱島環流使污染物聚集於市中心，高溫也促進光化學煙霧與臭氧生成；D 錯：都市粗糙度大，高樓與密集建築使平均風速降低（雖局部有峽谷風、角隅強風），整體通風不良。課程教材（ET02 p.33）：\n都市中心區風速最低，但近地面因高樓的存在形成不穩定的強風與擾流。 【依據】課程教材：23 S ET 02 氣候與外部環境 p.33（地況與平均風速）"},{"c":14,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"臺灣都市低層建築之環境議題","year":112,"no":38,"art":"1-1 氣候與微氣候","q":"何者不是臺灣都市低層建築常面臨的環境議題？","opts":{"A":"噪音","B":"空氣污染","C":"熱島效應","D":"日照過多"},"ans":"D","note":"答案 D。臺灣都市低層建築（尤其鄰近道路、被高樓環繞者）常面臨：①噪音（交通、鄰里活動）；②空氣污染（車輛、工廠、道路揚塵）；③熱島效應（鋪面多、綠地少、空調排熱）。至於日照，低層建築在高密度都市反而常遭高層建築遮蔽，面臨日照不足而非日照過多之問題，故 D 不是其常見之議題。 【依據】都市環境教材（熱島、噪音、空氣污染、日照）"},{"c":15,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"臺灣平地氣候設計策略","year":113,"no":3,"art":"1-1 氣候與微氣候","q":"在無建築設備的條件下，下列那些設計策略適合應用於臺灣平地氣候的建築物？①氣密性較高 ②遮陽較深 ③通風性較佳 ④隔熱性較佳","opts":{"A":"僅①②③","B":"僅①③④","C":"僅②③④","D":"①②③④"},"ans":"C","note":"答案 C。臺灣平地屬高溫多濕的亞熱帶／熱帶氣候，被動式設計以「遮陽（深遮陽阻擋日射）、通風（排除濕熱、利用風速提升體感）、隔熱（減少屋頂牆面熱傳）」為主，故②③④適合。①氣密性高：在無空調（無建築設備）條件下，室內濕熱無法排除、無法靠自然通風散熱，反使悶熱；氣密僅在有空調時為節能，故不選。\n【依據】課程教材：23 S ET 05 熱舒適節能設計 p.2（過熱期：隔熱、遮陽、潮濕用自然通風；氣密列於過冷期策略）"},{"c":16,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"都市熱島效應","year":113,"no":4,"art":"1-1 氣候與微氣候","q":"都市中基地在相同法定空地條件下，採用何種設計手法產生之熱島效應相對最為嚴重？","opts":{"A":"大量草溝","B":"大量水池","C":"大量綠化","D":"大量硬質鋪面"},"ans":"D","note":"答案 D。熱島效應主因是不透水硬質鋪面（柏油、混凝土）吸收日射並儲熱、蒸發散作用幾乎為零，夜間再釋放熱量。草溝、水池與綠化皆可藉蒸發散與植栽遮蔭降溫（草溝有土壤與植被；水池有蒸發冷卻；綠化有蒸散與遮蔭），故熱島效應最嚴重者為大量硬質鋪面。 【依據】課程教材：23 S ET 02 氣候與外部環境 p.32（都市熱島）；23 S 04 熱傳與材料性能 p.8（SRI）"},{"c":17,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"風土建築閣樓與屋頂","year":113,"no":22,"art":"1-1 氣候與微氣候","q":"各國的民居建築，在天花板與屋頂之間常有閣樓空間的存在，就適應風土的建築熱環境策略而言，下列敘述何者錯誤？","opts":{"A":"晝熱夜寒的乾燥氣候區，閣樓空間盡量不通風","B":"晝熱夜寒的乾燥氣候區，屋頂採用深色石板","C":"熱帶的濕熱氣候區，閣樓空間盡量不通風","D":"熱帶的濕熱氣候區，屋頂採用厚草料"},"ans":"C","note":"答案 C（錯誤）。濕熱氣候區要靠通風排熱排濕，閣樓應盡量通風（開口、百葉），以排除屋頂傳入的熱並防止濕氣滯留，故「盡量不通風」錯。A：乾燥氣候晝夜溫差大，閣樓不通風可作為熱緩衝／保溫空氣層 ✓。B：深色厚重石板屋頂蓄熱量大，白天吸熱、夜間緩慢放熱，使室內溫度波動小，適合晝熱夜寒氣候 ✓。D：厚草料（茅草）導熱率低，具良好隔熱，且重量輕、可通風，適合濕熱氣候 ✓。 【依據】課程教材：23 S ET 05 熱舒適節能設計 p.2、p.9（潮濕用自然通風；晝夜溫差大者用蓄熱體）；建築物節約能源設計技術規範附錄一（110 年版）表1.1 中空層熱阻 ra（閣樓／雙層屋頂中空層有通風 0.46～0.78＞無通風 0.28）"},{"c":18,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-1 氣候與微氣候","h3":"度日與度時","year":114,"no":3,"art":"1-1 氣候與微氣候","q":"關於氣候積分指標的敘述，下列何者錯誤？","opts":{"A":"氣候積分指標可以用來評估植物的成長量","B":"歐美等寒帶國家常用暖房度日來表示當地的寒冷程度","C":"度日與度時都是溫差的積分值，只是計算間隔有差異而已","D":"冷房度日比冷房度時能掌握細微的氣溫變動"},"ans":"D","note":"答案 D（錯誤）。度日（degree-day）以「日平均氣溫」與基準溫度之差逐日累計；度時（degree-hour）以「每小時氣溫」逐時累計，時間解析度較細，較能反映日夜溫差等細微氣溫變動。故應為冷房度時比冷房度日更能掌握細微變動，D 說反了。A 正確：積溫（生長度日）常用以評估作物生長。B 正確：寒帶國家以暖房度日（HDD）表示寒冷程度與暖房需求。C 正確：兩者皆為溫差對時間的積分，差別在計算間隔（日或時）。 【依據】建築物節約能源設計技術規範 3.1.17（冷房度時：逐時外氣溫累算）；氣候指標（一般原理）"},{"c":19,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-2 日照與遮陽","h3":"日射量","year":102,"no":10,"art":"1-2 日照與遮陽","q":"有關日射量之敘述，下列何者正確？","opts":{"A":"臺灣全年南向立面的日射量高於水平面的日射量","B":"大氣透過率不佳時，直達日射量會較高","C":"擴散日射量多，各方位垂直日射量差異小","D":"日射量與地區的經度有明顯的正相關性"},"ans":"C","note":"答案為 C。\n擴散（天空）日射來自整個天空，方向性小。擴散日射比例越高（例如陰天），各方位垂直面受到的日射量越接近，所以差異小。\nA 錯誤：臺灣緯度低（約 22～25°），太陽高度角大，全年日射量以水平面（屋頂）最大，南向立面較小。所以屋頂隔熱最重要。\nB 錯誤：大氣透過率差（多塵、多雲、多水氣）時，直達日射減少，擴散日射比例增加。\nD 錯誤：日射量主要與緯度、海拔和天候有關，與經度沒有正相關。 【依據】建築環境控制一般原理（日射：直達與擴散日射）；課程教材：23 S ET 02 氣候與外部環境 p.16；建築物節約能源設計技術規範 表 8 各地區日射修正係數 fk（以臺北南向冷房日射時為 1.00；水平面 2.31～4.03，各垂直方位 0.71～1.90）"},{"c":20,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-2 日照與遮陽","h3":"太陽軌跡與赤緯","year":103,"no":13,"art":"1-2 日照與遮陽","q":"有關太陽的軌跡與位置之敘述，下列何者正確？","opts":{"A":"地球的公轉與自轉稱為視運動，然對於地球上的人們所觀察的天體運行而言稱為真運動","B":"太陽一天當中沿著天球表面運轉軌跡稱為日徑或赤緯圈，其位置隨著季節而異","C":"以北半球而言，冬至日是指農曆 12 月 22 日，赤緯圈達到最南端","D":"春分日及秋分日，其日赤緯正好為 23°27’"},"ans":"B","note":"答案 B。太陽一日在天球上之運行軌跡稱為日徑（赤緯圈），隨季節之日赤緯變化而南北移動。A 錯：地球實際之公轉與自轉為「真運動」，地球上觀察到之天體運行為「視運動」，敘述顛倒。C 錯：冬至約在國曆（陽曆）12 月 22 日前後，非農曆；當日日赤緯約－23°27′，赤緯圈位於最南端。D 錯：春分、秋分日赤緯為 0°，23°27′為夏至（冬至為負值）之日赤緯。課程教材亦載：春秋分正午太陽高度角＝90°－緯度，夏至、冬至則再加減轉軸傾角（約 23.4°），即春秋分日赤緯為 0。【查證限制】「日徑」「視運動、真運動」等名詞本機教材未列，依一般原理。 【依據】課程教材：23 S ET 02 氣候與外部環境 p.5～p.7（地軸傾角、太陽軌跡與正午太陽高度角）；天球與日赤緯（一般原理）"},{"c":21,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-2 日照與遮陽","h3":"臺灣日射量分布","year":104,"no":38,"art":"1-2 日照與遮陽","q":"有關臺灣地區日射量的分布敘述，下列何者正確？","opts":{"A":"臺灣地區水平日射量較北向日射量低","B":"臺灣地區的年平均日射量分布，由東北向西南海岸遞減","C":"臺灣地區的年平均日射量分布，大致上與日照時數分布或晴雨天變化無關","D":"臺灣的氣候型態，建築開口應避免日射量大的方位，如西向方位"},"ans":"D","note":"答案 D。臺灣屬高溫多濕氣候，降低日射得熱是外殼節能重點；西向立面在午後高氣溫時段承受強烈低角度日射，應避免大面積開口或以遮陽、緩衝空間處理，D 正確。A 錯：低緯度地區太陽高度高，水平面日射量遠大於北向立面。B 錯：臺灣東北部冬季多雨、日照少，西南沿海晴天多，年日射量是由西南向東北遞減（說反了）。C錯：日射量受雲量影響，與日照時數、晴雨天分布密切相關。 【依據】課程教材：23 S ET 02 氣候與外部環境p.16（水平日射量受緯度、海拔、雲量、塵量影響）；23 S ET 05 熱舒適節能設計 p.13（西向等日射較大方位）；\n建築物節約能源設計技術規範 表 8 各地區日射修正係數 fk（以臺北南向冷房日射時為 1.00；水平面 2.31～4.03，各垂直方位 0.71～1.90）"},{"c":22,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-2 日照與遮陽","h3":"南向遮陽形式效果排序","year":105,"no":3,"art":"1-2 日照與遮陽","q":"在臺灣 5 月份某日正午時，某建築物之南向開窗設計如下，若在相同遮陽深度條件下，請依照遮陽效果按優劣順序排序：\n（附圖：四個南向立面開窗示意圖：①窗上方設水平遮陽板；②窗兩側設垂直遮陽板（垂直鰭板）；③窗上方水平板與兩側垂直板組成之框型（格子）遮陽；④無遮陽。）","opts":{"A":"③>②>①>④","B":"①>③>②>④","C":"③>①>②>④","D":"②>③>①>④"},"ans":"C","note":"答案 C。臺灣約位於北緯 22～25°，5 月份太陽赤緯已接近北回歸線，正午太陽高度角接近 90°，日射幾乎由正上方照射南向窗，故水平遮陽最有效；垂直遮陽主要遮擋低角度、斜向（東西側）日射，正午效果有限。框型遮陽同時具水平與垂直板，遮蔽效果最佳。故效果為 ③框型 > ①水平 > ②垂直 > ④無遮陽。A、D 把垂直遮陽排在水平遮陽之前；B 把水平排在框型之前，皆錯。 【依據】課程教材：23 S ET 05 熱舒適節能設計 p.17（水平遮陽與垂直遮陽）、p.19（挑檐主要用於南向，遮光角等於太陽高度角）"},{"c":23,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-2 日照與遮陽","h3":"可照時數與日照時數","year":105,"no":13,"art":"1-2 日照與遮陽","q":"下列有關於日照時間的敘述，何者正確？","opts":{"A":"可照時數通常大於日照時數","B":"澎湖的可照時數比日照時數來得少","C":"理論上同緯度的兩地點之日照時數相同","D":"臺北盆地的可照時數比日照時數來得少"},"ans":"A","note":"答案 A。可照時數是不受雲量、地形遮蔽影響時，日出到日沒的理論時數，只由緯度與日期決定；日照時數是實際測得太陽直射達到一定強度的時數，受雲、霧、空氣污染、地形遮蔽而減少，所以日照時數必小於或等於可照時數，A 正確；B、D 顛倒（任何地點可照時數都不會少於日照時數）。C：同緯度的「可照時數」理論上相同，但「日照時數」因天氣不同而不同，錯誤。日照率 = 日照時數／可照時數。【查證限制】課程教材未列可照時數、日照時數之定義，依一般建築日照教材。 【依據】一般建築日照教材（可照時數、日照時數、日照率）"},{"c":24,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-2 日照與遮陽","h3":"遮陽形式與外遮陽係數","year":105,"no":35,"art":"1-2 日照與遮陽","q":"在臺灣，下列各種關於遮陽之敘述，何者錯誤？","opts":{"A":"建築南向立面較適合水平遮陽","B":"建築東西立面較適合垂直遮陽","C":"外遮陽係數 Ki 值越大，遮陽效果越好","D":"多孔隙、百葉型等金屬材質遮陽版設計，除可遮陽外並兼具散射導光之功能"},"ans":"C","note":"答案 C（錯誤）。建築物節約能源設計技術規範 3.1.15 定義窗遮陽係數 K 為日射量經過某外遮陽穿透進透光開窗部位之比率；無外遮陽時 Ki = 1.0（105 年當時之學校類節能規範 8.2 亦定義 ki 為外遮陽係數，無外遮陽時為1.0），數值越小代表穿透的日射越少，遮陽效果越好，故 Ki 越大遮陽效果越差。A：南向日射高度角大，水平遮陽有效，正確。B：東西向日射高度角低、方位角斜，垂直（或格子、可動）遮陽較有效，正確。D：多孔、百葉遮陽板可遮直射並將光反射、散射入室，正確。課程教材亦定義遮陽係數為使用遮陽設施後輻射熱透過之比率（室外固定設施約 0.15～0.6），數值越小越好。 【依據】建築物節約能源設計技術規範 3.1.15、9.2.4.4；學校類大型空間類及其他類建築物節約能源設計技術規範（舊版）8.2；課程教材：23 S ET 05 熱舒適節能設計 p.17、p.19、p.23"},{"c":25,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-2 日照與遮陽","h3":"地表日射量影響因子","year":106,"no":5,"art":"1-2 日照與遮陽","q":"下列何者不是地表日射量的影響因子？","opts":{"A":"經度","B":"緯度","C":"濕度","D":"高度"},"ans":"A","note":"答案 A。地表日射量取決於太陽高度角與日照時間（受緯度、季節影響）、大氣透過率（受濕度、水蒸氣、雲量、懸浮微粒影響）及海拔高度（高度愈高，通過之大氣層愈薄，日射愈強）。經度只決定同一緯度地點太陽到達正中的「時刻」（時差），不改變一年中所接受之日射量，故不是影響因子。課程教材亦載明（水平）日射量受緯度、海拔、雲量、塵量影響（p.16），太陽輻射量因緯度、海拔、雲量、塵量形成地區差異（p.15）；濕度（水蒸氣、雲）屬大氣透過率因素。B 緯度、C 濕度、D 高度皆會影響。 【依據】課程教材：23 S ET 02 氣候與外部環境 230208 p.15～16"},{"c":26,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-2 日照與遮陽","h3":"各方位日射量","year":107,"no":25,"art":"1-2 日照與遮陽","q":"以臺灣所在緯度而言，下列那一部位的建築外殼全日所接受的總日射量最多？","opts":{"A":"東向立面","B":"西向立面","C":"南向立面","D":"屋頂水平面"},"ans":"D","note":"答（D）。臺灣約位於北緯 22～25 度，接近北回歸線，太陽高度角大，夏季正午太陽幾近天頂。水平屋頂全天自日出至日落都受日照，且入射角小（日射接近垂直），全日總日射量遠大於任何垂直立面，因此屋頂隔熱是低緯度地區建築節能的重點。（A）東向與（B）西向立面只在上午或下午受日照（西曬因同時氣溫高而熱負荷大，但總日射量不及屋頂）；（C）南向立面在夏季太陽高度高時入射角大，受熱較少，冬季較多。 【依據】建築物節約能源設計技術規範 表 8 各地區日射修正係數 fk（以臺北南向冷房日射時為 1.00；水平面 2.31～4.03，各垂直方位0.71～1.90）；課程教材：23 S ET 02 氣候與外部環境 p.7、p.16"},{"c":27,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-2 日照與遮陽","h3":"夏至南向立面日射量與緯度","year":108,"no":4,"art":"1-2 日照與遮陽","q":"①臺北 ②新加坡 ③香港 ④巴賽隆納四城市在晴朗無雲的夏至日中午，將建築物南向立面（垂直於地面）所接受的日射量由大到小排列，下列何者正確？","opts":{"A":"④①③②","B":"④①②③","C":"②③①④","D":"③②①④"},"ans":"A","note":"答案 A。夏至日太陽赤緯約＋23.45°，北緯 φ 城市南中高度角 h＝90°－φ＋23.45°。巴賽隆納（約北緯 41°）h≈72°，太陽在南方，南向垂直面直射入射餘弦 cos72°≈0.31，最大；臺北（約 25°）h≈88.5°，太陽仍略偏南，南立面只受極少直射；香港（約 22°，在北回歸線以南）太陽已略偏北天頂，南立面幾乎只受擴散光；新加坡（約 1°）太陽在北方高度約 68°，南立面完全不受直射，且太陽偏北較遠，所受天空擴散光也最少。故 ④＞①＞③＞②。\n（南中高度角公式見課程教材；教材亦示臺北夏季早晚太陽偏北。） 【依據】課程教材：23 S ET 02 氣候與外部環境 230208 p.7、p.36"},{"c":28,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-2 日照與遮陽","h3":"太陽、日照與日射","year":109,"no":10,"art":"1-2 日照與遮陽","q":"有關太陽與日照、日射的敘述，下列何者較為正確？","opts":{"A":"日射係指太陽輻射中的光能","B":"臺灣地區全年日照時數可達 3000 小時以上","C":"臺灣各地區全年的日射量十分接近","D":"冬至日正午時，美國紐約市（緯度約 40）太陽高度角較臺北（緯度約 25）之高度角小"},"ans":"D","note":"答案 D。正午太陽高度角 h＝90°－緯度＋赤緯；冬至赤緯約 －23.4°。紐約：h≈90－40－23.4＝26.6°；臺北：h≈90－25－23.4＝41.6°，紐約較小，(D) 正確（兩次計算結果相同）。(A) 日射是太陽輻射的全部熱能（含紫外線、可見光、紅外線），不只是光能。(B) 臺灣各地全年日照時數約在 1,400～2,400 小時間（見第 34 題），不到3000 小時。(C) 各地因氣候與雲量差異，日射量差異明顯（如臺北低、南部高；見技術規範表 8 各地日射修正係數fk 之差異）。（課程教材佐證：地表日射頻譜約含紫外線 5%、可見光 46%、近紅外線 49%，故日射不只是光能。） 【依據】通用天文公式；建築物節約能源設計技術規範表 8（各地日射修正係數）；課程教材：23 S ET 02氣候與外部環境 230208.pdf p.15"},{"c":29,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-2 日照與遮陽","h3":"臺灣各城市日照時數","year":109,"no":34,"art":"1-2 日照與遮陽","q":"臺灣近 10 年來之平均日照時數統計，那個城市最低？","opts":{"A":"高雄","B":"臺中","C":"臺北","D":"臺東"},"ans":"C","note":"答案 C。臺北盆地全年雲量多、冬季受東北季風影響陰雨日多，年日照時數明顯偏低（約 1,400～1,500 小時），為臺灣主要城市中最少者；高雄、臺中、臺東等地年日照時數多在 2,000 小時上下或更高。建築物節約能源設計技術規範表 8 以臺北南向為基準（fk＝1.00），其他地區同方位的 fk 都比較大（南向：臺中 1.51、花蓮 1.02、高雄 1.70、臺東 1.63），也顯示臺北的冷房期日射量最低。【查證限制】日照時數數值為氣象署統計之概略值，本機無逐年統計原文，僅作判斷參考。 【依據】氣象署氣候統計（本機無原文）；建築物節約能源設計技術規範表8"},{"c":30,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-2 日照與遮陽","h3":"日射遮蔽係數組合","year":111,"no":13,"art":"1-2 日照與遮陽","q":"兩種玻璃與兩種外遮陽的日射遮蔽能力分別為：a 玻璃 η = 1.0、b 玻璃 η = 0.6、c 外遮陽 Ki = 0.8、d 外遮陽 Ki =0.5；採用下列何種搭配可得到最佳的日射遮蔽效果？","opts":{"A":"a 玻璃搭配 c 外遮陽","B":"a 玻璃搭配 d 外遮陽","C":"b 玻璃搭配 c 外遮陽","D":"b 玻璃搭配 d 外遮陽"},"ans":"D","note":"答案 D。η 為玻璃日射透過率（日射量垂直通過玻璃之比率），Ki 為外遮陽係數（日射量經外遮陽穿透進開窗部位之比率），兩者都是「透過比率」，數值愈小表示進入室內的日射熱愈少；節能規範計算開窗日射取得時即以 ηi × Ai × Ki 相乘。A：1.0×0.8 = 0.8；B：1.0×0.5 = 0.5；C：0.6×0.8 = 0.48；D：0.6×0.5 = 0.30。D 最小，遮蔽效果最佳。驗算：6×5 = 30 → 0.30 ✓。（課程教材：遮陽係數 SC 為使用遮陽設施後輻射熱透過之比率，室外可調設施約 0.1～0.3，數值愈小遮蔽愈佳。） 【依據】建築物節約能源設計技術規範 3.1.15、3.1.16、9.1.4 公式(20)；課程教材：23 S ET 05 熱舒適節能設計 p.23"},{"c":31,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-2 日照與遮陽","h3":"日照時數、可照時數與日照率","year":111,"no":14,"art":"1-2 日照與遮陽","q":"有關日照率之敘述，下列何者正確？","opts":{"A":"在相同緯度的地點，日照時數不一定相同","B":"可照時數為一日當中於周圍環境天空無障礙所能獲得之照射時數","C":"日照時數通常較可照時數來得大","D":"日照率的計算是由可照時數與日照時數的差值，除以可照時數後求得"},"ans":"A 或 B 均給分（更正前公告答案 A）","note":"考選部未公布更正理由，以下為推測（課程教材未定義可照時數）。A：同緯度下，因雲量、降雨、霧、地形遮蔽等不同，實際日照時數不一定相同 ✓。B：可照時數指一日中太陽在地平線以上、天空無障礙時理論上可獲得的照射時數，題目敘述與此定義相符，推測因此一併給分。C：日照時數是實際照到的時數，不會大於可照時數，錯誤。D：日照率 = 日照時數 ÷ 可照時數 × 100%，不是差值除以可照時數，錯誤。 【依據】一般建築日照教材（可照時數、日照時數、日照率；課程教材未定義）"},{"c":32,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"傳熱與隔熱","year":102,"no":7,"art":"1-3 熱傳、隔熱與熱舒適","q":"有關傳熱和隔熱之敘述，下列何者錯誤？","opts":{"A":"同種發泡性隔熱材，若空隙率愈大，則熱傳導率會越大","B":"冬季為了防止外牆之內部結露，外隔熱比內隔熱有利","C":"纖維類之隔熱材，若因結露而含有濕氣，則其傳導熱阻會變小","D":"外牆之角隅部位之熱傳透率，一般比其他部位之熱傳透率大"},"ans":"A","note":"答案為 A。\n發泡隔熱材是靠內部封閉的微小氣泡（靜止空氣或發泡氣體）來隔熱，靜止氣體的熱傳導率遠低於固體骨架。同種材料空隙率越大，固體傳導路徑越少，熱傳導率越「小」，隔熱越好，所以 A 錯誤。（纖維類材料密度過低時，對流與輻射增加，熱傳導率反而上升；但這不是一般情形，也與題意相反。）B 正確：外隔熱使結構體保持較高溫度，壁體內部溫度不易降到露點以下，可減少內部結露。\nC 正確：水的熱傳導率約為空氣的 20 幾倍，隔熱材受潮後熱阻變小。\nD 正確：角隅是幾何熱橋，散熱面積大於吸熱面積，熱傳透率較大，也容易結露。 【依據】建築環境控制一般原理（隔熱材、熱橋、內部結露）"},{"c":33,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"穩定熱傳透量","year":102,"no":32,"art":"1-3 熱傳、隔熱與熱舒適","q":"壁體穩定熱傳透量計算與下列何者無關？","opts":{"A":"室內外溫度差","B":"壁體面積","C":"壁體材料熱阻係數","D":"壁體熱容量"},"ans":"D","note":"答案為 D。\n穩定（定常）熱傳透量公式：\nQ = U × A × Δt\n・U = 1 ÷ ΣR（由各層材料熱阻與表面熱傳達阻抗求得，對應 C）\n・A：壁體面積（B）\n・Δt：室內外溫度差（A）熱容量只在溫度隨時間變化的「非穩定」熱傳中，才影響時滯與振幅衰減；穩定狀態下壁體不再蓄熱或放熱，所以與熱容量無關。 【依據】建築環境控制一般原理（穩定熱傳、熱容量）；課程教材：23 S 04 熱傳與材料性能 p.6"},{"c":34,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"外牆熱傳透量計算","year":103,"no":1,"art":"1-3 熱傳、隔熱與熱舒適","q":"某鋼筋混凝土外牆，厚 15 cm，面積 100 m²，若其熱傳透率 U 值為 1.3 Kcal/m²h℃，在室內氣溫為 26℃，室外氣溫為 33℃時，則其每小時之熱傳透量為多少？","opts":{"A":"910 Kcal/h","B":"1170 Kcal/h","C":"1320 Kcal/h","D":"1530 Kcal/h"},"ans":"A","note":"答案 A。穩態熱傳透量 Q＝U×A×Δt，U 值已含牆厚與內外表面熱傳，故「厚 15 cm」為多餘條件。代入：Q＝1.3×100×(33－26)＝1.3×100×7＝910 Kcal/h。驗算一：1.3×100＝130，130×7＝910；驗算二：100×7＝700，700×1.3＝910。B（1170＝1.3×100×9）、C、D 均非正確溫差代入之結果。 【依據】課程教材：23 S 04 熱傳與材料性能 p.6、p.13（穩態傳導、熱傳透率 U）；熱傳透基本公式 Q＝U·A·Δt"},{"c":35,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"室內溫熱環境","year":103,"no":3,"art":"1-3 熱傳、隔熱與熱舒適","q":"有關室內理想溫熱環境之敘述，下列何者錯誤？","opts":{"A":"站立者之頭部與腳部附近的空氣溫度差，以不超過 5℃為限","B":"室內、室外之溫度差 5℃以上時，在出入時會帶給人不愉快之感覺","C":"室溫 26℃，房間內的風速在 0.5 m/s 以下為宜","D":"人在自然通風空間中比在空調空間中，可忍受較高的室溫"},"ans":"A","note":"答案 A（錯誤）。一般熱舒適準則（如 ISO 7730、ASHRAE 55）建議頭部（約 1.1 m）與腳踝（約 0.1 m）高度之垂直空氣溫差不超過約 3℃，5℃已會造成局部不舒適（頭熱腳冷）。B 正確：室內外溫差約 5℃以上時出入有冷熱衝擊感。C 正確：課程教材指出 20～26℃穩定空調下氣流速達 0.5 m/s 即感受到風擊，居住域到達風速宜 0.5m/s 以下。D 正確：同教材指出氣溫略高之自然通風狀態可接受 2～3 m/s 風速維持熱舒適（適應性熱舒適）。課程教材 07 空調系統與空間計畫 p.62 亦將「暖氣時上下溫度差是否太大」列為送風口設計檢討事項，但未給數值。\n【查證限制】垂直溫差 3℃之數值（ISO 7730、ASHRAE 55）及 B 之室內外溫差 5℃，本機法規與教材均無原文，依一般原理。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.24；07 空調系統與空間計畫 p.56、p.62；熱舒適準則（ISO 7730、ASHRAE 55，一般原理）"},{"c":36,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"平均輻射溫度 MRT","year":103,"no":4,"art":"1-3 熱傳、隔熱與熱舒適","q":"某辦公室中坐在窗邊的員工因受到太陽的直射而覺得不舒適，下列何者最適於評估該座位的熱舒適性？","opts":{"A":"MRT","B":"ET","C":"濕球溫度","D":"乾球溫度"},"ans":"A","note":"答案 A。窗邊座位受日射直射，不舒適主因為輻射熱，應以平均輻射溫度 MRT（Mean Radiant Temperature，周圍表面及日射對人體輻射換熱之等效均勻溫度）評估。B 有效溫度 ET 綜合氣溫、濕度、氣流，但原始 ET 未考慮輻射；C 濕球溫度與 D 乾球溫度僅反映空氣溫濕度狀態，無法表達日射直射之輻射熱影響。課程教材並指出每 100W/m² 之日射約可提升 3℃體感溫度。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.25（MRT 定義）、p.26（日射對體感溫度之影響）；05 空調設備基礎知識 p.25"},{"c":37,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"表面日射反射率","year":103,"no":6,"art":"1-3 熱傳、隔熱與熱舒適","q":"下列何種材料之表面對日射的反射率最高？","opts":{"A":"黑色瀝青","B":"白色磁磚","C":"灰色混凝土","D":"紅色鍍鋅鐵皮"},"ans":"B","note":"答案 B。表面對日射之反射率主要取決於顏色明度與表面性質，淺色、光滑表面反射率高、吸收率低。白色磁磚為四者中顏色最淺且表面光滑者，反射率最高；A 黑色瀝青吸收率最高、反射率最低；C 灰色混凝土與 D 紅色鍍鋅鐵皮之顏色較深，日射吸收率居中偏高。屋頂、外牆採淺色高反射材可減少日射得熱並降低熱島效應。課程教材指出建材表面日射反射率（SRI）與可見光反射率非常接近，日射吸收率 a＝1－SRI。 【依據】課程教材：23 S04 熱傳與材料性能 p.8、p.9"},{"c":38,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"外牆內部溫度分布與隔熱位置","year":104,"no":1,"art":"1-3 熱傳、隔熱與熱舒適","q":"下圖為冬季穩定狀態，外牆 A、B 之內部溫度分布，則下列敘述何者錯誤？圖中構成材料甲、乙、丙、丁之各材料和厚度之於 A、B 兩牆壁中皆相同。\n（附圖：兩道外牆剖面，左為室外（低溫 θo）、右為室內（高溫 θr）。A 牆由外而內為甲、乙、丙（點狀材料）、丁，溫度線在甲、乙中緩升，在靠室內側之丙層內急遽上升；B 牆由外而內為甲、丙、乙、丁，溫度線在靠室外側之丙層內急遽上升，其後在乙中緩升。）","opts":{"A":"熱傳導率乙比丙大","B":"A、B 之熱傳透率皆相等","C":"A 屬於外隔熱構造","D":"將 B 牆中丙之熱容量增大，則其室溫變動率會變小"},"ans":"C","note":"答案 C。穩態下各層熱流相同，溫度梯度大者熱傳導率小；丙層溫降最陡，可知丙是隔熱材。A 牆的丙位於室內側，屬「內隔熱」；B 牆的丙位於室外側才是「外隔熱」，故 C 錯。A 正確：乙的溫度梯度比丙小，熱傳導率乙＞丙。B 正確：兩牆材料與厚度相同，只是層序不同，總熱阻與熱傳透率 U 相同。D 正確：增加牆體熱容量可提高蓄熱，緩和室溫變動。 【依據】課程教材：23 S 04 熱傳與材料性能 p.16–21（熱阻、熱傳透率與各層溫降）"},{"c":39,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"結露","year":104,"no":2,"art":"1-3 熱傳、隔熱與熱舒適","q":"有關結露現象之敘述，下列何者錯誤？","opts":{"A":"促進壁櫥內通風可減少結露之發生","B":"夏季白天在空調空間窗玻璃的結露通常發生於室內側","C":"減少室內水蒸氣量之發生可防止結露","D":"在外牆內的隔熱層於水蒸氣壓較高之一側張貼防溼層，可防止結露"},"ans":"B","note":"答案 B。夏季白天空調房間玻璃被室內冷氣冷卻，溫度低於「室外」高溫高濕空氣的露點，所以結露發生在玻璃「室外側」；冬季暖房時才是在室內側結露，故 B 錯。A 正確：壁櫥通風不良，壁面溫度低又潮濕，通風可降低濕度、提高表面溫度。C 正確：降低室內水蒸氣量即降低露點溫度。D 正確：防濕層（防潮層）應設於隔熱層水蒸氣壓較高的一側（通常為高溫側），阻止水蒸氣進入隔熱層內部冷卻結露。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.23（兩種結露狀況）；23 S ET 02 氣候與外部環境 p.14"},{"c":40,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"雙層屋頂中空層熱阻","year":104,"no":4,"art":"1-3 熱傳、隔熱與熱舒適","q":"有關雙層屋頂中空層的熱阻，下列何者最高？","opts":{"A":"無通風、厚度 10 cm","B":"無通風、厚度 20 cm","C":"有通風、厚度 10 cm","D":"有通風、厚度 20 cm"},"ans":"D","note":"答案 D。節能規範直接以表列值給定中空層熱阻 ra。104 年考試時適用之舊版學校類規範表 6-1：閣樓空間、雙層壁或雙層屋頂之中空層，無通風 0.28；有通風、空氣層＜20 cm 為 0.46；有通風、空氣層≧20 cm 為 0.78（m²·K/W）。代入四個選項：A、B 無通風均為 0.28；C 有通風 10 cm 為 0.46；D 有通風 20 cm 為 0.78，D 最高。\n通風可把上層屋面傳入中空層的日射熱排走，故熱阻較大。課程教材也說空氣層之 R 值可因通風排熱或使用鋁箔而增加。版本差異：現行 110 年版附錄一表 1.1 把分界改為 50 cm（有通風 10～50 cm 為 0.46，≧50 cm 為 0.78），依現行表 C、D 同為 0.46，但「有通風高於無通風」的結論不變。 【依據】學校類大型空間類及其他類建築物節約能源設計技術規範（舊版，2011）表 6-1 中空層熱阻 ra（PDF p.28）；建築物節約能源設計技術規範附錄一（110年版）表 1.1 中空層熱阻 ra；課程教材：23 S 04 熱傳與材料性能 p.16（空氣層之 R 值可因通風排熱或鋁箔而增加）"},{"c":41,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"乾濕球溫度與空氣線圖","year":104,"no":5,"art":"1-3 熱傳、隔熱與熱舒適","q":"使用阿斯曼通風溫濕度計量得某環境之乾球溫度 Td 與濕球溫度 Tw，若 Td 不等於 Tw，下列敘述何者錯誤？","opts":{"A":"Td 與 Tw 之熱焓（enthalpy）相同","B":"Td 與 Tw 之絕對濕度相同","C":"Td 與 Tw 之相對濕度不同","D":"Td 與 Tw 之飽和絕對濕度不同"},"ans":"B","note":"答案 B。在空氣線圖上，濕球溫度是空氣經絕熱飽和（等焓、加濕）到達飽和線的溫度：由狀態點（Td）沿等焓線（近似等濕球線）移到飽和點（Tw）。此過程熱焓近似不變，故 A 正確；但水分蒸發加入空氣，飽和點的絕對濕度比原狀態「高」，故 B 錯。C 正確：Tw 點在飽和線上 RH＝100%，原狀態 RH＜100%。D 正確：飽和絕對濕度隨溫度而變，Td≠Tw 時兩者不同。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.5、p.17（濕球溫度、空氣線圖）；05 空調設備基礎知識 p.38"},{"c":42,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"外牆平均熱傳透率","year":105,"no":1,"art":"1-3 熱傳、隔熱與熱舒適","q":"某建築物之鋼筋混凝土外牆面積為 12 m²，其中玻璃窗戶面積約為 2.4 m²，若鋼筋混凝土之熱傳透率 U 值為 1.3W/m²K，窗之熱傳透率 U 值為 2.4 W/m²K，則平均 U 值為多少 W/m²K？","opts":{"A":"1.72","B":"1.78","C":"1.52","D":"1.62"},"ans":"C","note":"答案 C。平均熱傳透率依面積加權：U = Σ(Ui×Ai)／ΣAi。外牆總面積 12 m²中窗 2.4 m²，混凝土實牆為 12－2.4＝9.6 m²。U =（9.6×1.3＋2.4×2.4）／12 =（12.48＋5.76）／12 = 18.24／12 = 1.52 W/m²K。驗算：實牆占 0.8、窗占 0.2，0.8×1.3＋0.2×2.4＝1.04＋0.48＝1.52，兩法一致。若誤以 12 m² 全為混凝土再加窗（分母 14.4）得 1.48；其他選項皆為計算錯誤。節能規範計算平均熱傳透率時，亦以各部位 U 值乘面積加總後除以總面積（如屋頂含天窗之Uar 公式）。 【依據】建築物節約能源設計技術規範附錄一（110 年版）式(1-2)、(1-3)（面積加權平均之計算方式）"},{"c":43,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"頂樓過熱之原因與改善","year":105,"no":4,"art":"1-3 熱傳、隔熱與熱舒適","q":"大樓建築最頂樓之夏季室溫常較中間樓層高，主要的原因與合理改善方式各為何？","opts":{"A":"開窗遮陽不易，要減少開窗","B":"屋頂樓版傳導熱多，要增加隔熱層","C":"室內空間發熱量高，要增加換氣量","D":"牆面輻射熱高，要多做綠化"},"ans":"B","note":"答案 B。屋頂水平面全天接受最強烈的日射，夏季屋頂外表面溫度可達 60～70℃，經屋頂樓版傳導進入頂樓室內，是頂樓比中間樓層熱的主因；中間樓層上下有其他樓層隔開，沒有這項熱負荷。改善方法是在屋頂加設隔熱層（降低屋頂 U 值），或採用通風屋頂、屋頂綠化、淺色高反射面等。A：頂樓與中間樓層開窗條件相同，不是主因。C：室內發熱量與樓層無關。D：牆面日射各樓層相近，不是頂樓特有。 【依據】建築物節約能源設計技術規範 6.1（現行版：屋頂平均熱傳透率 Uar＜0.8 W/(㎡.K)；2011 年舊版學校類規範 7.1 為 Uar＜1.0 W/(㎡.K)，考試年度數值以當年版本為準）；課程教材：23 S ET 05 熱舒適節能設計 p.2（過熱期降低外殼傳透得熱：隔熱加高反射）"},{"c":44,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"相對濕度與絕對濕度","year":105,"no":5,"art":"1-3 熱傳、隔熱與熱舒適","q":"某空氣狀態的溫濕度為 24℃、50%，若飽和絕對濕度為 19 g/kg'，該空氣塊的絕對濕度為多少 g/kg'？","opts":{"A":"10.4","B":"9.5","C":"12","D":"4.56"},"ans":"B","note":"答案 B。在一般室溫範圍，相對濕度約等於飽和度（實際絕對濕度／同溫度飽和絕對濕度），故絕對濕度 x≈ 相對濕度 × 飽和絕對濕度 = 0.5 × 19 = 9.5 g/kg'。驗算：9.5／19 = 0.5，即 50%，一致。（嚴格說相對濕度以水蒸氣分壓比定義，與飽和度略有差異，但常溫下差異很小，題目以此近似。）A、C、D 皆不符 0.5×19。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.17（空氣線圖：乾球溫度、相對濕度、重量絕對濕度之關係）"},{"c":45,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"熱環境指標與濕度","year":105,"no":6,"art":"1-3 熱傳、隔熱與熱舒適","q":"下列熱環境指標，何者不考慮相對濕度的影響？","opts":{"A":"SET*","B":"ET*","C":"PMV","D":"OT"},"ans":"D","note":"答案 D。OT（作用溫度）是由氣溫、氣流、輻射綜合之冷熱感指標，課程教材列出在微氣流（0.1～0.5m/s）下 OT ＝（MRT＋ta）／2，只含氣溫與平均輻射溫度，不含濕度。C PMV 依教材考慮溫度、濕度、氣流、平均輻射溫度、衣著量、活動量六因素。B ET*（新有效溫度）：教材說明有效溫度 ET 由乾球溫度、相對濕度、氣流綜合而成，ET* 是以人體熱吸收（熱平衡）理論重新提出的新有效溫度，同樣考慮濕度。A SET*（標準新有效溫度）再以標準衣著、代謝量將 ET* 標準化，亦考慮濕度。（SET* 教材未列，依 ASHRAE 熱舒適通論。） 【依據】課程教材：05 空調設備基礎知識 p.25（OT）、p.26（ET、CET、ET*）、p.27（PMV）"},{"c":46,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"材料熱傳導係數","year":105,"no":28,"art":"1-3 熱傳、隔熱與熱舒適","q":"下列何種建築材料的熱傳導係數最低？","opts":{"A":"鋼板","B":"玻璃","C":"普通混凝土","D":"木材"},"ans":"D","note":"答案 D。課程教材所列 k 值（W/m·℃）：金屬 20～400、普通混凝土約 1.4、木材及木製品 0.05（軟木）～0.4；玻璃一般約 0.8～1.0（教材未列，依一般材料表）。木材為多孔纖維、密度低且含空氣，導熱最差（隔熱較佳）；鋼板導熱最好。一般規律：密度愈大、含水率愈高，熱傳導係數愈大。建築物節約能源設計技術規範 3.1.14定義熱傳導係數為單位時間、單位溫差下垂直通過單位面積均一材質之傳導熱量。 【依據】課程教材：23 S 04 熱傳與材料性能 p.14；建築物節約能源設計技術規範 3.1.14"},{"c":47,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"材料熱傳導率","year":106,"no":1,"art":"1-3 熱傳、隔熱與熱舒適","q":"相同厚度之下，下列那一種材料之熱傳導率最低？","opts":{"A":"鋼筋混凝土","B":"木心合板","C":"紅磚","D":"玻璃棉"},"ans":"D","note":"答案 D。熱傳導率（k，W/m·K）主要取決於材料密度與內部含空氣程度：多孔、低密度、內含大量靜止空氣之材料 k 值最低。玻璃棉為纖維狀多孔隔熱材，k 約 0.03～0.05，為四者最低。課程教材所列 k 值（W/m·℃）：\n纖維隔熱材（礦棉、玻璃纖維）與發泡材 0.005～0.07；木材與木製品 0.05～0.4；磚 0.8～1.3；普通混凝土約 1.4。\n故玻璃棉＜木心合板＜紅磚＜鋼筋混凝土。（「相同厚度之下」其實與 k 值無關，k 為單位厚度之材料性質；厚度影響的是熱傳遞率 C＝k／厚度，教材 p.13。） 【依據】課程教材：23 S 04 熱傳與材料性能 230317 p.13～14；建築物節約能源設計技術規範附錄一"},{"c":48,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"熱舒適性指標","year":106,"no":6,"art":"1-3 熱傳、隔熱與熱舒適","q":"下列關於熱舒適性指標之敘述何者錯誤？","opts":{"A":"WBGT 主要用於評估戶外的熱舒適性","B":"ET 無法評估風速對熱舒適性的影響","C":"PMV 可用於評估室內環境的熱舒適性","D":"MRT 無法評估濕度對熱舒適性的影響"},"ans":"B","note":"答案 B（錯誤）。課程教材：有效溫度 ET 是在乾球溫度、相對濕度、氣流綜合之冷熱條件下，以「濕度 100％、無風」狀態下感覺相同之乾球溫度表示（p.26），已含風速影響，故 B 錯；ET 未考慮的是熱輻射（故有修正有效溫度 CET）。C：PMV 考慮溫度、濕度、氣流、平均輻射溫度、衣著量、活動量六因素，ISO 建議 －0.5＜PMV＜0.5（p.27），用於室內 ✓。D：MRT 為周壁表面溫度之面積加權平均（p.25），只反映輻射，不含濕度 ✓。A：\nWBGT 綜合濕球、黑球、乾球溫度，主要用於戶外與高溫作業熱危害評估 ✓。 【依據】課程教材：05 空調設備基礎知識 p.25～27"},{"c":49,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"相對濕度與溫度","year":107,"no":1,"art":"1-3 熱傳、隔熱與熱舒適","q":"當室內乾球溫度增加而空氣中水蒸氣量維持不變時，相對濕度的變化為何？","opts":{"A":"降低","B":"增加","C":"不變","D":"達到 100%"},"ans":"A","note":"答（A）。相對濕度 RH＝空氣中水蒸氣分壓／同溫度之飽和水蒸氣分壓。水蒸氣量（絕對濕度）不變時分子不變，但乾球溫度升高使飽和水蒸氣壓增大（分母變大），故相對濕度降低。在濕空氣線圖上為沿等絕對濕度線水平向右移動，離飽和線愈遠。（B）增加為溫度下降時的情形；（C）不變須溫度與水蒸氣量同時維持；（D）達到100%為降溫至露點溫度時才發生，與升溫相反。 【依據】課程教材：23 S ET 02 氣候與外部環境 p.10（水蒸氣飽和量隨溫度升高而昇高）；23 S ET 03 熱舒適性與室內環境 p.17（空氣線圖）"},{"c":50,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"材料隔熱性能","year":107,"no":2,"art":"1-3 熱傳、隔熱與熱舒適","q":"下列相同厚度材料的隔熱性能，由隔熱佳至隔熱差之順序為何？①保麗龍 ②乾燥木板 ③混凝土","opts":{"A":"①②③","B":"①③②","C":"②①③","D":"②③①"},"ans":"A","note":"答（A）。相同厚度時，熱傳導係數 λ 愈小，熱阻 R＝d／λ 愈大，隔熱愈好。保麗龍（發泡聚苯乙烯）內含大量靜止空氣，λ 最小；乾燥木材為多孔纖維材料，λ 次之；混凝土緻密，λ 最大。課程教材列常見建材 k 值：纖維隔熱材及發泡材 0.005～0.07、木材及木製品 0.05（軟木）～0.4、普通混凝土約 1.4 W/m·°C。故隔熱由佳至差為保麗龍＞乾燥木板＞混凝土，即①②③。 【依據】課程教材：23 S 04 熱傳與材料性能 p.14"},{"c":51,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"空氣層熱阻","year":108,"no":1,"art":"1-3 熱傳、隔熱與熱舒適","q":"有關牆壁間的空氣層之隔熱效果，下列敘述何者錯誤？","opts":{"A":"空氣層厚度不大時，約 20 mm 以下，以傳導方式傳熱，厚度增加時，熱阻隨之增加","B":"空氣層厚度大於 20 mm 時，隨著空氣層厚度增大，其對流傳熱作用逐漸增加，故增加空氣層厚度時熱阻增加並不明顯","C":"若將空氣層兩側材料表面塗成黑色，則其空氣層熱阻較一般狀況為高","D":"空氣層厚度在 2 cm 以上時，熱阻增加並不明顯，因此若利用薄板或鋁箔，將 10 cm 厚的空氣層分隔成兩層5 cm 空氣層，則其空氣層的隔熱效果可增加約 1 倍"},"ans":"C","note":"答案 C（錯誤）。空氣層內的傳熱由傳導、對流與「兩側表面間的輻射」組成，其中輻射占相當大比例。表面塗黑會提高放射率，使輻射傳熱增加，空氣層熱阻反而降低；要提高熱阻應使用低放射率表面（如鋁箔）。A：\n薄空氣層近乎靜止，以傳導為主，熱阻隨厚度增加；B：約 2 cm 以上對流漸強，熱阻幾乎不再隨厚度增加；D：因此把一層厚空氣層分隔成兩層，每層熱阻與原層相近，總熱阻約增為 2 倍，皆正確。（課程教材亦指出空氣層熱阻可因使用鋁箔而增加；教材簡化寫「熱阻隨深度增加、約以 30 cm 為上限」，與 B、D 所述「約 2 cm 以上增加不明顯」詳略不同，不影響本題結論。） 【依據】課程教材：23 S 04 熱傳與材料性能 230317 p.16"},{"c":52,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"多層牆總熱阻計算","year":108,"no":2,"art":"1-3 熱傳、隔熱與熱舒適","q":"某建築物之外牆構造厚度為 20 cm，其中鋼筋混凝土厚度為 15 cm，室外貼磁磚層厚度為 3 cm，室內水泥粉刷層厚度為 2 cm。若鋼筋混凝土導熱係數為 λ₁=1.74 W/(m•K)，磁磚導熱係數為 λ₂=1.30 W/(m•K)，水泥粉刷導熱係數為λ₃=0.87 W/(m•K)，室外表面熱阻 Ro=0.04(m²•K)/W，室內表面熱阻 Ri=0.11(m²•K)/W，則外牆之總熱阻為多少(m²•K)/W？","opts":{"A":"0.15","B":"0.28","C":"0.41","D":"0.57"},"ans":"B","note":"答案 B。總熱阻 R＝Ro＋Σ(d/λ)＋Ri。各層：磁磚 0.03/1.30≈0.023；RC 0.15/1.74≈0.086；粉刷0.02/0.87≈0.023；材料層合計≈0.132。R＝0.04＋0.132＋0.11≈0.282≈0.28 (m²•K)/W。驗算一：1.74×0.086≈0.150、1.30×0.023≈0.030、0.87×0.023≈0.020，各層厚度吻合；驗算二：0.04＋0.11＝0.15，0.15＋0.132＝0.282。A 0.15 僅為內外表面熱阻之和（漏算材料層），C、D 無對應算式。 【依據】建築物節約能源設計技術規範附錄一（110 年版）式(1-1)（ho＝23、hi＝9（牆），即 Ro≈0.04、Ri≈0.11）；課程教材：23 S 04 熱傳與材料性能 p.15（R＝厚度/k、R＝1/U）"},{"c":53,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"空氣線圖狀態變化","year":108,"no":3,"art":"1-3 熱傳、隔熱與熱舒適","q":"某密閉空氣的狀態為溫度 25℃，相對濕度 50%，下列敘述何者正確？","opts":{"A":"將此空氣加熱到 30℃時，相對濕度會升高","B":"將此空氣加熱到 30℃時，絕對濕度會升高","C":"將此空氣冷卻到 20℃時，濕球溫度不會改變","D":"將此空氣冷卻到 20℃時，熱焓會降低"},"ans":"D","note":"答案 D。密閉空氣只加熱或冷卻（顯熱變化）時，含水量（絕對濕度）不變。25℃、50%RH 之露點約14℃，冷卻到 20℃仍高於露點，不會結露，屬顯熱冷卻，空氣失去熱量，熱焓降低，D 正確。A：加熱後飽和水蒸氣壓變大，相對濕度下降；B：絕對濕度不變；C：顯熱冷卻時濕球溫度隨之下降（在空氣線圖上沿水平線向左移，濕球溫度線也跟著降低）。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.17（空氣線圖）；05 空調設備基礎知識 p.38"},{"c":54,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"反潮（表面結露）","year":108,"no":5,"art":"1-3 熱傳、隔熱與熱舒適","q":"對於住宅壁面於冬春之際常出現之「反潮」現象，下列敘述何者錯誤？","opts":{"A":"反潮是一種結露現象","B":"這是由於壁面溫度低於空氣露點溫度所產生的現象","C":"若知道室內空氣之露點溫度及壁面溫度，即可判斷是否產生結露","D":"若知道戶外空氣之空氣溫度及濕度，即可判斷是否產生結露"},"ans":"D","note":"答案 D（錯誤）。反潮為表面結露：冬末春初暖濕空氣流入，接觸仍偏冷的牆面、地坪，表面溫度低於接觸空氣的露點溫度時即凝結（A、B 正確）。判斷結露需「接觸表面的空氣露點」與「表面溫度」兩項比較（C 正確）；僅知戶外空氣溫濕度，無法得知室內壁面溫度及室內空氣狀態，無法判斷是否結露，故 D 錯誤。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.23（兩種結露狀況）"},{"c":55,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"有效溫度 ET","year":108,"no":9,"art":"1-3 熱傳、隔熱與熱舒適","q":"有效溫度由三要素所組成之綜合效果，但不包括下列何者？","opts":{"A":"氣流","B":"乾球溫度","C":"相對濕度","D":"輻射溫度"},"ans":"D","note":"答案 D。有效溫度（ET，Houghten 與 Yaglou 提出）以「乾球溫度、濕度（相對濕度）、氣流速度」三要素綜合表示體感，定義為相同體感之靜止飽和空氣溫度，未考慮輻射。考慮輻射影響者為修正有效溫度（CET），以黑球溫度取代乾球溫度；新有效溫度（ET*）、PMV 等指標則同時納入輻射、代謝量與衣著量。課程教材定義同此：ET 為乾球溫度、相對濕度、氣流綜合，CET 補上熱輻射修正。 【依據】課程教材：05 空調設備基礎知識p.26"},{"c":56,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"黑球溫度與平均輻射溫度","year":109,"no":1,"art":"1-3 熱傳、隔熱與熱舒適","q":"於某無日射空間中所測定的黑球溫度，下列敘述何者錯誤？","opts":{"A":"周壁輻射溫度高於空氣溫度且有風時，黑球溫度會比空氣溫度來得低","B":"周壁輻射溫度低於空氣溫度且無風時，黑球溫度會比空氣溫度來得低","C":"周壁輻射溫度高於空氣溫度且無風時，平均輻射溫度會比空氣溫度來得高","D":"依據黑球溫度、空氣溫度與風速，可求取平均輻射溫度"},"ans":"A","note":"答案 A。黑球溫度 Tg 是黑球與周壁輻射、周圍空氣對流熱交換達平衡的溫度，其值介於空氣溫度 Ta 與平均輻射溫度 MRT 之間。(A) 周壁輻射溫度高於空氣溫度時，Tg 必高於 Ta；有風只會加強對流、使 Tg 往 Ta 靠近（差值縮小），並不會使 Tg 低於 Ta，故敘述錯誤。(B) 周壁較冷時 Tg 低於 Ta，正確。(C) 無風時 Tg 與 MRT 都高於Ta，正確。(D) 已知 Tg、Ta、風速 v，可由常見簡式 MRT＝Tg＋2.37√v·(Tg－Ta)（150 mm 黑球）求 MRT，正確。\n【依據】通用建築環境控制教材（熱舒適）"},{"c":57,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"玻璃遮陽性能 η 值與隔熱性能 U 值","year":109,"no":2,"art":"1-3 熱傳、隔熱與熱舒適","q":"有關玻璃之遮陽性能（η 值）與隔熱性能（U 值），下列敘述何者錯誤？","opts":{"A":"Low-E 玻璃屬於遮陽性能較佳的玻璃","B":"反射玻璃的遮陽性能與其塗膜有關","C":"雙層玻璃是屬於隔熱性能較佳的玻璃","D":"透明清玻璃兼具 η 值小與 U 值小的特性"},"ans":"D","note":"答案 D。η 值（日射熱取得率）愈小，遮陽（遮蔽日射）性能愈佳；U 值（熱傳透率）愈小，隔熱性能愈佳。(D) 透明清玻璃對日射幾乎全透過，η 值大（約 0.8 以上），單層清玻璃之 U 值也大（約 6 W/m²·K 左右），兩者都是「大」，故錯誤。(A) Low-E（低輻射）鍍膜可反射遠紅外線並降低日射穿透，遮陽與隔熱性能皆較清玻璃佳，正確。(B) 反射玻璃以金屬鍍膜反射日射，遮陽性能取決於塗膜，正確。(C) 雙層（中空）玻璃以空氣層降低熱傳導，U 值小，正確。（課程教材佐證：單層玻璃 U 值接近 6、複層玻璃 U＜3；透明單／雙層玻璃日射取得率SHGC 約 0.6～0.9，採有色、反射或鍍膜等可降約 50%。） 【依據】通用建築環境控制教材（玻璃熱性能）；建築物節約能源設計技術規範（η、U 之定義）；課程教材：23 S 04 熱傳與材料性能 230317.pdf p.17、p.22"},{"c":58,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"熱容量與時滯","year":109,"no":3,"art":"1-3 熱傳、隔熱與熱舒適","q":"有關熱容量之敘述，下列何者錯誤？","opts":{"A":"熱容量大的物體溫度上升時需要吸收大量的熱量","B":"建築物牆面或屋頂採用鍍鋅鐵板時，熱容量較小","C":"混凝土造的建築熱容量大，故室內氣溫變動幅度較小，時滯現象的時間亦較短","D":"鍍鋅鐵板薄壁構造，熱容量小，故容易受外氣溫和日射的影響，室內氣溫升降較快"},"ans":"C","note":"答案 C。熱容量＝比熱×質量（體積×密度），代表物體溫度升高 1 K 所需之熱量。熱容量大者蓄熱多、升降溫慢，因此室內溫度變動幅度小，但熱量穿透構造所需的「時滯」（time lag，外表面溫度高峰與內表面高峰之時間差）反而「較長」，故 (C)「時滯時間較短」錯誤。(A) 定義正確。(B)(D) 鍍鋅鐵板薄且質輕，熱容量小，室溫易隨外氣溫與日射快速升降，正確。（課程教材佐證：全日高低溫變動之幅度與時滯受建築物熱容量影響。） 【依據】通用建築環境控制教材（熱容量、時滯）；課程教材：23 S 04 熱傳與材料性能 230317.pdf p.10"},{"c":59,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"隔熱材料與隔熱性能","year":109,"no":4,"art":"1-3 熱傳、隔熱與熱舒適","q":"有關建築物隔熱之敘述，下列何者錯誤？","opts":{"A":"一般隔熱材密度愈低隔熱性愈佳","B":"理想的隔熱材最好具有吸濕性","C":"淡色系之建築外表材料，可以防止吸收大量之日射熱","D":"增加玻璃厚度對隔熱效果影響不大"},"ans":"B","note":"答案 B。隔熱材靠內部封閉微孔隙中的靜止空氣（導熱係數約 0.026 W/m·K）阻熱，若吸濕，孔隙被水（導熱係數約 0.6 W/m·K）取代，導熱係數大增、隔熱性能下降，並可能造成結露、腐蝕或發霉，因此理想的隔熱材應為低吸濕（疏水、防潮），(B) 錯誤。(A) 一般多孔性隔熱材密度低、含氣量多，隔熱性較佳，正確（極低密度時對流／輻射傳熱增加，屬教材所指「一般」情形）。(C) 淡色表面日射吸收率低，正確。(D) 玻璃本身熱阻很小，增厚只增加極少熱阻，隔熱主要靠中空層或鍍膜，正確。 【依據】通用建築環境控制教材（隔熱材料）"},{"c":60,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"完全黑體","year":110,"no":1,"art":"1-3 熱傳、隔熱與熱舒適","q":"有關熱輻射理論中，輻射波入射於物體時，R+A+D = 1，下列何種狀況稱之為「完全黑體」？（R = 全反射率；A =全吸收率；D = 全透射率）","opts":{"A":"D+A = 0.5、R = 0.5","B":"R+A = 0.5、D = 0.5","C":"D = A = 0、R = 1","D":"R = D= 0、A = 1"},"ans":"D","note":"答案 D。入射輻射被物體反射（R）、吸收（A）、透射（D）三者之和為 1。完全黑體（blackbody）是將所有入射輻射全部吸收之理想物體，即 A = 1、R = D = 0；且依克希荷夫定律（Kirchhoff）其放射率亦為 1，為同溫度下輻射能力最大者。C 的 R = 1 為完全反射體（理想鏡面／白體）；A、B 為部分反射或部分透射，均非黑體。"},{"c":61,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"濕度與含濕材料之敘述","year":110,"no":3,"art":"1-3 熱傳、隔熱與熱舒適","q":"建築物有關濕度之敘述，下列何者錯誤？","opts":{"A":"材料受潮後，熱傳導將降低","B":"表面結露為高溫濕空氣遇到冷表面所致","C":"重量絕對濕度為乾燥空氣之重量對含有水分空氣重量之比","D":"容積絕對濕度為濕空氣之空氣單位體積中所含水蒸氣重量"},"ans":"A 或 C 均給分（更正前公告答案 A）","note":"A、C 兩項敘述均錯誤，故均給分。A 錯：材料受潮後孔隙中空氣被水取代，水之導熱係數（約 0.6W/m·K）遠大於空氣（約 0.026），故材料熱傳導（導熱係數）升高、隔熱性變差，並非降低。C 亦錯：重量絕對濕度（比濕）x 定義為「空氣中水蒸氣重量對乾燥空氣重量之比」（kg/kg′），題目敘述的分子分母與定義不同。B為結露原理（暖濕空氣接觸表面溫度低於露點之冷表面）；D 為容積絕對濕度（g/m³）定義，皆正確。更正理由考選部未公布，推測為命題出現 A、C 兩個錯誤選項，故兩者均給分。 【依據】通用建築物理教材（本題為基本概念，無法規條文）"},{"c":62,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"減少外牆窗戶熱傳入室內之方法","year":110,"no":4,"art":"1-3 熱傳、隔熱與熱舒適","q":"建築物外牆及窗戶減少室外熱傳到室內之方法中，下列何者錯誤？","opts":{"A":"設計深遮陽，可減少直射熱","B":"窗戶使用低輻射玻璃可減少室外熱傳入室內","C":"外牆綠化美觀，可減少室外熱傳入室內","D":"減少外牆厚度，可減少熱傳入室內"},"ans":"D","note":"答案 D（錯誤敘述）。牆體熱阻 R = d ／ λ（厚度 ÷ 導熱係數），厚度減少則熱阻降低、熱傳透率 U 增大，傳入室內之熱量反而增加；要減少熱傳入應「增加」隔熱層或牆厚。A 深遮陽阻擋直射日射；B 低輻射（Low-E）玻璃降低輻射熱傳；C 外牆綠化藉植栽遮蔭與蒸散作用降低牆面溫度，皆可減少傳入室內之熱，均正確。課程教材亦指出材料愈厚，熱傳遞率 C 愈小（隔熱性能愈好），R = 厚度 ÷ k。 【依據】課程教材：23 S 04 熱傳與材料性能 p.13、p.15（熱傳遞率隨厚度增加而減小、R = 厚度/k）"},{"c":63,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"表面結露之難易","year":110,"no":16,"art":"1-3 熱傳、隔熱與熱舒適","q":"下列那一材料表面較不易發生結露？","opts":{"A":"產生熱橋現象之部位","B":"無保溫之冷暖氣配管","C":"具隔熱層的建築物角隅","D":"外牆窗戶的玻璃面"},"ans":"C","note":"答案 C。結露發生條件為表面溫度低於接觸空氣之露點溫度。具隔熱層的角隅，因有保溫而使內表面溫度接近室溫（高於露點），不易結露。A 熱橋（混凝土樑柱、金屬件）熱阻小，內表面溫度低，易結露；B 無保溫冷水（冷氣）配管表面溫度遠低於露點，必然結露；D 玻璃面熱阻小（U 值大），冬季或空調時表面溫度低，易結露。\n【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.23（結露狀況）；23 S 04 熱傳與材料性能 p.17（單層玻璃 U值接近 6）"},{"c":64,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"建築外殼隔熱","year":111,"no":2,"art":"1-3 熱傳、隔熱與熱舒適","q":"有關建築外殼隔熱之敘述，下列何者錯誤？","opts":{"A":"材料的厚度若增加，則隔熱性能也會提升","B":"為提升隔熱性能，增加建築外殼的混凝土厚度是具有經濟效益的手法","C":"混凝土的熱容量較木材的熱容量大","D":"外殼開口部的遮陽百葉，設置在室外側比室內側更佳"},"ans":"B","note":"答案 B（錯誤）。混凝土導熱係數大（隔熱性差），靠增厚混凝土提升隔熱，效果有限且造成結構載重與造價大增，並不經濟；有效作法是加設隔熱材（如 EPS、擠塑板、岩棉）或採用隔熱構造。A：熱阻 R = d/λ，厚度 d增加則熱阻增加 ✓。C：混凝土之密度與比熱乘積（體積熱容量）大於木材 ✓。D：外遮陽在日射進入玻璃前即阻擋，優於內側百葉（日射已進入室內，熱被吸收後再釋放）✓。 【依據】課程教材：23 S 04 熱傳與材料性能 p.13～15（k、C、R＝厚度/k）、p.14（混凝土 k 約 1.4）"},{"c":65,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"黑球溫度與平均輻射溫度","year":111,"no":3,"art":"1-3 熱傳、隔熱與熱舒適","q":"黑球溫度計量測周壁之平均輻射溫度 MRT 與下列何者無關？","opts":{"A":"濕度","B":"黑球溫度","C":"空氣流速","D":"氣溫"},"ans":"A","note":"答案 A。黑球溫度計量到的是黑球溫度 Tg（受輻射與對流共同影響），要換算平均輻射溫度需扣除對流影響，故需氣溫 Ta 與黑球周圍空氣流速 v：MRT = Tg + k·√v·(Tg − Ta)（k 為與球徑有關之係數）。換算式中沒有濕度項，故與濕度無關。B、C、D 皆為換算所需參數。 【依據】課程教材：05 空調設備基礎知識 p.25（MRT）；\n23 S ET 03 熱舒適性與室內環境 p.25；黑球換算式見 109-1（一般原理）"},{"c":66,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"作用溫度","year":111,"no":4,"art":"1-3 熱傳、隔熱與熱舒適","q":"某個室內無風的空間，溫度為 20℃，平均輻射溫度為 26℃，該空間的作用溫度（operative temperature）最接近多少℃？","opts":{"A":"20","B":"26","C":"23","D":"46"},"ans":"C","note":"答案 C。作用溫度 to = (hr·MRT + hc·Ta)/(hr + hc)，其中 hr 為輻射熱傳係數、hc 為對流熱傳係數。無風（空氣靜止）時 hr ≈ hc，故 to ≈ (Ta + MRT)/2 = (20 + 26)/2 = 23℃。驗算：20 + 0.5×(26 − 20) = 23 ✓；也可由 26 − 0.5×6= 23 ✓。D 46 為二者相加，錯誤。課程教材亦載：微氣流（V = 0.1～0.5 m/s）時 OT = (MRT + ta)/2。 【依據】課程教材：05 空調設備基礎知識 p.25"},{"c":67,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"熱傳透量計算","year":111,"no":5,"art":"1-3 熱傳、隔熱與熱舒適","q":"若屋頂版的面積為 100 m²，整體構造材料的熱傳透率 U 值為 0.6 kcal/m²h℃，總厚度 20 cm，則在室內溫度為26℃，室外氣溫為 32℃時，其熱傳透量為多少 kcal/h？","opts":{"A":"72","B":"180","C":"360","D":"7200"},"ans":"C","note":"答案 C。熱傳透量 Q = U × A × ΔT = 0.6 × 100 × (32 − 26) = 0.6 × 100 × 6 = 360 kcal/h。驗算：0.6 × 6 = 3.6，3.6 × 100 = 360 ✓；另 6 × 60 = 360 ✓。總厚度 20 cm 為干擾資料：U 值已含整體構造之熱阻，不必再代入厚度（課程教材：Q = U·A·ΔT）。 【依據】課程教材：23 S 04 熱傳與材料性能 p.19"},{"c":68,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"有效溫度 ET 與新標準有效溫度 SET*","year":112,"no":1,"art":"1-3 熱傳、隔熱與熱舒適","q":"相較於有效溫度（ET），新標準有效溫度（SET*）新增了那些溫熱要素？","opts":{"A":"周壁輻射、著衣量、人體代謝量","B":"濕球溫度、周壁輻射、氣流風速","C":"氣流風速、著衣量、人體代謝量","D":"乾球溫度、濕球溫度、黑球溫度"},"ans":"A","note":"答案 A。有效溫度 ET 只綜合乾球溫度、濕度（濕球溫度）與氣流風速三要素，未考慮熱輻射與人體因素；\n新標準有效溫度 SET* 以人體熱收支為基礎，再納入周壁輻射（平均輻射溫度）、著衣量、人體代謝量，成為六要素之綜合指標，故新增者為 A。B、C 之濕球溫度、氣流風速 ET 已含；D 之乾球、濕球、黑球溫度是計算 WBGT所用之三種溫度，與 SET* 無關。課程教材 05 空調設備基礎知識 p.26：ET 以乾球溫度、相對濕度、氣流綜合，未考慮輻射（故另有加入輻射修正之 CET），依人體熱收支理論提出者稱新有效溫度 ET*；p.19 列熱環境六要素為著衣量、活動量及空氣溫度、輻射溫度、氣流、濕度。 【依據】課程教材：05 空調設備基礎知識 p.26、p.19"},{"c":69,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"結露","year":112,"no":14,"art":"1-3 熱傳、隔熱與熱舒適","q":"有關結露的敘述，下列何者錯誤？","opts":{"A":"壁體表面溫度低於鄰近空氣露點溫度時，就容易產生結露","B":"空氣的絕對濕度愈高時，露點溫度就愈低","C":"「反潮」的物理原理即為結露現象","D":"壁體的結露現象可能造成室內生物性污染"},"ans":"B","note":"答案 B（錯誤）。露點溫度是空氣冷卻至水蒸氣開始凝結之溫度，絕對濕度（空氣中水蒸氣含量）愈高，水蒸氣分壓愈大，露點溫度愈高（愈容易結露），並非愈低。A 為結露條件（表面溫度低於露點）；C 台灣春季回南天之「反潮」即暖濕空氣遇低溫牆面、地面之結露；D 結露使表面潮濕，易滋生黴菌、塵蟎等生物性污染，均正確。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.23（結露）；熱濕環境教材（露點與結露）"},{"c":70,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"相對濕度","year":112,"no":15,"art":"1-3 熱傳、隔熱與熱舒適","q":"下列關於相對濕度的敘述何者錯誤？","opts":{"A":"空氣溫度上升時，相對濕度降低","B":"空氣溫度上升時，飽和水蒸氣壓不會改變","C":"相對濕度即空氣中實際水蒸氣壓與飽和水蒸氣壓的比值","D":"阿斯曼（Assmann）通風溫濕度計只能量到乾球溫度與濕球溫度，無法直接量測相對濕度"},"ans":"B","note":"答案 B（錯誤）。飽和水蒸氣壓隨溫度上升而顯著增加（溫度每升約 10℃，約增為 1.7 至 2 倍）。A 在水蒸氣量不變時，溫度上升使飽和水蒸氣壓增加，相對濕度因此降低；C 為相對濕度之定義 ＝ 實際水蒸氣壓／同溫度之飽和水蒸氣壓 ×100%；D 阿斯曼通風乾濕計量測乾球與濕球溫度，再查空氣線圖或濕度表換算相對濕度，屬間接量測，均正確。課程教材 23 S ET 02 氣候與外部環境 p.10：相對濕度係相對於飽和量之百分比，水蒸氣飽和量隨溫度升高而昇高；05 空調設備基礎知識 p.38：已知乾球、濕球等任兩狀態值即可由濕空氣線圖求其他值。 【依據】課程教材：23 S ET 02 氣候與外部環境 p.10；05 空調設備基礎知識 p.38"},{"c":71,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"預測平均投票數 PMV","year":112,"no":17,"art":"1-3 熱傳、隔熱與熱舒適","q":"關於 Predicted Mean Vote（PMV）的敘述，何者錯誤？","opts":{"A":"PMV 的數值範圍由 -3 到 +3，-3 為冷、+3 為熱","B":"PMV 公式適用於戶外籃球運動之熱舒適評估","C":"風速大於 0.2 m/s 時，根據 PMV 值在 -0.5 到 +0.5 的範圍設定熱舒適區間","D":"影響 PMV 的參數包含室溫、溼度、平均輻射溫度、風速、衣物、活動強度"},"ans":"B","note":"答案 B（錯誤）。PMV（Fanger）以人體熱平衡為基礎，適用於穩態室內環境與輕度活動，參數為空氣溫度、濕度、平均輻射溫度、風速、著衣量、活動量（D 正確）；戶外日射、風速變動大，籃球運動代謝量又遠超適用範圍，不能用 PMV，宜改用 WBGT、PET、UTCI 等戶外指標。A 為七點標度（-3 冷～+3 熱）；C 舒適區間PMV -0.5～+0.5（PPD ≦10%）。課程教材 23 S ET 03 熱舒適性與室內環境 p.11：PMV 只適用於長時間處於穩定環境與代謝率之狀況，舒適範圍 -0.5～+0.5；05 空調設備基礎知識 p.27 同。【查證限制】C 之「風速大於 0.2 m/s」條件教材未載（ASHRAE 55 對較高風速另以 SET 修正舒適區）。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.11；05 空調設備基礎知識 p.27"},{"c":72,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"石英燈管電暖器之熱效應","year":112,"no":18,"art":"1-3 熱傳、隔熱與熱舒適","q":"關於 600 W 攜帶式石英燈管電暖器的熱效應現象，下列敘述何者正確？","opts":{"A":"與人體主要的熱交換是透過熱對流","B":"加熱人體的效果，在乾燥空氣中效果比在潮濕空氣中的效果好","C":"風吹過石英管，可提高輻射熱的輸出","D":"室溫 20℃無風環境下，石英管表面溫度由 30℃升高到 40℃，所發出的熱能增為兩倍"},"ans":"B","note":"答案 B。石英管電暖器屬輻射型加熱，以紅外線直接加熱人體；空氣中水蒸氣會吸收部分紅外線，故乾燥空氣中抵達人體的輻射較多、效果較好。A 錯：主要熱交換為輻射而非對流。C 錯：風吹過石英管只增加對流散熱、使管面降溫，輻射輸出反而降低。D 錯：表面「發出」之輻射 E ＝ εσT⁴，303 K 升至 313 K 為（313/303）⁴ ≈ 1.14倍，非兩倍。【查證限制／爭議】若改以對 20℃ 室內之淨換熱計算，淨輻射（313⁴－293⁴）／（303⁴－293⁴）≈ 2.1倍，自然對流（約與溫差 1.25 次方成正比）約 2.4 倍，淨放熱反而略多於兩倍，D 近乎正確；官方答 B，表示命題採「放射量與 T⁴ 成正比」之解讀。B 之水蒸氣吸收在短距離內影響甚小，本機無原文；題中 30～40℃ 之管溫亦不合實際。 【依據】熱傳學原理（史蒂芬‧波茲曼定律、淨輻射換熱，本機無原文；數值為整理者自行計算）"},{"c":73,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"冬季壁體結露防止","year":113,"no":19,"art":"1-3 熱傳、隔熱與熱舒適","q":"下列那個措施可以減少冬季室內壁體產生結露的風險？","opts":{"A":"增加壁體內的熱橋","B":"直接加熱壁體表面","C":"減少壁體的熱阻","D":"於壁體內設置透濕層"},"ans":"B","note":"答案 B。結露發生於壁體表面溫度低於空氣露點溫度時；直接加熱壁體表面可提高表面溫度，使其高於露點而減少結露。A：熱橋處熱流大、表面溫度低，更易結露。C：減少熱阻使內表面溫度更接近室外溫度，更易結露（應增加熱阻、加強隔熱）。D：透濕層讓水蒸氣自由通過，反而讓水氣進入壁體內冷處而產生內部結露；冬季應在壁體暖側（室內側）設防濕層（隔氣層）。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.23（結露）；防濕層設於高水蒸氣壓側見 104-2（一般原理）"},{"c":74,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"接觸冷熱感","year":113,"no":21,"art":"1-3 熱傳、隔熱與熱舒適","q":"室溫 26℃無風房間內，有數塊相同尺寸（30 cm 長×30 cm 高×5 cm 厚）但不同材質的板材，板材表面溫度均為26℃，以手掌碰觸其表面，下列敘述何者正確？","opts":{"A":"材質比重越高，其表面的手感越熱","B":"材質比熱越高，其表面的手感越冷","C":"材質熱輻射係數越高，其表面的手感越熱","D":"材質熱傳導係數越高，其表面溫度的手感越冷"},"ans":"D","note":"答案 D。手的皮膚溫度（約 33℃）高於 26℃，接觸時熱量由手流向板材；板材熱傳導率越高（熱滲透率 b =√(kρc) 越大），越快把手的熱量帶走，使接觸面溫度下降越多，手感越冷（如金屬冷、木材暖）。A 錯：密度越高b 值越大，手感應越冷，方向相反。B：比熱單獨提高時理論上也使 b 增大而手感較冷，但各種建材的比熱差異不大，熱傳導係數則可相差百倍以上（木材、保麗龍與金屬、石材），實際主導接觸冷熱感的是熱傳導係數，故以 D為最正確之敘述。C 錯：接觸時熱量以傳導為主，輻射換熱很小；且板材輻射係數越高，反而吸收手部輻射越多，不會「越熱」。【爭議】B 之方向並非全錯，官方取 D 為答案，以官方為準。"},{"c":75,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"外牆開窗後之熱環境","year":113,"no":23,"art":"1-3 熱傳、隔熱與熱舒適","q":"位於嘉南平原空曠處獨棟住宅面南房間，有一面總面積 15 m²之半磚外牆（U = 3 [W/(m²・K)]，預計開一 8 mm 厚玻璃窗及一塑鋼門，窗戶面積（含 5 cm 寬塑鋼窗框）1 m²，門的面積（含 5 cm 寬塑鋼門框）2.5 m²，假設門窗框為同一材質，且門窗安裝後，達到完全氣密。在夏季連續晴天、夜間外氣溫低於室溫的狀況下，下列何者正確？\n（附圖：附表（材料性能）：8 mm 玻璃：熱傳透率 Ui = 6.0 W/(m²・K)，日光輻射熱取得率 SHGC = 0.5；塑鋼窗窗框：Ui = 1.5；塑鋼門：Ui = 1.5；半磚外牆：Ui = 3.0（框與牆無 SHGC 數值）。）","opts":{"A":"改裝後，有空調狀態下，日間空調耗能比改裝前低","B":"改裝後，無空調狀態下，白天達到穩態時，比改裝前的室內溫度高","C":"改裝後，無空調狀態下，夜間室內溫度降低較慢","D":"改裝後，有空調狀態下，夜間空調耗能比改裝前高"},"ans":"B","note":"答案 B。傳導：改裝前 UA = 15 × 3 = 45 W/K；改裝後（設窗為 1 m×1 m、框寬 5 cm，玻璃約 0.81 m²）：牆11.5×3 = 34.5，窗 0.81×6.0 + 0.19×1.5 ≈ 5.15，門 2.5×1.5 = 3.75，合計約 43.4 W/K，僅比改裝前小約 4%，傳導差異不大。差別在日射：玻璃 SHGC = 0.5，白天太陽輻射直接穿透玻璃進入室內；不透明磚牆僅有少量日射經牆體傳入（約為 U×吸收率×日射/外表面熱傳係數）。故改裝後白天無空調達穩態時，室溫較高（B 對）；有空調時日間冷房負荷因日射取得而增加（A 錯）。C、D 涉及夜間：夜間外氣低於室溫，熱量經外殼由內向外散失，散熱量 ≒UA×ΔT。改裝後 UA 僅略降約 4%，但改裝後白天室溫較高（ΔT 較大），且以輕質門窗取代部分磚牆、蓄熱量減少，兩者都使夜間降溫不會明顯較慢，C 無法成立；D 方面，UA 略降使夜間經外殼散熱略少（不利），但磚牆白天所蓄之熱減少（有利），兩者方向相反且量小，無法斷言夜間空調耗能「比改裝前高」。【查證限制／爭議】C、D 之排除屬整理者依熱傳原理之定性判斷（UA 差異很小，嚴格而言 C、D 並非可明確判定），本題以官方答案B 為準；B 的關鍵是玻璃 SHGC 帶來之日射熱取得。 【依據】課程教材：23 S 04 熱傳與材料性能 p.19（熱傳透量= U×A×ΔT）、p.22（日射取得率 SHGC）、p.10（建築熱容量影響日溫變動幅度與時滯）"},{"c":76,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"PMV-PPD 熱舒適","year":114,"no":1,"art":"1-3 熱傳、隔熱與熱舒適","q":"關於熱舒適指標 PMV-PPD 評價法，下列敘述何者錯誤？","opts":{"A":"熱舒適感知主要由皮膚溫度以及汗水產生率決定","B":"熱舒適是一種主觀的感知","C":"PMV 與身體承受的熱應力（thermal stress）成正比","D":"當衣著太厚重，PMV 公式不再準確"},"ans":"A","note":"答案 A（錯誤）。PMV 是氣溫、濕度、氣流、平均輻射溫度四項環境因素與活動量、衣著量兩項人體因素的綜合指標（課程教材列此六因素）。Fanger 模型把皮膚溫度與排汗率設為該活動量下的「舒適值」，再以人體熱負荷（產熱與散熱之差）推算溫冷感，故溫冷感並非「主要」由皮膚溫度與排汗率決定。B 正確：熱舒適是對熱環境感到滿意的主觀狀態。C 正確：PMV 與人體熱負荷（熱應力）成正比。D 正確：PMV 有衣著量適用範圍（約 0～2clo），衣著過厚即失準。【查證限制／爭議】Fanger 的舒適條件確實以皮膚溫度與排汗率表示，A 並非全無依據。\nISO 7730 原文本機沒有，以官方答案 A 為準。 【依據】課程教材：05 空調設備基礎知識 p.20、p.27；課程教材：\n23 S ET 03 熱舒適性與室內環境 p.7、p.10–11；Fanger 熱舒適理論、ISO 7730（本機無原文）"},{"c":77,"law":"氣候與熱環境","g":"氣候與熱環境","h1":"第 1 篇　氣候與熱環境","h2":"1-3 熱傳、隔熱與熱舒適","h3":"冬季表面結露防止","year":114,"no":5,"art":"1-3 熱傳、隔熱與熱舒適","q":"下列那個措施無法防止冬季時壁體表面結露的發生？","opts":{"A":"增加室內的水蒸氣量","B":"增加隔熱層以防止壁體表面溫度的下降","C":"室內使用除濕機","D":"促進通風換氣"},"ans":"A","note":"答案 A。表面結露發生於壁體室內側表面溫度低於室內空氣露點溫度時。防止方法為「降低室內露點（減少水蒸氣量）」或「提高壁體表面溫度」。A 增加室內水蒸氣量會使露點溫度升高，反而更易結露，無法防止。B 加強隔熱可提高室內側表面溫度，可防止。C 除濕機降低絕對濕度與露點，可防止。D 通風換氣排出室內水蒸氣（冬季外氣絕對濕度較低），可防止。 【依據】課程教材：23 S ET 03 熱舒適性與室內環境 p.23（結露兩種狀況：溫度陡降、水蒸氣含量增加）；結露原理（一般原理）"},{"c":78,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-1 自然採光","h3":"北向高側窗","year":107,"no":10,"art":"2-1 自然採光","q":"下列何者是美術教室或畫廊等使用北面高側窗之主要理由？","opts":{"A":"較佳的色溫度","B":"穩定且漫射之光源","C":"最高的照度","D":"讓室內空間與物件產生顯著的光影與反差"},"ans":"B","note":"答（B）。臺灣位於北半球，北向開口幾乎不受太陽直射，進入的是北天空的擴散光，全日照度變化小、光線柔和穩定、無強烈陰影，適合繪畫、觀賞畫作與辨色；課程教材亦指高側窗「開向北方時光線最為穩定（美術館或美術教室）」，並可避免眩光及過熱。（A）北天空光色溫偏高（偏藍白），並非「較佳色溫」為主要理由；\n（C）北向光照度反而低於南向與直射日光，不是最高照度；（D）顯著光影與強反差是直射日光的特性，正是美術教室要避免的。高側窗又可使光線深入室內並減少眩光。 【依據】課程教材：23 S ET 07 採光設計 p.22"},{"c":79,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-1 自然採光","h3":"光纖集光導光裝置","year":108,"no":10,"art":"2-1 自然採光","q":"配合太陽位置，利用最適角度控制的鏡片，將太陽直射光集光，可任意將導光路線曲折，將太陽光引進室內空間的裝置為何？","opts":{"A":"導光板","B":"導光管","C":"光纖集光裝置","D":"導光鏡"},"ans":"C","note":"答案 C。光纖集光裝置以追日系統（感測太陽位置、控制透鏡角度）將直射日光聚焦導入光纖，光纖可彎曲任意配線，把光引入地下室或建築深處。A 導光板（光棚）設於窗部，把光反射至天花深處；B 導光管為內壁高反射的直管或少數彎管，彎折過多損失大，不能「任意曲折」；D 導光鏡（反射鏡）以鏡面反射改變光線方向，路徑需直線反射，皆不符題意。 【依據】課程教材：23 S ET 07 採光設計 230421 p.10（導光板）、p.38（日光追蹤Himawari 系統：集光後以光纖傳送）"},{"c":80,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-1 自然採光","h3":"臺灣建築採光方位","year":108,"no":12,"art":"2-1 自然採光","q":"以臺灣所在的緯度而言，有關建築採光之敘述，下列何者錯誤？","opts":{"A":"日照不足的環境對生心理健康有害","B":"晴天時由外牆開口部進入室內的直接日照會造成室內水平照度對比過大，不適合做為學校教室使用","C":"晴天時，若比較建築物東、西、南、北四向開口全日的採光情形，則以北向的變化最少，最為穩定","D":"選擇東西向的採光較南北向為佳"},"ans":"D","note":"答案 D（錯誤）。臺灣位於北緯 22～25°，東西向開口在早晨與午後受低角度直射日光，水平遮陽難以遮擋，易造成眩光、照度劇烈變化與西曬過熱，採光品質較差；南向可用水平遮陽有效控制直射光，北向以穩定擴散光為主，故南北向採光優於東西向。A：日照可殺菌並調節生理節律，正確；B：直射光造成桌面照度對比過大、眩光，教室應避免，正確；C：北向無直射日光（或極少），全日變化最小，正確。 【依據】課程教材：23 S ET 07採光設計 230421 p.11～12（方位對應策略）、p.22（高側窗開向北方光線最穩定）、p.30（直射光熱得與眩光）；\n23 S ET 06 採光照明基礎 p.28（晴天含直射光與天空光）"},{"c":81,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-1 自然採光","h3":"晝光率之影響因素","year":109,"no":11,"art":"2-1 自然採光","q":"晝光率（daylight factor）的計算與下列那個因素無關？","opts":{"A":"窗面玻璃材質","B":"建築物總寬度","C":"測點到窗口的距離","D":"開窗面積"},"ans":"B","note":"答案 B。晝光率 DF＝室內某點水平面照度／同時戶外全天空照度（不含直射日光）×100%，由天空光直達成分、外部反射與室內反射成分組成，與窗面玻璃透光率（材質）、窗面積與位置、測點與窗的距離（立體角）、外部遮蔽物及室內表面反射率有關。建築物的「總寬度」不是計算 DF 的因子，故選 (B)。 【依據】課程教材：23 SET 07 採光設計 230421 p.28～29（晝光係數 DF＝SC＋ERC＋IRC，以標準全陰天為準）"},{"c":82,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-1 自然採光","h3":"學校教室採光面積","year":109,"no":12,"art":"2-1 自然採光","q":"學校教室應設置採光用窗或開口，其採光面積不得小於樓地板面積之比率為何？","opts":{"A":"1/2","B":"1/3","C":"1/4","D":"1/5"},"ans":"D","note":"答案 D（1/5）。建築技術規則建築設計施工編第 41 條第 1 款：幼兒園及學校教室之採光面積不得小於樓地板面積五分之一；同條第 2 款住宅居室、寄宿舍臥室、醫院病房及兒童福利設施居室等為八分之一。另同條第 3款：位於地板面以上 75 公分範圍內之窗或開口面積不得計入採光面積。 【依據】建築技術規則建築設計施工編第 41 條第 1 款"},{"c":83,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-1 自然採光","h3":"單側窗漫射日光之室內照度分布","year":110,"no":20,"art":"2-1 自然採光","q":"在開單面側窗且外部無障礙物的情形下，下列示意圖中何者較符合漫射日光在室內的照度分布狀況？\n（附圖：四個房間剖面示意圖 (A)～(D)，各房間左側牆開有側窗，室內標註「照度」，曲線表示照度由窗邊（左）往室內深處（右）的變化：(A) 窗邊附近幾乎持平、往深處愈降愈快的上凸曲線；(B) 由窗邊至深處等斜率遞減的斜直線；(C) 窗邊附近急劇下降、往深處逐漸趨於平緩的下凹曲線；(D) 全室同一高度的水平直線（照度均勻）。）","opts":{"A":"（圖 A）窗邊持平、往深處愈降愈快之上凸曲線","B":"（圖 B）等斜率遞減之斜直線","C":"（圖 C）窗邊急降、往深處趨平之下凹曲線","D":"（圖 D）全室均勻之水平直線"},"ans":"C","note":"答案 C。單側窗採光時，窗邊工作面可接收來自天空大範圍立體角的天空光，照度很高；隨著離窗距離增加，可見天空的立體角急遽縮小，照度快速下降（約呈指數／雙曲線形），至室內深處僅剩由室內反射所提供之少量光，曲線趨於平緩，因此窗邊與深處照度差距甚大（採光係數由窗邊向內快速衰減）。B 的等斜率直線遞減與 A的窗邊持平、深處才急降均不符實況；D 水平均勻分布是頂光（天窗）或人工照明的理想狀況，不是單側窗。課程教材（ET07 p.2）：單側開窗時，水平照度隨至窗戶距離而迅速降低並形成明顯陰影，最大有效採光深度約為窗上緣高度之 2.5 倍，室內交互反射可提升照度。 【依據】課程教材：23 S ET 07 採光設計 230421 p.2（單側開窗之照度分布與有效深度）"},{"c":84,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-1 自然採光","h3":"開窗型式與熱量眩光","year":111,"no":40,"art":"2-1 自然採光","q":"在臺灣地區，下列何種開窗模式最容易引入大量熱量及眩光？\n（附圖：四個建築剖面示意圖：(A) 單層建築，右側屋頂抬高，在抬高處之側面（垂直面）開一窗，窗上方有屋簷；(B) 建築中央屋頂凸起成高側窗（monitor），左右兩側垂直面各開窗，窗上方有屋簷；(C) 單斜屋頂，高側牆上開一帶狀垂直高窗，屋頂向另一側傾斜；(D) 平屋頂中央設一半圓形穹頂天窗（朝上的頂部採光）。）","opts":{"A":"（圖 A）單側高窗","B":"（圖 B）中央凸起雙側高窗","C":"（圖 C）單斜屋頂高側窗","D":"（圖 D）屋頂圓頂天窗"},"ans":"D","note":"答案 D。臺灣位於北回歸線附近，夏季太陽高度角大（正午近乎垂直）。頂光（水平天窗）面向天頂，直接接受高角度的太陽直射，日射得熱最大，且光線由上直射，易造成強烈眩光；穹頂天窗尤其如此。A、B、C 皆為垂直面之高窗（側天窗），窗上方有屋簷可遮擋高角度直射光，並可朝北配置避免直射，引入熱量與眩光較小。課程教材：天窗／採光罩屋頂開窗採光效率最高，但須掌握太陽軌跡以降低直射光形成的熱得和眩光問題；高側窗「採光效率較平天窗低但是可避免眩光及過熱」，開向北方時光線最穩定。 【依據】課程教材：23 S ET 07 採光設計p.17、22"},{"c":85,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-1 自然採光","h3":"居室採光面積之規定","year":112,"no":11,"art":"2-1 自然採光","q":"下列何者的採光用窗或開口面積，符合建築技術規則的規定？","opts":{"A":"醫院病房的採光用窗或開口面積等於樓地板面積之 1/9","B":"幼兒園的採光用窗或開口面積等於樓地板面積之 1/8","C":"住宅居室的採光用窗或開口面積等於樓地板面積之 1/10","D":"學校教室的採光用窗或開口面積等於樓地板面積之 1/4"},"ans":"D","note":"答案 D。建築技術規則設計施工編第 41 條：①幼兒園及學校教室之採光面積不得小於樓地板面積五分之一（1/5）；②住宅之居室、寄宿舍臥室、醫院病房及兒童福利設施之居室，不得小於樓地板面積八分之一（1/8）。\n逐項：A 病房 1/9 ＜ 1/8，不足；B 幼兒園 1/8 ＜ 1/5，不足；C 住宅居室 1/10 ＜ 1/8，不足；D 學校教室 1/4 ＞1/5，符合。注意 1/4 比 1/5 大（分母愈小面積比愈大）。另第 41 條第 3 款：地板面以上 75 公分範圍內之窗或開口面積不得計入採光面積。 【依據】建築技術規則建築設計施工編第 41 條第 1 款、第 2 款、第 3 款"},{"c":86,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-1 自然採光","h3":"影響自然採光因素","year":113,"no":17,"art":"2-1 自然採光","q":"影響自然採光的因素，下列敘述何者錯誤？","opts":{"A":"窗面選擇高反射玻璃不利於室內空間的自然採光","B":"深度過深的遮陽板不利於室內空間的自然採光","C":"室內空間各部位的色彩不影響自然採光的效果","D":"導光板（Light shelf）除了遮陽效果之外還具有增進自然採光的效果"},"ans":"C","note":"答案 C（錯誤）。室內牆面、天花板、地板之反射率（色彩明度）直接影響室內相互反射光，進而影響室內照度與均勻度，色彩淺者採光效果較好，故 C 錯。A：高反射玻璃可見光透過率低，減少入射量 ✓。B：過深遮陽板遮擋天空光 ✓。D：導光板（光架）遮擋近窗直射光，並將光反射至天花板、深入室內，增進均勻度 ✓。課程教材並列出建議室內表面反射率：牆 ≥50%、天花 ≥70%、地板 ≥20%。 【依據】課程教材：23 S ET 07 採光設計 p.6（內裝材料反射率）、p.10（導光板）"},{"c":87,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-1 自然採光","h3":"開窗形式與採光均齊度","year":113,"no":18,"art":"2-1 自然採光","q":"關於開窗形式對自然採光的影響，下列敘述何者正確？","opts":{"A":"水平百葉較垂直百葉更能提升自然採光的均齊度","B":"相同開窗面積時，開窗高度越低越能增加自然採光的均齊度","C":"單面採光比雙面採光更能使室內照度分布均勻","D":"相同開窗面積時，分散配置於數處較集中於一處時的均齊度差"},"ans":"A","note":"答案 A。水平百葉可遮擋近窗直射光並把光向上反射到天花板，再漫射至室內深處，有助提升均齊度（課程教材：多片水平百頁優於整片挑簷，微調百頁角度可顯著改善）。B 錯：窗戶位置愈高照度愈均勻，窗的下段對照度貢獻有限。C 錯：雙側開窗可顯著增加照度的均齊性（單側採光有效深度約窗高 2.5 倍，雙側約 5 倍）。D 錯：\n開窗面積相同時，分散配置（多處窗）比集中一處的均齊度好。B、C、D 皆與採光原則相反。【補充】「水平百葉較垂直百葉更能提升均齊度」為比較性敘述，教材未直接比較兩者，此處依官方答案 A。 【依據】課程教材：23S ET 07 採光設計 p.2（單側開窗、窗位愈高愈均勻）、p.8～9（水平百頁）、p.14（雙側開窗）"},{"c":88,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-1 自然採光","h3":"採光規定","year":114,"no":12,"art":"2-1 自然採光","q":"關於建築採光設計，下列何者符合建築技術規則的規定？","opts":{"A":"採光用窗或開口的外側若有寬度超過 2 公尺以上的陽台，有效採光面積以實際面積的 50%計算","B":"用天窗採光的有效採光面積須以實際面積的 70%計算","C":"地板面以上 75 公分範圍內的窗或開口面積不得計入採光面積之內","D":"住宅各居室都至少應有一扇窗可直接獲得日照"},"ans":"C","note":"答案 C。建築技術規則建築設計施工編第 41 條第 3 款：位於地板面以上七十五公分範圍內之窗或開口面積不得計入採光面積之內，C 正確。A 錯：第 42 條第 4 款，外側設有寬度超過二公尺以上之陽臺或外廊（露臺除外），有效採光面積按其採光面積「百分之七十」計算，非 50%。B 錯：第 42 條第 3 款，用天窗採光者，有效採光面積按其採光面積之「三倍」計算。D 錯：第 40 條規定「住宅至少應有一居室之窗可直接獲得日照」，並非各居室都要。 【依據】建築技術規則建築設計施工編第 40 條、第 41 條第 3 款、第 42 條第 3 款及第 4 款"},{"c":89,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"平均照度法","year":102,"no":13,"art":"2-2 人工照明","q":"有關辦公空間平均照度法計算的敘述，下列何者錯誤？","opts":{"A":"照明率（U）定義為到達地面之光束與光源輸出總光束之比率","B":"維護率指維持新設置時之燈具平均照度的百分比","C":"室指數決定於空間之幾何特性","D":"照明率（U）與空間各部之表面光反射率有關"},"ans":"A","note":"答案為 A。\n平均照度法：\nE=N×F×U×M÷A照明率 U 的定義，是到達「工作面（作業面，辦公室一般取桌面高度約 0.8 m）」的光束，與光源總光束之比；不是到達「地面」的光束，所以 A 錯誤。\nB 正確：維護率 M 是使用一段時間後（燈具老化、灰塵）的照度，與新設時照度之比。\nC 正確：室指數 RI = XY ÷ [H(X+Y)]，由房間長、寬與燈具到工作面的高度決定。\nD 正確：照明率查表時，需要天花板、牆、地板的反射率及室指數。 【依據】課程教材：03 電氣設備計畫 p.18（光通量法 E＝NFUM／A、照明率、維護率、室指數 K＝XY／[(X＋Y)H]）"},{"c":90,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"演色性","year":102,"no":23,"art":"2-2 人工照明","q":"下列何種光源之演色性最佳？","opts":{"A":"50 W 鹵素燈","B":"250 W 高壓鈉燈","C":"100 W 水銀燈","D":"40 W 螢光燈"},"ans":"A","note":"答案為 A。\n鹵素燈屬白熾燈系列，是熱輻射發光、光譜連續，演色性最佳。課程教材「照明設計」把鹵素燈歸在白熾燈泡類（p.6），演色指數 CRI 95 以上（p.8）。\n其他光源的 CRI（同教材）：\n・B 高壓鈉燈：約 21（p.15），光色偏黃橙\n・C 水銀燈：15～50（p.17），光譜缺少紅光\n・D 螢光燈：52～77（p.12）都比鹵素燈差。 【依據】建築環境控制一般原理（光源特性：演色性）；課程教材：23 S ET 08 照明設計 p.6、8、12、15、17"},{"c":91,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"輝度與視角","year":102,"no":26,"art":"2-2 人工照明","q":"下列何者與視覺角度有關？","opts":{"A":"光束（光通量，單位：lm）","B":"照度（單位：lx）","C":"光度（單位：cd）","D":"輝度（亮度，單位：cd/m²）"},"ans":"D","note":"答案為 D。\n輝度的定義是：\nL = I ÷ (A × cosθ)也就是某方向的光度，除以從觀看方向看到的投影面積，所以會隨「觀看角度」改變，是人眼直接感受的明亮程度。\nA 光束：光源發出的總光量，沒有方向性。\nB 照度：受光面單位面積所受的光束，與觀看者的位置無關。\nC 光度：光源在某方向的光強度，是光源本身的配光性質，不是觀看者的視角。 【依據】課程教材：03 電氣設備計畫 p.9（光的單位：光通量、光度、輝度、照度）；23 S ET 06 採光照明基礎 p.23（輝度：特定方向之發光強度或反射光密度）"},{"c":92,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"照明設計指標","year":102,"no":27,"art":"2-2 人工照明","q":"下列何者與照明設計指標無關？","opts":{"A":"均齊度","B":"眩光","C":"演色性","D":"日射量"},"ans":"D","note":"答案為 D。\n照明品質的設計指標包括：照度水準、照度均齊度（A）、眩光控制（B）、光源的演色性（C）與色溫、輝度分布等。\n日射量是太陽輻射的能量（W/m²），屬於熱環境、外殼節能與太陽能利用的指標，不是照明設計指標。（自然採光是用晝光照度或採光係數評估，不用日射量。） 【依據】課程教材：23 S ET 06 採光照明基礎 p.21（照度充足性、均齊性）、p.25～26（眩光）；03 電氣設備計畫 p.6（演色性）、p.8（色溫度）"},{"c":93,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"演色性定義","year":102,"no":28,"art":"2-2 人工照明","q":"下列何者可以表示光源對於物體顏色呈現的程度，也就是能表示物體顏色逼真的程度？","opts":{"A":"色彩調節","B":"色順應","C":"演色性","D":"色溫度"},"ans":"C","note":"答案為 C。\n演色性是光源照射物體時，呈現物體真實顏色的能力，以平均演色評價指數 Ra 表示，最高為 100，越接近 100 顏色越逼真。\nA 色彩調節：運用色彩心理與機能來配色的設計手法。\nB 色順應：眼睛在不同光色下，自動調整對顏色感受的生理現象。\nD 色溫度：表示光源本身的光色（K 值，低色溫偏暖黃，高色溫偏冷白），與演色性是不同概念。 【依據】課程教材：03 電氣設備計畫 p.6（演色性、平均演色性指數 Ra）、p.7～8（色溫度）"},{"c":94,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"發光效率","year":102,"no":29,"art":"2-2 人工照明","q":"下列何種光源之發光效率最高？","opts":{"A":"400 W 高壓水銀燈","B":"400 W 高壓鈉燈","C":"400 W 複金屬燈","D":"400 W 鹵素燈"},"ans":"B","note":"答案為 B。\n課程教材「電氣設備計畫」p.14「各種光源之效率比較」表中的發光效率（lm/W）：\n・高壓鈉氣燈泡：90～120，最高\n・複金屬燈泡：70～90\n・水銀燈泡：32～55\n・鹵素燈泡：18～20，熱輻射發光，效率最低高壓鈉燈效率雖高，但演色性差（參照第 23 題），多用於道路、廣場等不要求辨色的場所。 【依據】建築環境控制一般原理（光源發光效率）；課程教材：03 電氣設備計畫 p.14"},{"c":95,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"擴散性與均齊度","year":102,"no":35,"art":"2-2 人工照明","q":"有關光的擴散性與光源面積、照度的均齊度，三者之關係敘述，下列何者錯誤？","opts":{"A":"光的擴散性與光源面積成正比","B":"光愈具擴散性，照度的均齊度愈高","C":"照度愈高，均齊度愈小","D":"光源面積變大，均齊度愈高"},"ans":"C","note":"答案為 C。\n照度均齊度是最低照度與平均照度之比（Emin/Eavg），表示照度分布的均勻程度，與照度的絕對高低沒有必然關係。同樣的配光與配置，把燈具功率加倍，照度加倍，均齊度不變，所以「照度愈高，均齊度愈小」錯誤。\nA、B、D 正確：發光面積越大（例如面光源、間接照明、乳白擴散罩），光的擴散性越好，陰影越柔和，照度分布越均勻，均齊度越高。 【依據】建築環境控制一般原理（照度均齊度、擴散光）；課程教材：23 S ET 06 採光照明基礎 p.21"},{"c":96,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"眩光影響因素","year":102,"no":39,"art":"2-2 人工照明","q":"眩光是指在看某一主要物像時，該物像辨識度受干擾的現象，下列何者不是影響眩光的因素？","opts":{"A":"輝度","B":"色溫度","C":"光源面積","D":"眼睛與光源的角度"},"ans":"B","note":"答案為 B。\n眩光程度（例如 UGR 等眩光指數）由以下因素決定：\n・光源輝度（A）：越高越眩\n・光源的大小與立體角（C）：越大越眩\n・光源相對視線的位置與角度（D）：越接近視線越眩\n・背景輝度：越暗，對比越大越眩色溫度只代表光源的光色（偏暖或偏冷），不是眩光計算的因子。 【依據】建築環境控制一般原理（眩光）；課程教材：03 電氣設備計畫 p.16；23 S ET 06 採光照明基礎 p.26"},{"c":97,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"點光源直射照度","year":103,"no":12,"art":"2-2 人工照明","q":"建築照明計算時，點光源在某平面上固定點之直射水平面照度計算，下列參數何者不需要？","opts":{"A":"光源在入射角方向之光度","B":"光源至該計算點之距離","C":"光源之入射角","D":"光源之發散度"},"ans":"D","note":"答案 D。點光源直射水平面照度依距離平方反比與餘弦定律：Eh＝Iθ×cosθ／d²，其中 Iθ 為光源在該方向之光度（cd）、d 為光源至計算點距離、θ 為入射角，即 A、B、C 皆為必要參數。D 光源之發散度（光束發散度，單位lm/m²，指發光面單位面積發出之光束）為面光源表面性質，點光源直射照度計算不需要。 【依據】課程教材：\n23 S ET 06 採光照明基礎 p.20（點光源照度與距離平方成反比、入射角）；03 電氣設備計畫 p.9（光度、發光度＝光束發散度 lm/m²）"},{"c":98,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"辦公室照明密度","year":103,"no":30,"art":"2-2 人工照明","q":"一般辦公室照明密度應為多少？","opts":{"A":"5~10 W / m²","B":"15~20 W / m²","C":"25~30 W / m²","D":"35~40 W / m²"},"ans":"B","note":"答案 B。一般辦公室以高效率螢光燈達約 500 lx 時，照明功率密度約 15～20 W/m²。考試年度（103 年）施行之綠建築評估手冊－基本型（2012 年版）表 2-4.15「主要作業空間照明功率密度基準」，辦公室、行政空間、會議室為 15 W/m²；建築能效評估手冊 BERS（2024 年版）表 11 之 2000 年基準同為 15 W/m²；綠建築手冊 2019 年版表 2-4.13 隨燈具效率提升降為 10 W/m²。A 過低；C、D 屬耗能設計。【爭議】課程教材 02 電氣設備系統 p.42 表 4-3「負荷密度」列辦公室照明 28 W/m²（用電規則表三六辦公廳 30 VA/m²），屬受變電容量估算之設計負載，若據以作答會選 C；官方取節能設計之照明功率密度，以 B 為準。 【依據】綠建築評估手冊－基本型（2012 年版）p.67 表 2-4.15；建築能效評估手冊 BERS（2024 年版）p.131 表 11；綠建築評估手冊－基本型（2019 年版）p.77 表2-4.13；建築物節約能源設計技術規範表 5.a（辦公文教宗教照護分區照明密度 13.5 W/m²）；課程教材：02 電氣設備系統 p.42 表 4-3；用戶用電設備裝置規則（114 年）表三六"},{"c":99,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"光源色溫度","year":103,"no":31,"art":"2-2 人工照明","q":"下列何種光源之色溫度最高？","opts":{"A":"60W 白熾燈","B":"250W 高壓鈉燈","C":"100W 鹵素燈","D":"40W 螢光燈"},"ans":"D","note":"答案 D。課程教材 03 電氣設備計畫 p.8：色溫度小於 3300 K 為暖色（白熾燈約 3000 K），大於 5000 K 為冷色，螢光燈及水銀燈在 4000～6500 K 之間。同教材 p.13「人工光源種類與發光特性」表：白熾燈 2800 K、鹵素燈3000 K、高壓鈉燈 2100 K（橙黃光，四者最低）、白色螢光燈 4500 K、晝光色螢光燈 6500 K。故四者以 40W 螢光燈色溫度最高，A、B、C 均屬低色溫之暖色光源。 【依據】課程教材：03 電氣設備計畫 p.7、p.8、p.11、p.13（人工光源種類與發光特性表）"},{"c":100,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"低壓鹵素燈變壓器","year":103,"no":32,"art":"2-2 人工照明","q":"下列何種燈具，可能需要使用低伏變壓器？","opts":{"A":"白熾燈","B":"鹵素燈","C":"螢光燈","D":"水銀燈"},"ans":"B","note":"答案 B。常見之杯燈型（MR16 等）鹵素燈為 12 V 低電壓燈泡，需經低伏（降壓）變壓器將市電 110／220V 降壓後使用，故可能需要低伏變壓器。A 一般白熾燈直接使用市電；C 螢光燈與 D 水銀燈屬放電燈，需搭配安定器（及啟動器）限制電流與啟動，而非低伏變壓器。 【依據】課程教材：23 S ET 08 照明設計 p.6（鹵素燈）、p.12（螢光燈需安定器）；低壓鹵素燈變壓器（一般原理）"},{"c":101,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"明順應與暗順應","year":103,"no":33,"art":"2-2 人工照明","q":"有關光環境之敘述，下列何者錯誤？","opts":{"A":"室形屬於寬、廣者，應採用中、寬配光曲線之燈具較為適宜","B":"色溫度在 3000 K 以下時光色有偏紅的現象，色溫度超過 5000 K 時顏色則偏向藍光","C":"人眼的感光度在暗時會變高稱為明順應；在明亮時會變低稱為暗順應","D":"明視之條件是亮度、對比、大小、視物時間等四項"},"ans":"C","note":"答案 C（錯誤）。人眼由亮處進入暗處，感光度逐漸提高以適應黑暗，稱為「暗順應」（所需時間長）；由暗處進入亮處，感光度降低以適應明亮，稱為「明順應」（時間短），題述名稱顛倒。A 正確：室形指數大（寬廣低矮）之房間宜用中、寬配光燈具；B 正確：低色溫偏紅（暖色）、高色溫偏藍（冷色）；D 正確：明視四條件為亮度、對比、大小、時間。以上與課程教材所載一致（暗順應：視網膜感光度逐漸增加；明順應：感光度迅速降低）。 【依據】課程教材：03 電氣設備計畫 p.2（明視條件）、p.4（明暗順應）、p.15（配光）；23 S ET 06 採光照明基礎 p.56"},{"c":102,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"平均照度法計算","year":103,"no":34,"art":"2-2 人工照明","q":"辦公室長 9 m 寬 6 m，天花板高 3.45 m（桌面高 0.75 m），若使用 40 W 之雙燈管燈具 8 具，單管光束 2100 lm，器具維護率 0.75，照明率 0.57，利用平均照度法所求得桌面之平均水平照度約是多少？","opts":{"A":"500 lx","B":"420 lx","C":"350 lx","D":"270 lx"},"ans":"D","note":"答案 D。平均照度法 E＝N×F×U×M／A。總光束 N×F＝8 具×2 管×2100 lm＝33600 lm；面積 A＝9×6＝54m²。E＝33600×0.57×0.75／54。驗算一：33600×0.57＝19152，×0.75＝14364，÷54＝266 lx；驗算二：0.57×0.75＝0.4275，33600×0.4275＝14364，14364÷54＝266 lx。約 270 lx。天花板高與桌面高已反映於照明率（室指數），為多餘條件；A、B、C 均偏高。 【依據】課程教材：03 電氣設備計畫 p.18（光通量法照度計算）；平均照度法公式 E＝NFUM／A"},{"c":103,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"電子安定器特性","year":104,"no":31,"art":"2-2 人工照明","q":"有關燈具內電子安定器之特性，下列敘述何者錯誤？","opts":{"A":"可瞬時點燈","B":"免用啟動器","C":"燈管不閃爍","D":"產生較大噪音"},"ans":"D","note":"答案 D。電子式安定器以高頻（約 20～50 kHz）點燈，特性為：可瞬時點燈（A）、不需另裝啟動器（B）、高頻運轉燈管不閃爍（C），並且重量輕、耗電少、發熱低、功率因數高。高頻超出人耳可聽範圍，也沒有傳統電磁式安定器鐵芯的低頻嗡嗡聲，所以噪音小，D「產生較大噪音」是電磁式安定器的缺點，敘述錯誤。課程教材指出螢光燈需要安定器。 【依據】課程教材：23 S ET 08 照明設計 p.12（螢光燈需要安定器）；一般照明教材（電子與電磁安定器比較）"},{"c":104,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"光通量法燈具數計算","year":104,"no":32,"art":"2-2 人工照明","q":"假設某一室內空間：室內尺寸為 7 m×10 m，作業面全面照度為 200 lx，若使用每盞二支（每支光通量為 2000 lm）的燈具，燈具高度為 3 m、維護率為 70%、照明率為 50%，則該室內空間至少需要幾盞燈具？","opts":{"A":"10","B":"12","C":"20","D":"22"},"ans":"A","note":"答案 A。光通量法 E＝N·F·U·M／A，得 N＝E·A／(F·U·M)。A＝7×10＝70 m²；每盞 F＝2×2000＝4000 lm。\nN＝200×70／(4000×0.5×0.7)＝14000／1400＝10 盞。驗算：10 盞×4000 lm×0.5×0.7＝14000 lm，÷70 m²＝200 lx，剛好符合。燈具高度 3 m 是求室指數以查照明率用，本題已給照明率，不必再算。若誤把每盞當 2000 lm 計，會得 20盞（C）。 【依據】課程教材：03 電氣設備計畫 p.18（光通量法照度計算 E＝NFUM/A）"},{"c":105,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"照明方式與節能","year":104,"no":33,"art":"2-2 人工照明","q":"圖書館開架閱覽空間採用何種照明方式，較符合節能之需求？","opts":{"A":"全面照明","B":"混合照明","C":"局部照明","D":"分區全面照明"},"ans":"B","note":"答案 B。混合照明是以較低照度的全面（環境）照明提供空間基本亮度，再在閱覽桌、書架等作業面補充局部（作業）照明，即 task-ambient 照明。開架閱覽空間需要找書、走動的環境亮度，又需要閱讀的高照度，若以全面照明（A）或分區全面照明（D）把整個空間都提高到閱讀照度，耗電大；只用局部照明（C）則環境太暗、明暗對比大，易造成視覺疲勞。故混合照明兼顧需求與節能。 【依據】課程教材：03 電氣設備計畫 p.21（照明方式：\n全面均齊、分區均齊、局部、混合、建築化照明）、p.22（省能照明方式：選擇適當照明方式）"},{"c":106,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"光色、演色與色溫","year":104,"no":34,"art":"2-2 人工照明","q":"有關光色之敘述，下列何者正確？","opts":{"A":"一般照明條件下，人眼對紅光（也就是波長最長的可見光）之感覺最敏銳","B":"在幾種常用之光源中鹵素燈之演色性較高","C":"色溫度升高時由冷色逐漸轉為暖色","D":"鈉燈之光色偏藍"},"ans":"B","note":"答案 B。鹵素燈屬溫度輻射光源（白熾燈注入碘、溴等鹵素氣體），光譜連續，演色指數 Ra 接近 100，在常用光源中演色性最高，B 正確。A 錯：明視狀態下人眼對波長 555 nm 的黃綠光最敏感（最大視感度約 680lm/W），不是紅光。C 錯：色溫低（小於 3300 K）為暖色，高（大於 5000 K）為冷色，色溫升高是由暖轉冷。D錯：鈉燈為橙黃色光，演色性很差。 【依據】課程教材：03 電氣設備計畫 p.3（比視感度 555 nm）、p.8（色溫度與冷暖色）、p.11、p.13（鹵素燈、低壓鈉燈）；23 S ET 08 照明設計 p.6、p.8（鹵素燈；白熾燈 CRI 95+）"},{"c":107,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"光源效率考量因子","year":105,"no":31,"art":"2-2 人工照明","q":"下列何者不是燈源效率之考量因子？","opts":{"A":"燈管長度與發光效率","B":"燈管溫度","C":"室內牆壁顏色","D":"燈管壽命"},"ans":"C","note":"答案 C。燈源（光源）效率取決於光源本身：發光效率（lm/W，與燈管種類、長度、功率有關）、燈管溫度（螢光燈在周圍溫度約 25℃時光通量最高，過冷過熱都降低）、壽命與光通量維持率等。室內牆壁顏色（反射率）影響的是照明率（利用係數）與室內照度分布，屬室內條件，不是燈源本身的效率因子。課程教材：各種光源以發光效率（lm/W）、壽命、演色性、色溫比較，T5 等細管徑螢光燈管效率較高；光通量法照度計算 E = NFUM／A中，室內反射條件影響的是照明率 U，而非燈具光通量 F。【查證限制】「燈管溫度」影響光通量一項，教材未載，依照明工程通論。 【依據】課程教材：03 電氣設備計畫 n p.13（光源種類與發光特性）、p.14（各種光源之效率比較）、p.18（光通量法、照明率）；23 S ET 08 照明設計 p.4、p.5（效能 lm/W、壽命）"},{"c":108,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"照明器具配光分類","year":105,"no":32,"art":"2-2 人工照明","q":"根據國際分類，照明器具之配光方式可依其向上光通量與向下光通量的百分比來區分，下列何者為半直接（semi-direct）照明器具之配光？","opts":{"A":"向下光通量占 90～100%，向上光通量占 0～10%","B":"向下光通量占 60～90%，向上光通量占 10～40%","C":"向上光通量占 40～60%，向下光通量占 10～40%","D":"向下光通量占 10～40%，向上光通量占 60～90%"},"ans":"B","note":"答案 B。CIE 依上下光通量比例分五類：直接照明（向下 90～100%，向上 0～10%，即 A）；半直接照明（向下 60～90%，向上 10～40%，即 B）；全般擴散照明（上下各約 40～60%）；半間接照明（向下 10～40%，向上 60～90%，即 D）；間接照明（向下 0～10%，向上 90～100%）。C 的數字組合（向上 40～60%、向下 10～40%）不符任何分類。課程教材亦載半直接（semi-direct）為 60～90% 向下、10～40% 向上，對比略低、可降低直接眩光。 【依據】課程教材：23 S ET 08 照明設計 p.32；CIE 照明器具配光分類"},{"c":109,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"光源光譜與演色性","year":105,"no":33,"art":"2-2 人工照明","q":"有關室內人工照明之光源敘述，下列何者錯誤？","opts":{"A":"白熾燈泡光譜中較缺乏藍光","B":"水銀燈光譜中較缺乏紅光","C":"鈉氣燈的演色性優於複金屬燈","D":"商店或美術館應禁用含紫外線光譜的光源，以避免褪色"},"ans":"C","note":"答案 C（錯誤）。課程教材：高壓鈉氣燈演色指數 CRI 約 21（poor），低壓鈉燈光譜極窄不常用於室內；複金屬燈在汞外加入鉈、銦、鈉等金屬鹵化物，演色指數提高至 60～90，演色性遠優於鈉氣燈（另一份教材之光源特性表：複金屬燈 Ra 65、高壓鈉燈 28、低壓鈉燈 20）。B：教材載水銀燈光譜缺乏紅色、演色指數很低，正確。\nA：白熾燈色溫低（約 3000 K，暖色），紅黃光多、藍光少，正確。D：紫外線會使展品、商品褪色劣化，展示照明應濾除紫外線，正確。 【依據】課程教材：23 S ET 08 照明設計 p.14～p.18；03 電氣設備計畫 p.8（色溫）；03電氣設備計畫 n p.13（光源種類與發光特性表）"},{"c":110,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"照度基準影響因素","year":105,"no":34,"art":"2-2 人工照明","q":"有關照度基準之敘述，下列何者錯誤？","opts":{"A":"從事細部性工作所需之照度高於大尺寸的視覺工作之要求","B":"高齡者比年輕者所需之照度較高","C":"從事低對比工作所需之照度低於高對比視覺工作之需要","D":"走道空間比辦公空間需要之照度較低"},"ans":"C","note":"答案 C（錯誤）。視覺作業所需照度隨作業對象尺寸愈小、對比愈低、作業時間愈長、速度與精確度要求愈高而提高；低對比（如深色布料上縫深色線）不易辨識，需要更高照度，所以低對比工作所需照度應「高於」高對比工作。A：細部工作所需照度較高，正確。B：高齡者水晶體混濁、瞳孔縮小，進入眼睛的光較少，需要較高照度，正確。D：走道屬通行空間，照度基準低於辦公作業空間，正確。課程教材列視銳度之影響因子為光線強弱、物件相對大小、色相與明度對比、視覺曝光時間、眩光，並以示意圖逐一說明（對比降低則可見度降低）。 【依據】課程教材：23 S ET 06 採光照明基礎 p.45～p.55"},{"c":111,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"輝度","year":106,"no":31,"art":"2-2 人工照明","q":"有關輝度（Luminance）之敘述，下列何者錯誤？","opts":{"A":"輝度係指光源體在某方向上，單位面積所發出的光度","B":"輝度可以用來評估發光體對眼睛的刺激程度","C":"室內輝度比愈大，均齊度愈好","D":"輝度的單位為 cd/m² 或 nt"},"ans":"A 或 C 均給分（更正前公告答案 C）","note":"C 錯：室內各面輝度比愈大，明暗對比愈強，均齊度愈差，易生眩光與視覺疲勞；應控制作業面與周圍輝度比。B：輝度即眼睛感受之亮度，可評估刺激與眩光 ✓。D：單位 cd/m²，又稱 nit（nt）✓。【查證限制／爭議】考選部未公布更正理由，以下為推測：輝度嚴格定義為某方向之光度除以該方向之「正投影面積」，課程教材亦稱輝度為「特定方向之光源發光強度或受照表面反射光密度」（06 採光照明基礎 p.23），不限光源體；A 寫「光源體」、「單位面積」不夠精確，可被認定為錯誤，故 A 亦給分。 【依據】課程教材：03 電氣設備計畫 p.9；23 SET 06 採光照明基礎 0422 p.23"},{"c":112,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"室指數","year":106,"no":32,"art":"2-2 人工照明","q":"照明率會依照明燈具的配光、燈具效率、室內形狀（室指數）及周壁反射率而變化，假設室內尺寸為：長 a、寬b，光源至作業面高度為 h，則室指數（K）為：","opts":{"A":"K=(a×b)/[h(a+b)]","B":"K=(a×b)/(h×a×b)","C":"K=(a+b)/[h(a+b)]","D":"K=(a+b)/(h×a×b)"},"ans":"A","note":"答案 A。室指數 K＝a×b／[h×(a＋b)]（課程教材 p.18：K＝XY／[(X＋Y)H]，X 寬、Y 進深、H 光源至作業面高度），即樓地板面積除以「光源至作業面高度 × 長寬和（半周長）」，代表室內水平面積與周壁面積的相對大小；K 愈大（房間寬而矮）照明率愈高。驗算：a＝10、b＝10、h＝2.5 時，K＝100／(2.5×20)＝2.0，為常見之 K 值範圍（約 0.6～5）。B 化簡為 1/h，C 化簡為 1/h，均與房間平面無關；D 量綱不合（1/m²）。 【依據】課程教材：03 電氣設備計畫 p.18（光通量法 E＝NFUM／A、室指數 K＝XY／[(X＋Y)H]）"},{"c":113,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"光源發光效率","year":106,"no":33,"art":"2-2 人工照明","q":"下列何種光源之發光效率最低？","opts":{"A":"21W 省電燈泡","B":"400W 鹵素燈","C":"250W 高壓鈉燈","D":"40W 螢光燈"},"ans":"B","note":"答案 B。發光效率（lm/W）＝光通量／消耗功率，與功率大小無直接關係，取決於發光原理。鹵素燈屬白熾燈類溫度輻射光源（03 電氣設備計畫 p.11），白熾燈類約 93％ 電能轉成熱（08 照明設計 p.8）。課程教材 03 電氣設備計畫 p.14「各種光源之效率比較」：鹵素燈泡 18～20 lm/W（四者最低）、省電燈泡 30～50、一般螢光燈管 48～80（高效率螢光燈管 89～100）、高壓鈉氣燈泡 90～120（08 照明設計 p.15 列 110～150）。故 B 最低，C 高壓鈉燈最高。 【依據】課程教材：03 電氣設備計畫 p.11、p.14（各種光源之效率比較）；23 S ET 08 照明設計 230421p.8、p.12、p.15"},{"c":114,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"教室天花反射率","year":106,"no":34,"art":"2-2 人工照明","q":"視覺輝度與室內表面裝修材料反射率有關，因此教室各部位裝修面材料的反射率須做適當選擇，教室天花面之適當反射率為何？","opts":{"A":"70-85%","B":"40-60%","C":"30-35%","D":"15-30%"},"ans":"A","note":"答案 A。室內反射率配置原則為「天花最高、牆面次之、地板最低」。課程教材 p.6：室內表面反射率設定為天花 ≥70％（明度最高）、牆 ≥50％、地板 ≥20％；四選項中只有 70～85％ 符合天花 ≥70％。天花採高反射淺色材料，可使光線均勻漫射、提高照明率並降低燈具與天花之輝度對比。B 40～60％ 約為牆面值；D 15～30％ 約為地板、桌面值；C 30～35％ 過低，天花顯得陰暗、照明率下降。 【依據】課程教材：23 S ET 07 採光設計 230421p.6"},{"c":115,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"配光曲線","year":107,"no":11,"art":"2-2 人工照明","q":"配光曲線圖是用來表示何種照明物理量的分布狀態？","opts":{"A":"輝度","B":"眩光指數","C":"發光強度（光度）","D":"照度"},"ans":"C","note":"答（C）。配光曲線是以極座標表示燈具（或光源）在各方向之發光強度（光度，單位 cd，常以每 1000 lm光源之 cd 值表示）分布，用以判斷燈具為直接、半直接、間接等配光型式，並作為逐點法照度計算的依據（課程教材英文即稱 Candela distribution）。（A）輝度（cd/m2）為發光面或反射面在某方向的明亮程度；（B）眩光指數為眩光評價值；（D）照度（lx）為受照面單位面積入射光通量，可由配光資料計算，但配光曲線本身表示的是光度。 【依據】課程教材：23 S ET 08 照明設計 p.39"},{"c":116,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"照明節能原則","year":107,"no":12,"art":"2-2 人工照明","q":"有關照明設計節約能源原則，下列何者錯誤？","opts":{"A":"在考慮光源與演色性之配合條件下，應用高發光效率之光源","B":"考慮降低安裝燈具高度來增加照度或維持相同照度而減少燈具","C":"確認明視工作桌面位置，使桌面獲得足夠照度，而降低桌面以外照度","D":"照明回路配線設計應垂直窗戶，以配合窗邊利用晝光而可以熄燈"},"ans":"D","note":"答（D）。為配合晝光利用，照明回路應「平行窗戶」分排配線：靠窗那一排燈具獨立成一回路，晝光充足時可單獨關閉或調光，內側各排再依距窗遠近分路。若回路垂直窗戶，一條回路同時包含窗邊與室內深處燈具，無法只關窗邊燈，故（D）錯誤。（A）在演色性需求下選高效率（lm/W 高）光源，正確。（B）燈具降低高度可減少光通量損失、提高照明率，正確。（C）採工作照明與環境照明分區（TAL 概念），正確。 【依據】課程教材：03 電氣設備計畫 p.21（照明方式）、p.22（省能照明方式：選擇高效率光源、晝光的利用、有效的配線設計配合晝光調整）"},{"c":117,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"人工光源特性","year":107,"no":13,"art":"2-2 人工照明","q":"有關人工光源之敘述，下列何者錯誤？","opts":{"A":"人工光源的平均演色性指數 Ra 愈低，演色性愈佳","B":"人工光源的色溫度愈低，光色愈偏紅黃","C":"人工光源的 lm/W 數值愈高，表示愈省能","D":"一般常用的螢光燈，較鹵素燈更為省能"},"ans":"A","note":"答（A）。平均演色性指數 Ra 以基準光源為 100，Ra 愈「高」（愈接近 100）表示物體色彩重現愈接近基準光源，演色性愈佳，故（A）說反了。（B）色溫度低（約 2700～3000 K）光色偏紅黃、溫暖；高色溫（5000 K 以上）偏藍白，正確。（C）lm/W 為發光效率，每瓦產生之光通量愈多愈省能，正確。（D）螢光燈發光效率約為鹵素燈（白熾燈類）的數倍，較省能，正確。 【依據】課程教材：03 電氣設備計畫 p.6（演色性 Ra）、p.8（色溫度與光色）、p.14（各種光源之效率比較：鹵素燈泡 18～20、一般螢光燈管 48～80 lm/W）"},{"c":118,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"視覺生理（普金耶現象）","year":107,"no":14,"art":"2-2 人工照明","q":"有關視覺生理量之敘述，下列何者錯誤？","opts":{"A":"在燈光昏暗處，人眼對紅色的感覺最敏銳","B":"眩光指數愈高，感覺愈刺眼","C":"暗適應所須的時間較明適應來得長","D":"採光之方向與光亮的多寡，會影響物體的立體感"},"ans":"A","note":"答（A）。明亮時由錐狀細胞主導（明視覺），比視感度峰值約在 555 nm（黃綠光）；昏暗時改由桿狀細胞主導（暗視覺），峰值移向約 507 nm（藍綠光），此即普金耶現象（Purkinje effect），暗處紅色看起來較暗、藍綠色相對較亮，故「暗處對紅色最敏銳」錯誤。（B）眩光指數愈高表示眩光愈強，正確。（C）暗適應需數十分鐘，明適應只需約數十秒至一兩分鐘，正確。（D）光的方向性與明暗分布形成陰影，影響立體感（造型感），正確。\n【依據】課程教材：23 S ET 06 採光照明基礎 p.39～40（明亮時對黃綠光最敏感，光線減弱後最敏感區轉向綠／藍）、p.56（明順應較暗順應快）；03 電氣設備計畫 p.3（555 nm 最大視感度）、p.4（明暗順應）"},{"c":119,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"照明設備與燈具","year":107,"no":33,"art":"2-2 人工照明","q":"有關照明設備之敘述，下列何者錯誤？","opts":{"A":"若光源種類與數量相同，T-bar 燈所產生的照度較層板燈高","B":"製作成 T5 或 T8 型式的 LED 燈管無安定器","C":"照明燈具的配線應搭配分區開關，以因應不同的使用需求","D":"在挑高的空間欲維持相同的桌面照度，使用吸頂燈比懸吊式燈具節能"},"ans":"D","note":"答（D）。挑高空間使用吸頂燈，光源離工作面遠，照度約與距離平方成反比，且光通量在到達桌面前多被牆面吸收，照明率低，需更多燈具才能維持桌面照度；懸吊式燈具降低安裝高度，較節能，故（D）錯誤（亦見第12 題 B）。（A）T-bar 燈（輕鋼架嵌燈）為直接照明，層板燈為投向天花再反射之間接照明，光源相同時直接照明照度較高，正確。（B）LED 燈管以驅動器（driver）供電，不需螢光燈之安定器，依題意正確（市面亦有相容安定器型，屬例外）。（C）分區開關因應不同使用需求，正確。 【依據】課程教材：23 S ET 08 照明設計 230421p.12（螢光燈需安定器）、p.20～22（LED）、p.30～37（直接／間接配光）；23 S ET 06 採光照明基礎 p.20（照度與距離平方成反比）；03 電氣設備計畫 p.22（有效的配線設計）"},{"c":120,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"辦公室演色性與照明節能","year":107,"no":34,"art":"2-2 人工照明","q":"有關照明設備之敘述，下列何者錯誤？","opts":{"A":"辦公室照明的平均演色性指數 Ra 標準為 50~70 之間","B":"TAL（Task Ambient Lighting）照明可兼顧節能與照度需求","C":"照明功率密度（Lighting Power Density）愈低，表示愈節能","D":"頻繁開關螢光燈，會減少其使用壽命"},"ans":"A","note":"答（A）。辦公室屬長時間視作業空間，CNS 12112 照度標準要求辦公室 Ra 不低於 80；課程教材 03 電氣設備計畫 p.6「光源演色性等級及其適用場所」（取材自 CIE）把辦公室列在第 2 級 70≦Ra≦85，Ra＜70 為第 3 級，故 50～70 不符任一標準，（A）錯誤。（B）TAL 為工作照明＋環境照明，以局部照明滿足桌面照度、降低環境照度，兼顧節能與需求，正確。（C）LPD（W/m²）為單位面積照明用電功率，相同照度下愈低愈節能，正確。\n（D）螢光燈每次啟動時電極物質消耗較大，頻繁開關會縮短壽命，正確。【查證限制】CNS 12112 原文本機無。\n【依據】課程教材：03 電氣設備計畫 p.6（光源演色性等級及其適用場所）、p.21（照明方式）；23 S ET 08 照明設計 p.5（壽命受點滅次數影響）；CNS 12112 照度標準（本機無原文）"},{"c":121,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"燈具配光分類（間接照明）","year":108,"no":11,"art":"2-2 人工照明","q":"間接照明提供柔和的光線，有助於空間氣氛的營造，下列何者為間接照明的配光分布？","opts":{"A":"上方光通量 0~10%，下方光通量 90~100%","B":"上方光通量 60~90%，下方光通量 10~40%","C":"上方光通量 90~100%，下方光通量 0~10%","D":"上方光通量 40~60%，下方光通量 40~60%"},"ans":"C","note":"答案 C。依 CIE 燈具配光分類（上方／下方光通量比）：直接照明 0～10%／90～100%（A）；半直接 10～40%／60～90%；全般擴散 40～60%／40～60%（D）；半間接 60～90%／10～40%（B）；間接照明 90～100%／0～10%（C）。間接照明光主要射向天花再反射下來，柔和、眩光少，但燈具本身顯得陰暗、效率較低，常需搭配局部照明（課程教材各配光型之百分比與此相同）。 【依據】課程教材：23 S ET 08 照明設計 230421 p.30–37"},{"c":122,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"燈具與光源特性（更正題）","year":108,"no":13,"art":"2-2 人工照明","q":"有關人工照明燈具之敘述，下列何者錯誤﹖","opts":{"A":"以發光強度的分布而言，長條型螢光燈屬於非對稱配光的燈具","B":"以 4 尺長度燈管而言，28W T5 燈管比 40W T8 燈管省電","C":"T5 自然光燈管的色溫度約為 2500 K","D":"以演色性指數（color rendering index, Ra）而言，鹵素燈泡比白色日光燈好"},"ans":"A 或 C 均給分（更正前公告答案 C）","note":"C 錯誤（原公告答案）：晝光色（自然光）螢光燈色溫約 5000～6500 K，2500～3000 K 屬燈泡色（暖色），課程教材亦指出色溫小於 3300 K 為暖色、螢光燈約 4000～6500 K。B：T5 光效高，28W 可取代 40W（或 36W）T8，正確；D：鹵素燈為熱輻射光源，Ra 接近 100，優於一般白色螢光燈，正確。A（更正後亦給分）：考選部未公布更正理由，以下為推測——出題意旨認為長條燈管在管軸方向與垂直管軸方向的配光曲線不同（非旋轉對稱），故稱「非對稱配光」；但照明術語中「非對稱配光」通常指光線偏向一側的配光（如洗牆燈、路燈），一般長條型螢光燈具左右、前後均為對稱配光，故 A 也可判為錯誤而一併給分。【爭議】本題兩選項均有爭議空間，考生記住 C（色溫）為確定錯誤即可。 【依據】考選部 108 年更正答案；課程教材：03 電氣設備計畫 p.8"},{"c":123,"law":"光環境","g":"光環境","h1":"第 2 篇　光環境","h2":"2-2 人工照明","h3":"測光量單位","year":108,"no":14,"art":"2-2 人工照明","q":"有關測光量單位之敘述，下列何者錯誤？","opts":{"A":"照明計算中採用的光通量（光束），指的波長範圍為 380~780 nm","B":"光源對單位立體角所發出的光通量稱為光度","C":"照度的單位為 lm / m²","D":"輝度的單位為 lx / m²"},"ans":"D","note":"答案 D（錯誤）。輝度（亮度）為某方向單位投影面積上的光度，單位為 cd/m²（nit）；lx 已是 lm/m²，「lx/m²」不是輝度單位。A：光通量以人眼可見光
