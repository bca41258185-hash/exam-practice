<style>
.sp-bg{fill:var(--paper);opacity:.88}
.sp-badl{stroke:var(--bad)!important;stroke-width:2.2!important}
.sp-mass{fill:var(--blue-soft);stroke:none}
.sp-mass.bad{fill:var(--badbg)}
.sp-out{stroke:var(--ink);stroke-width:2.6;fill:none;stroke-linejoin:miter}
.sp-out.bad{stroke:var(--bad);stroke-width:3}
.sp-ghost{fill:var(--blue-soft);opacity:.6;stroke:var(--ink);stroke-width:1.4;stroke-dasharray:5 3}
.sp-hdl circle{fill:var(--mark);stroke:var(--mark-ink);stroke-width:1.5}
.sp-hdl text{fill:var(--mark-ink)!important;font-size:12px;font-weight:900}
.sp-hdl.bad circle{fill:var(--bad)}
.sp-hdl:focus circle{stroke-width:3.4;stroke:var(--ink)}
[data-d="m"]:focus .sp-out{stroke:var(--mark);stroke-width:3.4}
[data-d]:focus{outline:none}
.sp-let circle{fill:var(--ink)}.sp-let text{fill:var(--paper)!important;font-size:13px;font-weight:900}
.sp-let:hover circle,.sp-let:focus circle{fill:var(--mark)}.sp-let:hover text,.sp-let:focus text{fill:var(--mark-ink)!important}.sp-let:focus{outline:none}
.sp-let.on circle{fill:var(--mark)}.sp-let.on text{fill:var(--mark-ink)!important}
.sq-stat{font-family:var(--f-data);font-size:13px;color:var(--mut);margin:4px 0 0}
#siteQuiz figure,#gSite figure{margin:10px 0}
</style>
<script>
(function(){
"use strict";
var K=window.KY; if(!K)return;
var $=K.$, $$=K.$$, el=K.el;

/* ================= 共用：三塊基地的資料 =================
   座標單位是公尺，x 往東、y 往南，(0,0) 是基地西北角。 */
K.siteData=[
 {id:'lib', name:'例題基地', prog:'社區圖書分館暨樂齡學習中心', W:40, H:50,
  sides:{S:{road:15,main:1,label:'15 m 計畫道路（主要）',lab:31},
         W:{road:8,label:'8 m 計畫道路',lab:22},
         E:{nb:'park',d:12,label:'社區公園'},
         N:{nb:'house',d:10,label:'4 層集合住宅'}},
  sb:{N:3,E:3,S:4,W:4},
  trees:[{x:34.6,y:44.2,r:5.5,label:'老榕樹（保留）'}],
  bus:{side:'S',t:13,w:8},
  mass:[{kind:'rect',w:24,h:32,fl:3,floors:'3F＋B1',name:'圖書館'}],
  spaces:[{side:'E',min:8,kind:'grass',name:'綠帶'},{side:'S',min:8,kind:'tile',name:'入口廣場'},{side:'N',min:6,kind:'trees',name:'樹帶'}],
  cov:50, far2:160},
 {id:'cnr', name:'街角基地', prog:'里民活動中心暨托嬰中心', W:48, H:44,
  sides:{S:{road:20,main:1,label:'20 m 計畫道路（主要，車多）',lab:18},
         E:{road:12,label:'12 m 計畫道路',lab:33,far:{d:8,label:'國小',gate:8,gw:6}},
         N:{nb:'house',d:10,label:'3 層透天住宅'},
         W:{nb:'office',d:10,label:'5 層辦公大樓'}},
  sb:{N:3,E:4,S:4,W:3},
  trees:[],
  mass:[{kind:'rect',w:30,h:14,fl:4,floors:'4F',name:'活動中心'}],
  spaces:[{side:'N',min:12,kind:'grass',name:'安靜中庭'},{side:'E',min:6,kind:'tile',name:'轉角廣場'}],
  cov:50, far2:180},
 {id:'old', name:'老屋基地', prog:'社區藝文中心（保留日式老屋）', W:50, H:44,
  sides:{W:{road:15,main:1,label:'15 m 計畫道路（主要）',lab:34},
         S:{road:8,label:'8 m 計畫道路',lab:11},
         N:{nb:'kinder',d:10,label:'幼兒園'},
         E:{nb:'house',d:10,label:'5 層集合住宅'}},
  sb:{N:3,E:3,S:4,W:4},
  trees:[{x:4.5,y:16.5,r:3.4,label:'老樟樹'}],
  old:{x:8,y:12,w:14,h:9,buf:4,label:'日式老屋（保留）'},
  mass:[{kind:'rect',w:40,h:12,fl:3,floors:'3F＋B1',name:'藝文中心',tag:'一字'},
        {kind:'L',w:32,h:26,t:12,fl:3,floors:'3F＋B1',name:'藝文中心',tag:'L 型'}],
  spaces:[{side:'N',min:10,kind:'grass',name:'日照綠地'}],
  cov:50, far2:150}
];

/* ================= 共用：量體幾何 =================
   rot 0–3 表示順時針轉 0、90、180、270 度。L 型在 rot 0 時缺角位於西北。 */
K.siteShape=function(def,rot){
  var w=def.w, h=def.h, parts, poly;
  if(def.kind==='L'){var t=def.t; parts=[[0,h-t,w,t],[w-t,0,t,h-t]]; poly=[[0,h-t],[w-t,h-t],[w-t,0],[w,0],[w,h],[0,h]]}
  else{parts=[[0,0,w,h]]; poly=[[0,0],[w,0],[w,h],[0,h]]}
  for(var k=0;k<((rot||0)%4+4)%4;k++){ var BH=h;
    parts=parts.map(function(p){return [BH-p[1]-p[3],p[0],p[3],p[2]]});
    poly=poly.map(function(p){return [BH-p[1],p[0]]}); var tt=w; w=h; h=tt }
  return {bw:w,bh:h,parts:parts,poly:poly};
};
K.siteMass=function(def,st){
  var s=K.siteShape(def,st.rot), x=st.x, y=st.y, area=0;
  var parts=s.parts.map(function(p){area+=p[2]*p[3]; return {x:p[0]+x,y:p[1]+y,w:p[2],h:p[3]}});
  var poly=s.poly.map(function(p){return [p[0]+x,p[1]+y]});
  var edges=poly.map(function(a,i){var b=poly[(i+1)%poly.length], dx=b[0]-a[0], dy=b[1]-a[1], n=[Math.sign(dy),-Math.sign(dx)];
    return {a:a,b:b,len:Math.abs(dx)+Math.abs(dy),n:n,face:n[1]<0?'N':n[1]>0?'S':n[0]>0?'E':'W'}});
  return {def:def,parts:parts,poly:poly,edges:edges,bb:{x:x,y:y,w:s.bw,h:s.bh},area:area,fl:def.fl};
};
/* 量體外框到四條地界的距離 */
K.siteGaps=function(site,m){var b=m.bb; return {N:b.y,S:site.H-(b.y+b.h),W:b.x,E:site.W-(b.x+b.w)}};
K.rectDist=function(a,b){var dx=Math.max(0,a.x-(b.x+b.w),b.x-(a.x+a.w)), dy=Math.max(0,a.y-(b.y+b.h),b.y-(a.y+a.h)); return Math.sqrt(dx*dx+dy*dy)};
K.ptRectDist=function(p,b){var dx=Math.max(0,b.x-p[0],p[0]-(b.x+b.w)), dy=Math.max(0,b.y-p[1],p[1]-(b.y+b.h)); return Math.sqrt(dx*dx+dy*dy)};
/* 地界上的點：edge 為 N/E/S/W，t 為由西或由北起算的公尺數 */
K.sitePt=function(site,edge,t){return edge==='N'?[t,0]:edge==='S'?[t,site.H]:edge==='W'?[0,t]:[site.W,t]};
K.edgePt=function(e,s){var dx=Math.sign(e.b[0]-e.a[0]), dy=Math.sign(e.b[1]-e.a[1]); return [e.a[0]+dx*s,e.a[1]+dy*s]};
K.faceN={N:[0,-1],S:[0,1],W:[-1,0],E:[1,0]};

/* ================= 共用：專業配置圖 =================
   var P=K.sitePlan(site,{uid}); svg.setAttribute('viewBox','0 0 720 '+P.vbH); svg.innerHTML=P.render({...})
   render 參數：mass:{m,bad,attrs}、ghosts:[m]、marks:[{type:'d'|'ld'|'e'|'e2',edge,t 或 pt,face,bad,nolab,hdl:{ch,attrs}}]、
   spaces:true 自動標示開放空間、hl:{setb:{N:1},tree:{0:1},old:1}、info:[[項目,值,超過]]、top:額外 SVG */
K.sitePlan=function(site,o){
  o=o||{}; var D=K.draw(true), W=site.W, H=site.H, SD=['N','E','S','W'], ctx={};
  SD.forEach(function(s){var d=site.sides[s]; ctx[s]=d.road?d.road+(d.far?d.far.d:0):(d.d||10)});
  var totW=ctx.W+W+ctx.E, totH=ctx.N+H+ctx.S, NR=!!o.narrow, vbW=NR?400:720, S=Math.round((NR?Math.min(372/totW,500/totH):Math.min(440/totW,470/totH))*100)/100;
  var fx=14, fy=14, fw=totW*S, fh=totH*S, ox=fx+ctx.W*S, oy=fy+ctx.N*S, cx0=Math.round(fx+fw+24), cw=706-cx0;
  var vbH=NR?Math.round(fy+fh+238):Math.round(Math.max(fy+fh+14,396)), uid=o.uid||'sp', HR=NR?13:11;
  function X(m){return ox+m*S} function Y(m){return oy+m*S}
  function rr(n){return Math.round(n*10)/10}
  function rect(x,y,w,h,cls,extra){return '<rect x="'+rr(X(x))+'" y="'+rr(Y(y))+'" width="'+rr(w*S)+'" height="'+rr(h*S)+'"'+(cls?' class="'+cls+'"':'')+(extra||'')+'/>'}
  function hatch(x,y,w,h,kind,op){return '<rect x="'+rr(X(x))+'" y="'+rr(Y(y))+'" width="'+rr(w*S)+'" height="'+rr(h*S)+'" fill="'+D.fill(kind)+'" stroke="none"'+(op?' opacity="'+op+'"':'')+'/>'}
  function tw(t,fs){var w=0; for(var i=0;i<t.length;i++)w+=t.charCodeAt(i)>255?fs:fs*.6; return w}
  function line(a,b,cls){return '<path d="M'+rr(X(a[0]))+' '+rr(Y(a[1]))+' L'+rr(X(b[0]))+' '+rr(Y(b[1]))+'" class="'+cls+'"/>'}
  /* 有底色的文字標籤，(x,y) 為 px 中心 */
  function lab(x,y,t,cls,rot,fs){cls=cls||'t-area'; fs=fs||(cls==='t-room'?11:9.5); var w=tw(t,fs)+6, h=fs+4, tr=rot?' transform="rotate('+rot+' '+rr(x)+' '+rr(y)+')"':'';
    return '<g'+tr+'><rect x="'+rr(x-w/2)+'" y="'+rr(y-h/2)+'" width="'+rr(w)+'" height="'+rr(h)+'" class="sp-bg"/><text x="'+rr(x)+'" y="'+rr(y+fs*.36)+'" text-anchor="middle" class="'+cls+'"'+(cls==='t-area'?' style="fill:var(--ink)"':'')+(fs!==11&&cls==='t-room'?' style="font-size:'+fs+'px"':'')+'>'+t+'</text></g>'}
  /* 沿某一側的矩形（公尺）：a 沿地界，d 為離地界的深度 */
  function band(s,a0,a1,d0,d1){ if(s==='N')return [a0,-d1,a1-a0,d1-d0]; if(s==='S')return [a0,H+d0,a1-a0,d1-d0]; if(s==='W')return [-d1,a0,d1-d0,a1-a0]; return [W+d0,a0,d1-d0,a1-a0]}
  function bpt(s,a,d){return s==='N'?[a,-d]:s==='S'?[a,H+d]:s==='W'?[-d,a]:[W+d,a]}
  function isRoad(s){return !!site.sides[s].road}
  function perp(s){return (s==='N'||s==='S')?['W','E']:['N','S']}
  function alongLen(s){return (s==='N'||s==='S')?W:H}
  /* 道路沿線範圍到路口為止；鄰地的角落交給南北兩側 */
  function inner(s){var p=perp(s); return [isRoad(p[0])?0:-ctx[p[0]], isRoad(p[1])?alongLen(s):alongLen(s)+ctx[p[1]]]}
  function nbRange(s){ if(s==='E'||s==='W')return [0,H]; return inner(s)}

  function neighbour(s){var d=site.sides[s], g=nbRange(s), a0=g[0], a1=g[1], dd=ctx[s], h='', vert=(s==='E'||s==='W');
    var c=bpt(s,(a0+a1)/2,dd/2);
    if(d.nb==='park'){ var r=band(s,a0,a1,0,dd); h+=hatch(r[0],r[1],r[2],r[3],'grass');
      var q0=bpt(s,a0,dd*.62), q1=bpt(s,(a0+a1)/2,dd*.25), q2=bpt(s,a1,dd*.55);
      h+='<path d="M'+rr(X(q0[0]))+' '+rr(Y(q0[1]))+' Q'+rr(X(q1[0]))+' '+rr(Y(q1[1]))+' '+rr(X(q2[0]))+' '+rr(Y(q2[1]))+'" class="lw-thin" style="stroke-width:7;stroke:var(--line);opacity:.8"/>';
      var i=0; for(var a=a0+5;a<a1-3;a+=10.5){var tp=bpt(s,a,i++%2?dd*.74:dd*.3); h+=D.tree(X(tp[0]),Y(tp[1]),2.8*S)}
      h+=lab(X(c[0]),Y(c[1]),d.label,'t-room',vert?-90:0) }
    else if(d.nb==='kinder'){ var pg=band(s,a0+3,a1-3,1.5,dd*.5), kb=band(s,a0+3,a1-3,dd*.58,dd+2); h+=hatch(pg[0],pg[1],pg[2],pg[3],'grass')+rect(pg[0],pg[1],pg[2],pg[3],'lw-thin');
      h+=hatch(kb[0],kb[1],kb[2],kb[3],'hatch',.3)+rect(kb[0],kb[1],kb[2],kb[3],'lw-vis');
      var c1=bpt(s,(a0+a1)/2,dd*.27), c2=bpt(s,(a0+a1)/2,dd*.82); h+=lab(X(c1[0]),Y(c1[1]),'遊戲場（朝南）','t-area')+lab(X(c2[0]),Y(c2[1]),'2F '+d.label,'t-room') }
    else { var off=d.nb==='office', seg=off?(a1-a0-4):15, a=a0+(off?2:1);
      while(a<a1-4){var e=Math.min(a+seg,a1-1); var r2=band(s,a,e,1.5,dd+2); h+=hatch(r2[0],r2[1],r2[2],r2[3],'hatch',.3)+rect(r2[0],r2[1],r2[2],r2[3],'lw-vis'); a=e+4}
      h+=lab(X(c[0]),Y(c[1]),d.label,'t-room',vert?-90:0) }
    return h }

  function road(s){var d=site.sides[s], p=perp(s), full=[-ctx[p[0]],alongLen(s)+ctx[p[1]]], r=band(s,full[0],full[1],0,d.road), h='', vert=(s==='E'||s==='W'), g=inner(s), c0=g[0], c1=g[1];
    if(!isRoad(p[0]))c0=full[0]; if(!isRoad(p[1]))c1=full[1];
    h+=rect(r[0],r[1],r[2],r[3],'f-line')+hatch(r[0],r[1],r[2],r[3],'road');
    h+=line(bpt(s,c0,d.road/2),bpt(s,c1,d.road/2),'lw-axis');
    h+=line(bpt(s,c0,0),bpt(s,c1,0),'lw-vis');
    h+=line(bpt(s,c0,2.5),bpt(s,c1,2.5),'lw-thin');
    if(!d.far)h+=line(bpt(s,c0,d.road),bpt(s,c1,d.road),'lw-vis');
    var lp=bpt(s,d.lab!=null?d.lab:alongLen(s)/2,d.road*.7); h+=lab(X(lp[0]),Y(lp[1]),d.label,'t-dim',vert?-90:0,10);
    if(d.far){var f=d.far, fr=band(s,c0,c1,d.road,d.road+f.d), gt=f.gate, gw=f.gw||6;
      h+=hatch(fr[0],fr[1],fr[2],fr[3],'grass',.7);
      var A=bpt(s,c0,d.road+.4), B=bpt(s,gt-gw/2,d.road+.4), C=bpt(s,gt+gw/2,d.road+.4), E=bpt(s,c1,d.road+.4);
      h+='<path d="M'+rr(X(A[0]))+' '+rr(Y(A[1]))+' L'+rr(X(B[0]))+' '+rr(Y(B[1]))+' M'+rr(X(C[0]))+' '+rr(Y(C[1]))+' L'+rr(X(E[0]))+' '+rr(Y(E[1]))+'" class="lw-out" style="stroke-dasharray:3 2"/>';
      [B,C].forEach(function(q){h+='<rect x="'+rr(X(q[0])-2.5)+'" y="'+rr(Y(q[1])-2.5)+'" width="5" height="5" class="poche"/>'});
      for(var z=1;z<d.road-.5;z+=1.25){var zr=band(s,gt-2.2,gt+2.2,z,z+.6); h+='<rect x="'+rr(X(zr[0]))+'" y="'+rr(Y(zr[1]))+'" width="'+rr(zr[2]*S)+'" height="'+rr(zr[3]*S)+'" style="fill:var(--ink);opacity:.5"/>'}
      var gl=bpt(s,gt,d.road+f.d*.5); h+=lab(X(gl[0]),Y(gl[1]),'校門','t-area',vert?-90:0);
      var fl=bpt(s,(gt+gw/2+c1)/2+2,d.road+f.d*.5); h+=lab(X(fl[0]),Y(fl[1]),f.label,'t-room',vert?-90:0) }
    return h }

  /* 自動標示的開放空間：量體與地界之間夠寬的一側 */
  function spaceRect(sp,m,g){var b=m.bb; if(sp.side==='N')return [0,0,W,g]; if(sp.side==='S')return [0,b.y+b.h,W,g]; if(sp.side==='E')return [b.x+b.w,b.y,g,b.h]; return [0,b.y,g,b.h]}
  /* 標籤位置：在候選點中挑離入口、車道、樹最遠的一個（公尺） */
  var OBS=[];
  function spacePos(sp,m,gaps){var b=m.bb, g=gaps[sp.side], t=sp.name+' '+g+' m', vert=sp.side==='E'||sp.side==='W', rot=vert&&g<15, hw=(tw(t,11)/2+5)/S, c=[];
    if(!vert){var y=sp.side==='N'?g*(sp.kind==='trees'?.8:.5):H-g/2; [.5,.3,.7,.15,.85].forEach(function(f){c.push([b.x+b.w*f,y])}); c.push([b.x/2,y]); c.push([(b.x+b.w+W)/2,y]);
      c=c.map(function(q){return [clamp(q[0],hw+.5,W-hw-.5),q[1]]})}
    else {var x=sp.side==='E'?W-g/2:g/2; [.5,.3,.7,.2,.8].forEach(function(f){c.push([x,b.y+b.h*f])}); if(rot)c=c.map(function(q){return [q[0],clamp(q[1],b.y+hw,b.y+b.h-hw)]})}
    var best=c[0], bs=-1e9; c.forEach(function(q){var sc=1e9; OBS.forEach(function(o){var dx=Math.max(0,Math.abs(q[0]-o[0])-(rot?1.2:hw)), dy=Math.max(0,Math.abs(q[1]-o[1])-(rot?hw:1.2)); sc=Math.min(sc,Math.hypot(dx,dy)-o[2])}); if(sc>bs+.5){bs=sc;best=q}});
    return {x:best[0],y:best[1],rot:rot,t:t,hw:hw}}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function spaceStrip(sp,m,gaps){var g=gaps[sp.side]; if(g<sp.min)return ''; var r=spaceRect(sp,m,g), h=hatch(r[0],r[1],r[2],r[3],sp.kind==='tile'?'tile':'grass');
    if(sp.kind==='tile')h+=hatch(r[0],r[1],r[2],r[3],'conc');
    if(sp.kind==='trees'){var lp=spacePos(sp,m,gaps), n=Math.floor((r[2]-2)/6.5), tr=Math.min(2.6,g/2.4); for(var i=0;i<n;i++){var tx=r[0]+4+i*6.5; if(Math.abs(tx-lp.x)<lp.hw+tr&&Math.abs(r[1]+r[3]*.42-lp.y)<tr+1.4)continue; var ty=r[1]+r[3]*.42; if(OBS.some(function(o){return o[2]<5&&Math.hypot(tx-o[0],ty-o[1])<tr+o[2]}))continue; h+=D.tree(X(tx),Y(r[1]+r[3]*.42),tr*S)}}
    return h }
  function spaceLabel(sp,m,gaps){var g=gaps[sp.side]; if(g<sp.min)return ''; var q=spacePos(sp,m,gaps); return lab(X(q.x),Y(q.y),q.t,'t-room',q.rot?-90:0,11) }
  /* 量體到地界的尺寸（mm） */
  function gapDims(m,gaps,spc){var h='', named={}; if(spc)(site.spaces||[]).forEach(function(sp){ if(gaps[sp.side]>=sp.min)named[sp.side]=1 });
    SD.forEach(function(s){var g=gaps[s]; if(g<=0||named[s])return; var part=m.parts.slice().sort(function(p,q){return s==='N'?p.y-q.y:s==='S'?(q.y+q.h)-(p.y+p.h):s==='W'?p.x-q.x:(q.x+q.w)-(p.x+p.w)})[0], t=String(Math.round(g*1000));
      if(s==='N'){var x=part.x+Math.min(3,part.w*.15); h+=D.dim(X(x),Y(0),X(x),Y(part.y),t,0)}
      else if(s==='S'){var x2=part.x+Math.min(3,part.w*.15); h+=D.dim(X(x2),Y(part.y+part.h),X(x2),Y(H),t,0)}
      else if(s==='W'){var y=part.y+part.h-Math.min(3,part.h*.15); h+=D.dim(X(0),Y(y),X(part.x),Y(y),t,0)}
      else {var y2=part.y+Math.min(3,part.h*.15); h+=D.dim(X(part.x+part.w),Y(y2),X(W),Y(y2),t,0)} });
    return h }

  function massSvg(m,bad,attrs,ghost){var h='<g'+(attrs||'')+'>';
    if(ghost){m.parts.forEach(function(p){h+=rect(p.x,p.y,p.w,p.h,'sp-ghost')}); return h+'</g>'}
    m.parts.forEach(function(p){h+=rect(p.x,p.y,p.w,p.h,'sp-mass'+(bad?' bad':''))});
    /* 柱位軸線（8 m） */
    m.parts.forEach(function(p){ var gx, gy;

  box.innerHTML='';
  box.appendChild(el('h4',null,'<em>動手 5</em>每塊基地先做四個決定'));
  box.appendChild(el('p',{'class':'gdesc'},'照「車道、量體、入口、空地」的順序決定。三塊基地就是下面「配置拖拉」的三關，先在這裡想清楚再去拖。四題中第一次就選對三題算過關。'));
  var prompt=el('p',{'class':'hint',id:'sqPrompt'}), fig=el('figure'), svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('id','sqSvg'); svg.setAttribute('role','group'); svg.setAttribute('aria-label','基地配置圖，點選圖上的字母'); fig.appendChild(svg);
  var opts=el('div',{'class':'opts',id:'sqOpts'}), why=el('p',{'class':'why',id:'sqWhy',hidden:''}), stat=el('p',{'class':'sq-stat',id:'sqStat'});
  var row=el('div',{'class':'frow'}), nextB=el('button',{'class':'go',type:'button',id:'sqNext',hidden:''},'下一個決定 →'), lvB=el('button',{'class':'go',type:'button',id:'sqLv',hidden:''},'下一小關 →'), againB=el('button',{'class':'ghost',type:'button',id:'sqAgain',hidden:''},'這塊基地重做一次');
  row.appendChild(nextB); row.appendChild(lvB); row.appendChild(againB);
  [prompt,fig,opts,why,row,stat].forEach(function(n){box.appendChild(n)});

  var lv=0, qi=0, done=false, tried=false, right=0, plan=null, P=null, sel=null, L;
  function site(){return SITES[lv]}
  function massOf(ms){return K.siteMass(site().mass[ms.type],ms)}
  function entryPt(m,e){var ed=typeof e[0]==='number'?m.edges[e[0]]:m.edges.filter(function(x){return x.face===e[0]}).sort(function(a,b){return b.len-a.len})[0];
    return {pt:K.edgePt(ed,Math.round(ed.len*e[1])),face:ed.face}}
  function optOf(k){return Q[lv][qi].pts.filter(function(x){return x.k===k})[0]}
  function draw(){
    var q=Q[lv][qi], mk=[], ghosts=[], top='', s=site(), sp=sel?optOf(sel):null;
    if(plan.d)mk.push({type:'d',edge:plan.d[0],t:plan.d[1]});
    if(plan.ld)mk.push({type:'ld',edge:plan.ld[0],t:plan.ld[1]});
    var m=plan.m?massOf(plan.m):null;
    if(m&&plan.e){var ep=entryPt(m,plan.e); mk.push({type:'e',pt:ep.pt,face:ep.face})}
    if(sp&&q.kind==='mass')ghosts.push(massOf(sp.m));
    if(sp&&(q.kind==='drive'||q.kind==='load'))mk.push({type:q.kind==='drive'?'d':'ld',edge:sp.at[0],t:sp.at[1],bad:!sp.ok,nolab:1});
    if(sp&&q.kind==='entry'&&m){var e3=entryPt(m,sp.e); mk.push({type:'e',pt:e3.pt,face:e3.face,bad:!sp.ok,nolab:1})}
    if(!done)q.pts.forEach(function(p){var at=null;
      if(p.lp)at=p.lp;
      else if(p.at){var bp=K.sitePt(s,p.at[0],p.at[1]), n=K.faceN[p.at[0]]; at=[bp[0]+n[0]*3.6,bp[1]+n[1]*3.6]}
      else if(p.e&&m){var ee=entryPt(m,p.e), nn=K.faceN[ee.face]; at=[ee.pt[0]+nn[0]*4,ee.pt[1]+nn[1]*4]}
      if(at)top+=P.letter(at[0],at[1],p.k,' data-k="'+p.k+'" tabindex="0" role="button" aria-label="選項 '+p.k+'"',sel===p.k)});
    svg.innerHTML=P.render({mass:m?{m:m}:null,ghosts:ghosts,marks:mk,spaces:!!plan.sp,info:K.siteInfo(s,m),top:top});
    $$('.sp-let',svg).forEach(function(g){g.addEventListener('click',function(){pick(g.getAttribute('data-k'))}); g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(g.getAttribute('data-k'))}})});
  }
  function status(){stat.textContent='第一次就選對 '+right+'／4　已完成 '+(qi+(done?1:0))+'／4'}
  function render(){
    var q=Q[lv][qi]; done=false; tried=false; sel=null;
    prompt.innerHTML='<b>決定 '+(qi+1)+'／4：'+q.p+'</b>　'+(q.kind==='space'?'選下面的方案。':'點圖上的字母或下面的選項。');
    opts.innerHTML=''; q.pts.forEach(function(p){var b=el('button',{type:'button','data-k':p.k},'<b>'+p.k+'</b>　'+p.t); opts.appendChild(b); b.addEventListener('click',function(){pick(p.k)})});
    why.hidden=true; nextB.hidden=true; againB.hidden=true; lvB.hidden=true; status(); draw();
  }
  function pick(k){ if(done)return; var q=Q[lv][qi], p=optOf(k); sel=k;
    $$('button',opts).forEach(function(b){b.classList.remove('wrong'); if(b.dataset.k===k)b.classList.add(p.ok?'right':'wrong')});
    why.hidden=false; why.className='why '+(p.ok?'ok':'no'); why.innerHTML=(p.ok?'<b>對。</b>':'<b>不理想。</b>')+p.why+(p.ok?'':'　再選一次。');
    if(p.ok){ if(!tried)right++; done=true; sel=null;
      if(q.kind==='drive')plan.d=p.at; else if(q.kind==='load')plan.ld=p.at; else if(q.kind==='mass')plan.m=p.m; else if(q.kind==='entry')plan.e=p.e;
      $$('button',opts).forEach(function(b){b.disabled=true});
      if(qi===3){plan.sp=1; finish()} else nextB.hidden=false }
    tried=true; status(); draw() }
  function finish(){var sc=Math.round(right/4*100), ok=L.done(lv,sc);
    why.innerHTML+='<br><b>這塊基地第一次就選對 '+right+'／4，得 '+sc+' 分。</b>'+(ok?(lv<SITES.length-1?'可以到下一塊基地。':'三塊基地都做完了，去下面的配置拖拉動手擺。'):'要第一次就選對 3 題才過關，再做一次。');
    againB.hidden=false; lvB.hidden=!(ok&&lv<SITES.length-1) }
  function start(i){lv=i; qi=0; right=0; P=K.sitePlan(site(),{uid:'sq',narrow:K.narrowPlan()}); svg.setAttribute('viewBox','0 0 '+P.vbW+' '+P.vbH);
    plan={d:null,m:null,e:null,sp:0,ld:null}; render()}
  nextB.addEventListener('click',function(){qi++; render()});
  againB.addEventListener('click',function(){start(lv)});
  lvB.addEventListener('click',function(){L.next()});
  L=K.levels(box,{key:'g:sq',names:['例題','街角','老屋'],pass:75,start:start});
  var nw=K.narrowPlan(); window.addEventListener('resize',function(){var n=K.narrowPlan(); if(n===nw)return; nw=n; P=K.sitePlan(site(),{uid:'sq',narrow:n}); svg.setAttribute('viewBox','0 0 '+P.vbW+' '+P.vbH); draw()});
})();
})();
