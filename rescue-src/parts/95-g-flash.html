 ['敷地計畫考幾小時','4 小時','8 小時','2 小時'],['每科幾分及格','60 分','50 分','70 分'],['建築師考試共幾科','6 科','4 科','8 科'],['例題：臨道路側退縮','4 m','1 m','10 m'],['考場習慣：鄰地側至少退','3 m','0 m','8 m'],

].forEach(function(x){B.push({c:'fa',q:x[0],a:x[1],w:[x[2],x[3]],y:''})});
(window.KY_PAST||[]).forEach(function(q){ if(!q.area||!q.bcr||!q.far||q.id==='104')return; var s=q.area, nm=q.id+' 年真題「'+q.t+'」：';

  B.push(Q('rp',nm+'基地 '+f(s)+' ㎡、容積率 '+q.far+'%，最大容積樓地板？',s*q.far/100,[s*q.bcr/100,s*(q.far+100)/100,s*q.far/200],' ㎡','基地 × 容積率'));

Array.prototype.slice.call(box.children).forEach(function(c){ if(!c.classList.contains('ghead')&&!c.classList.contains('gdesc'))box.removeChild(c) });

var mode='all', deck, score, streak, left, timer=null, lock=false, right, total, wrongs;
function bestOf(m){return (K.st.sc&&K.st.sc['flash:'+m])||0}
function showBest(){$('#flBest',body).textContent='這個題型的最高紀錄：'+bestOf(mode)+' 分'}
CAT.forEach(function(c){var b=el('button',{type:'button','class':'pill','data-m':c[0],'aria-pressed':c[0]===mode?'true':'false'},c[1]+' <span class="fig">'+(c[0]==='all'?B.length:B.filter(function(q){return q.c===c[0]}).length)+'</span>'); $('#flCat',body).appendChild(b);

function build(){ if(mode!=='all')return shuffle(B.filter(function(q){return q.c===mode}));
