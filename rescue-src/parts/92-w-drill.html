<script>
(function(){
"use strict";
var K=window.KY; if(!K||!K.levels||!K.draw)return;
var $=K.$, $$=K.$$, el=K.el, gradeNum=K.gradeNum, mmss=K.mmss;
/* ---------- M8 實戰：三道題，每道四關計時 ---------- */
(function(){
  var box=$('#drill'); if(!box)return;
  /* 以公尺作圖的小工具 */
  function M(S,ox,oy){var o={S:S,X:function(x){return ox+x*S},Y:function(y){return oy+y*S}};
    o.r=function(x,y,w,h,cls,extra){return '<rect x="'+o.X(x)+'" y="'+o.Y(y)+'" width="'+w*S+'" height="'+h*S+'" class="'+cls+'"'+(extra||'')+'/>'};
    o.t=function(x,y,txt,cls,rot){var X=o.X(x),Y=o.Y(y); return '<text x="'+X+'" y="'+Y+'" text-anchor="middle" class="'+(cls||'t-dim')+'"'+(rot?' transform="rotate('+rot+' '+X+' '+Y+')"':'')+'>'+txt+'</text>'};
    return o}
  function notes(x,y,lines){return '<g class="drnotes">'+lines.map(function(t,i){return '<text x="'+x+'" y="'+(y+i*19)+'" class="t-dim" style="font-size:11px">'+t+'</text>'}).join('')+'</g>'}
  function arrow(x1,y1,x2,y2){var a=Math.atan2(y2-y1,x2-x1), h=7; return '<path d="M'+x1+' '+y1+' L'+x2+' '+y2+'" class="lw-vis"/><path d="M'+x2+' '+y2+' L'+(x2-h*Math.cos(a-.4))+' '+(y2-h*Math.sin(a-.4))+' L'+(x2-h*Math.cos(a+.4))+' '+(y2-h*Math.sin(a+.4))+' Z" class="poche"/>'}

  /* 第 1 題：社區托育暨親子館 30 × 40 m */
  function plan1(){var D=K.draw(true), m=M(7,110,50), s='<svg viewBox="0 0 720 460" role="img" aria-label="社區托育暨親子館參考配置圖">';
    s+=D.road(30,330,410,84,'12 m 道路')+D.road(320,6,42,324,'6 m 巷道',true);
    s+=D.hatch(30,50,66,280,'grass')+'<text x="63" y="190" text-anchor="middle" class="t-dim" transform="rotate(-90 63 190)">國小操場</text>';
    [[115,180],[186,251],[257,318]].forEach(function(h){s+='<rect x="'+h[0]+'" y="4" width="'+(h[1]-h[0])+'" height="20" class="lw-vis"/>'}); s+='<text x="215" y="18" text-anchor="middle" class="t-dim">3 層透天住宅</text>';
    /* 退縮帶與步道 */
    s+=D.hatch(m.X(0),m.Y(37),210,21,'tile')+D.hatch(m.X(27),m.Y(0),21,259,'tile')+D.hatch(m.X(24.5),m.Y(12),17.5,175,'tile');
    /* 車道與停車 */
    s+=m.r(4,6.5,26,5.5,'f-line')+D.hatch(m.X(4),m.Y(6.5),182,38.5,'road')+'<path d="M'+m.X(4)+' '+m.Y(9.25)+' H'+m.X(30)+'" class="lw-axis"/>';
    s+=D.park(m.X(9),m.Y(1),5,17.5,38.5,'h')+m.r(21.5,.5,3.5,6,'lw-thin')+'<path d="M'+m.X(21.5)+' '+m.Y(.5)+' L'+m.X(25)+' '+m.Y(6.5)+'" class="lw-thin"/>'+m.t(23.25,4.4,'無障','t-area');
    s+=D.hatch(m.X(0),m.Y(0),63,45,'grass')+D.tree(m.X(2.5),m.Y(3),11)+D.tree(m.X(6.5),m.Y(3.5),11);
    /* 接送臨停 */
    s+=m.r(27,14,2.5,12,'f-line')+'<path d="M'+m.X(27)+' '+m.Y(14)+' v'+12*7+'" class="lw-vis"/>'+m.t(28.6,20,'接送臨停','t-area',-90);

    /* 建築 */
    s+=m.r(1,13,23.5,19,'f-soft')+'<path d="M'+m.X(1)+' '+m.Y(13)+' h164.5 v133 h-164.5 z" class="lw-out"/>';
    s+=m.t(12.75,21.5,'托育暨親子館','t-room')+m.t(12.75,23.6,'RC 2F　23.5 × 19 m ≈ 450 ㎡','t-area')+m.t(12.75,26,'1F 托嬰室 ×3、社區廚房、門廳','t-area')+m.t(12.75,28,'2F 遊戲室、親職教室 ×2、行政','t-area');
    s+=D.entry(m.X(24.5)+7,m.Y(17),-90)+'<text x="'+(m.X(24.5)-4)+'" y="'+(m.Y(17)+3)+'" text-anchor="end" class="t-dim">主入口</text>';
    s+=D.entry(m.X(25.75),m.Y(38.5),0)+'<text x="'+m.X(25.75)+'" y="'+(m.Y(40)+12)+'" text-anchor="middle" class="t-dim">人行入口</text>';
    s+=arrow(m.X(30)+38,m.Y(8),m.X(28),m.Y(8))+arrow(m.X(28),m.Y(10.5),m.X(30)+38,m.Y(10.5))+'<text x="'+(m.X(30)+44)+'" y="'+(m.Y(9.25)+3)+'" class="t-dim">車道出入口</text>';
    s+=D.tree(m.X(4),m.Y(38.5),8)+D.tree(m.X(12),m.Y(38.5),8)+D.tree(m.X(20),m.Y(38.5),8);
    /* 地界、退縮、尺寸 */
    s+='<path d="M'+m.X(0)+' '+m.Y(0)+' h210 v280 h-210 z" class="lw-site"/><path d="M'+m.X(27)+' '+m.Y(0)+' V'+m.Y(37)+' H'+m.X(0)+'" class="lw-setb"/>';
    s+=D.dim(m.X(0),m.Y(0),m.X(30),m.Y(0),'30000',-12)+D.dim(m.X(0),m.Y(0),m.X(0),m.Y(40),'40000',10);
    s+=D.dim(m.X(16),m.Y(37),m.X(16),m.Y(40),'3000',0)+D.dim(m.X(27),m.Y(30),m.X(30),m.Y(30),'3000',0);
    s+=D.north(670,52,13)+notes(450,70,['① 車從東側巷道北段進出，離路口最遠','② 6 部車（含無障礙 1 部）排在北側','③ 接送臨停緊貼主入口，家長不在 12 m 路上停車','④ 行人走東側步道進門，不穿越車道','⑤ 遊戲庭朝南、有圍籬，孩子不碰到車','⑥ 建築靠北靠西，陽光面留給庭院']);
    s+=D.scale(450,380,7,[0,5,10,20])+D.title(560,430,'參考配置圖','1/300');
    return s+'</svg>'}

  /* 第 2 題：市場改建暨社區客廳 40 × 30 m 轉角 */
  function plan2(){var D=K.draw(true), m=M(6.5,70,52), s='<svg viewBox="0 0 720 440" role="img" aria-label="市場改建暨社區客廳參考配置圖">';
    s+=D.road(10,m.Y(30),m.X(50)-10+20,97.5,'15 m 道路（主要道路）')+D.road(m.X(40),6,65,m.Y(30)-6,'10 m 道路',true);
    s+='<rect x="18" y="'+m.Y(1)+'" width="40" height="'+28*6.5+'" class="lw-vis"/><text x="38" y="'+m.Y(15)+'" text-anchor="middle" class="t-dim" transform="rotate(-90 38 '+m.Y(15)+')">4 層住宅</text>';
    [[72,140],[146,214],[220,288],[294,328]].forEach(function(h){s+='<rect x="'+h[0]+'" y="4" width="'+(h[1]-h[0])+'" height="20" class="lw-vis"/>'}); s+='<text x="180" y="18" text-anchor="middle" class="t-dim">3 層透天店鋪</text>';
    /* 退縮帶、轉角廣場 */
    s+=D.hatch(m.X(0),m.Y(26),260,26,'tile')+D.hatch(m.X(36),m.Y(0),26,169,'tile');
    s+=D.hatch(m.X(32),m.Y(22),52,52,'tile')+D.tree(m.X(37.8),m.Y(24.8),9)+m.t(35.6,29.3,'轉角廣場','t-area');
    /* 車道坡道、裝卸 */
    s+=m.r(14,.3,22,3.4,'f-line')+D.hatch(m.X(14),m.Y(.3),143,22,'road');
    for(var k=0;k<6;k++)s+='<path d="M'+m.X(32-k*3.2)+' '+m.Y(.8)+' l-6 '+(1.2*6.5)+' l6 '+(1.2*6.5)+'" class="lw-thin"/>';
    s+=m.t(21,2.4,'車道往 B1','t-area');
    s+=m.r(32,6,3.5,7,'lw-thin')+m.r(32,13,3.5,7,'lw-thin')+m.r(32,6,3.5,14,'f-line',' style="opacity:.6"')+m.t(34,13,'裝卸車位 ×2','t-area',-90);
    /* 建築 */
    s+=m.r(0,4,32,22,'f-soft')+'<path d="M'+m.X(0)+' '+m.Y(4)+' h208 v143 h-208 z" class="lw-out"/><path d="M'+m.X(24)+' '+m.Y(4)+' V'+m.Y(26)+'" class="lw-vis"/>';
    s+=m.r(28,20,4,6,'lw-vis')+m.t(30,23.4,'梯廳','t-area');
    s+=m.t(12,12.5,'市場暨社區客廳','t-room')+m.t(12,14.6,'RC 2F','t-area')+m.t(12,16.6,'1F 32 × 22 m ＝ 704 ㎡','t-area')+m.t(12,18.6,'2F 24 × 22 m','t-area')+m.t(28,12,'1F','t-room');
    s+=D.entry(m.X(8),m.Y(26)+7,0)+D.entry(m.X(18),m.Y(26)+7,0)+m.t(13,28.8,'市場入口','t-dim');
    s+=D.entry(m.X(32)+7,m.Y(23),-90)+'<text x="'+(m.X(40)+6)+'" y="'+(m.Y(30)+30)+'" class="t-dim">社區客廳夜間入口（梯廳面向廣場）</text><path d="M'+(m.X(40)+4)+' '+(m.Y(30)+26)+' L'+(m.X(33)+4)+' '+(m.Y(23)+4)+'" class="lw-thin"/>';
    s+=arrow(m.X(40)+40,m.Y(1.2),m.X(37),m.Y(1.2))+arrow(m.X(37),m.Y(2.8),m.X(40)+40,m.Y(2.8))+arrow(m.X(40)+40,m.Y(9),m.X(36.2),m.Y(9));
    s+=D.tree(m.X(3),m.Y(28),8)+D.tree(m.X(29),m.Y(28),8);
    s+='<path d="M'+m.X(0)+' '+m.Y(0)+' h260 v195 h-260 z" class="lw-site"/><path d="M'+m.X(36)+' '+m.Y(0)+' V'+m.Y(22)+' M'+m.X(32)+' '+m.Y(26)+' H'+m.X(0)+' M'+m.X(32)+' '+m.Y(22)+' H'+m.X(36)+' M'+m.X(32)+' '+m.Y(22)+' V'+m.Y(26)+'" class="lw-setb"/>';
    s+=D.dim(m.X(0),m.Y(0),m.X(40),m.Y(0),'40000',-10)+D.dim(m.X(0),m.Y(0),m.X(0),m.Y(30),'30000',8);
    s+=D.dim(m.X(25),m.Y(26),m.X(25),m.Y(30),'4000',0)+D.dim(m.X(36),m.Y(21),m.X(40),m.Y(21),'4000',0)+D.dim(m.X(32),m.Y(30),m.X(40),m.Y(30),'8000',10);
    s+=D.north(680,52,13)+notes(470,80,['① 車道（1：6 往 B1，汽車 12 部）和','　 裝卸都在東側道路北段，離路口 10 m 以上','② 轉角廣場只給人走，車不穿越','③ 社區客廳梯廳面向廣場，','　 晚上市場關門也能獨立進出','④ 市場主入口面向南側主要道路','⑤ 二樓縮在西側，轉角留出天空']);
    s+=D.scale(470,300,6.5,[0,5,10,20])+D.title(575,350,'參考配置圖','1/300');
    return s+'</svg>'}

  /* 第 3 題：樂齡日照暨青年住宅 24 × 60 m 狹長基地 */
  function plan3(){var D=K.draw(true), S=6, m=M(S,140,50), s='<svg viewBox="0 0 720 520" role="img" aria-label="樂齡日照暨青年住宅參考配置圖">';
    s+=D.road(60,m.Y(60),300,54,'10 m 道路');
    s+=D.hatch(60,4,300,m.Y(0)-14,'grass')+D.tree(80,22,9)+D.tree(330,20,9)+'<text x="210" y="20" text-anchor="middle" class="t-dim">河濱公園</text>';
    s+='<rect x="72" y="'+m.Y(2)+'" width="52" height="'+54*S+'" class="lw-vis"/><text x="98" y="'+m.Y(30)+'" text-anchor="middle" class="t-dim" transform="rotate(-90 98 '+m.Y(30)+')">5 層住宅</text>';
    s+='<rect x="'+(m.X(24)+10)+'" y="'+m.Y(2)+'" width="52" height="'+54*S+'" class="lw-vis"/><text x="'+(m.X(24)+36)+'" y="'+m.Y(30)+'" text-anchor="middle" class="t-dim" transform="rotate(-90 '+(m.X(24)+36)+' '+m.Y(30)+')">5 層住宅</text>';
    /* 退縮帶、通道、中庭 */
    s+=D.hatch(m.X(0),m.Y(0),24*S,3*S,'grass')+m.r(0,56,24,4,'f-line')+D.hatch(m.X(0),m.Y(56),24*S,4*S,'tile');
    s+=D.hatch(m.X(20),m.Y(3),4*S,53*S,'tile')+m.t(22.4,30,'通道 4 m','t-area',-90);
    s+=D.hatch(m.X(0),m.Y(22),20*S,14*S,'grass');
    s+='<circle cx="'+m.X(7)+'" cy="'+m.Y(29)+'" r="'+5*S+'" class="lw-hid"/>'+D.tree(m.X(7),m.Y(29),4*S)+m.t(16,28.6,'老茄苳','t-area')+m.t(16,30.6,'保留','t-area');
    /* 建築 */
    s+=m.r(0,36,20,20,'f-soft')+'<path d="M'+m.X(0)+' '+m.Y(36)+' h'+20*S+' v'+20*S+' h'+(-20*S)+' z" class="lw-out"/>'+m.t(10,44.5,'樂齡日照','t-room')+m.t(10,46.8,'RC 2F','t-area')+m.t(10,48.8,'20 × 20 m ＝ 400 ㎡','t-area');
    s+=m.r(4,3,16,19,'f-soft')+'<path d="M'+m.X(4)+' '+m.Y(3)+' h'+16*S+' v'+19*S+' h'+(-16*S)+' z" class="lw-out"/>'+m.t(12,11,'青年住宅','t-room')+m.t(12,13.3,'RC 4F','t-area')+m.t(12,15.3,'16 × 19 m','t-area')+m.t(12,17.3,'＝ 304 ㎡','t-area');
    for(var k=0;k<6;k++)s+=m.r(.4,4.5+k*2.6,2,.8,'lw-thin'); s+=m.t(3.4,12.5,'自行車 20','t-area',-90);
    s+=m.r(20.3,40,3.4,8,'lw-hid')+m.t(22.4,44,'接送停靠','t-area',-90);
    s+=D.entry(m.X(20)+6,m.Y(44),-90)+D.entry(m.X(20)+6,m.Y(12),-90)+D.entry(m.X(14),m.Y(22)+7,0)+D.entry(m.X(10),m.Y(36)-7,180);
    s+=arrow(m.X(22),m.Y(60)+30,m.X(22),m.Y(49));
    s+=D.tree(m.X(4),m.Y(58),7)+D.tree(m.X(12),m.Y(58),7);
    s+='<path d="M'+m.X(0)+' '+m.Y(0)+' h'+24*S+' v'+60*S+' h'+(-24*S)+' z" class="lw-site"/><path d="M'+m.X(0)+' '+m.Y(3)+' H'+m.X(24)+' M'+m.X(0)+' '+m.Y(56)+' H'+m.X(24)+'" class="lw-setb"/>';
    s+=D.dim(m.X(0),m.Y(0),m.X(24),m.Y(0),'24000',-10)+D.dim(m.X(0),m.Y(0),m.X(0),m.Y(60),'60000',10)+D.dim(m.X(17),m.Y(56),m.X(17),m.Y(60),'4000',0)+D.dim(m.X(22),m.Y(0),m.X(22),m.Y(3),'3000',0);
    s+=D.north(680,52,13)+notes(390,90,['① 老樹把基地切成南北兩塊：','　 南棟日照 2 層，北棟住宅 4 層','② 接送車從東側通道進來，停在日照門口，','　 上方二樓出挑遮雨','③ 住戶走同一條通道到北棟，','　 自己的門和樓梯電梯','④ 老樹下是兩棟共用的中庭','⑤ 老茄苳樹冠 ø10 m 範圍內不蓋、不挖','⑥ 建築面積 400 ＋ 304 ＝ 704 ≤ 720 ㎡']);
    s+=D.scale(390,370,S,[0,5,10,20])+D.title(530,440,'參考配置圖','1/300');
    return s+'</svg>'}

  var PB=[
  {name:'社區托育暨親子館', plan:plan1, scale:'30 m 畫 10 cm、40 m 畫約 13 cm', floorsQ:'你決定蓋幾層',
   brief:'某社區年輕家庭增加，擬興建一處<b>讓家長安心托育、鄰里互相認識</b>的親子據點。<br><b>基地</b>　矩形，東西向 30 m、南北向 40 m，面積 1,200 ㎡，平坦。南側臨 12 m 道路，東側臨 6 m 巷道，西側緊鄰國小操場，北側為 3 層透天住宅。<br><b>法規</b>　建蔽率 60%、容積率 180%。臨道路側退縮 3 m。地上不得超過 3 層。<br><b>空間需求</b>　托嬰室 3 間，每間 60 ㎡；親子遊戲室 200 ㎡；親職教室 2 間，每間 60 ㎡；社區廚房 80 ㎡；行政辦公 60 ㎡。須設戶外遊戲庭。<b>托嬰室須設於地面層。</b><br><b>停車</b>　於法定空地設汽車位 6 部（含無障礙 1 部），須有家長接送臨停空間。<br><b>圖面</b>　配置圖 1/300、各層平面 1/200、剖面 1/200、立面、透視、計畫說明。',
   hard:['建蔽率 ≤ 60%','容積率 ≤ 180%','南側、東側各退縮 3 m','地上 ≤ 3 層','托嬰室在地面層（3 間共 180 ㎡ 都要在一樓）','要有戶外遊戲庭','汽車 6 部含無障礙 1 部，設在地面的法定空地（不用挖地下室）','家長接送臨停空間'],
   issues:'家長安心托育（安全、看得到孩子、接送不危險）；鄰里互相認識（廚房、遊戲室對社區開放）。',
   ans:[720,2160,640,896,2], tol:[1,1,1,70,0],
   calc:[['最大建築面積','1,200 × 60%','720 ㎡'],['最大容積樓地板','1,200 × 180%','2,160 ㎡'],['淨面積','60×3＋200＋60×2＋80＋60','640 ㎡'],['需要的樓地板','640 × 1.4','約 900 ㎡'],['層數','900 ÷ 2 層','每層 450 ㎡']],
   calcTxt:'蓋 2 層、每層約 450 到 480 ㎡ 最合理。每層 450 遠小於上限 720，空地足夠放遊戲庭和 6 部車。蓋 3 層雖然不違規，但每層只剩 300 ㎡，而托嬰室 180 ㎡ 必須在一樓，一樓會放不下門廳和遊戲室；而且幼兒空間越低越好。蓋 1 層需要 900 ㎡，超過建蔽率上限。',
   stack:[['1F','托嬰室 ×3、社區廚房、門廳','260 ㎡'],['2F','親子遊戲室、親職教室 ×2、行政','380 ㎡']],
