<script>
(function(){
"use strict";
var K=window.KY; if(!K||!K.levels)return;
var $=K.$, $$=K.$$, el=K.el;
/* ---------- M1 讀題標記：三份題目 ----------
   題目用 {類別|文字|為什麼} 標出要點的片語；類別 h=硬條件 r=空間需求 i=議題 d=圖面要求。換行用 \n。 */
(function(){
  var box=$('#tagger'); if(!box)return;
  var CAT={h:'hard',r:'room',i:'issue',d:'draw'}, NAME={hard:'硬條件',room:'空間需求',issue:'議題',draw:'圖面要求'};
  var B=[
  {t:'社區圖書分館暨樂齡學習中心',
   s:'某市鎮老舊住宅區人口逐漸高齡化，市府擬興建一處{i|讓不同世代自然相遇、白天晚上都有人使用|這是希望達成的效果，沒有數字也沒有「應、須」，所以是議題。}的社區據點。\n'
    +'<b>一、基地</b>　基地為矩形，東西向 40 m、南北向 50 m，面積 2,000 ㎡，地勢平坦。南側臨 15 m 道路（主要道路，有公車站），西側臨 8 m 道路，東側緊鄰社區公園，北側為 4 層樓集合住宅。{h|基地東南角有一棵老榕樹，應予保留|有「應」，而且會限制量體和地下室的範圍，是硬條件。}。\n'
    +'<b>二、法規</b>　使用分區為住宅區，{h|建蔽率 50%|法規數字，超過就違規。}、{h|容積率 160%|法規數字，決定總樓地板的上限。}。{h|臨道路側應退縮 4 m 作為人行步道|有「應」和數字，量體不能壓進退縮範圍。}。{h|地上樓層不得超過 4 層|「不得」加數字，是硬條件。}。\n'
    +'<b>三、空間需求</b>　{r|一般閱覽區 500 ㎡|空間名稱加面積，要放進定量表。}、{r|兒童閱覽區 200 ㎡|空間名稱加面積，要放進定量表。}、{r|樂齡教室 4 間，每間 60 ㎡|空間名稱加數量和面積，定量表寫 4 × 60 ＝ 240 ㎡。}、{r|多功能廳 250 ㎡（可容納 150 人）|括號裡的人數是在說明規模，整句是空間需求。}、共餐廚房與用餐區 120 ㎡、行政辦公 90 ㎡、社區咖啡 80 ㎡。其餘必要之服務空間請自行擬定。{h|地下層設汽車位 20 部、機車位 30 部，另設無障礙汽車位 1 部|車位數量是硬條件，少一部都會被對出來。}。\n'
    +'<b>四、設計要求</b>　建築應{i|與東側公園的活動相互延伸|描述希望的效果，沒有可以量化的數字，是議題。圖上要看得到做法。}，並{i|降低對北側住宅的壓迫與干擾|描述希望的效果，是議題。對策例如北側降低樓層、拉開距離。}。{h|多功能廳須可於夜間獨立開放|有「須」，而且會產生獨立入口和廁所，是硬條件。}。全區須符合無障礙環境。\n'
    +'<b>五、圖面要求</b>　{d|配置圖 1/400（含景觀及周邊環境）|圖名加比例，是圖面要求。}、{d|各層平面圖 1/200|圖名加比例，是圖面要求。}、{d|剖面圖 1/200（至少一向，標示樓高）|圖名加比例，是圖面要求；「標示樓高」也要記進圖面清單。}、主要立面圖 1/200、透視圖、建築計畫說明（含空間定性定量表）。\n'
    +'<b>六、配分</b>　建築計畫 30 分、建築設計 70 分。',
   list:['建蔽率 ≤ 50%（建築面積 ≤ 1,000 ㎡）','容積率 ≤ 160%（容積樓地板 ≤ 3,200 ㎡）','南側、西側各退縮 4 m 人行步道','地上不超過 4 層','東南角老榕樹保留（樹冠範圍內不蓋、不挖地下室）','地下汽車 20、機車 30、無障礙車位 1，有車道','多功能廳可夜間獨立開放（自己的入口和廁所）','全區無障礙（入口無高差或有坡道、電梯、無障礙廁所）'],
   ok:'第 8 條「全區須符合無障礙環境」題目裡沒有畫虛線，但它有「須」，一樣要抄進清單。'},
  {t:'社區運動暨活動中心',
   s:'某市擬於舊糖廠宿舍區旁興建社區運動暨活動中心。{i|本區 65 歲以上人口約佔 22%，傍晚常有長者在宿舍區散步|這個數字只是在描述現況，沒有要求你做到什麼。它提醒你要高齡友善，算議題。}，而{i|目前最近的公共游泳池在 4 公里外|4 公里是背景說明，不是距離規定，算議題（為什麼需要這座泳池）。}。基地內有一棟日式宿舍，居民多年來在此辦活動，{h|這棟宿舍已登錄為歷史建築，須原地保存並再利用為社區茶屋|藏在敘述句裡，但有「須」：不能拆、不能移，配置要繞開它。}。宿舍旁的{h|兩棵老芒果樹已列為受保護樹木|沒有「應」字，但「受保護」就是不能動：樹冠下不蓋、不開挖。}。\n'
    +'<b>一、基地</b>　矩形，東西向 60 m、南北向 30 m，面積 1,800 ㎡。北側臨 12 m 道路，西側為 5 層集合住宅，東側與南側為宿舍保存區。\n'
    +'<b>二、法規</b>　{h|建蔽率 60%|法規數字，建築面積 ≤ 1,080 ㎡。}、{h|容積率 200%|法規數字，總樓地板 ≤ 3,600 ㎡。}，{h|本案應設計至容積上限|這句把容積率從「上限」變成「目標」：總樓地板要做到約 3,600 ㎡，蓋太少也算沒做到題目要求。}。{h|臨道路側應退縮 6 m 留設廣場|有「應」和數字，北側 6 m 內不能蓋。}。\n'
    +'<b>三、空間需求</b>　{r|溫水游泳池 1 座（25 m、4 水道），含池岸約 800 ㎡|空間名稱加規模和面積，是空間需求。}、{r|綜合球場 1 面約 650 ㎡|空間名稱加面積，是空間需求。}，{h|球場淨高須達 9 m 以上，其上方不得設置其他使用空間|淨高和「上方不得」都會限制剖面：球場只能放頂樓或做成單層。}。{r|社區教室 3 間，每間 50 ㎡|空間名稱加數量和面積。}、{r|茶屋（即保存宿舍）約 120 ㎡|宿舍已經存在，但它還是題目要的空間，要列進定量表。}。游泳池開放至晚上 10 點，{h|其他空間晚上 6 點關閉，夜間須能分區管制|分時段開放會變成平面上的門禁分區：泳池要有自己的入口、更衣和廁所。}。\n'
    +'<b>四、設計要求</b>　{i|降低運動中心的燈光與噪音對西側住宅的影響|描述希望的效果，沒有數字，是議題。對策例如西側放安靜的空間或做緩衝植栽。}，並{i|讓保存宿舍與老樹成為社區的戶外客廳|描述希望的效果，是議題。圖上要看得到樹下的廣場和宿舍前的平台。}。\n'
    +'<b>五、圖面要求</b>　{d|配置圖 1/500（須含保存宿舍與保護樹木）|圖名加比例和要畫的內容，是圖面要求。}、{d|各層平面圖 1/200|圖名加比例。}、{d|剖面圖 1/200（須切過游泳池與球場）|圖名加比例，還指定了剖切位置。}、透視圖、計畫說明。',
   list:['建蔽率 ≤ 60%（建築面積 ≤ 1,080 ㎡）','容積率 200%，而且要做到上限（總樓地板約 3,600 ㎡）','北側臨路退縮 6 m 留廣場','日式宿舍原地保存，再利用為茶屋','兩棵老芒果樹保留（樹冠下不蓋、不開挖）','球場淨高 ≥ 9 m，上方不能再有樓層','泳池開到 22:00，其他空間 18:00 關閉，平面要能分區管制'],
   ok:'這份的陷阱是「設計至容積上限」：它讓容積率變成要做到的目標。22% 和 4 公里只是背景數字，不用抄進硬條件。'},
  {t:'國小校舍改建暨社區長照據點',
   s:'某直轄市近郊之國小因少子化，部分教室閒置，同時周邊社區高齡人口快速增加。市府擬拆除校園東側老舊校舍，新建一棟複合使用之建築物，{i|使校園與社區在不同時段共享設施|描述希望的效果，是議題。對策會落在出入口和分區管制上。}，並{i|兼顧學童安全與長者照顧品質|描述希望的效果，是議題。}。\n'
    +'<b>一、基地概況</b>　新建區位於校園東側，南北長 55 m、東西寬 32 m，面積 1,760 ㎡。東側臨 10 m 計畫道路，北側臨 6 m 巷道，西側為既有校舍及操場，南側為 5 層住宅。基地西南角有一{h|經市府列管之百年茄苳，其樹冠投影範圍內不得建築或開挖|「不得」加明確範圍，是硬條件。地下室也要避開。}。\n'
    +'<b>二、使用分區及法規</b>　學校用地，{h|建蔽率 50%|法規數字，建築面積 ≤ 880 ㎡。}，{h|容積率 150%|法規數字，總樓地板 ≤ 2,640 ㎡。}。{h|建築物高度不得超過 4 層樓|「不得」加數字。}，{h|臨計畫道路側應退縮 5 m|有「應」和數字，東側 5 m 內不能蓋。}。本區屬人行優先區，{h|車輛出入口不得設於 10 m 計畫道路|只寫「不得設於」，等於規定車道只能從北側 6 m 巷道進出。}。\n'
    +'<b>三、空間需求</b>\n（一）學校使用：{r|專科教室 4 間，每間 90 ㎡|空間名稱加數量和面積。}、{r|室內風雨球場 1 處約 600 ㎡|空間名稱加面積。}，{h|風雨球場假日應可供社區借用|有「應」：假日只開球場，就要有自己的出入口和能關起來的分區。}。\n'
    +'（二）長照使用：{r|日間照顧中心（服務 30 人），含活動室、午休室、沐浴間等，合計約 450 ㎡|空間名稱加規模和面積。30 人是在說明規模。}，{h|日照中心應設於地面層，並設獨立出入口|有「應」，直接決定日照中心的樓層和入口。}；{r|失智症團體家屋 1 單元（9 床）約 300 ㎡|空間名稱加規模和面積。}。{h|長照與學校使用之動線應明確區隔|有「應」，圖上要畫得出兩條分開的動線。}。\n'
    +'（三）共用：{r|社區共餐廚房約 100 ㎡，平日中午供學童及長者使用|空間名稱加面積；「供學童及長者使用」是在說明用途。}、{r|世代交流教室 1 間 80 ㎡，作為學童與長者共學之場所|空間名稱加面積。}。\n'
    +'（四）停車：{h|設汽車停車位 15 部（含無障礙 2 部）、復康巴士停車位 1 部|車位數量是硬條件。}。\n'
    +'<b>四、其他</b>　{i|建築設計應考量節能與通風|雖然有「應」，但沒有可以檢查的標準，是議題。在計畫說明寫對策，例如南北向開窗、深遮陽。}；{i|校園既有圍牆宜拆除，以開放空間與社區銜接|「宜」是建議，不是規定，算議題。}。\n'
    +'<b>五、圖面要求</b>　{d|配置圖 1/400（含校園既有建物）|圖名加比例和要畫的內容。}、{d|各層平面圖 1/200|圖名加比例。}、{d|剖面圖 1/200（須切過風雨球場）|圖名加比例和剖切位置。}、{d|計畫說明（含學校與長照動線分析圖）|指定要畫一張動線分析圖，是圖面要求。}。',
   list:['建蔽率 ≤ 50%（建築面積 ≤ 880 ㎡）','容積率 ≤ 150%（總樓地板 ≤ 2,640 ㎡）','地上不超過 4 層','東側臨路退縮 5 m','西南角茄苳的樹冠範圍內不蓋、不挖','車道只能從北側 6 m 巷道進出','日照中心在一樓，有自己的出入口','長照和學校的動線分開','風雨球場假日可借給社區（自己的出入口，可分區關閉）','汽車 15 部含無障礙 2 部，復康巴士 1 部'],
   ok:'正式考題會把議題和硬條件混在同一段。「應考量節能」有「應」卻沒有標準，是議題；「宜拆除」是建議，也是議題。'}
  ];
  var RE=/\{([hrid])\|([^|}]*)\|([^}]*)\}/g, pick=null, phs=[], why=[], L, out=$('#tagOut'), more=$('#tagMore');
  function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  function paint(p,c){p.className='ph'+(c?' c-'+c:''); p.dataset.u=c||''}
  function render(i){var b=B[i], n=0; why=[];
    $('#qtext').innerHTML='<b>題目：'+b.t+'</b><br>'+b.s.replace(RE,function(_,c,t,w){why.push(w); return '<span class="ph" role="button" tabindex="0" data-a="'+CAT[c]+'" data-k="'+(n++)+'">'+t+'</span>'}).replace(/\n/g,'<br>');
    phs=$$('#qtext .ph'); $('#tagN').textContent=phs.length; out.hidden=true; more.innerHTML='';
    phs.forEach(function(p){p.addEventListener('click',function(){
      if(!pick){out.hidden=false;out.className='verdict mid';out.textContent='先在上面選一種標記，再點文字。';return}
      paint(p,p.dataset.u===pick?'':pick); p.classList.remove('miss')});
      p.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();p.click()}})});
  }
  $$('#tagPick .pill').forEach(function(p){p.setAttribute('aria-pressed','false'); p.addEventListener('click',function(){pick=p.dataset.c; $$('#tagPick .pill').forEach(function(x){x.setAttribute('aria-pressed',x===p?'true':'false'); x.style.outline=x===p?'3px solid var(--ink)':''})})});
  $('#tagCheck').addEventListener('click',function(){
    var i=L.current(), b=B[i], un=phs.filter(function(p){return !p.dataset.u}).length, ok=0, wrong=[];
    phs.forEach(function(p){p.classList.remove('miss'); if(p.dataset.u===p.dataset.a)ok++; else if(p.dataset.u){p.classList.add('miss'); wrong.push(p)}});
    out.hidden=false; more.innerHTML='';
    if(un){out.className='verdict mid'; out.textContent='還有 '+un+' 處沒標。標完的 '+(phs.length-un)+' 處裡，對了 '+ok+' 處。'; return}
    var sc=Math.round(ok/phs.length*100), pass=L.done(i,sc), hard=phs.filter(function(p){return p.dataset.a==='hard'}).length;
    if(pass){out.className='verdict ok'; out.innerHTML='<b>'+ok+' / '+phs.length+(ok===phs.length?'，全對。':'，過關。')+'</b>硬條件有 '+hard+' 處。'+b.ok}
    else{out.className='verdict no'; out.innerHTML='<b>對了 '+ok+' / '+phs.length+'（'+sc+' 分，85 分過關）。</b>畫波浪底線的是標錯的。看下面的原因，再點一次就能改。'}
    if(wrong.length)more.innerHTML='<ul class="t">'+wrong.map(function(p){return '<li>「'+esc(p.textContent)+'」是<b>'+NAME[p.dataset.a]+'</b>：'+why[+p.dataset.k]+'</li>'}).join('')+'</ul>';
    if(pass){var d=el('div'); d.innerHTML='<p style="margin:12px 0 0"><b>這份題目的硬條件清單</b>（考場上抄在草稿紙角落，交卷前逐條打勾）</p><ul class="check">'+b.list.map(function(t){return '<li><label><input type="checkbox"><span>'+t+'</span></label></li>'}).join('')+'</ul>';
      more.appendChild(d);
      if(i<L.count-1){var nx=el('button',{type:'button','class':'go'},'下一小關 →'); nx.addEventListener('click',function(){L.next(); box.scrollIntoView({block:'start'})}); more.appendChild(nx)}
      else more.appendChild(el('p',{'class':'hint'},'三份題目都過了。正式考題就是第 3 份的長度，讀題請給自己完整 30 分鐘。'))}
  });
  $('#tagReset').addEventListener('click',function(){phs.forEach(function(p){paint(p,'')}); out.hidden=true; more.innerHTML=''});
  L=K.levels(box,{key:'g:tag',names:['例題','陷阱題','歷屆風格'],pass:85,start:render});
})();
})();
</script>
