<style>
/* 平面拼圖：塗格子，即時畫成平面圖 */
#gPlan .gp-brief{margin:0 0 6px;font-size:15px;line-height:1.6}
#gPlan .gp-pal{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
#gPlan .gp-pal button{display:inline-flex;align-items:center;gap:7px;background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:6px;padding:5px 10px;min-height:40px;font-size:14px;font-weight:600}
#gPlan .gp-pal button[aria-pressed="true"]{border-color:var(--bp-hi);box-shadow:0 0 0 2px var(--bp-hi)}
#gPlan .gp-pal i{width:16px;height:16px;border-radius:3px;border:1px solid var(--ink);display:inline-block;flex:none}
#gPlan .gp-wrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
#gPlan .gp-wrap.wide{grid-template-columns:minmax(0,1fr)}
#gPlan .gp-wrap.wide .gp-side{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:16px;align-items:start}
#gPlan .gp-fig{margin:0}
#gPlan .gp-fig svg{touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
#gPlan .gp-fig svg:focus{outline:3px solid var(--bp-hi);outline-offset:2px}
#gPlan .rules{grid-template-columns:minmax(0,1fr);margin-top:10px}
#gPlan .rules small{display:block;color:var(--warn);font-size:12.5px;line-height:1.45;margin-top:1px}
#gPlan .tally{font-size:13.5px}
#gPlan .gp-fa{fill:var(--blue-soft)}#gPlan .gp-fb{fill:var(--okbg)}#gPlan .gp-fc{fill:var(--warnbg)}#gPlan .gp-fd{fill:var(--badbg)}#gPlan .gp-fe{fill:var(--line);opacity:.6}#gPlan .gp-fp{fill:var(--paper)}
#gPlan .gp-cg{stroke:var(--line);stroke-width:.6;stroke-dasharray:1.5 3;fill:none}
#gPlan .gp-ghost{fill:none;stroke:var(--bp-hi);stroke-width:1.3;stroke-dasharray:5 3}
#gPlan svg .gp-gt{font-family:var(--f-data);font-size:9px;font-weight:600;fill:var(--bp-hi)}
#gPlan .gp-path{fill:none;stroke-width:1.6;stroke-dasharray:6 3}
#gPlan .gp-path.ok{stroke:var(--ok)}#gPlan .gp-path.no{stroke:var(--bad)}
#gPlan svg .gp-pt{font-family:var(--f-data);font-size:10px;font-weight:700;paint-order:stroke;stroke:var(--paper);stroke-width:3px}
#gPlan svg .gp-pt.ok{fill:var(--ok)}#gPlan svg .gp-pt.no{fill:var(--bad)}
#gPlan .gp-cur{fill:none;stroke:var(--bp-hi);stroke-width:2.5}
#gPlan svg .t-room,#gPlan svg .t-area,#gPlan svg .gp-lab{paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
#gPlan svg .gp-lab{font-family:var(--f-text);font-size:10px;fill:var(--mut)}
@media (max-width:700px){#gPlan .gp-wrap,#gPlan .gp-wrap.wide .gp-side{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){#gPlan svg .t-room{font-size:13px}#gPlan svg .t-area,#gPlan svg .t-dim,#gPlan svg .gp-lab{font-size:10.5px}}
</style>
<script>
(function(){

var K=window.KY; if(!K)return;
var $=K.$, $$=K.$$, el=K.el, hud=K.hud, svgPt=K.svgPt;
/* ============ GAME 02 平面拼圖：三小關，塗格子即時變成平面圖 ============ */
(function(){

  Array.prototype.slice.call(box.children).forEach(function(n){ if(!n.classList.contains('ghead')&&!n.classList.contains('gdesc'))box.removeChild(n) });

  var D=K.draw(true), PASS=90;
  function rep(v,n){var a=[];for(var i=0;i<n;i++)a.push(v);return a}

  /* 空間種類：名稱、填色、性質（open＝開放動線不做隔間牆；core＝服務核；split＝自動切成幾格一間；free＝無柱大空間） */
  var TY={

    st:['樓梯','fe',{core:1}], ev:['電梯','fe',{core:1}], wc:['廁所','fe',{core:1}],
    cl:['樂齡教室','fa',{split:[2,2]}], kid:['兒童閱覽','fb',{}], hall:['多功能廳','fa',{free:1}],
    cafe:['咖啡','fc',{}], din:['共餐','fb',{}], kit:['廚房','fd',{}],
    rm:['寢室','fa',{split:[1,1]}], lng:['交誼廳','fc',{}], sv:['洗衣茶水','fd',{}],
    x:['橡皮擦','',{}]
  };
  var SW={fa:'var(--blue-soft)',fb:'var(--okbg)',fc:'var(--warnbg)',fd:'var(--badbg)',fe:'var(--line)',fp:'var(--paper)'};
  function rows(a){var o=[]; a.forEach(function(s){o=o.concat(s.split(/\s+/))}); return o}

  var LV=[
   {nm:'二樓', cw:rep(4,6), rh:rep(4,8), ax:[0,2,4,6], ay:[0,2,4,6,8], S:13, ox:96, oy:100, vw:486, wide:false, cut:3,
    types:['co','st','ev','wc','cl','kid','sc'], title:'二樓平面圖',
    brief:'<b>二樓，24 × 32 m，一格 4 × 4 m。</b>放四間樂齡教室、兒童閱覽和故事角，再加兩座樓梯、電梯、廁所和走廊。右邊（東）是社區公園。',
    ctx:{n:'北側 4 層住宅',w:'西側 8 m 道路',s:'南側 15 m 道路',e:'東側 社區公園'},
    demo:rows(['st co cl cl cl cl','st co cl cl cl cl','wc co co co co co','wc co cl cl cl cl','wc co cl cl cl cl','ev co sc kid kid kid','st co kid kid kid kid','st co kid kid kid kid']),
    tally:[['cl','目標 240'],['kid','目標 200'],['sc',''],['co',''],['wc','']]},
   {nm:'一樓', cw:rep(4,6), rh:rep(4,8), ax:[0,2,4,6], ay:[0,2,4,6,8], S:13, ox:96, oy:100, vw:486, wide:false, cut:3,
    types:['co','lob','st','ev','wc','hall','cafe','din','kit'], title:'一樓平面圖',
    brief:'<b>一樓，同一塊 24 × 32 m。</b>黃色虛線是二樓樓梯和電梯的位置，一樓要疊在同一格。南邊 15 m 路是主入口；多功能廳晚上要能自己開門；廚房要有後勤進貨的門。',
    ctx:{n:'北側 4 層住宅',w:'西側 8 m 道路',s:'南側 15 m 道路',e:'東側 社區公園'},
    demo:rows(['st co kit kit din cafe','st co din din din cafe','wc co din din din cafe','wc co co co cafe cafe','wc lob hall hall hall hall','ev lob hall hall hall hall','st lob hall hall hall hall','st lob hall hall hall hall']),
    tally:[['hall','目標 250'],['din','目標 120'],['cafe','目標 80'],['kit',''],['lob',''],['co','']]},
   {nm:'宿舍層', cw:rep(4,10), rh:[7,2.4,7], ax:[0,2,4,6,8,10], ay:[0,1,2,3], S:14, ox:96, oy:100, vw:720, wide:true,
    types:['co','st','ev','rm','lng','sv'], title:'宿舍標準層平面圖',
    brief:'<b>換一棟：學生宿舍的標準層，40 × 16.4 m。</b>一格寢室 4 × 7 m。中間那排 2.4 m 是走廊的位置。每間寢室要有窗，走到樓梯不能太遠。',
    ctx:{n:'北側 鄰棟',s:'南側 中庭'},
    demo:rows(['st rm rm rm rm rm rm rm sv st','co co co co co co co co co co','ev rm rm rm lng lng rm rm rm rm']),
    tally:[['rm','至少 14 間'],['lng',''],['sv',''],['co','']]}
  ];
  var REF=(function(){var d=LV[0].demo,o={}; d.forEach(function(t,i){ if(t==='st'||t==='ev')o[i]=t }); return o})(); /* 二樓服務核（一樓要對齊） */

  /* ---------- DOM ---------- */
  var brief=el('p',{'class':'gp-brief'}), pal=el('div',{'class':'gp-pal',role:'group','aria-label':'空間種類'}),
      wrap=el('div',{'class':'gp-wrap'}), fig=el('figure',{'class':'gp-fig'}),
      side=el('div',{'class':'gp-side'}), tally=el('ul',{'class':'tally'}), rul=el('ul',{'class':'rules'}),
      bar=el('div',{'class':'frow'}), msg=el('p',{'class':'verdict mid',hidden:''});
  fig.innerHTML='<svg viewBox="0 0 486 640" role="img" tabindex="0" aria-label="平面圖。用滑鼠或手指拖曳塗色；鍵盤可用方向鍵移動、空白鍵塗色。"></svg>';
  var svg=fig.firstChild;
  side.appendChild(tally); side.appendChild(rul); wrap.appendChild(fig); wrap.appendChild(side);
  bar.innerHTML='<button class="ghost" type="button" data-a="clear">清空</button><button class="ghost" type="button" data-a="demo">看一種解法</button><button class="go" type="button" data-a="next" hidden>下一小關 →</button>';
  [brief,pal,wrap,bar,msg].forEach(function(n){box.appendChild(n)});
  var nextBtn=$('[data-a=next]',bar);

  /* ---------- 狀態 ---------- */
  var lv, C, R, N, cells, xm, ym, xs, ys, S, ox, oy, W, H, VW, VH, pick='co', demo=false, painting=false, cur=0, kcur=0, focused=false, RM, L;

  function nb(i){var r=(i/C)|0,c=i%C,o=[]; if(r>0)o.push(i-C); if(r<R-1)o.push(i+C); if(c>0)o.push(i-1); if(c<C-1)o.push(i+1); return o}
  function cnt(t){var n=0; cells.forEach(function(x){if(x===t)n++}); return n}
  function cellsOf(t){var o=[]; cells.forEach(function(x,i){if(x===t)o.push(i)}); return o}
  function comps(pred){var seen={},out=[]; for(var i=0;i<N;i++){ if(seen[i]||!pred(i))continue; var q=[i],cp=[]; seen[i]=1; while(q.length){var k=q.pop(); cp.push(k); nb(k).forEach(function(n){if(!seen[n]&&pred(n)){seen[n]=1;q.push(n)}})} out.push(cp)} return out}
  function compsOf(t){return comps(function(i){return cells[i]===t})}
  function isOpen(t){return t!=='x'&&!!TY[t][2].open}
  function isCirc(i){return isOpen(cells[i])}
  function sideOf(i){var r=(i/C)|0,c=i%C,s=''; if(r===0)s+='n'; if(r===R-1)s+='s'; if(c===0)s+='w'; if(c===C-1)s+='e'; return s}
  function touches(list,sides){return list.some(function(i){var s=sideOf(i); return sides.split('').some(function(k){return s.indexOf(k)>=0})})}
  function ctr(i){var r=(i/C)|0,c=i%C; return [(xm[c]+xm[c+1])/2,(ym[r]+ym[r+1])/2]}
  function areaOf(list){return list.reduce(function(a,i){var r=(i/C)|0,c=i%C; return a+(xm[c+1]-xm[c])*(ym[r+1]-ym[r])},0)}
  function gap(a,b){var m=99; a.forEach(function(i){b.forEach(function(j){var d=Math.abs(((i/C)|0)-((j/C)|0))+Math.abs(i%C-j%C); if(d<m)m=d})}); return m}
  function cmid(list){var x=0,y=0; list.forEach(function(i){var p=ctr(i); x+=p[0]; y+=p[1]}); return [x/list.length,y/list.length]}

  /* 合併同種相鄰格子成房間；有 split 的種類再切成固定大小 */
  function buildRooms(){
    var of=rep(-1,N), rooms=[];
    for(var i=0;i<N;i++){ if(of[i]!==-1||cells[i]==='x')continue;
      var t=cells[i], comp=[], q=[i], seen={}; seen[i]=1;
      while(q.length){var k=q.pop(); comp.push(k); nb(k).forEach(function(n){ if(!seen[n]&&cells[n]===t){seen[n]=1;q.push(n)} })}
      var sp=TY[t][2].split;
      if(!sp){ var id=rooms.length; rooms.push({t:t,cells:comp}); comp.forEach(function(k){of[k]=id}); continue }
      comp.sort(function(a,b){return a-b}); var inC={}, done={}; comp.forEach(function(k){inC[k]=1});
      comp.forEach(function(k){ if(done[k])return; var r=(k/C)|0, c=k%C, sizes=[[sp[0],sp[1]],[sp[0],1],[1,sp[1]],[1,1]];
        for(var s=0;s<sizes.length;s++){ var bw=sizes[s][0], bh=sizes[s][1], blk=[], ok=true;
          for(var dr=0;dr<bh&&ok;dr++)for(var dc=0;dc<bw;dc++){ var rr=r+dr, cc=c+dc, j=rr*C+cc; if(cc>=C||rr>=R||!inC[j]||done[j]){ok=false;break} blk.push(j) }
          if(ok){ var id2=rooms.length; rooms.push({t:t,cells:blk}); blk.forEach(function(j){done[j]=1;of[j]=id2}); break } } });
    }
    return {rooms:rooms,of:of};
  }
  function roomsOf(t){return RM.rooms.filter(function(r){return r.t===t})}

  /* ---------- 規則 ---------- */
  function fillRule(p){var b=cnt('x'); return {t:'全部 '+N+' 格都填滿',ok:b===0,p:p,why:b+' 格還空著。'}}
  function linkRule(p,txt){
    var circ=comps(isCirc), bad=null;
    RM.rooms.forEach(function(rm){ if(bad||isOpen(rm.t))return; if(!rm.cells.some(function(i){return nb(i).some(isCirc)}))bad=rm });
    var ok=circ.length===1&&!bad, why=!circ.length?'還沒有走廊。':circ.length>1?'走廊斷成 '+circ.length+' 段，要連成一條。':bad?'有一間「'+TY[bad.t][0]+'」碰不到走廊，進不去。':'';
    return {t:txt,ok:ok,p:p,why:why};
  }
  function stairRule(p){
    var st=compsOf('st'), why='', ok=false;
    if(st.length!==2)why='現在有 '+st.length+' 座樓梯，要剛好兩座。';
    else if(st[0].length<2||st[1].length<2)why='每座樓梯要 2 格（4 × 8 m），1 格放不下梯段和平台。';
    else{var g=gap(st[0],st[1]); if(g<4)why='兩座樓梯只隔 '+g+' 格，要分在兩端，隔 4 格以上。'; else ok=true}
    return {t:'樓梯剛好兩座，每座 2 格，分在兩端（相隔 4 格以上）',ok:ok,p:p,why:why};
  }
  function rules1(){
    var o=[fillRule(10), stairRule(15)];
    var ev=cnt('ev'), wc=cnt('wc');
    o.push({t:'電梯 1 格、廁所 2 到 3 格',ok:ev===1&&wc>=2&&wc<=3,p:10,why:ev!==1?'電梯現在 '+ev+' 格，一座就夠。':'廁所現在 '+wc+' 格，要 2 到 3 格（男、女、無障礙）。'});
    var cl=roomsOf('cl'), full=cl.filter(function(r){return r.cells.length===4}).length, frag=cl.length-full;
    o.push({t:'樂齡教室 4 間，每間 2 × 2 格（一個 8 × 8 m 柱跨）',ok:full===4&&frag===0,p:20,why:'現在 '+full+' 間完整教室'+(frag?'，另有 '+frag+' 塊零碎的教室格':'')+'。一間教室剛好佔一個柱跨最好排。'});
    var kid=compsOf('kid'), kn=cnt('kid'), sc=cellsOf('sc'), scAdj=sc.length&&sc.some(function(i){return nb(i).some(function(n){return cells[n]==='kid'})});
    o.push({t:'兒童閱覽 11 到 14 格連成一間，故事角 1 到 3 格貼著它',ok:kid.length===1&&kn>=11&&kn<=14&&sc.length>=1&&sc.length<=3&&scAdj,p:15,
      why:kid.length>1?'兒童閱覽分成 '+kid.length+' 塊，要連成一間。':(kn<11||kn>14)?'兒童閱覽現在 '+kn+' 格（'+kn*16+' ㎡），目標 200 ㎡ 左右。':(sc.length<1||sc.length>3)?'故事角現在 '+sc.length+' 格，要 1 到 3 格。':'故事角要貼著兒童閱覽，小朋友才走得過去。'});
    o.push(linkRule(20,'走廊和故事角連成一條動線，每個空間都碰得到'));
    var bad=[]; for(var r=0;r<R;r++){var t=cells[r*C+C-1]; if(t==='st'||t==='ev'||t==='wc')bad.push(TY[t][0])}
    o.push({t:'東側面向公園那一排不放樓梯、電梯、廁所',ok:!bad.length&&cnt('x')<N,p:10,why:bad.length?'東側有'+bad.filter(function(v,i,a){return a.indexOf(v)===i}).join('、')+'，把最好的景擋掉了。':'先開始塗。'});
    return o;
  }
  function rules2(){
    var o=[fillRule(10)], miss=0, extra=0;
    for(var i=0;i<N;i++){ if(REF[i]&&cells[i]!==REF[i])miss++; if(!REF[i]&&(cells[i]==='st'||cells[i]==='ev'))extra++ }
    o.push({t:'樓梯、電梯和二樓疊在同一格（黃色虛線）',ok:!miss&&!extra,p:15,why:miss?'還有 '+miss+' 格沒對齊。服務核上下對齊，結構和管道才通得過去。':'多了 '+extra+' 格樓梯或電梯，二樓沒有它們。'});
    var lob=cellsOf('lob');
    o.push({t:'門廳至少 3 格，碰到南側外牆（主入口面向 15 m 道路）',ok:lob.length>=3&&touches(lob,'s'),p:15,why:lob.length<3?'門廳現在 '+lob.length+' 格，太小。':'門廳沒有碰到南側外牆，主入口開不出去。'});
    var hall=compsOf('hall'), hn=cnt('hall'), hok=false, hw='';
    if(hall.length!==1)hw=hall.length?'多功能廳分成 '+hall.length+' 塊，要一整間。':'還沒有多功能廳。';
    else if(hn<15||hn>16)hw='多功能廳現在 '+hn+' 格（'+hn*16+' ㎡），目標 250 ㎡ 是 15 到 16 格。';
    else{var h=hall[0], r0=99,r1=-1,c0=99,c1=-1; h.forEach(function(i){var r=(i/C)|0,c=i%C; r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c)});
      var bw=c1-c0+1, bh=r1-r0+1;
      if(bw*bh!==hn)hw='多功能廳不是完整的矩形，大跨距的梁只能跨矩形。';
      else if(Math.min(bw,bh)<3)hw='多功能廳太細長，短邊至少 3 格（12 m）才好用。';
      else if(!touches(h,'sw'))hw='多功能廳沒有碰到西側或南側外牆，晚上開不了獨立入口。';
      else hok=true}
    o.push({t:'多功能廳 15 到 16 格的完整矩形，短邊 3 格以上，碰到西或南側外牆（夜間入口）',ok:hok,p:20,why:hw});
    var din=compsOf('din'), dn=cnt('din'), kit=cellsOf('kit'), kAdj=kit.some(function(i){return nb(i).some(function(n){return cells[n]==='din'})});
    o.push({t:'共餐 7 到 8 格；廚房 2 格以上貼著共餐，並碰到北或西側外牆（後勤進貨）',ok:din.length===1&&dn>=7&&dn<=8&&kit.length>=2&&kAdj&&touches(kit,'nw'),p:15,
      why:din.length!==1?'共餐要連成一間。':(dn<7||dn>8)?'共餐現在 '+dn+' 格（'+dn*16+' ㎡），目標 120 ㎡。':kit.length<2?'廚房至少 2 格。':!kAdj?'廚房要貼著共餐，出餐才順。':'廚房沒有碰到北側或西側外牆，貨車送不進來。'});
    var cafe=cellsOf('cafe');
    o.push({t:'咖啡 4 到 6 格，碰到東側公園',ok:cafe.length>=4&&cafe.length<=6&&touches(cafe,'e'),p:10,why:(cafe.length<4||cafe.length>6)?'咖啡現在 '+cafe.length+' 格，目標 80 ㎡ 是 5 格左右。':'咖啡沒有碰到東側，看不到公園。'});
    o.push(linkRule(15,'走廊和門廳連成一片，每個空間都碰得到'));
    return o;
  }
  function travel(){
    var res=[];
    RM.rooms.forEach(function(rm){ if(rm.t!=='rm')return; var s=rm.cells[0], dist=rep(Infinity,N), prev=rep(-1,N), used=rep(false,N), end=-1; dist[s]=0;
      for(;;){ var u=-1,b=Infinity; for(var i=0;i<N;i++)if(!used[i]&&dist[i]<b){b=dist[i];u=i} if(u<0)break; used[u]=true;
        if(cells[u]==='st'){end=u;break} if(u!==s&&!isCirc(u))continue;

  function refresh(){

    var sc=0; rul.innerHTML=''; rs.forEach(function(x){ if(x.ok)sc+=x.p; rul.appendChild(el('li',x.ok?{'class':'ok'}:null,'<i>'+(x.ok?'✓':'✗')+'</i><span>'+x.t+(x.ok||!x.why?'':'<small>'+x.why+'</small>')+'</span><span class="pt">'+x.p+'</span>')) });
    if(cnt('x')===N)sc=0;
    tally.innerHTML=''; lv.tally.forEach(function(q){var n=cnt(q[0]), a=Math.round(areaOf(cellsOf(q[0]))), extra=q[0]==='rm'?roomsOf('rm').length+' 間':q[0]==='cl'?roomsOf('cl').filter(function(r){return r.cells.length===4}).length+' 間':n+' 格';
      tally.appendChild(el('li',null,'<span>'+TY[q[0]][0]+'</span><b>'+extra+' · '+a+' ㎡'+(q[1]?'（'+q[1]+'）':'')+'</b>'))});
    hud(box,sc); return sc;
  }
  function commit(){ /* 一筆畫完才計分 */
    var sc=refresh(); if(demo)return;
    var ok=L.done(cur,sc); if(!ok)K.stampOff(box);
    nextBtn.hidden=!(L.best(cur)>=PASS&&cur<LV.length-1);
    if(ok){msg.hidden=false; msg.className='verdict ok'; msg.innerHTML='<b>過關，'+sc+' 分。</b>'+['服務核在兩端、教室一跨一間，這就是標準層的排法。','服務核對齊二樓，三種入口各在該在的那一面。','雙邊走廊加兩端樓梯，宿舍、旅館、病房都是這個骨架。'][cur]+(cur<LV.length-1?'按「下一小關」繼續。':'')}
    else msg.hidden=true;
  }
  function cellAt(p){ var x=(p.x-ox)/S, y=(p.y-oy)/S, c=-1, r=-1, k; for(k=0;k<C;k++)if(x>=xm[k]&&x<xm[k+1])c=k; for(k=0;k<R;k++)if(y>=ym[k]&&y<ym[k+1])r=k; return (c<0||r<0)?-1:r*C+c }
  function paint(i){ if(i<0||cells[i]===pick)return false; cells[i]=pick; refresh(); return true }
  svg.addEventListener('pointerdown',function(e){ if(e.button>0)return; e.preventDefault(); try{svg.setPointerCapture(e.pointerId)}catch(_){}; painting=true; var i=cellAt(svgPt(svg,e)); if(i>=0)kcur=i; paint(i) });
  svg.addEventListener('pointermove',function(e){ if(!painting)return; paint(cellAt(svgPt(svg,e))) });
  function up(){ if(!painting)return; painting=false; commit() }
  svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up); window.addEventListener('pointerup',up);
  svg.addEventListener('focus',function(){focused=true; render()}); svg.addEventListener('blur',function(){focused=false; render()});
  svg.addEventListener('keydown',function(e){ var r=(kcur/C)|0, c=kcur%C, k=e.key;
    if(k==='ArrowLeft')c=Math.max(0,c-1); else if(k==='ArrowRight')c=Math.min(C-1,c+1); else if(k==='ArrowUp')r=Math.max(0,r-1); else if(k==='ArrowDown')r=Math.min(R-1,r+1);
    else if(k===' '||k==='Enter'){e.preventDefault(); if(paint(kcur))commit(); return} else return;
    e.preventDefault(); kcur=r*C+c; render() });
  bar.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b)return; var a=b.dataset.a;
    if(a==='clear'){ cells=rep('x',N); demo=false; K.stampOff(box); msg.hidden=true; refresh() }
    else if(a==='demo'){ cells=lv.demo.slice(); demo=true; K.stampOff(box); refresh(); msg.hidden=false; msg.className='verdict mid'; msg.innerHTML='<b>這是其中一種解法，不計分。</b>看完按「清空」，自己塗一次才算。' }
    else if(a==='next')L.next() });

  function start(i){
    cur=i; lv=LV[i]; C=lv.cw.length; R=lv.rh.length; N=C*R; cells=rep('x',N); demo=false; kcur=0; TR=[];
    xm=[0]; lv.cw.forEach(function(w){xm.push(xm[xm.length-1]+w)}); ym=[0]; lv.rh.forEach(function(h){ym.push(r2(ym[ym.length-1]+h))});
    S=lv.S; ox=lv.ox; oy=lv.oy; W=xm[C]*S; H=ym[R]*S; VW=lv.vw; VH=Math.ceil(oy+H+124);
    xs=xm.map(function(m){return ox+m*S}); ys=ym.map(function(m){return oy+m*S});
    svg.setAttribute('viewBox','0 0 '+VW+' '+VH); wrap.classList.toggle('wide',!!lv.wide);
    brief.innerHTML=lv.brief;
    if(lv.types.indexOf(pick)<0)pick=lv.types[0];
    pal.innerHTML=''; lv.types.concat(['x']).forEach(function(t){ var b=el('button',{type:'button','aria-pressed':t===pick?'true':'false','data-t':t},'<i style="background:'+(t==='x'?'transparent':SW[TY[t][1]])+'"></i>'+TY[t][0]); pal.appendChild(b);
      b.addEventListener('click',function(){pick=t; $$('button',pal).forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')})}) });
    msg.hidden=true; nextBtn.hidden=!(L&&L.best(i)>=PASS&&i<LV.length-1);
    refresh();
  }
  L=K.levels(box,{key:'g:plan',names:LV.map(function(l){return l.nm}),pass:PASS,start:start});
  nextBtn.hidden=!(L.best(cur)>=PASS&&cur<LV.length-1);
})();
})();
</script>
