<script>
/* figsA：M2、M5 講義圖（建蔽率容積率、基地現況、二層平面、停車模組），用 K.draw 在載入時畫出 */
(function(){
"use strict";
var K=window.KY; if(!K||!K.draw)return;
var D=K.draw(false);
function r(n){return Math.round(n*100)/100}
function T(x,y,s,cls,anc,rot){return '<text x="'+r(x)+'" y="'+r(y)+'" text-anchor="'+(anc||'middle')+'" class="'+cls+'"'+(rot?' transform="rotate('+rot+' '+r(x)+' '+r(y)+')"':'')+'>'+s+'</text>'}
function P(d,cls,st){return '<path d="'+d+'" class="'+cls+'"'+(st?' style="'+st+'"':'')+'/>'}
function Rc(x,y,w,h,cls,st){return '<rect x="'+r(x)+'" y="'+r(y)+'" width="'+r(w)+'" height="'+r(h)+'" class="'+cls+'"'+(st?' style="'+st+'"':'')+'/>'}
function soft(s,op){return '<g style="opacity:'+(op||.35)+'">'+s+'</g>'}
function put(id,svg){var e=document.getElementById(id); if(e)e.innerHTML=svg}

/* ========== 1. 建蔽率與容積率：配置圖＋剖面圖 ========== */
(function(){

  s+=Rc(bx,by,bw,bh,'lw-out')+Rc(bx+pp,by+pp,bw-2*pp,bh-2*pp,'lw-thin');
  s+=Rc(px,py,sw,sh,'lw-site');
  s+=D.tree(px+sw-12,py+sh-12,10);
  s+=T(bx+bw/2,by+bh/2-12,'建築面積','t-room fa-h')+T(bx+bw/2,by+bh/2+2,'24 × 32 ＝ 768 ㎡','t-area fa-h')+T(bx+bw/2,by+bh/2+16,'RC 3F / B1','t-dim fa-h');
  s+=T(px+sw/2-6,by+bh+22,'法定空地','t-room fa-h')+T(px+sw/2-6,by+bh+35,'2,000 − 768 ＝ 1,232 ㎡','t-area fa-h');

  s+=D.title(px+sw/2,322,'配置圖（屋頂平面）',null);

  // 剖面
  var q=9, PLw=316, W=352, E=W+24*q, PLe=PLw+40*q, GL=220;
  var F2=GL-4.5*q, F3=F2-3.6*q, RF=F3-3.6*q, PT=RF-1.1*q, B1=GL+3.6*q, BB=B1+5.6, ST=3.6, wt=3.6;
  // 計入容積的樓層底色
  [[F2,GL],[F3,F2],[RF,F3]].forEach(function(f){s+=Rc(W,f[0]+ST,E-W,f[1]-f[0]-ST,'f-soft')});
  // 土壤

  s+=P('M300 '+GL+' H'+(W-2.5)+' M'+(E+2.5)+' '+GL+' H700','lw-out');
  // 看到的柱（未剖到）
  var cols=[W+8*q,W+16*q];
  [[GL,B1],[F2,GL],[F3,F2],[RF,F3]].forEach(function(f){cols.forEach(function(cx){s+=Rc(cx-3.6,f[0]+ST+6.3,7.2,f[1]-f[0]-ST-6.3,'lw-vis')})});
  // 剖到的樓板與梁
  [GL,F2,F3,RF].forEach(function(y){s+=Rc(W,y,E-W,ST,'poche'); cols.forEach(function(cx){s+=Rc(cx-2.5,y+ST,5,6.3,'poche')})});

  // 地下室外牆
  s+=Rc(W-5,GL,5,BB-GL,'poche')+Rc(E,GL,5,BB-GL,'poche');
  // 地上外牆：窗台、梁、窗玻璃
  [[F2,GL],[F3,F2],[RF,F3]].forEach(function(f){var top=f[0],bot=f[1],sill=bot-0.9*q,head=top+ST+0.7*q;
    [W,E].forEach(function(x){s+=Rc(x-wt/2,sill,wt,bot-sill,'poche')+Rc(x-wt/2,top,wt,head-top,'poche')+P('M'+r(x-1)+' '+r(head)+' V'+r(sill)+' M'+r(x+1)+' '+r(head)+' V'+r(sill),'lw-thin')})});
  // 女兒牆
  s+=Rc(W-wt/2,PT,wt,RF-PT,'poche')+Rc(E-wt/2,PT,wt,RF-PT,'poche');
  // 樓層名稱

  s+=D.level(lx,B1,'<tspan class="fa-h">B1FL −3600</tspan>');
  // 樓高尺寸鏈（西側）
  s+=D.dimChain([B1,GL,F2,F3,RF],338,['3600','4500','3600','3600'],true);
  // 境界線
  [PLw,PLe].forEach(function(x){s+=P('M'+x+' 196 V236','lw-site')+T(x,190,'PL','t-dim')});

})();

  s+=D.dimChain([y0,by,by+bh,y1],x1,['3','43','4'],true,-14)+D.dim(x1,y0,x1,y1,'50 m',-32);
  // 圖例、指北、比例尺
  s+=T(110,300,'西側街廓','t-dim');
  s+=D.north(110,64,16);
  s+=P('M30 150 H70','lw-site')+T(78,153,'基地境界線','t-dim','start');
  s+=P('M30 172 H70','lw-setb')+T(78,175,'退縮線','t-dim','start');

(function(){
  var S=14, x0=210, y0=86, s='';
  function X(m){return x0+m*S} function Y(m){return y0+m*S}
  var EXT=5, INT=3;

  // 內牆
  s+=wallV(5.6,0,32,INT);
  [6.5,10.5,14.5,17.3,19.8,25.5].forEach(function(y){s+=wallH(y,0,5.6,INT)});
  s+=wallV(3.1,17.3,19.8,INT);
  s+=wallV(8,0,7.5,INT)+wallV(8,12,32,INT);
  s+=wallH(7.5,8,24,INT)+wallH(12,8,24,INT)+wallH(19.5,8,24,INT);
  s+=wallV(16,0,7.5,INT)+wallV(16,12,19.5,INT);
  // 窗

  wh(0,5.9,7.7); wh(0,9,15); wh(0,17,23); wh(32,5.9,7.7); wh(32,9,15); wh(32,17,23);

    o+=Rc(X(x+fw),Y(f0),0.2*S,(f1-f0)*S,'lw-vis');
    var bm=(f0+f1)/2; o+=P('M'+r(X(x))+' '+r(Y(bm+0.6))+' L'+r(X(x+w*0.45))+' '+r(Y(bm-0.1))+' l3 -5 l-2 9 L'+r(X(x+w))+' '+r(Y(bm-0.6)),'lw-vis');
    var ax=x+fw/2, a0=landTop?f1-0.3:f0+0.3, a1=landTop?f0-L/2:f1+L/2, sg=landTop?-1:1;
    o+='<circle cx="'+r(X(ax))+'" cy="'+r(Y(a0))+'" r="1.8" class="poche"/>'+P('M'+r(X(ax))+' '+r(Y(a0))+' V'+r(Y(a1))+' H'+r(X(x+w-fw/2))+' V'+r(Y(a1-sg*(L/2+0.8))),'lw-thin');
    var ty=Y(a1-sg*(L/2+0.8)); o+=P('M'+r(X(x+w-fw/2)-3)+' '+r(ty+sg*5)+' L'+r(X(x+w-fw/2))+' '+r(ty)+' L'+r(X(x+w-fw/2)+3)+' '+r(ty+sg*5),'lw-thin');
    o+=T(X(ax),Y(a0)+(landTop?11:-5),'UP','t-dim fa-h'); return o}
  s+=stair(0.15,0.15,3.3,4.85,true)+stair(0.15,27,3.3,4.85,false);
  s+=P('M'+X(0)+' '+Y(5)+' H'+X(3.5)+' M'+X(0)+' '+Y(27)+' H'+X(3.5),'lw-thin');

  function stalls(y,n){var o=''; for(var i=0;i<n;i++){var yy=y+i*1.2; o+=wc(0.05,yy+0.6); o+=P('M'+X(0)+' '+r(Y(yy+1.2))+' H'+X(1.5),'lw-vis')}
    o+=P('M'+X(1.5)+' '+Y(y)+' V'+r(Y(y+n*1.2)),'lw-vis'); return o}

  s+=D.door(X(8),Y(13),15.4,'v',1,1,INT)+D.door(X(17),Y(12),15.4,'h',1,1,INT);
  s+=D.door(X(8),Y(20.4),15.4,'v',1,1,INT)+D.door(X(8),Y(29.4),15.4,'v',1,1,INT);
  // 兒童閱覽家具
  s+=Rc(X(9.5),Y(29.6),4.6*S,0.6*S,'lw-thin')+Rc(X(17.5),Y(29.6),4.6*S,0.6*S,'lw-thin');
  [[11.5,21.8],[20.5,21.8]].forEach(function(c){s+='<circle cx="'+X(c[0])+'" cy="'+Y(c[1])+'" r="'+(0.7*S)+'" class="lw-thin"/>'});
  // 柱
  [0,8,16,24].forEach(function(cx){[0,8,16,24,32].forEach(function(cy){s+=D.col(X(cx),Y(cy),11)})});
  // 室名

  s+=D.room(X(12),Y(14.7),'樂齡教室 3','8 × 7.5 ＝ 60 ㎡')+D.room(X(20),Y(14.7),'樂齡教室 4','8 × 7.5 ＝ 60 ㎡');
