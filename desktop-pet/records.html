<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>修煉紀錄</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { background: #FBF3DC; min-height: 100%; }
  body {
    background: #FBF3DC;
    background-image: radial-gradient(circle at 20% 6%, rgba(255,255,255,.6), transparent 55%),
                      radial-gradient(circle at 90% 95%, rgba(190,160,110,.18), transparent 55%);
    color: #4A3A2A; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    padding: 14px 16px 16px; font-size: 15px; user-select: none; overflow-x: hidden;
  }
  .kai { font-family: "DFKai-SB", "KaiTi", serif; }

  /* 1. 境界標題 */
  .top { display: flex; align-items: center; gap: 12px; }
  .bigseal {
    flex: none; width: 46px; height: 46px; border: 2.5px solid #E5484D; border-radius: 8px;
    color: #E5484D; background: rgba(229,72,77,.07); transform: rotate(-8deg);
    display: flex; align-items: center; justify-content: center;
    font-family: "DFKai-SB", "KaiTi", serif; font-weight: bold; font-size: 15px; line-height: 1.05;
    text-align: center; letter-spacing: 1px;
  }
  .realm { font-family: "DFKai-SB", "KaiTi", serif; font-size: 32px; font-weight: bold; letter-spacing: 3px; line-height: 1.1; }
  .sub { font-size: 13px; color: #8A7658; margin-top: 2px; }
  .xpline { display: flex; justify-content: space-between; align-items: baseline; margin: 12px 0 5px; }
  .xpline b { font-size: 20px; }
  .xpline .of { color: #8A7658; font-size: 14px; }
  .bar { height: 14px; border-radius: 7px; background: #EADFC2; border: 1px solid #D8C69C; overflow: hidden; }
  .fill { height: 100%; border-radius: 7px; background: linear-gradient(90deg, #F5B82E, #F8CF5E); width: 0; transition: width .5s; }
  .left { margin-top: 6px; font-size: 15px; color: #2F8A6C; font-weight: bold; }

  h2 {
    font-family: "DFKai-SB", "KaiTi", serif; font-size: 19px; margin: 16px 0 8px;
    border-top: 1px dashed #C9B48A; padding-top: 12px;
  }

  /* 2. 修煉成果 */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .tile {
    background: #FFFBEF; border: 1px solid #E2D2AE; border-radius: 10px;
    padding: 8px 4px 7px; text-align: center; min-width: 0;
  }
  .tile .n { font-size: 22px; font-weight: bold; line-height: 1.15; word-break: keep-all; }
  .tile .n small { font-size: 12px; font-weight: normal; color: #8A7658; margin: 0 1px; }
  .tile .l { font-size: 12px; color: #8A7658; margin-top: 3px; }

  /* 3. 九重境界 */
  ol { list-style: none; margin: 0; padding: 0; }
  ol li {
    display: flex; align-items: center; gap: 10px; padding: 7px 9px; margin-bottom: 5px;
    border-radius: 9px; border: 1px solid #E2D2AE; background: #FFFBEF;
  }
  ol li .mk {
    flex: none; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: bold; border: 2px solid #C9B48A; color: #B5A27E; background: #F4ECD6;
  }
  ol li.got .mk { border-color: #C9901A; background: #F5B82E; color: #fff; }
  ol li .bd { flex: 1; min-width: 0; }
  ol li .nm { font-family: "DFKai-SB", "KaiTi", serif; font-size: 17px; font-weight: bold; }
  ol li .nd { font-size: 12px; color: #8A7658; margin-left: 6px; font-family: "Microsoft JhengHei", sans-serif; font-weight: normal; }
  ol li .ul { font-size: 13px; color: #6B5A44; line-height: 1.35; word-break: break-all; }
  ol li .tag { flex: none; font-size: 12px; color: #8A7658; text-align: right; }
  ol li.cur { border: 2px solid #59C9A5; background: #ECF8F1; padding: 6px 8px; }
  ol li.cur .tag { color: #2F8A6C; font-weight: bold; }
  ol li.lock { background: #F3ECDA; border-color: #E4D8BB; }
  ol li.lock .nm, ol li.lock .ul { color: #A8987A; }

  /* 4. 修為從哪來 */
  ul.src { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  ul.src li { display: flex; gap: 8px; padding: 5px 2px; border-bottom: 1px dotted #DCCBA6; }
  ul.src li:last-child { border-bottom: 0; }
  ul.src .w { flex: 1; min-width: 0; }
  ul.src .g { flex: none; color: #2F8A6C; font-weight: bold; }

  .foot { margin-top: 16px; text-align: center; }
  button {
    font: inherit; color: #4A3A2A; cursor: pointer; border-radius: 10px;
    border: 2px solid #C9901A; background: #F5B82E; padding: 8px 40px; font-size: 16px; font-weight: bold;
  }
  button:hover { background: #F8C752; }
</style>
</head>
<body>
<div class="top">
  <div class="bigseal" id="seal">修<br>煉</div>
  <div>
    <div class="realm" id="realm"></div>
    <div class="sub">修煉紀錄</div>
  </div>
</div>
<div class="xpline"><span>修為 <b id="xp"></b></span><span class="of" id="of"></span></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="left" id="left"></div>

<h2>修煉成果</h2>
<div class="grid" id="grid"></div>

<h2>九重境界</h2>
<ol id="realms"></ol>

<h2>修為從哪來</h2>
<ul class="src" id="src"></ul>

<div class="foot"><button id="close">關閉</button></div>

<script>
(function () {
  if (typeof window.ui === 'undefined') {   // 瀏覽器預覽用的假資料（網址加 #done 看圓滿）
    const NAMES = ['煉氣', '築基', '金丹', '元嬰', '化神', '煉虛', '合體', '大乘', '渡劫'];
    const NEED = [0, 100, 400, 1000, 1600, 2400, 3300, 4400, 5200];
    const UNL = ['點、拖、甩、吟詩', '傳音符提醒', '今日三件事', '起身休息提醒', '護眼遠眺', '御劍飛行', '天雷閃躲', '出招', '全部功法'];
    function fake() {
      const done = location.hash === '#done' || window.previewDone === true;
      const xp = done ? 6000 : 1234, realm = done ? 8 : 3;
      return { records: {
        realm, realmName: NAMES[realm], done, xp,
        cur: done ? 6000 : NEED[realm], next: done ? 6000 : NEED[realm + 1],
        realms: NAMES.map((name, i) => ({ name, need: NEED[i], unlock: UNL[i], got: xp >= NEED[i] })),
        stats: done ? { days: 64, todayMin: 312, totalMin: 18420, todosDone: 150, allDone: 41, breaks: 220, gazes: 380, dodges: 27, strikes: 96 }
                    : { days: 3, todayMin: 125, totalMin: 980, todosDone: 7, allDone: 2, breaks: 5, gazes: 9, dodges: 1, strikes: 0 },
        sources: [
          { what: '在電腦前用（離開不算）', gain: '每分鐘 +1' },
          { what: '劃掉一件今日要事', gain: '+20' },
          { what: '三件事全部完成', gain: '再 +50' },
          { what: '起身休息', gain: '+10' },
          { what: '護眼遠眺 20 秒', gain: '+5' },
        ],
      } };
    }
    window.ui = { get: async () => fake(), close: () => console.log('ui.close'), resize: () => {},
      onRefresh: (fn) => { window.addEventListener('hashchange', fn); window.addEventListener('preview-refresh', fn); } };
  }

  const $ = (id) => document.getElementById(id);
  const num = (v) => Math.max(0, Math.round(Number(v) || 0));
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  // 數字＋小單位，例如「2 小時 5 分」
  function numParts(parts) {
    const box = el('div', 'n');
    parts.forEach(([n, unit]) => { box.appendChild(document.createTextNode(String(n))); if (unit) box.appendChild(el('small', null, unit)); });
    return box;
  }
  function hm(min) {
    min = num(min);
    const h = Math.floor(min / 60), m = min % 60;
    if (!h) return [[m, '分']];
    if (!m) return [[h, '小時']];
    return [[h, '小時'], [m, '分']];
  }

  async function render() {
    const d = await window.ui.get();
    const r = (d && d.records) || {};
    const realms = Array.isArray(r.realms) ? r.realms : [];
    const xp = num(r.xp), cur = num(r.cur), next = num(r.next);
    const idx = num(r.realm);

    // 1. 標題
    $('realm').textContent = r.done ? '渡劫圓滿' : (String(r.realmName || '') + '期');
    $('seal').textContent = '';
    $('seal').append(document.createTextNode(r.done ? '圓' : '修'), el('br'), document.createTextNode(r.done ? '滿' : '煉'));
    $('xp').textContent = xp.toLocaleString('zh-TW');
    $('of').textContent = '／ ' + next.toLocaleString('zh-TW');
    const pct = r.done || next <= cur ? 100 : Math.min(100, Math.max(0, (xp - cur) / (next - cur) * 100));
    $('fill').style.width = pct + '%';
    if (r.done) $('left').textContent = '已經圓滿';
    else {
      const nx = realms[idx + 1];
      $('left').textContent = '再 ' + Math.max(0, next - xp).toLocaleString('zh-TW') + ' 修為突破' + (nx ? String(nx.name) : '');
    }

    // 2. 修煉成果
    const s = r.stats || {};
    const tiles = [
      ['修煉天數', [[num(s.days), '天']]],
      ['今天在電腦前', hm(s.todayMin)],
      ['累計修煉時間', hm(s.totalMin)],
      ['劃掉的事', [[num(s.todosDone), '件']]],
      ['三件全成的天數', [[num(s.allDone), '天']]],
      ['起身休息', [[num(s.breaks), '次']]],
      ['護眼遠眺', [[num(s.gazes), '次']]],
      ['閃過天雷', [[num(s.dodges), '次']]],
      ['出招次數', [[num(s.strikes), '次']]],
    ];
    const grid = $('grid'); grid.textContent = '';
    tiles.forEach(([label, parts]) => {
      const t = el('div', 'tile'); t.append(numParts(parts), el('div', 'l', label)); grid.appendChild(t);
    });

    // 3. 九重境界
    const ol = $('realms'); ol.textContent = '';
    realms.forEach((it, i) => {
      const got = !!it.got, isCur = !r.done && i === idx;
      const li = el('li', got ? 'got' : 'lock');
      if (isCur || (r.done && i === realms.length - 1)) li.classList.add('cur');
      li.appendChild(el('div', 'mk', got ? '✓' : String(i + 1)));
      const bd = el('div', 'bd');
      const nm = el('div', 'nm', String(it.name || ''));
      nm.appendChild(el('span', 'nd', num(it.need) ? num(it.need).toLocaleString('zh-TW') + ' 修為' : '起點'));
      bd.append(nm, el('div', 'ul', '解鎖：' + String(it.unlock || '')));
      li.appendChild(bd);
      let tag = '';
      if (isCur) tag = '目前';
      else if (r.done && i === realms.length - 1) tag = '圓滿';
      else if (!got) tag = '還差 ' + Math.max(0, num(it.need) - xp).toLocaleString('zh-TW');
      if (tag) li.appendChild(el('div', 'tag', tag));
      ol.appendChild(li);
    });

    // 4. 修為從哪來
    const ul = $('src'); ul.textContent = '';
    (Array.isArray(r.sources) ? r.sources : []).forEach((x) => {
      const li = el('li'); li.append(el('span', 'w', String(x.what || '')), el('span', 'g', String(x.gain || ''))); ul.appendChild(li);
    });
  }

  $('close').addEventListener('click', () => window.ui.close());
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.ui.close(); });
  window.ui.onRefresh(render);
  render();
})();
</script>
</body>
</html>
