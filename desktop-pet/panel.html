<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>檔案管家</title>
<style>
  /* 設計原則：報告當下只做一件事 —— 點專案、點檔案。其餘功能都收進「⋯」。 */
  :root {
    --bg: #121418; --panel: #1a1d23; --card: #23272f; --card-hi: #2f3540; --line: #343a45;
    --text: #f0efea; --dim: #9aa0ab; --accent: #f4b860; --accent-ink: #2a1c05;
    --running: #5aa9e6; --waiting: #f4b860; --failed: #ef6b60; --done: #62c483; --idle: #6b7280;
    --scale: 1;
  }
  /* 字級跟著螢幕高度走：不論 Windows 縮放設多少，2560×720 的副螢幕上版面都一樣 */
  html { font-size: calc(clamp(12px, 2.9vh, 24px) * var(--scale)); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Microsoft JhengHei UI", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "WenQuanYi Zen Hei", system-ui, sans-serif;
    user-select: none; touch-action: manipulation; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  svg { width: 1.4rem; height: 1.4rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .app { display: grid; grid-template-columns: 14rem minmax(0, 1fr); gap: .5rem; height: 100vh; padding: .5rem; }
  .app.many { grid-template-columns: 22rem minmax(0, 1fr); }
  .aibtn { flex: none; display: flex; align-items: center; gap: .4rem; height: 3.3rem; padding: 0 1rem 0 .5rem; border-radius: .8rem; background: var(--card); font-weight: 700; font-size: 1rem; white-space: nowrap; }
  .aibtn:active { background: var(--card-hi); }
  .aibtn #mascot { margin: 0; } .aibtn b { color: var(--waiting); font-size: 1.15rem; margin-right: .15rem; }
  .f .x { margin-left: .2rem; opacity: .7; }
  .hint { font-weight: 700; color: var(--accent); }
  .big .dot { width: .8rem; height: .8rem; }
  .proj .dot, .label .dot, .big .dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: var(--accent); flex: none; }
  .label .dot { margin: 0 .3rem 0 .8rem; }
  .app.many .grid { grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); }
  .col { background: var(--panel); border-radius: 1rem; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  /* 看得見的細捲軸：讓人知道下面還有多少 */
  .scroll { overflow-y: auto; flex: 1; min-height: 0; padding: .5rem .5rem 2.2rem; scrollbar-width: thin; scrollbar-color: #4a5160 transparent; overscroll-behavior: contain; }
  .col { position: relative; }
  .col.below::after { content: "▼ 往下還有"; position: absolute; left: 0; right: 0; bottom: 0; height: 2.4rem; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: .3rem; font-size: .72rem; color: var(--text); letter-spacing: .1em; pointer-events: none;
    background: linear-gradient(rgba(26,29,35,0), var(--panel) 55%); border-radius: 0 0 1rem 1rem; }
  .label { font-size: .8rem; font-weight: 700; letter-spacing: .14em; color: var(--dim); padding: .7rem 1rem .1rem; }

  /* 專案 */
  #projects { display: grid; gap: .35rem; align-content: start; }
  .many #projects { grid-template-columns: 1fr 1fr; }
  #projects .label { grid-column: 1 / -1; padding: .5rem .5rem 0; }
  .proj { display: flex; align-items: center; gap: .5rem; min-height: 4rem; padding: .3rem .8rem; border-radius: .8rem; background: var(--card); font-size: 1.1rem; font-weight: 700; min-width: 0; }
  .proj.all { grid-column: 1 / -1; }
  .proj > span { flex: 1; min-width: 0; }
  .proj em { font-style: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.25; word-break: break-all; }
  .many .proj { font-size: 1rem; }
  .proj small { display: block; font-size: .72rem; font-weight: 400; color: var(--dim); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj:active { background: var(--card-hi); }
  .proj.sel { background: var(--accent); color: var(--accent-ink); }
  .proj.sel small { color: #5b4514; }
  .proj.sel .dot { background: var(--accent-ink); }

  /* 中間：一排篩選 + 大卡片 */
  .bar { display: none; align-items: center; gap: .5rem; padding: 0 .5rem; }
  .bar.searching { display: flex; }
  .fhead { display: flex; align-items: center; gap: .8rem; padding: .45rem .5rem .1rem 1rem; min-height: 3.9rem; }
  .fhead h2 { flex: 1; min-width: 0; margin: 0; font-size: 1.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col:has(.setbtn).below::after { bottom: 3.9rem; }   /* 「往下還有」的提示放在設定鈕上面，不要蓋住它 */
  .setbtn { flex: none; position: relative; z-index: 2; background: var(--panel); margin: .4rem .5rem .5rem; min-height: 3rem; border-radius: .8rem; color: var(--dim); font-size: .95rem; text-align: center; border: 1px solid var(--line); }
  .setbtn:active { background: var(--card); }
  #fchip .f, #fexp .f { height: 3rem; }
  .sec span { margin-left: .6rem; letter-spacing: 0; font-weight: 400; color: var(--text); }
  .filters { display: flex; gap: .4rem; overflow-x: auto; flex: 1; scrollbar-width: none; padding: .1rem; }
  .filters::-webkit-scrollbar { display: none; }
  .f { flex: none; height: 3.3rem; padding: 0 1rem; border-radius: .8rem; background: var(--card); font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: .45rem; white-space: nowrap; }
  .f i { width: .7rem; height: .7rem; border-radius: 50%; background: var(--k); }
  .f small { font-size: .8rem; font-weight: 400; color: var(--dim); }
  .f.on { background: var(--accent); color: var(--accent-ink); } .f.on small { color: #5b4514; }
  .f:active { background: var(--card-hi); }
  .f svg { width: 1.15rem; height: 1.15rem; }
  .f[data-act="subs"] { max-width: 15rem; } .f[data-act="subs"] > span { overflow: hidden; text-overflow: ellipsis; }
  .filters.more-x { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 3rem), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 3rem), transparent); }
  .big > span { min-width: 0; word-break: break-all; }
  .big > span.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }
  .gap { flex: none; width: .5rem; }
  #busy { display: none; flex: none; font-size: .8rem; color: var(--dim); white-space: nowrap; }
  .updating #busy { display: block; animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }
  .round { flex: none; width: 3.3rem; height: 3.3rem; border-radius: .8rem; display: grid; place-items: center; color: var(--dim); background: var(--card); }
  .round:active { background: var(--card-hi); color: var(--accent); }
  #q { display: none; flex: 1; height: 3.3rem; border-radius: .8rem; border: 2px solid var(--accent); background: var(--card); color: var(--text); font: inherit; font-size: 1.1rem; padding: 0 1rem; outline: 0; user-select: text; min-width: 0; }
  .searching #q { display: block; } .searching .filters { display: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr)); gap: .5rem; align-content: start; transition: opacity .15s; }
  .grid.loading { opacity: .45; }
  .sec { grid-column: 1 / -1; font-size: .85rem; font-weight: 700; color: var(--dim); letter-spacing: .14em; padding: .3rem .4rem 0; }
  .sum { grid-column: 1 / -1; font-size: 1.05rem; padding: .2rem .4rem .1rem; line-height: 1.5; user-select: text; }
  .sum b { color: var(--accent); }
  .file { display: flex; align-items: stretch; background: var(--card); border-radius: .9rem; min-height: 5.4rem; overflow: hidden; }
  .file .open { flex: 1; min-width: 0; display: flex; align-items: center; gap: .9rem; padding: .5rem .8rem; }
  .file .open:active { background: var(--card-hi); }
  .file.opening { outline: 2px solid var(--accent); }
  .file.opening .open { pointer-events: none; }
  .file.pinned .ext::before { content: "釘"; position: absolute; left: -.35rem; top: -.35rem; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: .72rem; }
  /* 釘選模式：提示固定在清單上方不隨捲動消失，所有卡片（含彈出清單裡的）加虛線框 */
  #pinbar { display: none; align-items: center; gap: .8rem; margin: .5rem .5rem 0; padding: .4rem .5rem .4rem 1rem; border-radius: .8rem; border: 2px dashed var(--accent); font-size: 1rem; }
  #pinbar b { color: var(--accent); } #pinbar .f { margin-left: auto; height: 2.7rem; }
  .pinmode #pinbar { display: flex; }
  .pinmode .file { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .file.opened .ext::after { content: "✓"; position: absolute; right: -.35rem; top: -.35rem; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--done); color: #0d2616; display: grid; place-items: center; font-size: .8rem; }
  .ext { position: relative; flex: none; width: 3.9rem; height: 3.9rem; border-radius: .8rem; display: grid; place-items: center; font-size: .9rem; font-weight: 800; background: var(--k); color: #14161a; }
  .file .t { min-width: 0; }
  .file .n { font-size: 1.15rem; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
  .file .m { font-size: .82rem; color: var(--dim); margin-top: .2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { display: inline-block; font-size: .7rem; font-weight: 700; border-radius: .3rem; padding: 0 .35rem; margin-right: .4rem; background: var(--done); color: #0d2616; }
  .tag.latest { background: var(--accent); color: var(--accent-ink); }
  .tag.warn { background: none; border: 1px solid var(--accent); color: var(--accent); }
  .ver { flex: none; align-self: stretch; display: grid; place-items: center; padding: 0 .8rem; font-size: .82rem; font-weight: 700; color: var(--accent); border-left: 1px solid var(--line); text-align: center; line-height: 1.3; }
  .ver:active { background: var(--card-hi); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--dim); padding: 2.5rem 1rem; line-height: 2; font-size: 1.05rem; }
  .big { display: flex; align-items: center; gap: .7rem; min-height: 3.8rem; padding: .4rem 1.2rem; border-radius: .8rem; background: var(--card-hi); font-weight: 700; font-size: 1.05rem; width: 100%; }
  .big small { display: block; font-size: .78rem; font-weight: 400; color: var(--dim); }
  .big:active { background: var(--line); }
  .big.main { background: var(--accent); color: var(--accent-ink); }
  .big.quiet { background: none; border: 1px solid var(--line); color: var(--dim); }
  .empty .big { display: inline-flex; width: auto; margin: .3rem; }

  /* AI 助手：一行一件 */
  .task { display: block; width: 100%; background: var(--card); border-radius: .8rem; padding: .7rem .8rem; margin-bottom: .35rem; border-left: .35rem solid var(--s); }
  .task:active { background: var(--card-hi); }
  .task .n { font-weight: 700; font-size: 1rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .task .st { font-size: .85rem; color: var(--s); font-weight: 700; margin-top: .25rem; }
  .task .st em { font-style: normal; font-weight: 400; color: var(--dim); }
  .many .task .st em { display: none; }
  .many .task { padding: .55rem .7rem; }
  .prog { height: .35rem; border-radius: .2rem; background: var(--line); margin-top: .45rem; overflow: hidden; }
  .prog b { display: block; height: 100%; background: var(--s); }
  .s-running { --s: var(--running); } .s-waiting { --s: var(--waiting); } .s-failed { --s: var(--failed); } .s-done { --s: var(--done); } .s-idle { --s: var(--idle); }
  .detail li { list-style: none; padding: .25rem 0 .25rem 1.6em; position: relative; font-size: 1rem; }
  .detail ul { margin: 0 0 .6rem; padding: 0; }
  .detail li::before { content: "○"; position: absolute; left: 0; color: var(--dim); }
  .detail li.completed { color: var(--done); } .detail li.completed::before { content: "●"; color: var(--done); }
  .detail li.in_progress { font-weight: 700; } .detail li.in_progress::before { content: "▶"; color: var(--running); }
  .detail p { user-select: text; }

  /* AI 對話畫面 */
  .label.go { display: flex; align-items: center; width: 100%; min-height: 2.6rem; }
  .label.go span { margin-left: auto; letter-spacing: 0; font-weight: 700; color: var(--accent); background: rgba(244,184,96,.14); border-radius: .6rem; padding: .35rem .7rem; }
  .label.go:active span { background: rgba(244,184,96,.3); }
  #talk { display: none; height: 100vh; padding: .5rem; gap: .5rem; }
  .talk #app { display: none; } .talk #talk { display: flex; }
  #talk nav { flex: none; width: 4.6rem; display: flex; flex-direction: column; gap: .5rem; }
  .navbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3rem; width: 100%; min-height: 5rem; border-radius: 1rem; background: var(--panel); color: var(--accent); font-size: .82rem; font-weight: 700; text-align: center; }
  .navbtn:active { background: var(--card-hi); }
  #talk-cols { flex: 1; min-width: 0; display: flex; gap: .5rem; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; }
  #talk-cols::-webkit-scrollbar { display: none; }
  /* 一次並排三欄（和草圖一樣）；專案更多時往左滑 */
  .tcol { flex: 1 1 0; min-width: 26rem; scroll-snap-align: start; background: var(--panel); border-radius: 1rem; display: flex; flex-direction: column; min-height: 0; overflow: hidden; border-top: .3rem solid var(--s, var(--line)); }
  #talk-cols:not(.overview) .msgs { padding-left: max(.6rem, calc((100% - 64rem) / 2)); padding-right: max(.6rem, calc((100% - 64rem) / 2)); }   /* 進入對話後，訊息不要拉得太寬 */
  #talk-cols.overview { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(14rem, 1fr); }
  .tcard { background: var(--panel); border-radius: 1rem; border-top: .35rem solid var(--s); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .tcard-body { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: .35rem; padding: .7rem .8rem .4rem; text-align: center; }
  .tcard-body:active { background: var(--card); }
  .tcard .slime { width: 4.6rem; height: 4.3rem; }
  .tcard b { font-size: 1.12rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cproj { display: block; font-size: .78rem; font-weight: 400; color: var(--dim); }
  .tcard .cst { font-size: .9rem; font-weight: 700; color: var(--s); }
  .tcard .prog { display: block; width: 80%; height: .35rem; border-radius: .2rem; background: var(--line); overflow: hidden; }
  .tcard .prog i { display: block; height: 100%; background: var(--s); }
  .tcard .csnip { flex: 1; min-height: 0; overflow: hidden; font-size: .88rem; line-height: 1.5; color: var(--dim); text-align: left; width: 100%; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .tcard.need { animation: needme 1.8s ease-in-out infinite; }
  .tcard .rbar { width: calc(100% - 1rem); min-height: 2.9rem; }
  /* 摘要欄：沒展開的專案。窄窄一條，但看得到史萊姆、狀態與最後一句話 */
  .ccol { flex: 0 0 11.5rem; scroll-snap-align: start; background: var(--panel); border-radius: 1rem; border-top: .3rem solid var(--s, var(--line)); display: flex; flex-direction: column; align-items: center; gap: .3rem; padding: .6rem .6rem .5rem; text-align: center; min-height: 0; overflow: hidden; }
  .ccol:active { background: var(--card); }
  .ccol .slime { width: 4.2rem; height: 3.9rem; margin-top: .3rem; }
  .ccol b { font-size: 1rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
  .ccol .cst { font-size: .82rem; font-weight: 700; color: var(--s); line-height: 1.3; }
  .ccol .prog { display: block; width: 100%; height: .35rem; border-radius: .2rem; background: var(--line); overflow: hidden; margin-top: 0; }
  .ccol .prog i { display: block; height: 100%; background: var(--s); }
  .ccol .csnip { flex: 1; min-height: 0; overflow: hidden; font-size: .8rem; line-height: 1.45; color: var(--dim); text-align: left; width: 100%; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .ccol .csnip em { font-style: normal; color: var(--text); }
  .ccol .cgo { flex: none; font-size: .78rem; color: var(--accent); display: flex; align-items: center; gap: .25rem; }
  .ccol .cgo svg { width: .95rem; height: .95rem; }
  .ccol.need { animation: needme 1.8s ease-in-out infinite; }   /* 等你或出錯：邊框輕輕閃，提醒這一欄有事 */
  @keyframes needme { 50% { box-shadow: inset 0 0 0 2px var(--s); } }
  #talk-counts { display: flex; flex-direction: column; gap: .4rem; }
  .tcount { display: flex; flex-direction: column; align-items: center; width: 100%; padding: .45rem 0; border-radius: .9rem; background: var(--panel); border-left: .3rem solid var(--s); font-size: .74rem; color: var(--s); font-weight: 700; text-align: center; }
  .tcount b { font-size: 1.35rem; line-height: 1.1; }
  .tcount:active { background: var(--card-hi); }
  .thead { display: flex; align-items: center; gap: .4rem; padding: .3rem .5rem .25rem .4rem; }
  .thead .f { height: 2.6rem; font-size: .88rem; padding: 0 .8rem; }
  .tabs { display: flex; gap: .35rem; overflow-x: auto; padding: 0 .5rem .35rem; scrollbar-width: none; flex: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; max-width: 13rem; height: 2.4rem; padding: 0 .8rem; border-radius: .6rem; background: var(--card); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: .25rem solid var(--s); }
  .tab.on { background: var(--card-hi); font-weight: 700; }
  .tabs.kids { align-items: center; } .tabs.kids > span { flex: none; font-size: .75rem; color: var(--dim); padding: 0 .2rem 0 .3rem; }
  .tabs.kids .tab { height: 2.2rem; font-size: .8rem; background: none; border: 1px solid var(--line); border-left: .25rem solid var(--s); }
  .ver[disabled], .open[disabled] { opacity: .55; pointer-events: none; }
  .msgs { flex: 1; min-height: 0; overflow-y: auto; padding: .3rem .6rem .5rem; display: flex; flex-direction: column; gap: .45rem; scrollbar-width: thin; scrollbar-color: #4a5160 transparent; overscroll-behavior: contain; }
  .msg { max-width: 88%; padding: .55rem .75rem; font-size: .98rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; user-select: text; }
  .msg.ai { align-self: flex-start; background: var(--card); border-radius: .3rem .9rem .9rem .9rem; }                       /* 助手：左邊的方框 */
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-radius: .9rem .9rem .3rem .9rem; }   /* 你：右邊的泡泡 */
  .msg small { display: block; font-size: .7rem; opacity: .65; margin-top: .2rem; }
  .msg.clip { max-height: 9.5rem; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .who { font-size: .72rem; color: var(--dim); margin: .1rem .2rem -.25rem; }
  .who.user { align-self: flex-end; }
  .tstat { flex: 1; min-width: 0; display: flex; align-items: center; gap: .6rem; min-height: 3.6rem; padding: .25rem .5rem .25rem .2rem; border-radius: .8rem; }
  .tstat:active { background: var(--card); }
  .tstat .tt { flex: 1; min-width: 0; }
  .tstat h2 { font-size: 1.1rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tstat .st { font-size: .85rem; font-weight: 700; color: var(--s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: .1rem; }
  .tstat .st em { font-style: normal; font-weight: 400; color: var(--dim); }
  .tstat .prog { margin-top: .3rem; }

  /* 史萊姆 */
  .slime { flex: none; width: 3.3rem; height: 3.1rem; overflow: visible; }
  .slime.away { visibility: hidden; }
  #mascot { display: inline-flex; margin-right: .5rem; } #mascot .slime { width: 2.2rem; height: 2.05rem; }
  .sl-skin { fill: color-mix(in srgb, var(--s) 82%, white); stroke: color-mix(in srgb, var(--s) 62%, black); stroke-width: 2; }
  .sl-shine { fill: rgba(255,255,255,.6); stroke: none; }
  .sl-eyes ellipse { fill: #1b2230; stroke: none; transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
  .sl-lids, .sl-smile, .sl-frown { fill: none; stroke: #1b2230; stroke-width: 2.2; stroke-linecap: round; }
  .sl-lids, .sl-frown, .sl-drop, .sl-mark, .sl-zzz { display: none; }
  .sl-shadow { fill: rgba(0,0,0,.35); stroke: none; transform-box: fill-box; transform-origin: center; }
  .sl-drop { fill: #8fd3ff; stroke: none; }
  .sl-mark circle { fill: var(--s); stroke: #fff; stroke-width: 1.5; } .sl-mark text { fill: #14161a; font-size: 13px; font-weight: 800; stroke: none; }
  .sl-zzz { fill: #9db0d0; font-size: 11px; font-weight: 800; stroke: none; }
  .sl-body { transform-box: fill-box; transform-origin: 50% 100%; animation: jelly 2.6s ease-in-out infinite; }
  @keyframes jelly { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.06, .93); } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  /* 正在做：一下一下地彈 */
  .sl-running .sl-body { animation: work .7s ease-in-out infinite; }
  @keyframes work { 0%, 100% { transform: translateY(0) scale(1.08, .9); } 45% { transform: translateY(-13%) scale(.94, 1.08); } }
  .sl-running .sl-shadow { animation: shrink .7s ease-in-out infinite; }
  @keyframes shrink { 45% { transform: scale(.75); opacity: .6; } }
  /* 等你：頭上冒出驚嘆號，左右搖 */
  .sl-waiting .sl-mark, .sl-failed .sl-mark { display: block; animation: pop 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pop { 50% { transform: translateY(-2px) scale(1.15); } }
  .sl-waiting .sl-body { animation: sway 1.3s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(-5deg) scale(1.03, .97); } 50% { transform: rotate(5deg) scale(.98, 1.03); } }
  /* 出錯：發抖、冒汗、嘴角往下 */
  .sl-failed .sl-body { animation: shiver .28s linear infinite; }
  @keyframes shiver { 0%, 100% { transform: translateX(-1.2px) scale(1.04, .95); } 50% { transform: translateX(1.2px) scale(1.04, .95); } }
  .sl-failed .sl-smile { display: none; } .sl-failed .sl-frown, .sl-failed .sl-drop { display: block; }
  .sl-failed .sl-drop { animation: drip 1.2s ease-in infinite; }
  @keyframes drip { 0% { transform: translateY(-3px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(12px); opacity: 0; } }
  /* 完成：開心地跳 */
  .sl-done .sl-body { animation: joy 1s cubic-bezier(.3, 0, .3, 1) infinite; }
  @keyframes joy { 0%, 100% { transform: translateY(0) scale(1.12, .86); } 40% { transform: translateY(-24%) scale(.92, 1.1); } 70% { transform: translateY(0) scale(1.1, .9); } }
  .sl-done .sl-eyes { display: none; } .sl-done .sl-lids { display: block; }
  /* 停著：攤平睡覺 */
  .sl-idle .sl-body { animation: snooze 3.6s ease-in-out infinite; }
  @keyframes snooze { 0%, 100% { transform: scale(1.14, .78); } 50% { transform: scale(1.1, .83); } }
  .sl-idle .sl-eyes { display: none; } .sl-idle .sl-lids { display: block; transform: translateY(3px) scaleY(-1); transform-box: fill-box; transform-origin: center; }
  .sl-idle .sl-smile { display: none; } .sl-idle .sl-zzz { display: block; animation: zzz 2.4s ease-in-out infinite; } .sl-idle .z2 { animation-delay: 1.2s; }
  @keyframes zzz { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }

  /* 跑出來找你的史萊姆 */
  .runner { position: fixed; z-index: 25; display: flex; align-items: flex-end; gap: .3rem; transform: translate(-50%, -50%); transition: left .9s cubic-bezier(.45, 0, .3, 1), top .9s cubic-bezier(.45, 0, .3, 1); filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .runner .slime { width: 4.4rem; height: 4.1rem; }
  .runner.hopping .slime { animation: hop calc(.9s / var(--hops, 3)) ease-in-out calc(var(--hops, 3)); }
  @keyframes hop { 0%, 100% { transform: translateY(0) scale(1.12, .86); } 50% { transform: translateY(-1.7rem) scale(.92, 1.1); } }
  .runner .say { max-width: 15rem; background: #fffbe6; color: #3b2a12; border-radius: .9rem .9rem .9rem .2rem; padding: .5rem .75rem; font-size: .95rem; line-height: 1.4; margin-bottom: 1.6rem; opacity: 0; transition: opacity .3s .9s; text-align: left; }
  .runner .say b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .runner .say small { display: block; font-size: .72rem; opacity: .65; }
  .runner:not(.leaving) .say { opacity: 1; } .runner.leaving .say { display: none; }
  @media (prefers-reduced-motion: reduce) { .slime *, .runner, .runner .slime { animation: none !important; transition: none !important; } }

  .rbar { flex: none; display: flex; align-items: center; width: calc(100% - 1rem); min-height: 3.2rem; margin: 0 .5rem .5rem; padding: 0 .5rem 0 1rem; border-radius: .8rem; background: var(--bg); border: 1px solid var(--line); color: var(--dim); font-size: 1rem; }
  .rbar span { margin-left: auto; background: var(--accent); color: var(--accent-ink); font-weight: 700; border-radius: .6rem; padding: .45rem 1rem; font-size: .9rem; }
  .rbar:active { background: var(--card); }
  .rbar.off { font-size: .8rem; min-height: 2.2rem; border-style: dashed; }
  #reply-text { width: 100%; min-height: 6.5rem; resize: none; border-radius: .8rem; border: 2px solid var(--accent); background: var(--card); color: var(--text); font: inherit; font-size: 1.1rem; line-height: 1.5; padding: .7rem .9rem; outline: 0; user-select: text; }
  .big[disabled] { opacity: .5; pointer-events: none; }
  .tnote { color: var(--dim); font-size: .9rem; line-height: 1.7; text-align: center; margin: auto; padding: 1rem; }

  /* 彈出面板、提示 */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; place-items: center; z-index: 10; }
  .sheet-bg.show { display: grid; }
  .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 1.1rem; padding: 1rem; width: min(52rem, 92vw); max-height: 94vh; display: flex; flex-direction: column; }
  .sheet h3 { margin: 0 0 .7rem .3rem; font-size: 1.15rem; display: flex; align-items: center; gap: .5rem; }
  .sheet h3 span { flex: 1; }
  .sheet .list { overflow-y: auto; display: grid; gap: .45rem; scrollbar-width: thin; scrollbar-color: #4a5160 transparent; align-content: start; }
  .sheet .two { grid-template-columns: 1fr 1fr; }
  .sheet .three { grid-template-columns: 1fr 1fr 1fr; }
  .sheet .wide { grid-column: 1 / -1; }
  .sheet p { color: var(--dim); font-size: .92rem; margin: 0 .3rem .5rem; line-height: 1.6; }
  .sheet .file .n { -webkit-line-clamp: 3; }
  .toast { position: fixed; right: 1rem; bottom: 1rem; transform: translateY(6rem); background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: .8rem 1.3rem; border-radius: .9rem; transition: transform .2s; z-index: 20; max-width: 16rem; font-size: 1rem; line-height: 1.4; word-break: break-all; }
  .toast.show { transform: none; }
  .toast.err { background: var(--failed); color: #fff; }

  #offline { display: none; position: fixed; inset: 0; z-index: 30; background: rgba(10,11,14,.88); place-items: center; text-align: center; font-size: 1.3rem; line-height: 2; }
  #offline b { color: var(--accent); }
  .offline #offline { display: grid; }
  @media (max-width: 1000px) {
    body { overflow: auto; height: auto; }
    .app, .app.many { grid-template-columns: 1fr; height: auto; }
    .col { max-height: 80vh; }
  }
</style>
</head>
<body>
<svg style="display:none">
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
</svg>

<div class="app" id="app">
  <section class="col"><div class="label">專案<i class="dot"></i><span style="letter-spacing:0;font-weight:400">今天有動</span></div><div class="scroll" id="projects"></div>
    <button class="setbtn" data-act="more">設定</button></section>

  <section class="col">
    <div class="fhead" id="fhead"><h2 id="ftitle">全部專案</h2><span id="fexp"></span><span id="fchip"></span><span id="busy">更新中…</span>
      <button class="aibtn" data-act="talk"><i id="mascot"></i><span id="ai-count">AI 對話</span></button></div>
    <div class="bar" id="bar">
      <div class="filters" id="filters"></div>
      <input id="q" placeholder="輸入檔名或資料夾名稱" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <button class="round" data-act="search" id="search-btn" aria-label="結束搜尋"><svg><use href="#i-x"/></svg></button>
    </div>
    <div id="pinbar"><span>釘選模式：點任何一張卡片（包含版本清單裡的），把它<b>釘選</b>到最上面；已釘選的會取消。</span><button class="f" data-act="pin-cancel">取消</button></div>
    <div class="scroll" id="scroll"><div class="grid" id="files"><div class="empty">正在讀取檔案清單…</div></div></div>
  </section>
</div>

<!-- AI 對話：一個專案一欄，看得到這個專案和 AI 助手說了什麼 -->
<div id="talk">
  <nav><button class="navbtn" id="talk-back" data-act="files"><svg><use href="#i-folder"/></svg>找檔案</button></nav>
  <div id="talk-cols"></div>
</div>

<div class="sheet-bg" id="sheet-bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div id="offline"><div>檔案管家已經關閉。<br>請回到電腦上重新雙擊 <b>pet.pyw</b>，這個畫面會自動恢復。</div></div>

<script>
const TOKEN = "__TOKEN__";
const KIND = {"圖面與模型": ["圖面", "#5aa9e6"], "PDF": ["PDF", "#ef6b60"], "試算表": ["試算表", "#62c483"], "簡報": ["簡報", "#f0924a"],
  "圖片": ["圖片", "#b78be8"], "文件": ["文件", "#7f9cf5"], "影音": ["影音", "#e879b9"], "壓縮檔": ["壓縮檔", "#c9b458"],
  "安裝檔": ["安裝檔", "#8b93a1"], "程式與資料": ["程式", "#4fd1c5"], "其他": ["其他", "#8b93a1"]};
const SINCE = {"": "不限時間", today: "今天", week: "本週", lastweek: "上週"};
const PAGE = 120;
const state = { project: "", kind: "", since: "", sub: "", q: "", limit: PAGE, projects: [], files: [], subs: [], tasks: [], hidden: [], missing: [] };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const icon = n => `<svg><use href="#i-${n}"/></svg>`;
const base = p => p.split(/[\\/]/).pop();

async function api(path, body) {
  let r;
  try {
    r = await fetch(path, { method: body ? "POST" : "GET", headers: {"X-Token": TOKEN, "Content-Type": "application/json"},
      body: body ? JSON.stringify(body) : undefined });
  } catch (e) {   // 連不上：先用最輕的請求確認是整個程式結束了，還是只有這一個請求失敗
    let alive = false;
    try { alive = (await fetch("/api/ping", {headers: {"X-Token": TOKEN}})).status < 500; } catch (e2) {}
    if (alive) throw new Error("暫時讀不到，請再試一次。");
    document.body.classList.add("offline");
    throw new Error("檔案管家已經關閉，請重新雙擊 pet.pyw");
  }
  if (document.body.classList.contains("offline")) { location.reload(); }
  if (r.status === 403) { location.reload(); throw new Error("重新連線中"); }
  const data = await r.json();
  if (!r.ok) { const err = new Error(data.error || "發生錯誤"); err.folderOffline = !!data.offline; throw err; }
  return data;
}
let toastTimer;
function toast(msg, err) {
  const t = $("toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "toast", err ? 4000 : 2200);
}
function ago(ts) {
  if (!(ts > 0)) return "日期異常";   // 檔案的修改時間在未來或太久以前（通常是別台電腦的時鐘錯了）
  const s = Date.now() / 1000 - ts;
  if (s < 90) return "剛剛";
  if (s < 3600) return Math.round(s / 60) + " 分鐘前";
  if (s < 86400) return Math.round(s / 3600) + " 小時前";
  const days = Math.round(s / 86400);
  if (days < 14) return days + " 天前";
  const d = new Date(ts * 1000), md = `${d.getMonth() + 1}/${d.getDate()}`;
  if (days < 60) return `${md}（${Math.round(days / 7)} 週前）`;
  if (days < 335) return `${md}（${Math.round(days / 30)} 個月前）`;
  return `${d.getFullYear()}/${md}`;
}
function bucket(ts) {  // 今天、昨天、本週（週一起）、上週，再往前按月份
  const now = new Date(), midnight = new Date(now).setHours(0, 0, 0, 0) / 1000;
  const monday = midnight - ((now.getDay() + 6) % 7) * 86400;
  if (!(ts > 0)) return "日期異常（修改時間不合理）";
  if (ts >= midnight) return "今天";
  if (ts >= midnight - 86400) return "昨天";
  if (ts >= monday) return "本週";
  if (ts >= monday - 7 * 86400) return "上週";
  const d = new Date(ts * 1000);
  return (d.getFullYear() === now.getFullYear() ? "" : d.getFullYear() + " 年 ") + (d.getMonth() + 1) + " 月";
}
/* 檔名：不顯示副檔名（左邊色塊已標示）；太長時省略中間、保留結尾的版號 */
function shortName(name, max) {
  const stem = name.replace(/\.(?=[A-Za-z0-9]*[A-Za-z])[A-Za-z0-9]{1,6}$/, "");   // 只去掉真正的副檔名（「圖說 1.5版」保留）
  const w = c => c.charCodeAt(0) > 255 ? 2 : 1;
  let total = 0; for (const c of stem) total += w(c);
  if (total <= max) return esc(stem);
  const tailMax = Math.floor(max * .4), headMax = max - tailMax - 2;
  let head = "", tail = "", n = 0;
  for (const c of stem) { if (n + w(c) > headMax) break; head += c; n += w(c); }
  n = 0; for (const c of [...stem].reverse()) { if (n + w(c) > tailMax) break; tail = c + tail; n += w(c); }
  return esc(head) + "…" + esc(tail);
}
/* 專案名稱開頭的案號（如 2025-003_）縮成小字，讓名稱主體優先 */
function projName(name) {
  const m = name.match(/^([0-9A-Za-z][0-9A-Za-z.\-]*\d)[_\-\s]+(.+)$/);
  return m ? [esc(m[1]), esc(m[2])] : ["", esc(name)];
}

/* ---------- 專案 ---------- */
function renderProjects() {
  // 案號與「今天有動」放在名稱上方的小字，不佔名稱的寬度
  const row = (p, [code, name], cls) => `<button class="proj ${cls || ""} ${p.path === state.project ? "sel" : ""}" data-proj="${esc(p.path)}"><span>${code ? `<small>${code}</small>` : ""}<em>${name}</em></span>${p.today ? '<i class="dot"></i>' : ""}</button>`;
  const active = state.projects.filter(p => p.active), rest = state.projects.filter(p => !p.active);
  $("app").classList.toggle("many", state.projects.length > 7);
  $("projects").innerHTML = row({path: "", today: false}, ["", "全部專案"], "all") + active.map(p => row(p, projName(p.name))).join("") +
    (rest.length ? `<div class="label">兩週以上沒動</div>` + rest.map(p => row(p, projName(p.name))).join("") : "") +
    ((state.missing || []).length ? `<div class="label" style="color:var(--failed);letter-spacing:0;line-height:1.5">目前讀不到（可能沒連上）：<br>${state.missing.map(m => esc(base(m))).join("、")}</div>` : "");
}
let pendingTimer = 0;
async function loadProjects() {
  const d = await api("/api/projects");
  state.projects = d.projects; state.hidden = d.hidden; state.missing = d.missing; state.notice = d.notice;
  clearTimeout(pendingTimer);
  if (d.projects.some(p => p.pending)) pendingTimer = setTimeout(() => { if (idle()) refresh(); else loadProjects().catch(() => {}); }, 2000);
  if (state.project && !d.projects.some(p => p.path === state.project)) state.project = "";
  renderProjects();
}

/* ---------- 檔案 ---------- */
const GROUP = { version: n => `另有<br>${n} 個舊版`, series: n => `同系列<br>另有 ${n} 份`, batch: n => `同一批<br>共 ${n + 1} 張` };
function fileCard(f, opts = {}) {
  const where = opts.project ? [projName(f.project)[1], esc(f.rel.replace(/\\/g, "/"))].filter(Boolean).join("／") : esc(f.rel.replace(/\\/g, "/"));
  const n = f.versions ? f.versions.length + (f.more || 0) : 0;
  const tags = (opts.latest ? `<span class="tag latest">最新</span>` : "") + (opts.mark ? `<span class="tag latest">${opts.mark}</span>` : "") + ""+
    "";
  const warn = f.later ? "・<span class='hint'>之後有新版</span>" : f.oldpin ? "・<span class='hint'>舊版</span>" : "";
  return `<div class="file ${f.pinned ? "pinned" : ""} ${openedPaths.has(f.path) ? "opened" : ""}" style="--k:${(KIND[f.kind] || KIND["其他"])[1]}">
    <button class="open" data-open="${esc(f.path)}" title="${esc(f.name)}"><span class="ext">${esc(f.ext || "檔案")}</span>
      <span class="t"><div class="n">${shortName(f.name, opts.max || (n ? 30 : 40))}</div><div class="m">${tags}${ago(f.mtime)}${where ? "・" + where : ""}${warn}</div></span></button>
    ${n && opts.versions ? `<button class="ver" data-ver="${esc(f.path)}">${f.group === "batch" ? (n + 1) + "<br>張" : "+" + n + "<br>版"}</button>` : ""}</div>`;
}

function renderFilters() {   // 用最近一次的資料加上目前的選擇來畫；點了篩選鈕會先呼叫它，讓按鈕立刻變色
  const f = (val, label) => `<button class="f ${state.since === val ? "on" : ""}" data-since="${val}">${label}</button>`;
  const picked = [state.sub ? base(state.sub) : "", state.kind ? KIND[state.kind][0] : ""].filter(Boolean).join("・");
  $("filters").innerHTML = Object.keys(SINCE).map(k => f(k, SINCE[k])).join("") + `<span class="gap"></span>` +
    `<button class="f" data-act="filter">${icon("folder")}篩選</button>` +
    (picked ? `<button class="f on" data-act="clear-filter"><span>${esc(picked)}</span><span class="x">✕</span></button>` : "");
  fades();
}

let fileSeq = 0, rescan = 0;
async function loadFiles(quiet) {
  const seq = ++fileSeq, grid = $("files");
  clearTimeout(rescan);
  const slow = setTimeout(() => grid.classList.add("loading"), quiet ? 60000 : 250);
  const qs = new URLSearchParams({project: state.project, kind: state.kind, since: state.since, sub: state.sub, q: state.q, limit: state.limit});
  let d;
  try { d = await api("/api/files?" + qs); }
  catch (e) {
    if (seq !== fileSeq) return;
    toast(e.message, true);
    if (e.folderOffline && state.project) { state.project = ""; closeSheet(); await refresh(); }   // 回到總覽，那裡會標出「目前讀不到」
    else if (state.project) {   // 例如另一個視窗把這個專案移除了：確認它還在，不在就回總覽
      const before = state.project;
      try { await loadProjects(); } catch (e2) {}
      if (before && !state.project) { closeSheet(); resetList(); loadFiles(); }
    }
    return;
  }
  finally { clearTimeout(slow); grid.classList.remove("loading"); }
  if (seq !== fileSeq) return;  // 已有更新的查詢
  state.files = d.files; state.subs = d.subs;

  state.last = d;
  renderFilters();

  if (!d.projects) {
    grid.innerHTML = d.missing.length
      ? `<div class="empty"><b style="color:var(--text)">目前讀不到專案資料夾</b><br>${d.missing.map(esc).join("<br>")}<br>
          <small>網路磁碟或外接硬碟可能沒連上。設定都還在，接上之後這裡會自動恢復。</small></div>`
      : `<div class="empty">${state.notice ? `<small style="color:var(--failed)">${esc(state.notice)}</small><br>` : ""}<b style="color:var(--text)">先告訴我專案放在哪裡</b><br>
          <button class="big main" data-add="root">${icon("plus")}<span>加入一整批專案<small style="color:#5b4514">選一個總資料夾（例如 D:\\專案），裡面每個子資料夾＝一個專案</small></span></button>
          <button class="big" data-add="single">${icon("plus")}<span>加入一個專案<small>選的資料夾本身就是一個專案</small></span></button><br>
          <small>只會讀取檔案清單，不會搬動、改名或刪除任何檔案。之後可以在右上角「⋯」裡移除。</small></div>`;
    return;
  }
  const kindName = state.kind ? KIND[state.kind][0] : "檔案";
  // 背景還在讀清單（第一次，或慢速磁碟上的更新）：過一下自己再問一次，不必使用者動手
  $("fhead").classList.toggle("updating", !!d.scanning && d.files.length > 0);   // 畫面上是上次的清單，背景還在更新
  if (d.scanning) rescan = setTimeout(() => { if (seq === fileSeq && ($("scroll").scrollTop < 5 || !d.files.length)) loadFiles(true); }, 1500);
  const cname = (cur() || {}).name;
  if (!d.files.length && d.scanning && !(state.kind || state.since || state.sub || state.q)) {
    grid.innerHTML = `<div class="empty">正在讀取${cname ? "「" + esc(cname) + "」的" : ""}檔案清單…<br><small>資料夾在網路磁碟上時，第一次會比較久。</small></div>`;
    return;
  }
  if (!d.files.length && older && state.project && !state.q && !state.kind && !state.sub) {
    grid.innerHTML = `<div class="empty">這兩週沒有動過的檔案。<br><button class="big" data-reveal="${esc(state.project)}">${icon("folder")}<span>在檔案總管開啟（${older} 份）</span></button></div>`;
    return;
  }
  if (!d.files.length) {
    const kn = (/^[A-Za-z]/.test(kindName) ? " " : "") + kindName;
    let msg = state.q ? `找不到「${esc(state.q)}」` : state.since ? `${SINCE[state.since]}沒有動過的${kn}` : `這裡沒有${kn}`;
    if (state.sub) msg += `（資料夾：${esc(state.sub)}）`;
    const undo = (state.kind ? `<button class="big" data-kind="${esc(state.kind)}">看全部類型</button>` : "") +
      (state.sub ? `<button class="big" data-act="clear-sub">看全部資料夾</button>` : "") +
      (state.since ? `<button class="big" data-since="">不限時間</button>` : "");
    const why = d.denied ? `<br><small>有 ${d.denied} 個資料夾讀不到（可能沒有權限），裡面的檔案沒有列出。</small>` : "";
    grid.innerHTML = `<div class="empty">${msg}${why}<br>${undo}</div>`;
    return;
  }
  $("ftitle").innerHTML = cur() ? projName(cur().name)[1] : "全部專案";
  $("fexp").innerHTML = cur() ? `<button class="f" data-reveal="${esc(cur().path)}">${icon("folder")}在檔案總管開啟</button>` : "";
  const picked = [state.sub ? base(state.sub) : "", state.kind ? KIND[state.kind][0] : "", state.since ? SINCE[state.since] : ""].filter(Boolean).join("・");
  $("fchip").innerHTML = picked ? `<button class="f on" data-act="clear-filter"><span>只看 ${esc(picked)}</span><span class="x">✕</span></button>` : "";
  let html = "", last = null;
  // 區段標題直接寫份數：「上週 11 份」就是報告的第一句話，不必另外按按鈕
  const secOf = x => x.pinned ? "釘選" : bucket(x.mtime), cnt = {};
  const RECENT = ["釘選", "今天", "昨天", "本週", "上週"];
  // 這裡只負責「最近的」；更早的、要仔細找的，交給檔案總管
  const older = d.files.filter(x => !RECENT.includes(secOf(x))).length + Math.max(0, d.total - d.files.length);
  if (!state.q && !state.kind && !state.sub) d.files = d.files.filter(x => RECENT.includes(secOf(x)));
  d.files.forEach(x => { const s = secOf(x); cnt[s] = (cnt[s] || 0) + 1; });
  if (state.since) {  // 報告用的一句話摘要，可以直接唸
    const parts = Object.keys(KIND).filter(k => d.kinds[k]).map(k => `${KIND[k][0]} ${d.kinds[k]}`).join("・");
    html += `<div class="sum">${SINCE[state.since]}動了 <b>${d.total}</b> 份${state.kind ? KIND[state.kind][0] : "：" + parts}${d.new ? `　其中新增 <b>${d.new}</b> 份` : ""}</div>`;
  }
  for (const x of d.files) {
    const sec = secOf(x);
    if (sec !== last) { html += `<div class="sec">${sec}<span>${cnt[sec]} 份</span></div>`; last = sec; }
    html += fileCard(x, {project: !state.project});
  }
  if (older && !state.q && !state.kind && !state.sub) html += state.project
    ? `<div class="empty" style="padding:1rem"><button class="big" data-reveal="${esc(state.project)}">${icon("folder")}<span>更早的檔案（${older} 份）→ 在檔案總管開啟</span></button></div>`
    : `<div class="empty" style="padding:1rem;font-size:.95rem">更早的檔案沒有列在這裡。點左邊的專案，最下面可以直接到檔案總管。</div>`;
  if (d.denied) html += `<div class="empty" style="padding:.6rem;font-size:.9rem">有 ${d.denied} 個資料夾讀不到（可能沒有權限），裡面的檔案沒有列出。</div>`;
  if (d.truncated) html += `<div class="empty" style="padding:.6rem;font-size:.9rem">這個專案的檔案太多，只列出一部分。</div>`;
  grid.innerHTML = html;
}

/* ---------- 史萊姆：AI 助手的樣子。平常待在頁面上方，狀態改變時會跳到游標（或手指最後碰的位置）來找你 ---------- */
function slime(state, id) {
  return `<svg class="slime sl-${state} s-${state}" viewBox="0 0 64 60" ${id ? `data-slime="${esc(id)}"` : ""} aria-hidden="true">
    <ellipse class="sl-shadow" cx="32" cy="55" rx="21" ry="3.5"/>
    <g class="sl-body"><path class="sl-skin" d="M7 46 C7 22 20 8 32 8 C44 8 57 22 57 46 C57 53 49 54 32 54 C15 54 7 53 7 46Z"/>
      <ellipse class="sl-shine" cx="21" cy="21" rx="6.5" ry="3.6" transform="rotate(-28 21 21)"/>
      <g class="sl-eyes"><ellipse cx="24" cy="34" rx="3.3" ry="4.4"/><ellipse cx="40" cy="34" rx="3.3" ry="4.4"/></g>
      <g class="sl-lids"><path d="M20 35 q4 -3 8 0"/><path d="M36 35 q4 -3 8 0"/></g>
      <path class="sl-smile" d="M27 43 Q32 47 37 43"/><path class="sl-frown" d="M27 46 Q32 42 37 46"/>
      <circle class="sl-drop" cx="50" cy="24" r="2.6"/></g>
    <g class="sl-mark"><circle cx="52" cy="11" r="9"/><text x="52" y="15.5" text-anchor="middle">!</text></g>
    <text class="sl-zzz" x="47" y="14">z</text><text class="sl-zzz z2" x="54" y="7">z</text></svg>`;
}
const pointer = {x: innerWidth / 2, y: innerHeight * .55, known: false};   // 游標或手指最後的位置
["pointermove", "pointerdown"].forEach(t => document.addEventListener(t, ev => { pointer.x = ev.clientX; pointer.y = ev.clientY; pointer.known = true; }, {passive: true}));
const knownState = {};     // 每件事上次的狀態，用來發現「剛做完」「剛出錯」
let stateSeeded = false;
const runners = {};        // 正跑出來找你的史萊姆
const CALL = {waiting: "做完了，等你看！", failed: "出錯了，需要你看一下。", done: "完成了！"};
function noticeStates(tasks) {
  for (const t of tasks) {
    const before = knownState[t.id];
    knownState[t.id] = t.state;
    if (stateSeeded && before && before !== t.state && CALL[t.state]) summon(t);   // 第一次載入只記錄，不打擾
  }
  stateSeeded = true;
}
function homeOf(id) {   // 這隻史萊姆平常待的地方：對話畫面是它那一欄的上方，找檔案畫面是右上角
  const el = document.querySelector(`.talk .slime[data-slime="${CSS.escape(id)}"]`) || document.querySelector("body:not(.talk) #mascot .slime") || document.querySelector(".slime");
  const r = el ? el.getBoundingClientRect() : {left: innerWidth / 2, top: 8, width: 44, height: 40};
  return {x: r.left + r.width / 2, y: r.top + r.height / 2, el};
}
function summon(t) {
  if (runners[t.id]) dismiss(t.id, true);
  if (Object.keys(runners).length >= 3) return;   // 一次最多三隻，不要滿畫面都是
  const home = homeOf(t.id), n = Object.keys(runners).length;
  const el = document.createElement("button");
  el.className = `runner s-${t.state}`; el.dataset.runner = t.id;
  el.innerHTML = slime(t.state) + `<span class="say"><b>${esc(t.title)}</b>${CALL[t.state]}<small>點我看這件事</small></span>`;
  el.style.left = home.x + "px"; el.style.top = home.y + "px";
  document.body.appendChild(el);
  if (home.el) home.el.classList.add("away");
  const r = runners[t.id] = {el, task: t, timer: 0};
  const go = () => {   // 跳到游標旁邊；游標之後移開很遠就再跟一次
    const size = 64, x = Math.min(innerWidth - 150, Math.max(size, pointer.x + 46 + n * 30)), y = Math.min(innerHeight - size, Math.max(size, pointer.y + 34 + n * 26));
    const dist = Math.hypot(x - parseFloat(el.style.left), y - parseFloat(el.style.top));
    if (dist < 150 && r.arrived) return;
    el.classList.add("hopping"); el.style.setProperty("--hops", Math.max(2, Math.round(dist / 170)));
    el.style.left = x + "px"; el.style.top = y + "px"; r.arrived = true;
    setTimeout(() => el.classList.remove("hopping"), 950);
  };
  requestAnimationFrame(() => requestAnimationFrame(go));
  r.follow = setInterval(go, 1800);
  r.timer = setTimeout(() => dismiss(t.id), 25000);   // 沒人理它，一陣子後自己回去
}
function dismiss(id, now) {
  const r = runners[id];
  if (!r) return;
  clearInterval(r.follow); clearTimeout(r.timer); delete runners[id];
  const home = homeOf(id);
  r.el.classList.add("leaving", "hopping"); r.el.style.left = home.x + "px"; r.el.style.top = home.y + "px";
  setTimeout(() => { r.el.remove(); document.querySelectorAll(".slime.away").forEach(s => { if (!Object.keys(runners).length) s.classList.remove("away"); }); }, now ? 0 : 900);
}

/* ---------- AI 對話：一個專案一欄 ---------- */
const picked = {};        // 每一欄目前看的是哪一段對話
const seenLast = {};      // 每段對話上次畫到的最後一則，用來判斷要不要捲到最新
// 助手的訊息常帶 Markdown 記號；這裡只顯示純文字，把最常見的記號拿掉比較好讀
const tidy = s => s.replace(/^#{1,6}\s*/gm, "").replace(/\*\*(.+?)\*\*/g, "$1").replace(/`([^`\n]+)`/g, "$1").replace(/\n{3,}/g, "\n\n").trim();
function clock(ts) {
  if (!(ts > 0)) return "";
  const d = new Date(ts * 1000), today = new Date().toDateString() === d.toDateString();
  const hm = `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  return today ? hm : `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
}
function talkColumn(key, title, threads, extra) {

          <div class="st">${esc(cur.state_text || "")}${total ? ` ${done}/${total}` : ""}${cur.doing && cur.state === "running" ? `<em>　正在：${esc(cur.doing)}</em>` : ""}</div>
          ${total ? `<div class="prog"><b style="width:${Math.round(done / total * 100)}%"></b></div>` : ""}</span></button>
      ${extra || ""}</div>
    ${threads.length > 1 ? `<div class="tabs">${threads.map(t => `<button class="tab s-${t.state} ${t.id === cur.id ? "on" : ""}" data-thread="${esc(t.id)}" data-key="${esc(key)}">${esc(t.title)}</button>`).join("")}</div>` : ""}
    <div class="msgs" data-thread-id="${esc(cur.id)}">${msgs || empty}</div>

      : `<div class="rbar off">這段對話不能從這裡回覆，請到 GitHub 或 claude.ai</div>`}</section>`;
}
/* 回覆 AI 助手：副螢幕上不好打字，所以先給幾句常用的話，點了會填進去，可以再改 */
const QUICK = ["好，照這樣繼續。", "請先暫停，等我確認。", "請說明目前的進度和遇到的問題。", "這部分請重做，原因是："];

let talkSeq = 0;
async function loadTalk() {
  const seq = ++talkSeq;
  let d;
  try { d = await api("/api/conversations"); } catch (e) { return; }
  if (seq !== talkSeq || !document.body.classList.contains("talk")) return;
  state.talk = d;
  state.threads = {};
  const active = [...d.columns.flatMap(c => c.threads), ...d.loose];
  [...active, ...d.columns.flatMap(c => c.shelved || []), ...(d.loose_shelved || [])].forEach(t => state.threads[t.id] = t);
  noticeStates(active);   // 收起來的對話不通知

/* AI 對話只有兩個畫面：總覽（每個專案一張卡）→ 點卡片進入那個專案的對話（← 回總覽）。
   細節（子對話、整理舊對話）交給 Claude App；舊對話照樣自動收起來，這裡不另外管理。 */
const RANK = {failed: 0, waiting: 1, running: 2, done: 3, idle: 4};
const lead = c => [...c.threads].sort((x, y) => RANK[x.state] - RANK[y.state] || y.updated - x.updated)[0];
function allThreads(d) {   // 每段 AI 對話一張卡；順序固定（依專案，再依開始的時間），不會因為誰剛有動靜就換位置
  const out = [];
  d.columns.forEach(c => c.threads.forEach(t => out.push({t, project: projName(c.name)[1], key: c.path})));
  d.loose.forEach(t => out.push({t, project: "", key: "__loose"}));
  return out.sort((x, y) => x.project.localeCompare(y.project) || (x.t.started || 0) - (y.t.started || 0));
}
function talkCard({t, project}) {
  const [done, total] = t.progress || [0, 0];
  const lastAi = [...(t.messages || [])].reverse().find(m => m.role === "ai");
  const need = t.state === "failed" || t.state === "waiting";
  return `<section class="tcard s-${t.state} ${need ? "need" : ""}">
    <button class="tcard-body" data-open-thread="${esc(t.id)}">${slime(t.state, t.id)}
      <b>${esc(t.title)}</b>${project ? `<small class="cproj">${project}</small>` : ""}<span class="cst">${esc(t.state_text || "")}</span>
      ${total ? `<span class="prog"><i style="width:${Math.round(done / total * 100)}%"></i></span>` : ""}
      <span class="csnip">${lastAi ? esc(tidy(lastAi.text).slice(0, 160)) : ""}</span></button>
    ${t.can_reply ? `<button class="rbar" data-reply="${esc(t.id)}">回覆…<span>送出</span></button>` : ""}</section>`;
}
function renderTalk() {
  const d = state.talk, box = $("talk-cols");
  if (!d) return;
  const all = allThreads(d), open = all.find(x => x.t.id === state.open);
  if (state.open && !open) state.open = null;

let pressTimer, pressed = false;
document.addEventListener("pointerdown", ev => {
  const el = ev.target.closest(".file .open[data-open]");
  pressed = false; clearTimeout(pressTimer);
  if (el) pressTimer = setTimeout(() => { pressed = true; fileMenu(el.dataset.open); }, 550);
});
["pointerup", "pointercancel", "pointermove"].forEach(t => document.addEventListener(t, ev => {

document.addEventListener("contextmenu", ev => {   // 觸控長按或滑鼠右鍵

/* ---------- 事件 ---------- */
async function refresh() {  // 第一次先取專案；之後先取檔案（會重新掃描），再更新專案列的「今天有動」
  if (!state.ready) { await loadProjects(); state.ready = true; }
  await loadFiles(); await loadProjects();
}
function setScale(delta) {
  let s = 1;
  try { s = parseFloat(localStorage.getItem("scale") || "1"); } catch (e) {}
  s = Math.min(1.5, Math.max(.7, Math.round((s + delta) * 10) / 10));
  try { localStorage.setItem("scale", s); } catch (e) {}
  document.documentElement.style.setProperty("--scale", s);
}
function setPinMode(on) { if (state.pinMode !== on) guard(); state.pinMode = on; document.body.classList.toggle("pinmode", on); fades(); }
function setSearch(on) {
  $("bar").classList.toggle("searching", on);
  const c = cur();
  $("q").placeholder = c ? `在「${c.name}」裡找：輸入檔名或資料夾名稱` : "在全部專案裡找：輸入檔名或資料夾名稱";
  if (on) $("q").focus(); else { $("q").value = ""; state.q = ""; }
}
const name = p => (state.projects.find(x => x.path === p) || {}).name || base(p);

document.addEventListener("click", async ev => {
  if (pressed) { pressed = false; ev.preventDefault(); return; }   // 剛才是長按，不當成點擊
  // 連點防護：畫面在半秒內換過，而這一下又點在幾乎同一個位置 → 是同一次連點的第二下，不該落到新出現的東西上。
  // 點在別的位置則照常處理（手快的人打開面板後立刻點裡面的按鈕不會被吃掉）。
  const sameSpot = Math.hypot(ev.clientX - lastTap.x, ev.clientY - lastTap.y) < 56;
  if (Date.now() - changedAt < 550 && sameSpot) return;
  lastTap = {x: ev.clientX, y: ev.clientY};
  const el = ev.target.closest("[data-open-thread],[data-runner],[data-reply],[data-quick],[data-thread],[data-proj-files],[data-link],[data-pin],[data-source-ask],[data-source],[data-detach-ask],[data-unhide],[data-proj],[data-kind],[data-since],[data-sub],[data-open],[data-reveal],[data-ver],[data-task],[data-url],[data-act],[data-add],[data-merge],[data-merge-ask],[data-unmerge]");
  if (!el) { if (ev.target.id === "sheet-bg") closeSheet(); return; }
  const d = el.dataset;
  try {
    if ("openThread" in d) { state.open = d.openThread; renderTalk(); }
    else if (d.act === "talk-home") { state.open = null; renderTalk(); }
    else if ("runner" in d) {   // 點跑來的史萊姆：帶你到那件事的對話
      const id = d.runner, t = runners[id] && runners[id].task;
      dismiss(id);
      if (!document.body.classList.contains("talk")) setMode(true);
      state.open = id; await loadTalk();   // 直接進入那段對話
    }
    else if ("reply" in d) replySheet(d.reply);
    else if ("quick" in d) { const box = $("reply-text"); box.value = d.quick; box.focus(); }
    else if (d.act === "send-reply") {
      const box = $("reply-text"), text = box.value.trim();
      if (!text) { toast("還沒有輸入內容", true); box.focus(); return; }
      el.disabled = true; el.textContent = "送出中…";          // 送出期間不能再按，避免同一句話送兩次
      try {
        const r = await api("/api/reply", {thread: d.thread, text});
        closeSheet(); delete seenLast[d.thread];
        toast(r.via === "cloud" ? "已送進雲端的對話，助手會接著做" : "已送出，助手正在這台電腦上處理");
        loadTalk();
      } catch (e) { el.disabled = false; el.textContent = "送出"; toast(e.message, true); }
    }
    else if ("thread" in d) { picked[d.key] = d.thread; delete seenLast[d.thread]; loadTalk(); }
    else if ("projFiles" in d) { Object.assign(state, {project: d.projFiles, kind: "", since: "", sub: "", q: "", last: null, files: []}); resetList(); setMode(false); }
    else if ("link" in d) { await api("/api/link_repo", {repo: d.link, project: d.project}); closeSheet(); toast("已指定，這個 GitHub 專案的對話會顯示在那一欄"); loadTalk(); }
    else if (d.act === "talk") setMode(true);
    else if (d.act === "files") setMode(false);
    else if (d.act === "link") linkSheet();
    else if (d.act === "unclip") el.classList.remove("clip");
    else if ("pin" in d) { const r = await api("/api/pin", {path: d.pin, on: d.on === "1"}); closeSheet(); toast(r.on ? "已釘選到最上面" : "已取消釘選"); resetList(); await loadFiles(); }
    else if ("proj" in d) {
      if (d.proj === state.project && !(state.kind || state.since || state.sub || state.q)) return;   // 已經在這裡了，連點不重做
      setSearch(false); setPinMode(false); Object.assign(state, {project: d.proj, kind: "", since: "", sub: "", last: null, files: []});
      resetList(); renderProjects(); renderFilters();
      $("files").innerHTML = `<div class="empty">正在讀取${d.proj ? "「" + esc(name(d.proj)) + "」的" : ""}檔案清單…</div>`;
      await refresh();
    }
    else if ("kind" in d) { state.kind = state.kind === d.kind ? "" : d.kind; closeSheet(); resetList(); renderFilters(); await loadFiles(); }
    else if ("since" in d) { state.since = state.since === d.since ? "" : d.since; resetList(); renderFilters(); await loadFiles(); }
    else if ("sub" in d) { state.sub = d.sub; closeSheet(); resetList(); await loadFiles(); }
    else if ("open" in d && state.pinMode) { setPinMode(false); closeSheet(); const r = await api("/api/pin", {path: d.open, on: !el.closest(".file").classList.contains("pinned")}); toast(r.on ? "已釘選到最上面" : "已取消釘選"); resetList(); await loadFiles(); }
    else if ("open" in d) openFile(d.open, false, el.closest(".file"));   // 清單保持開啟，方便接著開另一版比較
    else if ("reveal" in d) { closeSheet(); openFile(d.reveal, true); }
    else if ("ver" in d) groupSheet(d.ver);
    else if ("task" in d) taskSheet(d.task);
    else if ("url" in d) { await api("/api/open_url", {url: d.url}); toast("已在瀏覽器開啟"); }
    else if ("add" in d) addProject(d.add === "root");
    else if ("mergeAsk" in d) confirmSheet(`把「${esc(name(d.mergeAsk))}」併入「${esc(cur().name)}」？<br><small>只改顯示方式，不會搬動檔案；之後可以再拆出。</small>`, "併入", `data-merge="${esc(d.mergeAsk)}"`);
    else if ("merge" in d) { await api("/api/merge", {path: d.merge, into: state.project}); toast("已併入"); await refresh(); foldersSheet(); }
    else if ("unmerge" in d) { const r = await api("/api/unmerge", {folder: d.unmerge}); toast(r.did === "removed" ? "已移除，檔案不受影響" : "已拆出，它回到左邊成為獨立的專案"); await refresh(); foldersSheet(); }
    else if ("detachAsk" in d) confirmSheet(d.single
      ? `把「${esc(base(d.detachAsk))}」從這個專案移除？<br><small>只是不再顯示，資料夾和檔案都不會被動到。</small>`
      : `把「${esc(base(d.detachAsk))}」從這個專案拆出？<br><small>它會回到左邊的清單，成為獨立的專案。檔案不受影響。</small>`, d.single ? "移除" : "拆出", `data-unmerge="${esc(d.detachAsk)}"`);
    else if ("sourceAsk" in d) confirmSheet(`不再顯示「${esc(base(d.sourceAsk))}」？<br><small>資料夾和裡面的檔案都不會被動到；之後可以再加回來。</small>`, "移除", `data-source="${esc(d.sourceAsk)}"`);
    else if ("source" in d) { await api("/api/remove_source", {path: d.source}); toast("已移除，檔案不受影響"); state.project = ""; await refresh(); sourcesSheet(); }
    else if ("unhide" in d) {
      // 恢復後那一格留在原位、變成「已恢復 ✓」，不讓下一個專案補到手指底下：
      // 連續點不同的專案每一下都算數，連點同一格也不會多恢復一個。

      el.removeAttribute("data-unhide"); el.style.opacity = ".45";
      const small = el.querySelector("small"); if (small) small.textContent = "已恢復 ✓";

      toast("已恢復顯示"); await refresh();

    }
    else if (d.act === "sources") sourcesSheet();
    else if (d.act === "hidden") hiddenSheet();

    else if (d.act === "pin-cancel") setPinMode(false);

    else if (d.act === "search-open") { closeSheet(); setSearch(true); }
    else if (d.act === "subs" || d.act === "filter") subsSheet();
    else if (d.act === "clear-filter") { state.sub = ""; state.kind = ""; state.since = ""; resetList(); renderFilters(); await loadFiles(); }
    else if (d.act === "clear-sub") { state.sub = ""; resetList(); await loadFiles(); }
    else if (d.act === "load-more") { state.limit += PAGE; await loadFiles(); }
    else if (d.act === "folders") foldersSheet();
    else if (d.act === "merge-pick") mergePickSheet();
    else if (d.act === "add-folder") { toast("請在電腦主螢幕跳出的視窗選擇資料夾…"); const r = await api("/api/add_folder", {project: state.project}); if (r.added) { toast("已加入"); await refresh(); foldersSheet(); } else toast("沒有選擇資料夾，所以沒有加入"); }
    else if (d.act === "hide-ask") confirmSheet(`把「${esc(cur().name)}」從清單隱藏？<br><small>檔案不受影響；之後可在「⋯」裡恢復。</small>`, "隱藏", `data-act="hide-proj"`);
    else if (d.act === "hide-proj") { await api("/api/hide_project", {path: state.project, on: true}); state.project = ""; closeSheet(); toast("已隱藏，可在「⋯」→「已隱藏的專案」恢復"); refresh(); }
    else if (d.act === "smaller") setScale(-.1);
    else if (d.act === "bigger") setScale(.1);
    else if (d.act === "full") { closeSheet(); document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => toast("此環境無法切換全螢幕", true)); }
  } catch (e) { toast(e.message, true); }
});
let qTimer;
$("q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = $("q").value.trim(); resetList(); loadFiles(); }, 200); });

function fades() {
  const fl = $("filters"); fl.classList.toggle("more-x", fl.scrollWidth - fl.scrollLeft - fl.clientWidth > 8);   // 右邊還有鈕：邊緣淡出提示可以滑
  document.querySelectorAll(".col > .scroll").forEach(el =>
  el.parentElement.classList.toggle("below", el.scrollHeight - el.scrollTop - el.clientHeight > 3.2 * parseFloat(getComputedStyle(document.documentElement).fontSize))); }
document.querySelectorAll(".col > .scroll").forEach(el => { el.addEventListener("scroll", fades, {passive: true}); new MutationObserver(fades).observe(el, {childList: true, subtree: true}); });
window.addEventListener("resize", fades);
window.addEventListener("resize", () => { if (document.body.classList.contains("talk")) renderTalk(); });   // 寬度變了，能展開幾欄也跟著變
$("filters").addEventListener("scroll", fades, {passive: true});
setScale(0);
refresh().then(() => { if (state.projects.some(p => !p.count)) setTimeout(refresh, 1500); });
loadTasks();
setInterval(() => document.body.classList.contains("talk") ? loadTalk() : loadTasks(), 15000);
try { if (localStorage.getItem("mode") === "talk") setMode(true); } catch (e) {}   // 回到上次停留的畫面
setInterval(() => { if (document.body.classList.contains("offline")) api("/api/ping").catch(() => {}); }, 4000);
const idle = () => !$("sheet-bg").classList.contains("show") && !state.q && $("scroll").scrollTop < 5 && state.limit === PAGE;
setInterval(async () => {
  if (idle()) return refresh();          // 使用者正在往下找的時候不重排清單…
  try {                                  // …但仍然確認資料夾還讀得到：選中的專案不見了就回到總覽
    const before = state.project; await loadProjects();
    if (before && !state.project && !$("sheet-bg").classList.contains("show")) { resetList(); loadFiles(); }
  } catch (e) {}
}, 30000);
window.addEventListener("focus", () => { if (idle()) refresh(); });
</script>
</body>
