<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>螢幕保護</title>
<style>html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; } canvas { display: block; width: 100vw; height: 100vh; }
#bar { position: fixed; top: 18px; right: 18px; display: flex; gap: 10px; z-index: 5; }
#bar button { font: 600 16px "Microsoft JhengHei","PingFang TC",sans-serif; color: #4A3A2A; background: rgba(251,243,220,0.94); border: 2px solid #4A3A2A;
  border-radius: 12px; padding: 9px 16px; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.25); }
#bar button:hover { background: #F5B82E; }
#bar #off { font-size: 13px; padding: 9px 12px; color: #6A5A46; }
</style>
</head>
<body>
<div id="bar"><button id="close" title="收起螢幕保護">✕ 收起</button><button id="off" title="以後閒置時不再自動開">不要再自動開</button></div>
<canvas id="c"></canvas>
<script src="loong-shards.js"></script>
<script src="loong-swim.js"></script>
<script src="draw.js"></script>
<script src="villains.js"></script>
<script>
  // 想改用畫好的青龍插畫（assets/dragon/），把 DRAGON_ART 改成 true；目前用程式畫的幾何青龍
  window.DRAGON_ART = false;
  if (window.DRAGON_ART) {
    window.DRAGON_IMG = new Image();
    window.DRAGON_IMG.onload = () => { window.DRAGON_READY = true; };
    window.DRAGON_IMG.onerror = () => { window.DRAGON_READY = true; };
    window.DRAGON_IMG.src = 'assets/dragon/qinglong-512.png';
  } else window.DRAGON_READY = true;
</script>
<script>
// 螢幕保護：不換畫面，只是在你的桌面上飄出東西來。透明、滑鼠穿透，桌面照常看得到。
// 五個角色各有一套（SCENES）：飄的東西、怎麼動、隔一陣子發生什麼、點了有什麼反應都不一樣。
//   靈貓「守山夜」    螢火蟲會被游標吸引；角落掛著師父的鈴鐺，隔一陣子響一聲；螢幕下緣走過一排貓掌印
//   狐仙「狐火燈會」  狐火排成陣（圓、兩列、散開）輪流變換；點到一團，全部「噗」一聲換陣
//   玉兔「月宮桂落」  月亮慢慢從左走到右；桂花落下，游標一攪就打轉；點月亮灑下一陣桂花
//   熊貓「竹林灶火」  兩側長出竹子、落竹葉；熱騰騰的包子冒著蒸氣往上飄，點了就吃掉
//   小青龍「雲海聽雨」幾朵雲飄過，雲下小雨、水珠上升；隔一陣子一條小龍游過；點雲會打雷下大雨
// 你回來之後還會多演十幾秒才慢慢散掉。只有游標正好在可點的東西上才接住滑鼠。
(function () {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const api = window.fx || { info: async () => ({ outfit: { species: location.hash.slice(1) || 'cat' } }), exit: () => console.log('exit'), clickable: () => {}, onLeave: () => {} };
  let W = 0, H = 0, K = 1, sp = 'cat', S = null, things = [], bursts = [], mouse = { x: -9999, y: -9999 }, leaveAt = 0, born = 0, hot = false, flash = -9;
  const LINGER = 14, FADE = 4, GOLD = '#F5B82E', LINE = '#4A3A2A';
  function size() { W = innerWidth; H = innerHeight; K = Math.max(0.7, Math.min(1.5, H / 1080)); cv.width = Math.round(W * devicePixelRatio); cv.height = Math.round(H * devicePixelRatio); }
  addEventListener('resize', size); size();
  let clock = null;   // 預告片算圖時由外面指定時間（saverDraw），平常是 null
  const rnd = (a, b) => a + Math.random() * (b - a), now = () => (clock == null ? performance.now() / 1000 : clock), clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const count = (per, lo, hi) => Math.max(lo, Math.min(hi, Math.round(W * H / per)));
  function spark(x, y, r, a, color) {
    ctx.save(); ctx.globalAlpha *= clamp(a); ctx.fillStyle = color; ctx.translate(x, y); ctx.beginPath();
    for (let i = 0; i < 8; i++) { const an = i * Math.PI / 4, rr = i % 2 ? r * 0.32 : r; ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function burst(x, y, color, big) { bursts.push({ x, y, at: now(), color, big }); }
  function cloudShape(x, y, s, color) {
    ctx.fillStyle = color; ctx.beginPath();
    ctx.arc(x - 60 * s, y + 6 * s, 34 * s, 0, 6.283); ctx.arc(x - 18 * s, y - 16 * s, 44 * s, 0, 6.283); ctx.arc(x + 38 * s, y - 6 * s, 38 * s, 0, 6.283); ctx.arc(x + 74 * s, y + 12 * s, 26 * s, 0, 6.283);
    ctx.rect(x - 86 * s, y + 6 * s, 180 * s, 34 * s); ctx.fill();
  }
  // 會飄的小東西：o = { x, y, vx, vy, r, ph, at }，離開螢幕就從邊上再進來
  function mk(vx, vy, r, extra) { return Object.assign({ x: rnd(0, W), y: rnd(0, H), vx, vy, r: r * K, ph: rnd(0, 6.28), spin: rnd(-1, 1), px: 0, py: 0, at: 0 }, extra); }
  function reenter(o, T) { if (o.vy > 4) { o.y = -30; o.x = rnd(0, W); } else if (o.vy < -4) { o.y = H + 30; o.x = rnd(0, W); } else { o.x = Math.random() < 0.5 ? -30 : W + 30; o.y = rnd(0, H); } o.px = o.py = 0; o.at = T; }
  // force > 0 閃開游標；< 0 被游標吸引；swirl 是繞著游標打轉。回傳 true 表示飄出螢幕了
  function drift(o, T, dt, force, swirl) {
    const dx = o.x - mouse.x, dy = o.y - mouse.y, d = Math.hypot(dx, dy), R = 190 * K;
    if (d < R && d > 0.1) {
      const f = (1 - d / R) * force * K;
      o.px += dx / d * f * dt; o.py += dy / d * f * dt;
      if (swirl) { o.px += -dy / d * swirl * (1 - d / R) * K * dt; o.py += dx / d * swirl * (1 - d / R) * K * dt; }
    }
    o.px *= 1 - Math.min(1, dt * 2); o.py *= 1 - Math.min(1, dt * 2);
    o.x += (o.vx * K + Math.sin(T * 0.7 + o.ph) * 16 * K + o.px) * dt; o.y += (o.vy * K + Math.cos(T * 0.6 + o.ph) * 8 * K + o.py) * dt;
    return o.x < -70 || o.x > W + 70 || o.y < -70 || o.y > H + 70;
  }
  const near = (o, x, y) => Math.hypot(o.x - x, o.y - y) < Math.max(26 * K, o.r * 1.8);

  function firefly(o, T, boost) {
    const a = clamp(0.45 + 0.5 * Math.sin(T * 2.2 + o.ph) + boost), r = o.r, g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, r * 3.2);
    g.addColorStop(0, `rgba(214,255,170,${a})`); g.addColorStop(0.35, `rgba(150,240,160,${a * 0.45})`); g.addColorStop(1, 'rgba(150,240,160,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(o.x, o.y, r * 3.2, 0, 6.283); ctx.fill();
    ctx.fillStyle = `rgba(255,255,220,${a})`; ctx.beginPath(); ctx.arc(o.x, o.y, r * 0.38, 0, 6.283); ctx.fill();
  }
  function foxfire(x, y, r, T, ph) {
    const s = r / 16 * (1 + Math.sin(T * 16 + ph) * 0.1);
    ctx.save(); ctx.translate(x, y); ctx.shadowColor = '#6FD3FF'; ctx.shadowBlur = 20; ctx.globalAlpha *= 0.92;
    ctx.fillStyle = '#4FB6FF'; ctx.beginPath(); ctx.moveTo(0, -26 * s); ctx.quadraticCurveTo(18 * s, -4 * s, 0, 14 * s); ctx.quadraticCurveTo(-18 * s, -4 * s, 0, -26 * s); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = '#E6FBFF'; ctx.beginPath(); ctx.moveTo(0, -10 * s); ctx.quadraticCurveTo(8 * s, 2 * s, 0, 10 * s); ctx.quadraticCurveTo(-8 * s, 2 * s, 0, -10 * s); ctx.fill(); ctx.restore();
  }
  function blade(o, T, leaf) {   // 花瓣或竹葉
    ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(T * (0.7 + o.spin * 0.6) + o.ph); ctx.globalAlpha *= 0.92;
    const l = o.r * (leaf ? 2.2 : 1.6), w = l * (leaf ? 0.26 : 0.42);
    ctx.fillStyle = leaf ? '#7CC878' : '#F5C95A'; ctx.strokeStyle = leaf ? '#3E7A45' : '#C9901A'; ctx.lineWidth = 1.4 * K;
    ctx.beginPath(); ctx.moveTo(-l / 2, 0); ctx.quadraticCurveTo(0, -w, l / 2, 0); ctx.quadraticCurveTo(0, w, -l / 2, 0); ctx.fill(); ctx.stroke();
    if (leaf) { ctx.beginPath(); ctx.moveTo(-l / 2, 0); ctx.lineTo(l / 2, 0); ctx.stroke(); }
    ctx.restore();
  }
  function orb(o) {
    const g = ctx.createRadialGradient(o.x - o.r * 0.3, o.y - o.r * 0.3, o.r * 0.1, o.x, o.y, o.r);
    g.addColorStop(0, 'rgba(255,255,255,0.85)'); g.addColorStop(0.5, 'rgba(159,232,255,0.35)'); g.addColorStop(1, 'rgba(127,212,255,0.6)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 6.283); ctx.fill(); ctx.strokeStyle = 'rgba(127,212,255,0.9)'; ctx.lineWidth = 1.5 * K; ctx.stroke();
  }

  const SCENES = {
    // ── 靈貓「守山夜」──
    cat: {
      name: '守山夜',
      init(T) { things = Array.from({ length: count(70000, 12, 34) }, () => mk(rnd(-14, 14), rnd(-10, 10), rnd(5, 9))); this.ring = T + 5; this.rings = []; this.paws = T + 4; this.bright = -9; },
      bell() { return { x: W - 130 * K, y: 96 * K, r: 22 * K }; },
      ringBell(T) { this.rings.push(T); this.ring = T + rnd(10, 16); this.bright = T; },
      step(T, dt) {
        if (T > this.ring) this.ringBell(T);
        this.rings = this.rings.filter((t) => T - t < 3);
        if (T > this.paws + 24) this.paws = T;
        for (const o of things) if (drift(o, T, dt, -260, 140)) reenter(o, T);   // 螢火蟲會湊過來繞著游標
      },
      draw(T) {
        const b = this.bell(), dtb = T - this.bright, sw = Math.sin(T * 1.3) * 0.12 + (dtb < 1.2 ? Math.sin(dtb * 26) * 0.35 * (1 - dtb / 1.2) : 0);
        for (const t of this.rings) for (let i = 0; i < 3; i++) { const p = (T - t - i * 0.3) / 2.2; if (p > 0 && p < 1) { ctx.save(); ctx.globalAlpha *= (1 - p) * 0.75; ctx.strokeStyle = GOLD; ctx.lineWidth = (4 - p * 3) * K; ctx.beginPath(); ctx.arc(b.x, b.y, 26 * K + p * 300 * K, 0, 6.283); ctx.stroke(); ctx.restore(); } }
        ctx.save(); ctx.translate(b.x, 0); ctx.rotate(sw); ctx.strokeStyle = '#C0392B'; ctx.lineWidth = 3 * K; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, b.y - 20 * K); ctx.stroke();
        ctx.translate(0, b.y); ctx.lineWidth = 2.4 * K; ctx.fillStyle = GOLD; ctx.strokeStyle = LINE; ctx.shadowColor = GOLD; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-b.r * 0.8, 0); ctx.lineTo(b.r * 0.8, 0); ctx.moveTo(0, 0); ctx.lineTo(0, b.r * 0.8); ctx.stroke();
        ctx.fillStyle = '#FFF6D0'; ctx.beginPath(); ctx.arc(-b.r * 0.35, -b.r * 0.4, b.r * 0.18, 0, 6.283); ctx.fill(); ctx.restore();
        // 貓掌印：從左走到右，一步一步印上去再淡掉
        const n = Math.floor(W / (86 * K));
        for (let i = 0; i < n; i++) {
          const age = T - this.paws - i * 0.42; if (age < 0 || age > 7) continue;
          ctx.save(); ctx.globalAlpha *= clamp(age * 4) * clamp((7 - age) / 3) * 0.6; ctx.fillStyle = '#6B5A44'; ctx.translate(40 * K + i * 86 * K, H - (i % 2 ? 46 : 78) * K); ctx.rotate(0.25);
          ctx.beginPath(); ctx.ellipse(0, 4 * K, 11 * K, 9 * K, 0, 0, 6.283); ctx.fill();
          for (const [dx, dy] of [[-11, -8], [-4, -14], [4, -14], [11, -8]]) { ctx.beginPath(); ctx.ellipse(dx * K, dy * K, 4 * K, 5 * K, 0, 0, 6.283); ctx.fill(); }
          ctx.restore();
        }
        const boost = clamp(1 - dtb / 2) * 0.6;
        for (const o of things) if (T >= o.at) firefly(o, T, boost);
      },
      hit(x, y) { const b = this.bell(); if (Math.hypot(x - b.x, y - b.y) < b.r * 1.6) return 'bell'; return things.find((o) => near(o, x, y)) || null; },
      click(h, T) { if (h === 'bell') { this.ringBell(T); burst(this.bell().x, this.bell().y, GOLD, true); } else { burst(h.x, h.y, '#B8F5A0'); reenter(h, T + rnd(1.5, 4)); } },
    },
    // ── 狐仙「狐火燈會」──
    fox: {
      name: '狐火燈會',
      // 狐火：一團團亮起、燒一陣、熄掉，再在別處亮起；越來越多。有一些聚到狐仙身後，排成狐尾（時間越久尾巴越多，最多九條）
      init(T) {
        this.t0 = T; this.form = 0; this.next = T + 16; this.max = count(60000, 16, 36);
        things = []; for (let i = 0; i < 4; i++) things.push(this.flame(T + i * 0.5, false));
      },
      flame(T, tail) {
        const o = mk(0, 0, rnd(12, 18)); o.born = T + rnd(0, 0.8); o.dur = rnd(4, 9); o.tail = tail;
        o.x = rnd(0.1, 0.9) * W; o.y = rnd(0.15, 0.85) * H; return o;
      },
      tails(T) { return Math.min(9, 1 + Math.floor((T - this.t0) / 18)); },
      // 第 k 條尾巴上的第 j 團（0 根部～5 尾尖）：從狐仙身後往上、往後彎，九條展開成扇形，輕輕擺
      tailSlot(k, n, j, T, spin) {
        const P = petPos || { x: W * 0.8, y: H - 80 * K, dir: -1 }, d = P.dir < 0 ? -1 : 1;
        // 像狐仙自己的尾巴一樣，以身體為中心往上、往兩側對稱展開（一條時稍微偏向身後）
        const rootX = P.x - (n === 1 ? d * 26 * K : 0), rootY = P.y - 4 * K, fan = Math.min(2.95, 0.42 * (n - 1));   // 九條時張開成大半圓，最外側的尾巴不會掉到地面下
        const base = -Math.PI / 2 - (n === 1 ? d * 0.6 : 0) + (spin || 0), ang = base + (n > 1 ? (k - (n - 1) / 2) * fan / (n - 1) : 0);
        const t = (j + 1) / 6, L = (190 + n * 16) * K, side = Math.cos(ang) < 0 ? -1 : 1;   // 尾巴拉長，狐火之間留空隙
        const sway = Math.sin(T * 1.6 + k * 0.9) * 0.28 * t, curl = side * 0.85 * t * t;   // 尾尖往外捲
        const a = ang + sway + curl;
        const x = rootX + Math.cos(ang) * L * t * 0.5 + Math.cos(a) * L * t * 0.5, y = rootY + Math.sin(ang) * L * t * 0.5 + Math.sin(a) * L * t * 0.5;
        return [Math.max(14 * K, Math.min(W - 14 * K, x)), Math.max(14 * K, Math.min(H - 14 * K, y))];
      },
      // 陣形（沒在尾巴上的狐火）：0 一個慢慢轉的大圓；1 左右兩列；2 散開各自飄
      slot(i, n, T, o) {
        if (this.form === 0) { const a = i * 6.283 / Math.max(1, n) + T * 0.12; return [W / 2 + Math.cos(a) * W * 0.36, H / 2 + Math.sin(a) * H * 0.33]; }
        if (this.form === 1) { const half = Math.max(1, Math.ceil(n / 2)), j = i % half, side = i < half ? 0.1 : 0.9; return [W * side + Math.sin(T * 0.8 + i) * 14 * K, H * (0.12 + 0.76 * (j + 0.5) / half)]; }
        return [W * (0.5 + 0.44 * Math.sin(o.ph * 3 + T * 0.09)), H * (0.5 + 0.4 * Math.sin(o.ph * 5 + T * 0.07))];
      },
      swap(T) { this.form = (this.form + 1) % 3; this.next = T + 16; for (const o of things) if (!o.tail) burst(o.x, o.y, '#FFFFFF'); },
      // 狐仙出招：gather 狐火往牠身邊聚；cast 從牠身上噴出新的狐火；spin 狐尾繞著轉；meditate 尾巴更亮
      foxfx(move, T) {
        this.fx = { move, at: T };
        if (move === 'cast' && petPos) for (let i = 0; i < 4; i++) {
          const o = this.flame(T, false); o.born = T; o.x = petPos.x; o.y = petPos.y - 30 * K; const a = -Math.PI / 2 + (i - 1.5) * 0.6;
          o.px = Math.cos(a) * 900 * K; o.py = Math.sin(a) * 900 * K; things.push(o);
        }
      },
      alpha(o, T) {
        if (T < o.born) return 0;
        const inA = clamp((T - o.born) / 0.6);
        if (o.tail) return inA * (0.72 + 0.28 * Math.sin(T * 6 + o.ph));   // 尾巴上的狐火不熄，只是一閃一閃
        return inA * clamp((o.born + o.dur - T) / 0.8);
      },
      step(T, dt) {
        if (T > this.next) this.swap(T);
        const n = this.tails(T), tailNeed = n * 6;
        const want = Math.min(this.max + tailNeed, 4 + Math.floor((T - this.t0) * 0.4) + tailNeed);
        let tails = things.filter((o) => o.tail);
        while (tails.length < tailNeed) { const o = this.flame(T, true); o.k = Math.floor(tails.length / 6); o.j = tails.length % 6; if (petPos) { o.x = petPos.x + rnd(-200, 200) * K; o.y = petPos.y - rnd(80, 300) * K; } things.push(o); tails.push(o); }
        let free = things.filter((o) => !o.tail);
        while (tails.length + free.length < want) { const o = this.flame(T, false); things.push(o); free.push(o); }
        free.forEach((o, i) => {
          if (T > o.born + o.dur) {   // 熄了：過一下在別的地方亮起來
            o.born = T + rnd(0.3, 2); o.dur = rnd(4, 9); o.x = rnd(0.1, 0.9) * W; o.y = rnd(0.15, 0.85) * H; o.px = o.py = 0;
          }
          let [tx, ty] = this.slot(i, free.length, T, o);
          if (this.fx && this.fx.move === 'gather' && T - this.fx.at < 3 && petPos) { const a = i * 2.4 + T * 2; tx = petPos.x + Math.cos(a) * 90 * K; ty = petPos.y - 60 * K + Math.sin(a) * 60 * K; }   // 被狐仙聚過去
          const dx = o.x - mouse.x, dy = o.y - mouse.y, d = Math.hypot(dx, dy), R = 170 * K;
          if (d < R && d > 0.1) { const f = (1 - d / R) * 1100 * K; o.px += dx / d * f * dt; o.py += dy / d * f * dt; }   // 逗你：一靠近就溜
          o.px *= 1 - Math.min(1, dt * 2.5); o.py *= 1 - Math.min(1, dt * 2.5);
          const pull = this.fx && this.fx.move === 'gather' && T - this.fx.at < 3 ? 2.2 : 0.6;
          o.x += ((tx - o.x) * pull + o.px) * dt; o.y += ((ty - o.y) * pull + o.py + Math.sin(T * 2 + o.ph) * 6 * K) * dt;
        });
        for (const o of tails) {   // 飛向自己在尾巴上的位置
          const spin = this.fx && this.fx.move === 'spin' && T - this.fx.at < 3.5 ? (T - this.fx.at) * 1.8 : 0;   // 轉尾：整把尾巴繞著狐仙轉
          const [tx, ty] = this.tailSlot(o.k, n, o.j, T, spin), f = Math.min(1, dt * 5);
          o.x += (tx - o.x) * f; o.y += (ty - o.y) * f;
        }
      },
      draw(T) {
        for (const o of things) {
          const a = this.alpha(o, T); if (a <= 0.01) continue;
          ctx.save(); ctx.globalAlpha *= a;
          const glow = this.fx && this.fx.move === 'meditate' && T - this.fx.at < 5 ? 1.25 : 1;   // 打坐時尾巴更亮更大
          const r = (o.tail ? (20 - o.j * 2) * K : o.r) * (o.tail ? glow : 1);
          foxfire(o.x, o.y, r, T, o.ph);
          ctx.restore();
        }
      },
      hit(x, y, T) { return things.find((o) => this.alpha(o, T || now()) > 0.3 && near(o, x, y)) || null; },
      click(h, T) {
        burst(h.x, h.y, '#6FD3FF', true);

  window.saverReady = api.info().then((d) => {
    sp = SCENES[(d.outfit || {}).species] ? d.outfit.species : 'cat'; born = now();
    if (MODE_V) { S = BLANK; nextVillain = now() + 0.4; return; }
    SCENES[sp].init(born); S = SCENES[sp];
  })
    .catch((e) => { console.error(e); api.exit(); });   // 起不來就收掉，不要留一層空的透明視窗
  // 測試用：看現在演哪一套、戳一下那一套的招牌物件
  window.saverPeek = () => ({ scene: S && S.name, sp, n: things.length, leaving: !!leaveAt, hot });
  window.saverPoke = () => {
    const T = now();
    if (sp === 'cat') { S.click('bell', T); return S.rings.length; }
    if (sp === 'fox') { const f = S.form; S.click(things[0], T); return S.form !== f; }
    if (sp === 'rabbit') { const n = things.length; S.click('moon', T); return things.length - n; }
    if (sp === 'panda') { S.buns[0].at = 0; S.buns[0].y = H / 2; S.click(S.buns[0], T); return S.eaten; }
    if (sp === 'dragon') { S.click(S.clouds[0], T); return S.clouds[0].storm === T; }
  };
  // 預告片算圖用：自己一格一格畫（不跟著真實時間跑）
  window.saverManual = (species, pre) => { clock = 0; sp = species; things = []; bursts = []; leaveAt = 0; flash = -9; hot = false; mouse = { x: -9999, y: -9999 }; size(); SCENES[sp].init(-(pre || 12)); S = SCENES[sp]; born = -9; last = 0; };
  window.saverDraw = (T, mx, my) => { clock = T; if (mx != null) mouse = { x: mx, y: my }; frame(T * 1000); };
  window.saverSpot = () => { const T = clock || 0; if (sp === 'cat') return S.bell(); if (sp === 'fox') return things[0]; if (sp === 'rabbit') return S.moon(T); if (sp === 'panda') return S.buns.find((b) => T >= b.at && b.y < H - 80 && b.y > 120) || S.buns[0]; return S.clouds[0]; };
  window.saverPet = (x, y, dir) => { petPos = { x, y, dir }; };   // 測試／預告片：指定靈寵位置
  window.saverVillain = (bossId) => { villainStart(clock || now(), bossId); return !!villain; };
  window.saverClick = (x, y) => { const h = S.hit(x, y, clock || 0); if (h) S.click(h, clock || 0); return !!h; };
  requestAnimationFrame(frame);
})();
</script>
