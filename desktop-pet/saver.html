<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>螢幕保護</title>
<style>html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; } canvas { display: block; width: 100vw; height: 100vh; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 螢幕保護：不換畫面，只是在你的桌面上飄出東西來。透明、滑鼠穿透，桌面照常看得到。
// 每個角色飄的不一樣：靈貓螢火蟲、狐仙狐火、玉兔桂花、熊貓竹葉、小青龍水珠；另外都有幾盞天燈慢慢往上飄。
// 互動：游標靠近，它們會閃開；點到一個，它會炸成光點。你回來之後還會多飄一下子才慢慢散掉。
(function () {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const api = window.fx || { info: async () => ({ outfit: { species: location.hash.slice(1) || 'cat' } }), exit: () => console.log('exit'), clickable: () => {}, onLeave: () => {} };
  let W = 0, H = 0, K = 1, kind = 'firefly', things = [], bursts = [], mouse = { x: -9999, y: -9999 }, leaveAt = 0, born = performance.now() / 1000, hot = false;
  const LINGER = 14, FADE = 4;
  function size() { W = innerWidth; H = innerHeight; K = Math.max(0.7, Math.min(1.5, H / 1080)); cv.width = Math.round(W * devicePixelRatio); cv.height = Math.round(H * devicePixelRatio); }
  addEventListener('resize', size); size();
  const rnd = (a, b) => a + Math.random() * (b - a);
  const KIND = { cat: 'firefly', fox: 'foxfire', rabbit: 'petal', panda: 'leaf', dragon: 'orb' };
  // 每種東西怎麼動：vx、vy 是原本的漂移方向；wrap 是飄出螢幕後從哪邊回來
  const MOVE = {
    firefly: () => ({ vx: rnd(-14, 14), vy: rnd(-10, 10), r: rnd(5, 9) }),
    foxfire: () => ({ vx: rnd(-10, 10), vy: rnd(-16, -4), r: rnd(11, 18) }),
    petal: () => ({ vx: rnd(-18, 6), vy: rnd(22, 46), r: rnd(6, 10) }),
    leaf: () => ({ vx: rnd(-24, 10), vy: rnd(26, 52), r: rnd(12, 18) }),
    orb: () => ({ vx: rnd(-8, 8), vy: rnd(-26, -10), r: rnd(9, 20) }),
    lantern: () => ({ vx: rnd(-6, 6), vy: rnd(-20, -11), r: rnd(20, 26) }),
  };
  function make(k, anywhere) {
    const m = MOVE[k](), o = { k, ph: Math.random() * 6.28, spin: rnd(-1, 1), x: rnd(0, W), y: rnd(0, H), px: 0, py: 0, at: performance.now() / 1000, ...m };
    o.r *= K;
    if (!anywhere) { if (m.vy > 4) o.y = -30; else if (m.vy < -4) o.y = H + 30; else o.x = Math.random() < 0.5 ? -30 : W + 30; }
    return o;
  }
  function fill() {
    const n = Math.max(14, Math.min(46, Math.round(W * H / 52000)));
    things = Array.from({ length: n }, () => make(kind, true)).concat(Array.from({ length: 3 }, () => make('lantern', true)));
  }
  function spark(x, y, r, a, color) {
    ctx.save(); ctx.globalAlpha *= Math.max(0, Math.min(1, a)); ctx.fillStyle = color; ctx.translate(x, y); ctx.beginPath();
    for (let i = 0; i < 8; i++) { const an = i * Math.PI / 4, rr = i % 2 ? r * 0.32 : r; ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  const COLOR = { firefly: '#B8F5A0', foxfire: '#6FD3FF', petal: '#F5C95A', leaf: '#7CC878', orb: '#BFEFFF', lantern: '#FFB45C' };
  function draw(o, T) {
    const { x, y, r } = o;
    ctx.save(); ctx.translate(x, y);
    if (o.k === 'firefly') {
      const a = 0.45 + 0.5 * Math.sin(T * 2.2 + o.ph), g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 3.2);
      g.addColorStop(0, `rgba(214,255,170,${a})`); g.addColorStop(0.35, `rgba(150,240,160,${a * 0.45})`); g.addColorStop(1, 'rgba(150,240,160,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 3.2, 0, 6.283); ctx.fill();
      ctx.fillStyle = `rgba(255,255,220,${a})`; ctx.beginPath(); ctx.arc(0, 0, r * 0.38, 0, 6.283); ctx.fill();
    } else if (o.k === 'foxfire') {
      const s = r / 16 * (1 + Math.sin(T * 16 + o.ph) * 0.1);
      ctx.shadowColor = '#6FD3FF'; ctx.shadowBlur = 20; ctx.globalAlpha *= 0.9;
      ctx.fillStyle = '#4FB6FF'; ctx.beginPath(); ctx.moveTo(0, -26 * s); ctx.quadraticCurveTo(18 * s, -4 * s, 0, 14 * s); ctx.quadraticCurveTo(-18 * s, -4 * s, 0, -26 * s); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = '#E6FBFF'; ctx.beginPath(); ctx.moveTo(0, -10 * s); ctx.quadraticCurveTo(8 * s, 2 * s, 0, 10 * s); ctx.quadraticCurveTo(-8 * s, 2 * s, 0, -10 * s); ctx.fill();
    } else if (o.k === 'petal' || o.k === 'leaf') {
      ctx.rotate(T * (0.7 + o.spin * 0.6) + o.ph); ctx.globalAlpha *= 0.9;
      const l = r * (o.k === 'leaf' ? 2.2 : 1.6), w = l * (o.k === 'leaf' ? 0.26 : 0.42);
      ctx.fillStyle = o.k === 'leaf' ? '#7CC878' : '#F5C95A'; ctx.strokeStyle = o.k === 'leaf' ? '#3E7A45' : '#C9901A'; ctx.lineWidth = 1.4 * K;
      ctx.beginPath(); ctx.moveTo(-l / 2, 0); ctx.quadraticCurveTo(0, -w, l / 2, 0); ctx.quadraticCurveTo(0, w, -l / 2, 0); ctx.fill(); ctx.stroke();
      if (o.k === 'leaf') { ctx.beginPath(); ctx.moveTo(-l / 2, 0); ctx.lineTo(l / 2, 0); ctx.stroke(); }
    } else if (o.k === 'orb') {
      const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
      g.addColorStop(0, 'rgba(255,255,255,0.85)'); g.addColorStop(0.5, 'rgba(159,232,255,0.35)'); g.addColorStop(1, 'rgba(127,212,255,0.6)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(127,212,255,0.9)'; ctx.lineWidth = 1.5 * K; ctx.stroke();
    } else if (o.k === 'lantern') {   // 天燈
      const fl = 0.8 + 0.2 * Math.sin(T * 5 + o.ph), g = ctx.createRadialGradient(0, 0, 2, 0, 0, r * 3);
      ctx.rotate(Math.sin(T * 0.9 + o.ph) * 0.08);
      g.addColorStop(0, `rgba(255,190,90,${0.55 * fl})`); g.addColorStop(1, 'rgba(255,150,60,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 3, 0, 6.283); ctx.fill();
      ctx.fillStyle = `rgba(255,${Math.round(170 + 40 * fl)},110,0.95)`; ctx.strokeStyle = '#8A4A1E'; ctx.lineWidth = 2 * K;
      ctx.beginPath(); ctx.moveTo(-r * 0.62, -r); ctx.lineTo(r * 0.62, -r); ctx.quadraticCurveTo(r * 0.95, 0, r * 0.5, r); ctx.lineTo(-r * 0.5, r); ctx.quadraticCurveTo(-r * 0.95, 0, -r * 0.62, -r); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#FFF3C4'; ctx.beginPath(); ctx.ellipse(0, r * 0.75, r * 0.22, r * 0.3 * fl, 0, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }
  function pop(o, T) {
    bursts.push({ x: o.x, y: o.y, at: T, color: COLOR[o.k], big: o.k === 'lantern' });
    Object.assign(o, make(o.k, false), { at: T + rnd(1.5, 4) });   // 過一下子從螢幕邊再飄進來
  }
  const near = (o, x, y) => Math.hypot(o.x - x, o.y - y) < Math.max(26 * K, o.r * 1.8);

  let last = performance.now() / 1000;
  function frame(now) {
    requestAnimationFrame(frame);
    const T = now / 1000, dt = Math.min(0.05, T - last); last = T;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); ctx.clearRect(0, 0, W, H);
    let A = Math.min(1, (T - born) / 3);   // 慢慢飄出來
    if (leaveAt) { const left = leaveAt + LINGER - T; if (left <= 0) { leaveAt = 0; things = []; api.exit(); return; } A = Math.min(A, left / FADE); }
    for (const o of things) {
      if (T < o.at) continue;
      // 游標靠近就閃開
      const dx = o.x - mouse.x, dy = o.y - mouse.y, d = Math.hypot(dx, dy), R = 150 * K;
      if (d < R && d > 0.1) { const f = (1 - d / R) * 900 * K; o.px += dx / d * f * dt; o.py += dy / d * f * dt; }
      o.px *= 1 - Math.min(1, dt * 2.2); o.py *= 1 - Math.min(1, dt * 2.2);
      o.x += (o.vx * K + Math.sin(T * 0.7 + o.ph) * 16 * K + o.px) * dt; o.y += (o.vy * K + Math.cos(T * 0.6 + o.ph) * 8 * K + o.py) * dt;
      if (o.x < -60 || o.x > W + 60 || o.y < -60 || o.y > H + 60) Object.assign(o, make(o.k, false), { at: T });
      ctx.save(); ctx.globalAlpha = A * Math.min(1, (T - o.at) / 1.2); draw(o, T); ctx.restore();
    }
    bursts = bursts.filter((b) => T - b.at < 0.9);
    for (const b of bursts) { const p = (T - b.at) / 0.9, n = b.big ? 14 : 9; ctx.save(); ctx.globalAlpha = A; for (let i = 0; i < n; i++) { const a = i * 6.283 / n + b.at; spark(b.x + Math.cos(a) * p * (b.big ? 110 : 64) * K, b.y + Math.sin(a) * p * (b.big ? 110 : 64) * K, (b.big ? 9 : 6) * K * (1 - p * 0.5), 1 - p, i % 2 ? b.color : '#FFFFFF'); } ctx.restore(); }
    // 游標在某個東西上，才接住滑鼠（其餘地方點擊照樣穿透到桌面）
    const on = things.some((o) => T >= o.at && near(o, mouse.x, mouse.y));
    if (on !== hot) { hot = on; api.clickable(on); document.body.style.cursor = on ? 'pointer' : 'default'; }
  }
  addEventListener('mousemove', (e) => { mouse = { x: e.clientX, y: e.clientY }; });
  addEventListener('mouseleave', () => { mouse = { x: -9999, y: -9999 }; });
  addEventListener('mousedown', (e) => { const T = performance.now() / 1000; const o = things.find((t) => T >= t.at && near(t, e.clientX, e.clientY)); if (o) pop(o, T); });
  api.onLeave(() => { if (!leaveAt) leaveAt = performance.now() / 1000; });
  window.saverReady = api.info().then((d) => { kind = KIND[(d.outfit || {}).species] || 'firefly'; fill(); born = performance.now() / 1000; });
  window.saverPeek = () => ({ kind, n: things.length, leaving: !!leaveAt, hot });   // 測試用
  window.saverPop = () => { const T = performance.now() / 1000, o = things.find((t) => T >= t.at); if (o) pop(o, T); return bursts.length; };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
