<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>螢幕保護</title>
<style>html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; } canvas { display: block; width: 100vw; height: 100vh; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="draw.js"></script>
<script>
// 螢幕保護：不換畫面，只是在你的桌面上飄出東西來。透明、滑鼠穿透，桌面照常看得到。
// 五個角色各有一套（SCENES）：飄的東西、怎麼動、隔一陣子發生什麼、點了有什麼反應都不一樣。
//   靈貓「守山夜」    螢火蟲會被游標吸引；角落掛著師父的鈴鐺，隔一陣子響一聲；螢幕下緣走過一排貓掌印
//   狐仙「狐火燈會」  狐火排成陣（圓、兩列、散開）輪流變換；點到一團，全部「噗」一聲換陣
//   玉兔「月宮桂落」  月亮慢慢從左走到右；桂花落下，游標一攪就打轉；點月亮灑下一陣桂花
//   熊貓「竹林灶火」  兩側長出竹子、落竹葉；熱騰騰的包子冒著蒸氣往上飄，點了就吃掉
//   小青龍「雲海聽雨」幾朵雲飄過，雲下小雨、水珠上升；隔一陣子一條小龍游過；點雲會打雷下大雨
// 你回來之後還會多演十幾秒才慢慢散掉。只有游標正好在可點的東西上才接住滑鼠。
(function () {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const api = window.fx || { info: async () => ({ outfit: { species: location.hash.slice(1) || 'cat' } }), exit: () => console.log('exit'), clickable: () => {}, onLeave: () => {} };
  let W = 0, H = 0, K = 1, sp = 'cat', S = null, things = [], bursts = [], mouse = { x: -9999, y: -9999 }, leaveAt = 0, born = 0, hot = false, flash = -9;
  const LINGER = 14, FADE = 4, GOLD = '#F5B82E', LINE = '#4A3A2A';
  function size() { W = innerWidth; H = innerHeight; K = Math.max(0.7, Math.min(1.5, H / 1080)); cv.width = Math.round(W * devicePixelRatio); cv.height = Math.round(H * devicePixelRatio); }
  addEventListener('resize', size); size();
  let clock = null;   // 預告片算圖時由外面指定時間（saverDraw），平常是 null
  const rnd = (a, b) => a + Math.random() * (b - a), now = () => (clock == null ? performance.now() / 1000 : clock), clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const count = (per, lo, hi) => Math.max(lo, Math.min(hi, Math.round(W * H / per)));
  function spark(x, y, r, a, color) {
    ctx.save(); ctx.globalAlpha *= clamp(a); ctx.fillStyle = color; ctx.translate(x, y); ctx.beginPath();
    for (let i = 0; i < 8; i++) { const an = i * Math.PI / 4, rr = i % 2 ? r * 0.32 : r; ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function burst(x, y, color, big) { bursts.push({ x, y, at: now(), color, big }); }
  function cloudShape(x, y, s, color) {
    ctx.fillStyle = color; ctx.beginPath();
    ctx.arc(x - 60 * s, y + 6 * s, 34 * s, 0, 6.283); ctx.arc(x - 18 * s, y - 16 * s, 44 * s, 0, 6.283); ctx.arc(x + 38 * s, y - 6 * s, 38 * s, 0, 6.283); ctx.arc(x + 74 * s, y + 12 * s, 26 * s, 0, 6.283);
    ctx.rect(x - 86 * s, y + 6 * s, 180 * s, 34 * s); ctx.fill();
  }
  // 會飄的小東西：o = { x, y, vx, vy, r, ph, at }，離開螢幕就從邊上再進來
  function mk(vx, vy, r, extra) { return Object.assign({ x: rnd(0, W), y: rnd(0, H), vx, vy, r: r * K, ph: rnd(0, 6.28), spin: rnd(-1, 1), px: 0, py: 0, at: 0 }, extra); }
  function reenter(o, T) { if (o.vy > 4) { o.y = -30; o.x = rnd(0, W); } else if (o.vy < -4) { o.y = H + 30; o.x = rnd(0, W); } else { o.x = Math.random() < 0.5 ? -30 : W + 30; o.y = rnd(0, H); } o.px = o.py = 0; o.at = T; }
  // force > 0 閃開游標；< 0 被游標吸引；swirl 是繞著游標打轉。回傳 true 表示飄出螢幕了
  function drift(o, T, dt, force, swirl) {
    const dx = o.x - mouse.x, dy = o.y - mouse.y, d = Math.hypot(dx, dy), R = 190 * K;
    if (d < R && d > 0.1) {
      const f = (1 - d / R) * force * K;
      o.px += dx / d * f * dt; o.py += dy / d * f * dt;
      if (swirl) { o.px += -dy / d * swirl * (1 - d / R) * K * dt; o.py += dx / d * swirl * (1 - d / R) * K * dt; }
    }
    o.px *= 1 - Math.min(1, dt * 2); o.py *= 1 - Math.min(1, dt * 2);
    o.x += (o.vx * K + Math.sin(T * 0.7 + o.ph) * 16 * K + o.px) * dt; o.y += (o.vy * K + Math.cos(T * 0.6 + o.ph) * 8 * K + o.py) * dt;
    return o.x < -70 || o.x > W + 70 || o.y < -70 || o.y > H + 70;
  }
  const near = (o, x, y) => Math.hypot(o.x - x, o.y - y) < Math.max(26 * K, o.r * 1.8);

  function firefly(o, T, boost) {
    const a = clamp(0.45 + 0.5 * Math.sin(T * 2.2 + o.ph) + boost), r = o.r, g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, r * 3.2);
    g.addColorStop(0, `rgba(214,255,170,${a})`); g.addColorStop(0.35, `rgba(150,240,160,${a * 0.45})`); g.addColorStop(1, 'rgba(150,240,160,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(o.x, o.y, r * 3.2, 0, 6.283); ctx.fill();
    ctx.fillStyle = `rgba(255,255,220,${a})`; ctx.beginPath(); ctx.arc(o.x, o.y, r * 0.38, 0, 6.283); ctx.fill();
  }
  function foxfire(x, y, r, T, ph) {
    const s = r / 16 * (1 + Math.sin(T * 16 + ph) * 0.1);
    ctx.save(); ctx.translate(x, y); ctx.shadowColor = '#6FD3FF'; ctx.shadowBlur = 20; ctx.globalAlpha *= 0.92;
    ctx.fillStyle = '#4FB6FF'; ctx.beginPath(); ctx.moveTo(0, -26 * s); ctx.quadraticCurveTo(18 * s, -4 * s, 0, 14 * s); ctx.quadraticCurveTo(-18 * s, -4 * s, 0, -26 * s); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = '#E6FBFF'; ctx.beginPath(); ctx.moveTo(0, -10 * s); ctx.quadraticCurveTo(8 * s, 2 * s, 0, 10 * s); ctx.quadraticCurveTo(-8 * s, 2 * s, 0, -10 * s); ctx.fill(); ctx.restore();
  }
  function blade(o, T, leaf) {   // 花瓣或竹葉
    ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(T * (0.7 + o.spin * 0.6) + o.ph); ctx.globalAlpha *= 0.92;
    const l = o.r * (leaf ? 2.2 : 1.6), w = l * (leaf ? 0.26 : 0.42);
    ctx.fillStyle = leaf ? '#7CC878' : '#F5C95A'; ctx.strokeStyle = leaf ? '#3E7A45' : '#C9901A'; ctx.lineWidth = 1.4 * K;
    ctx.beginPath(); ctx.moveTo(-l / 2, 0); ctx.quadraticCurveTo(0, -w, l / 2, 0); ctx.quadraticCurveTo(0, w, -l / 2, 0); ctx.fill(); ctx.stroke();
    if (leaf) { ctx.beginPath(); ctx.moveTo(-l / 2, 0); ctx.lineTo(l / 2, 0); ctx.stroke(); }
    ctx.restore();
  }
  function orb(o) {
    const g = ctx.createRadialGradient(o.x - o.r * 0.3, o.y - o.r * 0.3, o.r * 0.1, o.x, o.y, o.r);
    g.addColorStop(0, 'rgba(255,255,255,0.85)'); g.addColorStop(0.5, 'rgba(159,232,255,0.35)'); g.addColorStop(1, 'rgba(127,212,255,0.6)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 6.283); ctx.fill(); ctx.strokeStyle = 'rgba(127,212,255,0.9)'; ctx.lineWidth = 1.5 * K; ctx.stroke();
  }

  const SCENES = {
    // ── 靈貓「守山夜」──
    cat: {
      name: '守山夜',
      init(T) { things = Array.from({ length: count(70000, 12, 34) }, () => mk(rnd(-14, 14), rnd(-10, 10), rnd(5, 9))); this.ring = T + 5; this.rings = []; this.paws = T + 4; this.bright = -9; },
      bell() { return { x: W - 130 * K, y: 96 * K, r: 22 * K }; },
      ringBell(T) { this.rings.push(T); this.ring = T + rnd(10, 16); this.bright = T; },
      step(T, dt) {
        if (T > this.ring) this.ringBell(T);
        this.rings = this.rings.filter((t) => T - t < 3);
        if (T > this.paws + 24) this.paws = T;
        for (const o of things) if (drift(o, T, dt, -260, 140)) reenter(o, T);   // 螢火蟲會湊過來繞著游標
      },
      draw(T) {
        const b = this.bell(), dtb = T - this.bright, sw = Math.sin(T * 1.3) * 0.12 + (dtb < 1.2 ? Math.sin(dtb * 26) * 0.35 * (1 - dtb / 1.2) : 0);
        for (const t of this.rings) for (let i = 0; i < 3; i++) { const p = (T - t - i * 0.3) / 2.2; if (p > 0 && p < 1) { ctx.save(); ctx.globalAlpha *= (1 - p) * 0.75; ctx.strokeStyle = GOLD; ctx.lineWidth = (4 - p * 3) * K; ctx.beginPath(); ctx.arc(b.x, b.y, 26 * K + p * 300 * K, 0, 6.283); ctx.stroke(); ctx.restore(); } }
        ctx.save(); ctx.translate(b.x, 0); ctx.rotate(sw); ctx.strokeStyle = '#C0392B'; ctx.lineWidth = 3 * K; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, b.y - 20 * K); ctx.stroke();
        ctx.translate(0, b.y); ctx.lineWidth = 2.4 * K; ctx.fillStyle = GOLD; ctx.strokeStyle = LINE; ctx.shadowColor = GOLD; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-b.r * 0.8, 0); ctx.lineTo(b.r * 0.8, 0); ctx.moveTo(0, 0); ctx.lineTo(0, b.r * 0.8); ctx.stroke();
        ctx.fillStyle = '#FFF6D0'; ctx.beginPath(); ctx.arc(-b.r * 0.35, -b.r * 0.4, b.r * 0.18, 0, 6.283); ctx.fill(); ctx.restore();
        // 貓掌印：從左走到右，一步一步印上去再淡掉
        const n = Math.floor(W / (86 * K));
        for (let i = 0; i < n; i++) {
          const age = T - this.paws - i * 0.42; if (age < 0 || age > 7) continue;
          ctx.save(); ctx.globalAlpha *= clamp(age * 4) * clamp((7 - age) / 3) * 0.6; ctx.fillStyle = '#6B5A44'; ctx.translate(40 * K + i * 86 * K, H - (i % 2 ? 46 : 78) * K); ctx.rotate(0.25);
          ctx.beginPath(); ctx.ellipse(0, 4 * K, 11 * K, 9 * K, 0, 0, 6.283); ctx.fill();
          for (const [dx, dy] of [[-11, -8], [-4, -14], [4, -14], [11, -8]]) { ctx.beginPath(); ctx.ellipse(dx * K, dy * K, 4 * K, 5 * K, 0, 0, 6.283); ctx.fill(); }
          ctx.restore();
        }
        const boost = clamp(1 - dtb / 2) * 0.6;
        for (const o of things) if (T >= o.at) firefly(o, T, boost);
      },
      hit(x, y) { const b = this.bell(); if (Math.hypot(x - b.x, y - b.y) < b.r * 1.6) return 'bell'; return things.find((o) => near(o, x, y)) || null; },
      click(h, T) { if (h === 'bell') { this.ringBell(T); burst(this.bell().x, this.bell().y, GOLD, true); } else { burst(h.x, h.y, '#B8F5A0'); reenter(h, T + rnd(1.5, 4)); } },
    },
    // ── 狐仙「狐火燈會」──
    fox: {
      name: '狐火燈會',
      init(T) { things = Array.from({ length: count(90000, 10, 22) }, () => mk(0, 0, rnd(12, 18))); this.form = 0; this.next = T + 16; things.forEach((o, i) => { const [x, y] = this.slot(i, T); o.x = x; o.y = y; }); },
      // 陣形：0 一個慢慢轉的大圓；1 左右兩列；2 散開各自飄
      slot(i, T) {
        const n = things.length;
        if (this.form === 0) { const a = i * 6.283 / n + T * 0.12; return [W / 2 + Math.cos(a) * W * 0.36, H / 2 + Math.sin(a) * H * 0.33]; }
        if (this.form === 1) { const half = Math.ceil(n / 2), j = i % half, side = i < half ? 0.1 : 0.9; return [W * side + Math.sin(T * 0.8 + i) * 14 * K, H * (0.12 + 0.76 * (j + 0.5) / half)]; }
        const o = things[i]; return [W * (0.5 + 0.44 * Math.sin(o.ph * 3 + T * 0.09)), H * (0.5 + 0.4 * Math.sin(o.ph * 5 + T * 0.07))];
      },
      swap(T) { this.form = (this.form + 1) % 3; this.next = T + 16; for (const o of things) burst(o.x, o.y, '#FFFFFF'); },
      step(T, dt) {
        if (T > this.next) this.swap(T);
        things.forEach((o, i) => {
          const [tx, ty] = this.slot(i, T), dx = o.x - mouse.x, dy = o.y - mouse.y, d = Math.hypot(dx, dy), R = 170 * K;
          if (d < R && d > 0.1) { const f = (1 - d / R) * 1100 * K; o.px += dx / d * f * dt; o.py += dy / d * f * dt; }   // 逗你：一靠近就溜
          o.px *= 1 - Math.min(1, dt * 2.5); o.py *= 1 - Math.min(1, dt * 2.5);
          o.x += ((tx - o.x) * 1.4 + o.px) * dt; o.y += ((ty - o.y) * 1.4 + o.py + Math.sin(T * 2 + o.ph) * 6 * K) * dt;
        });
      },
      draw(T) { for (const o of things) foxfire(o.x, o.y, o.r, T, o.ph); },
      hit(x, y) { return things.find((o) => near(o, x, y)) || null; },
      click(h, T) { burst(h.x, h.y, '#6FD3FF', true); this.swap(T); },   // 幻術：點到一團，全部換陣
    },
    // ── 玉兔「月宮桂落」──
    rabbit: {
      name: '月宮桂落',
      init(T) { things = Array.from({ length: count(60000, 14, 40) }, () => mk(rnd(-18, 6), rnd(22, 46), rnd(6, 10))); this.t0 = T; this.shower = -9; },
      moon(T) { const p = ((T - this.t0) / 120 + 0.25) % 1; return { x: W * (0.08 + 0.84 * p), y: H * 0.2 - Math.sin(p * Math.PI) * H * 0.1, r: 44 * K }; },
      step(T, dt) {
        things = things.filter((o) => !o.ttl || T < o.ttl);   // 點月亮灑下來的那一陣，落完就沒了
        for (const o of things) if (drift(o, T, dt, 120, 900) && !o.ttl) reenter(o, T);   // 游標一攪，桂花繞著打轉
      },
      draw(T) {
        const m = this.moon(T), glow = 1 + clamp(1 - (T - this.shower) / 1.5) * 0.6;
        const g = ctx.createRadialGradient(m.x, m.y, m.r * 0.8, m.x, m.y, m.r * 3 * glow); g.addColorStop(0, 'rgba(255,244,196,0.38)'); g.addColorStop(1, 'rgba(255,244,196,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 3 * glow, 0, 6.283); ctx.fill();
        ctx.save(); ctx.globalAlpha *= 0.94; ctx.fillStyle = '#FFF4C4'; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
        // 月亮上搗藥的小兔子剪影
        ctx.fillStyle = 'rgba(190,165,115,0.75)'; ctx.beginPath(); ctx.ellipse(m.x - m.r * 0.05, m.y + m.r * 0.22, m.r * 0.26, m.r * 0.2, 0, 0, 6.283); ctx.fill();
        ctx.beginPath(); ctx.ellipse(m.x + m.r * 0.18, m.y - m.r * 0.02, m.r * 0.15, m.r * 0.13, 0, 0, 6.283); ctx.fill();
        ctx.beginPath(); ctx.ellipse(m.x + m.r * 0.13, m.y - m.r * 0.26, m.r * 0.045, m.r * 0.16, -0.2, 0, 6.283); ctx.fill();
        ctx.beginPath(); ctx.ellipse(m.x + m.r * 0.25, m.y - m.r * 0.25, m.r * 0.045, m.r * 0.16, 0.2, 0, 6.283); ctx.fill();
        ctx.restore();
        for (const o of things) if (T >= o.at) blade(o, T, false);
      },
      hit(x, y, T) { const m = this.moon(T); if (Math.hypot(x - m.x, y - m.y) < m.r * 1.15) return 'moon'; return things.find((o) => near(o, x, y)) || null; },
      click(h, T) {
        if (h === 'moon') { const m = this.moon(T); this.shower = T; burst(m.x, m.y, '#FFF4C4', true); for (let i = 0; i < 26 && things.length < 110; i++) things.push(mk(rnd(-70, 70), rnd(40, 110), rnd(6, 10), { x: m.x + rnd(-m.r, m.r), y: m.y + rnd(-m.r * 0.4, m.r), ttl: T + 14 })); }
        else if (h.ttl) { burst(h.x, h.y, '#F5C95A'); h.ttl = T; }
        else { burst(h.x, h.y, '#F5C95A'); reenter(h, T + rnd(1, 3)); }
      },
    },
    // ── 熊貓「竹林灶火」──
    panda: {
      name: '竹林灶火',
      init(T) {
        this.t0 = T; this.stalks = []; this.eaten = 0;
        for (const side of [0, 1]) for (let i = 0; i < 3; i++) this.stalks.push({ x: side ? W - (50 + i * 62) * K : (50 + i * 62) * K, h: H * rnd(0.34, 0.62), lean: (side ? -1 : 1) * rnd(0.03, 0.09), ph: rnd(0, 6), shake: -9 });
        things = Array.from({ length: count(80000, 10, 28) }, () => mk(rnd(-22, 22), rnd(26, 52), rnd(12, 18)));
        this.buns = Array.from({ length: 3 }, (_, i) => this.bun(T + i * 4));
      },
      top(s, T) { const g = clamp((T - this.t0) / 14), ds = T - s.shake, a = s.lean + Math.sin(T * 0.8 + s.ph) * 0.02 + (ds < 1.2 ? Math.sin(ds * 22) * 0.05 * (1 - ds / 1.2) : 0); return { x: s.x + Math.sin(a) * s.h * g, y: H - Math.cos(a) * s.h * g, a, g }; },
      fromTop(o, T) { const t = this.top(this.stalks[Math.floor(Math.random() * this.stalks.length)], T); o.x = t.x + rnd(-30, 30) * K; o.y = t.y + rnd(-10, 30) * K; o.px = o.py = 0; },   // 新的一片從竹梢掉下來
      bun(at) { return { x: rnd(W * 0.25, W * 0.75), y: H + 40, r: 24 * K, vy: rnd(-30, -20), ph: rnd(0, 6), at }; },
      step(T, dt) {
        for (const o of things) if (drift(o, T, dt, 500, 0)) { this.fromTop(o, T); o.at = T; }
        for (const s of this.stalks) if (Math.abs(mouse.x - s.x) < 46 * K && mouse.y > H - s.h && T - s.shake > 1.2) s.shake = T;   // 游標掃過，竹子搖一搖
        this.buns.forEach((b, i) => { if (T < b.at) return; b.y += b.vy * K * dt; b.x += Math.sin(T * 0.6 + b.ph) * 10 * K * dt; if (b.y < -60) this.buns[i] = this.bun(T + rnd(2, 6)); });
      },
      draw(T) {
        for (const s of this.stalks) {
          const t = this.top(s, T); if (t.g <= 0.02) continue;
          ctx.save(); ctx.translate(s.x, H); ctx.rotate(t.a); const h = s.h * t.g;
          ctx.lineCap = 'round'; ctx.strokeStyle = '#3E7A45'; ctx.lineWidth = 15 * K; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -h); ctx.stroke();
          ctx.strokeStyle = '#8FD18A'; ctx.lineWidth = 10.5 * K; ctx.stroke();
          ctx.strokeStyle = '#3E7A45'; ctx.lineWidth = 2.2 * K; for (let y = 70 * K; y < h; y += 78 * K) { ctx.beginPath(); ctx.moveTo(-7 * K, -y); ctx.lineTo(7 * K, -y); ctx.stroke(); }
          for (const [dy, a, l] of [[0, -0.6, 44], [4, 0.8, 48], [40, 1.1, 38], [78, -1.1, 34]]) { if (dy * K > h) continue; ctx.save(); ctx.translate(0, -h + dy * K); ctx.rotate(a + Math.sin(T * 1.6 + s.ph + dy) * 0.08); ctx.fillStyle = '#7CC878'; ctx.strokeStyle = '#3E7A45'; ctx.lineWidth = 1.8 * K; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(l * K * 0.5, -10 * K, l * K, 0); ctx.quadraticCurveTo(l * K * 0.5, 10 * K, 0, 0); ctx.fill(); ctx.stroke(); ctx.restore(); }
          ctx.restore();
        }
        for (const o of things) if (T >= o.at) blade(o, T, true);
        for (const b of this.buns) {
          if (T < b.at) continue;
          for (let i = 0; i < 3; i++) { const p = (T * 0.6 + i / 3 + b.ph) % 1, sx = b.x + (i - 1) * 12 * K; ctx.save(); ctx.globalAlpha *= (1 - p) * 0.7; ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3 * K; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(sx, b.y - b.r - p * 30 * K); ctx.quadraticCurveTo(sx + 8 * K, b.y - b.r - 12 * K - p * 30 * K, sx, b.y - b.r - 24 * K - p * 30 * K); ctx.stroke(); ctx.restore(); }
          ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.sin(T + b.ph) * 0.08); ctx.fillStyle = '#FFFDF4'; ctx.strokeStyle = LINE; ctx.lineWidth = 2.4 * K;
          ctx.beginPath(); ctx.moveTo(-b.r, b.r * 0.5); ctx.quadraticCurveTo(-b.r * 1.1, -b.r * 0.9, 0, -b.r); ctx.quadraticCurveTo(b.r * 1.1, -b.r * 0.9, b.r, b.r * 0.5); ctx.quadraticCurveTo(0, b.r * 0.85, -b.r, b.r * 0.5); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.lineWidth = 1.6 * K; for (const a of [-0.5, 0, 0.5]) { ctx.beginPath(); ctx.moveTo(0, -b.r * 0.96); ctx.quadraticCurveTo(Math.sin(a) * b.r * 0.5, -b.r * 0.6, Math.sin(a) * b.r * 0.7, -b.r * 0.2); ctx.stroke(); }
          ctx.restore();
        }
      },
      hit(x, y, T) { const b = this.buns.find((q) => T >= q.at && Math.hypot(x - q.x, y - q.y) < q.r * 1.2); if (b) return b; return things.find((o) => near(o, x, y)) || null; },
      click(h, T) {
        const i = this.buns.indexOf(h);
        if (i >= 0) { burst(h.x, h.y, '#FFFFFF', true); this.eaten += 1; this.buns[i] = this.bun(T + rnd(2, 5)); }   // 吃掉一顆包子
        else { burst(h.x, h.y, '#7CC878'); this.fromTop(h, T); h.at = T + rnd(1, 3); }
      },
    },
    // ── 小青龍「雲海聽雨」──
    dragon: {
      name: '雲海聽雨',
      init(T) {
        const nc = Math.max(3, Math.round(W / (460 * K)));
        this.clouds = Array.from({ length: nc }, (_, i) => ({ x: (i + 0.5) * W / nc, y: (60 + (i % 3) * 36) * K, s: (1.1 + (i % 2) * 0.35) * K, v: rnd(10, 22), storm: -9 }));
        things = Array.from({ length: count(110000, 8, 22) }, () => mk(rnd(-8, 8), rnd(-26, -10), rnd(9, 20)));
        this.swim = T + 5;
      },
      step(T, dt) {
        for (const c of this.clouds) { c.x += c.v * K * dt; if (c.x > W + 140 * c.s) c.x = -140 * c.s; }
        for (const o of things) if (drift(o, T, dt, 700, 0)) reenter(o, T);
        if (T > this.swim + 11) this.swim = T + rnd(8, 16);
      },
      draw(T) {
        // 雲下面的雨（平常疏疏的，打雷後一陣大雨）
        for (const c of this.clouds) {
          const heavy = clamp(1 - (T - c.storm) / 5), n = Math.round(9 + heavy * 26), fall = (300 + heavy * 420) * K, base = ctx.globalAlpha;
          ctx.save(); ctx.strokeStyle = '#8FDCFF'; ctx.lineCap = 'round';
          for (let i = 0; i < n; i++) { const p = (T * (1.1 + (i % 5) * 0.14) + i * 0.37) % 1, x = c.x + ((i * 53) % 170 - 85) * c.s, y = c.y + 34 * c.s + p * fall; ctx.globalAlpha = base * (1 - p) * (0.55 + heavy * 0.35); ctx.lineWidth = (1.8 + heavy) * K; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 4 * K, y + 18 * K); ctx.stroke(); }
          ctx.restore();
          const bolt = T - c.storm;
          if (bolt >= 0 && bolt < 0.35) { ctx.save(); ctx.strokeStyle = '#FFFFFF'; ctx.shadowColor = '#B48CFF'; ctx.shadowBlur = 24; ctx.lineWidth = 4 * K; ctx.beginPath(); let x = c.x, y = c.y + 30 * c.s; ctx.moveTo(x, y); for (let i = 0; i < 7; i++) { x += Math.sin(c.storm * 7 + i * 2.3) * 44 * K; y += 46 * K; ctx.lineTo(x, y); } ctx.stroke(); ctx.restore(); }
          ctx.save(); ctx.globalAlpha *= 0.9; cloudShape(c.x, c.y, c.s, heavy > 0.05 ? '#7E8CA3' : '#C9D6E2'); ctx.restore();
        }
        for (const o of things) if (T >= o.at) orb(o);
        // 小龍游過去
        const p = (T - this.swim) / 9;
        if (p >= 0 && p <= 1.35) {
          const pts = [];
          for (let i = 0; i < 48; i++) { const q = p - i * 0.0062; pts.push([-120 * K + q * (W + 240 * K), H * 0.42 + Math.sin(q * 11) * 80 * K]); }
          window.drawLoong(ctx, pts, 1.05 * K, T, { sg: 1 });
        }
      },
      hit(x, y) { const c = this.clouds.find((q) => Math.abs(x - q.x) < 100 * q.s && Math.abs(y - q.y) < 46 * q.s); if (c) return c; return things.find((o) => near(o, x, y)) || null; },
      click(h, T) { if (this.clouds.includes(h)) { h.storm = T; flash = T; } else { burst(h.x, h.y, '#BFEFFF'); reenter(h, T + rnd(1.5, 4)); } },   // 點雲：打雷、下一陣大雨
    },
  };

  let last = now();
  function frame(t) {
    if (clock == null) requestAnimationFrame(frame);
    const T = t / 1000, dt = Math.min(0.05, T - last); last = T;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); ctx.clearRect(0, 0, W, H);
    if (!S) return;
    let A = Math.min(1, (T - born) / 3);   // 慢慢飄出來
    if (leaveAt) { const left = leaveAt + LINGER - T; if (left <= 0) { leaveAt = 0; S = null; api.exit(); return; } A = Math.min(A, left / FADE); }
    S.step(T, dt);
    ctx.save(); ctx.globalAlpha = A; ctx.lineJoin = 'round';
    S.draw(T);
    bursts = bursts.filter((b) => T - b.at < 0.9);
    for (const b of bursts) { const p = (T - b.at) / 0.9, n = b.big ? 14 : 9; for (let i = 0; i < n; i++) { const a = i * 6.283 / n + b.at; spark(b.x + Math.cos(a) * p * (b.big ? 110 : 64) * K, b.y + Math.sin(a) * p * (b.big ? 110 : 64) * K, (b.big ? 9 : 6) * K * (1 - p * 0.5), 1 - p, i % 2 ? b.color : '#FFFFFF'); } }
    if (T - flash < 0.18) { ctx.globalAlpha = A * 0.22 * (1 - (T - flash) / 0.18); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H); }
    ctx.restore();
    // 游標在可點的東西上，才接住滑鼠（其餘地方點擊照樣穿透到桌面）
    const on = !!S.hit(mouse.x, mouse.y, T);
    if (on !== hot) { hot = on; api.clickable(on); document.body.style.cursor = on ? 'pointer' : 'default'; }
  }
  addEventListener('mousemove', (e) => { mouse = { x: e.clientX, y: e.clientY }; });
  addEventListener('mouseleave', () => { mouse = { x: -9999, y: -9999 }; });
  addEventListener('mousedown', (e) => { if (!S) return; const T = now(), h = S.hit(e.clientX, e.clientY, T); if (h) S.click(h, T); });
  api.onLeave(() => { if (!leaveAt) leaveAt = now(); });
  window.saverReady = api.info().then((d) => { sp = SCENES[(d.outfit || {}).species] ? d.outfit.species : 'cat'; born = now(); SCENES[sp].init(born); S = SCENES[sp]; })
    .catch((e) => { console.error(e); api.exit(); });   // 起不來就收掉，不要留一層空的透明視窗
  // 測試用：看現在演哪一套、戳一下那一套的招牌物件
  window.saverPeek = () => ({ scene: S && S.name, sp, n: things.length, leaving: !!leaveAt, hot });
  window.saverPoke = () => {
    const T = now();
    if (sp === 'cat') { S.click('bell', T); return S.rings.length; }
    if (sp === 'fox') { const f = S.form; S.click(things[0], T); return S.form !== f; }
    if (sp === 'rabbit') { const n = things.length; S.click('moon', T); return things.length - n; }
    if (sp === 'panda') { S.buns[0].at = 0; S.buns[0].y = H / 2; S.click(S.buns[0], T); return S.eaten; }
    if (sp === 'dragon') { S.click(S.clouds[0], T); return S.clouds[0].storm === T; }
  };
  // 預告片算圖用：自己一格一格畫（不跟著真實時間跑）
  window.saverManual = (species, pre) => { clock = 0; sp = species; things = []; bursts = []; leaveAt = 0; flash = -9; hot = false; mouse = { x: -9999, y: -9999 }; size(); SCENES[sp].init(-(pre || 12)); S = SCENES[sp]; born = -9; last = 0; };
  window.saverDraw = (T, mx, my) => { clock = T; if (mx != null) mouse = { x: mx, y: my }; frame(T * 1000); };
  window.saverSpot = () => { const T = clock || 0; if (sp === 'cat') return S.bell(); if (sp === 'fox') return things[0]; if (sp === 'rabbit') return S.moon(T); if (sp === 'panda') return S.buns.find((b) => T >= b.at && b.y < H - 80 && b.y > 120) || S.buns[0]; return S.clouds[0]; };
  window.saverClick = (x, y) => { const h = S.hit(x, y, clock || 0); if (h) S.click(h, clock || 0); return !!h; };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
